title: Contribute to Microsoft Learn documentation in your browser
summary: Become a contributor to Microsoft Learn documentation by making edits with a web editor in GitHub. Make your changes, then create, validate, and submit pull requests to get your changes published.
abstract: |
  By the end of this module, you'll be able to:
  - Define your impact as a contributor to Microsoft Learn documentation.
  - Edit Microsoft Learn documentation using a web editor in GitHub.
prerequisites: |
  - Familiarity with Microsoft Learn documentation at the beginner level
  - Awareness of contributions to open-source projects at the beginner level
