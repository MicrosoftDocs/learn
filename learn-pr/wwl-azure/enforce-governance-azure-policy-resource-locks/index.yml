title: Enforce governance with Azure Policy and resource locks
summary: Assess and enforce security standards using Azure Policy. Assign built-in definitions and initiatives, author custom policies, manage remediation and recovery, review exemptions, and protect critical resources using management locks.
abstract: |
  After completing this module, you can:
    - Assign built-in Azure Policy definitions and initiatives to enforce security configurations at subscription and management group scope
    - Select parameterized built-ins or create custom definitions with remediation tasks when additional logic is required
    - Plan remediation recovery and test-configuration cleanup
    - Grant scoped policy exemptions with appropriate permissions and approval, and review their compliance substates
    - Configure management locks and explain their control-plane scope and operational limitations
prerequisites: |
  Before starting this module, you should have:

  - Working knowledge of Azure administration at the AZ-104 level
  - Basic understanding of Azure resource hierarchy (management groups, subscriptions, resource groups, resources)
  - Familiarity with Azure role-based access control (RBAC) concepts
  - To perform the optional walkthroughs, access to an isolated test scope and permissions to create policy definitions and assignments
  - To grant remediation access or manage locks, the corresponding role-assignment or lock-management permissions
  - To use an existing user-assigned managed identity, permission to read and assign that identity
