title: Modernize and examine SAP S/4HANA on Azure Virtual Machines
summary: Examine the Microsoft Azure architecture, and components used, when deploying SAP S/4HANA workloads and in-memory SAP HANA databases, running on Azure Virtual Machines infrastructure.
abstract: |
  After completing this module, you will be able to:
  - Explore SAP S/4HANA on Azure virtual machines and learn to recognize the architecture's components.
  - Examine a sample functional workflow.
prerequisites: |
  Before taking this training, you should complete:
  *   Azure Administrator (AZ-104) or Azure Solutions Architect Expert (AZ-305) exam.
  *   SAP HANA or NetWeaver training.
