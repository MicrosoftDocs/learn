title: Create and configure host pools and session hosts for Azure Virtual Desktop
summary: See how to configure the assignment type of a personal desktop host pool to adjust your Azure Virtual Desktop environment to better suit your needs.
abstract: |
  After completing this module, you'll be able to:

  -   Configure host pool assignment type.

  -   Automate creation of an Azure Virtual Desktop host pool using PowerShell.

  -   Customize Remote Desktop Protocol (RDP) properties for a host pool.

  -   Manage licensing for session hosts that run Windows client.
