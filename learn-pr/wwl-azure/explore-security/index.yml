title: Explore security
summary: Surveys computer security and how people and computers are identified on computer networks. It surveys historical and modern security features.
abstract: |
  After completing this module, you'll be able to:

  -   Analyze the need for computer security

  -   Summarize how modern computers verify identity

  -   Describe how biometrics work

  -   Explain how hackers try to disrupt security
prerequisites: Basic knowledge of programming terminology.
