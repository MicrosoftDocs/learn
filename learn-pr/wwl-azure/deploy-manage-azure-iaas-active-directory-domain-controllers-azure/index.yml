  title: Deploy and manage Azure IaaS Active Directory domain controllers in Azure
  description: "Learn how to extend your on-premises Active Directory environment into Azure, including deploying replica domain controllers on Azure VMs, creating new AD DS forests in Azure, and configuring VPN or ExpressRoute connectivity, AD DS sites, trust relationships, and FSMO role placement."
