title: Transition your business to Azure
summary: This module introduces various decisions that business decision makers can anticipate when considering a transition to Azure.
abstract: |
  After completing this module, you will be able to:

  -   Identify and categorize your business’s motivations for transitioning to the cloud.

  -   Describe the major categories of Azure services and what each enables a business to do.

  -   Describe public, private, and hybrid cloud arrangements, and the reasons for adopting each.

  -   Look ahead to the technical and organizational considerations you will encounter when planning a cloud transition.
