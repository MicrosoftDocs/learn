title: Module assessment
metadata:
  title: Module Assessment
  description: "Module assessment"
  ms.date: 11/18/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  module_assessment: true
azureSandbox: false
durationInMinutes: 3
quiz:
  questions:
  - content: "Which statement correctly describes the identities used to deliver a private Machine Configuration package through Azure Policy?"
    choices:
    - content: "The policy-assignment identity replaces the VM identity for every guest operation."
      isCorrect: false
      explanation: "Incorrect. The VM still needs its own system-assigned identity to authenticate to Machine Configuration and read a private package when identity-based access is configured."
    - content: "The VM identity authenticates the guest and reads its authorized package, while the policy-assignment identity performs authorized Azure deployments."
      isCorrect: true
      explanation: "Correct. Guest authentication and private-blob access are separate from the deployment permissions used by Azure Policy remediation."
    - content: "A storage account key is always required, even when the VM has an authorized managed identity."
      isCorrect: false
      explanation: "Incorrect. A correctly configured VM managed identity with blob-read permission can download a private package without a storage account key."
  - content: "Which Machine Configuration guest assignment type reports configuration state without changing the machine?"
    choices:
    - content: "Audit."
      isCorrect: true
      explanation: "Correct. Audit reports compliance without applying configuration changes."
    - content: "ApplyAndMonitor."
      isCorrect: false
      explanation: "Incorrect. ApplyAndMonitor applies configuration and then reports subsequent drift without automatically correcting it."
    - content: "ApplyAndAutoCorrect."
      isCorrect: false
      explanation: "Incorrect. ApplyAndAutoCorrect applies configuration and corrects subsequent drift during guest evaluation."
  - content: "After initial deployment of a compatible set-capable package, which guest assignment type corrects subsequent drift without a new policy remediation task for each occurrence?"
    choices:
    - content: "Audit."
      isCorrect: false
      explanation: "Incorrect. Audit reports configuration state and doesn't make changes."
    - content: "ApplyAndMonitor."
      isCorrect: false
      explanation: "Incorrect. ApplyAndMonitor reports subsequent drift, but another remediation action is required to correct it."
    - content: "ApplyAndAutoCorrect."
      isCorrect: true
      explanation: "Correct. After the initial deployment, the guest agent corrects drift during subsequent evaluation without a new policy remediation task for each occurrence."