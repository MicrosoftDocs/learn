uid: learn.wwl.administer-manage-windows-server-iaas-vm-remotely
metadata:
  title: Administer and manage Windows Server IaaS Virtual Machine remotely
  description: "Learn how to remotely administer Windows Server IaaS VMs in Azure using the Azure portal, Windows Admin Center, Azure PowerShell, Azure CLI, Azure Bastion for secure RDP/SSH, and Just-In-Time (JIT) VM access."
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: windows-server
title: Administer and manage Windows Server IaaS Virtual Machine remotely
summary: |
  This module covers how to remotely administer and manage Windows Server IaaS VMs in Azure. You learn how to select the appropriate remote administration tool from the Azure portal, Windows Admin Center, Azure PowerShell, Azure CLI, and Azure Cloud Shell, connect to Azure VMs securely using Azure Bastion without exposing public IP addresses, and configure Just-In-Time (JIT) VM access through Microsoft Defender for Cloud to lock down inbound management ports and reduce attack surface.
abstract: |
  After completing this module, you'll be able to:
  - Select appropriate remote administration tools.
  - Secure management connections to Azure IaaS VMs running Windows Server with Azure Bastion.
  - Configure JIT VM access.
prerequisites: |
  In order to get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server workloads in on-premises scenarios
  - Common Windows Server management tools
  - Core Microsoft compute, storage, networking, and virtualization technologies
  - On-premises resiliency Windows Server-based compute and storage technologies
  - Implementing and managing IaaS services in Azure
  - Microsoft Entra ID
  - Security-related technologies (firewalls, encryption, multifactor authentication)
  - Windows PowerShell scripting
  - Automation and monitoring
