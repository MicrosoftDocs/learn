abstract: |
  In this module, you learn to:
  - Connect OpenTelemetry instrumentation and Azure workload signals to GitHub and Azure DevOps delivery records.
  - Design outcome-focused dashboards, actionable alerts and delivery/agent-effectiveness measures.
  - Verify natural-language analysis and AI-generated KQL against actual schemas and evidence quality.
  - Distinguish Azure Copilot Observability Agent investigation, preview autonomous operations and authorized remediation.
  - Maintain grounded operational knowledge, bounded feedback and repeatable agent evaluations.
prerequisites: |
  - Experience using GitHub or Azure DevOps for delivery.
  - Familiarity with application logs, metrics, traces and monitoring.
  - Familiarity with deployment health, incident investigation and recovery.
  - Experience using GitHub Copilot and reviewing AI-generated proposals.
