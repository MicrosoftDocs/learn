title: Introduction to GitHub Actions
summary: Learn GitHub Actions fundamentals including workflows, events, jobs, and runners. Discover how to automate your development processes and read console output from actions.
abstract: |
  By the end of this module, you'll be able to:

  -   Understand GitHub Actions and workflows

  -   Create and work with GitHub Actions and workflows

  -   Work with events, jobs, and runners

  -   Read output and manage releases for actions
