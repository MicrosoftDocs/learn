title: Implement GitHub Actions
summary: GitHub Actions is a powerful CI/CD platform that allows developers to automate their software development workflows.&nbsp;Learn how GitHub actions are implemented, how workflow files are structured, and how to control workflow execution.
abstract: |
  After completing this module, you'll be able to:

  -   Describe the components of GitHub Actions.

  -   Implement variables and scripts in a workflow.

  -   Use contexts and expressions to manage workflow execution.

  -   Manage secrets in GitHub.

  -   Create and run a GitHub Actions workflow.
prerequisites: '-   Experience with GitHub and an understanding of pull requests, code merges, and other repository management practices.'
