### YamlMime:Module
uid: learn.wwl.implement-hybrid-file-server-infrastructure
metadata:
  title: Implement a hybrid file server infrastructure
  description: Implement a hybrid file server infrastructure using Azure Files and Azure File Sync, including cloud tiering, DFS Replication migration, and Storage Migration Services.
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: azure-file-storage
title: Implement a hybrid file server infrastructure
summary: |
  This module covers how to implement a hybrid file server infrastructure using Azure Files and Azure File Sync. You learn how to create and configure Azure file shares with identity-based authentication and NTFS permissions, deploy Azure File Sync with Storage Sync Service, sync groups, and server endpoints, configure cloud tiering policies to cache frequently accessed files locally while tiering cool files to Azure, and migrate from DFS Replication to Azure File Sync.
abstract: |
  After completing this module, you'll be able to:
  - Describe Azure Files.
  - Configure Azure Files.
  - Configure connectivity to Azure Files.
  - Describe Azure File Sync.
  - Implement Azure File Sync.
  - Deploy Azure File Sync.
  - Manage cloud tiering.
  - Migrate from DFSR to Azure File Sync.
prerequisites: |
  To get the best learning experience from this module, it's important that you have knowledge and experience in the following areas:
  - Managing the Windows Server operating system and Windows Server workloads in on-premises scenarios, including Active Directory Domain Services (AD DS), Domain Name System (DNS), DFS, Microsoft Hyper-V, and file and storage services.
  - Common Windows Server management tools.
  - Core Microsoft compute, storage, networking, and virtualization technologies.
  - On-premises resiliency Windows Server-based compute and storage technologies.
  - Implementing and managing infrastructure as a service (IaaS) services in Azure.
  - Microsoft Entra ID.
  - Security-related technologies (firewalls, encryption, multifactor authentication).
  - Windows PowerShell scripting.
  - Automation and monitoring.
