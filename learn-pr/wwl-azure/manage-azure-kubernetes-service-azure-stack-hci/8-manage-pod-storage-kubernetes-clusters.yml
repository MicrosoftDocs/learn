quiz:
  title: "Knowledge check"
  questions:
  - content: "Contoso's cluster has a suitable storage class configured for dynamic provisioning. Which resource should an application developer create to request persistent capacity from that class?"
    choices:
    - content: "Persistent volume claim"
      isCorrect: true
      explanation: "Correct. A persistent volume claim requests the capacity, access mode, and storage class. The provisioner can then create the backing volume."
    - content: "Storage class"
      isCorrect: false
      explanation: "Incorrect. The scenario already has a suitable storage class. Creating another class doesn't submit the application's request for capacity."
    - content: "Persistent volume"
      isCorrect: false
      explanation: "Incorrect. An administrator can create a volume statically, but this scenario uses dynamic provisioning initiated by an application's claim."