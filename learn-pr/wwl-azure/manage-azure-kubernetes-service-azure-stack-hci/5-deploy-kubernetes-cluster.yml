quiz:
  title: "Knowledge check"
  questions:
  - content: "An administrator creates an AKS cluster with Microsoft Entra authentication and wants selected users to have Kubernetes administrator access. Which value should the administrator supply during cluster creation?"
    choices:
    - content: "The subscription's billing account identifier"
      isCorrect: false
      explanation: "Incorrect. A billing identifier doesn't identify the Microsoft Entra users authorized to administer the Kubernetes cluster."
    - content: "The Microsoft Entra administrator group's object ID"
      isCorrect: true
      explanation: "Correct. The example supplies this group through --aad-admin-group-object-ids. Its members receive Kubernetes administrator access, so membership requires careful control."
    - content: "The management workstation's SSH public key fingerprint"
      isCorrect: false
      explanation: "Incorrect. SSH keys support node access and troubleshooting. They don't identify the Microsoft Entra administrator group."