content: |
  [!include[](includes/10-troubleshoot.md)]
quiz:
  title: "Knowledge check"
  questions:
  - content: "An administrator needs to collect full diagnostic logs from an AKS on Azure Local cluster using the documented log-collection command. Which credential material should the administrator preserve from provisioning?"
    choices:
    - content: "The cluster's associated SSH private key"
      isCorrect: true
      explanation: "Correct. The log-collection procedure requires the correct SSH key. Record and protect its actual location rather than assuming a fixed path on the Azure Local nodes."
    - content: "A Windows Admin Center extension package"
      isCorrect: false
      explanation: "Incorrect. An extension package isn't an authentication credential for collecting node logs."
    - content: "An application's container registry password"
      isCorrect: false
      explanation: "Incorrect. Registry credentials support image pulls. They don't replace the SSH credential used by this diagnostic procedure."
