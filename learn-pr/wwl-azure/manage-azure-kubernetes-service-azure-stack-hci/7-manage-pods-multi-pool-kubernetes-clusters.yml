quiz:
  title: "Knowledge check"
  questions:
  - content: "Contoso reserves Windows nodes with a dedicated=windows-apps:NoSchedule taint. Which pod configuration both requires Windows and permits scheduling onto those nodes?"
    choices:
    - content: "A matching toleration without an OS selector"
      isCorrect: false
      explanation: "Incorrect. The toleration permits scheduling onto matching tainted nodes but doesn't require a Windows operating system."
    - content: "A Windows OS selector and the matching toleration"
      isCorrect: true
      explanation: "Correct. The selector requires Windows nodes, and the toleration permits the pod to use nodes with the specified taint."
    - content: "A Windows OS selector without a toleration"
      isCorrect: false
      explanation: "Incorrect. The selector requires Windows, but the untolerated NoSchedule taint prevents placement onto the reserved nodes."