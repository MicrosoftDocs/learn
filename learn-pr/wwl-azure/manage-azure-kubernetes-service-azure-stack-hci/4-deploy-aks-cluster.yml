quiz:
  title: "Knowledge check"
  questions:
  - content: "An administrator prepares to create an AKS cluster on an existing Azure Local deployment. Which infrastructure details identify the local deployment target and the VM network?"
    choices:
    - content: "The application Helm chart and container image names"
      isCorrect: false
      explanation: "Incorrect. These identify application content deployed after the Kubernetes cluster exists. They don't identify its local infrastructure target."
    - content: "The custom location and AKS logical network resource IDs"
      isCorrect: true
      explanation: "Correct. The custom location selects the prepared Azure Local target, and the logical network identifies the network for the cluster's underlying VMs."
    - content: "The Windows Admin Center extension package feed address"
      isCorrect: false
      explanation: "Incorrect. The current workflow uses Azure tools against prepared Azure Local infrastructure. It doesn't install AKS through an extension package feed."