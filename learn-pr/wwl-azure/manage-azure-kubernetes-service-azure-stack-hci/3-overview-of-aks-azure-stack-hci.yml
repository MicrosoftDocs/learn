quiz:
  questions:
  - content: "Contoso needs Azure-based provisioning of Kubernetes clusters on its hyperconverged Azure Local infrastructure. Which components provide the local orchestration interface for that provisioning?"
    choices:
    - content: "Arc resource bridge and the AKS cluster extension"
      isCorrect: true
      explanation: "Correct. Arc resource bridge and the AKS extension coordinate Azure-based management of local AKS clusters. The custom location identifies the deployment target."
    - content: "An application Deployment and its replica set"
      isCorrect: false
      explanation: "Incorrect. These Kubernetes resources manage application pods within a cluster. They don't provision the cluster's underlying infrastructure."
    - content: "A Kubernetes Service and an ingress rule"
      isCorrect: false
      explanation: "Incorrect. These resources help route application traffic. They don't provide the Azure-to-local provisioning interface."