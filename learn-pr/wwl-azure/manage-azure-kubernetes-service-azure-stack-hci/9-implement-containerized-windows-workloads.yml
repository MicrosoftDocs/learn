quiz:
  questions:
  - content: "Contoso wants to add a Windows pool on Azure Local release 2509 or later, where the Windows node-pool feature is disabled by default. What should happen before the pool is created?"
    choices:
    - content: "Have an administrator remove the Linux pool before creating Windows nodes"
      isCorrect: false
      explanation: "Incorrect. At least one Linux node pool is required for Arc agents and connectivity. Removing it doesn't enable Windows image preparation."
    - content: "Have an administrator domain-join the existing nodes to the application domain"
      isCorrect: false
      explanation: "Incorrect. Domain joining nodes isn't the documented mechanism for enabling the Windows node-pool feature or preparing the required images."
    - content: "Have an authorized administrator enable the feature and prepare its images"
      isCorrect: true
      explanation: "Correct. On these releases, the Windows feature and image preparation must be enabled through the supported infrastructure procedure before Windows pools are created."