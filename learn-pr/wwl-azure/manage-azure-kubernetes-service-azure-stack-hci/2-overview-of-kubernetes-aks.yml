quiz:
  title: "Knowledge check"
  questions:
  - content: "Contoso's development teams share a Kubernetes cluster but need separate application administration scopes. Which design organizes their resources and limits each team's permissions?"
    choices:
    - content: "Helm charts with shared release templates"
      isCorrect: false
      explanation: "Incorrect. Helm charts package application manifests. Packaging an application doesn't establish namespace-scoped permissions for its developers."
    - content: "Deployments with additional application replicas"
      isCorrect: false
      explanation: "Incorrect. Deployments manage application replicas and updates. They don't define a separate administrative scope for a development team."
    - content: "Namespaces with namespace-scoped RBAC"
      isCorrect: true
      explanation: "Correct. Namespaces organize namespaced resources, and namespace-scoped RBAC limits what each team can do. A namespace alone doesn't enforce all required security controls."