quiz:
  title: "Knowledge check"
  questions:
  - content: "Contoso plans a Windows application deployment on AKS on Azure Local. What should the administrator retain to host the Arc agents and maintain Azure connectivity?"
    choices:
    - content: "A separate Windows Admin Center onboarding server"
      isCorrect: false
      explanation: "Incorrect. Supported AKS on Azure Local provisioning automatically enables Arc. A separate Windows Admin Center onboarding server doesn't replace the agents' node requirement."
    - content: "A Windows-only worker-node configuration"
      isCorrect: false
      explanation: "Incorrect. Windows application nodes don't replace the Linux node pool required to host the Arc agents."
    - content: "At least one available Linux node pool"
      isCorrect: true
      explanation: "Correct. AKS on Azure Local requires at least one Linux node pool to host Arc agents and maintain connectivity, even when the application workloads run on Windows."