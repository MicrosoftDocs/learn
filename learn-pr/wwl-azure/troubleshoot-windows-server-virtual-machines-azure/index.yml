### YamlMime:Module
uid: learn.wwl.troubleshoot-windows-server-virtual-machines-azure
metadata:
  title: Troubleshoot Windows Server Virtual Machines in Azure
  description: "Learn how to troubleshoot Azure-hosted Windows Server VMs, including provisioning and allocation failures, boot diagnostics, VM Agent and extension issues, RDP connectivity, performance monitoring, and storage tier selection."
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: azure-virtual-machines
title: Troubleshoot Windows Server Virtual Machines in Azure
summary: |
  This module covers how to troubleshoot Windows Server virtual machines hosted in Azure. You learn how to diagnose provisioning failures and allocation errors, use boot diagnostics with screenshots and serial logs to identify startup problems, check VM Agent status and extension provisioning state using PowerShell, troubleshoot RDP and SSH connectivity via the Azure portal and test connection tools, monitor VM performance using Performance Monitor, Windows Admin Center, and System Insights, and understand Azure storage tiers and managed vs. unmanaged disk approaches.
abstract: |
  After completing this module, you're able to:
  *   Troubleshoot VM deployment and extension issues
  *   Troubleshoot VM startup and performance issues
  *   Troubleshoot VM storage and encryption issues
  *   Troubleshoot connectivity to VMs
prerequisites: |
  - Working knowledge of common Windows Server management tools
  - Some experience of typical Windows Server workloads
  - Basic knowledge of Windows PowerShell
