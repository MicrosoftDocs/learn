### YamlMime:ModuleUnit
uid: learn.wwl.enable-enforce-just-in-time-vm-access.knowledge-check
metadata:
  title: Module Assessment
  description: Check your knowledge of just-in-time network restrictions, access request parameters, and the distinction between Azure Policy monitoring and JIT provisioning.
  ms.date: 11/01/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  ai-usage: ai-generated
title: Module assessment
durationInMinutes: 3
content: |
  [!include[](includes/5-knowledge-check.md)]
quiz:
  questions:
  - content: "A VM has JIT configured for RDP port 3389, there's no active access grant, and no existing rule overrides the JIT restriction. How is a new inbound RDP connection handled?"
    choices:
    - content: "The connection is allowed because JIT restrictions take effect only after the first request"
      isCorrect: false
      explanation: "JIT restrictions don't wait for the first request. With no active grant or overriding allow rule in this scenario, the new connection is blocked."
    - content: "It's blocked until an authorized request opens the required path"
      isCorrect: true
      explanation: "The new connection is blocked under the stated conditions. An authorized request can open a network-access window for the configured port and source. Enabling JIT alone doesn't remove every pre-existing allow rule."
    - content: "The port opens for the requesting user's source IP address for a default period of 3 hours"
      isCorrect: false
      explanation: "Configuring JIT doesn't automatically create an access grant. The requester must obtain a grant within the policy's limits. The individual VM shortcut's three-hour maximum isn't an automatic three-hour opening."
  - content: "A user submits a JIT access request from Defender for Cloud for a JIT-enabled VM. Which parameters should the user review and set?"
    choices:
    - content: "The ports to open, the source IP range, and the duration of access"
      isCorrect: true
      explanation: "Review the configured ports to open, the source addresses permitted to connect, and the network-access window. The source must match the actual connection path. Defender for Cloud evaluates the request against authorization and policy limits."
    - content: "Only the port number, because the detected source IP and default duration never need review"
      isCorrect: false
      explanation: "Review all three parameters even when values are prefilled. The browser's detected public IP might not match the VM connection source, and the duration should fit the task and policy."
    - content: "The port to open, the duration, and a PIM activation code for the Security Admin role"
      isCorrect: false
      explanation: "The JIT request captures the port, connection source, and time window. It doesn't require a PIM activation code. Any separate role-activation or human-approval process is an additional organizational control."
  - content: "An organization wants its approved provisioning workflow to configure JIT for eligible new VMs and monitor applicable Defender for Cloud assessments. Which approach meets both requirements?"
    choices:
    - content: "Assign only the JIT audit built-in"
      isCorrect: false
      explanation: "The definition audits a Defender for Cloud assessment but doesn't create JIT configurations, modify network rules, or block VM creation."
    - content: "Configure JIT through the provisioning workflow using supported JIT deployment resources or PowerShell, and assign the audit built-in for monitoring"
      isCorrect: true
      explanation: "Provisioning performs the configuration, while the audit definition supplies assessment-based compliance visibility. The built-in supports AuditIfNotExists and Disabled, not a deploying effect."
    - content: "Enable Defender for Servers Plan 2 and take no further action"
      isCorrect: false
      explanation: "Plan 2 provides the JIT capability, but JIT configuration must still be applied to the required eligible VMs."
