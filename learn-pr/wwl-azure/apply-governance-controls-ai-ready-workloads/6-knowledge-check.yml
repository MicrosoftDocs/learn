  title: "Knowledge check"
  description: "Knowledge check"
  ms.date: 10/22/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: unit
  module_assessment: true
durationInMinutes: 6
content: "Choose the best response for each of the following questions."
quiz:
  questions:
  - content: "A Purview scan identifies customer email addresses in a training dataset stored in Azure Data Lake Storage. The dataset is associated with registered Azure Machine Learning jobs and models. What governance action should the security team take first?"
    choices:
    - content: "Review available lineage to identify related jobs and models, correlate them with deployment records, and assess whether the actual data, model, and endpoint controls meet the requirements for personal data."
      isCorrect: true
      explanation: "Available lineage helps scope the review. Deployment records identify endpoints, and the security team verifies controls in the relevant Azure services. Classification doesn't automatically change model labels, permissions, or network settings."
    - content: "Immediately delete all models trained from this dataset and redeploy them after removing personal data from the training data, as any model exposure represents a compliance violation requiring immediate remediation."
      isCorrect: false
      explanation: "Deleting models before assessing the data exposure and existing controls can disrupt production without establishing which assets require remediation. The team should first review the available evidence and actual protection settings."
    - content: "Remove the personal-data classification because the model is already deployed, retain the current permissions and endpoint settings, and wait for the next training cycle before reviewing the security requirements."
      isCorrect: false
      explanation: "Removing a classification doesn't remove the personal data or address its handling requirements. The team needs to review related assets and controls when the finding is identified."
  - content: "You need to deploy an Azure Policy that enforces encryption with customer-managed keys for all Azure Machine Learning workspaces. Development teams report this requirement slows their experimentation because provisioning Key Vault and keys adds 15-20 minutes to workspace setup. Which policy enforcement strategy balances governance requirements with developer productivity?"
    choices:
    - content: "Assign the policy with DeployIfNotExists effect at the management group level, configuring automatic Key Vault and key provisioning so encryption is enforced transparently without manual developer configuration steps."
      isCorrect: false
      explanation: "DeployIfNotExists with automatic Key Vault provisioning still adds 15-20 minutes regardless of automation, and may create cost concerns with numerous test Key Vaults. Exemptions eliminate protection during development when data leaks often occur through experiment artifacts, creating unnecessary risk that staged enforcement avoids."
    - content: "Assign the policy with Audit effect to development subscriptions and Deny effect to production subscriptions, allowing developers to experiment freely while enforcing strict encryption controls before production deployment."
      isCorrect: true
      explanation: "Different policy effects for different environments balance security with productivity—Audit provides visibility in development without blocking work, while Deny enforces compliance in production where customer data risk is highest."
    - content: "Create a policy exemption for all development workspaces to eliminate the encryption requirement during experimentation, then require manual security review and encryption enablement before promoting workspaces to production."
      isCorrect: false
      explanation: "DeployIfNotExists with automatic Key Vault provisioning still adds 15-20 minutes regardless of automation, and may create cost concerns with numerous test Key Vaults. Exemptions eliminate protection during development when data leaks often occur through experiment artifacts, creating unnecessary risk that staged enforcement avoids."
  - content: "A compliance team needs evidence of the dataset and model versions used by a fraud detection service during a reporting period. Which approach provides the appropriate evidence?"
    choices:
    - content: "Review supported Purview lineage relationships and correlate them with retained ML job records, dataset and model version identifiers, deployment history, and application logs for the reporting period."
      isCorrect: true
      explanation: "Purview provides supported asset relationships. ML records establish training details, while deployment history and application logs establish production use. The ML connector doesn't automatically provide complete inference-endpoint or record-level prediction lineage."
    - content: "Export all catalog assets classified as containing personal data and filter their creation dates to the reporting period, treating those dates as proof of the training and deployed model versions."
      isCorrect: false
      explanation: "An asset's classification and creation date don't establish which version a training job uses or which model an application invokes. Those questions require training and deployment evidence."
    - content: "Use the current endpoint configuration and assume its model and dataset versions apply to the whole reporting period, without retaining historical deployment records or examining the associated training jobs."
      isCorrect: false
      explanation: "The current endpoint configuration doesn't establish which versions are in use earlier in the reporting period. Retained training, deployment, and application records are needed to establish historical use."
