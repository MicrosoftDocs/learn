quiz:
  title: "Check your knowledge"
  questions:
  - content: "Which components does the current Azure Change Tracking and Inventory service use to collect and route change data?"
    choices:
    - content: "Azure Monitor Agent, the Change Tracking extension, and a data collection rule."
      isCorrect: true
      explanation: "Correct. The current service uses AMA, the Change Tracking extension, and a DCR that sends data to a Log Analytics workspace."
    - content: "An Azure Automation account and the Microsoft Monitoring Agent."
      isCorrect: false
      explanation: "Incorrect. This combination belongs to the retired legacy implementation."
    - content: "Microsoft Defender for Endpoint and agentless scanning."
      isCorrect: false
      explanation: "Incorrect. Microsoft Defender for Endpoint and agentless scanning collect File Integrity Monitoring data, not Change Tracking and Inventory data."
  - content: "What must an administrator enable before using File Integrity Monitoring in Microsoft Defender for Cloud?"
    choices:
    - content: "Defender for Servers Plan 2 on the subscription."
      isCorrect: true
      explanation: "Correct. File Integrity Monitoring is a feature of Defender for Servers Plan 2 and uses the Microsoft Defender for Endpoint agent and agentless scanning."
    - content: "The Standard tier on each Log Analytics workspace."
      isCorrect: false
      explanation: "Incorrect. The workspace stores change logs but doesn't require a separate Standard-tier upgrade."
    - content: "An Azure Automation account linked to the workspace."
      isCorrect: false
      explanation: "Incorrect. Current File Integrity Monitoring doesn't require an Azure Automation account."
  - content: "Which approach produces the most useful File Integrity Monitoring signal?"
    choices:
    - content: "Monitor critical files and registry keys that aren't expected to change without planning."
      isCorrect: true
      explanation: "Correct. Focusing on stable, security-sensitive resources reduces noise and makes suspicious changes easier to identify."
    - content: "Monitor every file on every drive with a broad wildcard."
      isCorrect: false
      explanation: "Incorrect. Broad rules generate excessive expected changes and make suspicious activity harder to identify."
    - content: "Monitor only log files and temporary files because they change frequently."
      isCorrect: false
      explanation: "Incorrect. Frequently changing files create noise and usually provide less useful security signal."