quiz:
  title: "Quick review"
  questions:
  - content: "Which File Integrity Monitoring collection method streams configured file and registry change events to the selected Log Analytics workspace in near real time?"
    choices:
    - content: "The Microsoft Defender for Endpoint agent."
      isCorrect: true
      explanation: "Correct. The Microsoft Defender for Endpoint agent streams change events in near real time."
    - content: "Agentless scanning."
      isCorrect: false
      explanation: "Incorrect. Agentless scanning sends file integrity events on an approximately 24-hour cadence."
    - content: "The Microsoft Monitoring Agent."
      isCorrect: false
      explanation: "Incorrect. The Microsoft Monitoring Agent is part of the legacy File Integrity Monitoring experience and must be migrated."