title: Deploy and manage Active Directory Domain Services domain controllers
summary: This module introduces you to the topology of domain controllers within an Active Directory environment. It also starts you down the path of deploying, managing, and migrating a domain controller between servers.
abstract: |
  By the end of this module, you'll be able to:

  -   Define Active Directory Domain Services.

  -   Define Active Directory Domain Services forests and domains.

  -   Deploy Active Directory Domain Services domain controllers.

  -   Migrate a domain controller to a new site.

  -   Manage Active Directory Domain Services operations masters.
prerequisites: |
  Knowledge of and experience working with:

  -   Windows Server.

  -   Core networking technologies.
