title: Microsoft Learn for Educators preparing for course delivery
summary: Use the resources available from Microsoft to prepare to teach your course and feel confident you're providing your students the skills they need skills to be successful across various in-demand technical careers.
abstract: |
  After completing this module, you should be able to:
  * Understand the recommended steps to help you prepare to teach Microsoft Fundamentals or Advanced Role-Based curriculum in your classes
  * Understand the recommended steps to help you wrap up the term and support your students so that they can be successful on their certification exams
