title: Guided project - Create an AI travel agent
summary: This module guides you through the steps required to develop a proof-of-concept AI Travel assistant with the Semantic Kernel SDK. By the end of this module, you complete a small chatbot application.
abstract: |
  -   Create plugins for the Semantic Kernel.

  -   Create prompts to elicit the best responses from the large language model (LLM).

  -   Manipulate LLM responses to guide the execution of code.

  -   Automatically invoke the correct plugins to complete tasks.
prerequisites: |
  -   Experience programming in C#.

  -   Visual Studio Code IDE installed.

  -   Familiarity with Azure and the Azure portal.

  -   Access to Azure OpenAI services.
