title: Secure Azure Database for PostgreSQL
summary: Azure Database for PostgreSQL includes comprehensive security features including encryption, authentication, and granting permissions to database users. In this module, you learn about the security features of Azure Database for PostgreSQL.
abstract: |
  After completing this module, you'll be able to:

  -   Describe the security features of Azure Database for PostgreSQL.

  -   Create database users and grant permissions.

  -   Understand encryption in Azure Database for PostgreSQL.
prerequisites: |
  -   Demonstrate an understanding of relational databases.

  -   Demonstrate an understanding of basic SQL.
