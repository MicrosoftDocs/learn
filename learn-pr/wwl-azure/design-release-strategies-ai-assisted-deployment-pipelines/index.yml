summary: Consume the accepted build candidate without rebuilding, verify target readiness, and generate release-specific Azure Pipelines or GitHub Actions proposals. Separate environment promotion from production exposure, preserve scoped identity and configuration, and decide promotion using candidate-linked security and health evidence.
