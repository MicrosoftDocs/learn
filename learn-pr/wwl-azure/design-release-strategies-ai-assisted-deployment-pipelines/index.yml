abstract: |
  - Define target readiness and reusable application deployment components.
  - Separate deployment and runtime identities and govern configuration without exposing secrets.
  - Compare dev/test, staging, and production promotion with canary, early-adopter, and blue-green exposure.
  - Design security, quality, and health gates with controlled exceptions.
  - Generate and review release-specific pipeline proposals for GitHub and Azure DevOps without delegating approval.
  - Govern promotion using evidence for the actual candidate and cohort.
prerequisites: |
  - Understanding of CI/CD concepts, version control, and verified build artifacts.
  - Familiarity with Azure application hosting, access permissions, and configuration.
  - Ability to read basic Azure Pipelines or GitHub Actions YAML.
  - Experience using GitHub Copilot to propose and review changes.
