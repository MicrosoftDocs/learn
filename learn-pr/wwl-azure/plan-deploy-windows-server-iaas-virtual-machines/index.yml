### YamlMime:Module
uid: learn.wwl.plan-deploy-windows-server-iaas-vms
metadata:
  title: Plan and deploy Windows Server IaaS Virtual Machines
  description: "Learn how to plan and deploy Windows Server IaaS VMs in Azure, including VM sizes and tiers, managed disk storage, and deployment methods using the Azure portal, Azure CLI, and ARM templates."
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: windows-server
title: Plan and deploy Windows Server IaaS Virtual Machines
summary: |
  This module covers how to plan and deploy Windows Server IaaS virtual machines in Azure. You learn how to describe Azure compute resources including VM sizes, series, and Basic vs. Standard tiers, choose appropriate disk storage options including Standard HDD, Standard SSD, and Premium SSD managed disks, deploy Azure VMs using the Azure portal, Azure CLI, and Azure Resource Manager (ARM) templates, and configure additional options including Azure Automanage for automated VM management best practices.
abstract: |
  After completing this module, you'll be able to:
  - Describe Azure compute.
  - Describe Azure storage.
  - Deploy Azure VMs.
  - Create a VM from the Azure portal.
  - Create a VM from Azure Cloud Shell.
  - Deploy Azure VMs by using templates.
  - Describe additional management optimization options
prerequisites: |
  To get the best learning experience from this module, it's important that you have knowledge and experience of the following technologies:
  - Managing Windows Server operating system and Windows Server workloads in on-premises scenarios, such as Active Directory Domain Services (AD DS), Domain Name System (DNS), the Distributed File System (DFS), Microsoft Hyper-V, and file and storage services.
  - Common Windows Server management tools.
  - Core Microsoft compute, storage, networking, and virtualization technologies.
  - On-premises resiliency Windows Server-based compute and storage technologies.
  - Implementing and managing IaaS services in Microsoft Azure.
  - Microsoft Entra ID.
  - Security-related technologies (firewalls, encryption, multifactor authentication).
  - Windows PowerShell scripting.
  - Automation and monitoring.
