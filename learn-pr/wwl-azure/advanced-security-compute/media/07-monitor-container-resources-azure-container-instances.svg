<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c8f7336e7afd05184-title c8f7336e7afd05184-desc" data-module="advanced-security-compute" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c8f7336e7afd05184-title">Locate CPU demand within a container group</title><desc id="c8f7336e7afd05184-desc">Plan and implement advanced security for compute, UNIT 07. Splitting an Azure Monitor chart by container name turns a group measurement into comparable usage traces. 1. Group overview: Open the Azure Container Instances group's CPU usage chart to inspect the average. 2. Container Name dimension: Split the chart to see which container accounts for the observed demand. 3. Resource decision: Use the individual traces to evaluate the CPU allocation rather than resizing blindly. Key takeaways: Read CPU in millicores: 500 represents half a core, not 500 percent utilization. Use memory bytes for footprint and network bytes per second for traffic; neither is a count of security incidents.</desc><defs><marker id="c8f7336e7afd05184-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="c8f7336e7afd05184-i357" viewBox="0 0 18 18" data-asset="containers\10104-icon-service-Container-Instances.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><linearGradient id="c8f7336e7afd05184-i357n0" x1="9" y1="11.95" x2="9" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.16" stop-color="#1380da" /><stop offset="0.53" stop-color="#3c91e5" /><stop offset="0.82" stop-color="#559cec" /><stop offset="1" stop-color="#5ea0ef" /></linearGradient></defs><path d="M17.43,8.21a3.78,3.78,0,0,0-3.29-3.64A4.77,4.77,0,0,0,9.22,0,4.91,4.91,0,0,0,4.54,3.19a4.52,4.52,0,0,0-4,4.3