<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="cdb5bedc819517d9a-title cdb5bedc819517d9a-desc" data-module="advanced-security-compute" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="cdb5bedc819517d9a-title">What runs where in an AKS cluster?</title><desc id="cdb5bedc819517d9a-desc">Plan and implement advanced security for compute, UNIT 03. Azure manages the Kubernetes control plane; applications run in pods on nodes organized into pools. 1. Managed control plane: Azure creates and configures the Kubernetes services that coordinate the cluster. 2. Node pools: Group worker nodes to meet application requirements such as operating system or GPU use. Key takeaways: Use separate node pools when Linux and Windows workloads must run in the same cluster. Distinguish adding pod replicas from adding nodes: the two scaling decisions change different parts of the cluster.</desc><defs><symbol id="cdb5bedc819517d9a-i353" viewBox="0 0 18 18" data-asset="containers\10023-icon-service-Kubernetes-Services.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><linearGradient id="cdb5bedc819517d9a-i353n0" x1="2.94" y1="3.74" x2="8.67" y2="3.74" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b77af4" /><stop offset="1" stop-color="#773adc" /></linearGradient><linearGradient id="cdb5bedc819517d9a-i353n1" x1="9.13" y1="3.79" x2="14.85" y2="3.79" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b77af4" /><stop offset="1" stop-color="#773adc" /></linearGradient><linearGradient id="cdb5bedc819517d9a-i353n2" x1="0.01" y1="9.12" x2="5.73" y2="9.12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b77af4" /><stop offset="1" stop-color="#773adc" /></linearGradient><linearGradient id="cdb5bedc819517d9a-i353n3" x1="6.18" y1="9.08" x2="11.9" y2="9.08" gradientUnits="userSpaceOnUse"><sto