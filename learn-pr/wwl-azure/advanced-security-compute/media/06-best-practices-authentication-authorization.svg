0" fill="#132c3b">Projected token</text></g><g data-field="detail" data-box="426 574.76 268 122"><text x="430" y="600.42" font-size="21" font-weight="400" fill="#364f5e">AKS makes a signed</text><text x="430" y="629.42" font-size="21" font-weight="400" fill="#364f5e">service account token</text><text x="430" y="658.42" font-size="21" font-weight="400" fill="#364f5e">available to the pod using</text><text x="430" y="687.42" font-size="21" font-weight="400" fill="#364f5e">that account.</text></g></g><g data-node="3"><rect x="760" y="398" width="304" height="375" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="778" y="416" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="778 417.5 46 29"><text x="791.797" y="437.767" font-size="16" font-weight="700" fill="#ffffff">03</text></g><g data-field="label" data-box="778 487.76 268 43"><text x="782" y="519.897" font-size="27" font-weight="700" fill="#132c3b">Token exchange</text></g><g data-field="detail" data-box="778 574.76 268 122"><text x="782" y="600.42" font-size="21" font-weight="400" fill="#364f5e">The application exchanges</text><text x="782" y="629.42" font-size="21" font-weight="400" fill="#364f5e">the projected token for an</text><text x="782" y="658.42" font-size="21" font-weight="400" fill="#364f5e">access token to the target</text><text x="782" y="687.42" font-size="21" font-weight="400" fill="#364f5e">service.</text></g></g><g data-field="takeaways" data-box="56 807 320 45"><text x="60" y="840.213" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="831.3" y2="831.3" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="897.96" r="13" fill="#e2f1ee" /><path d="M71 897.96l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 878 948 70"><text x="120" y="905.82" font-size="23" font-weight="400" fill="#364f5e">Scope the managed identity to the Azure resources the application needs; federation</text><text x="120" y="937.82" font-size="23" font-weight="400" fill="#364f5e">does not itself grant data access.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="968" y2="968" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="1007.96" r="13" fill="#e2f1ee" /><path d="M71 1007.96l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 988 948 70"><text x="120" y="1015.82" font-size="23" font-weight="400" fill="#364f5e">For people, bind a Microsoft Entra group to the required Kubernetes role instead of</text><text x="120" y="1047.82" font-size="23" font-weight="400" fill="#364f5e">sharing the application's identity.</text></g></g></svg>