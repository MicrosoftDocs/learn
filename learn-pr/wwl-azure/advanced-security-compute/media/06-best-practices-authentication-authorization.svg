<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c3b415d3b48d7fee3-title c3b415d3b48d7fee3-desc" data-module="advanced-security-compute" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c3b415d3b48d7fee3-title">A pod authenticates without an embedded secret</title><desc id="c3b415d3b48d7fee3-desc">Plan and implement advanced security for compute, UNIT 06. Workload identity lets a Kubernetes service account obtain an Azure access token through a configured trust relationship. 1. Federated credential: Link the intended Kubernetes service account to a managed identity in Microsoft Entra ID. 2. Projected token: AKS makes a signed service account token available to the pod using that account. 3. Token exchange: The application exchanges the projected token for an access token to the target service. Key takeaways: Scope the managed identity to the Azure resources the application needs; federation does not itself grant data access. For people, bind a Microsoft Entra group to the required Kubernetes role instead of sharing the application's identity.</desc><defs><marker id="c3b415d3b48d7fee3-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="c3b415d3b48d7fee3-i70" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Key, permissions.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="c3b415d3b48d7fee3-i70n0"><g id="c3b415d3b48d7fee3-i70n1" /></g><g id="c3b415d3b48d7fee3-i70n2" /><g id="c3b415d3b48d7fee3-i70n3" /><g id="c3b415d3b48d7fee3-i70n4" /><g id="c3b415d3b48d7fee3-i70n5"><g id="c3b415d3b48d7fee3-i70n6" transform="translate(1.50075,-1.50075)"><path fill="#2A3282" d="M455.7,152.9H334.5c-11.1,0-20.5,9.4-20.5,20.5v84.5c0,11.1,9.4,19.6,21.3,19.6h23.9v151.1    c0,19.6,12