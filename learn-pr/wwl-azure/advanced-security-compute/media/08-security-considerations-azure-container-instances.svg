<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c972d3d2b8d375e2c-title c972d3d2b8d375e2c-desc" data-module="advanced-security-compute" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c972d3d2b8d375e2c-title">Carry image trust into the running container app</title><desc id="c972d3d2b8d375e2c-desc">Plan and implement advanced security for compute, UNIT 08. Image approval matters at release, but newly discovered vulnerabilities can also affect instances that are already running. 1. Control image sources: Use approved registries and verify image integrity before accepting a release. 2. Map scan findings: Connect vulnerable image layers to the running containers that use them. 3. Remediate affected apps: Update the image and replace affected workloads rather than fixing the registry alone. Key takeaways: Keep passwords and access tokens out of images that may be distributed to multiple regions. Review administrative access logs alongside runtime activity; a CPU measurement does not tell you who changed an image.</desc><defs><marker id="c972d3d2b8d375e2c-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="c972d3d2b8d375e2c-i454" viewBox="0 0 18 18" data-asset="general\10812-icon-service-Image.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><linearGradient id="c972d3d2b8d375e2c-i454n0" x1="9" y1="3.12" x2="9" y2="14.88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32d4f5" /><stop offset="0.228" stop-color="#31d0f1" /><stop offset="0.463" stop-color="#2cc3e6" /><stop offset="0.703" stop-color="#25afd4" /><stop offset="0.944" stop-color="#1c92ba" /><stop offset="1" stop-color="#198ab3" /></linearGradient></defs><g id="c972d3d2b8d375e2c-i454n1"><g>