<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c39ecd0e062f51a81-title c39ecd0e062f51a81-desc" data-module="advanced-security-compute" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c39ecd0e062f51a81-title">Two ways to limit VM management exposure</title><desc id="c39ecd0e062f51a81-desc">Plan and implement advanced security for compute, UNIT 02. Bastion changes how an administrator reaches a VM, while just-in-time access limits when a management port admits a connection. 1. Azure Bastion: Broker an RDP or SSH session to the VM's private IP without publishing its port. 2. Just-in-time VM access: Permit authorized access to a management port for a limited period. Key takeaways: Choose Bastion Premium if graphical sessions must be recorded; the recording is available after the session ends. Distinguish a private target VM from a private-only Bastion deployment: the latter also removes the host's public IP.</desc><defs><symbol id="c39ecd0e062f51a81-i677" viewBox="0 0 18 18" data-asset="networking\02422-icon-service-Bastions.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><linearGradient id="c39ecd0e062f51a81-i677n0" x1="12.896" y1="-0.54" x2="12.896" y2="6.922" gradientTransform="translate(1.05 10.166) rotate(-44.919)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5ea0ef" /><stop offset="1" stop-color="#0078d4" /></linearGradient><linearGradient id="c39ecd0e062f51a81-i677n1" x1="5.104" y1="5.035" x2="5.104" y2="12.497" gradientTransform="translate(2.636 18.68) rotate(-135.081)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5ea0ef" /><stop offset="1" stop-color="#0078d4" /></linearGradient></defs><path d="M12.315,4.43h1.136a.363.363,0,0,1,.363.363v8.382a.727.727,0,0,1-.727.727H11.951a0,0,0,0,1,0,0V4.793A.363.363,0,0,1,12.315,4.43Z" transform="translate(28.47 