<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="cab30b78d4b02f8f0-title cab30b78d4b02f8f0-desc" data-module="advanced-security-compute" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="cab30b78d4b02f8f0-title">Grant registry rights by job, not by team seniority</title><desc id="cab30b78d4b02f8f0-desc">Plan and implement advanced security for compute, UNIT 09. Publishing an image, retrieving it for execution, and removing it from storage are separate registry operations. 1. AcrPush: Give a build identity the ability to push and pull images without managing the registry. 2. AcrPull: Let a container host retrieve an image without allowing it to publish a replacement. 3. AcrDelete: Assign image deletion separately when a cleanup process must remove stored artifacts. Key takeaways: A node that knows which image to pull does not need Azure Resource Manager rights to list registries. Prefer Microsoft Entra identities with role assignments to distributing the registry's full-access admin credentials.</desc><defs><symbol id="cab30b78d4b02f8f0-i454" viewBox="0 0 18 18" data-asset="general\10812-icon-service-Image.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><linearGradient id="cab30b78d4b02f8f0-i454n0" x1="9" y1="3.12" x2="9" y2="14.88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32d4f5" /><stop offset="0.228" stop-color="#31d0f1" /><stop offset="0.463" stop-color="#2cc3e6" /><stop offset="0.703" stop-color="#25afd4" /><stop offset="0.944" stop-color="#1c92ba" /><stop offset="1" stop-color="#198ab3" /></linearGradient></defs><g id="cab30b78d4b02f8f0-i454n1"><g><rect x="0.5" y="3.12" width="17" height="11.76" rx="0.572" fill="url(#cab30b78d4b02f8f0-i454n0)" /><path d="M17.463,9.912,16.235,8.8a1.374,1.374,0,0,0-1.785,0L7.828,14.88h9.1a.572.572,0,0,0,.572-.572v-4.4Z" fill="#86d633" /><path d="M15.69,14.88l-5.208-4.731a1.06,1.06,0,0,0-1.376,0L3.9,14.88Z" fill="#b4ec36" /><path d="M9,7.852a1.555,1.555,0,0,0-1.351-1.5A1.962,1.962,0,0,0,5.628,4.479,2.027,2.027,0,0,0,3.7,5.792,1.847,1.847,0,0,0,2.072,7.578,1.885,1.885,0,0,0,4.023,9.39c.058,0,.115,0,.172-.008H7.354a.326.326,0,0,0,.083-.012A1.575,1.575,0,0,0,9,7.852Z" fill="#fff" /></g></g></g></symbol></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Plan and implement advanced security for compute</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 09</text></g><g data-field="title" data-box="56 95 1008 132"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">Grant registry rights by job, not by team</text><text x="60" y="210.64" font-size="46" font-weight="700" fill="#132c3b">seniority</text></g><g data-field="concept" data-box="56 232 1008 72"><text x="60" y="260.9" font-size="24" font-weight="400" fill="#364f5e">Publishing an image, retrieving it for execution, and removing it from storage are separate</text><text x="60" y="293.9" font-size="24" font-weight="400" fill="#364f5e">registry operations.</text></g><line x1="56" x2="1064" y1="321" y2="321" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 347.62 360 43"><text x="60" y="379.757" font-size="27" font-weight="700" fill="#132c3b">Side by side</text></g><line x1="233.177" x2="1064" y1="370.84" y2="370.84" stroke="#c6d6df" stroke-width="1.5" /><g data-node="1"><rect x="56" y="402.62" width="321.333" height="337.38" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="420.62" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 422.12 46 29"><text x="87.797" y="442.387" font-size="16" font-weight="700" fill="#ffffff">01</text></g><use x="315.333" y="420.62" width="44" height="44" aria-hidden="true" xlink:href="#cab30b78d4b02f8f0-i454" /><g data-field="label" data-box="74 501.462 285.333 43"><text x="78" y="533.598" font-size="27" font-weight="700" fill="#132c3b">AcrPush</text></g><g data-field="detail" data-box="74 551.462 285.333 122"><text x="78" y="577.122" font-size="21" font-weight="400" fill="#364f5e">Give a build identity the</text><text x="78" y="606.122" font-size="21" font-weight="400" fill="#364f5e">ability to push and pull</text><text x="78" y="635.122" font-size="21" font-weight="400" fill="#364f5e">images without managing</text><text x="78" y="664.122" font-size="21" font-weight="400" fill="#364f5e">the registry.</text></g></g><g data-node="2"><rect x="399.333" y="402.62" width="321.333" height="337.38" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="417.333" y="420.62" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="417.333 422.12 46 29"><text x="431.13" y="442.387" font-size="16" font-weight="700" fill="#ffffff">02</text></g><g data-field="label" data-box="417.333 501.462 285.333 43"><text x="421.333" y="533.598" font-size="27" font-weight="700" fill="#132c3b">AcrPull</text></g><g data-field="detail" data-box="417.333 551.462 285.333 93"><text x="421.333" y="577.122" font-size="21" font-weight="400" fill="#364f5e">Let a container host retrieve</text><text x="421.333" y="606.122" font-size="21" font-weight="400" fill="#364f5e">an image without allowing it</text><text x="421.333" y="635.122" font-size="21" font-weight="400" fill="#364f5e">to publish a replacement.</text></g></g><g data-node="3"><rect x="742.667" y="402.62" width="321.333" height="337.38" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="760.667" y="420.62" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="760.667 422.12 46 29"><text x="774.463" y="442.387" font-size="16" font-weight="700" fill="#ffffff">03</text></g><g data-field="label" data-box="760.667 501.462 285.333 43"><text x="764.667" y="533.598" font-size="27" font-weight="700" fill="#132c3b">AcrDelete</text></g><g data-field="detail" data-box="760.667 551.462 285.333 122"><text x="764.667" y="577.122" font-size="21" font-weight="400" fill="#364f5e">Assign image deletion</text><text x="764.667" y="606.122" font-size="21" font-weight="400" fill="#364f5e">separately when a cleanup</text><text x="764.667" y="635.122" font-size="21" font-weight="400" fill="#364f5e">process must remove stored</text><text x="764.667" y="664.122" font-size="21" font-weight="400" fill="#364f5e">artifacts.</text></g></g><g data-field="takeaways" data-box="56 780.6 320 45"><text x="60" y="813.813" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="804.9" y2="804.9" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="878.16" r="13" fill="#e2f1ee" /><path d="M71 878.16l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 858.2 948 70"><text x="120" y="886.02" font-size="23" font-weight="400" fill="#364f5e">A node that knows which image to pull does not need Azure Resource Manager rights to</text><text x="120" y="918.02" font-size="23" font-weight="400" fill="#364f5e">list registries.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="954.8" y2="954.8" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="1001.36" r="13" fill="#e2f1ee" /><path d="M71 1001.36l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 981.4 948 70"><text x="120" y="1009.22" font-size="23" font-weight="400" fill="#364f5e">Prefer Microsoft Entra identities with role