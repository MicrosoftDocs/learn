ata-box="74 463.581 457 43"><text x="78" y="495.718" font-size="27" font-weight="700" fill="#132c3b">Logical isolation</text></g><g data-field="detail" data-box="74 513.581 457 64"><text x="78" y="539.241" font-size="21" font-weight="400" fill="#364f5e">Use namespaces, scoped permissions, quotas,</text><text x="78" y="568.241" font-size="21" font-weight="400" fill="#364f5e">and pod network policies in one cluster.</text></g></g><g data-node="2"><rect x="571" y="348.09" width="493" height="331.41" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="589" y="366.09" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="589 367.59 46 29"><text x="602.797" y="387.857" font-size="16" font-weight="700" fill="#ffffff">02</text></g><use x="1002" y="366.09" width="44" height="44" aria-hidden="true" xlink:href="#c54ac5b5d3ab5f844-i353" /><g data-field="label" data-box="589 463.581 457 43"><text x="593" y="495.718" font-size="27" font-weight="700" fill="#132c3b">Physical isolation</text></g><g data-field="detail" data-box="589 513.581 457 64"><text x="593" y="539.241" font-size="21" font-weight="400" fill="#364f5e">Give workloads separate AKS clusters when</text><text x="593" y="568.241" font-size="21" font-weight="400" fill="#364f5e">sharing the underlying cluster is unacceptable.</text></g></g><g data-field="takeaways" data-box="56 732.2 320 45"><text x="60" y="765.413" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="756.5" y2="756.5" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="841.86" r="13" fill="#e2f1ee" /><path d="M71 841.86l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 821.9 948 70"><text x="120" y="849.72" font-size="23" font-weight="400" fill="#364f5e">A role binding limits Kubernetes API actions; use a network policy, not a role binding, to</text><text x="120" y="881.72" font-size="23" font-weight="400" fill="#364f5e">limit connections between pods.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="930.6" y2="930.6" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="989.26" r="13" fill="#e2f1ee" /><path d="M71 989.26l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 969.3 948 70"><text x="120" y="997.12" font-size="23" font-weight="400" fill="#364f5e">Weigh the cost of idle capacity in separate clusters against the isolation required by the</text><text x="120" y="1029.12" font-size="23" font-weight="400" fill="#364f5e">tenant trust model.</text></g></g></svg>