<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c54ac5b5d3ab5f844-title c54ac5b5d3ab5f844-desc" data-module="advanced-security-compute" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c54ac5b5d3ab5f844-title">When does a team need its own cluster?</title><desc id="c54ac5b5d3ab5f844-desc">Plan and implement advanced security for compute, UNIT 04. Sharing nodes improves utilization, but a namespace is not a sufficient security boundary between mutually untrusted tenants. 1. Logical isolation: Use namespaces, scoped permissions, quotas, and pod network policies in one cluster. 2. Physical isolation: Give workloads separate AKS clusters when sharing the underlying cluster is unacceptable. Key takeaways: A role binding limits Kubernetes API actions; use a network policy, not a role binding, to limit connections between pods. Weigh the cost of idle capacity in separate clusters against the isolation required by the tenant trust model.</desc><defs><symbol id="c54ac5b5d3ab5f844-i70" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Key, permissions.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="c54ac5b5d3ab5f844-i70n0"><g id="c54ac5b5d3ab5f844-i70n1" /></g><g id="c54ac5b5d3ab5f844-i70n2" /><g id="c54ac5b5d3ab5f844-i70n3" /><g id="c54ac5b5d3ab5f844-i70n4" /><g id="c54ac5b5d3ab5f844-i70n5"><g id="c54ac5b5d3ab5f844-i70n6" transform="translate(1.50075,-1.50075)"><path fill="#2A3282" d="M455.7,152.9H334.5c-11.1,0-20.5,9.4-20.5,20.5v84.5c0,11.1,9.4,19.6,21.3,19.6h23.9v151.1    c0,19.6,12,33.3,29,33.3c15.4,0,27.3-12,29-28.2c4.3-0.9,7.7-0.9,7.7-0.9s0.9-15.4,0-20.5c-0.9-5.1,9.4-11.1,9.4-11.1    s0.9-8.5,0-9.4c-9.4-4.3-14.5-8.5-17.1-12v-10.2c2.6-3.4,6-6,7.7-7.7c3.4-4.3,11.1-16.2,11.1-16.2s-8.5-12-11.1-14.5    c-4.3-5.1-6.8-10.2-7.7-14.5v-7.7c2.6-17.1,22.2-31.6,22.2-31.6h-22.2l0,0h39.3c10.2,0,19.6-8.5,1