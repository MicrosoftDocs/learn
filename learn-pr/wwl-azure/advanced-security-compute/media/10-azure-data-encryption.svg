<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c50741bf8439ad27b-title c50741bf8439ad27b-desc" data-module="advanced-security-compute" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c50741bf8439ad27b-title">Locate the VM disk encryption boundary</title><desc id="c50741bf8439ad27b-desc">Plan and implement advanced security for compute, UNIT 10. The relevant distinction is whether protection is applied by the guest OS, the VM host, or confidential computing hardware. 1. Azure Disk Encryption: BitLocker on Windows or dm-crypt on Linux encrypts volumes inside the guest. 2. Encryption at host: Encrypt VM disk data at the host rather than relying on a guest volume encryption tool. 3. Confidential disk encryption: Use hardware-backed disk protection for sensitive workloads on confidential VMs. Key takeaways: A data encryption key encrypts the data; a key encryption key wraps that key instead of processing every disk block. Restrict which identities may use the wrapping key in Azure Key Vault, not just who may read the encrypted disk.</desc><defs><symbol id="c50741bf8439ad27b-i76" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Lock, protected.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="c50741bf8439ad27b-i76n0"><g id="c50741bf8439ad27b-i76n1" /></g><g id="c50741bf8439ad27b-i76n2" /><g id="c50741bf8439ad27b-i76n3" /><g id="c50741bf8439ad27b-i76n4" /><g id="c50741bf8439ad27b-i76n5" /><g id="c50741bf8439ad27b-i76n6" /><path fill="#2A3282" d="M504.2,272.1h-16.3v-30c0-63.5-40.3-96.1-87.6-96.1h-7.7c-48.1,0-87.6,31.8-87.6,96.1v30h-16.3  c-6.9,0-16.3,9.4-16.3,16.3v161.4c0,6.9,9.4,16.3,16.3,16.3h215.4c6.9,0,16.3-9.4,16.3-16.3V288.4  C519.6,281.5,510.2,272.1,504.2,272.1z M408,367.4v67h-24v-67c-9.4-4.3-16.3-13.7-16.3-24.9c0-15.5,12.9-28.3,28.3-28.3  c15.5,0,28.3,12.9,28.3,28.3C424.3,352.8,417.5,362.2,408,367.4z M457.8,272.1H335.1v-30c0-40.3,21.5-67.8,57.5-67.8h7.7  c36.9,0,57.5,27.5,57.5,67.8L457.8,272.1L457.8,272.1z" /><g id="c50741bf8439ad27b-i76n7" /><g id="c50741bf8439ad27b-i76n8" /></g></symbol></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Plan and implement advanced security for compute</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 10</text></g><g data-field="title" data-box="56 95 1008 69"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">Locate the VM disk encryption boundary</text></g><g data-field="concept" data-box="56 169 1008 72"><text x="60" y="197.9" font-size="24" font-weight="400" fill="#364f5e">The relevant distinction is whether protection is applied by the guest OS, the VM host, or</text><text x="60" y="230.9" font-size="24" font-weight="400" fill="#364f5e">confidential computing hardware.</text></g><line x1="56" x2="1064" y1="258" y2="258" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 286.44 360 43"><text x="60" y="318.577" font-size="27" font-weight="700" fill="#132c3b">Side by side</text></g><line x1="233.177" x2="1064" y1="309.66" y2="309.66" stroke="#c6d6df" stroke-width="1.5" /><g data-node="1"><rect x="56" y="341.44" width="321.333" height="385.56" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="359.44" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 360.94 46 29"><text x="87.797" y="381.207" font-size="16" font-weight="700" fill="#ffffff">01</text></g><use x="315.333" y="359.44" width="44" height="44" aria-hidden="true" xlink:href="#c50741bf8439ad2