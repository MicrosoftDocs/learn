<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c356ae382f313ea9b-title c356ae382f313ea9b-desc" data-module="advanced-security-compute" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c356ae382f313ea9b-title">Choose the audience for an API Management gateway</title><desc id="c356ae382f313ea9b-desc">Plan and implement advanced security for compute, UNIT 11. Both virtual network modes can reach private backends; they differ in where a caller can reach the gateway and developer portal. 1. External mode: An external load balancer exposes the gateway and developer portal to internet clients. 2. Internal mode: An internal load balancer keeps those endpoints reachable within the virtual network. Key takeaways: To publish only selected APIs, place Application Gateway in front of API Management running in internal mode. When applying a network security group to the API Management subnet, preserve the ports required for service operation.</desc><defs><symbol id="c356ae382f313ea9b-i84" viewBox="0 0 71.2 71.3" data-asset="CnE_Enterprise\Network card.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="c356ae382f313ea9b-i84n0"><g id="c356ae382f313ea9b-i84n1" /><g id="c356ae382f313ea9b-i84n2" /><g id="c356ae382f313ea9b-i84n3" /><g id="c356ae382f313ea9b-i84n4" /><g id="c356ae382f313ea9b-i84n5" /><g id="c356ae382f313ea9b-i84n6"><path fill-rule="evenodd" clip-rule="evenodd" fill="#2A3282" d="M12.6,20.1v-3h-3v37h3v-8h2v4h11v3h17v-3h5v3h10v-3h4V28.5v-8.4    H12.6z M57.6,46.1h-17v-3h-17h-1v-1v-7h-7.9v8h-2.1v-15h2.1v2h11.9v-5h13v11h-13v-5H14.7v3h7.9h1v8h17v-3h17V46.1z" /></g></g><g id="c356ae382f313ea9b-i84n7"><g id="c356ae382f313ea9b-i84n8" /><g id="c356ae382f313ea9b-i84n9" /><g id="c356ae382f313ea9b-i84n10" /><g id="c356ae382f313ea9b-i84n11" /><g id="c356ae382f313ea9b-i84n12" /><g id="c356ae382f313ea9b-i84n13" /></g><g id="c356ae382f313ea9b-i84n14" /><g id="c356ae382f313ea9b-i84n15" /></g></symbol></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Plan and implement advanced security for compute</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 11</text></g><g data-field="title" data-box="56 95 1008 132"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">Choose the audience for an API</text><text x="60" y="210.64" font-size="46" font-weight="700" fill="#132c3b">Management gateway</text></g><g data-field="concept" data-box="56 232 1008 72"><text x="60" y="260.9" font-size="24" font-weight="400" fill="#364f5e">Both virtual network modes can reach private backends; they differ in where a caller can</text><text x="60" y="293.9" font-size="24" font-weight="400" fill="#364f5e">reach the gateway and developer portal.</text></g><line x1="56" x2="1064" y1="321" y2="321" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 349.65 360 43"><text x="60" y="381.787" font-size="27" font-weight="700" fill="#132c3b">Side by side</text></g><line x1="233.177" x2="1064" y1="372.87" y2="372.87" stroke="#c6d6df" stroke-width="1.5" /><g data-node="1"><rect x="56" y="404.65" width="493" height="320.85" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="422.65" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 424.15 46 29"><text x="87.797" y="444.417" font-size="16" font-weight="700" fill="#ffffff">01</text></g><g data-field="label" data-box="74 507.482 457 43"><text x="78" y="539.619" font-size="27" font-weight="700" fill="#132c3b">External mode</text></g><g data-field="detail" data-box="74 557.482 457 93"><text x="78" y="583.142" font-size="21" font-weight="400" fill="#364f5e">An external load balancer exposes the</text><text x="78" y="612.142" font-size="21" font-weight="400" fill="#364f5e">gateway and developer portal to internet</text><text x="78" y="641.142" font-size="21" font-weight="400" fill="#364f5e">clients.</text></g></g><g data-node="2"><rect x="571" y="404.65" width="493" height="320.85" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="589" y="422.65" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="589 424.15 46 29"><text x="602.797" y="444.417" font-size="16" font-weight="700" fill="#ffffff">02</text></g><use x="1002" y="422.65" width="44" height="44" aria-hidden="true" xlink:href="#c356ae382f313ea9b-i84" /><g data-field="label" data-box="589 507.482 457 43"><text x="593" y="539.619" font-size="27" font-weight="700" fill="#132c3b">Internal mode</text></g><g data-field="detail" data-box="589 557.482 457 93"><text x="593" y="583.142" font-size="21" font-weight="400" fill="#364f5e">An internal load balancer keeps those</text><text x="593" y="612.142" font-size="21" font-weight="400" fill="#364f5e">endpoints reachable within the virtual</text><text x="593" y="641.142" font-size="21" font-weight="400" fill="#364f5e">network.</text></g></g><g data-field="takeaways" data-box="56 769 320 45"><text x="60" y="802.213" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="793.3" y2="793.3" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="869.46" r="13" fill="#e2f1ee" /><path d="M71 869.46l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 849.5 948 70"><text x="120" y="877.32" font-size="23" font-weight="400" fill="#364f5e">To publish only selected APIs, place Application Gateway in front of API Management</text><text x="120" y="909.32" font-size="23" font-weight="400" fill="#364f5e">running in internal mode.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="949" y2="949" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="998.46" r="13" fill="#e2f1ee" /><path d="M71 998.46l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 978.5 948 70"><text x="120" y="1006.32" font-size="23" font-weight="400" fill="#364f5e">When applying a network security group to the API Management subnet, preserve the</text><text x="120" y="1038.32" font-size="23" font-weight="400" fill="#364f5e">ports required for service operation.</text></g></g></svg>