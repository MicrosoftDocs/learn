title: Manage identity for projects, pipelines, and agents
summary: This module is designed to help learners understand the importance of managing identity for projects, pipelines, and agents in Azure DevOps. The module covers fundamental concepts and best practices for configuring a Microsoft-hosted pool, configuring agents for projects, configuring agent identities, configuring the scope of a service connection, and converting to a managed identity.
abstract: |
  In this module, you practice how to:
    - Configure a Microsoft-hosted pool.
    - Configure agents for projects.
    - Configure agent identities.
    - Configure the scope of a service connection.
    - Convert to a managed identity in Azure DevOps.
prerequisites: |
  - Basic knowledge of Azure DevOps to manage agents and service connections.
  - Basic knowledge of security concepts like agent identities and managed identity.
  - Experience using the Azure portal to create managed identities.
