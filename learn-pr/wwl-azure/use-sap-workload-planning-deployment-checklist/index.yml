title: Use the planning and deployment checklist for SAP workloads on Azure
summary: This module uses the SAP workload planning and deployment checklist to guide SAP deployment teams through each phase of the SAP on Azure migration process.
abstract: |
  After completing this module, you will be able to:

  -   Examine the SAP workload planning and deployment checklist.

  -   Explore the phases from project preparation and planning, and through the Go Live and post production phases.
prerequisites: |
  Before taking this training, you should complete:

  -   Azure Administrator (AZ-104) or Azure Infrastructure Solutions (AZ-305) exam.

  -   SAP HANA or NetWeaver training.
