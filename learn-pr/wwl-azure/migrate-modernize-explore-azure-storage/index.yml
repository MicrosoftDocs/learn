title: Modernize and explore Azure for SAP storage
summary: This module explores the use of Azure storage components to design scalable, performant, and resilient certified SAP deployments in Azure.
abstract: |
  After completing this module, you will be able to:
  - Explore Azure Storage types.
  - Explore Azure Files.
  - Examine Azure virtual machine disks.
  - Explore managed and unmanaged disks.
  - Examine Azure virtual machine storage considerations.
  - Explore Azure virtual machine NFS storage.
  - Examine SAP HANA Azure virtual machine storage configurations.
  - Explore NFS v4.1 volumes on Azure NetApp Files.
prerequisites: |
  Before taking this training, you should complete:
  *   Azure Administrator (AZ-104) or Azure Solutions Architect Expert (AZ-305) exam.
  *   SAP HANA or NetWeaver training.
