content: |
  [!include[](includes/5-view-update-assessments.md)]
quiz:
  title: "Quick quiz"
  questions:
  - content: "Which assessment option checks a machine for available updates every 24 hours?"
    choices:
    - content: "A one-time update deployment."
      isCorrect: false
      explanation: "That's incorrect. A one-time update deployment installs selected updates."
    - content: "A periodic assessment."
      isCorrect: true
      explanation: "That's correct. Periodic assessment checks for available updates every 24 hours."
    - content: "A maintenance configuration."
      isCorrect: false
      explanation: "That's incorrect. A maintenance configuration defines a recurring update schedule."
  - content: "An administrator needs current update information for a running Azure VM before an emergency maintenance event. Which action should the administrator take?"
    choices:
    - content: "Run an on-demand assessment by selecting **Check for updates**."
      isCorrect: true
      explanation: "That's correct. An on-demand assessment retrieves current update information without waiting for periodic assessment."
    - content: "Create a recurring maintenance configuration for the VM."
      isCorrect: false
      explanation: "That's incorrect. A maintenance configuration schedules installation and doesn't provide an immediate assessment."
    - content: "Review the previous deployment on the **History** page."
      isCorrect: false
      explanation: "That's incorrect. Deployment history shows earlier operations rather than the updates currently available."
