### YamlMime:ModuleUnit
uid: learn.wwl.manage-azure-updates.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: "Assess your knowledge of Azure Update Manager."
  ms.date: 08/16/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: unit
  module_assessment: true
azureSandbox: false
durationInMinutes: 5
quiz:
  title: "Check your knowledge"
  questions:
  - content: "Contoso uses Windows Server Update Services (WSUS) as the update source for its servers. What must the team do before Azure Update Manager can install a selected update?"
    choices:
    - content: "Approve the update in WSUS so that WSUS offers it to the servers."
      isCorrect: true
      explanation: "That's correct. When WSUS is the configured source, WSUS must approve and offer the update to the servers."
    - content: "Add the update's KB ID to Update Manager without approving it in WSUS."
      isCorrect: false
      explanation: "That's incorrect. Selecting a KB ID doesn't override update approvals configured on the WSUS server."
    - content: "Disable the Windows Update client before starting the Update Manager deployment."
      isCorrect: false
      explanation: "That's incorrect. Update Manager relies on the Windows Update client to assess and install updates."
  - content: "Contoso wants to manage operating system updates on physical servers in its datacenter by using Azure Update Manager. What must the team do first?"
    choices:
    - content: "Connect the servers to Azure Arc."
      isCorrect: true
      explanation: "That's correct. Machines outside Azure must be Azure Arc-enabled before Update Manager can manage them."
    - content: "Create an Azure Automation account."
      isCorrect: false
      explanation: "That's incorrect. Azure Update Manager doesn't depend on Azure Automation."
    - content: "Install Azure Monitor Agent on each server."
      isCorrect: false
      explanation: "That's incorrect. Azure Update Manager doesn't require Azure Monitor Agent."
  - content: "Contoso wants a recurring update schedule that automatically includes Windows production servers with a specific Azure tag. What should the team configure?"
    choices:
    - content: "A guest-scope maintenance configuration with a dynamic scope filtered by operating system and a tag."
      isCorrect: true
      explanation: "That's correct. A dynamic scope evaluates Azure resource properties and tags when the maintenance configuration runs."
    - content: "A one-time update deployment with a maximum duration of 235 minutes."
      isCorrect: false
      explanation: "That's incorrect. A one-time deployment doesn't create a recurring schedule or dynamic machine membership."
    - content: "An Azure Monitor alert rule that filters machines by tag."
      isCorrect: false
      explanation: "That's incorrect. Alert rules send notifications or trigger actions based on conditions, but they don't assign recurring update schedules."
  - content: "Contoso identifies a critical update to install immediately on 12 assessed servers. Which Azure Update Manager operation should the team use?"
    choices:
    - content: "A one-time update deployment for the selected servers."
      isCorrect: true
      explanation: "That's correct. A one-time deployment installs selected updates immediately on up to 20 machines."
    - content: "A periodic assessment configured for the selected servers."
      isCorrect: false
      explanation: "That's incorrect. Periodic assessment checks for available updates but doesn't install them."
    - content: "A dynamic scope without an associated maintenance configuration."
      isCorrect: false
      explanation: "That's incorrect. A dynamic scope targets machines for a recurring schedule and doesn't install updates by itself."
  - content: "Contoso needs current compliance information for an Azure VM before approving a deployment. Which action should the team take?"
    choices:
    - content: "Start an on-demand assessment by selecting **Check for updates**."
      isCorrect: true
      explanation: "That's correct. An on-demand assessment retrieves the latest available updates for a running Azure VM."
    - content: "Attach a guest-scope maintenance configuration to the VM."
      isCorrect: false
      explanation: "That's incorrect. A maintenance configuration schedules update installation rather than retrieving current compliance information."
    - content: "Create an action group for the VM in Azure Monitor."
      isCorrect: false
      explanation: "That's incorrect. An action group defines alert responses and doesn't assess available updates."
