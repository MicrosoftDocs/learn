title: Manage source control and code review with GitHub Copilot
summary: >-
  Follow a change from repository setup or clone through branches, pull requests, conflict resolution, and merge.
  Threat-model the change early, evaluate generated tests against requirements, and use Copilot review in GitHub and Azure Repos.
  Define reviewable change contracts, isolate concurrent worktrees, and preserve evidence during repository migration and recovery.
  Use bounded GitHub MCP context and appropriate integration identities while protecting independent repository controls.
