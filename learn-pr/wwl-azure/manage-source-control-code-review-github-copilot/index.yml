abstract: |
  In this module, you learn to:
  - Explain a contribution workflow from repository setup or clone to branch, commit, pull request, merge, and synchronization.
  - Choose branching/worktree boundaries and preserve history, integrations and reviewed recovery during platform transitions.
  - Threat-model application and engineering trust boundaries before reconciling changes and evaluating Copilot review.
  - Define a change contract and review source and test proposals against independent requirements.
  - Apply platform-specific repository instructions without confusing guidance with merge enforcement.
  - Use GitHub MCP evidence and appropriate user, app and workflow identities for bounded repository assistance.
  - Govern contribution, review, and integration through protected repository permissions and policies.
prerequisites: |
  - Familiarity with basic Git concepts, including repositories, commits, and remotes.
  - Familiarity with issues or Azure Boards work items and code changes.
  - Familiarity with automated tests and code review.
  - Basic experience using GitHub Copilot and least-privilege repository access.
