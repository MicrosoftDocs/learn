title: Knowledge check
metadata:
  title: Knowledge check
  description: Assess independent requirements, current PR evidence, worktree boundaries, repository guidance, and least-privilege Copilot assistance.
  ms.date: 11/26/2026
  author: petender
  ms.author: petender
  ms.topic: unit
  module_assessment: true
  ai_generated_module_assessment: true
durationInMinutes: 5
content: '[!include[](includes/8-knowledge-check.md)]

  '
quiz:
  title: Check your knowledge
  questions:
  - content: "Copilot proposes a catalog correction and tests that calculate their expected results using the same helper as the implementation. What should the reviewer do before accepting the change?"
    choices:
    - content: "Accept the tests because agreement with the implementation proves the requirement is satisfied."
      isCorrect: false
      explanation: "Matching implementation logic can reproduce the same defect in both the code and its test expectations."
    - content: "Define expected outcomes from the approved requirement and test available, unavailable, mixed, and empty results independently."
      isCorrect: true
      explanation: "Independent expectations challenge plausible incorrect implementations and verify the agreed visibility and purchase behavior."
    - content: "Replace the assertions with a check that the result contains at least one product."
      isCorrect: false
      explanation: "A nonempty result can contain the wrong products or omit required outcomes."
  - content: "A pull request received approval and passing checks. A later push resolves a conflict and changes the filtering logic. Which evidence is required before merge?"
    choices:
    - content: "Applicable review and verification for the latest PR revision, with the resulting integrated commit retained."
      isCorrect: true
      explanation: "The changed revision can invalidate earlier review and test evidence. Integration must be supported by current, revision-linked results."
    - content: "The earlier passing run, provided it belongs to the same pull request."
      isCorrect: false
      explanation: "A shared PR number does not establish that an earlier run tested the current code."
    - content: "A Copilot summary stating that the conflict resolution is small."
      isCorrect: false
      explanation: "A summary does not replace the required review and execution evidence."
  - content: "Two delegated tasks use separate Git worktrees but both can update the same Azure environment. What boundary do the worktrees provide?"
    choices:
    - content: "They prevent conflicting Azure changes because each task has a separate working directory."
      isCorrect: false
      explanation: "Working-directory isolation does not isolate a shared external environment."
    - content: "They authorize each task to publish changes without repository review."
      isCorrect: false
      explanation: "A worktree does not grant permissions or replace branch policies and required review."
    - content: "They isolate local files; shared-resource writes still need scoped authorization and coordination."
      isCorrect: true
      explanation: "Local isolation supports concurrent contribution, while external mutations require their own permission and concurrency controls."
  - content: "A repository instruction tells Copilot never to merge a change with failing tests. Which mechanism independently enforces that merge boundary?"
    choices:
    - content: "The instruction file, because model guidance guarantees that the rule is followed."
      isCorrect: false
      explanation: "Instructions guide model behavior but are not deterministic merge enforcement."
    - content: "Protected-branch rules or Azure Repos policies with required checks, reviewers, and controlled bypass permissions."
      isCorrect: true
      explanation: "Repository controls enforce integration requirements independently of the assistant's recommendation."
    - content: "The PR description generated by Copilot."
      isCorrect: false
      explanation: "A PR description records context; it does not prevent an unauthorized or unverified merge."
  - content: "Copilot needs GitHub MCP context to assess one repository's pull request. What is the best access design?"
    choices:
    - content: "Provide scoped read access to the required repository evidence and keep merge authority outside the investigation."
      isCorrect: true
      explanation: "Least-privilege evidence access supports the task without giving the investigator unnecessary mutation or approval authority."
    - content: "Grant organization-wide administration so the assistant can resolve any permission issue."
      isCorrect: false
      explanation: "Broad administration expands the task's authority beyond the evidence it needs."
    - content: "Use an unrestricted token and rely only on the prompt to limit its use."
      isCorrect: false
      explanation: "A prompt is not an access-control boundary. Credentials and available tools must enforce the intended scope."
