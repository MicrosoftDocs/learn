title: Describe how Git manages source control
summary: '**Describe how Git manages source control** introduces basic Git concepts, explains their use, and covers the Git commands that help users manage files in the GitHub source control system.'
abstract: |
  After you complete this module, you'll be able to:

  -   Describe basic git concepts.

  -   Explain the difference between Git and GitHub.

  -   Identify the function of basic Git commands.

  -   Explain the function of intermediate Git commands.
prerequisites: A personal computer running Windows, macOS, or Linux.
