title: "Implement identity-based security for Azure Machine Learning workspaces"
summary: This course teaches how to govern AI platforms using Microsoft Entra and Azure Machine Learning, covering security groups, Conditional Access, managed identities, enterprise application integration, and audit logging to continuously monitor, enforce, and improve identity‑centric security for AI workloads.
abstract: |
  After completing this module, you will be able to:
  - Configure Microsoft Entra security groups to organize AI team members and enforce least-privilege access
  - Implement Conditional Access policies that protect Azure Machine Learning workspace access
  - Integrate enterprise applications with Azure Machine Learning using service principals and managed identities
  - Evaluate security posture and access patterns for AI infrastructure using Microsoft Entra audit logs
prerequisites: |
  - Familiarity with Azure Machine Learning workspace concepts and basic RBAC roles
  - Understanding of Microsoft Entra ID fundamentals including users, groups, and authentication
  - Experience navigating the Azure portal and configuring Azure resources
