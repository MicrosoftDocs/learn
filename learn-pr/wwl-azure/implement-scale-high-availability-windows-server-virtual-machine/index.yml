title: Implement scale and high availability with Windows Server VM
summary: |
  This module covers how to implement scaling and high availability for Windows Server virtual machines in Azure. You learn how to describe virtual machine scale sets and their use cases for fluctuating workloads, implement horizontal scaling (adding/removing VMs) and vertical scaling (increasing VM resources) with automated rules based on metrics, configure load-balanced virtual machines using Azure Load Balancer with frontend IP configurations, describe Azure Site Recovery capabilities for disaster recovery and business continuity, and implement Azure Site Recovery to replicate and protect Azure VMs.
abstract: |
  After completing this module, you'll be able to:
  - Describe virtual machine scale sets.
  - Implement scaling.
  - Implement load-balancing virtual machines.
  - Implement Azure Site Recovery.
prerequisites: |
  In order to get the best learning experience from this module, it's important that you have knowledge and experience of the following:
  - Managing the Windows Server operating system (OS) and Windows Server workloads in on-premises scenarios, including Active Directory Domain Services (AD DS), Domain Name System (DNS), the Distributed File System (DFS), Microsoft Hyper-V, and file and storage services.
  - Common Windows Server management tools.
  - Core Microsoft compute, storage, networking, and virtualization technologies.
  - On-premises resiliency Windows Server-based compute and storage technologies.
  - Implementing and managing IaaS services in Azure.
  - Microsoft Entra ID.
  - Security-related technologies (firewalls, encryption, multifactor authentication).
  - Windows PowerShell scripting.
  - Automation and monitoring.
