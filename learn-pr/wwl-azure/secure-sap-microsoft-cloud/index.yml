title: Secure SAP on Microsoft Cloud
summary: In this module, you learn about integrating Azure Identity Services with SAP RISE, implementing single sign-on, transitioning from SAP Identity Management to Microsoft Entra, using Microsoft Security Copilot and Microsoft Sentinel with SAP RISE.
abstract: |
  After completing this module, you’ll be able to:

  -   Understand and configure single sign-on (SSO) with MFA for SAP environments running in ECS/RISE using Microsoft Entra ID.

  -   Manage SAP user lifecycle and authorizations using Microsoft Entra ID Governance.

  -   Utilize Microsoft's Security Copilot for responding to cyber threats and assessing risk exposure.

  -   Implement Microsoft Sentinel solution for SAP and SAP BTP for signal correlation across the enterprise, monitoring, detection, and response to suspicious activities in SAP applications.

  -   Implement SAP LogServ add-on for Microsoft Sentinel solution for SAP to enhance the application layer logs with the logs owned by SAP ECS (infra, database, etc.).

  -   Understand the limitations of Azure Monitor for SAP solutions with SAP RISE/ECS and the alternatives available.
prerequisites: |
  -   Experience using the Azure portal to create resources.

  -   Basic knowledge of security concepts like identities, permissions, and encryption.

  -   Basic knowledge of networking concepts like virtual networks and subnetting.

  -   Basic knowledge of SAP RISE, GROW, and native.
