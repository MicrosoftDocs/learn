title: Troubleshoot on-premises and hybrid networking
summary: |
  This module covers how to troubleshoot on-premises and hybrid networking issues in Windows Server. You learn how to diagnose DHCP problems including server authorization, scope availability, and relay agent configuration, troubleshoot DNS issues including zone data accuracy and AD DS replication, apply a structured IP troubleshooting methodology to isolate connectivity problems, understand routing tables and traffic delivery between networks and subnets, use Packet Monitor to intercept and analyze network packets at multiple stack levels, and use Azure Network Watcher to diagnose and log metrics for virtual networks and IaaS resources.
abstract: |
  After completing this module, you'll be able to:

  -   Diagnose DHCP and DNS problems in on-premises contexts.

  -   Diagnose IP configuration and routing problems.

  -   Implement Packet Monitor to help diagnose network problems.

  -   Use Azure Network Watcher to troubleshoot Microsoft Azure virtual networks.
prerequisites: |
  -   Working knowledge of common Windows Server management tools

  -   Some experience of typical Windows Server workloads

  -   Basic knowledge of Windows PowerShell
