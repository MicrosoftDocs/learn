### YamlMime:ModuleUnit
uid: learn.wwl.configure-ai-ready-infrastructure-microsoft-foundry.knowledge-check
title: "Module assessment"
metadata:
  title: "Module assessment"
  description: "Test your understanding of current Microsoft Foundry resource, project, role, and connection design."
  ms.date: 08/18/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: unit
  ms.custom: references_regions
  module_assessment: true
  ai_generated_module_assessment: false
durationInMinutes: 7
content: "Choose the best response for each of the following questions."
quiz:
  questions:
  - content: "Which component is the top-level governance boundary for networking, security, model deployments, and connections in current Microsoft Foundry?"
    choices:
    - content: "The Foundry resource"
      isCorrect: true
      explanation: "Correct. The Foundry resource contains resource-level governance settings and child projects."
    - content: "An individual Foundry project"
      isCorrect: false
      explanation: "Incorrect. A project is a development boundary for a use case and its project assets."
    - content: "The connected Azure AI Search service"
      isCorrect: false
      explanation: "Incorrect. A connected Azure service remains an independent resource with its own governance boundary."
  - content: "Which role should you assign to developers who need the minimum permissions to build and test applications in an existing Foundry project?"
    choices:
    - content: "Foundry User"
      isCorrect: true
      explanation: "Correct. Foundry User provides the minimum development permissions for building and testing applications."
    - content: "Foundry Account Owner"
      isCorrect: false
      explanation: "Incorrect. Foundry Account Owner can create and manage Foundry resources and projects and is broader than a developer requires."
    - content: "Azure Reader"
      isCorrect: false
      explanation: "Incorrect. Reader provides control-plane visibility but doesn't grant Foundry development data actions."
  - content: "A Foundry agent uses the Azure AI Search tool with keyless authentication. Which identity and roles should you verify when the tool receives a 403 response?"
    choices:
    - content: "Verify that the project managed identity has Search Index Data Contributor and Search Service Contributor on the search service."
      isCorrect: true
      explanation: "Correct. These explicit role assignments authorize the project identity for the documented keyless Foundry agents Azure AI Search tool workflow."
    - content: "Verify that saving the connection automatically assigned Search Index Data Reader to the Foundry resource identity."
      isCorrect: false
      explanation: "Incorrect. Saving a connection doesn't automatically create the required role assignments."
    - content: "Verify that every developer has Owner on the Azure AI Search service."
      isCorrect: false
      explanation: "Incorrect. Owner is excessive and doesn't represent the workload identity used by the connection."
  - content: "How should an Azure AI Search security field store multiple authorized user or group identifiers?"
    choices:
    - content: "As a filterable, nonretrievable Collection(Edm.String) containing an array of identifier strings"
      isCorrect: true
      explanation: "Correct. A filterable string collection supports an `any` expression with `search.in`, and making the field nonretrievable keeps the identifiers out of search results."
    - content: "As one comma-separated Edm.String value"
      isCorrect: false
      explanation: "Incorrect. A comma-separated string isn't a collection and doesn't support the intended collection filter."
    - content: "As an unfilterable numeric field"
      isCorrect: false
      explanation: "Incorrect. Security trimming requires a filterable field that represents the authorized identifiers."
