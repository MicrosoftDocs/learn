metadata:
  title: "Configure AI-Ready Infrastructure with Microsoft Foundry"
  description: "Microsoft Foundry uses a top-level resource and child projects to centralize governance while providing isolated development environments for AI teams."
  ms.date: 08/18/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: azure
title: "Configure AI-ready infrastructure with Microsoft Foundry"
summary: Configure a Microsoft Foundry resource, organize projects, assign appropriate roles, and connect projects securely to Azure services.
abstract: |
  After completing this module, you will be able to:
  - Plan a Microsoft Foundry resource and project structure for multiple AI workloads
  - Assign Microsoft Foundry roles at appropriate resource and project scopes
  - Connect a Foundry project to Azure AI Search
  - Configure managed identity access to connected Azure services
prerequisites: |
  - An active Azure subscription
  - Familiarity with Azure portal navigation and resource management
  - Basic knowledge of Microsoft Entra ID, Azure role-based access control, and Azure AI Search
