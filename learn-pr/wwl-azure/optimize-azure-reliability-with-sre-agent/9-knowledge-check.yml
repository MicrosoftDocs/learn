title: Knowledge check
metadata:
  title: Knowledge check
  description: Assess reliability targets, scoped agent access, governed remediation, recovery verification, and incident learning.
  ms.date: 11/26/2026
  author: petender
  ms.author: petender
  ms.topic: unit
  module_assessment: true
  ai_generated_module_assessment: true
durationInMinutes: 5
content: |
  [!include[](includes/9-knowledge-check.md)]
quiz:
  title: Check your knowledge
  questions:
  - content: "A team defines an SLO of 99.9% successful requests over an agreed measurement window. How should the error budget influence Azure SRE Agent adoption?"
    choices:
    - content: "Treat the agent as a replacement for the SLO because it can investigate incidents."
      isCorrect: false
      explanation: "Agent assistance does not replace explicit reliability targets or their measurement."
    - content: "Use measured reliability and the allowed failure budget to guide operational priorities and release decisions."
      isCorrect: true
      explanation: "SLOs and error budgets connect observed service behavior to the team's tolerance for failure and change."
    - content: "Measure success only by the number of agent conversations completed."
      isCorrect: false
      explanation: "Conversation count does not establish successful user requests or compliance with the reliability target."
  - content: "A team initially permits Azure SRE Agent to diagnose one application's incidents but not change resources. What access design best supports that boundary?"
    choices:
    - content: "Scope the managed identity's resource and telemetry read permissions to the application and withhold remediation write permissions."
      isCorrect: true
      explanation: "Diagnosis and remediation require different authority. Scoped read access supports investigation without authorizing writes."
    - content: "Grant subscription Owner and rely on a diagnosis-only prompt."
      isCorrect: false
      explanation: "A prompt does not constrain the authority granted by broad Azure permissions."
    - content: "Share a human administrator's credentials so the agent can bypass access checks."
      isCorrect: false
      explanation: "Agents should use governed identities and scoped access, not shared administrator credentials."
  - content: "Azure SRE Agent proposes restarting an App Service. The team's policy requires human approval for production writes. What must happen before execution?"
    choices:
    - content: "Execute immediately because a plausible diagnosis is sufficient authorization."
      isCorrect: false
      explanation: "A hypothesis or recommendation is not approval to mutate production."
    - content: "Ignore the team's policy if the agent predicts a short recovery time."
      isCorrect: false
      explanation: "Predicted benefit does not waive an independently configured approval requirement."
    - content: "Review the supporting evidence, exact target and proposed action, then obtain approval and use the permitted execution path."
      isCorrect: true
      explanation: "Reasoning, authorization and execution are separate responsibilities. The approved action must remain within its actual permission boundary."
  - content: "An approved restart command succeeds, but the application's dependency calls still fail. How should the incident status be evaluated?"
    choices:
    - content: "Resolved, because the resource-management command returned success."
      isCorrect: false
      explanation: "Successful execution proves the command completed, not that the user-facing service recovered."
    - content: "Unresolved until fresh workload and dependency evidence verifies recovery; continue bounded investigation or escalate."
      isCorrect: true
      explanation: "Verify the post-action service behavior against the incident's recovery criteria rather than equating command success with recovery."
    - content: "Resolved if the agent's explanation sounds confident."
      isCorrect: false
      explanation: "Confidence is not evidence that requests and dependencies work again."
  - content: "An investigated incident reveals a recurring configuration failure. Which follow-up best reduces future operational toil?"
    choices:
    - content: "Review and retain the evidence, cause, approved remediation and verified outcome, then improve the runbook or prevention controls."
      isCorrect: true
      explanation: "Structured, reviewed incident knowledge supports consistent future response and addresses repeated failure patterns."
    - content: "Delete the timeline once the application appears healthy."
      isCorrect: false
      explanation: "Discarding evidence loses the context needed for incident review and repeatable improvements."
    - content: "Expand the agent's permissions to every subscription so it can act without future review."
      isCorrect: false
      explanation: "Recurring incidents justify better evidence and controls, not unrelated expansion of authority."
