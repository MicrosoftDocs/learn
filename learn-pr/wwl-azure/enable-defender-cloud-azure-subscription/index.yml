title: Enable Defender for Cloud on your Azure subscription
summary: Enable foundational Defender for Cloud capabilities on an Azure subscription, configure Defender for Servers Plan 2, and review resource coverage and Microsoft Cloud Security Benchmark assessments. Consider permissions, trial eligibility, costs, and safe cleanup of training changes.
abstract: |
  By the end of this module, you'll be able to:

  - Enable foundational Defender for Cloud capabilities on an Azure subscription.

  - Select and configure a workload protection plan with appropriate permissions and cost awareness.

  - Review resource coverage and investigate an MCSB assessment.

  - Explain the prerequisites for assigning additional standards and the limits of automated compliance assessment.
prerequisites: |
  Basic familiarity with Azure subscriptions and role-based access control.
  For the hands-on exercise, access to an authorized Azure commercial training subscription with the permissions described in the module.
