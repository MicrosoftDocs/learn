content: |
  [!include[](includes/4-knowledge-check.md)]
quiz:
  questions:
  - content: "You have reviewed costs and have permission to enable Defender for Servers Plan 2. After opening Environment settings, what should you do?"
    choices:
    - content: "Disable all Defender plans."
      isCorrect: false
      explanation: "Incorrect. Disabling plans removes protection rather than enabling the intended Servers plan."
    - content: "Uninstall monitoring extensions from all machines."
      isCorrect: false
      explanation: "Incorrect. Removing monitoring components doesn't enable a workload protection plan."
    - content: "Select the Azure subscription, enable Servers, confirm Plan 2, and save. Then verify resource coverage and relevant component status."
      isCorrect: true
      explanation: "Correct. Enable the required plan at the intended scope. Saving its configuration doesn't prove that every resource is fully onboarded."
  - content: "A team wants to begin assessing the security posture of its Azure resources with Defender for Cloud. Which action is an appropriate first step?"
    choices:
    - content: "Disconnect its Azure subscriptions from Defender for Cloud."
      isCorrect: false
      explanation: "Incorrect. Disconnecting isn't an onboarding action."
    - content: "Avoid connecting its Azure subscriptions for security monitoring."
      isCorrect: false
      explanation: "Incorrect. The Azure resources must be in the connected scope for assessment."
    - content: "Open Defender for Cloud in the Azure portal and confirm the intended subscription."
      isCorrect: true
      explanation: "Correct. This starts foundational Azure onboarding. Workload protection plans and any AWS, GCP, or development-environment connections require their own configuration."
  - content: "A security analyst is tasked with configuring and enabling Microsoft Defender for Cloud within an Azure subscription to monitor and protect cloud resources against security threats. What is the primary function of Microsoft Defender for Cloud?"
    choices:
    - content: "It provides a user interface for managing Azure resources."
      isCorrect: false
      explanation: "Incorrect. While Microsoft Defender for Cloud does have a user interface, its primary function is not to manage Azure resources."
    - content: "It enables the automation of application deployment."
      isCorrect: false
      explanation: "Incorrect. Microsoft Defender for Cloud is not primarily used for automating application deployment."
    - content: "It monitors and protects cloud resources against security threats."
      isCorrect: true
      explanation: "Correct. Microsoft Defender for Cloud is designed to monitor and protect cloud resources against security threats."
  - content: "A security analyst is tasked with securing the company's cloud applications. They are considering using Microsoft Defender for Cloud to unify security management, enhance security posture, and protect workloads. What would be the primary benefit of connecting their Azure subscriptions to Microsoft Defender for Cloud?"
    choices:
    - content: "It allows for automatic updates of Azure applications."
      isCorrect: false
      explanation: "Incorrect. While Microsoft Defender for Cloud does provide many benefits, it does not automatically update Azure applications."
    - content: "It provides a user-friendly interface for managing Azure subscriptions."
      isCorrect: false
      explanation: "Incorrect. Although Microsoft Defender for Cloud does have a user-friendly interface, its primary benefit is not in managing Azure subscriptions."
    - content: "Provides centralized visibility into resource security posture, with continuous assessments and actionable security recommendations."
      isCorrect: true
      explanation: "Correct. Foundational CSPM provides security visibility and recommendations. Additional workload protection depends on the relevant Defender plans and configuration. Connecting a subscription doesn't automatically create or tear down application environments."
  - content: "A compliance control can't be automatically assessed. What does that mean?"
    choices:
    - content: "The control has passed."
      isCorrect: false
      explanation: "Incorrect. An unavailable automated assessment isn't evidence of compliance."
    - content: "The control requires review and appropriate evidence rather than assuming an automated pass."
      isCorrect: true
      explanation: "Correct. Some controls require manual assessment or evidence. The dashboard doesn't certify organizational compliance."
    - content: "All Defender plans must be disabled and enabled again."
      isCorrect: false
      explanation: "Incorrect. Restarting plan configuration doesn't provide the missing compliance evidence."