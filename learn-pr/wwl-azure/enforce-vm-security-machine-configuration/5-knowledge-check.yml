### YamlMime:ModuleUnit
uid: learn.wwl.enforce-vm-security-machine-configuration.knowledge-check
metadata:
  title: Module Assessment
  description: Check your knowledge of Azure VM prerequisites, audit-only security baseline policies, and safe custom Machine Configuration deployment.
  ms.date: 11/07/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  ai-usage: ai-generated
title: Module assessment
durationInMinutes: 3
content: |
  [!include[](includes/5-knowledge-check.md)]
quiz:
  questions:
  - content: "A security engineer assigns the 'Windows machines should meet requirements of the Azure compute security baseline' policy. What two components must be present on an Azure VM for Machine Configuration to evaluate its OS settings?"
    choices:
    - content: "Azure Monitor agent and a data collection rule"
      isCorrect: false
      explanation: "Azure Monitor agent and data collection rules support monitoring and log collection. They aren't prerequisites for Machine Configuration guest OS assessment."
    - content: "Azure Machine Configuration extension and system-assigned managed identity"
      isCorrect: true
      explanation: "An Azure VM needs the Machine Configuration extension and a system-assigned managed identity for authenticated service communication. Arc-enabled servers instead receive the Machine Configuration component and their identity through the Connected Machine agent."
    - content: "Microsoft Defender for Endpoint agent and Guest Attestation extension"
      isCorrect: false
      explanation: "The Defender for Endpoint agent is used for threat detection and vulnerability assessment, and the Guest Attestation extension supports Trusted Launch integrity monitoring. Neither is a prerequisite for Azure Machine Configuration OS baseline compliance evaluation."
  - content: "After admins author and locally test a custom Azure Machine Configuration package, what is the correct sequence of steps to deploy it using Azure Policy?"
    choices:
    - content: "Publish to an accessible HTTPS location, create and import a policy definition referencing the package, then assign the policy"
      isCorrect: true
      explanation: "Azure Blob Storage is the recommended package host, but other suitable HTTPS locations are supported. The definition must reference the correct artifact and access method. Deployment assignments also need the required identity, permissions, and initial remediation for existing machines."
    - content: "Upload the ZIP to Azure Key Vault, reference it in an initiative, then deploy through Defender for Cloud"
      isCorrect: false
      explanation: "Key Vault stores keys, secrets, and certificates. It isn't the configuration ZIP host in this workflow, and Defender for Cloud isn't the custom policy deployment mechanism."
    - content: "Commit the package to a repository and wait for Azure Policy to generate and assign a policy automatically"
      isCorrect: false
      explanation: "Committing a file doesn't by itself generate, import, or assign a policy. A repository can host a downloadable package, but the remaining deployment steps still have to be implemented."
  - content: "Contoso has audited its servers with the built-in Azure compute security baseline policies. How should it automatically correct selected organization-approved settings?"
    choices:
    - content: "Change the built-in baseline policy effect to DeployIfNotExists"
      isCorrect: false
      explanation: "These built-in policies support AuditIfNotExists and Disabled. Their assignment settings don't turn an audit baseline into an enforcement policy."
    - content: "Test a custom AuditAndSet package, generate an ApplyAndAutoCorrect policy, and remediate eligible existing machines after a pilot"
      isCorrect: true
      explanation: "The package must support applying changes. A deployment policy, an authorized assignment identity, and initial remediation cover existing machines. The guest agent then corrects later drift at its evaluation interval."
    - content: "Use a Deny policy to stop the Windows or Linux service inside the guest"
      isCorrect: false
      explanation: "Deny prevents applicable Azure resource operations. It doesn't stop a service or change registry values inside the guest operating system."
