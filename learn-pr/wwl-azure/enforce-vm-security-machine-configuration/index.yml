title: Enforce VM security configuration with Azure Machine Configuration
summary: Audit built-in Windows and Linux security baselines, configure Azure VM and Arc prerequisites, and deploy tested custom configurations to remediate selected OS settings.
abstract: |
  After completing this module, you can:
    - Explore how Azure Machine Configuration audits and enforces OS-level settings using Azure Policy
    - Prepare Azure VMs and Azure Arc-enabled servers for Machine Configuration
    - Assign built-in Windows and Linux security baseline policies to audit operating system settings
    - Author, test, and deploy custom configurations to safely remediate approved settings
prerequisites: |
  Before starting this module, you should have:

  - Understanding of Azure Policy fundamentals, including policy effects and initiative assignments
  - Familiarity with Azure Virtual Machines and Azure Arc-enabled servers
  - Basic understanding of OS configuration concepts for Windows and Linux
  - Access to supported test machines and an Azure subscription with the required policy and role-assignment permissions
  - A disposable Windows test VM with PowerShell 7 and a preinstalled application service for the custom authoring example
  - Az.Resources and its Az.Accounts dependency for Azure policy publication
