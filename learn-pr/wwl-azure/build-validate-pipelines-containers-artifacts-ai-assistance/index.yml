abstract: |
  In this module, you learn how to:
  - Design CI triggers, dependencies, reusable definitions, test evidence, and artifact transfer on both platforms.
  - Build tested container candidates and select dependency feeds, package versions, and image digests.
  - Generate and evaluate build-only YAML, dependency, container, and publication proposals with Copilot.
  - Separate validation workers from privileged publishers and bound runtime agents and remediation.
prerequisites: |
  - Knowledge of Git branches, pull requests, and independent change review.
  - Ability to read basic YAML and application build commands.
  - Familiarity with automated tests and package manifests.
  - Basic knowledge of containers and least-privilege service access.
