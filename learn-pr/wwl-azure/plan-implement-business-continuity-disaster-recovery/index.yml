title: Plan and implement updates, backups, and disaster recovery
summary: You can replicate your virtual machines (VMs) to the secondary location for Azure Virtual Desktop. You use Azure Site Recovery to manage replicating VMs in other Azure locations.
abstract: |
  After completing this module, you'll be able to:

  -   Configure virtual machine (VM) replication for Azure Virtual Desktop.

  -   Configure FSLogix for multiple profile locations.
