title: Guided project - Deploy applications to Azure Kubernetes Service
summary: In this guided project, you provision Azure Container Registry and an Azure Kubernetes Service cluster, build Linux and Windows container images, and deploy them to AKS.
abstract: |
  In this guided project, you practice creating and configuring an Azure Container Registry and an Azure Kubernetes Service cluster. In four hands-on exercises, you:

  -   Provision Azure Container Registry (ACR) and Azure Kubernetes Service (AKS).
  -   Build Linux and Windows container images and store them in Azure Container Registry.
  -   Deploy container images to Azure Kubernetes Service.

  By the end of this guided project, you have hands-on experience creating and configuring these services in Azure.
