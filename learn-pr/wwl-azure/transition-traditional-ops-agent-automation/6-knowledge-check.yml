uid: learn.wwl.transition-traditional-ops-agent-automation.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: "Knowledge check for the agentic DevOps module."
  ms.date: 11/26/2026
  author: petender
  ms.author: petender
  ms.topic: unit
  module_assessment: true
  ai_generated_module_assessment: true
durationInMinutes: 3
quiz:
  title: ""
  questions:
  - content: "An operations team currently writes Bicep templates manually and deploys them using Azure CLI scripts. They want to reduce the coordination overhead between the architecture review, code generation, and deployment stages. Which characteristic of an agentic workflow addresses this challenge?"
    choices:
    - content: "Persistent domain knowledge stored in skill files"
      isCorrect: false
      explanation: "Shared skills supply reusable domain guidance, but they don't coordinate workflow stages or enforce organizational standards."
    - content: "Multi-step orchestration through a conductor agent"
      isCorrect: true
      explanation: "A configured conductor can coordinate specialized agents and validate handoffs, reducing manual sequencing while preserving required approvals and permission boundaries."
    - content: "File-scoped coding guidance supplied by a supporting host"
      isCorrect: false
      explanation: "Applicable instructions guide generated output; they don't guarantee compliance or coordinate workflow stages."
  - content: "Several architecture agents need reusable approved-service and SKU guidance with supporting workflows, without loading every detail into every conversation. Which design best supports this requirement?"
    choices:
    - content: "In the conductor agent's system prompt"
      isCorrect: false
      explanation: "Embedding all domain guidance in the conductor expands its context and doesn't make that guidance independently reusable by the architecture agents."
    - content: "In an instruction file with an applyTo glob pattern"
      isCorrect: false
      explanation: "Scoped instructions provide guidance for matching file context; a shared skill is better suited to packaging this reusable workflow and its supporting resources for on-demand loading."
    - content: "In a shared skill package that the selected host can discover and load when relevant"
      isCorrect: true
      explanation: "Supporting hosts can load shared skill content on demand, automatically or explicitly where supported. Verify availability, the loaded revision, and applicability; the skill itself neither guarantees compliance nor grants execution authority."
  - content: "A multi-agent workflow deploys generated Bicep templates. The team replaces the IaC generator with one that produces Terraform configuration. What must be verified before the deployment stage can consume the new output?"
    choices:
    - content: "That the conductor still delegates to an agent with the same name"
      isCorrect: false
      explanation: "An unchanged agent name doesn't establish that downstream tools can validate or execute a different IaC format."
    - content: "That the artifact, execution, and validation contracts support Terraform, updating downstream tooling and checks where required"
      isCorrect: true
      explanation: "Bicep and Terraform have different execution and validation requirements. Verify compatible formats, tooling, target scope, state handling, and evidence before accepting the handoff."
    - content: "That the Terraform configuration uses the previous Bicep output filename"
      isCorrect: false
      explanation: "Preserving a filename doesn't preserve the artifact format or make a Bicep deployment command compatible with Terraform."
  - content: "A Bicep agent omits required production resource locks. The team adds scoped instructions describing the requirement. What else is needed to prevent a noncompliant change from being accepted?"
    choices:
    - content: "A shared skill with resource lock examples, without a blocking verification step"
      isCorrect: false
      explanation: "Examples can improve proposals, but skill loading and model compliance aren't guaranteed enforcement. A missing lock still needs to be detected by an independent control."
    - content: "An independently enforced required check that validates the lock requirement, with controlled bypass permissions"
      isCorrect: true
      explanation: "Instructions supply guidance; a required validation check and protected acceptance boundary can block noncompliant changes independently of the model."
    - content: "A more emphatic instruction stating that locks must always be included"
      isCorrect: false
      explanation: "Stronger wording doesn't turn natural-language guidance into a deterministic acceptance control."
  - content: "A team is evaluating which operational workflows would benefit most from a multi-agent approach. Which scenario is the strongest candidate?"
    choices:
    - content: "Restarting a single virtual machine after a patch"
      isCorrect: false
      explanation: "Restarting a VM is a simple, one-step operation that doesn't involve multiple stages or domain-specific knowledge coordination. It's better handled as a direct command."
    - content: "Provisioning environments that involve requirements gathering, architecture assessment, IaC generation, deployment, and documentation"
      isCorrect: true
      explanation: "Multi-step workflows where outputs from one stage feed into the next and domain knowledge must be applied consistently are the strongest candidates for agentic orchestration."
    - content: "Querying Azure Monitor for a single metric value"
      isCorrect: false
      explanation: "Querying a single metric is a one-off operation with no multi-step coordination needed. A direct prompt or CLI command is more appropriate."
