quiz:
  title: "Quick review"
  questions:
  - content: "What does a data collection rule define for Azure Monitor Agent?"
    choices:
    - content: "The data to collect, how to process it, and where to send it."
      isCorrect: true
      explanation: "Correct. A data collection rule controls data sources, optional transformations, and destinations."
    - content: "The user accounts that can sign in to the monitored VM."
      isCorrect: false
      explanation: "Incorrect. VM access is managed separately from Azure Monitor data collection."
    - content: "The management packs that Operations Manager installs."
      isCorrect: false
      explanation: "Incorrect. Operations Manager uses management packs, while Azure Monitor Agent uses data collection rules."