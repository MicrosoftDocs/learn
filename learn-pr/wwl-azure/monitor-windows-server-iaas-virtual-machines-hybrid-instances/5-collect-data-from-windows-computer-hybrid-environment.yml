quiz:
  title: "Quick review"
  questions:
  - content: "Which Log Analytics table should an administrator query first to confirm that Azure Monitor Agent is reporting?"
    choices:
    - content: "Heartbeat"
      isCorrect: true
      explanation: "Correct. Recent records in the Heartbeat table confirm that the agent is reporting to the workspace."
    - content: "Event"
      isCorrect: false
      explanation: "Incorrect. The Event table contains collected Windows events, but it might be empty when event collection isn't configured."
    - content: "Perf"
      isCorrect: false
      explanation: "Incorrect. The Perf table contains selected performance counters, but it isn't the primary agent connectivity check."