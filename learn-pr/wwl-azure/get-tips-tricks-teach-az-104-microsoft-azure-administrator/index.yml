title: Get tips and tricks for teaching AZ-104 Microsoft Azure Administrator
summary: Learn tips and tricks about preparing for your first teaching session, which labs to use, when and how to introduce technical topics, as well as other resources and materials.
abstract: |
  After completing this module, you will be able to:
  -   Understand how to utilize the tips and tricks for teaching AZ-104 Microsoft Azure Administrator in the classroom
  -   Leverage the lab environment during the instructional portion of the class
  -   Explain course terminology and technical topics
  -   Discover additional resources and materials to prepare students for success on their Microsoft certification exams
prerequisites: |
  -   Understand the Microsoft Learn for Educators program benefits
  -   Explore how to navigate the Microsoft Learn for Educators portal
  -   Understand how to access the Microsoft Learning Download Center and download content
  -   Understand the resources available through the Microsoft curriculum and teaching materials
  -   Understand the resources available to you help you get prepared to teach Microsoft Fundamentals or Advanced Role-Based curriculum in your classes
  -   Understand the different approaches to curriculum integration
  -   Understand how to integrate content from Microsoft Learn into your Learning Management System
  -   Understand the Microsoft technical training program
  -   Understand how to utilize the built-in accessibility features
  -   Understand using the objective domains when preparing to teach
  -   Understand the exam structure
