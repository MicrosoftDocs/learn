title: Get started with the MongoDB API in Azure Cosmos DB
summary: This Module introduces Azure Cosmos DB for MongoDB accounts. It helps you get started, create your first objects and connect to your account.
abstract: |
  -   Estimate RU/s using the Azure Cosmos DB capacity planner for the Azure Cosmos DB for MongoDB.

  -   Learn about support for different MongoDB features.

  -   Learn how to create accounts, databases, and collections using the Azure Cosmos DB for MongoDB.

  -   Learn how to connect and query using the Azure Cosmos DB for MongoDB.
