title: 'Guided-project: Manage application state and exceptions'
summary: In this guided project, you modify your Langton's Ant code to include exception handling. You learn how to throw and how to handle exceptions in your game buffer code.
abstract: |
  By the end of this module, you should be able to:

  -   Create and exception class.

  -   Use a Try...Catch block.

  -   Throw an exception.

  -   Implement exception handling in your code.
prerequisites: |
  -   Installation of VS Code configured for C# application development, including C# Dev Kit.

  -   Experience with the VS Code editor.

  -   Ability to develop C# console applications that implement business logic using loops, if statements, properties, and methods.

  -   Experience with basic C# syntax rules.
