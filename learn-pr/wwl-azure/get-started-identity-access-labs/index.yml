title: Get started with identity and access labs
summary: Explore the basic usage of Microsoft Entra ID using these interactive labs to create identities and control their access to resources within your cloud.
abstract: |
  After completing this module, you're able to:

  -   Perform basic user management.

  -   Perform basic group management.

  -   Configure basic password protection.

  -   Configure Self-Service Password Reset (SSPR).

  -   Enable basic multifactor authentication (MFA).

  -   Create a basic conditional access policy.
prerequisites: '-   General usability experience with Azure or Microsoft Entra admin tools.'
