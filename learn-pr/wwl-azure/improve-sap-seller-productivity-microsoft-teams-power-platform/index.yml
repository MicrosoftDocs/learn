title: Improve SAP seller productivity with Microsoft Teams and Power Platform
summary: Integrate applications from SAP with the Microsoft 365 applications. Enable productivity and collaboration in &quot;SAP Sales and Service Core&quot; Teams app to support sales by building Power Automate flows.
abstract: |
  After completing this module, you'll be able to:
  - Enable Teams integration with SAP Sales and Service Core.
  - Build a Power Automate flow to embed email details into cards for approval
  - Build a Power Automate flow to send email details to SAP applications.
prerequisites: |
