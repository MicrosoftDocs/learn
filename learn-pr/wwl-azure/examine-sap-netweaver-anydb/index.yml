abstract: |
  After completing this module, you're able to:

  -   Explore SAP NetWeaver with AnyDB on Azure virtual machines and learn to recognize the architecture's components.

  -   Examine a sample functional workflow.
prerequisites: |
  Before taking this training, you should complete:

  -   Azure Administrator (AZ-104) or Azure Infrastructure Solutions (AZ-305) exam.

  -   SAP HANA or NetWeaver training.
