title: Explore governance and manageability for SAP on Azure
summary: This module explores using the Azure Governance collection of concepts and services that are designed to enable management of Azure resources at scale
abstract: |
  After completing this module, you will be able to:

  -   Explore Azure Resource Manager and Azure Resource Manager templates.

  -   Examine role-based access control and Azure Policy.

  -   Explore security and compliance services.
prerequisites: |
  Before taking this training, you should complete:

  -   Azure Administrator (AZ-104) or Azure Infrastructure Solutions (AZ-305) exam.

  -   SAP HANA or NetWeaver training.
