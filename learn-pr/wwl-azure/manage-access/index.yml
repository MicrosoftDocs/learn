title: Manage access for Azure Virtual Desktop
summary: Azure Virtual Desktop uses Azure role-based access controls (RBAC) to assign roles to users and admins. Azure Virtual Desktop has additional roles that let you separate management roles for host pools, app groups, and workspaces.
abstract: |
  After completing this module, you'll be able to:

  -   Describe Azure role-based access controls (RBAC) for Azure Virtual Desktop.

  -   Plan and implement Azure roles and RBAC for Azure Virtual Desktop.

  -   Describe how to configure Azure Virtual Desktop with Intune.
