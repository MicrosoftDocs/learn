title: Troubleshoot business continuity with Microsoft Azure
summary: Businesses rely on data and if systems fail, data backups must be reliable so that data can be recovered. This module covers some of the issues you may encounter when troubleshooting Azure backup and recovery.
abstract: |
  By the end of this module, you'll be able to:
  - Troubleshoot Azure backup and recovery issues
  - Restart a failed backup
prerequisites: |
  - Demonstrate an understanding of the OSI model
  - Demonstrate an understanding of Azure CLI
  - Demonstrate an understanding of PowerShell
  - Know how to run Cloud Shell to run commands
