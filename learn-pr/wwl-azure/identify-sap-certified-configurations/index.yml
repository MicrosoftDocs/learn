title: Identify SAP-certified configurations
summary: Help identify prerequisites, deployment options, and SAP-certified configurations available to you when deploying SAP products in Azure.
abstract: |
  After completing this module, you will be able to:

  -   Explore general prerequisites for SAP support in public cloud environments.

  -   Discover SAP certifications and configurations running on Microsoft Azure.
prerequisites: |
  Before taking this training, you should complete:

  -   Azure Administrator (AZ-104) or Azure Infrastructure Solutions (AZ-305) exam.

  -   SAP HANA or NetWeaver training.
