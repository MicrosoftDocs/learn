uid: learn.wwl.just-enough-administration-windows-server
metadata:
  title: Just Enough Administration in Windows Server
  description: "Learn how to configure Just Enough Administration (JEA) in Windows Server to restrict PowerShell remoting sessions to specific cmdlets, parameters, and values using role capability files and session configuration files."
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: windows-server
title: Just Enough Administration in Windows Server
summary: |
  This module covers how to configure and use Just Enough Administration (JEA) to restrict administrative access in Windows Server. You learn how JEA uses PowerShell remoting with virtual accounts to limit users to specific cmdlets, parameters, and values, define role capabilities and session configuration files to control what actions are available in a JEA session, and create and connect to JEA endpoints for constrained administrative tasks such as restarting services or deploying containers.
abstract: |
  After completing this module, you'll be able to:
  - Explain the concept of Just Enough Administration (JEA)
  - Define role group capabilities and session configurations for a JEA session
  - Create and connect to a JEA endpoint
prerequisites: |
  - Familiarity with PowerShell commands and syntax
  - Experience using PowerShell to administer Windows Server
  - Ability to create and edit PowerShell scripts
  - Ability to enable remote management and connect to a remote system
