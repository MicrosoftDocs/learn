title: Automate Azure Virtual Desktop management tasks
summary: Reduce Azure Virtual Desktop deployment costs by scaling virtual machines (VMs). This means shutting down and deallocating session host VMs during off-peak usage hours, then turning them back on and reallocating them during peak hours.
abstract: |
  Disaster Recovery for Azure Virtual DesktopAfter completing this module, you'll be able to:
  *  Describe how to scale session hosts using Azure Automation.
  *  Create or update an Azure Automation account.
  *  Create an Azure Automation Run As account.
  *  Create the Azure Logic App and execution schedule.
prerequisites: |
  None
