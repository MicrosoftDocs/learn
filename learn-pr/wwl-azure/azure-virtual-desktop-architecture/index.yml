title: Azure Virtual Desktop Architecture
summary: Azure Virtual Desktop manages the infrastructure and brokering components, while customers manage their own desktop host virtual machines (VMs) and clients. Microsoft manages the Remote Connection Gateway, and Connection Broker services as part of Azure.
abstract: |
  After completing this module, you'll be able to:
  *  Explain the Azure Virtual Desktop components.
  *  Describe the Azure Virtual Desktop architecture.
  *  Choose between personal and pooled desktops.
  *  Identify the Azure limitations for Azure Virtual Desktop.
  *  Describe the options for Azure Virtual Desktop pricing.
prerequisites: |
  None
