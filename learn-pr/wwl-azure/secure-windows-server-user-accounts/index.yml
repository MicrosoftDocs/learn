uid: learn.wwl.secure-windows-server-user-accounts
metadata:
  title: Secure Windows Server user accounts
  description: "Learn how to secure Active Directory user accounts using least privilege, Protected Users group, authentication policy silos, Windows Defender Credential Guard, NTLM blocking, and account remediation techniques."
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: windows-server
title: Secure Windows Server user accounts
summary: |
  This module covers how to secure user accounts in an Active Directory environment. You learn how to configure user account rights following least privilege, use the Protected Users group and authentication policy silos to limit authentication scope for privileged accounts, configure Windows Defender Credential Guard hardware prerequisites and deployment, implement NTLM blocking by auditing NTLM traffic and then configuring deny policies, and locate and remediate problematic accounts such as inactive users and accounts with permanent passwords.
abstract: |
  After completing this module, you'll be able to:
  *   Configure and manage user accounts to limit security threats across an organization
  *   Apply Protected Users settings, policies, and authentication silos to protect highly privileged user accounts
  *   Describe and configure Windows Defender Credential Guard
  *   Configure Group Policy to block the use of NTLM for authentication
prerequisites: |
  *   Familiarity with managing Active Directory Domain Services security principals
  *   Ability to edit Active Directory Group Policy settings
  *   Experience performing basic Windows Server administration tasks
