title: Troubleshoot Active Directory
summary: |
  This module covers how to troubleshoot Active Directory Domain Services (AD DS) and hybrid authentication issues. You learn how to recover deleted objects using tombstone reanimation with Ldp.exe or Active Directory Recycle Bin, manage and recover the AD DS database (Ntds.dit) using NtdsUtil, perform authoritative restore of SYSVOL for Group Policy recovery, troubleshoot AD DS replication across domain, configuration, schema, and application partitions, and diagnose hybrid authentication issues with Microsoft Entra Connect including directory synchronization, password hash sync, and pass-through authentication.
abstract: |
  After completing this module, you'll be able to:

  -   Recover the AD DS database, objects in AD DS, and SYSVOL

  -   Troubleshoot AD DS replication

  -   Troubleshoot Hybrid authentication issues
prerequisites: |
  -   Working knowledge of common Windows Server management tools

  -   Some experience of typical Windows Server workloads

  -   Basic knowledge of Windows PowerShell
