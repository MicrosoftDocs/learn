title: Discover DevOps
summary: Optimize application lifecycle management through DevOps practices such as collaboration, continuous learning, agility, and automation. Your organization benefits from accelerated time to market, stability and reliability in operations, and minimize mean time to recovery.
abstract: |
  Upon completion of this module, you'll be able to:
  *   Describe the DevOps approach.
  *   Explore best practices for fostering DevOps culture.
  *   Identify DevOps goals and benefits.
  *   Understand the DevOps application lifecycle.
prerequisites: |
  *   Basic familiarity with IT terms and concepts
