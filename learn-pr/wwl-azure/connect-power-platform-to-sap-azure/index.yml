title: Connect Power Platform to SAP on Azure
summary: After this module you will be able to Connect Power BI Desktop to SAP HANA on a Windows computer and connect Power Automate and Power Apps to SAP systems.
abstract: |
  - Describe the technologies and conceptual layers that allow Power Platform integration with SAP, including the On-premises data gateway.
  - Connect Power BI Desktop to SAP HANA on a Windows computer
  - Connect Power Automate and Power Apps to SAP systems
  - Describe and implement Microsoft Power Platform security and management policies, and monitor users and developers
prerequisites: |
  Basic understanding of the Microsoft Power Platform. AZ-104 certification or equivalent knowledge. Knowledge of SAP products such as SAP HANA or SAP NetWeaver.
