summary: This module covers monitoring of data from several Azure systems and tools to support SAP on Azure workloads.
abstract: |
  After completing this module, you will be able to:

  -   Examine monitoring, logging, and alerting services.

  -   Explore Azure Monitor and Log Analytics.

  -   Explore operating system and workload updates for Azure virtual machines.
prerequisites: |
  Before taking this training, you should complete:

  -   Azure Administrator (AZ-104) or Azure Infrastructure Solutions (AZ-305) exam.

  -   SAP HANA or NetWeaver training.
