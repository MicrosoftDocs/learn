title: Guided project - Administer Active Directory Domain Services
summary: |
  This guided project helps prepare you to manage Active Directory Domain services, including:
  - Creating and deploying domains.
  - Configuring group policy objects.
  - Establishing and enforcing passwords.
  - Maintaining security of Active Directory.

  [!INCLUDE [](../../includes/wwl/guided-project-notes.md)]
abstract: |
  In this module, you'll practice how to:

  -   Configure domain controller operations.

  -   Configure user management operations.

  -   Manage password policies.

  -   Configure security settings.
prerequisites: |
  Knowledge of and experience working with:

  -   Windows Server.

  -   Core networking technologies.
