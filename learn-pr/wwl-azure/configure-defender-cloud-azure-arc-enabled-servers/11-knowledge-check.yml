quiz:
  title: "Check your knowledge"
  questions:
  - content: "An organization needs Microsoft Defender for Endpoint integration and file integrity monitoring for its on-premises Azure Arc-enabled servers. Which Defender for Servers plan should the organization enable?"
    choices:
    - content: "Defender for Servers Plan 1"
      isCorrect: false
      explanation: "Incorrect. Plan 1 includes Microsoft Defender for Endpoint integration, but it doesn't include file integrity monitoring."
    - content: "Defender for Servers Plan 2"
      isCorrect: true
      explanation: "Correct. Plan 2 includes Microsoft Defender for Endpoint integration and file integrity monitoring for supported Azure Arc-enabled servers."
    - content: "Foundational CSPM"
      isCorrect: false
      explanation: "Incorrect. Foundational CSPM provides posture-management capabilities but doesn't provide Defender for Servers workload protection."
  - content: "Which Defender for Servers Plan 2 capability doesn't support on-premises Azure Arc-enabled servers?"
    choices:
    - content: "Agentless malware scanning"
      isCorrect: true
      explanation: "Correct. Agentless machine scanning supports Azure VMs and connected AWS and Google Cloud compute instances, but not on-premises Azure Arc-enabled servers."
    - content: "File integrity monitoring"
      isCorrect: false
      explanation: "Incorrect. Plan 2 supports file integrity monitoring on Azure Arc-enabled servers."
    - content: "Operating-system update assessment"
      isCorrect: false
      explanation: "Incorrect. Plan 2 supports operating-system update assessment on Azure Arc-enabled servers."
  - content: "An administrator needs to verify Azure Arc connectivity and Defender for Servers coverage for an on-premises server. Which two checks provide the most direct evidence?"
    choices:
    - content: "Confirm that azcmagent show reports Connected and that the server appears in Defender for Cloud inventory"
      isCorrect: true
      explanation: "Correct. The local agent status verifies the Azure Arc connection, and the Defender for Cloud inventory verifies that Defender for Cloud recognizes the resource."
    - content: "Confirm that the server appears in Microsoft Entra ID and that Azure Monitor has a workspace"
      isCorrect: false
      explanation: "Incorrect. Neither check directly verifies the Azure Arc connection and Defender for Servers coverage."
    - content: "Confirm that the administrator has the Owner role and that the server responds to a network ping"
      isCorrect: false
      explanation: "Incorrect. The Owner role isn't required for onboarding, and a network ping doesn't verify Azure Arc or Defender for Servers status."