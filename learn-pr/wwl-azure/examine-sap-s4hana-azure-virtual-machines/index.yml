summary: Examine the architecture when deploying SAP S/4HANA workloads and in-memory SAP HANA databases, running on Azure VMs.
abstract: |
  After completing this module, you're able to:

  -   Explore SAP S/4HANA on Azure virtual machines and learn to recognize the architecture's components.

  -   Examine a sample functional workflow.
prerequisites: |
  Before taking this training, you should complete:

  -   Azure Administrator (AZ-104) or Azure Infrastructure Solutions (AZ-305) exam.

  -   SAP HANA or NetWeaver training.
