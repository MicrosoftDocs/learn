title: Create and manage Active Directory objects
summary: |
  This module covers how to create and manage the core objects in Active Directory Domain Services (AD DS). You learn how to create and configure user accounts, security groups, organizational units (OUs), and managed service accounts including group managed service accounts (gMSA). You also perform bulk management tasks such as moving accounts and forcing password resets, and maintain domain controller availability through multi-master replication, Active Directory Recycle Bin, and authoritative and nonauthoritative restore operations.
abstract: |
  By the end of this module, you'll be able to:

  -   Define users, groups, and computers.

  -   Define organizational units.

  -   Manage objects and their properties in Active Directory.

  -   Create objects in Active Directory.

  -   Configure objects in Active Directory.

  -   Perform bulk management tasks for user accounts.

  -   Maintain Active Directory Domain Services domain controllers.
prerequisites: |
  Knowledge of and experience working with:

  -   Windows Server.

  -   Core networking technologies.
