title: Introduction to NumPy for data science
summary: Learn about how to use NumPy for data science. Create, index, and sort arrays.
abstract: |
  In this module, you will:
  - Import the NumPy Python library into your VS Code Jupyter Notebook
  - Learn how NumPy arrays compare to Python lists
  - Learn how to use NumPy arrays for large in-memory datasets
  - Explore NumPy functions for arrays and simple data manipulation

  This module is complimentary content for Microsoft Reactor Workshops.
  
prerequisites: |
  - Introduction to Python for data science
