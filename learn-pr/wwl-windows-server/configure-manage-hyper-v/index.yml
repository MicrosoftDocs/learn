title: Configure and manage Hyper-V
summary: |
  This module covers how to install and configure the Hyper-V role in Windows Server. You learn how to prepare Hyper-V hosts following best practices, use Hyper-V Manager for VM and host management, create and configure virtual switches (external, internal, and private) with VLAN support, implement advanced networking features including NIC Teaming, SR-IOV, bandwidth management, DHCP Guard, port mirroring, and Switch Embedded Teaming (SET), and configure nested virtualization for running Hyper-V inside a VM.
abstract: |
  After completing this module, you'll be able to:
  - Describe the functionality and features of Hyper-V on Windows Server.
  - Install Hyper-V on Windows Server.
  - Describe the options for managing Hyper-V virtual machines (VMs) on Windows Server.
  - Describe networking features and functionality in Hyper-V on Windows Server.
  - Create virtual switches (vSwitches) for use with Hyper-V.
  - Describe using nested virtualization in Hyper-V.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server.
  - Working with virtualization technologies.
