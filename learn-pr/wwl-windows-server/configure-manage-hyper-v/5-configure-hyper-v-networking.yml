quiz:
  title: "Quick review"
  questions:
  - content: "What type of virtual switches facilitate communication between the VMs running on the same Hyper-V host, but not between the VMs and the Hyper-V host?"
    choices:
    - content: "External"
      isCorrect: false
      explanation: "Incorrect. An external virtual switch binds to a physical network adapter to connect VMs to a wired physical network. The management operating system can also share that adapter when the sharing option is enabled. This isn't the VM-only isolation described in the question."
    - content: "Internal"
      isCorrect: false
      explanation: "Incorrect. An Internal virtual switch is used to communicate between each of the VMs on a Hyper-V host, and to communicate between the VMs and the Hyper-V host."
    - content: "Private"
      isCorrect: true
      explanation: "Correct. A Private virtual switch facilitates communication between the VMs on the same Hyper-V host but not between the VMs and the Hyper-V host. It can be used only by the virtual machines that run on the physical host."