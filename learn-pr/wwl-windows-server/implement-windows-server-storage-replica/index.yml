uid: learn.wwl.implement-windows-server-storage-replica
metadata:
  title: Implement Windows Server Storage Replica
  description: "Learn how to implement Storage Replica in Windows Server for block-level, synchronous or asynchronous volume replication across servers or sites for disaster recovery and high availability."
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: windows-server 
title: Implement Windows Server Storage Replica
summary: |
  This module covers how to implement Storage Replica in Windows Server for disaster recovery and high availability. You learn how Storage Replica performs block-level replication between volumes using replication groups and partnerships, choose between synchronous and asynchronous replication modes, configure stretch failover clusters spanning two physical sites, validate prerequisites with Test-SRTopology, and deploy replication using Windows Admin Center or PowerShell with New-SRPartnership.
abstract: |
  After completing this module, you'll be able to:
  - Describe the functionality and components of Storage Replica.
  - Describe the prerequisites for implementing Storage Replica.
  - Implement Storage Replica.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server systems administration.
  - Core networking technologies.
  - Fundamental knowledge of Windows Server File Server role.
