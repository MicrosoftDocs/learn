title: Describe Windows Server administration tools
summary: |
  This module covers the tools available for administering Windows Server in on-premises and remote scenarios. You learn how to install and use Windows Admin Center for web-based server management, use Server Manager for role and feature management, install and configure Remote Server Administration Tools (RSAT) on Windows client operating systems, and use Windows PowerShell remoting with WinRM to run commands and scripts against remote servers.
abstract: |
  After completing this module, you'll be able to:
  - Describe Windows Admin Center.
  - Describe how to use Remote Server Administration Tools (RSAT) to manage servers.
  - Describe Server Manager.
  - Describe how to use Windows PowerShell to manage servers.
  - Explain how to use Windows PowerShell to remotely administer a server.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server.
  - Basic security best practices.
  - Windows client operating systems such as Windows 10.
  - Working with command-line tools.
