quiz:
  title: "Check your knowledge"
  questions:
  - content: "Which of the following server management tools can be run on Server Core?"
    choices:
    - content: "Server Manager"
      isCorrect: false
      explanation: "Incorrect. You can't run Server Manager on Server Core as Server Manager is a graphical tool."
    - content: "System Information"
      isCorrect: true
      explanation: "Correct. This tool enables you to observe system information about the Server Core deployment."
    - content: "Windows Admin Center"
      isCorrect: false
      explanation: "Incorrect. You can't run Windows Admin Center on Server Core as it requires a web browser interface."
  - content: "An administrator plans a Windows Server 2025 Server Core VM. Which allocation meets the documented Server Core RAM minimum before the administrator adds capacity for server roles and applications?"
    choices:
    - content: "512 MB"
      isCorrect: false
      explanation: "Incorrect. Windows Server 2025 Server Core has a documented minimum of 2 GB. A 512-MB allocation is below that baseline."
    - content: "800 MB"
      isCorrect: false
      explanation: "Incorrect. An 800-MB allocation doesn't meet the documented Windows Server 2025 Server Core RAM minimum. Setup and workload requirements can also require additional memory."
    - content: "2 GB"
      isCorrect: true
      explanation: "Correct. The documented Windows Server 2025 Server Core minimum is 2 GB. The administrator uses this as a baseline and allocates additional memory for setup, roles, and applications as needed."
  - content: "An administrator needs to automate Windows Server 2025 Setup settings across several new servers. Which tool creates and validates the XML answer file for the target Windows image?"
    choices:
    - content: "Windows System Image Manager (Windows SIM)"
      isCorrect: true
      explanation: "Correct. Windows SIM creates answer files using the target image's settings and validates them against that image before deployment."
    - content: "Deployment Image Servicing and Management (DISM)"
      isCorrect: false
      explanation: "Incorrect. DISM provides image inspection, servicing, capture, and application capabilities. It isn't the answer-file authoring and validation tool."
    - content: "Windows Preinstallation Environment (Windows PE)"
      isCorrect: false
      explanation: "Incorrect. Windows PE provides a bootable environment for deployment and recovery tools. It doesn't create and validate Windows Setup answer files."