metadata:
  title: Implement high availability of Windows Server VMs
  description: "Learn how to implement high availability for Hyper-V virtual machines using host clustering, guest clustering, Network Load Balancing, live migration with CredSSP or Kerberos authentication, and storage migration."
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: module
  ms.service: windows-server
title: Implement high availability of Windows Server VMs
summary: |
  This module covers how to implement high availability for Hyper-V virtual machines in Windows Server. You learn how to choose between host clustering, guest clustering, and Network Load Balancing (NLB) for different workload types, configure and perform live migration to move running VMs between Hyper-V hosts using CredSSP or Kerberos authentication, and perform storage migration to relocate VM virtual hard disk files without downtime.
abstract: |
  After completing this module, you'll be able to:
  - Describe the Hyper-V high availability options.
  - Describe Hyper-V VMs load balancing.
  - Implement Hyper-V VMs live migration.
  - Implement Hyper-V VMs storage migration.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server systems administration.
  - Core networking technologies.
  - Windows Server Hyper-V fundamentals.
