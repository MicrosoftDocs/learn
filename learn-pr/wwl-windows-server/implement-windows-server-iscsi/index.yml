title: Implement Windows Server iSCSI
summary: |
  This module covers how to implement iSCSI block storage in Windows Server. You learn how iSCSI uses standard TCP/IP networks to provide SAN functionality without specialized cabling, install and configure the iSCSI Target Server role service and create virtual disks using PowerShell, connect iSCSI initiators to targets, and configure network redundancy using Multiple Connections per Session (MCS) and Multipath I/O (MPIO) with load balancing policies.
abstract: |
  After completing this module, you'll be able to:

  -   Describe iSCSI functionality, components, and use cases.

  -   Describe the considerations for implementing iSCSI.

  -   Implement iSCSI.

  -   Describe implementing high-availability iSCSI configurations.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:

  -   Windows Server 2012 or Windows Server 2016.

  -   Core networking technologies.

  -   Fundamental knowledge of Windows Server File Server role.
