title: Manage advanced features of AD DS
summary: |
  This module covers advanced Active Directory Domain Services (AD DS) administration tasks. You learn how to create and manage trust relationships including external, forest, and realm trusts, implement Enhanced Security Administrative Environment (ESAE) forests to protect privileged accounts using the clean-source principle, monitor and troubleshoot AD DS replication using Performance Monitor, Repadmin.exe, and Dcdiag.exe, and create custom AD DS application partitions using NtdsUtil.exe.
abstract: |
  After completing this module, you'll be able to:
  - Identify the purpose, types, and the process of creating trust relationships.
  - Describe the purpose and the process of implementing ESAE forests.
  - Monitor and troubleshoot AD DS replication.
  - Identify the purpose and the process of creating custom AD DS partitions.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server 2012 or Windows Server 2016
  - Core networking technologies
  - Implementing and managing Active Directory Domain Services (AD DS)
