title: Configure and manage Hyper-V virtual machines
summary: |
  This module covers how to configure and manage Hyper-V virtual machines in Windows Server. You learn how to choose between Generation 1 and Generation 2 VMs, work with VHD and VHDX virtual hard disk formats, configure VM hardware settings including processors, memory, NUMA topology, and virtual TPM, select storage options such as local disks, Fibre Channel SANs, and SMB 3.0 file shares, and implement shared VHDs and VHD Sets for guest failover clustering.
abstract: |
  After completing this module, you'll be able to:
  - Describe settings, configuration, and generation versions available for VMs in Windows Server.
  - Identify virtual hard disk (VHD) formats and types.
  - Create and configure a VM.
  - Determine storage options for VMs.
  - Describe shared VHDs and VHD Sets.
  - Describe host and guest clustering with shared VHDs.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server.
  - Working with virtualization technologies.
