title: Manage AD DS domain controllers and FSMO roles
summary: |
  This module covers how to deploy and manage AD DS domain controllers and FSMO roles. You learn how to deploy domain controllers in on-premises environments using Server Manager and the AD DS Configuration Wizard, maintain domain controller availability through backup and recovery procedures, manage the global catalog role and its placement across sites, understand and manage the five FSMO roles (schema master, domain-naming master, RID master, infrastructure master, and PDC emulator), transfer FSMO roles between domain controllers and seize roles in emergency scenarios, and manage and extend the AD DS schema.
abstract: |
  After completing this module, you'll be able to:
  - Deploy AD DS domain controllers.
  - Maintain AD DS domain controllers.
  - Describe the AD DS global catalog role and its placement considerations.
  - Describe AD DS operations master roles, their placement considerations, and their management tasks.
  - Describe AD DS schema and its management tasks.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Windows Server 2012 or Windows Server 2016.
  - Core networking technologies.
  - Active Directory Domain Services (AD DS).
