title: Deploy and manage DHCP
summary: |
  This module covers how to deploy and manage Dynamic Host Configuration Protocol (DHCP) in Windows Server. You learn how DHCP automates IP configuration using the four-step lease process (DISCOVER, OFFER, REQUEST, ACK) and lease renewal, install and configure the DHCP Server role including server authorization in AD DS, configure DHCP options at the server, scope, and reservation levels for DNS servers, default gateways, and other settings, create and manage DHCP scopes with address ranges, exclusions, and reservations, select high availability options including DHCP Failover with hot standby and load balance modes, and implement DHCP Failover for fault tolerance across multiple DHCP servers.
abstract: |
  After completing this module, you'll be able to:

  -   Describe the DHCP Server role.

  -   Install and configure the DHCP Server role.

  -   Configure DHCP options.

  -   Create and configure a DHCP scope.

  -   Describe high availability options for DHCP.

  -   Describe DHCP Failover and explain how to configure it.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:

  -   Active Directory Domain Services concepts and technologies.

  -   Windows Server.

  -   Core networking technologies.

  -   Windows client operating systems such as Windows 10.
