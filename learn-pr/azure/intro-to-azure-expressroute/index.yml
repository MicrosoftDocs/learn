title: Introduction to Azure ExpressRoute
summary: Azure ExpressRoute provides private connectivity between on-premises networks and Microsoft cloud services. Learn how it works, when it meets your organization's needs, and how it differs from Azure VPN connectivity. Microsoft 365 connectivity is available only in specific, Microsoft-authorized scenarios.
abstract: |
  In this module, you will:
  - Learn what Azure ExpressRoute is and the functionality it provides.
  - Determine whether Azure ExpressRoute meets the needs of your organization.
  - Understand the difference between Azure ExpressRoute and Azure VPNs. 
prerequisites: |
  Understanding of basic networking concepts.
