quiz:
  title: Module assessment
  questions:
    - content: Your employer Adatum has branch offices in Auckland and Seattle. Each office connects through a provisioned ExpressRoute Premium circuit with Azure private peering at a different Global Reach-supported peering location. Which feature can you configure to exchange traffic between the two on-premises networks over Microsoft's global network rather than the public internet?
      choices:
        - content: Site-to-site VPN
          isCorrect: false
          explanation: Incorrect. Site-to-site VPNs usually use the public internet, and they aren't a feature of Azure ExpressRoute.
        - content: ExpressRoute Global Reach
          isCorrect: true
          explanation: Correct. ExpressRoute Global Reach links the eligible circuits' private peerings so that the on-premises networks can exchange traffic over Microsoft's network. Both circuits require Premium because this connection crosses geopolitical regions.
        - content: ExpressRoute Direct
          isCorrect: false
          explanation: Incorrect. ExpressRoute Direct provides private connectivity into Microsoft's network through dedicated port pairs. Choosing Direct doesn't itself link the two on-premises networks. ExpressRoute Global Reach provides that intersite connectivity.
    - content: At which of the following Open Systems Interconnection (OSI) model layers does ExpressRoute provide connectivity between hosts on an on-premises network and IaaS virtual machine hosts on an Azure virtual network?
      choices: 
        - content: OSI Layer 1
          isCorrect: false
          explanation: Incorrect. ExpressRoute doesn't provide connectivity between hosts on an on-premises network at OSI Layer 1.          
        - content: OSI Layer 2
          isCorrect: false
          explanation: Incorrect. ExpressRoute doesn't provide connectivity between hosts on an on-premises network at OSI Layer 2.          
        - content: OSI Layer 3
          isCorrect: true
          explanation: Correct. ExpressRoute provides Layer 3 IP connectivity between the on-premises network and Azure. It doesn't extend Layer 2 Ethernet connectivity between the hosts.
    - content: Several users at Adatum work remotely using laptops with cellular internet connections. These users visit Adatum's on-premises sites only once or twice a month. Which of the following methods should these users use to connect to resources in Azure?
      choices:
        - content: Azure ExpressRoute
          isCorrect: false
          explanation: Incorrect. Azure ExpressRoute isn't an appropriate option for individual hosts that need to securely access Azure resources, but only connect intermittently to on-premises networks.      
        - content: Site-to-site VPN
          isCorrect: false
          explanation: Incorrect. A site-to-site VPN isn't an appropriate option for individual hosts that need to securely access Azure resources, but only connect intermittently to on-premises networks.      
        - content: Point-to-site VPN
          isCorrect: true
          explanation: Correct. A point-to-site VPN is an appropriate for individual hosts that need to securely access Azure resources, but only connect intermittently to on-premises networks.
          


        
