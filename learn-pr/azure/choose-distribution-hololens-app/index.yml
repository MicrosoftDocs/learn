title: Choose a distribution channel for a HoloLens app
summary: "Explore distribution channels for HoloLens apps and analyze which channel is best for your app."
abstract: |
  By the end of this module, you'll be able to:
    -	Understand the available distribution options for HoloLens 2 apps.
    -	Explore the advantages and considerations of distributing HoloLens 2 apps via the Microsoft Store.
    -	Evaluate the benefits and use cases of sideloading HoloLens 2 apps.
    -	Gain insights into managing updates for HoloLens 2 apps.

prerequisites: "Although this module has no requirements, you're encouraged to have a HoloLens 2 application complete and ready for distribution."
