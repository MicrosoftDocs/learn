title: Govern your hybrid and multicloud machines through Azure Arc-enabled servers
summary: Azure Arc promises to bridge the gap between on-premises and cloud environments. Azure Arc extends the consistent security, observability, and governance of the Azure platform to non-Azure machines. In this module, you learn about governance of Azure Arc-enabled servers.
abstract: |
  After you complete this module, you're able to:
    - Explain how Azure Policy and Azure Machine Configuration audit and configure Azure Arc-enabled servers.
    - Use policy initiatives and remediation tasks to onboard management services at scale.
    - Describe AMA-based Azure Change Tracking and Inventory and assess and schedule updates with Azure Update Manager.
    - Describe how Azure Automation runs operational tasks with extension-based Hybrid Runbook Workers.
prerequisites: |
  Before starting this module, you should be familiar with:

  - Basic characteristics of Azure services and Azure Arc
  - Compute, storage, networking, and virtualization technologies
  - Basic Windows Server and Linux administration tasks
