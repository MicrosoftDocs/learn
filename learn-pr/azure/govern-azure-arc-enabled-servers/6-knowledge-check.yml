content: |
  [!include[](includes/6-knowledge-check.md)]
quiz:
  questions:
  - content: Fabrikam wants to assign several related governance policies together and track their compliance across a group of Arc-enabled servers. Which Azure capability should it use?
    choices:
    - content: An Azure Policy initiative
      isCorrect: true
      explanation: Correct. An initiative groups related policy definitions so that they can be assigned and monitored together.
    - content: A Log Analytics workspace
      isCorrect: false
      explanation: Incorrect. A workspace stores and analyzes log data; it doesn't group or assign policy definitions.
    - content: An Azure Update Manager maintenance configuration
      isCorrect: false
      explanation: Incorrect. A maintenance configuration defines update scheduling, not a group of governance policy definitions.
    - content: An Azure Automation Hybrid Runbook Worker group
      isCorrect: false
      explanation: Incorrect. A worker group provides targets for runbook execution; it doesn't group policy definitions.
  - content: Which statement describes the Windows machines should meet requirements of the Azure compute security baseline policy used in this module?
    choices:
    - content: It audits settings and reports noncompliance without automatically correcting those settings.
      isCorrect: true
      explanation: Correct. This policy uses the AuditIfNotExists effect to report noncompliant settings without changing them.
    - content: It automatically corrects every noncompliant setting.
      isCorrect: false
      explanation: Incorrect. The baseline reports noncompliance but doesn't automatically remediate it.
    - content: It replaces Azure Update Manager for operating system patching.
      isCorrect: false
      explanation: Incorrect. The baseline audits configuration; Azure Update Manager manages operating system updates.
    - content: It applies only to native Azure virtual machines.
      isCorrect: false
      explanation: Incorrect. The policy also evaluates supported Arc-enabled servers when the Include Arc connected servers parameter is true.
  - content: Which service should you use to assess and schedule operating system updates for Azure Arc-enabled servers?
    choices:
    - content: Azure Update Manager
      isCorrect: true
      explanation: Correct. Azure Update Manager assesses and manages updates for supported Azure VMs and Arc-enabled servers.
    - content: Azure Change Tracking and Inventory
      isCorrect: false
      explanation: Incorrect. Change Tracking and Inventory records configuration changes and inventory; it doesn't schedule operating system patch installation.
    - content: Azure Monitor Agent
      isCorrect: false
      explanation: Incorrect. Azure Monitor Agent collects monitoring data; Azure Update Manager doesn't depend on it.
    - content: Azure Machine Configuration
      isCorrect: false
      explanation: Incorrect. Machine Configuration audits and configures settings; Azure Update Manager is the service for this update-management scenario.
  - content: Which deployment should Fabrikam use to run an Azure Automation runbook directly on an Arc-enabled server?
    choices:
    - content: An extension-based Hybrid Runbook Worker (V2) in a worker group
      isCorrect: true
      explanation: Correct. The worker executes the runbook on a machine in the selected group. Use a group containing only the target server when execution must occur on that server.
    - content: An Azure Automation cloud sandbox
      isCorrect: false
      explanation: Incorrect. A cloud sandbox executes the job in Azure, not directly on the Arc-enabled server.
    - content: An Azure Monitor Agent extension
      isCorrect: false
      explanation: Incorrect. AMA collects monitoring data; it isn't a runbook execution worker.
    - content: A Machine Configuration audit assignment
      isCorrect: false
      explanation: Incorrect. An audit assignment evaluates configuration compliance; it doesn't execute Azure Automation runbook jobs.
