  ms.reviewer: mimckitt
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  module_assessment: true
durationInMinutes: 2
content: |
quiz:
  questions:
  - content: "Which of these types of scaling should be the basis for autoscaling a business critical application that experiences surges in utilization at unpredictable times during the week?"
    choices:
    - content: "Autoscale according to schedule"
      isCorrect: false
      explanation: "Incorrect. As the surges in utilization are unpredictable, scaling according to a schedule doesn't result in an application that is responsive to user numbers."
    - content: "Autoscale according to metrics"
      isCorrect: true
      explanation: "Correct. Metric-based autoscale adjusts the scale set's instance count according to configured metric rules, helping the application respond to unpredictable demand."
  - content: "What is the documented maximum number of VMs supported by Flexible orchestration in a Virtual Machine Scale Set?"
    choices:
    - content: "1000"
      isCorrect: true
      explanation: "Correct. Flexible orchestration supports up to 1,000 VMs. Particular VM and placement configurations can have lower limits."
    - content: "1024"
      isCorrect: false
      explanation: "Incorrect. Flexible orchestration supports up to 1,000 VMs, with lower limits for some configurations."
    - content: "2056"
      isCorrect: false
      explanation: "Incorrect. Flexible orchestration supports up to 1,000 VMs, with lower limits for some configurations."

