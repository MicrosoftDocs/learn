title: Get started with Azure Advisor
summary: Learn how to use Azure Advisor to optimize your Azure workload usage, lower costs, increase efficiency, and improve security.
abstract: |
  After completing this module, you're able to:
  - Identify the areas that Advisor analyzes when making recommendations.
  - View and remediate the issues identified by Advisor's recommendations.
  - Understand the Advisor Score and how it helps prioritize recommendations.
prerequisites: |
