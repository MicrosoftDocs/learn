title: Deploy a Quarkus application to Azure Container Apps
summary: Create a Quarkus application, connect it to a PostgreSQL database, and then deploy it to Azure Container Apps.
abstract: |
  In this module, you:
  - Develop a Quarkus application.
  - Connect your application to Azure Database for PostgreSQL.
  - Deploy the application to Container Apps.
  - Configure the database firewall to replace access from all public IPv4 addresses with the Azure-services exception.
prerequisites: | 
  - Familiarity with developing Java applications
  - An Azure subscription
  - Local installations of Java JDK (17), Maven (3.9.9), the Azure CLI (2.87.0 or later), and curl in the Bash environment used for the exercises
  - A local Bash shell on Linux or macOS, or a WSL 2 Linux distribution on Windows
  - Docker running and accessible from that environment; on Windows, Docker Desktop configured for Linux containers with integration enabled for the selected WSL distribution
