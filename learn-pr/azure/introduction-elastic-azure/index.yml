title: Introduction to Elastic on Azure
summary: Discover the unique benefits of running Elastic on Azure and the different deployment options that support your Linux workloads.
abstract: |
  By the end of this module, you'll be able to:

  - Evaluate whether Elastic on Azure is appropriate for your Linux workload
  - Describe how the three different deployment options for Elastic on Azure ease your migration to the cloud
