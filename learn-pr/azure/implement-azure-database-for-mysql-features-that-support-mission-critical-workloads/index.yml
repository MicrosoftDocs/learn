title: "Implement Azure Database for MySQL Flexible Server features that support mission-critical workloads"
summary: |
  Azure Database for MySQL - Flexible Server provides features for security, business continuity, disaster recovery, and performance to support mission critical workloads. In this module, you’ll configure these features. 
abstract: |
   By the end of this module, you should be able to: 
    - "Configure networking and security features in Azure Database for MySQL - Flexible Server."
    - "Enable business continuity and disaster recovery options in Azure Database for MySQL - Flexible Server." 
    - "Choose the right scaling options for your Azure Database for MySQL flexible server."
prerequisites: |
  - Experience administering MySQL. 
  - Experience administering Azure. 
  - Experience using Azure Database for MySQL. 
  - An understanding of how these database features support mission-critical workloads. 
