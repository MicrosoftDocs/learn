title: Create, customize, and manage an HPC cluster in Azure with Azure CycleCloud
summary: Azure CycleCloud is an application that provides a simple, secure, and scalable way to create, customize, and manage high-performance computing (HPC) clusters in Azure.
abstract: |
  By the end of this module, you're able to:
  - Install and configure Azure CycleCloud to work with your Azure subscription.
  - Integrate a non-Microsoft scheduler.
  - Create and deploy a basic HPC cluster on Azure.
prerequisites: |
  - An Azure subscription
  - Basic familiarity with Azure compute services
  - Basic knowledge of high-performance computing (HPC) concepts
