title: Introduction to Azure SRE Agent
summary: Describe how Azure SRE Agent investigates operational issues, automates recurring work, and executes controlled mitigations. Evaluate whether it fits your reliability engineering needs.
abstract: |
  By the end of this module, you'll be able to:
    - Describe Azure SRE Agent and the operational challenges it addresses.
    - Explain how Azure SRE Agent investigates issues, automates work, and controls access to resources.
    - Evaluate whether Azure SRE Agent is appropriate for your reliability engineering scenarios.
prerequisites: |
  - Familiarity with basic site reliability engineering and incident response concepts
  - Familiarity with Azure resources and Azure Monitor
