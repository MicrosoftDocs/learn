title: Introduction to Azure Communication Services
summary: Discover the key products and services that can help you create communication applications on Azure with Communication Services.
abstract: |
  By the end of this module, you'll be able to: 
    - Describe the key products and services within Azure Communication Services.
    - List some suitable scenarios which Azure Communication Services can help with.
    - Evaluate if Azure Communication Services is right for you.
prerequisites: |
  - You should be familiar with basic computing concepts and terminology.
  - An understanding of basic communication/telephony concepts such as SMS, calling, chat etc.
  - An understanding of cloud computing is helpful, but isn't necessary.
