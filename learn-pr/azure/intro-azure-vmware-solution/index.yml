title: Introduction to Azure VMware Solution
summary: Learn how Azure VMware Solution supports enterprise customers in their transition to the cloud. Evaluate key features and differentiators. Examine the use cases and customer stories. Understand the support structure and options. Explore the service's components.
abstract: | 
  By the end of this module, you're able to:
  - Evaluate the suitability of Azure VMware Solution for solving existing business problems.
  - Identify the key differences between Azure VMware Solution and running VMware on-premises.
  - Analyze the benefits of the service on existing licensing when an organization is using Azure Hybrid Benefit.
  - Understand the basic components of the service.
prerequisites: | 
  - Experience managing a VMware infrastructure.
