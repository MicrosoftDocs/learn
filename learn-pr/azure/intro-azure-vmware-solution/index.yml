title: Introduction to Azure VMware Solution
summary: Explore Azure VMware Solution use cases and a healthcare customer example. Decide which workloads need vSphere, what Microsoft and the customer each manage, and how connectivity and licensing affect the choice.
abstract: |
  By the end of this module, you'll be able to:

  - Evaluate the suitability of Azure VMware Solution for solving existing business problems
  - Identify the key differences between Azure VMware Solution and running VMware on-premises
  - Distinguish Azure host charges and VMware subscription costs from guest licensing, and identify when Azure Hybrid Benefit applies
  - Understand the basic components of the service
prerequisites: |
  You should have experience managing VMware infrastructure.
