content: |
  [!include[](includes/3-how-azure-vmware-solution-works.md)]
quiz:
  questions:
  - content: "Which task does Microsoft perform for an Azure VMware Solution private cloud?"
    choices:
    - content: "Creating additional Tier-1 gateways for workload networks"
      isCorrect: false
      explanation: "Incorrect. AVS provisions the default Tier-1 gateway. The customer can create additional Tier-1 gateways in NSX Manager."
    - content: "Patching and upgrading the VMware platform, including ESXi, vCenter Server, and vSAN"
      isCorrect: true
      explanation: "Correct. Microsoft manages the lifecycle of the VMware platform on the dedicated hosts."
    - content: "Patching the guest operating systems of workload VMs"
      isCorrect: false
      explanation: "Incorrect. The customer patches the guest operating systems and applications, even when Microsoft maintains the hosts."
  - content: "Shannon is planning a standard, non-stretched AVS cluster. What is the minimum supported number of hosts?"
    choices:
    - content: "Three hosts"
      isCorrect: true
      explanation: "Correct. A standard cluster starts at three hosts. A supported Gen 1 stretched cluster starts with three hosts in each of two zones and scales in pairs, up to 16 hosts in total."
    - content: "Four hosts"
      isCorrect: false
      explanation: "Incorrect. Four is the recommendation for production, not the minimum for a standard cluster."
    - content: "Sixteen hosts"
      isCorrect: false
      explanation: "Incorrect. Sixteen is the maximum size for a standard cluster, not its minimum."
  - content: "Which operation does the CloudAdmin role authorize in the private cloud's vCenter Server?"
    choices:
    - content: "Create users in Windows Server Active Directory"
      isCorrect: false
      explanation: "Incorrect. An external identity provider authenticates named users; their vCenter role authorizes workload operations. Assigning CloudAdmin doesn't create directory accounts."
    - content: "Create and manage workload VMs"
      isCorrect: true
      explanation: "Correct. CloudAdmin can manage workload VMs and perform delegated datastore tasks, such as allocating space for their files."
    - content: "Sign in to ESXi hosts as root to change host settings"
      isCorrect: false
      explanation: "Incorrect. CloudAdmin is a vCenter role, not an ESXi root login. Microsoft manages the host configuration."

