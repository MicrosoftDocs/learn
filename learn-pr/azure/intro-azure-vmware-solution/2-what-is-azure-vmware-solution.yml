quiz:
  questions:
  - content: "Which of the following features is key to Azure VMware Solution?"
    choices:
    - content: "Customers can seamlessly modernize apps over time with Azure services."
      isCorrect: true
      explanation: "Correct. An application can stay on VMware while its team adopts an Azure service, such as Azure SQL Database."
    - content: "Customers manage all components of Azure VMware Solution."
      isCorrect: false
      explanation: "Incorrect. Microsoft operates the hosts and patches the VMware platform. Customers manage their guest operating systems and applications."
    - content: "AVS requires administrators to replace their VMware management tools with the Azure portal."
      isCorrect: false
      explanation: "Incorrect. Administrators still use vSphere Client for VMs and NSX Manager for workload networks. They can also start or stop a VM in the Azure portal after onboarding that VM for virtual hardware management through Azure Arc."
  - content: "Your team has an AVS host reservation and enough portable VCF cores for the hosts. What must you allocate to license a four-vCPU Windows Server VM individually using Azure Hybrid Benefit?"
    choices:
    - content: "Four more portable VCF cores."
      isCorrect: false
      explanation: "Incorrect. Portable VCF licenses the VMware platform on the hosts, not Windows Server in the guest VM."
    - content: "The Azure host reservation."
      isCorrect: false
      explanation: "Incorrect. A reservation discounts matching host usage. It doesn't license the guest operating system."
    - content: "At least eight eligible Windows Server core licenses."
      isCorrect: true
      explanation: "Correct. Cover every virtual core, with a minimum of eight core licenses per Windows Server VM. Use Windows Server licenses with active Software Assurance or qualifying subscription licenses under your agreement."
