content: |
  [!include[](includes/4-when-azure-vmware-solution.md)]
quiz:
  questions:
  - content: "Which business need is best suited for Azure VMware Solution?"
    choices:
    - content: "Enterprises that want to reduce their data center footprint."
      isCorrect: true
      explanation: "Correct. A team can move supported vSphere workloads to AVS and retire the source infrastructure after testing the applications and their dependencies on the destination network."
    - content: "Organizations that don't want to use cloud services."
      isCorrect: false
      explanation: "Incorrect. Azure VMware Solution isn't for customers who don't want to use cloud services."
    - content: "A team building a new application entirely on Azure platform services, with no VMware dependencies."
      isCorrect: false
      explanation: "Incorrect. This team can use those services directly. It doesn't need a dedicated VMware cluster."
  - content: "Which scenario isn't a good option for Azure VMware Solution?"
    choices:
    - content: "Customers who can't move to cloud services."
      isCorrect: true
      explanation: "Correct. For example, AVS isn't suitable if no supported region and recovery design can keep the application data and its recovery copies in approved locations."
    - content: "Customers who want to modernize with native Azure services."
      isCorrect: false
      explanation: "Incorrect. An AVS-hosted application can use native Azure services now or be modernized in stages."
    - content: "Customers who want more disaster recovery and business continuity options with Azure."
      isCorrect: false
      explanation: "Incorrect. AVS can serve as a recovery site. Test failover for replicated VMs or a supported restore for backups on a network that won't interfere with production."

