### YamlMime:ModuleUnit
uid: learn.protect-virtual-desktop-deployment-azure-firewall.knowledge-check
title: Module assessment
metadata:
  unitType: knowledge_check
  title: Module assessment
  description: Check your understanding of Azure Firewall controls for Azure Virtual Desktop.
  ms.date: 08/17/2026
  author: vhorne
  ms.author: robbarefoot
  ms.topic: unit
  module_assessment: true
durationInMinutes: 2
content: |
quiz:
  questions:
  - content: "Why should a route table on an Azure Virtual Desktop session-host subnet include a WindowsVirtualDesktop service-tag route with Internet as the next hop?"
    choices:
    - content: "To provide direct access to the Azure Virtual Desktop gateway and broker and avoid disconnections during firewall scale-in."
      isCorrect: true
      explanation: "Correct. The more specific service-tag route keeps latency-sensitive gateway and broker traffic off the default route through Azure Firewall."
    - content: "To send all session-host internet traffic directly to the internet."
      isCorrect: false
      explanation: "Incorrect. Only traffic that matches the WindowsVirtualDesktop service tag uses this route. Other traffic can follow the default route to the firewall."
    - content: "To make application rules in the Firewall Policy unnecessary."
      isCorrect: false
      explanation: "Incorrect. Session hosts still require firewall rules for supporting Azure Virtual Desktop endpoints and other allowed destinations."
  - content: "Which deployment matches the hub-and-spoke design used to protect the Azure Virtual Desktop session hosts?"
    choices:
    - content: "Deploy Azure Firewall with a Firewall Policy in a hub virtual network, and peer it with the session-host virtual network."
      isCorrect: true
      explanation: "Correct. The hub contains the shared firewall, and the peered spoke contains the Azure Virtual Desktop workload."
    - content: "Deploy Azure Firewall in the session-host subnet, and assign a public IP address to each session host."
      isCorrect: false
      explanation: "Incorrect. Azure Firewall requires its dedicated subnet, and Azure Virtual Desktop session hosts don't require public IP addresses."
    - content: "Deploy separate firewalls on each session host, and manage them without a Firewall Policy."
      isCorrect: false
      explanation: "Incorrect. Azure Firewall is a managed network service, and Firewall Policy centrally manages its rules."
  - content: "Why should the session-host virtual network use the Azure Firewall private IP address as its DNS server when Firewall Policy contains FQDN network rules?"
    choices:
    - content: "So the session hosts and Azure Firewall use the same DNS responses when the firewall evaluates FQDN network rules."
      isCorrect: true
      explanation: "Correct. Using Azure Firewall as the DNS proxy avoids inconsistent name resolution between clients and the firewall."
    - content: "So all Azure Virtual Desktop gateway and broker traffic is inspected by the firewall."
      isCorrect: false
      explanation: "Incorrect. The WindowsVirtualDesktop service-tag route sends gateway and broker traffic directly to the service."
    - content: "So application rules can filter non-HTTP protocols without a network rule."
      isCorrect: false
      explanation: "Incorrect. Use FQDN network rules for non-HTTP protocols such as KMS traffic on TCP port 1688."
  - content: "Which rule configuration allows required Azure Virtual Desktop web endpoints while keeping other outbound destinations denied?"
    choices:
    - content: "Use application rules for the WindowsVirtualDesktop FQDN tag and the required supporting and certificate-validation FQDNs."
      isCorrect: true
      explanation: "Correct. Application rules can allow the managed service tag and explicit HTTP or HTTPS destinations while the firewall denies unmatched traffic."
    - content: "Use only a WindowsVirtualDesktop service-tag route with Internet as the next hop."
      isCorrect: false
      explanation: "Incorrect. The route provides direct access to gateway and broker traffic, but supporting web endpoints still require application rules."
    - content: "Use a NAT rule to translate inbound traffic to each session host."
      isCorrect: false
      explanation: "Incorrect. Azure Virtual Desktop doesn't require inbound ports, and NAT rules don't allow the required outbound web endpoints."
