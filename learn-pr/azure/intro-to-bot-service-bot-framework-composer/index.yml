title: Introduction to Azure Bot Service and Bot Framework Composer
summary: Use Azure Bot Service to create custom bots that provide enhanced user experiences and augment applications. Examine bot functionality and design. Explore Azure Bot Service tools, including Bot Framework Composer, and when to use them.
abstract: |
  By the end of this module, you know more about:
    - The features and functionalities of a bot.
    - Bot design and using Azure Bot Service.
    - Creating a bot by using Bot Framework Composer.
    - How the Azure Bot Service components work together in Azure.
prerequisites: |
  To get the best learning experience from this module, you should have:
    - Working experience of the Azure portal.
    - General knowledge of cloud computing.
