summary: Learn how to embody diversity and inclusivity across marketing engines.
abstract: |
  In this module, you learn how to:
  - Describe inclusive marketing and the role of diversity within it.
  - Explain the foundational elements to consider when creating inclusive marketing.
  - Describe the five principles to guide designing your marketing plan.
