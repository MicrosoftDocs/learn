title: Introduction to Azure Copilot
summary: Azure Copilot is an AI-powered tool that helps you design, operate, optimize, and troubleshoot your Azure apps and infrastructure by using natural language. Learn how it works and decide whether it fits your needs.
abstract: |
  By the end of this module, you're able to:
  - Describe what Azure Copilot is and the problems it helps you solve.
  - Explain how Azure Copilot works within the Azure portal and respects your permissions.
  - Identify the capabilities of Azure Copilot and the scenarios they support.
  - Evaluate when to use Azure Copilot and recognize its current limitations.
prerequisites: |
  - Familiarity with the Azure portal.
  - A basic understanding of common Azure services and resources.
