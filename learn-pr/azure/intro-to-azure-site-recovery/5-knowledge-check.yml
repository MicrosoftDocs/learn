content: |
  [!include[](includes/5-knowledge-check.md)]
quiz:
  title: Check your knowledge
  questions:
  - content: For a supported Windows application protected by Site Recovery, which recovery point uses application coordination to persist consistent application data?
    choices:
    - content: Crash-consistent recovery point
      isCorrect: false
      explanation: Incorrect. A crash-consistent point reflects data already persisted on disk without application-aware coordination for that point.
    - content: App-consistent recovery point
      isCorrect: true
      explanation: Correct. Application coordination, such as VSS, creates a consistent point-in-time copy of persisted data. It doesn't save the running VM's memory state or guarantee that later changes won't be lost.
    - content: A copy of the running VM's memory
      isCorrect: false
      explanation: Incorrect. Site Recovery doesn't recover the VM by restoring a saved RAM execution state.
  - content: You use Hyper-V-to-Azure replication with Azure Storage endpoints rather than private endpoints. Which ExpressRoute peering should you use for this replication path?
    choices:
    - content: Microsoft peering
      isCorrect: true
      explanation: Correct. Microsoft peering provides the documented ExpressRoute path to Azure service endpoints used for replication.
    - content: Private peering without private endpoints
      isCorrect: false
      explanation: Incorrect. The documented private-peering replication design requires private endpoints and the associated routing and DNS configuration.
    - content: No peering configuration
      isCorrect: false
      explanation: Incorrect. The ExpressRoute connection needs the appropriate peering configuration to reach the intended endpoints.
  - content: For Azure-to-Azure Site Recovery using managed disks, what is the maximum configurable recovery-point retention period?
    choices:
    - content: 24 hours
      isCorrect: false
      explanation: Incorrect. One day is the documented Azure-to-Azure default, not its maximum.
    - content: 15 days
      isCorrect: true
      explanation: Correct. Azure-to-Azure managed-disk recovery supports retention of up to 15 days. Older recovery points are pruned, so this doesn't retain every five-minute point for the entire period.
    - content: 48 hours
      isCorrect: false
      explanation: Incorrect. This is shorter than the documented maximum of 15 days for this scenario.
