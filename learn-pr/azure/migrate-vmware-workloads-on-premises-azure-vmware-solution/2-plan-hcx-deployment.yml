quiz:
  title: Check your knowledge
  questions:
  - content: "What determines the size of the HCX service-appliance address pools?"
    choices:
    - content: "A fixed count of two addresses for every traffic type and deployment"
      isCorrect: false
      explanation: "The small-deployment address counts are planning starting points, not universal pool sizes. Additional appliances require additional addresses, and compatible traffic types can reuse network infrastructure."
    - content: "Only the number of VMs being migrated"
      isCorrect: false
      explanation: "These pools supply service-appliance interfaces, not an address for each migrating VM. Size them from the planned services and appliance inventory."
    - content: "The selected services, appliance count, and planned scale"
      isCorrect: true
      explanation: "Reserve the Connector management address separately, then size service-appliance pools for the selected services and appliance count, including planned growth or high availability."
  - content: "How should you confirm that a source and destination software combination is supported for HCX migration?"
    choices:
    - content: "Verify exact-version interoperability, lifecycle support, and the requirements for the selected migration method"
      isCorrect: true
      explanation: "Compatibility and lifecycle support are separate checks. Use the Azure VMware Solution-provided Connector distribution and a supported Cloud Manager release, and establish a supported upgrade or migration plan if the source combination isn't supported."
    - content: "Treat an interoperability-matrix listing as a guarantee of lifecycle support"
      isCorrect: false
      explanation: "An interoperability listing describes compatible product combinations. You must also confirm that the releases remain supported and meet the migration feature requirements."
    - content: "Assume every version newer than a documented minimum is compatible and supported"
      isCorrect: false
      explanation: "A version-number minimum isn't a permanent support guarantee. Check the exact source and destination builds rather than assuming newer versions work together."
  - content: "What are the documented limits for site pairings and service meshes on a single HCX manager system?"
    choices:
    - content: "10 site pairings and 25 service meshes"
      isCorrect: false
      explanation: "These values are reversed. The limits are 25 site pairings and 10 service meshes."
    - content: "25 site pairings and 10 service meshes"
      isCorrect: true
      explanation: "The limits include inbound and outbound relationships. A site pairing connects managers; a service mesh provides selected HCX services through service appliances. They are different resources with different limits."
    - content: "25 site pairings and 25 service meshes"
      isCorrect: false
      explanation: "The 25 limit applies to site pairings, not service meshes. A single HCX manager system supports up to 10 service meshes."
