quiz:
  title: Check your knowledge
  questions:
  - content: "Which account is used to sign in to the on-premises HCX Connector appliance management interface on port 9443?"
    choices:
    - content: "Global Administrator"
      isCorrect: false
      explanation: "Global Administrator is a Microsoft Entra directory role, not the Connector's local appliance account."
    - content: "admin"
      isCorrect: true
      explanation: "Use admin with the password configured during OVA deployment for appliance management on port 9443. The HCX service UI on port 443 instead uses a vCenter SSO account in a role-mapped group."
    - content: "cloudadmin"
      isCorrect: false
      explanation: "The Azure VMware Solution CloudAdmin account is separate from the on-premises Connector's local admin account."
  - content: "What should you do if HCX Connector activation fails?"
    choices:
    - content: "Check the reported error, activation information, DNS, time synchronization, and connectivity required by the deployment mode."
      isCorrect: true
      explanation: "Activation depends on the applicable entitlement and deployment mode. Diagnose those requirements rather than assuming every environment needs unrestricted internet access. If the wizard doesn't match the documented AVS flow, stop and confirm the supported procedure with Microsoft Support."
    - content: "Allow unrestricted internet access without checking the activation requirements."
      isCorrect: false
      explanation: "Only allow connectivity required by the applicable activation workflow. Unrestricted access doesn't resolve an invalid key or entitlement."
    - content: "Continue to production migration without confirming activation."
      isCorrect: false
      explanation: "Resolve activation and confirm that the required services are available before configuring and using them."
