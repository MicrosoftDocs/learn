uid: learn.migrate-vmware-workloads-on-premises-azure-vmware-solution.knowledge-check
title: Module assessment
metadata:
  unitType: knowledge_check
  title: Module assessment
  description: Knowledge check.
  ms.date: 11/08/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  ms.contributors: shkuehn-06182021, orthomas-08092023
  ms.custom: team=cloud_advocates
  module_assessment: true
durationInMinutes: 5
content: |
quiz:
  questions:
  - content: "Monica discovers that the source vSphere and HCX combination isn't supported. What should she do before proceeding?"
    choices:
    - content: "Check interoperability and lifecycle requirements, then establish a supported upgrade or migration plan."
      isCorrect: true
      explanation: "Compatibility and lifecycle support are separate requirements. Use supported source and destination combinations rather than downgrading HCX as a generic workaround."
    - content: "Assume any numerically newer version is compatible."
      isCorrect: false
      explanation: "A version-number comparison doesn't establish interoperability or current support for the exact product combination."
    - content: "Ignore support requirements if the network is reachable."
      isCorrect: false
      explanation: "Working connectivity doesn't establish software compatibility or vendor support."
  - content: "Alberto can't successfully establish a VMware HCX site pairing. What might be the issue?"
    choices:
    - content: "Download the VMware HCX Connector OVA file again."
      isCorrect: false
      explanation: "Downloading the OVA again doesn't establish the routed connection needed for site pairing. Check the actual connectivity failure first."
    - content: "The VMware HCX Connector OVA file needs redeployment on-premises."
      isCorrect: false
      explanation: "Redeployment isn't the first remedy for a routing or firewall failure between the HCX managers."
    - content: "The VMware HCX Connector can't reach Alberto's VMware HCX Cloud Manager IP over TCP 443."
      isCorrect: true
      explanation: "Site pairing requires routing and firewall access from the on-premises Connector to the actual HCX Cloud Manager endpoint over TCP 443."
  - content: "For the VMware HCX Connector to route to the VMware HCX Cloud Manager environment, which port needs to be open?"
    choices:
    - content: "443"
      isCorrect: true
      explanation: "TCP 443 is required from the on-premises HCX Connector to the HCX Cloud Manager for site pairing and management."
    - content: "3389"
      isCorrect: false
      explanation: "Port 3389 is for Remote Desktop Protocol, and it doesn't have to do with the HCX Connector on-premises routing traffic to the VMware HCX Cloud Manager environment."
    - content: "53"
      isCorrect: false
      explanation: "Port 53 serves DNS, not the HCX Manager HTTPS connection. Working name resolution is still required when the deployment uses hostnames."
  - content: "Sai has paired the sites but can't establish the HCX service-mesh transport. Which network condition could cause this?"
    choices:
    - content: "The Azure portal account doesn't have a different role assigned."
      isCorrect: false
      explanation: "Changing Azure RBAC permissions doesn't open the network path between HCX service appliances."
    - content: "UDP 4500 isn't allowed between the on-premises and Azure VMware Solution HCX uplink addresses."
      isCorrect: true
      explanation: "The current service-mesh baseline requires UDP 4500 between service-appliance uplinks. Site pairing separately uses TCP 443 between managers."
    - content: "The Connector OVA hasn't been downloaded a second time."
      isCorrect: false
      explanation: "Downloading the OVA again doesn't resolve a blocked service-appliance transport path."
