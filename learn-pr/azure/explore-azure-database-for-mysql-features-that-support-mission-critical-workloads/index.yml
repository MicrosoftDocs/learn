title: "Explore Azure Database for MySQL - Flexible Server features that support mission-critical workloads"
summary: |
  Azure Database for MySQL – Flexible Server provides security, business continuity, disaster recovery, and performance features that are designed to support your mission critical workloads.
abstract: |
   In this module, you'll learn about Azure Database for MySQL - Flexible Server features that you can use to support your mission-critical workloads. You'll:
   - "Explore security features in Azure Database for MySQL – Flexible Server."
   - "Compare business continuity and disaster recovery options in Azure Database for MySQL – Flexible Server."
   - "Evaluate performance features in Azure Database for MySQL – Flexible Server."
prerequisites: |
  - Experience administering MySQL.
  - Experience administering Azure.
  - Experience administering Azure Database for MySQL.
