title: Get started with enterprise scale data management and analytics scenario
summary: "In this module, you learn how a data-management and analytics scenario can help organizations build the strategic design to onboard and govern modern data-analytics workloads. The module prepares you to design the enterprise-scale architecture patterns focused on a data-first approach."
abstract: |
  By the end of this module, you should be able to:

    - Define your strategy and plan.
    - Design Considerations.
    - Provision Data Management Landing Zone.
    - Provision Data Landing Zone.
    - Provision Data Product Landing Zone.
