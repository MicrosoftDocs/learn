title: Migrate Linux and PostgreSQL workloads
summary: Migrate from an on-premises Linux server to Azure by using an Azure virtual machine and Azure Database for PostgreSQL.
abstract: |
  By the end of this module, you'll be able to:
    - Understand how to migrate your Linux and PostgreSQL workloads to Azure.
    - Deploy a Linux virtual machine in Azure.
    - Run a sample application on your PostgreSQL database.
prerequisites: |
  - Basic knowledge of Linux and PostgreSQL
  - Knowledge of Azure services
  - An Azure subscription
