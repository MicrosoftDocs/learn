title: Choose a deployment scenario for HoloLens device management
summary: "Explore and evaluate common deployment scenarios for HoloLens 2 device management."
abstract: |
  By the end of this module, you'll be able to:
    - Understand the common deployment scenarios for HoloLens 2 devices.
    - Assess your organization's specific needs and requirements for deploying HoloLens devices.
    - Evaluate which deployment scenario is best suited for your organization.

prerequisites: "Although this module has no requirements, you're encouraged to have a HoloLens 2 device (or devices) ready for deployment."
