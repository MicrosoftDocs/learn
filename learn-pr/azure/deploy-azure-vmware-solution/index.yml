title: Prepare to migrate VMware resources to Azure by deploying Azure VMware Solution
summary: Compare Azure VMware Solution deployment generations and plan licensing, capacity, and networking for migration. Deploy a standard, single-zone Generation 1 private cloud, connect it to an Azure virtual network, and configure ExpressRoute Global Reach to connect your on-premises VMware vSphere environment.
abstract: |
  By the end of this module, you'll be able to:
  - Plan an Azure VMware Solution deployment, including the generation and licensing prerequisites.
  - Connect a standard Generation 1 private cloud to an on-premises VMware vSphere environment by using ExpressRoute Global Reach.
prerequisites: |
  - Experience managing VMware solution infrastructure, such as vCenter Server, ESXi, NSX Data Center, and vSAN.
  - Basic knowledge of network concepts, such as Classless Inter-Domain Routing (CIDR), Border Gateway Protocol (BGP) routing, Dynamic Host Configuration Protocol (DHCP), and IPv4 network subnets.
