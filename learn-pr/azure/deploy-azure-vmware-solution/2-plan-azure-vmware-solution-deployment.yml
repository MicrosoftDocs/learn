quiz:
  title: Check your knowledge
  questions:
  - content: "What should you use to determine software compatibility for a new Azure VMware Solution private cloud?"
    choices:
    - content: "The current Microsoft-documented AVS software baseline and the compatibility requirements of the source environment and migration tools."
      isCorrect: true
      explanation: "Microsoft validates the managed platform. New-deployment versions and existing-cloud update schedules can differ, so check the current documented baseline and compatibility requirements."
    - content: "Assume every private cloud automatically runs the newest upstream VMware release."
      isCorrect: false
      explanation: "An upstream release doesn't establish the software available in an AVS private cloud. Microsoft validates and manages the supported platform."
    - content: "Use a fixed software table without checking the deployment date."
      isCorrect: false
      explanation: "A static table can become outdated and doesn't establish an existing private cloud's running version. Check current Microsoft guidance and the source and migration-tool requirements."
  - content: "What is the minimum host count for a standard Azure VMware Solution cluster?"
    choices:
    - content: "Four"
      isCorrect: false
      explanation: "The supported minimum for a standard cluster is three hosts. Four hosts are recommended for AV64 operational resilience, but aren't the minimum."
    - content: "Eight"
      isCorrect: false
      explanation: "A standard cluster requires at least three hosts. A supported stretched cluster has a different minimum of six hosts, split equally across two zones."
    - content: "Three"
      isCorrect: true
      explanation: "A standard Azure VMware Solution cluster supports 3-16 hosts, but the selected storage policy can require more than the three-host service minimum. For example, OSA RAID-5 with FTT 1 needs four hosts. Stretched clusters require at least six hosts and a separate policy assessment."
