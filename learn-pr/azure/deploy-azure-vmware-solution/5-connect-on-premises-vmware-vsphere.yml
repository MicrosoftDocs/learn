quiz:
  title: Check your knowledge
  questions:
  - content: "Which customer resource is required for the Generation 1 ExpressRoute Global Reach connection shown in this module?"
    choices:
    - content: "Customer-provided ExpressRoute circuit"
      isCorrect: true
      explanation: "This design links a customer-provided circuit with working Azure private peering to the AVS-managed circuit. ExpressRoute Local doesn't support Global Reach. Connections across geopolitical regions require Premium circuits at both endpoints."
    - content: "Application gateway"
      isCorrect: false
      explanation: "An Azure application gateway is a web-traffic load balancer that enables you to manage traffic to your web applications. This functionality isn't required to peer the Azure VMware Solution environment to on-premises."
    - content: "Network virtual appliance"
      isCorrect: false
      explanation: "An NVA isn't required for the direct Global Reach connection shown here. NVA transit is a different supported architecture with its own routing configuration."
  - content: "In the Generation 1 design shown in this module, which service connects the customer ExpressRoute circuit directly to the AVS ExpressRoute circuit?"
    choices: 
    - content: "A site-to-site VPN alone"
      isCorrect: false
      explanation: "A site-to-site VPN doesn't directly link these ExpressRoute circuits. Supported VPN designs can provide AVS connectivity through a different architecture."
    - content: "ExpressRoute Global Reach"
      isCorrect: true
      explanation: "Global Reach provides the direct circuit-to-circuit connection in this design. Merely connecting both circuits to one ExpressRoute gateway doesn't make the gateway transit traffic between them."
    - content: "Load balancer"
      isCorrect: false
      explanation: "A load balancer distributes application traffic. It doesn't establish the direct connection between the two ExpressRoute circuits."
