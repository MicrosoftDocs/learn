quiz:
  title: Check your knowledge
  questions:
  - content: "Which subscription-level role meets the documented deployment prerequisite for the standard Generation 1 walkthrough without granting Owner's access-delegation capability?"
    choices: 
    - content: "Virtual Machine Contributor"
      isCorrect: false
      explanation: "Virtual Machine Contributor manages Azure VMs, not the complete AVS private-cloud and network deployment described here."
    - content: "Owner"
      isCorrect: false
      explanation: "The Owner role has full access to all resources in the subscription, including the right to delegate access to others. This role will allow you to deploy AVS. But it might give you more access than you need to the subscription."
    - content: "Contributor"
      isCorrect: true
      explanation: "Contributor meets the documented subscription-level deployment prerequisite for this walkthrough. Azure permissions remain separate from VMware administrative permissions."
  - content: "Which provider-registration step is required for the Generation 1 private cloud in this walkthrough?"
    choices: 
    - content: "Create a resource lock."
      isCorrect: false
      explanation: "A resource lock allows administrators to lock a subscription, resource group, or resource. A resource lock isn't required to deploy AVS."
    - content: "Register the Microsoft.AVS resource provider."
      isCorrect: true
      explanation: "Before you can provision your hosts, make sure that you register the Microsoft.AVS resource provider in the Azure portal."
    - content: "Specify a service principal."
      isCorrect: false
      explanation: "You don't need to specify a service principal for this Generation 1 portal walkthrough. Generation 2 has additional first-party application prerequisites."
