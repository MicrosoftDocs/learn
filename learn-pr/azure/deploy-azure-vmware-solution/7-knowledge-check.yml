durationInMinutes: 5
quiz:
  title: Check your knowledge
  questions:
  - content: Deployment reports "MissingSubscriptionRegistration" for the Microsoft.AVS namespace. What should you do?
    choices:  
    - content: Try to redeploy and see if the same error message displays.
      isCorrect: false
      explanation: Retrying without registering Microsoft.AVS doesn't resolve this explicit missing-registration condition.
    - content: Register the Microsoft.AVS resource provider for the subscription.
      isCorrect: true
      explanation: This error identifies missing subscription registration. Register Microsoft.AVS in the target subscription. A different error, NoRegisteredProviderFound, can also indicate an unsupported location or API version.
    - content: Try deploying Azure VMware Solution in a different region.
      isCorrect: false
      explanation: Changing regions doesn't register the provider in this subscription. This question specifies missing registration rather than an unsupported-region error.
  - content: Which ExpressRoute compatibility requirement must be satisfied for the Generation 1 hybrid connection in this module?
    choices:  
    - content: Delete your Azure VMware Solution deployment and redeploy the service.
      isCorrect: false
      explanation: Redeploying the private cloud doesn't resolve an incompatible gateway or provider configuration.
    - content: Ensure all gateways, including the Azure ExpressRoute provider's service, support 4-byte autonomous system number (ASN).
      isCorrect: true
      explanation: Azure VMware Solution uses 4-byte public ASNs for advertising routes between the on-premises and AVS ExpressRoute circuits. Four-byte capability and avoiding AVS-reserved ASN conflicts are separate requirements.
    - content: Check permissions on the subscription and resource group.
      isCorrect: false
      explanation: Azure role assignments don't establish whether the network supports four-byte ASNs or whether the required traffic can be routed.
  - content: Deployment reports insufficient host quota for the selected AVS region and host type. How should you resolve this prerequisite?
    choices:  
    - content: Use a different region.
      isCorrect: false
      explanation: Changing regions doesn't obtain the requested host quota for the selected design. Request quota for the intended region and host type.
    - content: Check permissions on the subscription and resource group.
      isCorrect: false
      explanation: Permissions and host quota are separate prerequisites. Changing role assignments doesn't allocate host quota.
    - content: Open a new support ticket to have host quota allocated.
      isCorrect: true
      explanation: Request host quota through Azure Help + Support for the selected region and host SKU. Enter the required absolute host total, not just the additional hosts. CSP partners access the customer's Azure portal through Partner Center AOBO before submitting the request.
  - content: "Which CIDR block size is used for the private-cloud management address reservation in this module?"
    choices:
    - content: "/22"
      isCorrect: true
      explanation: "Azure VMware Solution needs a /22 CIDR network-address block for IP segments."
    - content: "/30"
      isCorrect: false
      explanation: "Azure VMware Solution needs a bigger CIDR network-address block allocated for IP segments."
    - content: "/31"
      isCorrect: false
      explanation: "Azure VMware Solution needs a bigger CIDR network-address block allocated for IP segments."
  - content: "Which connectivity scope provides access through an Azure virtual network without adding the on-premises connection?"
    choices:
    - content: "Full interconnectivity"
      isCorrect: false
      explanation: "Full interconnectivity extends the Azure-only connection with on-premises connectivity."
    - content: "Half interconnectivity"
      isCorrect: false
      explanation: "Half interconnectivity isn't a valid type of interconnectivity for Azure VMware Solution configuration."
    - content: "Basic interconnectivity"
      isCorrect: true
      explanation: "Basic Azure-only interconnectivity connects the Gen1 private cloud to the customer VNet through its configured ExpressRoute gateway connection."
  - content: "Which gateway is preconfigured inside the Generation 1 private cloud, before the separate Azure VNet connection is created?"
    choices:
    - content: "NSX Tier-1 gateway"
      isCorrect: true
      explanation: "Azure VMware Solution deploys with an NSX Tier-1 gateway in active-standby mode. The NSX Tier-0 and Tier-1 gateways connect network segments as logical switches and provide East-West and North-South connectivity."
    - content: "Application gateway"
      isCorrect: false
      explanation: "An Azure application gateway is a web-traffic load balancer that enables you to manage traffic to your web applications. This gateway isn't deployed with Azure VMware Solution."
    - content: "Virtual network gateway"
      isCorrect: false
      explanation: "The ExpressRoute virtual network gateway is a separate Azure resource created or reused to connect the customer VNet to the private cloud."
