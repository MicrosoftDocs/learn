title: Write your first query with Kusto Query Language
summary: 'Get started by writing simple queries in Kusto Query Language (KQL) to explore and gain insights from your data. Learn how to use the operators `take`, `project`, `where`, `count`, `sort`, and others.'
abstract: | 
  By the end of this module, you'll be able to:
    - Write your first query with KQL.
    - Use KQL to explore data by using the most common operators.
prerequisites: | 
  - An Azure subscription; you can create a [free Azure account](https://azure.microsoft.com/pricing/purchase-options/azure-account?cid=msft_learn)
  - Familiarity with database structures like tables, columns, and rows
