### YamlMime:ModuleUnit
uid: learn.azure.monitor-azure-arc-enabled-servers.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Knowledge check
  ms.date: 10/21/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  module_assessment: true
durationInMinutes: 7
content: |
  [!include[](includes/6-knowledge-check.md)]
quiz:
  questions:
  - content: Which component installs, upgrades, and removes VM extensions on an Azure Arc-enabled server?
    choices:
    - content: The extension service in the Azure Connected Machine agent
      isCorrect: true
      explanation: Correct. The Connected Machine agent includes the extension service that manages VM extensions on the server.
    - content: Azure Monitor Agent
      isCorrect: false
      explanation: Incorrect. Azure Monitor Agent collects monitoring data. The Connected Machine agent's extension service manages its installation as an extension.
    - content: A data collection rule
      isCorrect: false
      explanation: Incorrect. A data collection rule defines collection settings and destinations; it isn't the extension-management service.
    - content: A Log Analytics workspace
      isCorrect: false
      explanation: Incorrect. A Log Analytics workspace stores collected log data; it doesn't run the server's extension-management service.
  - content: Which configuration supplies the performance records used by the logs-based VM insights charts and the KQL alert in this module?
    choices:
    - content: Azure Monitor Agent with an associated VM insights logs-based data collection rule and a Log Analytics workspace
      isCorrect: true
      explanation: Correct. This configuration collects the performance records used by the InsightsMetrics queries in this module.
    - content: The Azure Connected Machine agent without a monitoring configuration
      isCorrect: false
      explanation: Incorrect. Connecting a server to Azure Arc alone doesn't configure the guest performance collection used by this example.
    - content: Only OpenTelemetry metrics sent to an Azure Monitor workspace
      isCorrect: false
      explanation: Incorrect. This is a separate supported metrics configuration queried with PromQL. The KQL example requires logs-based performance collection into a Log Analytics workspace.
    - content: An action group without a data collection rule
      isCorrect: false
      explanation: Incorrect. An action group defines notifications and actions; it doesn't collect the performance records.
  - content: Which of the following services isn't a necessary component of an Azure Monitor alert rule for an Arc-enabled server?
    choices:
    - content: Logic App
      isCorrect: true
      explanation: Correct, Logic App can be specified as part of an Action Group for an Azure Monitor Alert Rule; however, it isn't a necessary component.
    - content: Signal
      isCorrect: false
      explanation: Incorrect, Signal must be specified for an Azure Monitor Alert Rule.
    - content: Target Resource
      isCorrect: false
      explanation: Incorrect, Target Resource must be specified for an Azure Monitor Alert Rule.
    - content: Criteria
      isCorrect: false
      explanation: Incorrect, Criteria must be specified for an Azure Monitor Alert Rule.
  - content: Which of the following actions can be performed with Azure Monitor Logs, but not with Azure Monitor Metrics, for an Azure Arc-enabled server?
    choices:
    - content: Analyze with Metrics Explorer
      isCorrect: false
      explanation: Incorrect, Azure Monitor Metrics can be analyzed with Metrics Explorer, but Azure Monitor Logs can't be analyzed with Metrics Explorer.
    - content: Visualize with Grafana
      isCorrect: false
      explanation: Incorrect, both Azure Monitor Logs and Azure Monitor Metrics can be visualized with Grafana.
    - content: Analyze with Log Analytics
      isCorrect: true
      explanation: Correct. Use Log Analytics to query records in Azure Monitor Logs. Use Metrics Explorer to analyze metric time series in Azure Monitor.
    - content: Visualize with Azure Dashboard
      isCorrect: false
      explanation: Incorrect, both Azure Monitor Logs and Azure Monitor Metrics can be visualized with Azure Dashboards.
