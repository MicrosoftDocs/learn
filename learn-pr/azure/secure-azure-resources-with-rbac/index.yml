title: Secure your Azure resources with Azure role-based access control (Azure RBAC)
summary: Learn how to use Azure RBAC to manage access to resources in Azure.
abstract: |
  In this module, you'll:

  - Verify access to resources for yourself and others.
  - Grant access to resources.
  - View activity logs of Azure RBAC changes.
prerequisites: |
  Before you begin, make sure you have:

  - An Azure account with an active subscription
  - Knowledge of basic Azure concepts, such as the Azure portal and resource groups

  For setup resources, see the More info section in the Summary unit.
