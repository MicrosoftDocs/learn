### YamlMime:ModuleUnit
uid: learn.secure-azure-resources-with-rbac.7-knowledge-check-rbac
title: Module assessment
metadata:
  unitType: knowledge_check
  title: Module Assessment
  description: Knowledge check - Using Azure RBAC
  ms.date: 10/23/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  module_assessment: true
durationInMinutes: 3
quiz:
  questions:
  - content: "Suppose a team member can't view resources in a resource group. Where would the administrator go to check the team member's access?"
    choices:
    - content: "Check the team member's permissions by going to their **Azure profile > My permissions**."
      isCorrect: false
      explanation: "My permissions concerns the signed-in user's access, not another team member's access. To inspect the team member, open the resource group, select Access control (IAM) > Check access, and select that user."
    - content: "Go to the resource group and select **Access control (IAM)** > **Check Access**."
      isCorrect: true
      explanation: "Find the list of role assignments on the resource group."
    - content: "Go to one of the resources in the resource group and select **Role assignments**."
      isCorrect: False
      explanation: "The resource inherits permissions from the resource group so you could see their access to the specific resource. But you should go to the resource group to view and manage permissions at that scope."
  - content: "Suppose an administrator in another department needs access to a virtual machine managed by your department. What's the best way to grant them access to just that resource?"
    choices:
    - content: "At the resource scope, create a role for them with the appropriate access."
      isCorrect: false
      explanation: "For this scenario, at the resource scope, assign one of the built-in roles like contributor or reader instead of creating a new role."
    - content: "At the resource group scope, assign the role with the appropriate access."
      isCorrect: false
      explanation: "Assigning the role at resource group scope applies that role's permissions throughout the resource group, rather than limiting the assignment to the requested virtual machine. The role definition still determines which operations and resource types the user can access."
    - content: "At the resource scope, assign the role with the appropriate access."
      isCorrect: true
      explanation: "For this scenario, at the virtual machine scope, assign one of the built-in roles that grants the appropriate access for the administrator."      
  - content: "Suppose a developer needs full access to a resource group. If you are following least-privilege best practices, what scope should you specify?"
    choices:
    - content: "Resource"
      isCorrect: false
      explanation: "Following least-privilege best practices, you grant only the access the user needs to do their job. In this case, you should set the scope to the resource group."
    - content: "Resource group"
      isCorrect: true
      explanation: "Following least-privilege best practices, you grant only the access the user needs to do their job. In this case, you should set the scope to the resource group."
    - content: "Subscription"
      isCorrect: false
      explanation: "Following least-privilege best practices, you grant only the access the user needs to do their job. In this case, you should set the scope to the resource group."
  - content: "An administrator needs a report of successful Azure RBAC role-assignment write operations in a specified subscription during the previous seven days. Which approach should they use?"
    choices:
    - content: "Open the subscription's Activity log, set the timespan to the previous seven days, and filter Operation to Create role assignment (Microsoft.Authorization/roleAssignments/write) and Status to Succeeded."
      isCorrect: true
      explanation: "Activity Log provides historical operation records. These filters select successful role-assignment write operations for the chosen subscription and interval. This is not a current assignment inventory or a complete change report including deletions and PIM workflows."
    - content: "At the subscription scope, select Access control (IAM) > Download role assignments."
      isCorrect: false
      explanation: "This downloads a current role-assignment inventory, not the requested history of successful write operations during the previous seven days."
    - content: "At the subscription scope, select Access control (IAM) > Role assignments."
      isCorrect: false
      explanation: "This displays role assignments rather than the historical operation records requested by the question."
