summary: |
  In this module, you evaluate migration tools and practice migrating an on-premises MySQL server to an Azure Database for MySQL flexible server. 
abstract: |
   By the end of this module, you should be able to:
    - "Choose an online or offline migration."
    - "Review available migration tools and select one."
    - "Migrate an on-premises MySQL server into an Azure Database for MySQL flexible server."
