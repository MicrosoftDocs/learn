title: Introduction to Azure Red Hat OpenShift
summary: This module provides an introduction to using Azure Red Hat OpenShift. It covers key topics such as the benefits of managed container platforms, continuous integration and continuous deployment, and multi-cluster management.
abstract: |
  By the end of this module, you'll be able to:

  - Evaluate the benefits and considerations of using Azure Red Hat OpenShift.
  - Describe how Azure Red Hat OpenShift supports organizations in implementing hybrid cloud strategies.

prerequisites: |
  - Familiarity with Azure.
  - Basic understanding of Kubernetes concepts and cloud-native architecture.
