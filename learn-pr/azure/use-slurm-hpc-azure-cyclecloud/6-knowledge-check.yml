### YamlMime:ModuleUnit
uid: learn.azure.use-slurm-hpc-azure-cyclecloud.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: This content is part of the "Use Slurm for HPC on Azure CycleCloud" module.
  ms.date: 11/15/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  module_assessment: true
durationInMinutes: 4
quiz:
  questions:
    - content: "Which command can you use to display information on jobs, partitions, and nodes that Slurm manages?"
      choices:
        - content: "`sstat`"
          isCorrect: false
          explanation: "Incorrect. This command lets you view information about resources utilized by running jobs or job steps."
        - content: "`sview`"
          isCorrect: true
          explanation: "Correct. The `sview` command allows you to view state information on jobs, partitions, and nodes that Slurm manages."
        - content: "`sinfo`"
          isCorrect: false
          explanation: "Incorrect. This command displays information on partitions and nodes that Slurm manages."
        - content: "`sbatch`"
          isCorrect: false
          explanation: Incorrect. Use this command to submit a job script for later execution. These scripts generally include one or more srun commands to initiate parallel tasks.
    - content: "A multinode MPI simulation runs concurrently and exchanges data frequently between nodes. Which appropriately configured Slurm partition is intended for this workload?"
      choices:
        - content: "HTC partition"
          isCorrect: false
          explanation: "Incorrect. HTC partitions are intended for independent or loosely coupled tasks that generally don't require specialized internode communication."
        - content: "HPC partition"
          isCorrect: true
          explanation: "Correct. An HPC partition can provide suitable VM placement and networking for tightly coupled multinode workloads. Sequential dependencies alone don't identify this workload type."
    - content: "After changing the CycleCloud cluster definition for a running Slurm project-4.x cluster, which command should an administrator run as root on the scheduler to regenerate the integration configuration?"
      choices:
        - content: "`sinfo`"
          isCorrect: false
          explanation: "Incorrect. This command reports partition and node information."
        - content: "`azslurm scale`"
          isCorrect: true
          explanation: "Correct. This command regenerates the integration configuration, updates nodes and partitions, and restarts the Slurm controller. It doesn't upgrade the Slurm project."
        - content: "`srun`"
          isCorrect: false
          explanation: "Incorrect. This command launches job tasks."
        - content: "`sbatch`"
          isCorrect: false
          explanation: "Incorrect. This command submits a batch script."
