title: Monitor your Azure virtual machines with Azure Monitor
summary: Learn how to monitor your Azure VMs by using Azure Monitor to collect and analyze VM host and client metrics and logs.
abstract: | 
  - Understand which monitoring data you need to collect from your VM.
  - Enable and view recommended alerts and diagnostics.
  - Use Azure Monitor to collect and analyze VM host metrics data.
  - Use Azure Monitor Agent to collect VM client performance metrics and event logs.
prerequisites: | 
  - At least **Contributor** role access to an Azure subscription
  - Familiarity with virtualization and Azure VMs
