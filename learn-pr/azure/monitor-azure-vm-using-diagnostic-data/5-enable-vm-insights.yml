### YamlMime:ModuleUnit
uid: learn.azure.monitor-azure-vm-using-diagnostic-data.enable-vm-insights
title: Collect client performance counters by using VM insights
metadata:
  title: Collect Client Performance Counters by Using VM Insights
  description: Enable logs-based VM insights monitoring with Azure Monitor Agent and a data collection rule, and analyze guest performance data in a Log Analytics workspace.
  ms.date: 10/25/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
durationInMinutes: 5
content: |
  [!include[](includes/5-enable-vm-insights.md)]
quiz:
  questions:
  - content: What does enabling logs-based VM insights monitoring in this exercise provide?
    choices:
    - content: Prebuilt Performance views and guest performance records in a Log Analytics workspace.
      isCorrect: true
      explanation: Logs-based VM insights uses Azure Monitor Agent and a predefined DCR to collect guest performance records into InsightsMetrics in the selected Log Analytics workspace for Performance views and KQL analysis.
    - content: Graphs that show several host metrics on one graph with customizable timeframes.
      isCorrect: false
      explanation: To build metrics graphs that show several host metrics on one graph with adjustable timeframes, use Metrics Explorer.
    - content: Automatic Linux Syslog collection.
      isCorrect: false
      explanation: The predefined performance DCR doesn't collect Syslog. Create an additional Linux Syslog DCR.
  - content: With authentication and connectivity prerequisites met, what starts guest data collection with Azure Monitor Agent in this exercise?
    choices:
    - content: Enable only boot diagnostics.
      isCorrect: false
      explanation: Boot diagnostics collects boot information, not the guest performance and Syslog data configured by AMA DCRs.
    - content: Create a Log Analytics workspace without configuring the VM.
      isCorrect: false
      explanation: A workspace supplies a destination; creating it alone doesn't install AMA or associate a collection rule with the VM.
    - content: Install Azure Monitor Agent and associate a DCR that defines the data and destination.
      isCorrect: true
      explanation: AMA requires the agent, its authentication and connectivity prerequisites, and an associated DCR defining what to collect and where to send it.
