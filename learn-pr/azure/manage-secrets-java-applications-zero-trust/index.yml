title: Manage secrets in Java applications - Zero Trust and Zero Secrets
summary: Learn best practices to secure your Java applications on Azure, and apply them using Azure Key Vault.
abstract: | 
 By the end of this tutorial, you'll be able to:
  - Understand best practices like Zero Trust in order to secure any application running in the cloud.
  - Apply those practices using Azure Key Vault on a Java project running on Azure.
prerequisites:  |
  - Familiarity with developing and running Java applications
  - Beginner-level experience with cloud infrastructure
  - Intermediate-level familiarity with command-line tools, specifically the Azure CLI, and Azure-specific terminology
