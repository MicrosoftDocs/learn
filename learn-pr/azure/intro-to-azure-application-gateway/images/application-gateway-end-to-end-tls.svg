<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1360" height="1100" viewBox="0 0 1360 1100"
     role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">End-to-end TLS with Azure Application Gateway</title>
  <desc id="diagram-description">
    Follow steps 1 through 5. A client creates an HTTPS connection to the gateway.
    The HTTPS listener has the client-facing server certificate and private key
    and terminates the first TLS connection. The gateway processes decrypted HTTP
    and routes the request. WAF inspection requires WAF_v2 with an enabled policy.
    Backend HTTP settings configured for HTTPS establish a separate TLS connection.
    The gateway validates the backend certificate's chain, expiry, and hostname
    using its built-in trusted roots for a publicly trusted certificate, or an
    appropriate added trusted root for a private-CA or self-signed certificate.
    The backend server holds its own server certificate and private key and
    terminates the second TLS connection. Each connection uses its own negotiated
    encryption keys. A trusted root establishes trust and does not supply the
    backend's private key. The request direction is shown; both connections are bidirectional.
  </desc>
