  <rect id="background" x="0" y="0" width="1360" height="1100" fill="#ffffff"/>
  <g id="header">
    <text class="eyebrow" x="40" y="40">AZURE APPLICATION GATEWAY / STANDARD_V2 AND WAF_V2</text>
    <text class="title" x="40" y="87">End-to-end TLS: two separate connections</text>
    <text class="subtitle" x="40" y="124">The gateway decrypts requests, processes HTTP, and uses a separate encrypted backend connection.</text>
  </g>

  <g id="gateway-container">
    <rect x="410" y="180" width="540" height="700" rx="20" fill="#f3f8fc" stroke="#bfd3e4" stroke-width="2"/>
    <use xlink:href="#azure-application-gateway" x="434" y="195" width="44" height="44" aria-hidden="true"/>
    <text class="group-title" x="494" y="226">Application Gateway</text>
  </g>

  <g id="step-1-client" data-step="1">
    <rect class="card" x="40" y="260" width="260" height="250" rx="14"/>
    <circle class="step-badge" cx="70" cy="296" r="18"/>
    <text class="number" x="70" y="303">1</text>
    <text class="node-title" x="104" y="305">Client</text>
    <use xlink:href="#azure-browser" x="140" y="326" width="60" height="60" aria-hidden="true"/>
    <text class="detail" x="64" y="416">Starts an HTTPS request.</text>
    <text class="detail" x="64" y="451">Validates the gateway's</text>
    <text class="detail" x="64" y="478">server certificate.</text>
  </g>

  <g id="connection-1">
    <text class="connection-title" x="355" y="302">TLS A</text>
    <text class="connection-label" x="355" y="328">HTTPS</text>
    <path id="client-tls-arrow" class="connector" d="M314 350H422" stroke="#0078d4" marker-end="url(#arrow-client)"/>
    <text class="connection-label" x="355" y="388">Encrypted</text>
  </g>

  <g id="step-2-listener" data-step="2">
    <rect class="card" x="434" y="260" width="492" height="168" rx="12"/>
    <circle class="step-badge" cx="464" cy="292" r="18"/>
    <text class="number" x="464" y="299">2</text>
    <text class="node-title" x="498" y="301">HTTPS listener</text>
    <use xlink:href="#azure-certificate" x="454" y="324" width="42" height="42" aria-hidden="true"/>
    <text class="body" x="512" y="338">Client-facing server certificate</text>
    <text class="body" x="512" y="372">and private key</text>
    <text class="detail" x="458" y="403">Terminates TLS connection A.</text>
  </g>

  <path id="listener-to-http-arrow" class="connector" d="M680 440V470"
        stroke="#586b7c" marker-end="url(#arrow-internal)"/>

  <g id="step-3-processing" data-step="3">
    <rect class="card" x="434" y="482" width="492" height="116" rx="12"/>
    <circle class="step-badge" cx="464" cy="514" r="18"/>
    <text class="number" x="464" y="521">3</text>
    <text class="node-title" x="498" y="523">Inspect and route HTTP</text>
    <text class="body" x="458" y="560">Decrypted inside the gateway.</text>
    <text class="small" x="458" y="585">WAF_v2 + enabled policy: inspect requests.</text>
  </g>

  <path id="http-to-backend-settings-arrow" class="connector" d="M680 610V630"
        stroke="#586b7c" marker-end="url(#arrow-internal)"/>

  <g id="step-4-backend-settings" data-step="4">
    <rect class="card" x="434" y="642" width="492" height="214" rx="12"/>
    <circle class="step-badge" cx="464" cy="674" r="18"/>
    <text class="number" x="464" y="681">4</text>
    <text class="node-title" x="498" y="683">Backend HTTPS settings</text>
    <text class="body" x="458" y="720">Uses a separate TLS connection.</text>
    <use xlink:href="#azure-certificate" x="454" y="740" width="42" height="42" aria-hidden="true"/>
    <text class="body" x="512" y="754">Publicly trusted: built-in roots.</text>
    <text class="body" x="512" y="784">Private CA / self-signed: add root.</text>
    <text class="detail" x="458" y="829">Validate chain, expiry, and hostname.</text>
  </g>

  <g id="connection-2">
    <text class="connection-title" x="1005" y="682">TLS B</text>
    <text class="connection-label" x="1005" y="708">HTTPS</text>
    <path id="backend-tls-arrow" class="connector" d="M938 730H1048" stroke="#087f76" marker-end="url(#arrow-backend)"/>
    <text class="connection-label" x="1005" y="768">Encrypted</text>
  </g>

  <g id="step-5-backend" data-step="5">
    <rect class="card" x="1060" y="592" width="260" height="288" rx="14"/>
    <circle class="step-badge" cx="1090" cy="628" r="18"/>
    <text class="number" x="1090" y="635">5</text>
    <text class="node-title" x="1124" y="637">Backend server</text>
    <use xlink:href="#azure-virtual-machine" x="1160" y="659" width="60" height="60" aria-hidden="true"/>
    <use xlink:href="#azure-certificate" x="1082" y="737" width="34" height="34" aria-hidden="true"/>
    <text class="small" x="1130" y="746">Server certificate</text>
    <text class="small" x="1130" y="772">and private key</text>
    <text class="detail" x="1084" y="814">Terminates TLS B.</text>
    <text class="detail" x="1084" y="843">Processes the request.</text>
  </g>

  <text class="small" x="40" y="565">Arrows show the request direction.</text>
  <text class="small" x="40" y="591">Both TLS connections are bidirectional.</text>
  <text class="small" x="40" y="631">A = client-to-gateway connection.</text>
  <text class="small" x="40" y="657">B = gateway-to-backend connection.</text>
  <text class="small" x="40" y="697">Use TLS 1.2 or higher on both hops.</text>

  <g id="key-distinction">
    <rect x="40" y="920" width="1280" height="124" rx="14" fill="#f3f2f1" stroke="#d6d4d2" stroke-width="1.5"/>
    <text class="node-title" x="64" y="958">Two TLS connections, not a pass-through tunnel</text>
    <text class="body" x="64" y="994">Server certificates authenticate the endpoints. Each connection uses its own negotiated encryption keys.</text>
    <text class="body" x="64" y="1024">Trusted roots validate the backend certificate. The backend's private key stays on the backend.</text>
  </g>
  <text class="detail" x="40" y="1080">Enable HTTPS on both the listener and backend HTTP settings. An HTTP backend hop would be unencrypted.</text>
</svg>
