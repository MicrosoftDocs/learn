title: Understand sign-in with Microsoft Entra ID in Java web apps
summary: Understand Microsoft Entra ID sign-in and Microsoft Graph authorization through explained Java code samples, without a hands-on lab.
abstract: | 
  By the end of this module, you'll be able to:

  - Explain how an application registration defines a Java web app's identity and sign-in audience.
  - Trace an authorization-code sign-in flow through illustrative MSAL4J samples.
  - Explain how delegated permissions and access tokens enable Microsoft Graph calls.

prerequisites: | 
  - Familiarity with Java syntax, methods, and classes
  - Basic knowledge of HTTP requests and responses and server-side web applications
  - No Azure subscription, tenant access, credentials, or installed development environment is required

