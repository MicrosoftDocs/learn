### YamlMime:ModuleUnit
uid: learn.azure.azure-java-app-enable-authentication-authorization.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Assess authentication concepts, MSAL responsibilities, and scopes through conceptual questions.
  ms.date: 09/01/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
  ms.custom:
    - devx-track-extended-java
  module_assessment: true
durationInMinutes: 3
quiz:
  questions:
  - content: "What is authentication in an application?"
    choices:
    - content: "It's the process of ensuring that an application has permission to perform an operation or access data."
      isCorrect: false
      explanation: "No. This process is known as authorization."
    - content: "It's the process of verifying the identity of the end user who is accessing an application."
      isCorrect: true
      explanation: "This answer is correct."
    - content: "It's the process of requesting credentials from the user of an application."
      isCorrect: false
      explanation: "No. Requesting credentials can be part of authentication, but authentication is the process of verifying an identity."
  - content: "Which capability does the Microsoft Authentication Library (MSAL) provide?"
    choices:
    - content: "MSAL provides the ability to register an application with Microsoft Entra ID programmatically."
      isCorrect: false
      explanation: "No. MSAL is an authentication and authorization library. The Microsoft Graph API and SDK can be used to register an application programmatically."
    - content: "MSAL provides methods for applications to call the Microsoft Graph API."
      isCorrect: false
      explanation: "No. MSAL acquires tokens. A Microsoft Graph SDK or HTTP client uses an appropriate access token to make the Graph API request."
    - content: "MSAL helps applications acquire ID tokens for sign-in and access tokens for authorized API calls."
      isCorrect: true
      explanation: "This answer is correct. In the illustrated web app, MSAL4J handles token acquisition while the application coordinates browser redirects and callback processing."
  - content: "What do **scopes** describe when using the Microsoft Authentication Library (MSAL)?"
    choices:
    - content: "A collection of strings that declares the permissions and resources requested by the application."
      isCorrect: true
      explanation: "This answer is correct."
    - content: "It's a URL that indicates a directory that MSAL can request authentication tokens from."
      isCorrect: false
      explanation: "No. The URL to request tokens from is called the **Authority**. It's composed of the identity provider instance and sign-in audience for the app."
    - content: "The callback URL that receives an authorization code after sign-in."
      isCorrect: false
      explanation: "No. This is the **Redirect URI**. In the illustrated authorization-code flow, the callback receives a code and the server exchanges it for tokens."
      
