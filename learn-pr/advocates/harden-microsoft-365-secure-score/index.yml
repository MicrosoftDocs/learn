### YamlMime:Module
uid: learn.devrel.harden-microsoft-365-secure-score
title: Harden a Microsoft 365 tenant with Microsoft Secure Score
metadata:
  title: Harden a Microsoft 365 Tenant with Microsoft Secure Score
  description: Implement commonly flagged Microsoft Secure Score recommendations by using staged identity, application, privilege, recovery, and meeting controls.
  ms.date: 09/01/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: module-standard-task-based
  ms.service: microsoft-365-admin
summary: |
  Implement commonly flagged Microsoft Secure Score recommendations by using staged identity, application, privilege, recovery, and meeting controls.
abstract: |
  By the end of this module, you'll be able to:

  - Interpret Microsoft Secure Score points, states, and refresh behavior.
  - Prepare emergency access, pilot users, permissions, and recovery data.
  - Enforce strong authentication for administrators and standard users.
  - Block legacy authentication.
  - Remediate risky sign-ins and risky identities.
  - Prevent ungoverned delegated application consent.
  - Restrict lobby bypass, presenter privileges, and anonymous meeting access.
  - Replace broad standing roles with scoped, time-bound roles.
  - Enable self-service password reset for every user.
  - Validate effective behavior independently from score refresh.
prerequisites: |
  - Experience administering a Microsoft 365 tenant.
  - Familiarity with Microsoft Entra Conditional Access, Microsoft Teams meeting policies, and PowerShell.
  - To perform the configuration steps, access to a test tenant with the licenses and administrative roles described in this module.
