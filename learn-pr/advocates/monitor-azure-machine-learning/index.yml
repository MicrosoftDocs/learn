title: Introduction to Azure Machine Learning monitoring
summary: Learn how to monitor Azure Machine Learning deployments.
abstract: |
  After you complete this module, you'll be able to:
  - Set up monitoring for Azure Machine Learning resources and workflows.
  -	Manage metrics and logs for Azure Machine Learning resources.
  -	Describe how monitoring for Azure Machine Learning models works.
prerequisites:  |
  To get the best learning experience from this module, you should have knowledge of and experience with:
  - Fundamental monitoring concepts.
  - Fundamental Azure Machine Learning concepts.
