    <text x="966" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#172b4d" data-role="section-title" font-weight="700">TRUST BOUNDARY</text>
    <text x="966" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">AMD SEV-SNP isolates guest</text>
