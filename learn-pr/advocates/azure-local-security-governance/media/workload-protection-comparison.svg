<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1104" viewBox="0 0 1400 1104" role="img" aria-labelledby="workload-protection-comparison-title workload-protection-comparison-description" style="background-color: #ffffff" data-module="Azure Local 2610 security governance">
  <title id="workload-protection-comparison-title">Workload protection: choose the trust boundary</title>
  <desc id="workload-protection-comparison-description">Three alternatives, not a progression: standard VMs trust host administrators and use conventional guest controls. Trusted Launch adds Secure Boot and vTPM boot-chain protection, but does not isolate guest memory from host administrators; back up VM files and the guest-state-protection key and note that Azure Site Recovery is not supported. Confidential VMs are generally available in 2610 and use AMD SEV-SNP to isolate guest memory from the host, a tailored Ubuntu 24.04 image, stateless ephemeral filesystems, no guest management, cloud attestation and key release, and shutdown before migration. All alternatives require application authorization, appropriate data handling, physical security, and tested recovery.</desc>
  <rect id="workload-protection-comparison-background" x="0" y="0" width="1400" height="1104" fill="#ffffff" opacity="1" />
  <defs>
    <marker id="workload-protection-comparison-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#426789" />
    </marker>
  </defs>
  <text x="48" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#172b4d" data-role="diagram-heading" font-weight="600">Workload protection: choose the trust boundary</text>
  <text x="48" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#172b4d" data-role="reading-order">Azure Local 2610 | Read 1-3 left to right as alternatives, not sequential security upgrades.</text>
