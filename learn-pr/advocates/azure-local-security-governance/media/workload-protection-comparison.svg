    <text x="521" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="stage-title" font-weight="600">Trusted Launch</text>
    <text x="521" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#172b4d" data-role="section-title" font-weight="700">TRUST BOUNDARY</text>
    <text x="521" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Secure Boot and vTPM protect</text>
    <text x="521" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">the boot chain.</text>
    <text x="521" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">No guest-memory isolation</text>
    <text x="521" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">from host administrators.</text>
    <text x="521" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#172b4d" data-role="section-title" font-weight="700">RECOVERY CONSTRAINTS</text>
    <text x="521" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Back up VM files and the</text>
    <text x="521" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">guest-state-protection key.</text>
    <text x="521" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Azure Site Recovery is not</text>
    <text x="521" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">supported.</text>
