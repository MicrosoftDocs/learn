    <text x="76" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="stage-title" font-weight="600">Standard VM</text>
    <text x="76" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#172b4d" data-role="section-title" font-weight="700">TRUST BOUNDARY</text>
    <text x="76" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Host administrators are trusted.</text>
    <text x="76" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Conventional guest security</text>
    <text x="76" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">controls protect the workload.</text>
    <text x="76" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#172b4d" data-role="section-title" font-weight="700">OPERATING MODEL</text>
    <text x="76" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Use conventional guest operations</text>
    <text x="76" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">and supported image and</text>
    <text x="76" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">backup/restore workflows.</text>
    <text x="76" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#172b4d" data-role="section-title" font-weight="700">RECOVERY FOCUS</text>
    <text x="76" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Protect VM files and application</text>
    <text x="76" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">data; test recovery dependencies.</text>
  </g>
