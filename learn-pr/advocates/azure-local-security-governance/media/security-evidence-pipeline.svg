<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1684" viewBox="0 0 1200 1684" role="img" aria-labelledby="security-evidence-pipeline-title security-evidence-pipeline-description" style="background-color: #ffffff" data-module="Azure Local 2610 security governance">
  <title id="security-evidence-pipeline-title">Security evidence: events to accountable action</title>
  <desc id="security-evidence-pipeline-description">The host event path is events on every node, the integrated syslog forwarder with CEF payloads, authenticated and protected transport, SIEM correlation and alerts, and an accountable incident owner with retained evidence. Detect missing events as well as threats. Capture node identity, UTC time, policy version, approval or remediation linkage, and ingestion freshness; never secret values. A separate cloud lane assesses policy and posture and is not automatically routed through host syslog. Microsoft Defender Antivirus is not Microsoft Defender for Cloud.</desc>
