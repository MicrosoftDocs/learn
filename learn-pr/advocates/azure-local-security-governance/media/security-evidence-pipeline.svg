  <g data-note="Evidence records contain identifiers, not secrets.">
    <rect data-role="note-boundary" x="48" y="1510" width="1104" height="134" rx="8" fill="#f3f6fa" stroke="#8aa8c2" stroke-width="1.5" />
    <text x="72" y="1544" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#172b4d" data-role="note-title" font-weight="600">Evidence records contain identifiers, not secrets.</text>
    <text x="72" y="1577" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="note-body">Keep node identity, UTC time, policy version, approval/remediation linkage,</text>
    <text x="72" y="1606" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="note-body">and ingestion freshness. Never retain secret values in security evidence.</text>
  </g>
</svg>