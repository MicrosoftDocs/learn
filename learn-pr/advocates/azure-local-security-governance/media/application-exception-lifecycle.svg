  <title id="application-exception-lifecycle-title">Application-control exception lifecycle</title>
  <desc id="application-exception-lifecycle-description">Investigate blocked code and software support; approve narrow rules with an owner and expiry; build and test a supplemental policy with isolated software and validate rollback and support before deployment; deploy and verify every node with enforcement retained; retire or replace the exception through a validated supported workflow. Keep Microsoft base policies unchanged. Update the customer-policy source because it can reapply a locally removed policy.</desc>
