  <title id="diagram-title">Security control evidence</title>
  <desc id="diagram-description">Scoped administrative authority defines approved intent. Host enforcement protects the fabric. Workload protections add separate trust boundaries. Independent key custody and audit evidence establish recoverability and accountability.</desc>
