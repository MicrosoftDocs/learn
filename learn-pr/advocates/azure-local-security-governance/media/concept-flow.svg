    <text x="208" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#172b4d" data-role="stage-body">Separate host, cloud, guest, and cluster authority.</text>
    <text x="208" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#172b4d" data-role="stage-body">Approve exceptions and protect emergency access.</text>
