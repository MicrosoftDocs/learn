    <text x="208" y="1036" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#005a9e" data-role="scope" font-weight="700">ISOLATED VALIDATION</text>
    <text x="208" y="1072" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172b4d" data-role="stage-title" font-weight="600">Run an isolated restore test</text>
    <text x="208" y="1112" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Restore required files, keys, identities, and application dependencies.</text>
