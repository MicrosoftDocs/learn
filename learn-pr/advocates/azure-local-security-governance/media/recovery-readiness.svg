    </marker>
  </defs>
  <text x="48" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#172b4d" data-role="diagram-heading" font-weight="600">Recovery readiness: prove the dependencies</text>
  <text x="48" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#172b4d" data-role="reading-order">Azure Local 2610 | Read 1-5 from top to bottom. Custody must survive cluster failure.</text>
