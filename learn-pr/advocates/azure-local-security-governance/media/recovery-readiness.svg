    <text x="208" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#005a9e" data-role="scope" font-weight="700">INDEPENDENT RECOVERY CUSTODY</text>
    <text x="208" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172b4d" data-role="stage-title" font-weight="600">Verify access, versions, and retention</text>
    <text x="208" y="842" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Verify authorized recovery access without relying on the failed cluster.</text>
    <text x="208" y="872" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Check identifiers, versions, retention, and rotation records.</text>
    <text x="208" y="902" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Metadata checks alone are not a restore test.</text>
  </g>
