<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610" role="img" aria-labelledby="recovery-readiness-title recovery-readiness-description" style="background-color: #ffffff" data-module="Azure Local 2610 security governance">
  <title id="recovery-readiness-title">Recovery readiness: prove the dependencies</title>
  <desc id="recovery-readiness-description">Inventory separate dependencies in the cluster failure domain: BitLocker recovery material; VM files plus the guest-state-protection key for Trusted Launch and independently protected wrapping private key custody for its wrapped manual backups in 2505 and later; and identity and application recovery material. The public wrapping key alone cannot recover these backups. Record and escrow through supported workflows in an independent protected repository with an independent recovery operator. Azure Key Vault is an example for key escrow, not storage for all backup material. Verify access, versions, and retention; perform an isolated restore test; record measured recovery point and recovery time against objectives and approve. Metadata checks are not restore tests. Automatic system-secret backup is preview and does not remove manual backup responsibilities.</desc>
  <rect id="recovery-readiness-background" x="0" y="0" width="1200" height="1610" fill="#ffffff" opacity="1" />
