    <text x="208" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#005a9e" data-role="scope" font-weight="700">CLUSTER FAILURE DOMAIN: INVENTORY</text>
    <text x="208" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172b4d" data-role="stage-title" font-weight="600">Inventory distinct recovery material</text>
    <text x="208" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">BitLocker: volume recovery material is separate from VM backup files.</text>
    <text x="208" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Trusted Launch: VM files + guest-state-protection key + wrapping PRIVATE key.</text>
    <text x="208" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Identity and applications: retain their own recovery material and data.</text>
    <text x="208" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Map each item to its resource; one key does not unlock everything.</text>
  </g>
