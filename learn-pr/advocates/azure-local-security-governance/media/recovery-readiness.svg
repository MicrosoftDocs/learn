    <text x="208" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#005a9e" data-role="scope" font-weight="700">INDEPENDENT PROTECTED REPOSITORY + RECOVERY OPERATOR</text>
    <text x="208" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172b4d" data-role="stage-title" font-weight="600">Record and escrow independently</text>
    <text x="208" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Example: Azure Key Vault for key escrow; separate storage for VM backups.</text>
    <text x="208" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Keep private keys, backup copies, and recovery-operator access independent of the cluster.</text>
    <text x="208" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Manual Trusted Launch backups (2505+): the public wrapping key alone is insufficient.</text>
  </g>
