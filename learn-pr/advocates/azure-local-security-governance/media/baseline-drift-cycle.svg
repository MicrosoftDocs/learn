<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="baseline-drift-cycle-title baseline-drift-cycle-description" style="background-color: #ffffff" data-module="Azure Local 2610 security governance">
  <title id="baseline-drift-cycle-title">Baseline drift: enforcement and evidence</title>
  <desc id="baseline-drift-cycle-description">Five ordered stages distinguish local enforcement from cloud audit. Approve a baseline and record custom intent; OSConfig and drift control enforce desired settings locally on every node; collect actual state and timestamps; Azure Policy audits observed state; an accountable owner investigates discrepancies and uses supported intent. Customize with Set-AzsSecurity while keeping drift control enabled. Cloud evidence can lag and an audit is not a remediation command.</desc>
