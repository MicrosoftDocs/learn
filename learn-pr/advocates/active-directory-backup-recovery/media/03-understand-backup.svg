<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c6527048e72a38e6d-title c6527048e72a38e6d-desc" data-module="active-directory-backup-recovery" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c6527048e72a38e6d-title">Qualify a writable controller backup for recovery</title><desc id="c6527048e72a38e6d-desc">Advanced Active Directory back up and recovery, UNIT 03. A backup must capture consistent state and remain accessible even when production identity services are unavailable. 1. Capture consistent state: Use an AD-aware, VSS-based backup and retain its catalog and source identity. 2. Establish a safe point: Compare directory health and replication history with the incident timeline. 3. Test a supported restore: Demonstrate access to media, keys, credentials, and a compatible isolated target. Key takeaways: A read-only domain controller backup cannot supply the writable controller needed to recover a domain. System state is not a replacement-hardware image; match the backup type to the recovery platform and method.</desc><defs><marker id="c6527048e72a38e6d-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="c6527048e72a38e6d-i151" viewBox="88 83 42 52" data-asset="CnE_GeneralSymbols\Tasks.svg" xmlns="http://www.w3.org/2000/svg"><g><g><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M123.4,91.3h-2v34h-25v-34h-2c-1.7,0-3,1.4-3,3v33.9   c0,1.7,1.4,3,3,3h29c1.7,0,3-1.4,3-3V94.3C126.5,92.7,125.1,91.3,123.4,91.3z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M116.5,89.4H113v-1.2c0-1.6-1.3-2.9-2.9-2.9h-2.3   c-1.6,0-2.9,1.3-2.9,2.9v1.2h-3.5c-1.2,0-2.3,0.8-2.7,1.9h8.8v-2h3v2h8.8C118.8,90.2,117.8,89.4,116.5,89.4z" /><path fill-rul