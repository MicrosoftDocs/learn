x="116 869.3 948 70"><text x="120" y="897.12" font-size="23" font-weight="400" fill="#364f5e">A read-only domain controller backup cannot supply the writable controller needed to</text><text x="120" y="929.12" font-size="23" font-weight="400" fill="#364f5e">recover a domain.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="962.2" y2="962.2" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="1005.06" r="13" fill="#e2f1ee" /><path d="M71 1005.06l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 985.1 948 70"><text x="120" y="1012.92" font-size="23" font-weight="400" fill="#364f5e">System state is not a replacement-hardware image; match the backup type to the</text><text x="120" y="1044.92" font-size="23" font-weight="400" fill="#364f5e">recovery platform and method.</text></g></g></svg>