<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c6c99fca7fcc014ed-title c6c99fca7fcc014ed-desc" data-module="active-directory-backup-recovery" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c6c99fca7fcc014ed-title">Define the recovery boundary before selecting a restore</title><desc id="c6c99fca7fcc014ed-desc">Advanced Active Directory back up and recovery, UNIT 02. Determine what is damaged, what remains trustworthy, and who can approve actions at the required scope. 1. Locate the damage: Separate a deleted object or failed controller from domain or forest-wide damage. 2. Set recovery objectives: Identify acceptable downtime, tolerable data loss, and dependent identity services. 3. Approve scoped authority: Assign only the privileges needed for the selected objects, domain, or forest. Key takeaways: Making a selected object authoritative and designating a SYSVOL source solve different replication problems. For suspected compromise, require trusted administration and an isolated network before restoring directory services.</desc><defs><marker id="c6c99fca7fcc014ed-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Advanced Active Directory back up and recovery</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 02</text></g><g data-field="title" data-bo