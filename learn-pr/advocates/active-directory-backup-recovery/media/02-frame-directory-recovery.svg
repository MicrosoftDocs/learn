"400" fill="#364f5e">domain or forest-wide</text><text x="78" y="693.44" font-size="21" font-weight="400" fill="#364f5e">damage.</text></g></g><g data-node="2"><rect x="408" y="400.03" width="304" height="358.47" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="426" y="418.03" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="426 419.53 46 29"><text x="439.797" y="439.797" font-size="16" font-weight="700" fill="#ffffff">02</text></g><g data-field="label" data-box="426 493.78 268 80"><text x="430" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Set recovery</text><text x="430" y="562.917" font-size="27" font-weight="700" fill="#132c3b">objectives</text></g><g data-field="detail" data-box="426 580.78 268 122"><text x="430" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Identify acceptable</text><text x="430" y="635.44" font-size="21" font-weight="400" fill="#364f5e">downtime, tolerable data</text><text x="430" y="664.44" font-size="21" font-weight="400" fill="#364f5e">loss, and dependent</text><text x="430" y="693.44" font-size="21" font-weight="400" fill="#364f5e">identity services.</text></g></g><g data-node="3"><rect x="760" y="400.03" width="304" height="358.47" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="778" y="418.03" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="778 419.53 46 29"><text x="791.797" y="439.797" font-size="16" font-weight="700" fill="#ffffff">03</text></g><g data-field="label" data-box="778 493.78 268 80"><text x="782" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Approve scoped</text><text x="782" y="562.917" font-size="27" font-weight="700" fill="#132c3b">authority</text></g><g data-field="detail" data-box="778 580.78 268 93"><text x="782" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Assign only the privileges</text><text x="782" y="635.44" font-size="21" font-weight="400" fill="#364f5e">needed for the selected</text><text x="782" y="664.44" font-size="21" font-weight="400" fill="#364f5e">objects, domain, or forest.</text></g></g><g data-field="takeaways" data-box="56 795.4 320 45"><text x="60" y="828.613" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="819.7" y2="819.7" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="889.26" r="13" fill="#e2f1ee" /><path d="M71 889.26l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 869.3 948 70"><text x="120" y="897.12" font-size="23" font-weight="400" fill="#364f5e">Making a selected object authoritative and designating a SYSVOL source solve different</text><text x="120" y="929.12" font-size="23" font-weight="400" fill="#364f5e">replication problems.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="962.2" y2="962.2" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="1005.06" r="13" fill="#e2f1ee" /><path d="M71 1005.06l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 985.1 948 70"><text x="120" y="1012.92" font-size="23" font-weight="400" fill="#364f5e">For suspected compromise, require trusted administration and an isolated network</text><text x="120" y="1044.92" font-size="23" font-weight="400" fill="#364f5e">before restoring directory services.</text></g></g></svg>