ta-field="label" data-box="417.333 493.78 285.333 80"><text x="421.333" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Isolated controller</text><text x="421.333" y="562.917" font-size="27" font-weight="700" fill="#132c3b">loss</text></g><g data-field="detail" data-box="417.333 580.78 285.333 122"><text x="421.333" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Prefer rebuilding and</text><text x="421.333" y="635.44" font-size="21" font-weight="400" fill="#364f5e">promoting when trusted</text><text x="421.333" y="664.44" font-size="21" font-weight="400" fill="#364f5e">partners can replicate</text><text x="421.333" y="693.44" font-size="21" font-weight="400" fill="#364f5e">current state.</text></g></g><g data-node="3"><rect x="742.667" y="400.03" width="321.333" height="358.47" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="760.667" y="418.03" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="760.667 419.53 46 29"><text x="774.463" y="439.797" font-size="16" font-weight="700" fill="#ffffff">03</text></g><g data-field="label" data-box="760.667 493.78 285.333 80"><text x="764.667" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Domain or forest</text><text x="764.667" y="562.917" font-size="27" font-weight="700" fill="#132c3b">damage</text></g><g data-field="detail" data-box="760.667 580.78 285.333 93"><text x="764.667" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Evaluate whether shared</text><text x="764.667" y="635.44" font-size="21" font-weight="400" fill="#364f5e">partitions, trust, or privilege</text><text x="764.667" y="664.44" font-size="21" font-weight="400" fill="#364f5e">extend the recovery scope.</text></g></g><g data-field="takeaways" data-box="56 795.4 320 45"><text x="60" y="828.613" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="819.7" y2="819.7" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="889.26" r="13" fill="#e2f1ee" /><path d="M71 889.26l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 869.3 948 70"><text x="120" y="897.12" font-size="23" font-weight="400" fill="#364f5e">A backup restore that must override newer replicated object versions needs selected</text><text x="120" y="929.12" font-size="23" font-weight="400" fill="#364f5e">object authority, not a blanket directory rollback.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="962.2" y2="962.2" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="1005.06" r="13" fill="#e2f1ee" /><path d="M71 1005.06l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 985.1 948 70"><text x="120" y="1012.92" font-size="23" font-weight="400" fill="#364f5e">When identity compromise is suspected, preserve evidence and contain it before</text><text x="120" y="1044.92" font-size="23" font-weight="400" fill="#364f5e">restoring into any management environment.</text></g></g></svg>