<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="ce588b55279ac5271-title ce588b55279ac5271-desc" data-module="active-directory-backup-recovery" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="ce588b55279ac5271-title">Build a trusted forest from isolated writable controllers</title><desc id="ce588b55279ac5271-desc">Advanced Active Directory back up and recovery, UNIT 06. Recover the forest root and parent dependencies before introducing the domains and services that rely on them. 1. Recover the forest root: Restore the first writable controller with trusted DNS and the required roles. 2. Recover remaining domains: Seed each domain in dependency order with one authoritative SYSVOL source per domain. 3. Expand after validation: Verify partition replication and catalog readiness before adding service capacity. Key takeaways: Treat the PDC Emulator, RID Master, and Infrastructure Master as domain roles; forest-wide roles have a different recovery scope. Keep former controllers isolated and remove obsolete metadata before admitting replacements into the approved topology.</desc><defs><marker id="ce588b55279ac5271-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="ce588b55279ac5271-i151" viewBox="88 83 42 52" data-asset="CnE_GeneralSymbols\Tasks.svg" xmlns="http://www.w3.org/2000/svg"><g><g><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M123.4,91.3h-2v34h-25v-34h-2c-1.7,0-3,1.4-3,3v33.9   c0,1.7,1.4,3,3,3h29c1.7,0,3-1.4,3-3V94.3C126.5,92.7,125.1,91.3,123.4,91.3z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M116.5,89.4H113v-1.2c0-1.6-1.3-2.9-2.9-2.9h-2.3   c-1.6,0-2.9,1.3-2.9,2.9v1.2h-3.5c-1.2,0-2.3,0.8-2.7,1.9h8.8v-2h3v2h8.8C118.8,90.2,117.8,89.4,116.5,89.4z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M119.3,91.3h-8.8v1h-3v-1h-8.8c-0.1,0.3-0.2,0.7-0.2,1.1v2.9h21   v-2.9C119.5,92,119.4,91.6,119.3,91.3z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M117.1,102.8c-0.3-0.2-0.7-0.2-0.9,0.1l-9.9,13.1l-5.1-5.5   c-0.2-0.3-0.6-0.3-0.8-0.1l-2.2,1.9c-0.2,0.2-0.2,0.6,0,0.8l8.1,9.1l13.1-16.8c0.2-0.3,0.2-0.6-0.1-0.9L117.1,102.8z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="none" d="M91.5,85.3v46h35v-46H91.5z M121.5,125.3h-25v-34h11v-2h3v2h11V125.3   z" /><rect x="107.5" y="89.3" fill-rule="evenodd" clip-rule="evenodd" fill="none" width="3" height="2" /></g></g></symbol></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Advanced Active Directory back up and recovery</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 06</text></g><g data-field="title" data-box="56 95 1008 132"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">Build a trusted forest from isolated writable</text><text x="60" y="210.64" font-size="46" font-weight="700" fill="#132c3b">controllers</text></g><g data-field="concept" data-box="56 232 1008 72"><text x="60" y="260.9" font-size="24" font-weight="400" fill="#364f5e">Recover the forest root and parent dependencies before introducing the domains and</text><text x="60" y="293.9" font-size="24" font-weight="400" fill="#364f5e">services that rely on them.</text></g><line x1="56" x2="1064" y1="321" y2="321" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 345.03 360 43"><text x="60" y="377.167" font-size="27" font-weight="700" fill="#132c3b">Sequence</text></g><line x1="203.297" x2="1064" y1="368.25" y2="368.25" stroke="#c6d6df" stroke-width="1.5" /><line class="connector" x1="363" y1="579.265" x2="404" y2="579.265" stroke="#286486" stroke-width="3" stroke-linecap="round" marker-end="url(#ce588b55279ac5271-arrow)" /><line class="connector" x1="715" y1="579.265" x2="756" y2="579.265" stroke="#286486" stroke-width="3" stroke-linecap="round" marker-end="url(#ce588b55279ac5271-arrow)" /><g data-node="1"><rect x="56" y="400.03" width="304" height="358.47" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="418.03" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 419.53 46 29"><text x="87.797" y="439.797" font-size="16" font-weight="700" fill="#ffffff">01</text></g><g data-field="label" data-box="74 493.78 268 80"><text x="78" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Recover the forest</text><text x="78" y="562.917" font-size="27" font-weight="700" fill="#132c3b">root</text></g><g data-field="detail" data-box="74 580.78 268 122"><text x="78" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Restore the first writable</text><text x="78" y="635.44" font-size="21" font-weight="400" fill="#364f5e">controller with trusted</text><text x="78" y="664.44" font-size="21" font-weight="400" fill="#364f5e">DNS and the required</text><text x="78" y="693.44" font-size="21" font-weight="400" fill="#364f5e">roles.</text></g></g><g data-node="2"><rect x="408" y="400.03" width="304" height="358.47" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="426" y="418.03" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="426 419.53 46 29"><text x="439.797" y="439.797" font-size="16" font-weight="700" fill="#ffffff">02</text></g><g data-field="label" data-box="426 493.78 268 80"><text x="430" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Recover remaining</text><text x="430" y="5