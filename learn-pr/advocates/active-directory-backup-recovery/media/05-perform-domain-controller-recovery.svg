<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c79ecea35208be6f5-title c79ecea35208be6f5-desc" data-module="active-directory-backup-recovery" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c79ecea35208be6f5-title">Restore a deleted hierarchy or replace a failed controller</title><desc id="c79ecea35208be6f5-desc">Advanced Active Directory back up and recovery, UNIT 05. Online object recovery preserves running services; controller recovery addresses a different failure boundary. 1. Recycle Bin recovery: Restore eligible parent containers before nested containers and leaf objects. 2. Controller rebuild: Promote a clean replacement when a healthy writable partner can supply directory data. 3. System-state recovery: Use an approved AD-aware backup and verify its source, version, and recovery type. Key takeaways: After restoring an OU, check nested membership, delegated rights, policy links, and applications that reference distinguished names. In a routine restore with a healthy SYSVOL partner, synchronize nonauthoritatively instead of creating another authoritative source.</desc><defs /><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Advanced Active Directory back up and recovery</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 05</text></g><g data-field="title" data-box="56 95 1008 132"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">Restore a deleted hierarchy or replace a</text><text x="60" y="210.64" font-size="46" font-weight="700" fill="#132c3b">failed controller</text></g><g data-field="concept" data-box="56 232 1008 72"><text x="60" y="260.9" font-size="24" font-weight="400" fill="#364f5e">Online object recovery preserves running services; controller recovery addresses a different</text><text x="60" y="293.9" font-size="24" font-weight="400" fill="#364f5e">failure boundary.</text></g><line x1="56" x2="1064" y1="321" y2="321" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 345.03 360 43"><text x="60" y="377.167" font-size="27" font-weight="700" fill="#132c3b">Side by side</text></g><line x1="233.177" x2="1064" y1="368.25" y2="368.25" stroke="#c6d6df" stroke-width="1.5" /><g data-node="1"><rect x="56" y="400.03" width="321.333" height="358.47" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="418.03" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 419.53 46 29"><text x="87.797" y="439.797" font-size="16" font-weight="700" fill="#ffffff">01</text></g><g data-field="label" data-box="74 493.78 285.333 43"><text x="78" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Recycle Bin recovery</text></g><g data-field="detail" data-box="74 580.78 285.333 93"><text x="78" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Restore eligible parent</text><text x="78" y="635.44" font-size="21" font-weight="400" fill="#364f5e">containers before nested</text><text x="78" y="664.44" font-size="21" font-weight="400" fill="#364f5e">containers and leaf objects.</text></g></g><g data-node="2"><rect x="399.333" y="400.03" width="321.333" height="358.47" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="417.333" y="418.03" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="417.333 419.53 46 29"><text x="431.13" y="439.797" font-size="16" font-weight="700" fill="#ffffff">02</text></g><g data-field="label" data-box="417.333 493.78 285.333 43"><text x="421.333" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Controller rebuild</text></g><g data-field="detail" data-box="417.333 580.78 285.333 122"><text x="421.333" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Promote a clean</text><text x="421.333" y="635.44" font-size="21" font-weight="400" fill="#364f5e">replacement when a healthy</text><text x="421.333" y="664.44" font-size="21" font-weight="400" fill="#364f5e">writable partner can supply</text><text x="421.333" y="693.44" font-size="21" font-weight="400" fill="#364f5e">directory data.</text></g></g><g data-node="3"><rect x="742.667" y="400.03" width="321.333" height="358.47" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="760.667" y="418.03" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="760.667 419.53 46 29"><text x="774.463" y="439.797" font-size="16" font-weight="700" fill="#ffffff">03</text></g><g data-field="label" data-box="760.667 493.78 285.333 80"><text x="764.667" y="525.917" font-size="27" font-weight="700" fill="#132c3b">System-state</text><text x="764.667" y="562.917" font-size="27" font-weight="700" fill="#132c3b">recovery</text></g><g data-field="detail" data-box="760.667 580.78 285.333 93"><text x="764.667" y="606.44" font-size="21" font-weight="400" fill="#364f5e">Use an approved AD-aware</text><text x="764.667" y="635.44" font-size="21" font-weight="400" fill="#364f5e">backup and verify its source,</text><text x="764.667" y="664.44" font-size="21" font-weight="400" fill="#364f5e">version, and recovery type.</text></g></g><g data-field="takeaways" data-box="56 795.4 320 45"><text x="60" y="828.613" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="819.7" y2="819.7" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="889.26" r="13" fill="#e2f1ee" /><path d="M71 889.26l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 869.3 948 70"><text x="120" y="897.12" font-size="23" font-weight="400" fill="#364f5e">After restoring an OU, check nested membership, delegated rights, policy links, and</text><text x="120" y="929.12" font-size="23" font-weight="400" fill="#364f5e">applications that reference distinguished names.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="962.2" y2="962.2" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="1005.06" r="13" fill="#e2f1ee" /><path d="M71 1005.06l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 985.1 948 70"><text x="120" y="1012.92" font-size="23" font-weight="400" fill="#364f5e">In a routine restore with a healthy SYSVOL partner, synchronize nonauthoritatively instead</text><text x="120" y="1044.92" font-size="23" font-weight="400" fill="#364f5e">of creating another authoritative source.</text></g></g></svg>