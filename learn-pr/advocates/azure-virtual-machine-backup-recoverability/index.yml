title: Azure virtual machine backup and recoverability
summary: |
  Virtual machine backup and recovery involve more than preserving disks and restarting a machine. Backup policies must balance capture frequency, retention, cost, and acceptable data loss, while recovery points must contain the required disks and application data in a recoverable state. Restoring that data also depends on compatible infrastructure, encryption keys, permissions, network access, and application dependencies. An older recovery point can omit valid newer transactions, and a successful restore job doesn't prove that the application works or that recovery objectives have been met. Reliable recovery therefore requires isolated validation, control over which copy can accept new writes, and confirmation that backup protection continues.
abstract: |
  By completing this module, you can demonstrate the following operational outcomes.

  - Evaluate recovery-point content, consistency, disk scope, and retention.
  - Select a supported recovery method and an isolated destination.
  - Validate recovered records and application transactions independently of job status.
  - Calculate recovery duration and observed data loss, and distinguish a passing rehearsal from a suitable ongoing protection design.
  - Confirm workload authority, subsequent protection, retained evidence, and safe cleanup.
prerequisites: |
  - Completion of the prerequisite virtual machine operations module (M01).
  - Existing Azure Backup configuration and virtual machine restore skills.
  - Windows guest administration experience.
  - Basic recovery-planning knowledge.
