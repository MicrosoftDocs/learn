  <text x="60" data-kind="heading" font-weight="600" font-size="28" y="53" fill="#000000">Backup assurance: prove usable recovery</text>
  <text fill="#000000" font-size="18" y="88" data-kind="subtitle" x="60">A successful restore job is only one part of recovery evidence.</text>
  <rect stroke="#0078d4" x="80" stroke-width="2" width="1040" data-order="1" fill="#f3f8fd" data-kind="card" height="112" rx="12" id="azure-virtual-machine-backup-recoverability-step-1-card" y="140" />
  <circle cy="196" fill="#cfe4fa" cx="122" stroke="#0078d4" r="23" />
  <text data-kind="number" y="204" font-weight="600" text-anchor="middle" font-size="23" fill="#000000" data-card="azure-virtual-machine-backup-recoverability-step-1-card" x="122">1</text>
  <use x="174" width="52" height="52" aria-hidden="true" data-kind="azure-icon" y="170" href="#azure-virtual-machine-backup-recoverability-icon-policy" />
  <text x="252" data-kind="step-heading" data-card="azure-virtual-machine-backup-recoverability-step-1-card" font-weight="600" font-size="23" y="183" fill="#000000">Define acceptance criteria</text>
  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-backup-recoverability-step-1-card" font-size="17" y="217" fill="#000000">State required records, application behavior, recovery time, and acceptable loss.</text>
