  <circle cy="352" fill="#cfe4fa" cx="122" stroke="#0078d4" r="23" />
  <text data-kind="number" y="360" font-weight="600" text-anchor="middle" font-size="23" fill="#000000" data-card="azure-virtual-machine-backup-recoverability-step-2-card" x="122">2</text>
  <use x="174" width="52" height="52" aria-hidden="true" data-kind="azure-icon" y="326" href="#azure-virtual-machine-backup-recoverability-icon-vault" />
  <text x="252" data-kind="step-heading" data-card="azure-virtual-machine-backup-recoverability-step-2-card" font-weight="600" font-size="23" y="339" fill="#000000">Select a supported recovery point</text>
  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-backup-recoverability-step-2-card" font-size="17" y="373" fill="#000000">Inspect scope, consistency, selected disks, retention, and available methods.</text>
  <path stroke="#40566f" stroke-width="2" marker-end="url(#azure-virtual-machine-backup-recoverability-flow-arrow)" d="M 600 418 L 600 441" data-kind="connector" fill="none" />
  <rect stroke="#0078d4" x="80" stroke-width="2" width="1040" data-order="3" fill="#f3f8fd" data-kind="card" height="112" rx="12" id="azure-virtual-machine-backup-recoverability-step-3-card" y="452" />
  <circle cy="508" fill="#cfe4fa" cx="122" stroke="#0078d4" r="23" />
  <text data-kind="number" y="516" font-weight="600" text-anchor="middle" font-size="23" fill="#000000" data-card="azure-virtual-machine-backup-recoverability-step-3-card" x="122">3</text>
  <use x="174" width="52" height="52" aria-hidden="true" data-kind="azure-icon" y="482" href="#azure-virtual-machine-backup-recoverability-icon-machine" />
  <text x="252" data-kind="step-heading" data-card="azure-virtual-machine-backup-recoverability-step-3-card" font-weight="600" font-size="23" y="495" fill="#000000">Restore into isolation</text>
  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-backup-recoverability-step-3-card" font-size="17" y="529" fill="#000000">Keep the recovered workload from conflicting with the source.</text>
  <path stroke="#40566f" stroke-width="2" marker-end="url(#azure-virtual-machine-backup-recoverability-flow-arrow)" d="M 600 574 L 600 597" data-kind="connector" fill="none" />
  <rect stroke="#0078d4" x="80" stroke-width="2" width="1040" data-order="4" fill="#f3f8fd" data-kind="card" height="112" rx="12" id="azure-virtual-machine-backup-recoverability-step-4-card" y="608" />
  <circle cy="664" fill="#cfe4fa" cx="122" stroke="#0078d4" r="23" />
  <text data-kind="number" y="672" font-weight="600" text-anchor="middle" font-size="23" fill="#000000" data-card="azure-virtual-machine-backup-recoverability-step-4-card" x="122">4</text>
  <use x="174" width="52" height="52" aria-hidden="true" data-kind="azure-icon" y="638" href="#azure-virtual-machine-backup-recoverability-icon-diagnostics" />
  <text x="252" data-kind="step-heading" data-card="azure-virtual-machine-backup-recoverability-step-4-card" font-weight="600" font-size="23" y="651" fill="#000000">Validate data and application</text>
  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-backup-recoverability-step-4-card" font-size="17" y="685" fill="#000000">Compare known records or hashes and run a functional workload check.</text>
  <path stroke="#40566f" stroke-width="2" marker-end="url(#azure-virtual-machine-backup-recoverability-flow-arrow)" d="M 600 730 L 600 753" data-kind="connector" fill="none" />
  <rect stroke="#0078d4" x="80" stroke-width="2" width="1040" data-order="5" fill="#f3f8fd" data-kind="card" height="112" rx="12" id="azure-virtual-machine-backup-recoverability-step-5-card" y="764" />
  <circle cy="820" fill="#cfe4fa" cx="122" stroke="#0078d4" r="23" />
  <text data-kind="number" y="828" font-weight="600" text-anchor="middle" font-size="23" fill="#000000" data-card="azure-virtual-machine-backup-recoverability-step-5-card" x="122">5</text>
  <use x="174" width="52" height="52" aria-hidden="true" data-kind="azure-icon" y="794" href="#azure-virtual-machine-backup-recoverability-icon-metrics" />
  <text x="252" data-kind="step-heading" data-card="azure-virtual-machine-backup-recoverability-step-5-card" font-weight="600" font-size="23" y="807" fill="#000000">Measure the observed outcome</text>
  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-backup-recoverability-step-5-card" font-size="17" y="841" fill="#000000">Use defined timestamps and test records rather than job status alone.</text>
  <path stroke="#40566f" stroke-width="2" marker-end="url(#azure-virtual-machine-backup-recoverability-flow-arrow)" d="M 600 886 L 600 909" data-kind="connector" fill="none" />
  <rect stroke="#0078d4" x="80" stroke-width="2" width="1040" data-order="6" fill="#f3f8fd" data-kind="card" height="112" rx="12" id="azure-virtual-machine-backup-recoverability-step-6-card" y="920" />
  <circle cy="976" fill="#cfe4fa" cx="122" stroke="#0078d4" r="23" />
  <text data-kind="number" y="984" font-weight="600" text-anchor="middle" font-size="23" fill="#000000" data-card="azure-virtual-machine-backup-recoverability-step-6-card" x="122">6</text>
  <use x="174" width="52" height="52" aria-hidden="true" data-kind="azure-icon" y="950" href="#azure-virtual-machine-backup-recoverability-icon-vault" />
  <text x="252" data-kind="step-heading" data-card="azure-virtual-machine-backup-recoverability-step-6-card" font-weight="600" font-size="23" y="963" fill="#000000">Confirm ongoing protection</text>
  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-backup-recoverability-step-6-card" font-size="17" y="997" fill="#000000">Verify the authoritative workload, remaining exceptions, and retained costs.</text>
  <text fill="#000000" font-size="17" y="1091" data-kind="note" x="80">Retain protection and retention safeguards. Do not weaken them to simplify cleanup.</text>
</svg>