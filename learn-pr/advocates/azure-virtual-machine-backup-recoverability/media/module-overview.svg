  <title id="azure-virtual-machine-backup-recoverability-diagram-title">Backup assurance: prove usable recovery</title>
  <desc id="azure-virtual-machine-backup-recoverability-diagram-description">A successful restore job is only one part of recovery evidence. Read the numbered cards from top to bottom. Retain protection and retention safeguards. Do not weaken them to simplify cleanup.</desc>
