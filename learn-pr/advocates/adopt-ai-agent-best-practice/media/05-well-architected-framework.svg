<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c901244e02bf71b83-title c901244e02bf71b83-desc" data-module="adopt-ai-agent-best-practice" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c901244e02bf71b83-title">Three workload design questions for an AI agent</title><desc id="c901244e02bf71b83-desc">Implement best practices to empower AI agent efficiency and ensure long-term success, UNIT 05. The Well-Architected pillars examine different consequences of how a workload is designed and run. 1. Performance efficiency: Test early and monitor system health as demand and compute needs change. 2. Operational excellence: Version models and automate deployment pipelines so changes can be managed safely. 3. Cost optimization: Estimate query frequency and complexity before choosing compute capacity. Key takeaways: A reliability review also needs to cover training, hosting, and inference, not just whether the front end responds. For security, protect sensitive data in transit and at rest and reassess controls throughout the workload lifecycle.</desc><defs><symbol id="c901244e02bf71b83-i151" viewBox="88 83 42 52" data-asset="CnE_GeneralSymbols\Tasks.svg" xmlns="http://www.w3.org/2000/svg"><g><g><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M123.4,91.3h-2v34h-25v-34h-2c-1.7,0-3,1.4-3,3v33.9   c0,1.7,1.4,3,3,3h29c1.7,0,3-1.4,3-3V94.3C126.5,92.7,125.1,91.3,123.4,91.3z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M116.5,89.4H113v-1.2c0-1.6-1.3-2.9-2.9-2.9h-2.3   c-1.6,0-2.9,1.3-2.9,2.9v1.2h-3.5c-1.2,0-2.3,0.8-2.7,1.9h8.8v-2h3v2h8.8C118.8,90.2,117.8,89.4,116.5,89.4z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M119.3,91.3h-8.8v1h-3v-1h-8.8c-0.1,0.3-0.2,0.7-0.2,1.1v2.9h21   v-2.9C119.5,92,119.4,91.6,119.3,91.3z" /><path fill-rule="evenodd" cli