00" fill="#364f5e">FinOps links financial accountability to the engineering and product decisions that drive</text><text x="60" y="293.9" font-size="24" font-weight="400" fill="#364f5e">consumption.</text></g><line x1="56" x2="1064" y1="321" y2="321" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 347.06 360 43"><text x="60" y="379.197" font-size="27" font-weight="700" fill="#132c3b">Sequence</text></g><line x1="203.297" x2="1064" y1="370.28" y2="370.28" stroke="#c6d6df" stroke-width="1.5" /><line class="connector" x1="363" y1="573.03" x2="404" y2="573.03" stroke="#286486" stroke-width="3" stroke-linecap="round" marker-end="url(#c8f6a9b33c0750e6b-arrow)" /><line class="connector" x1="715" y1="573.03" x2="756" y2="573.03" stroke="#286486" stroke-width="3" stroke-linecap="round" marker-end="url(#c8f6a9b33c0750e6b-arrow)" /><g data-node="1"><rect x="56" y="402.06" width="304" height="341.94" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="420.06" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 421.56 46 29"><text x="87.797" y="441.827" font-size="16" font-weight="700" fill="#ffffff">01</text></g><use x="298" y="420.06" width="44" height="44" aria-hidden="true" xlink:href="#c8f6a9b33c0750e6b-i435" /><g data-field="label" data-box="74 499.801 268 43"><text x="78" y="531.937" font-size="27" font-weight="700" fill="#132c3b">Allocate cost</text></g><g data-field="detail" data-box="74 586.801 268 93"><text x="78" y="612.461" font-size="21" font-weight="400" fill="#364f5e">Attribute resource</text><text x="78" y="641.461" font-size="21" font-weight="400" fill="#364f5e">spending to the agents or</text><text x="78" y="670.461" font-size="21" font-weight="400" fill="#364f5e">workloads that use it.</text></g></g><g data-node="2"><rect x="408" y="402.06" width="304" height="341.94" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="426" y="420.06" width="46" height="32" rx="9" fill="