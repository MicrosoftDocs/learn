stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 860.6 948 70"><text x="120" y="888.42" font-size="23" font-weight="400" fill="#364f5e">Include finance and product owners in forecasting so that an inexpensive agent is not</text><text x="120" y="920.42" font-size="23" font-weight="400" fill="#364f5e">mistaken for a valuable one.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="956.4" y2="956.4" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="1002.16" r="13" fill="#e2f1ee" /><path d="M71 1002.16l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 982.2 948 70"><text x="120" y="1010.02" font-size="23" font-weight="400" fill="#364f5e">Investigate anomalous spending alongside usage; a bill alone cannot reveal whether a</text><text x="120" y="1042.02" font-size="23" font-weight="400" fill="#364f5e">workload is delivering more value.</text></g></g></svg>