<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="cbcbbf92b0a93376e-title cbcbbf92b0a93376e-desc" data-module="adopt-ai-agent-best-practice" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="cbcbbf92b0a93376e-title">Size the AI adoption checklist to the organization</title><desc id="cbcbbf92b0a93376e-desc">Implement best practices to empower AI agent efficiency and ensure long-term success, UNIT 04. The Cloud Adoption Framework covers strategy, planning, readiness, governance, management, and security at different levels of detail. 1. Startup checklist: Select an architecture, secure resources and data, and manage models and costs. 2. Enterprise checklist: Add skills assessment, use case prioritization, policy monitoring, and continuity plans. Key takeaways: An enterprise proof of concept belongs in planning, where it informs priorities and delivery estimates. A shorter startup checklist still calls for enforcing governance policies and protecting the data used by agents.</desc><defs><symbol id="cbcbbf92b0a93376e-i151" viewBox="88 83 42 52" data-asset="CnE_GeneralSymbols\Tasks.svg" xmlns="http://www.w3.org/2000/svg"><g><g><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M123.4,91.3h-2v34h-25v-34h-2c-1.7,0-3,1.4-3,3v33.9   c0,1.7,1.4,3,3,3h29c1.7,0,3-1.4,3-3V94.3C126.5,92.7,125.1,91.3,123.4,91.3z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M116.5,89.4H113v-1.2c0-1.6-1.3-2.9-2.9-2.9h-2.3   c-1.6,0-2.9,1.3-2.9,2.9v1.2h-3.5c-1.2,0-2.3,0.8-2.7,1.9h8.8v-2h3v2h8.8C118.8,90.2,117.8,89.4,116.5,89.4z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M119.3,91.3h-8.8v1h-3v-1h-8.8c-0.1,0.3-0.2,0.7-0.2,1.1v2.9h21   v-2.9C119.5,92,119.4,91.6,119.3,91.3z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M117.1,102.8c-0.3-0.2-0.7-0.2-0