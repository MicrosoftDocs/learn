<text id="heading" x="32" y="50" font-size="32" font-weight="bold">Where to find VM evidence</text>
<rect id="logs-panel" data-card="true" x="32" y="76" width="650" height="224" rx="12" fill="#f2f7fc" stroke="#527ea2" stroke-width="1.6"/>
<use id="logs-icon" href="#icon-logs" x="50" y="91" width="36" height="36" aria-hidden="true"/>
<text id="logs-heading" x="98" y="118" font-size="22" font-weight="bold" data-owner="logs-panel">1. Log Analytics workspace &gt; Logs (KQL)</text>
<rect id="metrics-panel" data-card="true" x="704" y="76" width="384" height="224" rx="12" fill="#f7f6fb" stroke="#8677a1" stroke-width="1.6"/>
<use id="metrics-icon" href="#icon-metrics" x="722" y="91" width="36" height="36" aria-hidden="true"/>
<text id="metrics-heading" x="770" y="118" font-size="22" font-weight="bold" data-owner="metrics-panel">2. VM &gt; Metrics</text>
<text id="signal-1" x="54" y="162" font-size="18" data-owner="logs-panel">Forwarded Linux messages</text>
<path id="map-1" data-link="true" d="M 330 156 h 45" fill="none" stroke="#47637a" stroke-width="2" marker-end="url(#arrow)"/>
<text id="table-1" x="395" y="162" font-size="20" font-weight="bold" data-owner="logs-panel">Syslog</text>
<text id="signal-2" x="54" y="198" font-size="18" data-owner="logs-panel">Windows Application events</text>
<path id="map-2" data-link="true" d="M 330 192 h 45" fill="none" stroke="#47637a" stroke-width="2" marker-end="url(#arrow)"/>
<text id="table-2" x="395" y="198" font-size="20" font-weight="bold" data-owner="logs-panel">Event</text>
<text id="windows-note" x="462" y="198" font-size="16" data-owner="logs-panel">(not SecurityEvent)</text>
<text id="signal-3" x="54" y="234" font-size="18" data-owner="logs-panel">Agent check-ins (both OSes)</text>
<path id="map-3" data-link="true" d="M 330 228 h 45" fill="none" stroke="#47637a" stroke-width="2" marker-end="url(#arrow)"/>
<text id="table-3" x="395" y="234" font-size="20" font-weight="bold" data-owner="logs-panel">Heartbeat</text>
<text id="signal-4" x="54" y="270" font-size="18" data-owner="logs-panel">Exported management records</text>
<path id="map-4" data-link="true" d="M 330 264 h 45" fill="none" stroke="#47637a" stroke-width="2" marker-end="url(#arrow)"/>
<text id="table-4" x="395" y="270" font-size="20" font-weight="bold" data-owner="logs-panel">AzureActivity</text>
<text id="measure" x="726" y="162" font-size="20" data-owner="metrics-panel">Host metric: Percentage CPU</text>
