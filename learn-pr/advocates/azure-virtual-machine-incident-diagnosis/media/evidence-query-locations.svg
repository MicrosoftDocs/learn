<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="324" viewBox="0 0 1120 324" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, Helvetica, sans-serif" fill="#000000">
<title id="figure-title">Choose the evidence store for a VM investigation</title>
<desc id="figure-desc">In Logs in the destination Log Analytics workspace, search Syslog for Linux messages, Event rather than SecurityEvent for the Windows Application log, Heartbeat for either agent, or AzureActivity for exported management operations. Use Metrics on the VM for host CPU measurements.</desc>
<metadata>{"sourceRoot":"C:\\Azure-Icons","icons":["monitor\\00009-icon-service-Log-Analytics-Workspaces.svg","monitor\\00020-icon-service-Metrics.svg"]}</metadata>
