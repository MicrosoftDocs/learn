<rect data-kind="background" x="0" y="0" width="1120" height="368" fill="#ffffff"/>
<text id="heading" x="32" y="49" font-size="32" font-weight="bold">Set up a VM data collection rule</text>
<rect id="rule-card" data-card="true" x="32" y="80" width="312" height="150" rx="12" fill="#f3f8fc" stroke="#527ea2" stroke-width="1.6"/>
<use href="#icon-rule" x="48" y="96" width="36" height="36" aria-hidden="true"/>
<text id="rule-heading" x="94" y="122" font-size="22" data-owner="rule-card" font-weight="bold">1. Choose the rule</text>
<text id="rule-row-0" x="49" y="158" font-size="17" data-owner="rule-card">Managed rule? Work with its owner.</text>
<text id="rule-row-1" x="49" y="184" font-size="17" data-owner="rule-card">New rule? Match the VM OS</text>
<text id="rule-row-2" x="49" y="210" font-size="17" data-owner="rule-card">and the workspace region.</text>
<rect id="vm-card" data-card="true" x="404" y="80" width="312" height="150" rx="12" fill="#f3f8fc" stroke="#527ea2" stroke-width="1.6"/>
<use href="#icon-vm" x="420" y="96" width="36" height="36" aria-hidden="true"/>
<text id="vm-heading" x="466" y="122" font-size="22" data-owner="vm-card" font-weight="bold">2. Associate VMs</text>
<text id="vm-row-0" x="421" y="158" font-size="17" data-owner="vm-card">Use an approved managed identity.</text>
<text id="vm-row-1" x="421" y="184" font-size="17" data-owner="vm-card">The portal installs Azure Monitor</text>
<text id="vm-row-2" x="421" y="210" font-size="17" data-owner="vm-card">Agent (AMA) if needed.</text>
<rect id="logs-card" data-card="true" x="776" y="80" width="312" height="150" rx="12" fill="#f3f8fc" stroke="#527ea2" stroke-width="1.6"/>
<use href="#icon-logs" x="792" y="96" width="36" height="36" aria-hidden="true"/>
<text id="logs-heading" x="838" y="122" font-size="22" data-owner="logs-card" font-weight="bold">3. Route the logs</text>
<text id="logs-row-0" x="793" y="158" font-size="17" data-owner="logs-card">Send Linux Syslog or Windows</text>
<text id="logs-row-1" x="793" y="184" font-size="17" data-owner="logs-card">Event Logs to the approved</text>
<text id="logs-row-2" x="793" y="210" font-size="17" data-owner="logs-card">Log Analytics workspace.</text>
<path id="rule-to-vm" data-link="true" d="M 353 155 l 41 0" fill="none" stroke="#47637a" stroke-width="2.4" marker-end="url(#head)"/>
<path id="vm-to-logs" data-link="true" d="M 725 155 l 41 0" fill="none" stroke="#47637a" stroke-width="2.4" marker-end="url(#head)"/>
<path id="logs-to-verify" data-link="true" d="M 932 237 l 0 24" fill="none" stroke="#47637a" stroke-width="2.4" marker-end="url(#head)"/>
<rect id="verify-card" data-card="true" x="32" y="269" width="1056" height="74" rx="12" fill="#f2f8f4" stroke="#65836b" stroke-width="1.6"/>
<text id="verify-title" x="55" y="313" font-size="23" data-owner="verify-card" font-weight="bold">4. Confirm setup</text>
<text id="verify-body" x="298" y="311" font-size="17.5" data-owner="verify-card">Check the VM resource ID and AMA provisioning. Installation alone does not prove delivery.</text>
</svg>
