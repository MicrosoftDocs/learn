<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="368" viewBox="0 0 1120 368" role="img" aria-labelledby="fig-title fig-desc" font-family="Arial, Helvetica, sans-serif" fill="#000000">
<title id="fig-title">Configure and verify a VM data collection rule</title>
<desc id="fig-desc">Use the owner of an existing managed rule. Otherwise, create a rule for the VM operating system in the workspace region, associate the VM and its managed identity, and route its guest logs to Log Analytics. Confirm the VM association and agent provisioning separately from actual log delivery.</desc>
