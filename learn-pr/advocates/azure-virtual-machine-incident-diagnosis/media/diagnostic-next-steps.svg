<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="502" viewBox="0 0 1136 502" role="img" aria-labelledby="fig-title fig-desc" font-family="Arial, Helvetica, sans-serif" fill="#000000">
<title id="fig-title">Missing VM logs or notifications: symptom to next check</title>
<desc id="fig-desc">Choose the band for the symptom and read across. For denied queries or absent tables, inspect access, scope, and the destination. If a completion exists only on a VM, inspect the OS-specific filter, forwarding, agent errors, and lag. If no local completion exists, inspect the worker, not its collection rule. For missing activity records, check export timing and the native Activity Log. For missing notifications, trace evaluation and delivery without paging production recipients.</desc>
