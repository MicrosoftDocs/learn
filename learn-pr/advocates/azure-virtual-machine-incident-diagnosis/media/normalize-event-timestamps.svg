<title id="fig-title">Normalize local timestamps before ordering incident evidence</title>
<desc id="fig-desc">Illustrative display offsets for 14 November 2026. Keep the original timestamp and offset. The Linux journal entry at 20:59:50 +11:00 is 09:59:50Z; the Windows event at 01:59:58 -08:00 is 09:59:58Z. Both events precede the Azure rule change displayed at 11:00:00 +01:00, or 10:00:00Z. Neither event establishes an order commit.</desc>
