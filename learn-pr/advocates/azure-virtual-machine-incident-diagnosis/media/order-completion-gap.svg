<title id="diagram-title">Order completions missing from the dashboard</title>
<desc id="diagram-desc">At 10:05 UTC the dashboard shows no completions from either VM after 10:00 UTC. Read steps 1 through 5, comparing the two branches of step 2. ContosoLinuxA keeps completing orders but its rule excludes warnings; on ContosoWinSrvB the worker is stopped and has no new completions. Match local completion IDs to Syslog or Event, correct only the failing part, then prove fresh delivery and actual notification receipt separately.</desc>
