<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="413" viewBox="0 0 1120 413" role="img" aria-labelledby="figure-title figure-description" font-family="Arial, Helvetica, sans-serif" fill="#000000">
<title id="figure-title">Two platform signals available before guest monitoring is configured</title>
<desc id="figure-description">Read the numbered panels from left to right, then the conclusion. The Azure Activity Log identifies administrative operations, caller, scope, and final status. Host metrics summarize CPU, disk, and network measurements for the same VM and UTC window. The break in the illustrative CPU trace is missing data, not a zero. Neither source identifies a completed order.</desc>
<metadata>{"sourceRoot":"C:\\Azure-Icons","icons":["monitor\\00007-icon-service-Activity-Log.svg","monitor\\00020-icon-service-Metrics.svg"]}</metadata>
