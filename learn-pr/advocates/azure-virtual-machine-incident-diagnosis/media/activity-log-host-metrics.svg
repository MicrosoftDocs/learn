<text id="heading" x="32" y="50" font-size="31" font-weight="bold">Two Azure signals before guest monitoring</text>
<rect id="activity-card" data-frame="true" x="32" y="78" width="516" height="228" rx="12" fill="#f2f7fc" stroke="#527ea2" stroke-width="1.6"/>
<use id="asset-activity" href="#icon-activity" x="52" y="94" width="36" height="36" aria-hidden="true"/>
<text id="left-title" x="105" y="122" font-size="24" font-weight="bold" data-owner="activity-card">1. Activity Log</text>
<text id="left-guide1" x="54" y="166" font-size="19" data-owner="activity-card">Who changed the resource? Did it succeed?</text>
<rect id="record" data-frame="true" x="54" y="190" width="472" height="93" rx="12" fill="#ffffff" stroke="#acc3d2" stroke-width="1.6"/>
<text id="record-title" x="72" y="225" font-size="21" font-weight="bold" data-owner="record">10:00 UTC  |  Collection rule updated</text>
<text id="record-status" x="72" y="260" font-size="18" data-owner="record">Check the rule ID, caller, and final status.</text>
<rect id="metrics-card" data-frame="true" x="572" y="78" width="516" height="228" rx="12" fill="#f7f6fb" stroke="#8677a1" stroke-width="1.6"/>
<use id="asset-metrics" href="#icon-metrics" x="592" y="94" width="36" height="36" aria-hidden="true"/>
<text id="right-title" x="645" y="122" font-size="24" font-weight="bold" data-owner="metrics-card">2. Host metrics</text>
<text id="right-guide1" x="594" y="166" font-size="18" data-owner="metrics-card">Compare CPU, disk, and network in the same window.</text>
<rect id="chart" data-frame="true" x="594" y="190" width="472" height="93" rx="12" fill="#ffffff" stroke="#c2b7d3" stroke-width="1.6"/>
<text id="chart-title" x="611" y="215" font-size="15" font-weight="bold" data-owner="chart">Example: one-minute CPU averages</text>
<polyline id="trace-left" data-trace="true" points="617,254 649,248 681,239 711,249 743,231 775,242 799,240" stroke="#65538d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<polyline id="trace-right" data-trace="true" points="909,247 941,254 974,239 1004,248 1042,241" stroke="#65538d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text id="gap" x="820" y="252" font-size="14" data-owner="chart">no sample</text>
<rect id="boundary" data-frame="true" x="32" y="324" width="1056" height="66" rx="12" fill="#f6f8fa" stroke="#8293a0" stroke-width="1.6"/>
<text id="boundary-head" x="54" y="365" font-size="22" font-weight="bold" data-owner="boundary">3. Order completed?</text>
<text id="boundary-body" x="339" y="365" font-size="19" data-owner="boundary">Neither signal proves it. Check the worker’s completion record.</text>
