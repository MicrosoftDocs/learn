  <title id="azure-virtual-machine-incident-diagnosis-diagram-title">Incident diagnosis: from symptom to evidence</title>
  <desc id="azure-virtual-machine-incident-diagnosis-diagram-description">Investigate the workload and telemetry on ContosoLinuxA and ContosoWinSrvB separately, then correlate the results. Read the numbered cards from top to bottom. A heartbeat proves agent contact, not collection of every required application event.</desc>
