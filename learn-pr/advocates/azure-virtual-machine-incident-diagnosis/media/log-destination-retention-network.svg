<text id="heading" x="32" y="50" font-size="32" font-weight="bold">Where VM logs go</text>
<rect id="destination" data-frame="true" x="32" y="79" width="516" height="112" rx="12" fill="#f2f7fc" stroke="#527ea2" stroke-width="1.6"/>
<use id="logs-image" href="#icon-logs" x="54" y="94" width="34" height="34" aria-hidden="true"/>
<text id="destination-heading" x="104" y="120" font-size="24" font-weight="bold" data-owner="destination">1. Destination</text>
<text id="destination-row-0" x="54" y="152" font-size="19" data-owner="destination">Use the approved Log Analytics workspace.</text>
<text id="destination-row-1" x="54" y="177" font-size="18" data-owner="destination">Record its resource ID and region.</text>
<rect id="retention" data-frame="true" x="572" y="79" width="516" height="112" rx="12" fill="#f2f8f4" stroke="#65836b" stroke-width="1.6"/>
<use id="cost-image" href="#icon-cost" x="594" y="94" width="34" height="34" aria-hidden="true"/>
<text id="retention-heading" x="644" y="120" font-size="24" font-weight="bold" data-owner="retention">2. Retention</text>
<text id="retention-row-0" x="594" y="152" font-size="19" data-owner="retention">Keep logs for the investigation window.</text>
<text id="retention-row-1" x="594" y="177" font-size="18" data-owner="retention">Check table overrides and cost.</text>
<rect id="route" data-frame="true" x="32" y="209" width="1056" height="116" rx="12" fill="#f6f8fa" stroke="#8293a0" stroke-width="1.6"/>
<text id="route-heading" x="54" y="243" font-size="23" font-weight="bold" data-owner="route">3. Outbound network path</text>
<use id="vm-image" href="#icon-vm" x="54" y="262" width="40" height="40" aria-hidden="true"/>
<text id="agent-name" x="107" y="292" font-size="21" font-weight="bold" data-owner="route">Azure Monitor Agent</text>
<text id="transport" x="418" y="270" font-size="17" font-weight="bold" data-owner="route">HTTPS / TCP 443</text>
<path id="transport-arrow" data-arrow="true" d="M 376 288 l 317 0" stroke="#47637a" stroke-width="2" fill="none" marker-end="url(#head)"/>
<use id="monitor-image" href="#icon-monitor" x="725" y="262" width="40" height="40" aria-hidden="true"/>
<text id="service-name" x="780" y="292" font-size="21" font-weight="bold" data-owner="route">Azure Monitor</text>
<rect id="public-path" data-frame="true" x="32" y="343" width="516" height="114" rx="12" fill="#ffffff" stroke="#8196a6" stroke-width="1.6"/>
<text id="public-heading" x="54" y="381" font-size="22" font-weight="bold" data-owner="public-path">3a. Public endpoints</text>
<text id="public-path-row-0" x="54" y="416" font-size="18" data-owner="public-path">Allow required endpoints through the firewall.</text>
<text id="public-path-row-1" x="54" y="441" font-size="18" data-owner="public-path">No public VM IP or separate DCE needed.</text>
<rect id="private-path" data-frame="true" x="572" y="343" width="516" height="114" rx="12" fill="#ffffff" stroke="#8196a6" stroke-width="1.6"/>
<use id="private-image" href="#icon-private" x="594" y="355" width="34" height="34" aria-hidden="true"/>
<text id="private-heading" x="643" y="381" font-size="22" font-weight="bold" data-owner="private-path">3b. Private Link</text>
<text id="private-path-row-0" x="594" y="416" font-size="18" data-owner="private-path">VM → configuration DCE in the VM's region.</text>
<text id="private-path-row-1" x="594" y="441" font-size="18" data-owner="private-path">Link the DCE and workspace to AMPLS. Use private DNS.</text>
