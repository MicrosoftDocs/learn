<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="486" viewBox="0 0 1120 486" role="img" aria-labelledby="fig-title fig-desc" fill="#000000" font-family="Arial, Helvetica, sans-serif">
<title id="fig-title">Choose the log destination, retention period, and network path</title>
<desc id="fig-desc">Read the numbered panels in order. Choose an approved Log Analytics workspace, set workspace and table retention, then provide the agent with outbound HTTPS on TCP port 443 for configuration and ingestion. The final panels compare public endpoints with Private Link. For Private Link, the VM connects to a configuration data collection endpoint (DCE) in the VM's region. Link the DCE and workspace to the Azure Monitor Private Link Scope (AMPLS). Use private DNS.</desc>
