<rect data-kind="background" x="0" y="0" width="1136" height="410" fill="#ffffff"/>
<text id="heading" x="28" y="50" font-size="31" font-weight="bold">Which signal answers the incident question?</text>
<rect id="activity-card" data-card="true" x="28" y="77" width="348" height="122" rx="12" fill="#f2f7fc" stroke="#527ea2" stroke-width="1.6"/>
<use id="activity-image" href="#icon-activity" x="45" y="91" width="33" height="33" aria-hidden="true"/>
<text id="activity-heading" x="89" y="115" font-size="19.5" font-weight="bold" data-owner="activity-card">1. Activity Log</text>
<text id="activity-body-0" x="46" y="154" font-size="18" data-owner="activity-card">Was a rule changed</text>
<text id="activity-body-1" x="46" y="178" font-size="18" data-owner="activity-card">or a VM restarted?</text>
<rect id="service-card" data-card="true" x="394" y="77" width="348" height="122" rx="12" fill="#f2f7fc" stroke="#527ea2" stroke-width="1.6"/>
<use id="service-image" href="#icon-service" x="411" y="91" width="33" height="33" aria-hidden="true"/>
<text id="service-heading" x="455" y="115" font-size="19.5" font-weight="bold" data-owner="service-card">2. Service Health</text>
<text id="service-body-0" x="412" y="154" font-size="18" data-owner="service-card">Was there a regional incident</text>
<text id="service-body-1" x="412" y="178" font-size="18" data-owner="service-card">or planned maintenance?</text>
<rect id="resource-card" data-card="true" x="760" y="77" width="348" height="122" rx="12" fill="#f2f7fc" stroke="#527ea2" stroke-width="1.6"/>
<use id="resource-image" href="#icon-resource" x="777" y="91" width="33" height="33" aria-hidden="true"/>
<text id="resource-heading" x="821" y="115" font-size="19.5" font-weight="bold" data-owner="resource-card">3. Resource Health</text>
<text id="resource-body-0" x="778" y="154" font-size="18" data-owner="resource-card">Did Azure report this VM</text>
<text id="resource-body-1" x="778" y="178" font-size="18" data-owner="resource-card">as unavailable?</text>
<rect id="metrics-card" data-card="true" x="28" y="217" width="348" height="122" rx="12" fill="#f2f7fc" stroke="#527ea2" stroke-width="1.6"/>
<use id="metrics-image" href="#icon-metrics" x="45" y="231" width="33" height="33" aria-hidden="true"/>
<text id="metrics-heading" x="89" y="255" font-size="19.5" font-weight="bold" data-owner="metrics-card">4. Platform metrics</text>
<text id="metrics-body-0" x="46" y="294" font-size="18" data-owner="metrics-card">Did CPU, disk, or network</text>
<text id="metrics-body-1" x="46" y="318" font-size="18" data-owner="metrics-card">activity change?</text>
<rect id="guest-card" data-card="true" x="394" y="217" width="348" height="122" rx="12" fill="#f7f6fb" stroke="#8677a1" stroke-width="1.6"/>
<use id="guest-image" href="#icon-guest" x="411" y="231" width="33" height="33" aria-hidden="true"/>
<text id="guest-heading" x="455" y="255" font-size="19.5" font-weight="bold" data-owner="guest-card">5. Guest logs &amp; service state</text>
<text id="guest-body-0" x="412" y="294" font-size="18" data-owner="guest-card">Did the worker run, stop, or fail?</text>
<rect id="workload-card" data-card="true" x="760" y="217" width="348" height="122" rx="12" fill="#f2f8f4" stroke="#65836b" stroke-width="1.6"/>
<use id="workload-image" href="#icon-workload" x="777" y="231" width="33" height="33" aria-hidden="true"/>
<text id="workload-heading" x="821" y="255" font-size="19.5" font-weight="bold" data-owner="workload-card">6. Workload check</text>
<text id="workload-body-0" x="778" y="294" font-size="18" data-owner="workload-card">Did this order actually complete?</text>
<text id="takeaway" x="28" y="382" font-size="18">A healthy VM does not prove an order finished. A local log does not prove workspace delivery.</text>
</svg>
