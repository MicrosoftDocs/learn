<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="410" viewBox="0 0 1136 410" role="img" aria-labelledby="fig-title fig-desc" fill="#000000" font-family="Arial, Helvetica, sans-serif">
<title id="fig-title">Six evidence sources for an Azure VM incident</title>
<desc id="fig-desc">Read left to right across each row. The Activity Log records management actions; Service Health covers incidents and maintenance; Resource Health assesses an individual VM. Platform metrics measure resource activity, guest records show worker behavior, and an independent workload check confirms a specific order. These sources answer different questions, not successive stages of a pipeline.</desc>
