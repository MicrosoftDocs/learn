<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" style="background-color:white" role="img" aria-labelledby="diagram-title diagram-description" font-family="Segoe UI, Arial, sans-serif" fill="#000000" lang="en">
  <title id="diagram-title">Authentication and group state converge at local RBAC</title>
  <desc id="diagram-description">Diagram of independent authentication and asynchronous group synchronization paths converging at local authorization. First, AD FS authenticates a user through OpenID Connect. Separately, AD Universal group membership synchronizes asynchronously into local identity. Third, local role assignments at subscription or resource-group scope are evaluated with user identity and synchronized group state. Operator subscription permissions do not inherit into tenant subscriptions. Fourth, a resource action is permitted only within the evaluated role and scope. DNS, time and certificates support every path.</desc>
