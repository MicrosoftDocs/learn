  <text x="48" y="62" font-size="36" font-weight="600" fill="#000000">Authentication and group state converge at local RBAC</text>
  <text x="48" y="105" font-size="21" font-weight="400" fill="#000000">1 and 2 are separate inputs; group synchronization is not an AD lookup at every sign-in.</text>
