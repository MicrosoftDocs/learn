<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1305" viewBox="0 0 1200 1305" style="background-color:white" role="img" aria-labelledby="diagram-title diagram-description" font-family="Segoe UI, Arial, sans-serif" fill="#000000" lang="en">
  <title id="diagram-title">Separate the connected and isolated responsibilities</title>
  <desc id="diagram-description">Diagram of a connected administrative acquisition station, a controlled transfer boundary, and an isolated operating environment. The station handles procurement, self-attestation, package acquisition and authorized support exchange. Approved transfers do not require a persistent internet route. Inside the environment, trust services support a dedicated three-node production management cluster with local portal, Azure Resource Manager and RBAC, and separate Azure Local workload clusters running VMs and AKS. Independent backup and recovery access must survive management-cluster failure. Global Azure Key Vault access is through an approved external route, not a local replacement.</desc>
