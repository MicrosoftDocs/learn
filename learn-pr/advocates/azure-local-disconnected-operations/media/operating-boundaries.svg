  <text x="74" y="1145" font-size="22" font-weight="400" fill="#000000" data-box="step-6">Backups and recovery materials must survive management-cluster failure.</text>
  <text x="74" y="1179" font-size="22" font-weight="400" fill="#000000" data-box="step-6">Global Azure Key Vault access uses an approved external route.</text>
  <text x="74" y="1213" font-size="22" font-weight="400" fill="#000000" data-box="step-6">These prerequisites are not all local services.</text>
  <text x="48" y="1275" font-size="21" font-weight="400" fill="#000000">The management cluster and workload clusters are separate; recovery access is independent.</text>
</svg>