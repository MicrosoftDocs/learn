<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1385" viewBox="0 0 1200 1385" style="background-color:white" role="img" aria-labelledby="diagram-title diagram-description" font-family="Segoe UI, Arial, sans-serif" fill="#000000" lang="en">
  <title id="diagram-title">Lifecycle gates follow the chosen supported path</title>
  <desc id="diagram-description">Diagram of six lifecycle gates. First, record deployed versions and select a documented compatible update path. Second, validate complete packages in quarantine. Third, check backups, trust and health and notify operators about the management outage. Control-plane maintenance interrupts management across the served clusters. Fourth, update the control plane only if required by the supported path. Fifth, update compatible Azure Local data-plane clusters, then workload platforms and applications. Sixth, validate management and workload runtime separately before advancing to the next ring. The control-plane update system attempts rollback on failure, but rollback is not guaranteed. No universal version sequence or downgrade is assumed. Stop when a gate fails.</desc>
