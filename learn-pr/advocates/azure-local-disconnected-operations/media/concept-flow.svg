  <text x="864" y="305" font-size="21" font-weight="400" fill="#000000" data-box="step-5">Establish from the start:</text>
  <text x="864" y="373" font-size="21" font-weight="400" fill="#000000" data-box="step-5">Evidence and audit logs</text>
  <text x="864" y="441" font-size="21" font-weight="400" fill="#000000" data-box="step-5">Independent backups</text>
