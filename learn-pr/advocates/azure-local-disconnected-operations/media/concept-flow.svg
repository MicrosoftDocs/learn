  <title id="diagram-title">Disconnected operations: the dependency model</title>
  <desc id="diagram-description">Diagram of four dependencies on the left and an independent recovery rail on the right. Local trust services support the dedicated local management control plane. Approved local artifacts support operations on separate Azure Local workload clusters. Evidence, backup and recovery readiness are established from the start, not after workloads run. Local management and workload execution are distinct.</desc>
