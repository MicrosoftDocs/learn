  <text x="864" y="611" font-size="21" font-weight="400" fill="#000000" data-box="step-5">Approved install media</text>
  <text x="864" y="679" font-size="21" font-weight="400" fill="#000000" data-box="step-5">Test recovery before</text>
  <text x="864" y="713" font-size="21" font-weight="400" fill="#000000" data-box="step-5">an incident occurs.</text>
  <text x="864" y="781" font-size="21" font-weight="400" fill="#000000" data-box="step-5">Not dependent on</text>
  <text x="864" y="815" font-size="21" font-weight="400" fill="#000000" data-box="step-5">workloads already</text>
  <text x="864" y="849" font-size="21" font-weight="400" fill="#000000" data-box="step-5">being operational.</text>
