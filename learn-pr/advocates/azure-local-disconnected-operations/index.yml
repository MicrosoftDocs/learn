title: Azure Local disconnected operations
summary: |
  Azure Local disconnected operations allows you to run Azure Local in a disconnected or airgapped environment. In this module, you'll design the local dependencies, controlled software supply, operating procedures, and recovery arrangements that make this model sustainable.
abstract: |
  After completing this module, you'll be able to:

  - Distinguish purpose-built disconnected operations from a connectivity outage in a connected deployment.
  - Plan procurement, dedicated management capacity, local services, and independent failure domains.
  - Explain how local authentication, group synchronization, authorization, certificates, DNS, and time work together.
  - Plan local workload onboarding, policy enforcement, security responsibilities, and nonhuman credential lifecycles.
  - Evaluate management-client configuration and the provenance, integrity, and completeness of offline artifacts.
  - Sequence compatible updates and apply disconnected workload restrictions.
  - Plan offline vulnerability management, incident response, and secure retirement.
  - Design separate control-plane and workload protection, then assess recovery readiness.
prerequisites: |
  Before starting this module, you should have:

  - Familiarity with Azure Local, virtual machines, networking, and storage.
  - Basic knowledge of Windows Server, Active Directory, certificate trust, and Azure resource management.
