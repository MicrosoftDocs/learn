  <text x="40" y="57" class="title">AKS on Azure Local: address scopes and cleanup</text>
  <text x="40" y="96" class="subtitle">Read 1-3 from left to right. Hosting arrows show where components run, not packet routes.</text>

  <g data-card="scope-1">
    <rect x="40" y="150" width="400" height="480" rx="12" class="card" stroke="#0078d4" data-role="card-boundary"/>
    <text x="64" y="194" class="card-title">1. Physical hosts</text>
    <text x="64" y="235" class="body">Azure Local machines</text>
    <use href="#azure-host" x="64" y="272" width="52" height="52" aria-hidden="true"/>
    <text x="136" y="291" class="label">Host A</text>
    <text x="136" y="320" class="body">Management IP A</text>
    <use href="#azure-host" x="64" y="367" width="52" height="52" aria-hidden="true"/>
    <text x="136" y="386" class="label">Host B</text>
    <text x="136" y="415" class="body">Management IP B</text>
    <line x1="64" y1="460" x2="416" y2="460" stroke="#c9d9e8" data-role="divider"/>
    <text x="64" y="497" class="label">Static or reserved DHCP</text>
    <text x="64" y="535" class="body">Host management addresses</text>
    <text x="64" y="565" class="body">are separate from all AKS</text>
    <text x="64" y="595" class="body">node VM addresses.</text>
  </g>

  <g data-card="scope-2">
    <rect x="520" y="150" width="400" height="480" rx="12" class="card" stroke="#5c2d91" data-role="card-boundary"/>
    <text x="544" y="194" class="card-title">2. AKS node VMs</text>
    <use href="#azure-kubernetes" x="848" y="170" width="48" height="48" aria-hidden="true"/>
    <text x="544" y="235" class="body">Workload logical network</text>
    <text x="544" y="267" class="label">Static VM IP pool - no DHCP</text>
    <use href="#azure-vm" x="544" y="305" width="44" height="44" aria-hidden="true"/>
    <text x="608" y="324" class="label">Control-plane VM(s)</text>
    <text x="608" y="353" class="body">Manage Kubernetes</text>
    <use href="#azure-vm" x="544" y="395" width="44" height="44" aria-hidden="true"/>
    <text x="608" y="414" class="label">Worker VM(s)</text>
    <text x="608" y="443" class="body">Run application pods</text>
    <line x1="544" y1="475" x2="896" y2="475" stroke="#dcd1e9" data-role="divider"/>
    <text x="544" y="512" class="body">One IP per node VM.</text>
    <text x="544" y="550" class="body">Reserve an API endpoint and</text>
    <text x="544" y="580" class="body">upgrade / growth addresses.</text>
  </g>

  <g data-card="scope-3">
    <rect x="1000" y="150" width="400" height="480" rx="12" class="card" stroke="#008272" data-role="card-boundary"/>
    <text x="1024" y="194" class="card-title">3. Pods and containers</text>
    <text x="1024" y="235" class="body">CNI manages the pod range</text>
    <g data-card="shared-pod">
      <rect x="1024" y="267" width="352" height="184" rx="10" fill="#f0faf8" stroke="#008272" stroke-width="1.5" data-role="card-boundary"/>
      <text x="1044" y="301" class="label">One pod = one shared IP</text>
      <g data-card="container-a">
        <rect x="1044" y="326" width="144" height="99" rx="8" fill="#ffffff" stroke="#008272" stroke-width="1.5" data-role="card-boundary"/>
        <text x="1116" y="368" text-anchor="middle" class="small">Container</text>
        <text x="1116" y="397" text-anchor="middle" class="label">A</text>
      </g>
      <g data-card="container-b">
        <rect x="1212" y="326" width="144" height="99" rx="8" fill="#ffffff" stroke="#008272" stroke-width="1.5" data-role="card-boundary"/>
        <text x="1284" y="368" text-anchor="middle" class="small">Container</text>
        <text x="1284" y="397" text-anchor="middle" class="label">B</text>
      </g>
    </g>
    <text x="1024" y="490" class="body">Containers share this pod IP.</text>
    <text x="1024" y="528" class="label">Pod IPs are not DHCP leases.</text>
    <text x="1024" y="566" class="body">New pods can reuse released</text>
    <text x="1024" y="596" class="body">addresses after cleanup.</text>
  </g>

  <text x="480" y="352" text-anchor="middle" class="small">run</text>
  <line x1="450" y1="370" x2="510" y2="370" class="connector" data-role="connector"/>
  <text x="960" y="396" text-anchor="middle" class="small">run</text>
  <line x1="930" y1="414" x2="990" y2="414" class="connector" data-role="connector"/>

  <text x="40" y="692" class="section-title">Pod address lifecycle</text>
  <text x="40" y="729" class="subtitle">Read 4-6 from left to right. Address reuse follows pod-network cleanup, not each container exit.</text>

  <g data-card="lifecycle-4">
    <rect x="40" y="770" width="400" height="230" rx="12" class="card" stroke="#0078d4" data-role="card-boundary"/>
    <text x="64" y="812" class="card-title">4. Pod is created</text>
    <text x="64" y="858" class="body">CNI allocates one pod IP.</text>
    <text x="64" y="889" class="body">Containers share the address.</text>
    <text x="64" y="930" class="body">The allocation stays in use</text>
    <text x="64" y="961" class="body">while pod networking exists.</text>
  </g>
  <g data-card="lifecycle-5">
    <rect x="520" y="770" width="400" height="230" rx="12" class="card" stroke="#b65c00" data-role="card-boundary"/>
    <text x="544" y="812" class="card-title">5. A container stops</text>
    <text x="544" y="858" class="body">A container restart or exit</text>
    <text x="544" y="889" class="body">does not necessarily remove</text>
    <text x="544" y="920" class="body">the pod's network.</text>
    <text x="544" y="961" class="label">The pod IP can stay allocated.</text>
  </g>
  <g data-card="lifecycle-6">
    <rect x="1000" y="770" width="400" height="230" rx="12" class="card" stroke="#008272" data-role="card-boundary"/>
    <text x="1024" y="812" class="card-title">6. Pod network removed</text>
    <text x="1024" y="858" class="body">Normal CNI cleanup releases</text>
    <text x="1024" y="889" class="body">the pod IP for reuse.</text>
    <text x="1024" y="930" class="body">If cleanup fails, investigate</text>
    <text x="1024" y="961" class="body">stale CNI allocations.</text>
  </g>
  <line x1="450" y1="885" x2="510" y2="885" class="connector" data-role="connector"/>
  <line x1="930" y1="885" x2="990" y2="885" class="connector" data-role="connector"/>

  <g data-card="planning-reminder">
    <rect x="40" y="1040" width="1360" height="112" rx="12" class="card" stroke="#506477" data-role="card-boundary"/>
    <text x="64" y="1074" class="card-title">Plan other addresses separately</text>
    <text x="64" y="1105" class="body">Load-balancer front ends: reserved outside the VM pool. Internal services: a separate Kubernetes service range.</text>
    <text x="64" y="1135" class="body">Keep spare capacity for upgrades and scaling. Shorter DHCP leases do not reclaim pod IPs.</text>
  </g>
  <text x="40" y="1183" class="small">CNI = Container Network Interface. The pod example illustrates ordinary, non-host-networked pods.</text>
</svg>
