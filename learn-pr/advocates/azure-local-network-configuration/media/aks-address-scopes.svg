<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: #ffffff">
  <title id="diagram-title">AKS on Azure Local: address scopes and pod address cleanup</title>
  <desc id="diagram-description">Read cards 1 to 3 from left to right. Physical Azure Local hosts have management addresses. They run AKS control-plane and worker virtual machines, which use a separate static workload-network IP pool, not DHCP. Workers run pods whose containers share a pod address managed by CNI. Read cards 4 to 6 for the pod address lifecycle: creation allocates an address, an individual container stopping does not necessarily release it, and removal of pod networking normally releases it for reuse. Upgrade capacity, API endpoints, load-balancer front ends, and internal service addresses need separate planning.</desc>
  <metadata>Embedded Azure icon sources: compute\10347-icon-service-Hosts.svg; compute\10021-icon-service-Virtual-Machine.svg; containers\10023-icon-service-Kubernetes-Services.svg.</metadata>
