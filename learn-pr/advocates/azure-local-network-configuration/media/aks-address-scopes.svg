        <circle cx="9.06" cy="15.84" r="1.51" fill="#7fba00"/>
        <circle cx="9.02" cy="15.83" r="1.51" fill="url(#host-link)"/>
        <g><rect x="13.72" y="1.55" width="1.05" height="1.05" rx="0.15" fill="#b4ec36"/><rect x="13.72" y="3.36" width="1.05" height="1.05" rx="0.15" fill="#b4ec36"/></g>
        <g><rect x="13.72" y="8.04" width="1.05" height="1.05" rx="0.15" fill="#b4ec36"/><rect x="13.72" y="9.85" width="1.05" height="1.05" rx="0.15" fill="#b4ec36"/></g>
