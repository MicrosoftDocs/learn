        <linearGradient id="host-link" x1="9.02" y1="17.34" x2="9.02" y2="14.32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3"/><stop offset="1" stop-color="#32d4f5"/></linearGradient>
