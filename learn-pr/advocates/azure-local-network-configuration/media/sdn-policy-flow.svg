    </svg>
    <text x="62" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">192.168.20.10</text>
    <text x="62" y="637" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">TCP to 192.168.20.20</text>
    <text x="62" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Destination port 1433</text>
  </g>
  <g data-card="nic-policy">
    <rect x="500" y="530" width="360" height="220" rx="10" fill="#f7f3fb" stroke="#5c2d91" stroke-width="1.5" data-role="card-boundary" />
    <text x="522" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#000000" text-anchor="start" data-role="card-title">Database NIC policy</text>
    <text x="522" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">One applicable inbound NSG</text>
    <text x="522" y="637" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Priority 100: matching deny</text>
    <text x="522" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Priority 200: matching allow</text>
  </g>
  <g data-card="guest">
    <rect x="960" y="530" width="360" height="220" rx="10" fill="#f5f6f7" stroke="#506477" stroke-width="1.5" data-role="card-boundary" />
    <text x="982" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#000000" text-anchor="start" data-role="card-title">Guest checks</text>
    <text x="982" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Guest firewall</text>
    <text x="982" y="637" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Application listener</text>
    <text x="982" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Reached only after an allow</text>
  </g>
  <polyline points="410,640 490,640" fill="none" stroke="#0078d4" stroke-width="2.5" data-role="connector" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline points="870,640 950,640" fill="none" stroke="#506477" stroke-width="2.5" data-role="connector" stroke-linejoin="round" marker-end="url(#arrow-gray)" />
  <text x="910" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle" data-role="label">Only if</text>
  <text x="910" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle" data-role="label">allowed</text>
  <g data-card="result">
    <rect x="40" y="815" width="1280" height="165" rx="10" fill="#f5f6f7" stroke="#506477" stroke-width="1.5" data-role="card-boundary" />
    <text x="62" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#000000" text-anchor="start" data-role="card-title">3. Interpret this flow: priority 100 denies the connection</text>
    <text x="62" y="893" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">A lower number has higher priority within this NSG; the later allow does not override the earlier deny.</text>
    <text x="62" y="922" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">The example packet stops at the policy stage. Guest checks apply after an approved policy correction.</text>
    <text x="62" y="951" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Use the Azure management owner. Do not mix local SDN scripts into the Arc-managed controller.</text>
  </g>
</svg>