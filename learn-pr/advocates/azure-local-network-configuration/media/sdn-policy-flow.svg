<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1030" viewBox="0 0 1360 1030" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: white">
  <title id="diagram-title">Distinguish policy installation from packet enforcement</title>
  <desc id="diagram-description">Azure configuration reaches the Arc-enabled Network Controller running as a cluster service. The controller and host agent program the VFP-enabled virtual switch. Separately, application traffic reaches the database NIC's applicable NSG. In this example, an inbound deny at priority 100 wins over an allow at 200, so the flow does not proceed to the guest firewall and listener. This example uses one applicable NSG and does not specify cross-attachment precedence.</desc>
  <rect id="background" x="0" y="0" width="1360" height="1030" fill="#ffffff" />
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0078d4" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c2d91" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" />
    </marker>
  </defs>
  <text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#000000" text-anchor="start" data-role="heading">Distinguish policy installation from packet enforcement</text>
  <text x="40" y="83" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="start" data-role="subtitle">Read each row left to right. Dashed arrows carry policy; solid arrows represent packet flow.</text>
  <text x="40" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#000000" text-anchor="start" data-role="label">1. Control plane: install the intended policy</text>
  <g data-card="azure">
    <rect x="40" y="175" width="360" height="165" rx="10" fill="#f3f8fd" stroke="#0078d4" stroke-width="1.5" data-role="card-boundary" />
    <text x="62" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#000000" text-anchor="start" data-role="card-title">Azure configuration</text>
    <svg width="44" height="44" viewBox="0 0 18 18" x="332" y="276" aria-hidden="true" data-source-icon="management + governance\00756-icon-service-Azure-Arc.svg">
