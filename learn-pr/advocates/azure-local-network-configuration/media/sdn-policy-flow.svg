      </g>
    </svg>
    <text x="62" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Portal, CLI, or templates</text>
    <text x="62" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Owns Arc-enabled resources</text>
  </g>
  <g data-card="controller">
    <rect x="500" y="175" width="360" height="165" rx="10" fill="#f3f8fd" stroke="#0078d4" stroke-width="1.5" data-role="card-boundary" />
    <text x="522" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#000000" text-anchor="start" data-role="card-title">Network Controller</text>
    <text x="522" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Failover Cluster service</text>
    <text x="522" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Distributes workload policy</text>
  </g>
  <g data-card="host">
    <rect x="960" y="175" width="360" height="165" rx="10" fill="#f3f8fd" stroke="#0078d4" stroke-width="1.5" data-role="card-boundary" />
    <text x="982" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#000000" text-anchor="start" data-role="card-title">Host agent + VFP</text>
    <text x="982" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Programs the virtual switch</text>
    <text x="982" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="start" data-role="card-body">Enforces policy on the host</text>
  </g>
  <polyline points="410,257 490,257" fill="none" stroke="#0078d4" stroke-width="2.5" data-role="connector" stroke-linejoin="round" marker-end="url(#arrow-blue)" stroke-dasharray="9 6" />
  <polyline points="870,257 950,257" fill="none" stroke="#0078d4" stroke-width="2.5" data-role="connector" stroke-linejoin="round" marker-end="url(#arrow-blue)" stroke-dasharray="9 6" />
  <text x="810" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000" text-anchor="start" data-role="label">Install the applicable NIC policy</text>
  <polyline points="1140,350 1140,410 680,410 680,520" fill="none" stroke="#0078d4" stroke-width="2.5" data-role="connector" stroke-linejoin="round" marker-end="url(#arrow-blue)" stroke-dasharray="9 6" />
  <text x="40" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#000000" text-anchor="start" data-role="label">2. Data plane: evaluate the packet</text>
  <g data-card="app">
    <rect x="40" y="530" width="360" height="220" rx="10" fill="#f3f8fd" stroke="#0078d4" stroke-width="1.5" data-role="card-boundary" />
    <text x="62" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#000000" text-anchor="start" data-role="card-title">Application VM</text>
    <svg id="icon-2-fd454f1c-5506-44b8-874e-8814b8b2f70b" width="44" height="44" viewBox="0 0 18 18" x="332" y="686" aria-hidden="true" data-source-icon="compute\10021-icon-service-Virtual-Machine.svg">
