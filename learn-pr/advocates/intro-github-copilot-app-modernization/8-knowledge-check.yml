### YamlMime:ModuleUnit
uid: learn.introduction-github-app-modernization.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Check your knowledge.
  ms.date: 11/24/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
durationInMinutes: 11
content: Choose the best response for each question.
quiz:
  questions:
    - content: "Which of the following best describes GitHub Copilot modernization?"
      choices:
        - content: "A general-purpose code completion tool that suggests code as you type."
          isCorrect: false
          explanation: "This describes GitHub Copilot autocompletion, not its specialized modernization workflows."
        - content: "A tool that only generates Dockerfiles for containerization."
          isCorrect: false
          explanation: "Containerization is one capability. Modernization also includes assessment, planning, upgrades, and supported migration workflows."
        - content: "Specialized agents that provide structured, language-specific upgrade and migration workflows."
          isCorrect: true
          explanation: "GitHub Copilot modernization coordinates assessment, planning, and reviewable changes. Java and .NET scenarios include upgrades and Azure dependency migration; other languages have different capabilities. Containerization and deployment are optional tasks, not mandatory stages of every upgrade."
        - content: "Only a portfolio scanning tool that never plans or changes application code."
          isCorrect: false
          explanation: "Modernization supports assessment and planning as well as code transformations. Portfolio scanning alone doesn't describe the full product."
    - content: "What happens during the assessment stage of the modernization workflow?"
      choices:
        - content: "The agent analyzes the project's code, configuration, and dependencies, and generates a report identifying breaking changes, compatibility issues, and upgrade scope."
          isCorrect: true
          explanation: "Assessment analyzes the codebase and produces a report before the planned application-code transformations. Not every invocation runs a new assessment: a specific task or an existing-plan request can enter a later stage. Use a separate assessment command when you need to review the report before execution."
        - content: "The agent immediately starts modifying code."
          isCorrect: false
          explanation: "Assessment analyzes the application and writes reports before the planned application-code transformations. It isn't permission to start those transformations or deploy the application."
        - content: "The agent deploys the application to Azure."
          isCorrect: false
          explanation: "Deployment to Azure isn't part of assessment. It is a separate, optional task that needs an approved target, suitable permissions, and a reviewed deployment plan."
        - content: "The agent deletes all deprecated code."
          isCorrect: false
          explanation: "The agent doesn't delete any code during assessment. It identifies outdated or problematic elements and notes them in a report. Actual code changes happen during later execution/transformation stages."
    - content: "What are predefined tasks in GitHub Copilot modernization?"
      choices:
        - content: "Tasks that require the developer to manually write every line of migration code."
          isCorrect: false
          explanation: "Predefined tasks are meant to automate migration steps using AI and known patterns, so the developer doesn't have to write all migration code manually."
        - content: "Expert-encoded migration patterns for common Azure scenarios (such as migrating from MSMQ to Azure Service Bus) that the agent applies automatically."
          isCorrect: true
          explanation: "Predefined tasks encode common application-code migration patterns, such as adapting message handling for Azure Service Bus. Developers review their applicability and can create custom skills from prior migrations. A code task doesn't itself establish that service provisioning or data cutover is complete."
        - content: "Generic Copilot code suggestions based on comments."
          isCorrect: false
          explanation: "Generic inline code suggestions from Copilot aren't the same as predefined tasks. Predefined tasks are guided migration actions encoded with expert knowledge for common scenarios, rather than on-the-fly suggestions."
        - content: "A substitute for transferring production data and approving service cutover."
          isCorrect: false
          explanation: "Application-code changes don't establish that production data was transferred or a service cutover was validated. Plan and approve those operations separately."
    - content: "After accepting the agent's code transformations, what should you do next?"
      choices:
        - content: "Consider the task done since the agent's output is always correct."
          isCorrect: false
          explanation: "You shouldn't assume the job is finished. The agent's output isn't guaranteed to be perfect, so verification is necessary."
        - content: "Immediately deploy to production."
          isCorrect: false
          explanation: "Deploying without thorough testing and review can introduce regressions or unexpected issues in production."
        - content: "Review the changes, run tests, and verify behavior before merging to production."
          isCorrect: true
          explanation: "After code transformations and automated checks, you should manually review changes, run your test suite, and confirm the application behaves correctly before merging into production."
        - content: "Delete the assessment and plan files to save space."
          isCorrect: false
          explanation: "There's no need to delete assessment and plan files. They can be valuable references and aren't part of the modernization workflow to remove."
    - content: "Which of the following is a supported way to interact with GitHub Copilot modernization?"
      choices:
        - content: "Writing inline code comments and waiting for Copilot autocomplete suggestions."
          isCorrect: false
          explanation: "This describes inline code completion, not the configured modernization workflow."
        - content: "After configuring the relevant integration, use the VS Code sidebar, @Modernize in Visual Studio, or the selected modernization agent in Copilot CLI."
          isCorrect: true
          explanation: "The entry point depends on the scenario. For example, Java modernization uses the configured VS Code extension or a CLI plugin with its specialized agent selected. Visual Studio exposes Modernize for .NET. A natural-language prompt to an unconfigured general agent isn't equivalent. For cloud-agent work that depends on repository setup workflows or Windows/custom runners, choose Actions; Cloud sandbox sessions don't apply that setup."
        - content: "Sending an email to Microsoft support with your source code."
          isCorrect: false
          explanation: "The tool is intended to be used within developer environments and CLI tools, not by emailing code to support."
        - content: "Uploading a ZIP file of your project to an Azure portal."
          isCorrect: false
          explanation: "Uploading a project ZIP isn't the documented way to invoke these modernization agents. Portfolio code insights can import assessment-report ZIPs, which are different from application source archives."
    - content: "Which statement correctly describes the language-specific scope of GitHub Copilot modernization?"
      choices:
        - content: "Java and .NET upgrades and Azure migration, C++ upgrades, JavaScript/TypeScript npm-package upgrades, and Python Agent Framework migration."
          isCorrect: true
          explanation: "Capabilities differ by language and scenario. Supported .NET upgrade projects include C# and Visual Basic; this doesn't establish support for both in every Azure migration task. Python framework migration is a separate scenario. Language-agnostic containerization and deployment also have application and hosting requirements."
        - content: "Java only."
          isCorrect: false
          explanation: "Java is one supported language. The product also documents .NET, C++, JavaScript/TypeScript, and a specific Python framework-migration scenario."
        - content: "All programming languages equally."
          isCorrect: false
          explanation: "Support isn't equal across all languages; advanced capabilities are focused on specific languages and scenarios."
        - content: "Only languages that run on Azure."
          isCorrect: false
          explanation: "Support is defined by documented language-specific scenarios, not by every language that can run on Azure. Containerization and deployment also have runtime and hosting prerequisites."
