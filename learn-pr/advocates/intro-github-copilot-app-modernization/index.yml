title: Introduction to GitHub Copilot modernization
summary: GitHub Copilot modernization provides language-specific upgrade and migration workflows. This module focuses on Java and .NET, distinguishes other supported scenarios, and explains how to review assessment, planning, code changes, validation results, and optional Azure deployment.
abstract: |
  After completing this module, you'll be able to:
  -	Describe GitHub Copilot modernization and its capabilities.
  -	Identify supported languages, frameworks, platforms, and scenario boundaries.
  -	Understand the GitHub Copilot modernization workflow.
  -	Work with predefined tasks and custom skills.
  -	Understand how to refactor and upgrade legacy code with GitHub Copilot modernization.
  -	Understand the distinction between GitHub Copilot upgrade and Azure migration workflows.
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  -	Microsoft Azure and cloud services
  -	AI concepts
  - Architecture concepts
