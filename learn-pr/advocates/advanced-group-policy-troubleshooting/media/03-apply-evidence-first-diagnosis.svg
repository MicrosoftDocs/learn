<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="cecdcb0e411477855-title cecdcb0e411477855-desc" data-module="advanced-group-policy-troubleshooting" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="cecdcb0e411477855-title">Preserving an incident before a refresh changes it</title><desc id="cecdcb0e411477855-desc">Advanced Group Policy troubleshooting, UNIT 03. A testable expectation and a comparable healthy peer narrow the first diagnostic question. 1. State the expectation: Name the target, policy, setting, expected trigger, and observed difference. 2. Capture the failing cycle: Record time, selected controller, actual results, and the processing Activity ID. 3. Test one difference: Compare a peer with the same role, build, site, and intended policy scope. Key takeaways: Capture the evidence before a restart, policy refresh, or object move produces a different processing instance. A GPO modification time is a clue, not a setting-level audit trail; corroborate it with reports and change records.</desc><defs><marker id="cecdcb0e411477855-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="cecdcb0e411477855-i151" viewBox="88 83 42 52" data-asset="CnE_GeneralSymbols\Tasks.svg" xmlns="http://www.w3.org/2000/svg"><g><g><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M123.4,91.3h-2v34h-25v-34h-2c-1.7,0-3,1.4-3,3v33.9   c0,1.7,1.4,3,3,3h29c1.7,0,3-1.4,3-3V94.3C126.5,92.7,125.1,91.3,123.4,91.3z" /><path fill-rule="evenodd" clip-rule="evenodd" fill="#00188F" d="M116.5,89.4H113v-1.2c0-1.6-1.3-2.9-2.9-2.9h-2.3   c-1.6,0-2.9,1.3-2.9,2.9v1.2h-3.5c-1.2,0-2.3,0.8-2.7,1.9h8.8v-2h3v2h8.8C118.8,90.2,117.8,89.4,116.5,89.4z" /><path fill-rule="evenodd" clip-rule