<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Policy evidence compared with effective state</title>
  <desc id="desc">Five evidence layers show configuration report, modeled result, actual resultant policy, processing evidence, effective state, then application behavior. A competing authority can alter effective state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#243A5E"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#172B4D">No single report proves effective behavior</text>

  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="35" y="105" width="175" height="110" rx="8" fill="#F2F2F2" stroke="#5B5B5B" stroke-width="2"/>
    <text x="122" y="138" font-size="18" font-weight="700" fill="#172B4D">Configuration</text>
    <text x="122" y="166" font-size="14" fill="#334E68">GPO report</text>
    <text x="122" y="189" font-size="14" fill="#334E68">What is defined?</text>

    <rect x="235" y="105" width="175" height="110" rx="8" fill="#E8F3FC" stroke="#0078D4" stroke-width="2"/>
    <text x="322" y="138" font-size="18" font-weight="700" fill="#172B4D">Simulation</text>
    <text x="322" y="166" font-size="14" fill="#334E68">Modeling</text>
    <text x="322" y="189" font-size="14" fill="#334E68">What should apply?</text>

    <rect x="435" y="105" width="175" height="110" rx="8" fill="#F3E8FD" stroke="#8764B8" stroke-width="2"/>
    <text x="522" y="138" font-size="18" font-weight="700" fill="#172B4D">Actual RSoP</text>
    <text x="522" y="166" font-size="14" fill="#334E68">Results plus gpresult</text>
    <text x="522" y="189" font-size="14" fill="#334E68">What was selected?</text>

    <rect x="635" y="105" width="175" height="110" rx="8" fill="#FDF3E8" stroke="#D83B01" stroke-width="2"/>
    <text x="722" y="138" font-size="18" font-weight="700" fill="#172B4D">Processing</text>
    <text x="722" y="166" font-size="14" fill="#334E68">Activity ID events</text>
    <text x="722" y="189" font-size="14" fill="#334E68">What did the CSE do?</text>

    <rect x="835" y="105" width="175" height="110" rx="8" fill="#E7F6E7" stroke="#107C10" stroke-width="3"/>
    <text x="922" y="138" font-size="18" font-weight="700" fill="#172B4D">Effective state</text>
    <text x="922" y="166" font-size="14" fill="#334E68">Registry or subsystem</text>
    <text x="922" y="189" font-size="14" fill="#334E68">What is active?</text>

    <rect x="1035" y="105" width="130" height="110" rx="8" fill="#FFF4CE" stroke="#C19C00" stroke-width="2"/>
    <text x="1100" y="138" font-size="18" font-weight="700" fill="#172B4D">Behavior</text>
    <text x="1100" y="166" font-size="14" fill="#334E68">Service</text>
    <text x="1100" y="189" font-size="14" fill="#334E68">Application</text>
  </g>

  <g stroke="#243A5E" stroke-width="3" marker-end="url(#arrow)">
    <line x1="210" y1="160" x2="230" y2="160"/>
    <line x1="410" y1="160" x2="430" y2="160"/>
    <line x1="610" y1="160" x2="630" y2="160"/>
    <line x1="810" y1="160" x2="830" y2="160"/>
    <line x1="1010" y1="160" x2="1030" y2="160"/>
  </g>

  <rect x="730" y="300" width="385" height="110" rx="10" fill="#FDE7E9" stroke="#A4262C" stroke-width="2"/>
  <text x="922" y="334" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#A4262C">Competing authority</text>
  <text x="922" y="365" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#334E68">MDM, security product, script, local configuration,</text>
  <text x="922" y="389" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#334E68">application configuration, unsupported setting</text>
  <line x1="922" y1="300" x2="922" y2="220" stroke="#A4262C" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="180" y="440" width="840" height="38" rx="19" fill="#243A5E"/>
  <text x="600" y="465" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Validate policy result plus behavior result</text>
</svg>
