</text></g><line x1="274.053" x2="1064" y1="768.5" y2="768.5" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="850.86" r="13" fill="#e2f1ee" /><path d="M71 850.86l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 830.9 948 70"><text x="120" y="858.72" font-size="23" font-weight="400" fill="#364f5e">If AD versions agree but a controller has an older template, inspect its DFS Replication</text><text x="120" y="890.72" font-size="23" font-weight="400" fill="#364f5e">events and actual files.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="936.6" y2="936.6" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="992.26" r="13" fill="#e2f1ee" /><path d="M71 992.26l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 972.3 948 70"><text x="120" y="1000.12" font-size="23" font-weight="400" fill="#364f5e">Verify the relevant user or computer version and the required file before asking the</text><text x="120" y="1032.12" font-size="23" font-weight="400" fill="#364f5e">affected client to refresh.</text></g></g></svg>