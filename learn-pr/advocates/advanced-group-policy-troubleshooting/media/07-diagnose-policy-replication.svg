<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="caa6ac55ff15d0914-title caa6ac55ff15d0914-desc" data-module="advanced-group-policy-troubleshooting" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="caa6ac55ff15d0914-title">Two replication paths behind one Group Policy Object</title><desc id="caa6ac55ff15d0914-desc">Advanced Group Policy troubleshooting, UNIT 07. The container and template must agree on the controller that served the failing client. 1. Group Policy Container: AD DS replicates directory metadata, including status and version information. 2. Group Policy Template: DFSR replicates SYSVOL files such as GPT.ini and Registry.pol. Key takeaways: If AD versions agree but a controller has an older template, inspect its DFS Replication events and actual files. Verify the relevant user or computer version and the required file before asking the affected client to refresh.</desc><defs><symbol id="caa6ac55ff15d0914-i444" viewBox="0 0 18 18" data-asset="general\10801-icon-service-Files.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><linearGradient id="caa6ac55ff15d0914-i444n0" x1="11.246" y1="18" x2="11.246" y2="3.281" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.817" stop-color="#5ea0ef" /></linearGradient></defs><g id="caa6ac55ff15d0914-i444n1"><g><rect x="1.078" y="0.334" width="10.11" height="11.685" fill="#5ea0ef" /><path d="M11.188,12.353H1.078a.334.334,0,0,1-.334-.334V.334A.333.333,0,0,1,1.078,0h10.11a.333.333,0,0,1,.333.334V12.019A.334.334,0,0,1,11.188,12.353Zm-9.777-.668h9.443V.668H1.411Z" fill="#0078d4" /><rect x="3.01" y="1.918" width="10.11" height="11.685" fill="#83b9f9" /><path d="M13.12,13.937H3.01a.335.335,0,0,1-.334-.334V1.918a.335.335,0,0,1,.334-.334H13.12a.334.334,0,0,1,.334.334V13.6A.334.334,0,0,1,13.12,13.937Zm-9.776-.668h