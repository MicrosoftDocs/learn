<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c4369c7687ad0533e-title c4369c7687ad0533e-desc" data-module="advanced-group-policy-troubleshooting" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c4369c7687ad0533e-title">Reading the events for one extension in one cycle</title><desc id="c4369c7687ad0533e-desc">Advanced Group Policy troubleshooting, UNIT 06. An Activity ID ties related processing events together more reliably than proximity in the event viewer. 1. System event: Identify the symptom, scope, error text, and processing Activity ID. 2. Operational timeline: Follow discovery, GPO selection, extension start, and extension completion for that ID. 3. Extension evidence: Consult the responsible extension's events and verify its effect on the target. Key takeaways: A later refresh or a different user/computer scope has another Activity ID; do not merge their timelines. For a failed preference item, review its error and targeting condition even if the GPO itself applied.</desc><defs><marker id="c4369c7687ad0533e-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Advanced Group Policy troubleshooting</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 06</text></g><g data-field="title" data-box="56 95 1008 132"><text x="60" y="147.64" font-size="46" 