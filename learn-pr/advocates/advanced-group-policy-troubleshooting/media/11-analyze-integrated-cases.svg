<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="ce5bae378583f2f6e-title ce5bae378583f2f6e-desc" data-module="advanced-group-policy-troubleshooting" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="ce5bae378583f2f6e-title">Two symptoms during one hardening pilot</title><desc id="ce5bae378583f2f6e-desc">Advanced Group Policy troubleshooting, UNIT 11. The pilot's inventory failure and slow startup require different evidence and different corrections. 1. Inventory query fails: The intended LDAP protection took effect; the old client library used incompatible binds. 2. Pilot servers start slowly: The elapsed time belongs to a WMI filter on a different server-targeting GPO. Key takeaways: Retest inventory with the updated library under the intended LDAP settings to verify compatibility. Measure the revised WMI filter on comparable servers; a successful inventory run says nothing about startup time.</desc><defs><symbol id="ce5bae378583f2f6e-i475" viewBox="0 0 18 18" data-asset="general\10834-icon-service-Search.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><radialGradient id="ce5bae378583f2f6e-i475n0" cx="10.629" cy="7.175" r="6.675" gradientUnits="userSpaceOnUse"><stop offset="0.225" stop-color="#32d4f5" /><stop offset="0.59" stop-color="#32d2f2" /><stop offset="0.825" stop-color="#32caea" /><stop offset="1" stop-color="#32bedd" /></radialGradient></defs><g id="ce5bae378583f2f6e-i475n1"><g><rect x="-0.375" y="12.598" width="9.73" height="2.216" rx="1.036" transform="translate(-8.376 7.19) rotate(-45)" fill="#198ab3" /><circle cx="10.629" cy="7.175" r="6.675" fill="url(#ce5bae378583f2f6e-i475n0)" /><circle cx="10.615" cy="7.056" r="5.243" fill="#fff" /><path d="M5.535,8.353S6.97,1.171,13.676,2.8a5.14,5.14,0,0,0-6.186.047A5.121,5.121,0,0,0,5.535,8.353Z" fill="#c3f1ff" /></g></g></g></symbol><