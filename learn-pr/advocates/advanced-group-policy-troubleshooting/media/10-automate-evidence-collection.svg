<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="ccdabc7239be040ca-title ccdabc7239be040ca-desc" data-module="advanced-group-policy-troubleshooting" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="ccdabc7239be040ca-title">Evidence to retain before a high-impact change</title><desc id="ccdabc7239be040ca-desc">Advanced Group Policy troubleshooting, UNIT 10. A recoverable GPO backup and a record of the GPO's surroundings serve different purposes. 1. GPO backup: Preserve the policy content before correction and record the backup identifier. 2. Scope and permissions: Capture links, order, inheritance, and delegation separately from policy content. 3. Client record: Pair timestamped actual RSoP with the Activity ID and exported logs. Key takeaways: A domain or OU inheritance report does not prove the site's links; capture them separately when relevant. Sanitize the support bundle and retain the evidence gap if no before-change report exists.</desc><defs><symbol id="ccdabc7239be040ca-i70" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Key, permissions.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="ccdabc7239be040ca-i70n0"><g id="ccdabc7239be040ca-i70n1" /></g><g id="ccdabc7239be040ca-i70n2" /><g id="ccdabc7239be040ca-i70n3" /><g id="ccdabc7239be040ca-i70n4" /><g id="ccdabc7239be040ca-i70n5"><g id="ccdabc7239be040ca-i70n6" transform="translate(1.50075,-1.50075)"><path fill="#2A3282" d="M455.7,152.9H334.5c-11.1,0-20.5,9.4-20.5,20.5v84.5c0,11.1,9.4,19.6,21.3,19.6h23.9v151.1    c0,19.6,12,33.3,29,33.3c15.4,0,27.3-12,29-28.2c4.3-0.9,7.7-0.9,7.7-0.9s0.9-15.4,0-20.5c-0.9-5.1,9.4-11.1,9.4-11.1    s0.9-8.5,0-9.4c-9.4-4.3-14.5-8.5-17.1-12v-10.2c2.6-3.4,6-6,7.7-7.7c3.4-4.3,11.1-16.2,11.1-16.2s-8.5-12-11.1-14.5    c-4.3-5.1-6.8-10.2-7.7-14.5v-7.7c2.6-17.1,22.2-31.6,22.2-31.6h-22.2l0,0h39.3c10.2,0,19.6