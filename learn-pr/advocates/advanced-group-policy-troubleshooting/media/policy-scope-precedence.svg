<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Group Policy scope, precedence, filtering, loopback</title>
  <desc id="desc">The left side shows Local, Site, Domain, Parent OU, Child OU processing. The right side shows filtering gates plus loopback Merge and Replace behavior.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#243A5E"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#172B4D">Scope builds the list. Filtering permits it. Semantics produce the result.</text>

  <text x="260" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#172B4D">Normal processing order</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="90" y="105" width="340" height="60" rx="8" fill="#F2F2F2" stroke="#5B5B5B" stroke-width="2"/>
    <text x="260" y="142" font-size="18" font-weight="700" fill="#172B4D">Local policy</text>
    <rect x="90" y="185" width="340" height="60" rx="8" fill="#E8F3FC" stroke="#0078D4" stroke-width="2"/>
    <text x="260" y="222" font-size="18" font-weight="700" fill="#172B4D">Site links</text>
    <rect x="90" y="265" width="340" height="60" rx="8" fill="#E8F3FC" stroke="#0078D4" stroke-width="2"/>
    <text x="260" y="302" font-size="18" font-weight="700" fill="#172B4D">Domain links</text>
    <rect x="90" y="345" width="340" height="60" rx="8" fill="#F3E8FD" stroke="#8764B8" stroke-width="2"/>
    <text x="260" y="382" font-size="18" font-weight="700" fill="#172B4D">Parent organizational unit links</text>
    <rect x="90" y="425" width="340" height="60" rx="8" fill="#E7F6E7" stroke="#107C10" stroke-width="3"/>
    <text x="260" y="462" font-size="18" font-weight="700" fill="#172B4D">Child organizational unit links</text>
  </g>
  <g stroke="#243A5E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="260" y1="165" x2="260" y2="180"/>
    <line x1="260" y1="245" x2="260" y2="260"/>
    <line x1="260" y1="325" x2="260" y2="340"/>
    <line x1="260" y1="405" x2="260" y2="420"/>
  </g>
  <text x="260" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#334E68">Later processing usually has higher precedence for one value.</text>

  <text x="770" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#172B4D">Candidate gates</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="565" y="105" width="170" height="64" rx="8" fill="#E8F3FC" stroke="#0078D4" stroke-width="2"/>
    <text x="650" y="132" font-size="17" font-weight="700" fill="#172B4D">Link plus status</text>
    <text x="650" y="153" font-size="14" fill="#334E68">Enabled side</text>
    <rect x="755" y="105" width="170" height="64" rx="8" fill="#F3E8FD" stroke="#8764B8" stroke-width="2"/>
    <text x="840" y="132" font-size="17" font-weight="700" fill="#172B4D">Security</text>
    <text x="840" y="153" font-size="14" fill="#334E68">Read plus Apply</text>
    <rect x="945" y="105" width="170" height="64" rx="8" fill="#FDF3E8" stroke="#D83B01" stroke-width="2"/>
    <text x="1030" y="132" font-size="17" font-weight="700" fill="#172B4D">WMI filter</text>
    <text x="1030" y="153" font-size="14" fill="#334E68">True result</text>
  </g>
  <g stroke="#243A5E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="735" y1="137" x2="750" y2="137"/>
    <line x1="925" y1="137" x2="940" y2="137"/>
  </g>

  <rect x="565" y="205" width="550" height="76" rx="8" fill="#FFF4CE" stroke="#C19C00" stroke-width="2"/>
  <text x="840" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#172B4D">Inheritance controls</text>
  <text x="840" y="253" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#334E68">Block stops non-enforced parent links.</text>
  <text x="840" y="273" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#334E68">Enforced survives block and resists lower override.</text>

  <text x="840" y="325" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#172B4D">Loopback user processing</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="565" y="350" width="260" height="130" rx="8" fill="#E8F3FC" stroke="#0078D4" stroke-width="2"/>
    <text x="695" y="382" font-size="19" font-weight="700" fill="#172B4D">Merge</text>
    <text x="695" y="412" font-size="14" fill="#334E68">Normal user list first</text>
    <text x="695" y="437" font-size="14" fill="#334E68">Computer-scope user list second</text>
    <text x="695" y="462" font-size="14" fill="#334E68">Second list has later precedence</text>
    <rect x="855" y="350" width="260" height="130" rx="8" fill="#F3E8FD" stroke="#8764B8" stroke-width="2"/>
    <text x="985" y="382" font-size="19" font-weight="700" fill="#172B4D">Replace</text>
    <text x="985" y="412" font-size="14" fill="#334E68">Ignore normal user list</text>
    <text x="985" y="437" font-size="14" fill="#334E68">Use computer-scope user list</text>
    <text x="985" y="462" font-size="14" fill="#334E68">Computer location defines experience</text>
  </g>
  <text x="840" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#A4262C">Item-level targeting runs after the GPO applies. It is not a security boundary.</text>
</svg>
