### YamlMime:ModuleUnit
uid: learn.manage-optimize-agent-investment-azure.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Check your knowledge.
  ms.date: 09/01/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
durationInMinutes: 5
content: |
quiz:
  questions:
  - content: "Your organization wants to improve the ROI of its AI agents by gaining deep visibility into performance, user interactions, and cost trends. Which combination of Azure tools best supports this goal?"
    choices:
    - content: "Azure Kubernetes Service and Microsoft Foundry SDK"
      isCorrect: false
      explanation: "These tools are focused on infrastructure orchestration and agent development, not on monitoring performance or cost trends for ROI optimization."
    - content: "Azure Monitor Application Insights and Microsoft Cost Management"
      isCorrect: true
      explanation: "Application Insights provides observability into agent behavior and performance, while Microsoft Cost Management offers insights into spending patterns and helps optimize resource allocation—together they support ROI improvement."
    - content: "GitHub Copilot and Azure Monitor Metrics Explorer"
      isCorrect: false
      explanation: "Metrics Explorer can inspect selected platform metrics, but GitHub Copilot doesn't provide the application observability and cost analysis needed for this goal."
  - content: "Your organization wants to proactively manage AI agent costs and receive notifications as spending approaches budget thresholds. You also need to govern model throughput and capacity and receive alerts from supported operational signals. Which combination of Azure tools best supports this strategy?"
    choices:
    - content: "Azure Monitor Metrics Explorer, GitHub Copilot, and Azure Kubernetes Service"
      isCorrect: false
      explanation: "These tools support performance monitoring and development workflows but don't provide Cost Management budget notifications or Foundry quota governance."
    - content: "Microsoft Foundry SDK, Azure Virtual Machines, and Power BI"
      isCorrect: false
      explanation: "While useful for development and visualization, this combination lacks Cost Management budget notifications, Foundry quota governance, and Azure Monitor alerting."
    - content: "Microsoft Cost Management budgets, Microsoft Foundry quotas, and Azure Monitor alerts"
      isCorrect: true
      explanation: "Budgets notify teams when configured spending thresholds are reached but don't impose a hard spending cap. Foundry quotas govern model throughput and capacity, while Azure Monitor alerts notify teams based on supported operational signals."
  - content: "Your organization is deploying AI agents with consistent workloads and wants to reduce long-term operational costs while maintaining high performance. Which Microsoft Foundry strategy best supports this goal?"
    choices:
    - content: "Estimate throughput, benchmark representative workloads, verify the deployment, and then purchase a matching PTU reservation"
      isCorrect: true
      explanation: "PTU reservations can reduce costs for steady workloads. Estimation, representative benchmarking, and deployment verification provide evidence for purchasing a reservation that matches the validated capacity requirement."
    - content: "Use hourly PTU billing for all deployments"
      isCorrect: false
      explanation: "Hourly PTU billing is flexible but more expensive for long-term use. It’s better suited for short-term or experimental workloads."
    - content: "Request maximum quota before deploying agents"
      isCorrect: false
      explanation: "Requesting maximum quota before deployment can lead to overprovisioning. Estimate demand, benchmark a representative workload, verify the deployment, and purchase only the reservation that matches the validated requirement."
   