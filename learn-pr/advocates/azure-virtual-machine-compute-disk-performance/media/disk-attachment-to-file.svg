  <text x="30" y="43" font-size="30" font-weight="600" text-anchor="start">From Azure disk to stock report</text>
  <text x="30" y="74" font-size="20" font-weight="400" text-anchor="start">Windows example: follow the attachment on VM D from top to bottom.</text>
