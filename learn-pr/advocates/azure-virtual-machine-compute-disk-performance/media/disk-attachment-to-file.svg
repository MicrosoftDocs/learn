  <title id="map-title">From Azure disk to stock report</title>
  <desc id="map-description">Windows SCSI example. Azure disk orders-data at LUN 2 maps to guest Disk 4. Its partition contains the NTFS volume F:, where the service writes F:\reports\stock.csv.</desc>
