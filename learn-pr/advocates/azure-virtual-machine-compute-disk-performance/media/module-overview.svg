  <use x="174" width="52" height="52" aria-hidden="true" data-kind="azure-icon" y="326" href="#azure-virtual-machine-compute-disk-performance-icon-machine" />
  <text x="252" data-kind="step-heading" data-card="azure-virtual-machine-compute-disk-performance-step-2-card" font-weight="600" font-size="23" y="339" fill="#000000">Check guest pressure</text>
  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-compute-disk-performance-step-2-card" font-size="17" y="373" fill="#000000">Correlate processor contention, memory pressure, paging, and swapping.</text>
