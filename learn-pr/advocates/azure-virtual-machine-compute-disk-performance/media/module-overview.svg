  <text x="252" data-kind="step-description" data-card="azure-virtual-machine-compute-disk-performance-step-5-card" font-size="17" y="841" fill="#000000">Change one variable and explain improvement, nonimprovement, or a new limit.</text>
  <text fill="#000000" font-size="17" y="935" data-kind="note" x="80">Changing a disk cannot remove an unrelated guest or aggregate virtual machine limit.</text>
