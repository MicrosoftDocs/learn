    <text x="97" y="257" font-size="22" font-weight="600" text-anchor="start">Data disk mounted</text>
    <text x="52" y="291" font-size="20" font-weight="400" text-anchor="start">The data filesystem is mounted</text>
    <text x="52" y="316" font-size="20" font-weight="400" text-anchor="start">at /srv/reports.</text>
    <use x="52" y="330" width="29" height="29" href="#mount-disk" aria-hidden="true" data-kind="icon" xlink:href="#mount-disk" />
    <text x="95" y="353" font-size="20" font-weight="600" text-anchor="start">Write goes to the data disk.</text>
  </g>
  <g data-step="2B">
