    <text x="152" y="139" font-size="22" font-weight="600" text-anchor="start">Application writes the report</text>
    <text x="556" y="139" font-size="20" font-weight="400" text-anchor="start" font-family="Consolas, 'Courier New', monospace">/srv/reports/stock.csv</text>
