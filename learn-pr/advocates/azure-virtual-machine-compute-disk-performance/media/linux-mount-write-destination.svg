  <rect x="0" y="0" width="900" height="440" fill="#ffffff" data-kind="background" />
  <text x="30" y="43" font-size="30" font-weight="600" text-anchor="start">One Linux path, two possible disks</text>
  <text x="30" y="74" font-size="20" font-weight="400" text-anchor="start">Example: the root filesystem is on the OS disk and the reports directory is writable.</text>
