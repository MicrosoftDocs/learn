  <title id="mount-title">One Linux path, two possible disks</title>
  <desc id="mount-description">The application writes /srv/reports/stock.csv. If the data filesystem is mounted at /srv/reports, the write goes to the data disk. Without that mount, the writable directory in this example is on the OS disk.</desc>
  <metadata>Azure icon sources: general\10800-icon-service-File.svg; compute\10032-icon-service-Disks.svg (C:\Azure-Icons).</metadata>
