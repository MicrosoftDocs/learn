title: Identify Azure virtual machine performance bottlenecks
summary: |
  A busy disk isn't always the reason an application slows down. Low memory, for example, can force an Azure virtual machine (VM) to read from disk more often. Compare application, guest, and Azure measurements to identify what makes requests wait. When a database call slows down, compare caller and server timings for the same call. Independent network checks can help you assess whether the path is a likely cause.

abstract: |
  By the end of this module, you're able to:

  - Define a repeatable workload and application targets, then compare offered work with completions in matching windows to identify unmet demand.
  - Distinguish processor contention, memory pressure, per-disk limits, and aggregate VM limits.
  - Calculate throughput from operation size and rate without mixing units.
  - Align guest and platform measurements to the correct disk attachment.
  - Distinguish network delay from time spent in the caller or at the database by matching both records for one call. Explain what remains unknown if the server record is missing.
  - After changing one limit, assess read rate and 95th-percentile application response time against their respective targets and identify what still needs measurement.
  - Recommend a justified change, or no resize, for the M11 rightsizing workflow.
prerequisites: |
  All measurements are supplied. You don't need an Azure subscription, a running virtual machine, or a software installation.
