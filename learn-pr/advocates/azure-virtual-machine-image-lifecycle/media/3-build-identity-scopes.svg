<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="identity-title identity-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="identity-title">Which identity needs the role?</title>
  <desc id="identity-desc">Read each row from left to right. Image Builder uses the template identity to publish a gallery version and manage staging resources. To attach a build VM identity, the template identity needs Managed Identity Operator on that identity resource. A script on the build VM then uses its explicitly assigned identity and Storage Blob Data Reader to read a private blob. Identity attachment and blob data access are separate grants.</desc>
  <metadata>Azure service icons are embedded from C:\Azure-Icons. Each symbol records its source file.</metadata>
  <defs>
    <symbol id="identity-template" viewBox="0 0 18 18" data-source="compute/02634-icon-service-Image-Templates.svg"><defs><linearGradient id="identity-template-a743bfbf-43b1-4b79-b3a1-696091f8e2ab" x1="7.725" y1="12.859" x2="7.725" y2="2.896" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.817" stop-color="#5ea0ef" /></linearGradient></defs><g id="identity-template-e9d3fb42-bcb8-4f88-a8f9-d56e280aed3b"><g><g><path d="M8.574,12.334h0a.231.231,0,0,1-.226-.236c0-.123,0-.25,0-.381H7.962a.231.231,0,0,1,0-.462h.616a.231.231,0,0,1,.231.231q0,.327,0,.622A.231.231,0,0,1,8.574,12.334Z" fill="#37c2b1" /><path d="M7.685,14.541a.231.231,0,0,1-.1-.438,1.171,1.171,0,0,0,.629-.814.231.231,0,0,1,.445.124,1.642,1.642,0,0,1-.869,1.105A.233.233,0,0,1,7.685,14.541Z" fill="#37c2b1" /><path d="M6.926,15.566H6.31a.23.23,0,0,1-.231-.231,1.057,1.057,0,0,1,.286-.717.231.231,0,0,1,.339.315.627.627,0,0,0-.114.171h.336a.231.231,0,0,1,0,.462Z" fill="#37c2b1" /><path d="M11.918,15.566H10.67a.231.231,0,0,1,0-.462h1.248a.231.231,0,0,1,0,.462Z" fill="#37c2b1" /><path d="M13.782,15.566h-.616a.231.231,0,0,1,0-.462H13.5a.636.636,0,0,0-.114-.17.231.231,0,0,1,.337-.315,1.048,1.048,0,0,1,.289.716A.231.231,0,0,1,13.782,15.566Z" fill="#37c2b1" /><path d="M12.405,14.542a.23.23,0,0,1-.1-.023,1.641,1.641,0,0,1-.872-1.1.231.231,0,1,1,.445-.125,1.176,1.176,0,0,0,.631.814.231.231,0,0,1-.1.438Z" fill="#37c2b1" /><path d="M11.513,12.334a.231.231,0,0,1-.231-.226c0-.2,0-.4,0-.622a.232.232,0,0,1,.231-.231h.616a.231.231,0,0,1,0,.462H11.74c0,.131,0,.258,0,.381a.231.231,0,0,1-.226.236Z" fill="#37c2b1" /><path d="M16.967,11.717h-1.21a.231.231,0,0,1,0-.462h1.21a.231.231,0,1,1,0,.462Zm-2.421,0h-1.21a.231.231,0,0,1,0-.462h1.21a.231.231,0,0,1,0,.462Zm-7.8,0H5.535a.231.231,0,0,1,0-.462H6.746a.231.231,0,0,1,0,.462Zm-2.421,0H3.114a.231.231,0,0,1,0-.462H4.325a.231.231,0,0,1,0,.462Zm13.191-.876a.23.23,0,0,1-.231-.231V9.4a.231.231,0,0,1,.462,0v1.21A.231.231,0,0,1,17.516,10.841Zm-14.944,0a.231.2