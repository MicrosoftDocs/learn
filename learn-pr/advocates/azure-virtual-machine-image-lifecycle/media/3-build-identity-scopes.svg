    <symbol id="identity-vm" viewBox="0 0 18 18" data-source="compute/10021-icon-service-Virtual-Machine.svg"><defs><linearGradient id="identity-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="identity-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#identity-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#identity-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></symbol>
    <symbol id="identity-storage" viewBox="0 0 18 18" data-source="storage/10086-icon-service-Storage-Accounts.svg"><defs><linearGradient id="identity-storage-ad4c4f96-09aa-4f91-ba10-5cb8ad530f74" x1="9" y1="15.83" x2="9" y2="5.79" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b3b3b3" /><stop offset="0.26" stop-color="#c1c1c1" /><stop offset="1" stop-color="#e6e6e6" /></linearGradient></defs><path d="M.5,5.79h17a0,0,0,0,1,0,0v9.48a.57.57,0,0,1-.57.57H1.07a.57.57,0,0,1-.57-.57V5.79A0,0,0,0,1,.5,5.79Z" fill="url(#identity-storage-ad4c4f96-09aa-4f91-ba10-5cb8ad530f74)" /><path d="M1.07,2.17H16.93a.57.57,0,0,1,.57.57V5.79a0,0,0,0,1,0,0H.5a0,0,0,0,1,0,0V2.73A.57.57,0,0,1,1.07,2.17Z" fill="#37c2b1" /><path d="M2.81,6.89H15.18a.27.27,0,0,1,.26.27v1.4a.27.27,0,0,1-.26.27H2.81a.27.27,0,0,1-.26-.27V7.16A.27.27,0,0,1,2.81,6.89Z" fill="#fff" /><path d="M2.82,9.68H15.19a.27.27,0,0,1,.26.27v1.41a.27.27,0,0,1-.26.27H2.82a.27.27,0,0,1-.26-.27V10A.27.27,0,0,1,2.82,9.68Z" fill="#37c2b1" /><path d="M2.82,12.5H15.19a.27.27,0,0,1,.26.27v1.41a.27.27,0,0,1-.26.27H2.82a.27.27,0,0,1-.26-.27V12.77A.27.27,0,0,1,2.82,12.5Z" fill="#258277" /></symbol>
    <marker id="identity-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#40566f" /></marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff" data-kind="background" />
  <text x="32" y="45" font-size="29" font-weight="600">Which identity needs the role?</text>
  <text x="32" y="77" font-size="18">Start with the caller on the left. Each row shows its own permission assignment.</text>
  <text x="33" y="115" font-size="16" font-weight="600">CALLER AND IDENTITY</text>
  <text x="476" y="115" font-size="16" font-weight="600">RESOURCE AND PERMISSION</text>
  <g data-order="1">
    <rect id="identity-service-box" x="32" y="129" width="370" height="108" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#identity-template" x="51" y="146" width="32" height="32" aria-hidden="true" />
    <text x="96" y="172" font-size="21" font-weight="600" data-card="identity-service-box">1. Image Builder service</text>
    <text x="51" y="210" font-size="18" data-card="identity-service-box">Uses the identity on the template.</text>
    <path d="M412 183 H463" stroke="#40566f" stroke-width="2" fill="none" marker-end="url(#identity-arrow)" data-kind="connector" />
    <rect id="identity-output-box" x="476" y="129" width="452" height="108" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#identity-gallery" x="495" y="143" width="30" height="30" aria-hidden="true" />
    <text x="538" y="167" font-size="20" font-weight="600" data-card="identity-output-box">Gallery and staging group</text>
    <text x="495" y="194" font-size="17" data-card="identity-output-box">Write the gallery version. Use Contributor only</text>
    <text x="495" y="221" font-size="17" data-card="identity-output-box">in the template's dedicated staging group.</text>
  </g>
  <g data-order="2">
    <rect id="identity-attach-caller-box" x="32" y="258" width="370" height="117" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use href="#identity-template" x="51" y="273" width="32" height="32" aria-hidden="true" />
    <text x="96" y="299" font-size="21" font-weight="600" data-card="identity-attach-caller-box">2. Template identity</text>
    <text x="51" y="331" font-size="17" data-card="identity-attach-caller-box">Attaches the selected identity</text>
    <text x="51" y="355" font-size="17" data-card="identity-attach-caller-box">to the temporary build VM.</text>
    <path d="M412 317 H463" stroke="#40566f" stroke-width="2" fill="none" marker-end="url(#identity-arrow)" data-kind="connector" />
    <rect id="identity-attach-target-box" x="476" y="258" width="452" height="117" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <text x="495" y="299" font-size="20" font-weight="600" data-card="identity-attach-target-box">Build VM identity resource</text>
    <text x="495" y="331" font-size="17" data-card="identity-attach-target-box">Managed Identity Operator on this identity.</text>
    <text x="495" y="355" font-size="17" data-card="identity-attach-target-box">This grant does not provide blob data access.</text>
  </g>
  <g data-order="3" transform="translate(0 136)">
    <rect id="identity-script-box" x="32" y="258" width="370" height="117" rx="10" fill="#f4f4fa" stroke="#756b95" stroke-width="2" />
    <use href="#identity-vm" x="51" y="273" width="32" height="32" aria-hidden="true" />
    <text x="96" y="299" font-size="21" font-weight="600" data-card="identity-script-box">3. Script on the build VM</text>
    <text x="51" y="331" font-size="17" data-card="identity-script-box">For a private download, use an identity</text>
    <text x="51" y="355" font-size="17" data-card="identity-script-box">explicitly assigned to the build VM.</text>
    <path d="M412 317 H463" stroke="#40566f" stroke-width="2" fill="none" marker-end="url(#identity-arrow)" data-kind="connector" />
    <rect id="identity-blob-box" x="476" y="258" width="452" height="117" rx="10" fill="#f4f4fa" stroke="#756b95" stroke-width="2" />
    <use href="#identity-storage" x="495" y="273" width="30" height="30" aria-hidden="true" />
    <text x="538" y="298" font-size="20" font-weight="600" data-card="identity-blob-box">Private artifact container</text>
    <text x="495" y="331" font-size="17" data-card="identity-blob-box">Grant Storage Blob Data Reader on this container.</text>
    <text x="495" y="355" font-size="17" data-card="identity-blob-box">The script does not need gallery write access.</text>
  </g>
  <text x="32" y="550" font-size="18" font-weight="600">The build VM does not inherit the template identity's roles.</text>
  <text x="32" y="578" font-size="18">Identity attachment and blob data access require separate permission assignments.</text>
</svg>
