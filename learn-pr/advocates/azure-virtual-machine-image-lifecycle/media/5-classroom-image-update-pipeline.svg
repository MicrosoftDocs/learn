    <symbol id="patch-test" data-source="monitor/00008-icon-service-Diagnostics-Settings.svg" viewBox="0 0 18 18"><defs><linearGradient id="patch-test-ef71ca8b-e0c3-42a3-b174-28e7219ff221" x1="8.15" y1="17.49" x2="8.15" y2="2.09" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5e9624" /><stop offset="0.31" stop-color="#69a828" /><stop offset="0.93" stop-color="#86d633" /></linearGradient></defs><path d="M15.2.5H3.59a.57.57,0,0,0-.44.2L1.93,2.11,15.31,15.67l-2,1.83h1a.71.71,0,0,0,.46-.17l1.17-1.07a.59.59,0,0,0,.19-.43V1.33A.81.81,0,0,0,15.2.5Z" fill="#5e9624" /><path d="M2.91,2.1l.74-.84A.5.5,0,0,1,4,1.08H14.88a.52.52,0,0,1,.52.52V15.38a.52.52,0,0,1-.17.38l-1.15,1.06" fill="#fff" /><path d="M14,2.09H2a.06.06,0,0,0-.05.06v15a.38.38,0,0,0,.38.38H14a.38.38,0,0,0,.38-.38V2.48A.38.38,0,0,0,14,2.09Z" fill="url(#patch-test-ef71ca8b-e0c3-42a3-b174-28e7219ff221)" /><path d="M12.5,7.82a.37.37,0,0,0-.37-.39H10.28a.16.16,0,0,0-.15.09L9.36,8.9,8.1,6.35,6.93,10l-1-2.6L4.61,9.84a.18.18,0,0,1-.15.1h-.6a.37.37,0,0,0-.37.33h0a.37.37,0,0,0,.37.41h1a.18.18,0,0,0,.16-.1L5.8,9.11l1.21,3L8.24,8.25l1.08,2.19,1.21-2.17a.16.16,0,0,1,.15-.09h1.45a.37.37,0,0,0,.37-.36Z" fill="#fff" /></symbol>
    <symbol id="patch-canary" data-source="compute/10021-icon-service-Virtual-Machine.svg" viewBox="0 0 18 18"><defs><linearGradient id="patch-canary-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="patch-canary-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#patch-canary-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#patch-canary-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></symbol>
    <marker id="patch-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#40566f" /></marker>
