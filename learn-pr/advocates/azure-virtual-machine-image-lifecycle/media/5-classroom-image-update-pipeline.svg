  <rect width="960" height="773" fill="#ffffff" data-kind="background" />
  <text x="32" y="44" font-size="29" font-weight="600">How a patched image becomes the classroom release</text>
  <text x="32" y="77" font-size="18">Run every Monday at 03:00 UTC or on demand for an urgent fix. Gallery version 1.0.1 is active.</text>

  <g data-order="1">
    <rect id="patch-select-box" x="32" y="102" width="536" height="123" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#patch-inputs" x="50" y="117" width="32" height="32" aria-hidden="true" />
    <text x="96" y="142" font-size="20" font-weight="600" data-card="patch-select-box">1. Select updates that apply</text>
    <text x="51" y="173" font-size="17" data-card="patch-select-box">Check Ubuntu notices and the approved package repository.</text>
    <text x="51" y="202" font-size="17" data-card="patch-select-box">Compare inputs with the active manifest; pin any changes.</text>
    <path d="M576 164H610" fill="none" stroke="#40566f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#patch-arrow)" data-kind="connector" />
    <rect id="patch-stop-box" x="620" y="102" width="308" height="123" rx="10" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <text x="639" y="139" font-size="19" font-weight="600" data-card="patch-stop-box">When to stop</text>
    <text x="639" y="170" font-size="17" data-card="patch-stop-box">No change: record it and stop.</text>
    <text x="639" y="198" font-size="17" data-card="patch-stop-box">Feed unavailable: fail the check.</text>
  </g>
  <path d="M246 228V250" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#patch-arrow)" data-kind="connector" />

  <g data-order="2">
    <rect id="patch-build-box" x="32" y="260" width="536" height="123" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#patch-template" x="50" y="275" width="32" height="32" aria-hidden="true" />
    <text x="96" y="300" font-size="20" font-weight="600" data-card="patch-build-box">2. Build candidate 1.0.2</text>
    <text x="51" y="331" font-size="17" data-card="patch-build-box">Use a new template name and an unused gallery version.</text>
    <text x="51" y="360" font-size="17" data-card="patch-build-box">Refresh the package index, then install the pinned upgrades.</text>
    <path d="M576 322H610" fill="none" stroke="#40566f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#patch-arrow)" data-kind="connector" />
    <rect id="patch-manifest-box" x="620" y="260" width="308" height="123" rx="10" fill="#f4f4fa" stroke="#756b95" stroke-width="2" />
    <use href="#patch-version" x="636" y="275" width="28" height="28" aria-hidden="true" />
    <text x="676" y="297" font-size="18" font-weight="600" data-card="patch-manifest-box">Candidate manifest</text>
    <text x="639" y="329" font-size="17" data-card="patch-manifest-box">Record the full ID, base version,</text>
    <text x="639" y="357" font-size="17" data-card="patch-manifest-box">recipe commit, and package list.</text>
  </g>
  <path d="M246 386V408" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#patch-arrow)" data-kind="connector" />

  <g data-order="3">
    <rect id="patch-validator-box" x="32" y="418" width="422" height="164" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#patch-test" x="50" y="433" width="32" height="32" aria-hidden="true" />
    <text x="96" y="458" font-size="20" font-weight="600" data-card="patch-validator-box">3a. Test before publication</text>
    <text x="51" y="489" font-size="17" data-card="patch-validator-box">Use dpkg-query to check installed packages</text>
    <text x="51" y="518" font-size="17" data-card="patch-validator-box">against the approved list. Run the application</text>
    <text x="51" y="547" font-size="17" data-card="patch-validator-box">validator. If it fails, do not publish.</text>
    <path d="M461 496H495" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#patch-arrow)" data-kind="connector" />
    <rect id="patch-canaries-box" x="505" y="418" width="423" height="164" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#patch-canary" x="523" y="433" width="32" height="32" aria-hidden="true" />
    <text x="568" y="458" font-size="20" font-weight="600" data-card="patch-canaries-box">3b. Test both regional copies</text>
    <text x="524" y="488" font-size="17" data-card="patch-canaries-box">After replication, use the exact ID to deploy one</text>
    <text x="524" y="514" font-size="17" data-card="patch-canaries-box">test VM in East US and one in West US 2.</text>
    <text x="524" y="540" font-size="17" data-card="patch-canaries-box">Reboot each, confirm the updates are active,</text>
    <text x="524" y="566" font-size="17" data-card="patch-canaries-box">and run the first lesson as a learner.</text>
  </g>
  <path d="M716 585V600" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#patch-arrow)" data-kind="connector" />

  <g data-order="4">
    <rect id="patch-promote-box" x="32" y="610" width="896" height="106" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <text x="52" y="646" font-size="21" font-weight="600" data-card="patch-promote-box">4. Promote 1.0.2 only with the release owner's approval</text>
    <text x="52" y="676" font-size="17" data-card="patch-promote-box">The owner reviews package changes, canary results, and regional status in the protected Azure Pipelines stage.</text>
    <text x="52" y="703" font-size="17" data-card="patch-promote-box">The build identity can publish a candidate but cannot change the active classroom release.</text>
  </g>
  <text x="32" y="751" font-size="18" font-weight="600">If a run fails or becomes overdue, alert the owner and leave 1.0.1 active.</text>
</svg>
