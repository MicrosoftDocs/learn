<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="773" viewBox="0 0 960 773" role="img" aria-labelledby="patch-title patch-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="patch-title">How a patched image becomes the classroom release</title>
  <desc id="patch-desc">Select approved Ubuntu updates and pin their inputs. Stop if nothing changed; an unavailable feed is a failure. Build a new candidate, 1.0.2, and record its source and package versions. Verify the installed packages and application before publishing. After replication, reboot one disposable VM per region and try the lesson as a learner. The build identity cannot promote the release. Only the release owner's approval changes the active version from 1.0.1 to 1.0.2; failed or overdue runs leave it unchanged.</desc>
  <metadata>Azure icons are embedded from C:\Azure-Icons. Each symbol records its source file.</metadata>
  <defs>
    <symbol id="patch-inputs" data-source="general/10845-icon-service-Versions.svg" viewBox="0 0 18 18"><defs><linearGradient id="patch-inputs-e5eb8d49-f596-43cc-8882-1dde4f1785ce" x1="7.849" y1="12.323" x2="7.849" y2="4.229" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.502" stop-color="#4093e6" /><stop offset="0.775" stop-color="#5ea0ef" /></linearGradient><linearGradient id="patch-inputs-b27ee86e-b59d-4418-8747-06a34580fa30" x1="10.151" y1="16.69" x2="10.151" y2="8.595" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32bedd" /><stop offset="0.175" stop-color="#32caea" /><stop offset="0.41" stop-color="#32d2f2" /><stop offset="0.775" stop-color="#32d4f5" /></linearGradient></defs><g id="patch-inputs-bc5e6cd2-d956-42f3-a793-ab65f89250a4"><g><path d="M1,4.229H14.7a0,0,0,0,1,0,0v7.637a.458.458,0,0,1-.458.458H1.458A.458.458,0,0,1,1,11.866V4.229A0,0,0,0,1,1,4.229Z" fill="url(#patch-inputs-e5eb8d49-f596-43cc-8882-1dde4f1785ce)" /><path d="M1.46,1.31H14.237a.458.458,0,0,1,.458.458V4.229a0,0,0,0,1,0,0H1a0,0,0,0,1,0,0V1.768A.458.458,0,0,1,1.46,1.31Z" fill="#0078d4" /><path d="M3.3,8.6H17a0,0,0,0,1,0,0v7.637a.458.458,0,0,1-.458.458H3.76a.458.458,0,0,1-.458-.458V8.6A0,0,0,0,1,3.3,8.6Z" fill="url(#patch-inputs-b27ee86e-b59d-4418-8747-06a34580fa30)" /><path d="M3.763,5.677H16.54A.458.458,0,0,1,17,6.134V8.6a0,0,0,0,1,0,0H3.3a0,0,0,0,1,0,0V6.134A.458.458,0,0,1,3.763,5.677Z" fill="#198ab3" /></g></g></symbol>
