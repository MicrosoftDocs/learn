    <marker id="failure-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#40566f" /></marker>
  </defs>
  <rect width="960" height="428" fill="#ffffff" data-kind="background" />
  <text x="32" y="45" font-size="29" font-weight="600">Can a failed run leave a gallery version?</text>
  <text x="32" y="77" font-size="18">The template's continueDistributeOnFailure setting controls publication, not the test result.</text>
  <g data-order="1">
    <rect id="failure-test-box" x="32" y="102" width="896" height="84" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#failure-diagnostics" x="52" y="124" width="39" height="39" aria-hidden="true" />
    <text x="109" y="136" font-size="21" font-weight="600" data-card="failure-test-box">1. The validator finds a mismatch</text>
    <text x="109" y="165" font-size="18" data-card="failure-test-box">Expected marker: 4.7.2. Actual marker: 0.0.0. The run ends in Failed.</text>
  </g>
  <g fill="none" stroke="#40566f" stroke-width="2">
    <path d="M480 186 V209" data-kind="connector" />
    <path d="M480 209 H247 V232" marker-end="url(#failure-arrow)" data-kind="connector" />
    <path d="M480 209 H713 V232" marker-end="url(#failure-arrow)" data-kind="connector" />
  </g>
  <g data-order="2">
    <rect id="failure-block-box" x="32" y="242" width="431" height="111" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#failure-gallery" x="51" y="258" width="30" height="30" aria-hidden="true" />
    <text x="94" y="283" font-size="20" font-weight="600" data-card="failure-block-box">2a. false: block publication</text>
    <text x="52" y="311" font-size="17" data-card="failure-block-box">No version is published by this run.</text>
    <text x="52" y="338" font-size="17" data-card="failure-block-box">Confirm the requested gallery ID is absent.</text>
  </g>
  <g data-order="3">
    <rect id="failure-allow-box" x="497" y="242" width="431" height="111" rx="10" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <use href="#failure-gallery" x="516" y="258" width="30" height="30" aria-hidden="true" />
    <text x="559" y="283" font-size="20" font-weight="600" data-card="failure-allow-box">2b. true: allow publication</text>
    <text x="517" y="311" font-size="17" data-card="failure-allow-box">A version can appear in the gallery even</text>
    <text x="517" y="338" font-size="17" data-card="failure-allow-box">though its application failed the check.</text>
  </g>
  <text x="32" y="398" font-size="18" font-weight="600">Reject the candidate in both cases. The presence of a gallery version is not a pass.</text>
</svg>
