<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-labelledby="failure-title failure-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="failure-title">Can a failed run leave a gallery version?</title>
  <desc id="failure-desc">The validator expected application marker 4.7.2 and read 0.0.0. The run fails in both branches. With continueDistributeOnFailure set to false, publication stops. With true, a gallery version can be published despite the failure. Neither branch qualifies the image for approval.</desc>
  <metadata>Azure service icons are embedded from C:\Azure-Icons. Each symbol records its source file.</metadata>
