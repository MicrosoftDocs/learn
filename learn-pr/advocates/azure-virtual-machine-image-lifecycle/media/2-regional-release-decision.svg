<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="422" viewBox="0 0 960 422" role="img" aria-labelledby="region-title region-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="region-title">A two-region release needs two ready copies</title>
  <desc id="region-desc">Illustrative status for gallery image version 1.0.1. East US is completed at 100 percent. West US 2 is in progress at 62 percent. Hold the two-region release; version creation alone does not establish regional readiness.</desc>
  <metadata>Icon from C:\Azure-Icons; the relative source file is recorded on the embedded symbol.</metadata>
  <defs>
    <symbol id="region-version" viewBox="0 0 18 18" data-source="compute/10038-icon-service-Image-Versions.svg"><defs><linearGradient id="region-version-f1f6faa7-ad54-4b4c-a870-89c001f694fd" x1="8.07" y1="17.35" x2="8.07" y2="2.34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32bedd" /><stop offset="0.3" stop-color="#36c3e1" /><stop offset="0.67" stop-color="#41d2ee" /><stop offset="1" stop-color="#50e6ff" /></linearGradient></defs><g><rect x="0.32" y="0.65" width="12" height="15.01" rx="0.5" fill="#0078d4" /><rect x="2.07" y="2.34" width="12" height="15.01" rx="0.5" fill="url(#region-version-f1f6faa7-ad54-4b4c-a870-89c001f694fd)" /><path d="M17.64,12.79,14.77,9.93a.14.14,0,0,0-.25.1V11.7c-3.45,0-6.9,1.84-6.9,5.17.49-.74,3-2.71,6.9-2.71v1.6a.15.15,0,0,0,.25.11L17.64,13A.17.17,0,0,0,17.64,12.79Z" fill="#773adc" /><g><polygon points="11.57 6.82 11.57 10.89 8.07 12.94 8.07 8.86 11.57 6.82" fill="#50e6ff" /><polygon points="11.57 6.82 8.07 8.87 4.57 6.82 8.07 4.77 11.57 6.82" fill="#c3f1ff" /><polygon points="8.07 8.87 8.07 12.94 4.57 10.89 4.57 6.82 8.07 8.87" fill="#9cebff" /><polygon points="4.57 10.89 8.07 8.86 8.07 12.94 4.57 10.89" fill="#c3f1ff" /><polygon points="11.57 10.89 8.07 8.86 8.07 12.94 11.57 10.89" fill="#9cebff" /></g></g></symbol>
  </defs>
  <rect width="960" height="422" fill="#ffffff" data-kind="background" />
  <text x="32" y="44" font-size="29" font-weight="600">A two-region release needs two ready copies</text>
  <text x="32" y="76" font-size="18">Example: gallery version 1.0.1 exists. The release promises East US and West US 2.</text>
  <g data-order="1">
    <rect id="region-status-box" x="32" y="102" width="896" height="180" rx="12" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use x="52" y="117" width="31" height="31" href="#region-version" aria-hidden="true" />
    <text x="96" y="141" font-size="21" font-weight="600" data-card="region-status-box">1. Read the replication status for each required region</text>
    <text x="57" y="192" font-size="19" font-weight="600" data-card="region-status-box">East US</text>
    <rect x="242" y="174" width="420" height="19" rx="5" fill="#187358" data-kind="bar" />
    <text x="693" y="192" font-size="18" data-card="region-status-box">100%  |  Completed</text>
    <text x="57" y="251" font-size="19" font-weight="600" data-card="region-status-box">West US 2</text>
    <rect x="242" y="233" width="420" height="19" rx="5" fill="#d8e1e9" data-kind="bar" />
    <rect x="242" y="233" width="260.4" height="19" rx="5" fill="#9b650b" data-kind="bar" />
    <text x="693" y="251" font-size="18" data-card="region-status-box">62%  |  In progress</text>
  </g>
  <g data-order="2">
    <rect id="region-hold-box" x="32" y="309" width="896" height="87" rx="12" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <text x="54" y="344" font-size="21" font-weight="600" data-card="region-hold-box">2. Hold the two-region release</text>
    <text x="54" y="375" font-size="18" data-card="region-hold-box">The ready copy in East US cannot satisfy the promise to deploy in West US 2.</text>
  </g>
