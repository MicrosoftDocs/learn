<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" aria-labelledby="withdraw-title withdraw-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="withdraw-title">One withdrawal, three different effects</title>
  <desc id="withdraw-desc">A protected release record marks version 1.0.1 withdrawn. For new requests, refuse deployment. For existing VMs, change nothing automatically. For recovery, retain the image until a replacement or rebuild is verified.</desc>
  <metadata>Icons from C:\Azure-Icons; the relative source file is recorded on each embedded symbol.</metadata>
  <defs>
    <symbol id="withdraw-vm" viewBox="0 0 18 18" data-source="compute/10021-icon-service-Virtual-Machine.svg"><defs><linearGradient id="withdraw-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="withdraw-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#withdraw-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#withdraw-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></symbol>
    <symbol id="withdraw-version" viewBox="0 0 18 18" data-source="compute/10038-icon-service-Image-Versions.svg"><defs><linearGradient id="withdraw-version-f1f6faa7-ad54-4b4c-a870-89c001f694fd" x1="8.07" y1="17.35" x2="8.07" y2="2.34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32bedd" /><stop offset="0.3" stop-color="#36c3e1" /><stop offset="0.67" stop-color="#41d2ee" /><stop offset="1" stop-color="#50e6ff" /></linearGradient></defs><g><rect x="0.32" y="0.65" width="12" height="15.01" rx="0.5" fill="#0078d4" /><rect x="2.07" y="2.34" width="12" height="15.01" rx="0.5" fill="url(#withdraw-version-f1f6faa7-ad54-4b4c-a870-89c001f694fd)" /><path d="M17.64,12.79,14.77,9.93a.14.14,0,0,0-.25.1V11.7c-3.45,0-6.9,1.84-6.9,5.17.49-.74,3-2.71,6.9-2.71v1.6a.15.15,0,0,0,.25.11L17.64,13A.17.17,0,0,0,17.64,12.79Z" fill="#773adc" /><g><polygon points="11.57 6.82 11.57 10.89 8.07 12.94 8.07 8.86 11.57 6.82" fill="#50e6ff" /><polygon points="11.57 6.82 8.07 8.87 4.57 6.82 8.07 4.77 11.57 6.82" fill="#c3f1ff" /><polygon points="8.07 8.87 8.07 12.94 4.57 10.89 4.57 6.82 8.07 8.87" fill="#9cebff" /><polygon points="4.57 10.89 8.07 8.86 8.07 12.94 4.57 10.89" fill="#c3f1ff" /><polygon points="11.57 10.89 8.07 8.86 8.07 12.94 11.57 10.89" fill="#9cebff" /></g></g></symbol>
    <marker id="withdraw-arrow" viewBox="0 0 9 10" markerWidth="9" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 5L0 10Z" fill="#40566f" /></marker>
  </defs>
  <rect width="960" height="495" fill="#ffffff" data-kind="background" />
  <text x="32" y="44" font-size="29" font-weight="600">One withdrawal, three different effects</text>
  <text x="32" y="76" font-size="18">Withdrawing a release changes what the workflow can deploy next.</text>
  <g data-order="1">
    <rect id="withdraw-record-box" x="32" y="102" width="896" height="67" rx="12" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <text x="54" y="144" font-size="21" font-weight="600" data-card="withdraw-record-box">Owner records version 1.0.1 as Withdrawn in the protected release record.</text>
  </g>
  <g fill="none" stroke="#40566f" stroke-width="2">
    <path d="M62 169V425" data-kind="connector" />
    <path d="M62 229H112" marker-end="url(#withdraw-arrow)" data-kind="connector" />
    <path d="M62 327H112" marker-end="url(#withdraw-arrow)" data-kind="connector" />
    <path d="M62 425H112" marker-end="url(#withdraw-arrow)" data-kind="connector" />
  </g>
  <g data-order="2">
    <rect id="withdraw-new-box" x="122" y="192" width="806" height="75" rx="9" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <use x="142" y="212" width="33" height="33" href="#withdraw-vm" aria-hidden="true" />
    <text x="198" y="222" font-size="20" font-weight="600" data-card="withdraw-new-box">A. New VM request: refuse</text>
    <text x="198" y="249" font-size="17" data-card="withdraw-new-box">The workflow stops before asking Azure to create a VM from this version.</text>
  </g>
  <g data-order="3">
    <rect id="withdraw-running-box" x="122" y="290" width="806" height="75" rx="9" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use x="142" y="310" width="33" height="33" href="#withdraw-vm" aria-hidden="true" />
    <text x="198" y="320" font-size="20" font-weight="600" data-card="withdraw-running-box">B. Existing VM: no automatic change</text>
    <text x="198" y="347" font-size="17" data-card="withdraw-running-box">Its disk stays as it was. Patching or replacement is a separate decision.</text>
  </g>
  <g data-order="4">
    <rect id="withdraw-recovery-box" x="122" y="388" width="806" height="75" rx="9" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use x="142" y="408" width="33" height="33" href="#withdraw-version" aria-hidden="true" />
    <text x="198" y="418" font-size="20" font-weight="600" data-card="withdraw-recovery-box">C. Recovery image: retain</text>
    <text x="198" y="445" font-size="17" data-card="withdraw-recovery-box">Review dependencies and prove a replacement or rebuild before deletion.</text>
  </g>
</svg>
