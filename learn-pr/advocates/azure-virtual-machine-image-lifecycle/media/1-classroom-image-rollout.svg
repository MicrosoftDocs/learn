<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="726" viewBox="0 0 960 726" role="img" aria-labelledby="rollout-title rollout-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="rollout-title">Contoso's weekly Ubuntu classroom rollout</title>
  <desc id="rollout-desc">Contoso rejects a patched build that fails its application check. It publishes corrected gallery image 1.0.1 with application 4.7.2. East US is ready first, but the owner waits for West US 2 before approving 24 learner VMs per region. The team verifies each VM's source and the learner's command output. At course end it blocks new deployments and retains the image for recovery.</desc>
  <metadata>Azure service icons are embedded from C:\Azure-Icons. Each symbol records its source file.</metadata>
