  <rect width="960" height="726" fill="#ffffff" data-kind="background" />
  <text x="32" y="43" font-size="29" font-weight="600">Contoso's weekly Ubuntu classroom rollout</text>
  <text x="32" y="76" font-size="18">48 learners get a dedicated VM to practice Linux administration away from production systems.</text>

  <g data-order="1">
    <rect id="rollout-reject-box" x="32" y="99" width="410" height="105" rx="10" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <use href="#rollout-template" x="50" y="113" width="32" height="32" aria-hidden="true" />
    <text x="96" y="138" font-size="20" font-weight="600" data-card="rollout-reject-box">1. Reject the failed build</text>
    <text x="51" y="168" font-size="17" data-card="rollout-reject-box">Apply Ubuntu security fixes. The first build fails</text>
    <text x="51" y="193" font-size="17" data-card="rollout-reject-box">its application check, so it stays out of class.</text>
  </g>
  <path d="M449 151H508" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#rollout-arrow)" data-kind="connector" />
  <g data-order="2">
    <rect id="rollout-publish-box" x="518" y="99" width="410" height="105" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#rollout-gallery" x="536" y="113" width="32" height="32" aria-hidden="true" />
    <text x="581" y="138" font-size="20" font-weight="600" data-card="rollout-publish-box">2. Publish the corrected image</text>
    <text x="537" y="168" font-size="17" data-card="rollout-publish-box">Gallery image 1.0.1 includes vmops-release 4.7.2</text>
    <text x="537" y="193" font-size="17" data-card="rollout-publish-box">with mode=training. No per-VM install is needed.</text>
  </g>
  <path d="M723 207V228" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#rollout-arrow)" data-kind="connector" />
  <g data-order="3">
    <rect id="rollout-approve-box" x="32" y="237" width="896" height="76" rx="10" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <text x="52" y="268" font-size="21" font-weight="600" data-card="rollout-approve-box">3. Wait for both regions before approving the release</text>
    <text x="52" y="296" font-size="17" data-card="rollout-approve-box">East US is ready first. The release owner waits for the West US 2 copy before authorizing deployment.</text>
  </g>
  <g fill="none" stroke="#40566f" stroke-width="2">
    <path d="M480 316V332" data-kind="connector" />
    <path d="M480 332H237V348" marker-end="url(#rollout-arrow)" data-kind="connector" />
    <path d="M480 332H723V348" marker-end="url(#rollout-arrow)" data-kind="connector" />
  </g>
  <g data-order="4">
    <rect id="rollout-east-box" x="32" y="358" width="410" height="84" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use href="#rollout-vm" x="51" y="378" width="42" height="42" aria-hidden="true" />
    <text x="110" y="389" font-size="19" font-weight="600" data-card="rollout-east-box">4a. East US classroom</text>
    <text x="110" y="422" font-size="22" font-weight="600" data-card="rollout-east-box">24 learner VMs</text>
  </g>
  <g data-order="5">
    <rect id="rollout-west-box" x="518" y="358" width="410" height="84" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use href="#rollout-vm" x="537" y="378" width="42" height="42" aria-hidden="true" />
    <text x="596" y="389" font-size="19" font-weight="600" data-card="rollout-west-box">4b. West US 2 classroom</text>
    <text x="596" y="422" font-size="22" font-weight="600" data-card="rollout-west-box">24 learner VMs</text>
  </g>
  <g fill="none" stroke="#40566f" stroke-width="2">
    <path d="M237 445V461H480" data-kind="connector" />
    <path d="M723 445V461H480" data-kind="connector" />
    <path d="M480 461V477" marker-end="url(#rollout-arrow)" data-kind="connector" />
  </g>
  <g data-order="6">
    <rect id="rollout-verify-box" x="32" y="487" width="896" height="105" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#rollout-diagnostics" x="52" y="518" width="41" height="41" aria-hidden="true" />
    <text x="110" y="521" font-size="20" font-weight="600" data-card="rollout-verify-box">5. Prove what each learner received</text>
    <text x="110" y="551" font-size="17" data-card="rollout-verify-box">Image source: match the VM's full image reference to gallery version 1.0.1.</text>
    <text x="110" y="578" font-size="17" data-card="rollout-verify-box">Application: run vmops-release as a learner and expect VmOpsRelease:4.7.2.</text>
  </g>
