    <symbol id="consumer-vm" viewBox="0 0 18 18" data-source="compute/10021-icon-service-Virtual-Machine.svg"><defs><linearGradient id="consumer-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="consumer-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#consumer-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#consumer-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></symbol>
    <symbol id="consumer-ssh" viewBox="0 0 18 18" data-source="other/00412-icon-service-SSH-Keys.svg"><defs><linearGradient id="consumer-ssh-eafc57a1-d419-432d-b0ed-435130422d7a" x1="9" y1="13.704" x2="9" y2="1.277" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.817" stop-color="#5ea0ef" /></linearGradient><linearGradient id="consumer-ssh-a5a126a8-9900-4198-8d5d-2409233cbc74" x1="8.999" y1="16.723" x2="8.999" y2="4.174" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32bedd" /><stop offset="0.113" stop-color="#3ccce9" /><stop offset="0.292" stop-color="#47dbf5" /><stop offset="0.504" stop-color="#4ee3fd" /><stop offset="0.834" stop-color="#50e6ff" /></linearGradient></defs><g id="consumer-ssh-ae919516-4173-4e1b-b256-974218cbe15b"><g><path d="M17.767,9.812a3.941,3.941,0,0,0-3.419-3.787A4.965,4.965,0,0,0,9.234,1.277,5.094,5.094,0,0,0,4.366,4.6,4.7,4.7,0,0,0,.233,9.12,4.771,4.771,0,0,0,5.17,13.7c.147,0,.292-.007.435-.018H13.6a.822.822,0,0,0,.211-.032A3.987,3.987,0,0,0,17.767,9.812Z" fill="url(#consumer-ssh-eafc57a1-d419-432d-b0ed-435130422d7a)" /><path id="consumer-ssh-edcc7516-234e-4bfe-ace6-d3c29e9e8ef2" d="M12.5,9.127a1.446,1.446,0,0,0,0-2.041h0L10.017,4.6a1.437,1.437,0,0,0-2.036,0h0L5.5,7.086a1.446,1.446,0,0,0,0,2.041L7.565,11.2a.4.4,0,0,1,.118.286v3.85a.492.492,0,0,0,.144.348l.941.944a.325.325,0,0,0,.461,0l.913-.915V15.7l.538-.538a.188.188,0,0,0,0-.266l-.387-.389a.205.205,0,0,1,0-.29l.387-.389a.187.187,0,0,0,0-.266l-.387-.389a.205.205,0,0,1,0-.29l.388-.389a.189.189,0,0,0,0-.266l-.539-.541v-.2ZM9,5.2a.82.82,0,1,1-.817.819A.817.817,0,0,1,9,5.2Z" fill="url(#consumer-ssh-a5a126a8-9900-4198-8d5d-2409233cbc74)" /><path id="consumer-ssh-ba4c21bb-4a83-40a1-8204-81b9b545866c" d="M8.353,15.418h0a.176.176,0,0,0,.3-.134V12.168a.186.186,0,0,0-.081-.154h0a.176.176,0,0,0-.272.154v3.116A.186.186,0,0,0,8.353,15.418Z" fill="#0078d4" opacity="0.75" /><path id="consumer-ssh-b1b257e5-26b0-4209-80fd-7809752c5ce2" d="M7.23,7.916h3.642