  <rect width="960" height="419" fill="#ffffff" data-kind="background" />
  <text x="32" y="45" font-size="29" font-weight="600">The application passes. Is this the approved image?</text>
  <text x="32" y="77" font-size="18">Example: the manifest approves gallery version 1.0.1 containing application version 4.7.2.</text>
  <g data-order="1">
    <rect id="consumer-origin-box" x="32" y="111" width="280" height="182" rx="10" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <use href="#consumer-vm" x="49" y="128" width="28" height="28" aria-hidden="true" />
    <text x="89" y="152" font-size="19" font-weight="600" data-card="consumer-origin-box">1. Azure VM model</text>
    <text x="50" y="192" font-size="17" data-card="consumer-origin-box">The image ID ends in</text>
    <text x="50" y="221" font-size="18" font-family="Consolas, monospace" data-card="consumer-origin-box">/versions/1.0.2</text>
    <text x="50" y="267" font-size="18" font-weight="600" data-card="consumer-origin-box">Origin: wrong version</text>
  </g>
  <g data-order="2">
    <rect id="consumer-run-box" x="337" y="111" width="286" height="182" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <g aria-hidden="true" fill="none" stroke="#39715a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" data-kind="glyph">
      <rect x="355" y="130" width="29" height="23" rx="3" />
      <path d="M360 137L365 141.5L360 146M369 146H378" />
    </g>
    <text x="397" y="152" font-size="19" font-weight="600" data-card="consumer-run-box">2. Run Command</text>
    <text x="355" y="192" font-size="17" data-card="consumer-run-box">Succeeded, exit code 0</text>
    <text x="355" y="221" font-size="18" font-family="Consolas, monospace" data-card="consumer-run-box">CONTRACT_PASS</text>
    <text x="355" y="267" font-size="18" font-weight="600" data-card="consumer-run-box">Guest checks: passed</text>
  </g>
  <g data-order="3">
    <rect id="consumer-access-box" x="648" y="111" width="280" height="182" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use href="#consumer-ssh" x="665" y="128" width="28" height="28" aria-hidden="true" />
    <text x="705" y="152" font-size="19" font-weight="600" data-card="consumer-access-box">3. Private SSH</text>
    <text x="666" y="192" font-size="17" data-card="consumer-access-box">The intended user sees</text>
    <text x="666" y="221" font-size="18" font-family="Consolas, monospace" data-card="consumer-access-box">VmOpsRelease:4.7.2</text>
    <text x="666" y="267" font-size="18" font-weight="600" data-card="consumer-access-box">User access: works</text>
  </g>
  <g data-order="4">
    <rect id="consumer-decision-box" x="32" y="321" width="896" height="73" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <text x="52" y="351" font-size="21" font-weight="600" data-card="consumer-decision-box">Decision: stop new deployments.</text>
    <text x="52" y="378" font-size="17" data-card="consumer-decision-box">Two images can contain the same application. Only the VM's image reference tells you which one Azure used.</text>
  </g>
</svg>
