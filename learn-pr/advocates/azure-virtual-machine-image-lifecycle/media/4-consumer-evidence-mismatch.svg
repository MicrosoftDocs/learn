<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="419" viewBox="0 0 960 419" role="img" aria-labelledby="consumer-title consumer-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="consumer-title">The application passes. Is this the approved image?</title>
  <desc id="consumer-desc">Read the three evidence cards from left to right. The manifest approved gallery version 1.0.1, but the VM's image ID ends in 1.0.2. Run Command succeeds and the intended SSH user sees the right application response. Neither guest check overrides the image ID mismatch.</desc>
  <metadata>Azure service icons are embedded from C:\Azure-Icons. Each symbol records its source file.</metadata>
