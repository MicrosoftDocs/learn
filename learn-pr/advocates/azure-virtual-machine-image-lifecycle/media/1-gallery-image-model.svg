<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" aria-labelledby="model-title model-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="model-title">Where the image ends and the VM begins</title>
  <desc id="model-desc">Read from left to right. A gallery contains an image definition and a numbered image version. Azure uses that version to create a disk for a VM outside the gallery. Later versions do not update that disk.</desc>
  <metadata>Icons from C:\Azure-Icons; the relative source file is recorded on each embedded symbol.</metadata>
