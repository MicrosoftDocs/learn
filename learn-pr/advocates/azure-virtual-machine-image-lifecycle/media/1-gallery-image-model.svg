  <rect width="960" height="382" fill="#ffffff" data-kind="background" />
  <text x="32" y="44" font-size="29" font-weight="600">Where the image ends and the VM begins</text>
  <text x="32" y="76" font-size="18">A gallery holds reusable images. A running VM owns its disks.</text>

  <g data-order="1">
    <rect id="model-family-box" x="32" y="108" width="584" height="212" rx="12" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use x="50" y="120" width="33" height="33" href="#model-gallery" aria-hidden="true" />
    <text x="98" y="146" font-size="21" font-weight="600" data-card="model-family-box">1. Azure Compute Gallery</text>
  </g>
  <g data-order="2">
    <rect id="model-definition-box" x="50" y="168" width="234" height="132" rx="9" fill="#ffffff" stroke="#5085a8" stroke-width="2" />
    <use x="65" y="183" width="29" height="29" href="#model-definition" aria-hidden="true" />
    <text x="106" y="207" font-size="19" font-weight="600" data-card="model-definition-box">2. Definition</text>
    <text x="66" y="244" font-size="18" data-card="model-definition-box">Ubuntu 22.04, x64, V1</text>
    <text x="66" y="273" font-size="17" data-card="model-definition-box">Groups compatible images.</text>
  </g>
  <path d="M292 235H335" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#model-arrow)" data-kind="connector" />
  <g data-order="3">
    <rect id="model-version-box" x="344" y="168" width="254" height="132" rx="9" fill="#ffffff" stroke="#5085a8" stroke-width="2" />
    <use x="359" y="183" width="29" height="29" href="#model-version" aria-hidden="true" />
    <text x="400" y="207" font-size="19" font-weight="600" data-card="model-version-box">3. Image version</text>
    <text x="360" y="244" font-size="18" data-card="model-version-box">Gallery version 1.0.1</text>
    <text x="360" y="273" font-size="17" data-card="model-version-box">Contains application 4.7.2.</text>
  </g>
  <path d="M616 235H670" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#model-arrow)" data-kind="connector" />
  <g data-order="4">
    <rect id="model-vm-box" x="680" y="168" width="248" height="132" rx="9" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use x="695" y="183" width="29" height="29" href="#model-vm" aria-hidden="true" />
    <text x="736" y="207" font-size="19" font-weight="600" data-card="model-vm-box">4. Consumer VM</text>
    <text x="696" y="244" font-size="18" data-card="model-vm-box">Gets a new OS disk</text>
    <text x="696" y="273" font-size="17" data-card="model-vm-box">from version 1.0.1.</text>
  </g>
  <text x="32" y="358" font-size="18">Publishing version 1.0.2 changes the gallery, not the disk already attached to the VM.</text>
</svg>
