  <rect width="960" height="636" fill="#ffffff" data-kind="background" />
  <text x="32" y="44" font-size="29" font-weight="600">Where can Contoso deploy gallery image 1.0.1?</text>
  <text x="32" y="77" font-size="18">A regional copy makes the image available. Permissions determine who can use it.</text>

  <g data-order="1">
    <text x="32" y="125" font-size="21" font-weight="600">1. Region: is a copy ready where the VM will run?</text>
    <rect id="scopes-east-box" x="32" y="145" width="431" height="81" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use href="#scopes-location" x="50" y="164" width="31" height="34" aria-hidden="true" />
    <text x="95" y="178" font-size="19" font-weight="600" data-card="scopes-east-box">East US: ready</text>
    <text x="95" y="207" font-size="17" data-card="scopes-east-box">This copy can serve VMs in East US.</text>
    <rect id="scopes-west-box" x="497" y="145" width="431" height="81" rx="10" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <use href="#scopes-location" x="515" y="164" width="31" height="34" aria-hidden="true" />
    <text x="560" y="178" font-size="19" font-weight="600" data-card="scopes-west-box">West US 2: still replicating</text>
    <text x="560" y="207" font-size="17" data-card="scopes-west-box">VMs here must wait for their local copy.</text>
  </g>

  <g data-order="2">
    <text x="32" y="271" font-size="21" font-weight="600">2. Resource group and subscription: who can read and who can create?</text>
    <rect id="scopes-source-box" x="32" y="291" width="276" height="122" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#scopes-gallery" x="48" y="306" width="30" height="30" aria-hidden="true" />
    <text x="91" y="330" font-size="18" font-weight="600" data-card="scopes-source-box">Source subscription</text>
    <text x="49" y="362" font-size="17" data-card="scopes-source-box">Gallery resource group</text>
    <text x="49" y="391" font-size="17" data-card="scopes-source-box">Read image version 1.0.1.</text>
    <path d="M349 351H318" stroke="#40566f" stroke-width="2" fill="none" marker-end="url(#scopes-arrow)" data-kind="connector" />
    <rect id="scopes-caller-box" x="357" y="291" width="246" height="122" rx="10" fill="#ffffff" stroke="#40566f" stroke-width="2" />
    <use href="#scopes-identity" x="373" y="306" width="30" height="30" aria-hidden="true" />
    <text x="415" y="330" font-size="18" font-weight="600" data-card="scopes-caller-box">Deployment identity</text>
    <text x="374" y="362" font-size="17" data-card="scopes-caller-box">Uses the version's full ID.</text>
    <text x="374" y="391" font-size="17" data-card="scopes-caller-box">No second gallery needed.</text>
    <path d="M611 351H642" stroke="#40566f" stroke-width="2" fill="none" marker-end="url(#scopes-arrow)" data-kind="connector" />
    <rect id="scopes-target-box" x="652" y="291" width="276" height="122" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#scopes-vm" x="668" y="306" width="30" height="30" aria-hidden="true" />
    <text x="710" y="330" font-size="18" font-weight="600" data-card="scopes-target-box">Destination subscription</text>
    <text x="669" y="362" font-size="17" data-card="scopes-target-box">Classroom resource group</text>
    <text x="669" y="391" font-size="17" data-card="scopes-target-box">Create the VM and its resources.</text>
  </g>

  <g data-order="3">
    <text x="32" y="458" font-size="21" font-weight="600">3. Management group: which rules do the subscriptions inherit?</text>
    <rect id="scopes-parent-box" x="32" y="478" width="326" height="103" rx="10" fill="#f4f4fa" stroke="#756b95" stroke-width="2" />
    <use href="#scopes-management" x="49" y="493" width="32" height="32" aria-hidden="true" />
