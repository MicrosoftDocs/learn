<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="636" viewBox="0 0 960 636" role="img" aria-labelledby="scopes-title scopes-desc" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="scopes-title">Where can Contoso deploy gallery image 1.0.1?</title>
  <desc id="scopes-desc">Read the three numbered panels from top to bottom. A VM requires a ready image copy in its own region. Across subscriptions, one deployment identity reads the source gallery version and creates the VM in the destination resource group. Child subscriptions can inherit roles and policies from a management group. Membership alone neither grants access nor replicates an image, and a management group is not a VM deployment location.</desc>
  <metadata>Azure icons are embedded from C:\Azure-Icons. Each symbol records its source file.</metadata>
