<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="builder-title builder-description" font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
  <title id="builder-title">Azure VM Image Builder: from recipe to gallery version</title>
  <desc id="builder-description">With autoRun disabled and no automatic build trigger, registering a template does not start a build. A separate run creates a temporary Ubuntu VM, installs vmops-release 4.7.2, and captures a generalized image. A validator tests that image. Contoso blocks publication on failure. On success, the service publishes gallery version 1.0.1 for replication to East US and West US 2. Release approval is separate.</desc>
  <metadata>Azure icons from C:\Azure-Icons are embedded in the symbols below; data-source records the relative path of each original.</metadata>
  <defs>
