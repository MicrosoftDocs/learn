  <rect width="960" height="620" fill="#ffffff" data-kind="background" />
  <text x="32" y="45" font-size="29" font-weight="600">Azure VM Image Builder: from recipe to gallery version</text>
  <text x="32" y="77" font-size="18">With autoRun disabled, registering saves the recipe. Starting a run builds the image.</text>

  <g data-order="1">
    <rect id="builder-recipe-box" x="32" y="102" width="896" height="92" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#builder-template" x="53" y="125" width="42" height="42" aria-hidden="true" />
    <text x="114" y="140" font-size="21" font-weight="600" data-card="builder-recipe-box">1. Register the image template</text>
    <text x="114" y="172" font-size="17" data-card="builder-recipe-box">Pin the Ubuntu 22.04 source, assign a managed identity, and name gallery version 1.0.1 as the output.</text>
  </g>
  <path d="M237 196V237" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#builder-arrow)" data-kind="connector" />
  <text x="257" y="223" font-size="16" font-family="Consolas, monospace">az image builder run</text>

  <g data-order="2">
    <rect id="builder-customize-box" x="32" y="246" width="410" height="144" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#builder-vm" x="51" y="263" width="34" height="34" aria-hidden="true" />
    <text x="100" y="289" font-size="21" font-weight="600" data-card="builder-customize-box">2. Customize and capture</text>
    <text x="51" y="321" font-size="17" data-card="builder-customize-box">On a temporary VM, install vmops-release 4.7.2</text>
    <text x="51" y="348" font-size="17" data-card="builder-customize-box">and set mode=training. Generalize the OS</text>
    <text x="51" y="375" font-size="17" data-card="builder-customize-box">and capture the customized image.</text>
  </g>
  <path d="M449 318H507" fill="none" stroke="#40566f" stroke-width="2" marker-end="url(#builder-arrow)" data-kind="connector" />
  <g data-order="3">
    <rect id="builder-validate-box" x="518" y="246" width="410" height="144" rx="10" fill="#f2f8fd" stroke="#5085a8" stroke-width="2" />
    <use href="#builder-check" x="537" y="263" width="34" height="34" aria-hidden="true" />
    <text x="586" y="289" font-size="21" font-weight="600" data-card="builder-validate-box">3. Test the captured image</text>
    <text x="537" y="321" font-size="17" data-card="builder-validate-box">Boot a validation VM from the captured image.</text>
    <text x="537" y="348" font-size="17" data-card="builder-validate-box">Run the tool and require this response:</text>
    <text x="537" y="375" font-size="17" font-family="Consolas, monospace" data-card="builder-validate-box">VmOpsRelease:4.7.2</text>
  </g>
  <g fill="none" stroke="#40566f" stroke-width="2">
    <path d="M723 392V420" data-kind="connector" />
    <path d="M723 420H237V449" marker-end="url(#builder-arrow)" data-kind="connector" />
    <path d="M723 420V449" marker-end="url(#builder-arrow)" data-kind="connector" />
  </g>

  <g data-order="4">
    <rect id="builder-reject-box" x="32" y="458" width="410" height="109" rx="10" fill="#fff6df" stroke="#9b650b" stroke-width="2" />
    <text x="51" y="493" font-size="20" font-weight="600" data-card="builder-reject-box">4a. Fail: stop publication</text>
    <text x="51" y="523" font-size="17" data-card="builder-reject-box">Contoso blocks distribution on validation failure.</text>
    <text x="51" y="550" font-size="17" data-card="builder-reject-box">Keep the run record and validator log.</text>
  </g>
  <g data-order="5">
    <rect id="builder-publish-box" x="518" y="458" width="410" height="109" rx="10" fill="#f0f8f4" stroke="#39715a" stroke-width="2" />
    <use href="#builder-gallery" x="537" y="473" width="30" height="30" aria-hidden="true" />
    <text x="580" y="496" font-size="20" font-weight="600" data-card="builder-publish-box">4b. Pass: publish to the gallery</text>
    <text x="537" y="526" font-size="17" data-card="builder-publish-box">Publish image version 1.0.1 and request copies</text>
    <text x="537" y="553" font-size="17" data-card="builder-publish-box">in East US and West US 2.</text>
  </g>
  <text x="32" y="603" font-size="18" font-weight="600">Before deploying classroom VMs, verify both regional copies and obtain release approval.</text>
</svg>
