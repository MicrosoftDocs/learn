    <symbol id="builder-gallery" data-source="compute/02864-icon-service-Azure-Compute-Galleries.svg" viewBox="0 0 18 18"><defs><linearGradient id="builder-gallery-b9a9ff0b-7dac-405b-a6dd-a489a2813f83" x1="8.898" y1="16.345" x2="8.898" y2="1.887" gradientUnits="userSpaceOnUse"><stop offset="0.001" stop-color="#773adc" /><stop offset="1" stop-color="#a67af4" /></linearGradient></defs><g id="builder-gallery-b489344a-7430-4172-84c3-3a0d8c5a38b5"><g><g><path d="M7.855,2.526H7.247A.431.431,0,0,1,6.816,2.1V.431A.431.431,0,0,1,7.247,0h.608a.43.43,0,0,1,.43.431V2.1A.43.43,0,0,1,7.855,2.526ZM10.979,2.1V.431A.431.431,0,0,0,10.548,0H9.941A.431.431,0,0,0,9.51.431V2.1a.431.431,0,0,0,.431.431h.607A.431.431,0,0,0,10.979,2.1ZM8.285,17.612V16.338A.388.388,0,0,0,7.9,15.95H7.2a.388.388,0,0,0-.388.388v1.274A.388.388,0,0,0,7.2,18H7.9A.388.388,0,0,0,8.285,17.612Zm2.694,0V16.338a.388.388,0,0,0-.388-.388H9.9a.388.388,0,0,0-.388.388v1.274A.388.388,0,0,0,9.9,18h.693A.388.388,0,0,0,10.979,17.612Zm4.8-9.114h1.777A.445.445,0,0,0,18,8.053V7.46a.445.445,0,0,0-.445-.445H15.778a.445.445,0,0,0-.445.445v.593A.445.445,0,0,0,15.778,8.5Zm0,2.719h1.777A.445.445,0,0,0,18,10.772v-.594a.444.444,0,0,0-.445-.444H15.778a.444.444,0,0,0-.445.444v.594A.445.445,0,0,0,15.778,11.217ZM.385,8.5h1.23A.385.385,0,0,0,2,8.113V7.4a.385.385,0,0,0-.385-.385H.385A.385.385,0,0,0,0,7.4v.713A.385.385,0,0,0,.385,8.5Zm0,2.719h1.23A.385.385,0,0,0,2,10.832v-.713a.385.385,0,0,0-.385-.385H.385A.385.385,0,0,0,0,10.119v.713A.385.385,0,0,0,.385,11.217Z" fill="#773adc" /><rect x="1.734" y="1.887" width="14.327" height="14.458" rx="0.88" fill="url(#builder-gallery-b9a9ff0b-7dac-405b-a6dd-a489a2813f83)" /></g><g><polygon points="12.097 7.198 12.097 10.802 9.004 12.612 9.004 9 12.097 7.198" fill="#50e6ff" /><polygon points="12.097 7.198 9.004 9.008 5.903 7.198 9.004 5.388 12.097 7.198" fill="#c3f1ff" /><polygon points="9.004 9.008 9.004 12.612 5.903 10.802 5.903 7.198 9.004 9.008" fill="#9cebff" /><polygon points="5.903 10.802 9.004 9 9.004 