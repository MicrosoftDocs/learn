<svg xmlns="http://www.w3.org/2000/svg" width="960" height="946" viewBox="0 0 960 946" role="img" aria-labelledby="module-overview-title module-overview-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="module-overview-title">How 60 of 200 VMs entered the trial</title>
  <desc id="module-overview-desc">Read the six stages from top to bottom. The 200-VM inventory contains 190 public portal VMs and 10 excluded staff VMs. Correct one failed canary without another write, release 19 pilot VMs, then release two separate production waves of 20. At most five writes run at once and no more than one per pool. Ultimately 60 were restored, 130 were deferred, and 10 were excluded.</desc>
  <metadata>{&quot;iconSource&quot;:&quot;C:\\Azure-Icons&quot;,&quot;icons&quot;:[&quot;management + governance/10318-icon-service-Resource-Graph-Explorer.svg&quot;,&quot;compute/10021-icon-service-Virtual-Machine.svg&quot;,&quot;management + governance/00022-icon-service-Automation-Accounts.svg&quot;,&quot;monitor/00001-icon-service-Monitor.svg&quot;,&quot;management + governance/00007-icon-service-Activity-Log.svg&quot;]}</metadata>
  <defs>
