  <rect data-kind="background" x="0" y="0" width="960" height="946" fill="#ffffff"/>
  <text x="32" y="24" font-size="15" font-weight="650" text-anchor="start">FLEET CHANGE  /  FROM APPROVAL TO RESTORATION</text>
  <text x="32" y="71" font-size="32" font-weight="650" text-anchor="start">How 60 of 200 VMs entered the trial</text>
  <text x="32" y="105" font-size="20" font-weight="400" text-anchor="start">The public portal uses 19 pools of 10. The 10 staff VMs are outside the rollout.</text>
  <rect id="module-overview-stage-1" data-kind="card" x="32" y="132" width="896" height="91" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#module-overview-inventory" x="51" y="156" width="42" height="42"/>
  <text x="111" y="169" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-stage-1">1. Fix the target list and review the preview</text>
  <text x="906" y="169" font-size="15" font-weight="650" text-anchor="end" data-card="module-overview-stage-1">M1 + P1</text>
  <text x="111" y="202" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-stage-1">Confirm 190 portal VM identities and 10 exclusions. Preview B adds only the canary command.</text>
  <path data-kind="connector" d="M480 228 L480 239" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#module-overview-arrow)"/>
  <rect id="module-overview-stage-2" data-kind="card" x="32" y="245" width="896" height="91" rx="9" stroke="#BA9258" stroke-width="1.5" fill="#FFF6E5"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#module-overview-vm" x="51" y="269" width="42" height="42"/>
  <text x="111" y="282" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-stage-2">2. Stop after the canary writes green and exits 42</text>
  <text x="906" y="282" font-size="15" font-weight="650" text-anchor="end" data-card="module-overview-stage-2">A1 + C1 + C2</text>
  <text x="111" y="315" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-stage-2">Only fc-canary changes. Its approved correction at 09:14 leaves it at revision 1.</text>
  <path data-kind="connector" d="M480 341 L480 352" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#module-overview-arrow)"/>
  <rect id="module-overview-stage-3" data-kind="card" x="32" y="358" width="896" height="91" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#module-overview-automation" x="51" y="382" width="42" height="42"/>
  <text x="111" y="395" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-stage-3">3. Release the 19-VM pilot</text>
  <text x="906" y="395" font-size="15" font-weight="650" text-anchor="end" data-card="module-overview-stage-3">A2</text>
  <text x="111" y="428" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-stage-3">One representative per pool. By 09:35, 20 public VMs serve green, including the canary.</text>
  <path data-kind="connector" d="M480 454 L480 465" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#module-overview-arrow)"/>
  <rect id="module-overview-stage-4" data-kind="card" x="32" y="471" width="896" height="91" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#module-overview-automation" x="51" y="495" width="42" height="42"/>
  <text x="111" y="508" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-stage-4">4. Release two production waves of 20</text>
  <text x="906" y="508" font-size="15" font-weight="650" text-anchor="end" data-card="module-overview-stage-4">A3</text>
  <text x="111" y="541" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-stage-4">Approve each separately at 09:40 and 10:00. By 10:20, 60 VMs serve green.</text>
  <path data-kind="connector" d="M480 567 L480 578" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#module-overview-arrow)"/>
  <rect id="module-overview-stage-5" data-kind="card" x="32" y="584" width="896" height="91" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#module-overview-monitor" x="51" y="608" width="42" height="42"/>
  <text x="111" y="621" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-stage-5">5. Repeat on the 60 changed VMs</text>
  <text x="906" y="621" font-size="15" font-weight="650" text-anchor="end" data-card="module-overview-stage-5">R1</text>
  <text x="111" y="654" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-stage-5">By 10:45, all 60 still serve green at revision 1. No repeat produced another write.</text>
  <path data-kind="connector" d="M480 680 L480 691" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#module-overview-arrow)"/>
  <rect id="module-overview-stage-6" data-kind="card" x="32" y="697" width="896" height="91" rx="9" stroke="#A7B3BF" stroke-width="1.5" fill="#F4F6F8"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#module-overview-record" x="51" y="721" width="42" height="42"/>
  <text x="111" y="734" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-stage-6">6. Restore the canary first, then the other 59</text>
  <text x="906" y="734" font-size="15" font-weight="650" text-anchor="end" data-card="module-overview-stage-6">R1</text>
  <text x="111" y="767" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-stage-6">Restoration is approved at 10:50. By 11:20, all 60 trial VMs serve blue at revision 2.</text>
  <text x="32" y="826" font-size="22" font-weight="650" text-anchor="start">Reconcile the full manifest</text>
  <rect id="module-overview-total-32" data-kind="card" x="32" y="847" width="290" height="73" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="50" y="877" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-total-32">60 restored</text>
  <text x="50" y="905" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-total-32">Canary + pilot + two waves</text>
  <rect id="module-overview-total-335" data-kind="card" x="335" y="847" width="290" height="73" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <text x="353" y="877" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-total-335">130 deferred</text>
  <text x="353" y="905" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-total-335">Public VMs with no write</text>
  <rect id="module-overview-total-638" data-kind="card" x="638" y="847" width="290" height="73" rx="9" stroke="#A7B3BF" stroke-width="1.5" fill="#F4F6F8"/>
  <text x="656" y="877" font-size="22" font-weight="650" text-anchor="start" data-card="module-overview-total-638">10 excluded</text>
  <text x="656" y="905" font-size="17" font-weight="400" text-anchor="start" data-card="module-overview-total-638">Staff VMs with no write</text>
</svg>
