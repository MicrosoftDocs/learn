<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-labelledby="fleet-administration-swimlanes-title fleet-administration-swimlanes-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="fleet-administration-swimlanes-title">Who approves, who grants access, and who runs it?</title>
  <desc id="fleet-administration-swimlanes-desc">Four role lanes separate business approval and Azure permission. The portal workload owner approves S1 on the canary only. The access administrator scopes Azure RBAC for the runbook identity. With both in place, the fleet operator triggers the reviewed runbook. Windows executes as local System. Evidence returns to the workload owner before the pilot is released.</desc>
