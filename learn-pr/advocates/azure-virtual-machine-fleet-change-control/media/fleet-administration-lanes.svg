  <rect data-kind="background" x="0" y="0" width="960" height="624" fill="#ffffff"/>
  <text x="32" y="24" font-size="15" font-weight="650" text-anchor="start">FLEET ADMINISTRATION  /  CANARY APPROVAL</text>
  <text x="32" y="71" font-size="32" font-weight="650" text-anchor="start">Who approves, who grants access, and who runs it?</text>
  <text x="32" y="105" font-size="20" font-weight="400" text-anchor="start">Workload approval and Azure permission are separate prerequisites. Neither replaces the other.</text>
  <rect data-kind="lane" x="32" y="133" width="896" height="91" rx="4" fill="#F7F9FA" stroke="#D4DCE1" stroke-width="1"/>
