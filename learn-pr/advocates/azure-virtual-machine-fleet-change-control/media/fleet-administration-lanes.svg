  <text x="97" y="198" font-size="18" font-weight="550" text-anchor="start">owner</text>
  <rect data-kind="lane" x="32" y="237" width="896" height="91" rx="4" fill="#F7F9FA" stroke="#D4DCE1" stroke-width="1"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#fleet-administration-swimlanes-identity" x="46" y="263" width="36" height="36"/>
  <text x="97" y="273" font-size="18" font-weight="650" text-anchor="start">Azure access</text>
  <text x="97" y="302" font-size="18" font-weight="550" text-anchor="start">administrator</text>
  <rect data-kind="lane" x="32" y="341" width="896" height="91" rx="4" fill="#F7F9FA" stroke="#D4DCE1" stroke-width="1"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#fleet-administration-swimlanes-automation" x="46" y="367" width="36" height="36"/>
  <text x="97" y="377" font-size="18" font-weight="650" text-anchor="start">Fleet operator</text>
  <text x="97" y="406" font-size="18" font-weight="550" text-anchor="start">and runbook</text>
  <rect data-kind="lane" x="32" y="445" width="896" height="91" rx="4" fill="#F7F9FA" stroke="#D4DCE1" stroke-width="1"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#fleet-administration-swimlanes-vm" x="46" y="471" width="36" height="36"/>
  <text x="97" y="481" font-size="18" font-weight="650" text-anchor="start">Windows guest</text>
  <text x="97" y="510" font-size="18" font-weight="550" text-anchor="start">on fc-canary</text>
  <rect id="fleet-administration-swimlanes-approve" data-kind="card" x="257" y="141" width="205" height="75" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <text x="269" y="170" font-size="18" font-weight="650" text-anchor="start" data-card="fleet-administration-swimlanes-approve">1A. Approve scope</text>
  <text x="269" y="197" font-size="16" font-weight="400" text-anchor="start" data-card="fleet-administration-swimlanes-approve">S1 on fc-canary only</text>
  <rect id="fleet-administration-swimlanes-rbac" data-kind="card" x="257" y="245" width="205" height="75" rx="9" stroke="#AB91BF" stroke-width="1.5" fill="#F6F2FA"/>
  <text x="269" y="274" font-size="18" font-weight="650" text-anchor="start" data-card="fleet-administration-swimlanes-rbac">1B. Limit RBAC</text>
  <text x="269" y="301" font-size="16" font-weight="400" text-anchor="start" data-card="fleet-administration-swimlanes-rbac">Grant scoped access</text>
  <rect id="fleet-administration-swimlanes-dispatch" data-kind="card" x="516" y="349" width="183" height="75" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="530" y="378" font-size="18" font-weight="650" text-anchor="start" data-card="fleet-administration-swimlanes-dispatch">2. Dispatch S1</text>
  <text x="530" y="405" font-size="16" font-weight="400" text-anchor="start" data-card="fleet-administration-swimlanes-dispatch">Runbook identity</text>
  <rect id="fleet-administration-swimlanes-guest" data-kind="card" x="726" y="453" width="187" height="75" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <text x="739" y="482" font-size="18" font-weight="650" text-anchor="start" data-card="fleet-administration-swimlanes-guest">3. Run the script</text>
  <text x="739" y="509" font-size="15" font-weight="400" text-anchor="start" data-card="fleet-administration-swimlanes-guest">Local System account</text>
