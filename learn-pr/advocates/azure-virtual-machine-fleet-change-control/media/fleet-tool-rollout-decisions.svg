<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" aria-labelledby="fleet-tool-and-rollout-decisions-title fleet-tool-and-rollout-decisions-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="fleet-tool-and-rollout-decisions-title">Choose the tool and plan the rollout</title>
  <desc id="fleet-tool-and-rollout-decisions-desc">For the one-time Windows display change, choose a tool that records a separate result per VM. Approve only the canary first, and keep 10 staff VMs excluded. Stop if the result is unknown. Expansion needs separate approval and is limited to five concurrent writes, with at most one in each pool.</desc>
  <metadata>{&quot;iconSource&quot;:&quot;C:\\Azure-Icons&quot;,&quot;icons&quot;:[&quot;general/10825-icon-service-Powershell.svg&quot;,&quot;management + governance/00007-icon-service-Activity-Log.svg&quot;]}</metadata>
  <defs>
    <symbol id="fleet-tool-and-rollout-decisions-shell" viewBox="0 0 18 18"><defs><linearGradient id="fleet-tool-and-rollout-decisions-shell-a24f9983-911f-4df7-920f-f964c8c10f82" x1="9" y1="15.834" x2="9" y2="5.788" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32bedd" /><stop offset="0.175" stop-color="#32caea" /><stop offset="0.41" stop-color="#32d2f2" /><stop offset="0.775" stop-color="#32d4f5" /></linearGradient></defs><g id="fleet-tool-and-rollout-decisions-shell-a7ef0482-71f2-4b7e-b916-b1c754245bf1"><g><path d="M.5,5.788h17a0,0,0,0,1,0,0v9.478a.568.568,0,0,1-.568.568H1.068A.568.568,0,0,1,.5,15.266V5.788A0,0,0,0,1,.5,5.788Z" fill="url(#fleet-tool-and-rollout-decisions-shell-a24f9983-911f-4df7-920f-f964c8c10f82)" /><path d="M1.071,2.166H16.929a.568.568,0,0,1,.568.568V5.788a0,0,0,0,1,0,0H.5a0,0,0,0,1,0,0V2.734A.568.568,0,0,1,1.071,2.166Z" fill="#0078d4" /><path d="M4.292,7.153h.523a.167.167,0,0,1,.167.167v3.858a.335.335,0,0,1-.335.335H4.125a0,0,0,0,1,0,0V7.321a.167.167,0,0,1,.167-.167Z" transform="translate(-5.271 5.967) rotate(-45.081)" fill="#f2f2f2" /><path d="M4.32,9.647h.523a.167.167,0,0,1,.167.167v4.131a0,0,0,0,1,0,0H4.488a.335.335,0,0,1-.335-.335v-3.8a.167.167,0,0,1,.167-.167Z" transform="translate(-0.504 23.385) rotate(-135.081)" fill="#e6e6e6" /><rect x="7.221" y="12.64" width="4.771" height="1.011" rx="0.291" fill="#f2f2f2" /></g></g></symbol>
    <symbol id="fleet-tool-and-rollout-decisions-record" viewBox="0 0 18 18"><defs><linearGradient id="fleet-tool-and-rollout-decisions-record-f8a6a4fc-9e8d-423a-97d1-d514179ece73" x1="8.15" y1="17.5" x2="8.15" y2="2.09" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1988d9" /><stop offset="0.9" stop-color="#54aef0" /></linearGradient></defs><path d="M1.93,2.11,3.14.7A.59.59,0,0,1,3.59.5H15.2a.81.81,0,0,1,.89.83v14.5a.57.57,0,0,1-.2.43l-1.3,1.19H2.72l-.81-.33Z" fill="#005ba1" /><path d="M2.91,2.1l.74-.84A.5.5,0,0,1,4,1.08H14.89a.52.52,0,0,1,.52.52V15.38a.52.52,0,0,1-.17.39l-1.16,1.05Z" fill="#fff" /><path d="M14,2.09H2a.06.06,0,0,0-.06.06v15a.39.39,0,0,0,.39.38H14a.38.38,0,0,0,.38-.38V2.48A.39.39,0,0,0,14,2.09Z" fill="url(#fleet-tool-and-rollout-decisions-record-f8a6a4fc-9e8d-423a-97d1-d514179ece73)" /><rect x="4.72" y="6.2" width="6.58" height="2.38" rx="0.28" fill="#fff" /></symbol>
    <marker id="fleet-tool-and-rollout-decisions-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#486479"/></marker>
  </defs>
  <rect data-kind="background" x="0" y="0" width="960" height="474" fill="#ffffff"/>
  <text x="32" y="24" font-size="15" font-weight="650" text-anchor="start">INTRODUCTION  /  TWO DECISIONS</text>
  <text x="32" y="71" font-size="32" font-weight="650" text-anchor="start">Choose the tool and plan the rollout</text>
  <text x="32" y="105" font-size="20" font-weight="400" text-anchor="start">A tool tells you how to make a change. A rollout plan tells you when it is safe to continue.</text>
  <rect id="fleet-tool-and-rollout-decisions-tool" data-kind="card" x="32" y="138" width="434" height="190" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <text x="50" y="171" font-size="16" font-weight="650" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-tool">1. CHOOSE THE TOOL</text>
  <use data-kind="azure-icon" aria-hidden="true" href="#fleet-tool-and-rollout-decisions-shell" x="409" y="150" width="38" height="38"/>
  <text x="50" y="219" font-size="23" font-weight="650" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-tool">Change the local Windows file</text>
  <text x="50" y="258" font-size="18" font-weight="400" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-tool">A one-time change needs a guest command,</text>
  <text x="50" y="293" font-size="18" font-weight="400" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-tool">not an ongoing policy. Track each VM.</text>
  <rect id="fleet-tool-and-rollout-decisions-rollout" data-kind="card" x="494" y="138" width="434" height="190" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="512" y="171" font-size="16" font-weight="650" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-rollout">2. PLAN THE ROLLOUT</text>
  <use data-kind="azure-icon" aria-hidden="true" href="#fleet-tool-and-rollout-decisions-record" x="871" y="150" width="38" height="38"/>
  <text x="512" y="219" font-size="23" font-weight="650" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-rollout">Release one canary first</text>
  <text x="512" y="255" font-size="18" font-weight="400" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-rollout">Exclude all 10 staff VMs. Stop on unknowns.</text>
  <text x="512" y="282" font-size="18" font-weight="400" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-rollout">Later waves: at most 5 concurrent writes,</text>
  <text x="512" y="309" font-size="18" font-weight="400" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-rollout">with at most 1 write in any backend pool.</text>
  <path data-kind="connector" d="M249 335 L249 350 L480 350" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path data-kind="connector" d="M711 335 L711 350 L480 350" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path data-kind="connector" d="M480 350 L480 374" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#fleet-tool-and-rollout-decisions-arrow)"/>
  <rect id="fleet-tool-and-rollout-decisions-owner" data-kind="card" x="32" y="381" width="896" height="71" rx="9" stroke="#BA9258" stroke-width="1.5" fill="#FFF6E5"/>
  <text x="50" y="409" font-size="16" font-weight="650" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-owner">3. BEFORE A RETRY OR EXPANSION</text>
  <text x="50" y="437" font-size="18" font-weight="550" text-anchor="start" data-card="fleet-tool-and-rollout-decisions-owner">A healthy canary supports expansion. The portal workload owner must approve the 19-VM pilot.</text>
</svg>
