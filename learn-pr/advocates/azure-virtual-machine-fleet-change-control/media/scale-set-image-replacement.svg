<svg xmlns="http://www.w3.org/2000/svg" width="960" height="663" viewBox="0 0 960 663" role="img" aria-labelledby="scale-set-image-replacement-title scale-set-image-replacement-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="scale-set-image-replacement-title">What will the next scale-out instance boot?</title>
  <desc id="scale-set-image-replacement-desc">Compare two approaches to a 20-instance scale set. Patching a canary guest from build A to B leaves the model on image A, so a new instance still boots A. Updating the approved model to a tested gallery image B and provisioning a fresh instance lets the operator verify the new build and the application. Existing members must still be reconciled.</desc>
  <metadata>{&quot;iconSource&quot;:&quot;C:\\Azure-Icons&quot;,&quot;icons&quot;:[&quot;general/10825-icon-service-Powershell.svg&quot;,&quot;compute/10034-icon-service-VM-Scale-Sets.svg&quot;,&quot;compute/10021-icon-service-Virtual-Machine.svg&quot;,&quot;compute/02864-icon-service-Azure-Compute-Galleries.svg&quot;,&quot;compute/10038-icon-service-Image-Versions.svg&quot;]}</metadata>
