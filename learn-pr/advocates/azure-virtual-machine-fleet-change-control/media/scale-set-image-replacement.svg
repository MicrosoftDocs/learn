  <rect data-kind="background" x="0" y="0" width="960" height="663" fill="#ffffff"/>
  <text x="32" y="24" font-size="15" font-weight="650" text-anchor="start">UNIT 11  /  SCALE-SET MODEL AND GUEST STATE</text>
  <text x="32" y="71" font-size="32" font-weight="650" text-anchor="start">What will the next scale-out instance boot?</text>
  <text x="32" y="105" font-size="20" font-weight="400" text-anchor="start">The 20-instance set serves two portal pools. Read each path from top to bottom.</text>
  <rect id="scale-set-image-replacement-guest-title" data-kind="card" x="32" y="134" width="435" height="57" rx="9" stroke="#A7B3BF" stroke-width="1.5" fill="#F4F6F8"/>
  <text x="48" y="170" font-size="22" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-guest-title">A. Patch a running canary</text>
  <path data-kind="connector" d="M250 198 L250 210" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#scale-set-image-replacement-arrow)"/>
  <rect id="scale-set-image-replacement-guest-0" data-kind="card" x="32" y="216" width="435" height="95" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#scale-set-image-replacement-shell" x="46" y="231" width="32" height="32"/>
  <text x="90" y="254" font-size="19" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-guest-0">A1. Change inside Windows</text>
  <text x="47" y="290" font-size="16" font-weight="400" text-anchor="start" data-card="scale-set-image-replacement-guest-0">Patch the running guest from build A to B.</text>
  <path data-kind="connector" d="M250 317 L250 329" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#scale-set-image-replacement-arrow)"/>
  <rect id="scale-set-image-replacement-guest-1" data-kind="card" x="32" y="335" width="435" height="95" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#scale-set-image-replacement-scaleset" x="46" y="350" width="32" height="32"/>
  <text x="90" y="373" font-size="19" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-guest-1">A2. Model still points to image A</text>
  <text x="47" y="409" font-size="16" font-weight="400" text-anchor="start" data-card="scale-set-image-replacement-guest-1">A successful guest update does not edit the model.</text>
  <path data-kind="connector" d="M250 436 L250 448" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#scale-set-image-replacement-arrow)"/>
  <rect id="scale-set-image-replacement-guest-2" data-kind="card" x="32" y="454" width="435" height="95" rx="9" stroke="#BA9258" stroke-width="1.5" fill="#FFF6E5"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#scale-set-image-replacement-vm" x="46" y="469" width="32" height="32"/>
  <text x="90" y="492" font-size="19" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-guest-2">A3. Fresh instance boots build A</text>
  <text x="47" y="528" font-size="16" font-weight="400" text-anchor="start" data-card="scale-set-image-replacement-guest-2">A scale-out creates another old-build backend.</text>
  <rect id="scale-set-image-replacement-model-title" data-kind="card" x="493" y="134" width="435" height="57" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="509" y="170" font-size="22" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-model-title">B. Update the scale-set model</text>
  <path data-kind="connector" d="M711 198 L711 210" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#scale-set-image-replacement-arrow)"/>
  <rect id="scale-set-image-replacement-model-0" data-kind="card" x="493" y="216" width="435" height="95" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#scale-set-image-replacement-gallery" x="507" y="231" width="32" height="32"/>
  <text x="551" y="254" font-size="19" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-model-0">B1. Publish a tested gallery image</text>
  <text x="508" y="290" font-size="16" font-weight="400" text-anchor="start" data-card="scale-set-image-replacement-model-0">Pin the exact version containing build B.</text>
  <path data-kind="connector" d="M711 317 L711 329" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#scale-set-image-replacement-arrow)"/>
  <rect id="scale-set-image-replacement-model-1" data-kind="card" x="493" y="335" width="435" height="95" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#scale-set-image-replacement-imageversion" x="507" y="350" width="32" height="32"/>
  <text x="551" y="373" font-size="19" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-model-1">B2. Set the model to image B</text>
  <text x="508" y="409" font-size="16" font-weight="400" text-anchor="start" data-card="scale-set-image-replacement-model-1">Use an approved canary set for the new model.</text>
  <path data-kind="connector" d="M711 436 L711 448" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#scale-set-image-replacement-arrow)"/>
  <rect id="scale-set-image-replacement-model-2" data-kind="card" x="493" y="454" width="435" height="95" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#scale-set-image-replacement-vm" x="507" y="469" width="32" height="32"/>
  <text x="551" y="492" font-size="19" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-model-2">B3. Fresh instance boots build B</text>
  <text x="508" y="528" font-size="16" font-weight="400" text-anchor="start" data-card="scale-set-image-replacement-model-2">Check its actual OS build and a test return.</text>
  <rect id="scale-set-image-replacement-rollout" data-kind="card" x="32" y="571" width="896" height="72" rx="9" stroke="#AB91BF" stroke-width="1.5" fill="#F6F2FA"/>
  <text x="49" y="604" font-size="20" font-weight="650" text-anchor="start" data-card="scale-set-image-replacement-rollout">4. Reconcile existing instances separately from the model.</text>
  <text x="49" y="630" font-size="17" font-weight="400" text-anchor="start" data-card="scale-set-image-replacement-rollout">If 19 of 20 report build B, keep the remaining instance pending or document an exception.</text>
</svg>
