  <text x="32" y="24" font-size="15" font-weight="650" text-anchor="start">UNIT 1  /  MECHANISM SELECTION</text>
  <text x="32" y="71" font-size="32" font-weight="650" text-anchor="start">Where does the setting live?</text>
  <text x="32" y="105" font-size="20" font-weight="400" text-anchor="start">Start with the setting, then decide how long the requirement should last.</text>
  <rect id="change-mechanism-map-start" data-kind="card" x="204" y="130" width="552" height="65" rx="9" stroke="#A7B3BF" stroke-width="1.5" fill="#F4F6F8"/>
  <text x="228" y="172" font-size="20" font-weight="650" text-anchor="start" data-card="change-mechanism-map-start">1. Locate the setting in the workload owner's request.</text>
