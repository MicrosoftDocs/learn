  <rect id="change-mechanism-map-resource-leaf" data-kind="card" x="32" y="399" width="282" height="139" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <text x="49" y="426" font-size="15" font-weight="650" text-anchor="start" data-card="change-mechanism-map-resource-leaf">3A  /  RESOURCE CHANGE</text>
  <use data-kind="azure-icon" aria-hidden="true" href="#change-mechanism-map-resource" x="269" y="411" width="28" height="28"/>
  <text x="49" y="464" font-size="21" font-weight="650" text-anchor="start" data-card="change-mechanism-map-resource-leaf">Bicep deployment</text>
  <text x="49" y="496" font-size="18" font-weight="400" text-anchor="start" data-card="change-mechanism-map-resource-leaf">Describe the required</text>
  <text x="49" y="521" font-size="18" font-weight="400" text-anchor="start" data-card="change-mechanism-map-resource-leaf">Azure resource properties.</text>
  <rect id="change-mechanism-map-shell-leaf" data-kind="card" x="349" y="399" width="280" height="139" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="366" y="426" font-size="15" font-weight="650" text-anchor="start" data-card="change-mechanism-map-shell-leaf">3B  /  ONE-TIME CHANGE</text>
  <use data-kind="azure-icon" aria-hidden="true" href="#change-mechanism-map-shell" x="584" y="411" width="28" height="28"/>
  <text x="366" y="464" font-size="21" font-weight="650" text-anchor="start" data-card="change-mechanism-map-shell-leaf">Run Command</text>
  <text x="366" y="496" font-size="18" font-weight="400" text-anchor="start" data-card="change-mechanism-map-shell-leaf">Apply a guest setting once.</text>
  <text x="366" y="521" font-size="18" font-weight="400" text-anchor="start" data-card="change-mechanism-map-shell-leaf">Keep the per-VM result.</text>
  <rect id="change-mechanism-map-policy-leaf" data-kind="card" x="649" y="399" width="279" height="139" rx="9" stroke="#AB91BF" stroke-width="1.5" fill="#F6F2FA"/>
  <text x="666" y="426" font-size="15" font-weight="650" text-anchor="start" data-card="change-mechanism-map-policy-leaf">3C  /  ONGOING RULE</text>
  <use data-kind="azure-icon" aria-hidden="true" href="#change-mechanism-map-policy" x="883" y="411" width="28" height="28"/>
  <text x="666" y="464" font-size="21" font-weight="650" text-anchor="start" data-card="change-mechanism-map-policy-leaf">Machine Configuration</text>
  <text x="666" y="496" font-size="18" font-weight="400" text-anchor="start" data-card="change-mechanism-map-policy-leaf">Audit the setting over time.</text>
  <text x="666" y="521" font-size="18" font-weight="400" text-anchor="start" data-card="change-mechanism-map-policy-leaf">Remediate if configured.</text>
