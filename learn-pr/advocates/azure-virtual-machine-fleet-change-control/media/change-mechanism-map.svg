  <text x="50" y="273" font-size="16" font-weight="650" text-anchor="start" data-card="change-mechanism-map-resource-side">2A  /  AZURE RESOURCE</text>
  <text x="50" y="315" font-size="19" font-weight="550" text-anchor="start" data-card="change-mechanism-map-resource-side">A VM property, such as size</text>
  <rect id="change-mechanism-map-guest-side" data-kind="card" x="349" y="244" width="579" height="98" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="369" y="273" font-size="16" font-weight="650" text-anchor="start" data-card="change-mechanism-map-guest-side">2B  /  INSIDE THE OPERATING SYSTEM</text>
  <text x="369" y="315" font-size="22" font-weight="550" text-anchor="start" data-card="change-mechanism-map-guest-side">Should the guest setting stay enforced?</text>
  <path data-kind="connector" d="M173 348 L173 390" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#change-mechanism-map-arrow)"/>
