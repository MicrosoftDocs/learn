  <path data-kind="connector" d="M480 218 L173 218 L173 237" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#change-mechanism-map-arrow)"/>
  <path data-kind="connector" d="M480 218 L639 218 L639 237" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#change-mechanism-map-arrow)"/>
