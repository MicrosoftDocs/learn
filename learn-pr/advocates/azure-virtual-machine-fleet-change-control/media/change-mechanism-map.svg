  <title id="change-mechanism-map-title">Where does the setting live?</title>
  <desc id="change-mechanism-map-desc">Read from top to bottom. An Azure resource property can be changed through Bicep. For a setting inside Windows, use a guest command for a one-time change or Machine Configuration for ongoing enforcement.</desc>
