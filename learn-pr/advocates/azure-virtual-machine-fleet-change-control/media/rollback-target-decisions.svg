<svg xmlns="http://www.w3.org/2000/svg" width="960" height="786" viewBox="0 0 960 786" role="img" aria-labelledby="rollback-target-decisions-title rollback-target-decisions-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="rollback-target-decisions-title">Which VMs should the rollback runbook write to?</title>
  <desc id="rollback-target-decisions-desc">Reconcile 200 identities with the forward-change record. Only 60 confirmed writes are eligible, not 130 deferred or 10 excluded VMs. Recheck identity, in-flight work and guest state. Restore only an approved matching changed target, skip a verified prior restore, and hold on a mismatch or missing evidence. One unresolved result prevents closure.</desc>
  <metadata>{&quot;iconSource&quot;:&quot;C:\\Azure-Icons&quot;,&quot;icons&quot;:[&quot;management + governance/10318-icon-service-Resource-Graph-Explorer.svg&quot;,&quot;management + governance/00022-icon-service-Automation-Accounts.svg&quot;]}</metadata>
  <defs>
    <symbol id="rollback-target-decisions-inventory" viewBox="0 0 18 18"><defs><linearGradient id="rollback-target-decisions-inventory-aaf70b12-8383-43d3-8674-d08878f903d1" x1="2.63" y1="5.99" x2="2.63" y2="1.75" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#773adc" /><stop offset="1" stop-color="#b77af4" /></linearGradient><linearGradient id="rollback-target-decisions-inventory-ac810344-4e2d-4dad-99ba-9567b44e7523" x1="14.76" y1="6.31" x2="14.76" y2="0.85" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#773adc" /><stop offset="1" stop-color="#b77af4" /></linearGradient><linearGradient id="rollback-target-decisions-inventory-b4b36432-ae36-466e-9abd-a30eb14585d3" x1="11.92" y1="17.27" x2="11.92" y2="7.71" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#773adc" /><stop offset="1" stop-color="#b77af4" /></linearGradient></defs><path d="M11.56,14.24,1.79,4.35A.77.77,0,0,1,2.34,3H14.76V4.58H4.19l8.47,8.58Z" fill="#b796f9" /><ellipse cx="2.63" cy="3.87" rx="2.13" ry="2.12" fill="url(#rollback-target-decisions-inventory-aaf70b12-8383-43d3-8674-d08878f903d1)" /><ellipse cx="14.76" cy="3.58" rx="2.74" ry="2.73" fill="url(#rollback-target-decisions-inventory-ac810344-4e2d-4dad-99ba-9567b44e7523)" /><ellipse cx="11.92" cy="13.69" rx="3.47" ry="3.46" fill="url(#rollback-target-decisions-inventory-b4b36432-ae36-466e-9abd-a30eb14585d3)" /></symbol>
    <symbol id="rollback-target-decisions-automation" viewBox="0 0 18 18"><defs><linearGradient id="rollback-target-decisions-automation-ec4358fa-c977-42e2-a7ab-994b5de56830" x1="9" y1="177.9" x2="9" y2="160.1" gradientTransform="translate(0 -160)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.064" stop-color="#0a7cd7" /><stop offset="0.338" stop-color="#2e8ce1" /><stop offset="0.594" stop-color="#4897e9" /><stop offset="0.822" stop-color="#589eed" /><stop offset="1" stop-color="#5ea0ef" /></linearGradient><linearGradient id="rollback-target-decisions-automation-aae9e42c-091e-4dc7-8bec-a93418af93c4" x1="-26.189" y1="-295.6" x2="-26.189" y2="-311.105" gradientTransform="translate(39.425 321.61) scale(1.156 1.029)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fea11b" /><stop offset="0.284" stop-color="#fea51a" /><stop offset="0.547" stop-color="#feb018" /><stop offset="0.8" stop-color="#ffc314" /><stop offset="1" stop-color="#ffd70f" /></linearGradient></defs><path d="M17.9,10V8l-.3-.1-2.2-.7-.6-1.4L16,3.4,14.5,2l-.3.1-2,1-1.4-.6L10,.1H8L7.8.4,7.1,2.6l-1.4.5L3.4,2,2,3.5l.1.3,1,2L2.6,7.2.1,8v2l.3.1,2.2.7.6,1.4L2,14.6,3.5,16l.3-.1,2-1,1.4.6L8,17.9h2l.1-.3.7-2.2,1.4-.6,2.3,1.1,1.4-1.4-.1-.3-1-2,.6-1.4ZM9,12.9A3.842,3.842,0,0,1,5.1,9,3.842,3.842,0,0,1,9,5.1,3.842,3.842,0,0,1,12.9,9h0A3.842,3.842,0,0,1,9,12.9Z" fill="url(#rollback-target-decisions-automation-ec4358fa-c977-42e2-a7ab-994b5de56830)" /><path d="M8.5,10.5H4.9a.215.215,0,0,1-.2-.2v-.1L9,1.7c0-.1.1-.1.2-.1h4.2a.215.215,0,0,1,.2.2v.1L8.5,8.6h4.9a.215.215,0,0,1,.2.2.1.1,0,0,1-.1.1L5.3,17.4c-.1,0-.6.5-.4-.2h0Z" fill="url(#rollback-target-decisions-automation-aae9e42c-091e-4dc7-8bec-a93418af93c4)" /></symbol>
    <marker id="rollback-target-decisions-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#486479"/></marker>
  </defs>
  <rect data-kind="background" x="0" y="0" width="960" height="786" fill="#ffffff"/>
  <text x="32" y="24" font-size="15" font-weight="650" text-anchor="start">UNIT 6  /  AUTOMATED ROLLBACK</text>
  <text x="32" y="71" font-size="32" font-weight="650" text-anchor="start">Which VMs should the rollback runbook write to?</text>
  <text x="32" y="105" font-size="20" font-weight="400" text-anchor="start">Start with evidence of a write, not a tag query or a list of successful command exits.</text>
  <rect id="rollback-target-decisions-manifest" data-kind="card" x="32" y="129" width="896" height="76" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#rollback-target-decisions-inventory" x="51" y="146" width="40" height="40"/>
  <text x="110" y="159" font-size="22" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-manifest">1. Reconcile the 200-VM manifest with the forward results</text>
  <text x="110" y="188" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-manifest">The canary counts once: it wrote the setting even though its first command failed.</text>
  <path data-kind="connector" d="M480 211 L480 227" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path data-kind="connector" d="M176 227 L784 227" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path data-kind="connector" d="M176 227 L176 246" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#rollback-target-decisions-arrow)"/>
  <path data-kind="connector" d="M480 227 L480 246" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#rollback-target-decisions-arrow)"/>
  <path data-kind="connector" d="M784 227 L784 246" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#rollback-target-decisions-arrow)"/>
  <rect id="rollback-target-decisions-cohort-0" data-kind="card" x="32" y="253" width="288" height="103" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="47" y="285" font-size="20" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-cohort-0">2A. Eligible: 60</text>
  <text x="47" y="316" font-size="16" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-cohort-0">Confirmed writes</text>
  <text x="47" y="343" font-size="16" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-cohort-0">Queue for approved recovery.</text>
  <rect id="rollback-target-decisions-cohort-1" data-kind="card" x="336" y="253" width="288" height="103" rx="9" stroke="#A7B3BF" stroke-width="1.5" fill="#F4F6F8"/>
  <text x="351" y="285" font-size="20" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-cohort-1">2B. Deferred: 130</text>
  <text x="351" y="316" font-size="16" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-cohort-1">Never received the change</text>
  <text x="351" y="343" font-size="16" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-cohort-1">Leave off the rollback queue.</text>
  <rect id="rollback-target-decisions-cohort-2" data-kind="card" x="640" y="253" width="288" height="103" rx="9" stroke="#A7B3BF" stroke-width="1.5" fill="#F4F6F8"/>
  <text x="655" y="285" font-size="20" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-cohort-2">2C. Excluded: 10</text>
  <text x="655" y="316" font-size="16" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-cohort-2">Separate staff workload</text>
  <text x="655" y="343" font-size="16" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-cohort-2">Do not send a write.</text>
  <path data-kind="connector" d="M176 362 L176 377" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#rollback-target-decisions-arrow)"/>
  <rect id="rollback-target-decisions-preconditions" data-kind="card" x="32" y="384" width="896" height="90" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <use data-kind="azure-icon" aria-hidden="true" href="#rollback-target-decisions-automation" x="51" y="406" width="42" height="42"/>
  <text x="111" y="415" font-size="21" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-preconditions">3. For each eligible VM, match approval, identity and current state</text>
  <text x="111" y="445" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-preconditions">Restore the canary first. After approval, keep at most five writes in flight and one per pool.</text>
  <path data-kind="connector" d="M480 480 L480 496" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path data-kind="connector" d="M176 496 L784 496" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path data-kind="connector" d="M176 496 L176 519" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#rollback-target-decisions-arrow)"/>
  <path data-kind="connector" d="M480 496 L480 519" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#rollback-target-decisions-arrow)"/>
  <path data-kind="connector" d="M784 496 L784 519" stroke="#486479" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#rollback-target-decisions-arrow)"/>
  <rect id="rollback-target-decisions-decision-0" data-kind="card" x="32" y="526" width="288" height="154" rx="9" stroke="#619E94" stroke-width="1.5" fill="#ECF7F5"/>
  <text x="47" y="557" font-size="20" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-decision-0">4A. Restore</text>
  <text x="47" y="590" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-0">Same instance and revision;</text>
  <text x="47" y="615" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-0">forward command finished.</text>
  <text x="47" y="640" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-0">Write its own prior value.</text>
  <text x="47" y="665" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-0">Verify the app directly.</text>
  <rect id="rollback-target-decisions-decision-1" data-kind="card" x="336" y="526" width="288" height="154" rx="9" stroke="#739BC1" stroke-width="1.5" fill="#F1F7FD"/>
  <text x="351" y="557" font-size="20" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-decision-1">4B. Already restored</text>
  <text x="351" y="590" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-1">Prior restore is recorded;</text>
  <text x="351" y="615" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-1">baseline and app match.</text>
  <text x="351" y="640" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-1">Record the observation.</text>
  <text x="351" y="665" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-1">Do not write or increment.</text>
  <rect id="rollback-target-decisions-decision-2" data-kind="card" x="640" y="526" width="288" height="154" rx="9" stroke="#BA9258" stroke-width="1.5" fill="#FFF6E5"/>
  <text x="655" y="557" font-size="20" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-decision-2">4C. Hold and investigate</text>
  <text x="655" y="590" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-2">Command still running,</text>
  <text x="655" y="615" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-2">identity changed, or result</text>
  <text x="655" y="640" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-2">unknown? Stop dispatch.</text>
  <text x="655" y="665" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-decision-2">Assign a fleet operator.</text>
  <rect id="rollback-target-decisions-closure" data-kind="card" x="32" y="695" width="896" height="71" rx="9" stroke="#A7B3BF" stroke-width="1.5" fill="#F4F6F8"/>
  <text x="50" y="728" font-size="20" font-weight="650" text-anchor="start" data-card="rollback-target-decisions-closure">Closure requires 60 verified restorations, 130 deferred, and 10 excluded.</text>
  <text x="50" y="754" font-size="17" font-weight="400" text-anchor="start" data-card="rollback-target-decisions-closure">59 verified + 1 unresolved is partial recovery. Do not rerun the 59.</text>
</svg>
