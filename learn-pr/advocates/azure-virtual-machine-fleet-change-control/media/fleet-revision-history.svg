<svg xmlns="http://www.w3.org/2000/svg" width="960" height="805" viewBox="0 0 960 805" role="img" aria-labelledby="fleet-revision-history-title fleet-revision-history-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="fleet-revision-history-title">Which VMs recorded a write?</title>
  <desc id="fleet-revision-history-desc">Read the 200-VM record by group. The canary first records a write at 09:05; the 19 pilot VMs have changed by 09:35 and 40 production VMs by 10:20. At 10:45 all 60 trial VMs are still green at revision 1. After restoration at 11:20 they are blue at revision 2. The 130 deferred and 10 excluded VMs never leave revision 0. Lines join observations at checkpoints, not individual write times.</desc>
