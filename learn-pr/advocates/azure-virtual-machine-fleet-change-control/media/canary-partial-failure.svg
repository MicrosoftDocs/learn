  <title id="canary-partial-failure-title">One failed command, one recorded write</title>
  <desc id="canary-partial-failure-desc">At 09:05 Azure accepted the canary command. The guest wrote green and recorded revision 1 before the script reported exit 42. A direct application check returned VmOpsDisplay:green. The 189 waiting portal backends and the 10 excluded staff VMs remained blue at revision 0.</desc>
