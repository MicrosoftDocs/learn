  <text x="32" y="24" font-size="15" font-weight="650" text-anchor="start">UNIT 9  /  CAPACITY DURING A DRAIN</text>
  <text x="32" y="71" font-size="32" font-weight="650" text-anchor="start">How many backends can one pool spare?</text>
  <text x="32" y="105" font-size="20" font-weight="400" text-anchor="start">Keep this pool at nine or more healthy backends and no more than 80% CPU.</text>
  <text x="47" y="154" font-size="20" font-weight="650" text-anchor="start">Drain decision</text>
