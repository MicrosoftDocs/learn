<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="backend-pool-drain-capacity-title backend-pool-drain-capacity-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="backend-pool-drain-capacity-title">How many backends can one pool spare?</title>
  <desc id="backend-pool-drain-capacity-desc">Ten equal backends at 65% CPU carry 6.5 VM equivalents. At constant load, nine serving backends would each use about 72%, and eight about 81%. The example requires at least nine healthy backends and at most 80% CPU. A single drain meets the two numerical gates, but a two-VM drain fails both. Verify latency and active requests before proceeding.</desc>
  <metadata>{&quot;iconSource&quot;:&quot;C:\\Azure-Icons&quot;,&quot;icons&quot;:[&quot;compute/10021-icon-service-Virtual-Machine.svg&quot;]}</metadata>
