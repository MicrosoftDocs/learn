<svg xmlns="http://www.w3.org/2000/svg" width="960" height="522" viewBox="0 0 960 522" role="img" aria-labelledby="recovery-objective-timeline-title recovery-objective-timeline-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="recovery-objective-timeline-title">Two recovery objectives, two different results</title>
  <desc id="recovery-objective-timeline-desc">At 09:40 the latest usable recovery point was captured. Corruption began at 10:00. The isolated service passed a transaction at 10:42. The potential data loss was 20 minutes, five minutes over the 15-minute RPO. Recovery took 42 minutes, inside the 60-minute RTO by 18 minutes.</desc>
