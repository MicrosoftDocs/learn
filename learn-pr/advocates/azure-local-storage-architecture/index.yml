  ms.service: azure-local
title: Azure Local storage architecture and maintenance
summary: |
  Azure Local storage is resilient only when the hosted workload can use its data after the failures that the design promises to withstand. Redundant drives are important, but so are copy placement, storage-network paths, quorum, repair capacity, and enough surviving compute capacity to run the workload.
abstract: |
  After completing this module, you can:

  - Select a supported Azure Local storage architecture and resiliency layout for a specified failure requirement.
  - Calculate physical footprint, logical capacity, repair reserve, and growth without mixing allocation layers.
  - Explain how fault domains, storage paths, cluster quorum, and pool quorum affect availability.
  - Interpret storage and quorum evidence during a degradation or capacity incident.
  - Explain data-integrity protection and select monitoring evidence for storage failures and recovery.
  - Distinguish repair, resynchronization, rebalancing, and recovery from an independent recovery point.

  > [!VIDEO https://learn-video.azurefd.net/vod/player?id=5daedd24-291f-4f2a-b340-3e4664af290a]
prerequisites: |
  - Familiarity with Azure Local architecture, virtualization, and storage.
  - Working knowledge of failover clustering and redundant network connections.
  - Basic Windows PowerShell experience for the read-only diagnostic examples.
