<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="868" viewBox="0 0 1200 868" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: white">
  <title id="diagram-title">Redundant paths are not redundant data copies</title>
  <desc id="diagram-description">A host uses HBA port A through Fabric A and array ports A, and HBA port B through Fabric B and array ports B. Both independent routes access the same protected LUN. MPIO exposes one logical disk rather than a disk per path. That workload LUN backs one NTFS CSV. Repeat the required presentation on every node and verify the actual controller, switch, HBA, and zoning dependencies.</desc>
  <rect x="0" y="0" width="1200" height="868" fill="#ffffff" data-role="background"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#46637b"/></marker>
    <symbol id="icon-host" viewBox="0 0 18 18" data-source-icon="compute\10347-icon-service-Hosts.svg"><defs><linearGradient id="host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf" x1="9.02" y1="5.46" x2="9.02" y2="0.65" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-a07223d6-5912-4349-a93f-23c27741ba44" x1="8.98" y1="11.97" x2="8.98" y2="7.17" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9" x1="9.02" y1="17.34" x2="9.02" y2="14.32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient></defs><g><path d="M8.46,5.46h1v9.6h-1Z" fill="#32bedd" /><path d="M15.48.65H2.56A.58.58,0,0,0,2,1.23V4.88a.58.58,0,0,0,.57.58H15.48a.57.57,0,0,0,.57-.58V1.23A.57.57,0,0,0,15.48.65Z" fill="url(#host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf)" /><path d="M15.44,7.17H2.52A.57.57,0,0,0,2,7.74V11.4a.56.56,0,0,0,.57.57H15.44A.57.57,0,0,0,16,11.4V7.74A.58.58,0,0,0,15.44,7.17Z" fill="url(#host-a07223d6-5912-4349-a93f-23c27741ba44)" /><circle cx="9.06" cy="15.84" r="1.51" fill="#7fba00" /><circle cx="9.02" cy="15.83" r="1.51" fill="url(#host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9)" /><g><rect x="13.72" y="1.55" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="3.36" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g><g><rect x="13.72" y="8.04" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="9.85" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g></g></symbol>
<symbol id="icon-disk" viewBox="0 0 18 18" data-source-icon="compute\10032-icon-service-Disks.svg"><defs><linearGradient id="disk-a3aecb5c-11f5-4ece-99f7-9672f3236156" x1="15.35" y1="13.41" x2="15.37" y2="13.41" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.14" stop-color="#1782da" /><stop offset="0.37" stop-color="#368fe3" /><stop offset="0.59" stop-color="#4c98ea" /><stop offset="0.8" stop-color="#599eee" /><stop offset="0.99" stop-color="#5ea0ef" /></linearGradient><linearGradient id="disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc" x1="5.51" y1="802.5" x2="12.94" y2="810.58" gradientTransform="translate(0 -1278.76) scale(1 1.59)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.02" stop-color="#0d7ed8" /><stop offset="0.08" stop-color="#2b8ae0" /><stop offset="0.15" stop-color="#4194e7" /><stop offset="0.22" stop-color="#519beb" /><stop offset="0.29" stop-color="#5b9fee" /><stop offset="0.4" stop-color="#5ea0ef" /><stop offset="0.55" stop-color="#5b9fee" /><stop offset="0.68" stop-color="#509aeb" /><stop offset="0.8" stop-color="#3f92e6" /><stop offset="0.91" stop-color="#2688df" /><stop offset="0.99" stop-color="#127fd9" /></linearGradient></defs><ellipse cx="8.96" cy="11.82" rx="7.5" ry="3.08" fill="#76bc2d" /><ellipse cx="9.15" cy="11.79" rx="2.49" ry="0.68" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><ellipse cx="8.96" cy="4.99" rx="7.5" ry="3.08" fill="url(#disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc)" /><ellipse cx="9.15" cy="4.95" rx="2.49" ry="0.68" fill="#005ba1" /><path d="M9,14.84c4.15,0,7.5-1.38,7.5-3.08h0v1.82h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V11.76C1.46,13.46,4.82,14.84,9,14.84Z" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><path d="M9,8c4.15,0,7.5-1.38,7.5-3.08h0V6.74h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V4.92C1.46,6.62,4.82,8,9,8Z" fill="#0078d4" /></symbol>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="40" y="52" font-size="32" font-weight="600">Redundant paths are not redundant data copies</text>
    <text x="40" y="89" font-size="20" fill="#40566d">FC example. Read 1 to 3 from left to right, then 4. Use the qualified vendor path design.</text>
    <g data-card="host"><rect x="40" y="130" width="300" height="420" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="168" r="19" fill="#005a9e"/><text x="72" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><text x="112" y="176" font-size="26" font-weight="600">Host access</text><use href="#icon-host" x="157" y="205" width="58" height="58" aria-hidden="true" data-role="icon"/><g data-card="host-port-a"><rect x="70" y="280" width="240" height="74" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="190" y="325" font-size="24" text-anchor="middle" font-weight="600">HBA port A</text></g><g data-card="host-port-b"><rect x="70" y="410" width="240" height="74" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="190" y="455" font-size="24" text-anchor="middle" font-weight="600">HBA port B</text></g><text x="190" y="526" font-size="19" text-anchor="middle">Repeat on every node</text></g><g data-card="fabrics"><rect x="450" y="130" width="300" height="420" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="482" cy="168" r="19" fill="#005a9e"/><text x="482" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><text x="522" y="176" font-size="26" font-weight="600">Separate fabrics</text><text x="600" y="245" font-size="21" text-anchor="middle">Independent routes</text><g data-card="fabric-a"><rect x="480" y="280" width="240" height="74" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="600" y="325" font-size="24" text-anchor="middle" font-weight="600">Fabric A</text></g><g data-card="fabric-b"><rect x="480" y="410" width="240" height="74" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="600" y="455" font-size="24" text-anchor="middle" font-weight="600">Fabric B</text></g><text x="600" y="526" font-size="19" text-anchor="middle">Avoid shared failures</text></g><g data-card="array"><rect x="860" y="130" width="300" height="420" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="892" cy="168" r="19" fill="#005a9e"/><text x="892" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><text x="932" y="176" font-size="26" font-weight="600">Array access</text><use href="#icon-disk" x="980" y="205" width="58" height="58" aria-hidden="true" data-role="icon"/><g data-card="array-port-a"><rect x="890" y="280" width="240" height="74" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="1010" y="325" font-size="24" text-anchor="middle" font-weight="600">Array ports A</text></g><g data-card="array-port-b"><rect x="890" y="410" width="240" height="74" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="1010" y="455" font-size="24" text-anchor="middle" font-weight="600">Array ports B</text></g><text x="1010" y="526" font-size="19" text-anchor="middle">Same protected LUN</text></g><line x1="350" y1="317" x2="440" y2="317" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="395" y="295" font-size="17" text-anchor="middle">Route A</text><line x1="350" y1="447" x2="440" y2="447" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="395" y="425" font-size="17" text-anchor="middle">Route B</text><line x1="760" y1="317" x2="850" y2="317" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="805" y="295" font-size="17" text-anchor="middle">Route A</text><line x1="760" y1="447" x2="850" y2="447" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="805" y="425" font-size="17" text-anchor="middle">Route B</text><line x1="600" y1="563" x2="600" y2="626" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="630" y="601.5" font-size="20" fill="#40566d">Logical result, not a third fabric</text><g data-card="logical-result"><rect x="40" y="640" width="1120" height="150" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="678" r="19" fill="#005a9e"/><text x="72" y="685" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">4</text><text x="112" y="686" font-size="26" font-weight="600">One logical device at the host</text><text x="112" y="724" font-size="23" >MPIO combines paths to one LUN; it does not create data copies.</text><text x="112" y="758" font-size="23" >The workload LUN backs one NTFS CSV, not a disk for each path.</text></g><text x="40" y="834" font-size="20" >Separate paths protect access; the array supplies the underlying data protection.</text>
  </g>
</svg>
