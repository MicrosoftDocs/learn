  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="40" y="52" font-size="32" font-weight="600">Azure Local quorum witness options</text>
    <text x="40" y="89" font-size="20" fill="#40566d">Read panels 1 to 3. Choose the supported witness for the storage architecture and connectivity.</text>
    <g data-card="option-1">
    <rect data-role="card-boundary" x="40" y="125" width="1120" height="350" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <circle cx="72" cy="163" r="19" fill="#005a9e"/><text x="72" y="170" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><text x="112" y="171" font-size="27" font-weight="600">Cloud witness</text><g data-card="cloud-cluster">
    <rect data-role="card-boundary" x="80" y="205" width="240" height="220" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="200" y="239" font-size="22" text-anchor="middle" font-weight="600">Azure Local cluster</text><use href="#icon-host" x="168" y="257" width="64" height="64" aria-hidden="true" data-role="icon"/><text x="200" y="364" font-size="20" text-anchor="middle">All cluster nodes</text><text x="200" y="396" font-size="20" text-anchor="middle">need access</text>
  </g><text x="385" y="286" font-size="20" text-anchor="middle" fill="#40566d">HTTPS</text><line x1="332" y1="315" x2="438" y2="315" stroke="#46637b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" data-role="connector"/><text x="385" y="351" font-size="18" text-anchor="middle" fill="#40566d">TCP 443</text><g data-card="cloud-resource">
    <rect data-role="card-boundary" x="450" y="205" width="250" height="220" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="575" y="239" font-size="22" text-anchor="middle" font-weight="600">Azure Blob Storage</text><use href="#icon-cloud" x="545" y="256" width="60" height="60" aria-hidden="true" data-role="icon"/><text x="575" y="346" font-size="19" text-anchor="middle">Arbitration blob</text>
<text x="575" y="378" font-size="19" text-anchor="middle">No cluster database</text>
<text x="575" y="410" font-size="19" text-anchor="middle">No Azure VM needed</text>
  </g><g data-card="cloud-requirements">
    <rect data-role="card-boundary" x="750" y="205" width="370" height="220" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5"/>
    <text x="772" y="241" font-size="23" font-weight="600" fill="#005a9e">Requirements</text><text x="772" y="283" font-size="20" >Standard general-purpose v2</text>
<text x="772" y="315" font-size="20" >Azure Storage account</text>
<text x="772" y="347" font-size="20" >HTTPS / TCP 443</text>
<text x="772" y="379" font-size="20" >Reliable Azure connectivity</text>
<text x="772" y="411" font-size="20" >Reachable from every node</text>
  </g><text x="80" y="457" font-size="20" >Supported S2D option; the hyperconverged rack-aware portal configures a cloud witness.</text>
  </g>
<g data-card="option-2">
    <rect data-role="card-boundary" x="40" y="505" width="1120" height="350" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <circle cx="72" cy="543" r="19" fill="#005a9e"/><text x="72" y="550" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><text x="112" y="551" font-size="27" font-weight="600">File-share witness</text><g data-card="file-share-cluster">
    <rect data-role="card-boundary" x="80" y="585" width="240" height="220" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="200" y="619" font-size="22" text-anchor="middle" font-weight="600">Azure Local cluster</text><use href="#icon-host" x="168" y="637" width="64" height="64" aria-hidden="true" data-role="icon"/><text x="200" y="744" font-size="20" text-anchor="middle">All cluster nodes</text><text x="200" y="776" font-size="20" text-anchor="middle">need access</text>
  </g><text x="385" y="666" font-size="20" text-anchor="middle" fill="#40566d">SMB</text><line x1="332" y1="695" x2="438" y2="695" stroke="#46637b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" data-role="connector"/><text x="385" y="731" font-size="18" text-anchor="middle" fill="#40566d">2 or later</text><g data-card="file-share-resource">
    <rect data-role="card-boundary" x="450" y="585" width="250" height="220" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="575" y="619" font-size="22" text-anchor="middle" font-weight="600">Dedicated SMB share</text><use href="#icon-share" x="545" y="636" width="60" height="60" aria-hidden="true" data-role="icon"/><text x="575" y="726" font-size="19" text-anchor="middle">Arbitration log</text>
<text x="575" y="758" font-size="19" text-anchor="middle">No cluster database</text>
<text x="575" y="790" font-size="19" text-anchor="middle">No workload data</text>
  </g><g data-card="file-share-requirements">
    <rect data-role="card-boundary" x="750" y="585" width="370" height="220" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5"/>
    <text x="772" y="621" font-size="23" font-weight="600" fill="#005a9e">Requirements</text><text x="772" y="663" font-size="20" >SMB 2+; at least 5 MB free</text>
<text x="772" y="695" font-size="20" >Dedicated to one cluster</text>
<text x="772" y="727" font-size="20" >Cluster read/write access</text>
<text x="772" y="759" font-size="20" >No application data</text>
<text x="772" y="791" font-size="20" >Independent share host</text>
  </g><text x="80" y="837" font-size="20" >Supported S2D option when Azure connectivity is unavailable or unreliable.</text>
  </g>
<g data-card="option-3">
    <rect data-role="card-boundary" x="40" y="885" width="1120" height="350" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <circle cx="72" cy="923" r="19" fill="#005a9e"/><text x="72" y="930" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><text x="112" y="931" font-size="27" font-weight="600">Disk witness</text><g data-card="disk-cluster">
    <rect data-role="card-boundary" x="80" y="965" width="240" height="220" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="200" y="999" font-size="22" text-anchor="middle" font-weight="600">Azure Local cluster</text><use href="#icon-host" x="168" y="1017" width="64" height="64" aria-hidden="true" data-role="icon"/><text x="200" y="1124" font-size="20" text-anchor="middle">All cluster nodes</text><text x="200" y="1156" font-size="20" text-anchor="middle">need access</text>
  </g><text x="385" y="1046" font-size="20" text-anchor="middle" fill="#40566d">SAN</text><line x1="332" y1="1075" x2="438" y2="1075" stroke="#46637b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" data-role="connector"/><text x="385" y="1111" font-size="18" text-anchor="middle" fill="#40566d">paths</text><g data-card="disk-resource">
    <rect data-role="card-boundary" x="450" y="965" width="250" height="220" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="575" y="999" font-size="22" text-anchor="middle" font-weight="600">Shared witness disk</text><use href="#icon-disk" x="545" y="1016" width="60" height="60" aria-hidden="true" data-role="icon"/><text x="575" y="1106" font-size="19" text-anchor="middle">Cluster configuration</text>
<text x="575" y="1138" font-size="19" text-anchor="middle">database copy</text>
<text x="575" y="1170" font-size="19" text-anchor="middle">No workload data</text>
  </g><g data-card="disk-requirements">
    <rect data-role="card-boundary" x="750" y="965" width="370" height="220" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5"/>
    <text x="772" y="1001" font-size="23" font-weight="600" fill="#005a9e">Rack-aware SAN preview</text><text x="772" y="1043" font-size="20" >Dedicated 1-GB LUN</text>
<text x="772" y="1075" font-size="20" >NTFS formatted</text>
<text x="772" y="1107" font-size="20" >Synchronous replication</text>
<text x="772" y="1139" font-size="20" >Accessible from all nodes</text>
<text x="772" y="1171" font-size="20" >Not a workload CSV</text>
  </g><text x="80" y="1217" font-size="20" >1-GB profile: disaggregated rack-aware SAN preview. Disk witnesses are not supported with S2D.</text>
  </g>
    <text x="40" y="1280" font-size="22" >One configured witness per cluster. No witness provides a workload-data replica.</text>
  </g>
</svg>
