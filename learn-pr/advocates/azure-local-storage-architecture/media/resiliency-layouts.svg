<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: white">
  <title id="diagram-title">Copy count and copy placement</title>
  <desc id="diagram-description">Panel 1 shows two-way mirroring with one D copy on each of two nodes. Panel 2 shows three-way mirroring with one D copy on each of three nodes. Panel 3 shows nested two-way mirroring with two D copies on separate drives in each of two nodes. The ideal efficiencies are 50 percent, about 33 percent, and 25 percent. Data-copy survival is distinct from quorum and application availability.</desc>
  <rect x="0" y="0" width="1200" height="1020" fill="#ffffff" data-role="background"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#46637b"/></marker>
    <symbol id="icon-host" viewBox="0 0 18 18" data-source-icon="compute\10347-icon-service-Hosts.svg"><defs><linearGradient id="host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf" x1="9.02" y1="5.46" x2="9.02" y2="0.65" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-a07223d6-5912-4349-a93f-23c27741ba44" x1="8.98" y1="11.97" x2="8.98" y2="7.17" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9" x1="9.02" y1="17.34" x2="9.02" y2="14.32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient></defs><g><path d="M8.46,5.46h1v9.6h-1Z" fill="#32bedd" /><path d="M15.48.65H2.56A.58.58,0,0,0,2,1.23V4.88a.58.58,0,0,0,.57.58H15.48a.57.57,0,0,0,.57-.58V1.23A.57.57,0,0,0,15.48.65Z" fill="url(#host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf)" /><path d="M15.44,7.17H2.52A.57.57,0,0,0,2,7.74V11.4a.56.56,0,0,0,.57.57H15.44A.57.57,0,0,0,16,11.4V7.74A.58.58,0,0,0,15.44,7.17Z" fill="url(#host-a07223d6-5912-4349-a93f-23c27741ba44)" /><circle cx="9.06" cy="15.84" r="1.51" fill="#7fba00" /><circle cx="9.02" cy="15.83" r="1.51" fill="url(#host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9)" /><g><rect x="13.72" y="1.55" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="3.36" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g><g><rect x="13.72" y="8.04" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="9.85" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g></g></symbol>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="40" y="52" font-size="32" font-weight="600">Copy count and copy placement</text>
    <text x="40" y="89" font-size="20" fill="#40566d">Read panels 1 to 3. Each node box is a server fault domain; each D is a full copy.</text>
    <g data-card="layout-1"><rect x="40" y="125" width="1120" height="250" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="163" r="19" fill="#005a9e"/><text x="72" y="170" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><text x="112" y="171" font-size="26" font-weight="600">Two-way mirror</text><g data-card="two-node-a"><rect x="100" y="195" width="290" height="115" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="120" y="227" font-size="22" font-weight="600">Node A</text><use href="#icon-host" x="332" y="204" width="36" height="36" aria-hidden="true" data-role="icon"/><g data-card="two-node-a-copy"><rect x="120" y="251" width="250" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="245" y="282" font-size="20" text-anchor="middle">D: one copy</text></g></g><g data-card="two-node-b"><rect x="440" y="195" width="290" height="115" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="460" y="227" font-size="22" font-weight="600">Node B</text><use href="#icon-host" x="672" y="204" width="36" height="36" aria-hidden="true" data-role="icon"/><g data-card="two-node-b-copy"><rect x="460" y="251" width="250" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="585" y="282" font-size="20" text-anchor="middle">D: one copy</text></g></g><text x="815" y="232" font-size="22" >2 physical units</text>
<text x="815" y="264" font-size="22" >for 1 logical unit</text>
<text x="815" y="296" font-size="22" >50% efficiency</text><text x="70" y="348" font-size="21" >One copy per node. One node loss leaves data; quorum still matters.</text></g><g data-card="layout-2"><rect x="40" y="410" width="1120" height="250" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="448" r="19" fill="#005a9e"/><text x="72" y="455" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><text x="112" y="456" font-size="26" font-weight="600">Three-way mirror</text><g data-card="three-node-a"><rect x="80" y="480" width="210" height="115" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="100" y="512" font-size="22" font-weight="600">Node A</text><use href="#icon-host" x="232" y="489" width="36" height="36" aria-hidden="true" data-role="icon"/><g data-card="three-node-a-copy"><rect x="100" y="536" width="170" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="185" y="567" font-size="20" text-anchor="middle">D: one copy</text></g></g><g data-card="three-node-b"><rect x="320" y="480" width="210" height="115" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="340" y="512" font-size="22" font-weight="600">Node B</text><use href="#icon-host" x="472" y="489" width="36" height="36" aria-hidden="true" data-role="icon"/><g data-card="three-node-b-copy"><rect x="340" y="536" width="170" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="425" y="567" font-size="20" text-anchor="middle">D: one copy</text></g></g><g data-card="three-node-c"><rect x="560" y="480" width="210" height="115" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="580" y="512" font-size="22" font-weight="600">Node C</text><use href="#icon-host" x="712" y="489" width="36" height="36" aria-hidden="true" data-role="icon"/><g data-card="three-node-c-copy"><rect x="580" y="536" width="170" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="665" y="567" font-size="20" text-anchor="middle">D: one copy</text></g></g><text x="815" y="517" font-size="22" >3 physical units</text>
<text x="815" y="549" font-size="22" >for 1 logical unit</text>
<text x="815" y="581" font-size="22" >About 33% efficiency</text><text x="70" y="633" font-size="21" >Two-copy loss is covered by data protection, not an unconditional uptime guarantee.</text></g><g data-card="layout-3"><rect x="40" y="695" width="1120" height="250" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="733" r="19" fill="#005a9e"/><text x="72" y="740" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><text x="112" y="741" font-size="26" font-weight="600">Nested two-way mirror</text><g data-card="nested-node-a"><rect x="100" y="765" width="290" height="115" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="120" y="797" font-size="22" font-weight="600">Node A</text><use href="#icon-host" x="332" y="774" width="36" height="36" aria-hidden="true" data-role="icon"/><g data-card="nested-node-a-drive-1"><rect x="120" y="821" width="118" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="179" y="850" font-size="17" text-anchor="middle">D / drive 1</text></g><g data-card="nested-node-a-drive-2"><rect x="252" y="821" width="118" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="311" y="850" font-size="17" text-anchor="middle">D / drive 2</text></g></g><g data-card="nested-node-b"><rect x="440" y="765" width="290" height="115" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="460" y="797" font-size="22" font-weight="600">Node B</text><use href="#icon-host" x="672" y="774" width="36" height="36" aria-hidden="true" data-role="icon"/><g data-card="nested-node-b-drive-1"><rect x="460" y="821" width="118" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="519" y="850" font-size="17" text-anchor="middle">D / drive 1</text></g><g data-card="nested-node-b-drive-2"><rect x="592" y="821" width="118" height="46" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="651" y="850" font-size="17" text-anchor="middle">D / drive 2</text></g></g><text x="815" y="802" font-size="22" >4 physical units</text>
<text x="815" y="834" font-size="22" >for 1 logical unit</text>
<text x="815" y="866" font-size="22" >25% efficiency</text><text x="70" y="918" font-size="21" >Two copies per node: protects a node failure plus a capacity-drive failure.</text></g><text x="40" y="990" font-size="20" >D is the same data item. These ordinary layouts do not define rack-aware support.</text>
  </g>
</svg>
