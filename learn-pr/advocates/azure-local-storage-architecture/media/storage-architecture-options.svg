<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: white">
  <title id="diagram-title">Three Azure Local storage architectures</title>
  <desc id="diagram-description">Read numbered panels 1 to 3 from top to bottom. Panel 1 shows hyperconverged local storage: the same nodes run workloads and contribute directly attached drives to Storage Spaces Direct. Compute and local storage share the cluster, with drives and resiliency selected for the node count. Panel 2 shows hyperconverged external storage: local Storage Spaces Direct coexists with qualified external-array volumes reached through SAN paths. Local infrastructure remains required and local-pool and array protection are assessed separately. Panel 3 shows disaggregated external storage: arrays supply storage independently of compute nodes, allowing separate scaling within solution limits. Adding compute does not add array capacity or bandwidth.</desc>
  <rect x="0" y="0" width="1200" height="1220" fill="#ffffff" data-role="background"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#46637b"/></marker>
    <symbol id="icon-vm" viewBox="0 0 18 18" data-source-icon="compute\10021-icon-service-Virtual-Machine.svg"><defs><linearGradient id="vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></symbol>
    <symbol id="icon-disk" viewBox="0 0 18 18" data-source-icon="compute\10032-icon-service-Disks.svg"><defs><linearGradient id="disk-a3aecb5c-11f5-4ece-99f7-9672f3236156" x1="15.35" y1="13.41" x2="15.37" y2="13.41" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.14" stop-color="#1782da" /><stop offset="0.37" stop-color="#368fe3" /><stop offset="0.59" stop-color="#4c98ea" /><stop offset="0.8" stop-color="#599eee" /><stop offset="0.99" stop-color="#5ea0ef" /></linearGradient><linearGradient id="disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc" x1="5.51" y1="802.5" x2="12.94" y2="810.58" gradientTransform="translate(0 -1278.76) scale(1 1.59)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.02" stop-color="#0d7ed8" /><stop offset="0.08" stop-color="#2b8ae0" /><stop offset="0.15" stop-color="#4194e7" /><stop offset="0.22" stop-color="#519beb" /><stop offset="0.29" stop-color="#5b9fee" /><stop offset="0.4" stop-color="#5ea0ef" /><stop offset="0.55" stop-color="#5b9fee" /><stop offset="0.68" stop-color="#509aeb" /><stop offset="0.8" stop-color="#3f92e6" /><stop offset="0.91" stop-color="#2688df" /><stop offset="0.99" stop-color="#127fd9" /></linearGradient></defs><ellipse cx="8.96" cy="11.82" rx="7.5" ry="3.08" fill="#76bc2d" /><ellipse cx="9.15" cy="11.79" rx="2.49" ry="0.68" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><ellipse cx="8.96" cy="4.99" rx="7.5" ry="3.08" fill="url(#disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc)" /><ellipse cx="9.15" cy="4.95" rx="2.49" ry="0.68" fill="#005ba1" /><path d="M9,14.84c4.15,0,7.5-1.38,7.5-3.08h0v1.82h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V11.76C1.46,13.46,4.82,14.84,9,14.84Z" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><path d="M9,8c4.15,0,7.5-1.38,7.5-3.08h0V6.74h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V4.92C1.46,6.62,4.82,8,9,8Z" fill="#0078d4" /></symbol>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="40" y="52" font-size="32" font-weight="600">Three Azure Local storage architectures</text>
    <text x="40" y="89" font-size="20" fill="#40566d">Read panels 1 to 3. Compare where protection lives and how compute and storage scale.</text>
    <g data-card="architecture-1">
    <rect data-role="card-boundary" x="40" y="125" width="1120" height="320" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <circle cx="72" cy="163" r="19" fill="#005a9e"/><text x="72" y="170" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><text x="112" y="171" font-size="27" font-weight="600">Hyperconverged with local storage</text><g data-card="local-cluster">
    <rect data-role="card-boundary" x="80" y="205" width="600" height="200" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="100" y="237" font-size="22" font-weight="600">One cluster: compute + Storage Spaces Direct</text><g data-card="local-node-a">
    <rect data-role="card-boundary" x="100" y="257" width="250" height="125" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <text x="120" y="289" font-size="21" font-weight="600">Node A</text><use href="#icon-vm" x="124" y="299" width="42" height="42" aria-hidden="true" data-role="icon"/><use href="#icon-disk" x="272" y="299" width="42" height="42" aria-hidden="true" data-role="icon"/><text x="116" y="365" font-size="17" >Workloads</text><text x="251" y="365" font-size="17" >Local drives</text>
  </g><g data-card="local-node-b">
    <rect data-role="card-boundary" x="410" y="257" width="250" height="125" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <text x="430" y="289" font-size="21" font-weight="600">Node B</text><use href="#icon-vm" x="434" y="299" width="42" height="42" aria-hidden="true" data-role="icon"/><use href="#icon-disk" x="582" y="299" width="42" height="42" aria-hidden="true" data-role="icon"/><text x="426" y="365" font-size="17" >Workloads</text><text x="561" y="365" font-size="17" >Local drives</text>
  </g>
  </g><g data-card="local-implications">
    <rect data-role="card-boundary" x="740" y="205" width="380" height="200" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5"/>
    <text x="762" y="241" font-size="24" font-weight="600" fill="#005a9e">Scale within one cluster</text><text x="762" y="279" font-size="22" >Compute and local storage</text>
<text x="762" y="313" font-size="22" >share the same machines.</text>
<text x="762" y="347" font-size="22" >Choose drives and resiliency</text>
<text x="762" y="381" font-size="22" >for the cluster's node count.</text>
  </g><text x="80" y="429" font-size="20" >Local-drive protection is implemented by Storage Spaces Direct.</text>
  </g><g data-card="architecture-2">
    <rect data-role="card-boundary" x="40" y="475" width="1120" height="320" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <circle cx="72" cy="513" r="19" fill="#005a9e"/><text x="72" y="520" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><text x="112" y="521" font-size="27" font-weight="600">Hyperconverged with external storage</text><g data-card="hybrid-cluster">
    <rect data-role="card-boundary" x="80" y="555" width="300" height="200" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="100" y="587" font-size="22" font-weight="600">Azure Local nodes</text><use href="#icon-vm" x="120" y="613" width="48" height="48" aria-hidden="true" data-role="icon"/><use href="#icon-disk" x="260" y="613" width="48" height="48" aria-hidden="true" data-role="icon"/><text x="230" y="699" font-size="20" text-anchor="middle">Workloads and</text><text x="230" y="733" font-size="20" text-anchor="middle">local S2D storage</text>
  </g><text x="440" y="625" font-size="20" text-anchor="middle" fill="#40566d">SAN</text><line x1="392" y1="652" x2="488" y2="652" stroke="#46637b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" data-role="connector"/><text x="440" y="686" font-size="18" text-anchor="middle" fill="#40566d">paths</text><g data-card="hybrid-array">
    <rect data-role="card-boundary" x="500" y="555" width="180" height="200" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="590" y="587" font-size="24" text-anchor="middle" font-weight="600">Array</text><use href="#icon-disk" x="563" y="613" width="54" height="54" aria-hidden="true" data-role="icon"/><text x="590" y="699" font-size="22" text-anchor="middle">External</text><text x="590" y="733" font-size="22" text-anchor="middle">volumes</text>
  </g><g data-card="hybrid-implications">
    <rect data-role="card-boundary" x="740" y="555" width="380" height="200" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5"/>
    <text x="762" y="591" font-size="24" font-weight="600" fill="#005a9e">Review two systems</text><text x="762" y="629" font-size="22" >Local infrastructure remains.</text>
<text x="762" y="663" font-size="22" >Assess local-pool protection</text>
<text x="762" y="697" font-size="22" >and array protection</text>
<text x="762" y="731" font-size="22" >separately.</text>
  </g><text x="80" y="779" font-size="20" >The external array adds volumes; required local infrastructure storage remains.</text>
  </g><g data-card="architecture-3">
    <rect data-role="card-boundary" x="40" y="825" width="1120" height="320" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5"/>
    <circle cx="72" cy="863" r="19" fill="#005a9e"/><text x="72" y="870" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><text x="112" y="871" font-size="27" font-weight="600">Disaggregated with external storage</text><g data-card="compute-cluster">
    <rect data-role="card-boundary" x="80" y="905" width="300" height="200" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="100" y="937" font-size="22" font-weight="600">Azure Local nodes</text><use href="#icon-vm" x="193" y="958" width="74" height="74" aria-hidden="true" data-role="icon"/><text x="230" y="1076" font-size="22" text-anchor="middle">Compute workloads</text>
  </g><text x="440" y="975" font-size="20" text-anchor="middle" fill="#40566d">SAN</text><line x1="392" y1="1002" x2="488" y2="1002" stroke="#46637b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" data-role="connector"/><text x="440" y="1036" font-size="18" text-anchor="middle" fill="#40566d">paths</text><g data-card="disaggregated-array">
    <rect data-role="card-boundary" x="500" y="905" width="180" height="200" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5"/>
    <text x="590" y="937" font-size="24" text-anchor="middle" font-weight="600">Array</text><use href="#icon-disk" x="563" y="963" width="54" height="54" aria-hidden="true" data-role="icon"/><text x="590" y="1049" font-size="22" text-anchor="middle">External</text><text x="590" y="1083" font-size="22" text-anchor="middle">volumes</text>
  </g><g data-card="disaggregated-implications">
    <rect data-role="card-boundary" x="740" y="905" width="380" height="200" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5"/>
    <text x="762" y="941" font-size="24" font-weight="600" fill="#005a9e">Scale independently</text><text x="762" y="979" font-size="22" >Compute and storage have</text>
<text x="762" y="1013" font-size="22" >separate capacity limits.</text>
<text x="762" y="1047" font-size="22" >More nodes do not add</text>
<text x="762" y="1081" font-size="22" >array capacity or bandwidth.</text>
  </g><text x="80" y="1129" font-size="20" >The array supplies storage and protection independently of the compute machines.</text>
  </g>
    <text x="40" y="1187" font-size="20" >Conceptual architectures; supported configurations depend on the release and qualified solution.</text>
  </g>
</svg>
