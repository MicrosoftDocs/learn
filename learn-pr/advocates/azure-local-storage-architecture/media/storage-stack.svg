<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: white">
  <title id="diagram-title">Follow the storage layers</title>
  <desc id="diagram-description">Two ordered five-layer stacks. Local drives feed Storage Spaces Direct, then a resilient virtual disk, a supported filesystem and CSV, and workload placement. An external array protects its own drives and presents a LUN through redundant paths to a host-visible disk, an NTFS CSV, and workload placement. An Azure Local storage path adds no data copies.</desc>
  <rect x="0" y="0" width="1200" height="1080" fill="#ffffff" data-role="background"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#46637b"/></marker>
    <symbol id="icon-host" viewBox="0 0 18 18" data-source-icon="compute\10347-icon-service-Hosts.svg"><defs><linearGradient id="host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf" x1="9.02" y1="5.46" x2="9.02" y2="0.65" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-a07223d6-5912-4349-a93f-23c27741ba44" x1="8.98" y1="11.97" x2="8.98" y2="7.17" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9" x1="9.02" y1="17.34" x2="9.02" y2="14.32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient></defs><g><path d="M8.46,5.46h1v9.6h-1Z" fill="#32bedd" /><path d="M15.48.65H2.56A.58.58,0,0,0,2,1.23V4.88a.58.58,0,0,0,.57.58H15.48a.57.57,0,0,0,.57-.58V1.23A.57.57,0,0,0,15.48.65Z" fill="url(#host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf)" /><path d="M15.44,7.17H2.52A.57.57,0,0,0,2,7.74V11.4a.56.56,0,0,0,.57.57H15.44A.57.57,0,0,0,16,11.4V7.74A.58.58,0,0,0,15.44,7.17Z" fill="url(#host-a07223d6-5912-4349-a93f-23c27741ba44)" /><circle cx="9.06" cy="15.84" r="1.51" fill="#7fba00" /><circle cx="9.02" cy="15.83" r="1.51" fill="url(#host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9)" /><g><rect x="13.72" y="1.55" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="3.36" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g><g><rect x="13.72" y="8.04" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="9.85" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g></g></symbol>
<symbol id="icon-disk" viewBox="0 0 18 18" data-source-icon="compute\10032-icon-service-Disks.svg"><defs><linearGradient id="disk-a3aecb5c-11f5-4ece-99f7-9672f3236156" x1="15.35" y1="13.41" x2="15.37" y2="13.41" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.14" stop-color="#1782da" /><stop offset="0.37" stop-color="#368fe3" /><stop offset="0.59" stop-color="#4c98ea" /><stop offset="0.8" stop-color="#599eee" /><stop offset="0.99" stop-color="#5ea0ef" /></linearGradient><linearGradient id="disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc" x1="5.51" y1="802.5" x2="12.94" y2="810.58" gradientTransform="translate(0 -1278.76) scale(1 1.59)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.02" stop-color="#0d7ed8" /><stop offset="0.08" stop-color="#2b8ae0" /><stop offset="0.15" stop-color="#4194e7" /><stop offset="0.22" stop-color="#519beb" /><stop offset="0.29" stop-color="#5b9fee" /><stop offset="0.4" stop-color="#5ea0ef" /><stop offset="0.55" stop-color="#5b9fee" /><stop offset="0.68" stop-color="#509aeb" /><stop offset="0.8" stop-color="#3f92e6" /><stop offset="0.91" stop-color="#2688df" /><stop offset="0.99" stop-color="#127fd9" /></linearGradient></defs><ellipse cx="8.96" cy="11.82" rx="7.5" ry="3.08" fill="#76bc2d" /><ellipse cx="9.15" cy="11.79" rx="2.49" ry="0.68" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><ellipse cx="8.96" cy="4.99" rx="7.5" ry="3.08" fill="url(#disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc)" /><ellipse cx="9.15" cy="4.95" rx="2.49" ry="0.68" fill="#005ba1" /><path d="M9,14.84c4.15,0,7.5-1.38,7.5-3.08h0v1.82h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V11.76C1.46,13.46,4.82,14.84,9,14.84Z" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><path d="M9,8c4.15,0,7.5-1.38,7.5-3.08h0V6.74h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V4.92C1.46,6.62,4.82,8,9,8Z" fill="#0078d4" /></symbol>
<symbol id="icon-vm" viewBox="0 0 18 18" data-source-icon="compute\10021-icon-service-Virtual-Machine.svg"><defs><linearGradient id="vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></symbol>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="40" y="52" font-size="32" font-weight="600">Follow the storage layers</text>
    <text x="40" y="89" font-size="20" fill="#40566d">Read each column from top to bottom. Numbers show layers, not a packet trace.</text>
    <text x="40" y="140" font-size="23" font-weight="700">LOCAL STORAGE</text><text x="630" y="140" font-size="23" font-weight="700">EXTERNAL ARRAY</text><g data-card="column-1-layer-1"><rect x="40" y="170" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="69" cy="205" r="19" fill="#005a9e"/><text x="69" y="212" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><use href="#icon-disk" x="101" y="186" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="154" y="213" font-size="24" font-weight="600">Direct-attached drives</text><text x="64" y="254" font-size="22" >Qualified drives on each host</text>
<text x="64" y="288" font-size="22" >Physical capacity and device health</text></g><line x1="305" y1="316" x2="305" y2="334" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-1-layer-2"><rect x="40" y="342" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="69" cy="377" r="19" fill="#005a9e"/><text x="69" y="384" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><use href="#icon-host" x="101" y="358" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="154" y="385" font-size="24" font-weight="600">Storage Spaces Direct</text><text x="64" y="426" font-size="22" >Pools eligible local drives</text>
<text x="64" y="460" font-size="22" >Places copies across fault domains</text></g><line x1="305" y1="488" x2="305" y2="506" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-1-layer-3"><rect x="40" y="514" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="69" cy="549" r="19" fill="#005a9e"/><text x="69" y="556" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><use href="#icon-disk" x="101" y="530" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="154" y="557" font-size="24" font-weight="600">Resilient virtual disk</text><text x="64" y="598" font-size="22" >Mirror or supported parity layout</text>
<text x="64" y="632" font-size="22" >Logical size and physical footprint</text></g><line x1="305" y1="660" x2="305" y2="678" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-1-layer-4"><rect x="40" y="686" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="69" cy="721" r="19" fill="#005a9e"/><text x="69" y="728" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">4</text><use href="#icon-disk" x="101" y="702" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="154" y="729" font-size="24" font-weight="600">Filesystem and CSV</text><text x="64" y="770" font-size="22" >Supported ReFS or NTFS</text>
<text x="64" y="804" font-size="22" >Shared clustered access to files</text></g><line x1="305" y1="832" x2="305" y2="850" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-1-layer-5"><rect x="40" y="858" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="69" cy="893" r="19" fill="#005a9e"/><text x="69" y="900" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">5</text><use href="#icon-vm" x="101" y="874" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="154" y="901" font-size="24" font-weight="600">Workload placement</text><text x="64" y="942" font-size="22" >Azure Local storage path and VM files</text>
<text x="64" y="976" font-size="22" >References storage; adds no copies</text></g><g data-card="column-2-layer-1"><rect x="630" y="170" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="659" cy="205" r="19" fill="#005a9e"/><text x="659" y="212" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><use href="#icon-disk" x="691" y="186" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="744" y="213" font-size="24" font-weight="600">Array drives</text><text x="654" y="254" font-size="22" >Array manages underlying protection</text>
<text x="654" y="288" font-size="22" >Capacity and health from the array</text></g><line x1="895" y1="316" x2="895" y2="334" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-2-layer-2"><rect x="630" y="342" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="659" cy="377" r="19" fill="#005a9e"/><text x="659" y="384" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><use href="#icon-host" x="691" y="358" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="744" y="385" font-size="24" font-weight="600">LUN and redundant paths</text><text x="654" y="426" font-size="22" >FC, iSCSI, or qualified integration</text>
<text x="654" y="460" font-size="22" >MPIO manages access to one device</text></g><line x1="895" y1="488" x2="895" y2="506" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-2-layer-3"><rect x="630" y="514" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="659" cy="549" r="19" fill="#005a9e"/><text x="659" y="556" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><use href="#icon-disk" x="691" y="530" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="744" y="557" font-size="24" font-weight="600">Host-visible logical disk</text><text x="654" y="598" font-size="22" >Array protection remains below</text>
<text x="654" y="632" font-size="22" >Do not add this LUN to an S2D pool</text></g><line x1="895" y1="660" x2="895" y2="678" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-2-layer-4"><rect x="630" y="686" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="659" cy="721" r="19" fill="#005a9e"/><text x="659" y="728" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">4</text><use href="#icon-disk" x="691" y="702" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="744" y="729" font-size="24" font-weight="600">NTFS and CSV</text><text x="654" y="770" font-size="22" >NTFS required for array-backed CSVs</text>
<text x="654" y="804" font-size="22" >One data LUN per CSV</text></g><line x1="895" y1="832" x2="895" y2="850" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><g data-card="column-2-layer-5"><rect x="630" y="858" width="530" height="140" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="659" cy="893" r="19" fill="#005a9e"/><text x="659" y="900" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">5</text><use href="#icon-vm" x="691" y="874" width="38" height="38" aria-hidden="true" data-role="icon"/><text x="744" y="901" font-size="24" font-weight="600">Workload placement</text><text x="654" y="942" font-size="22" >Azure Local storage path and VM files</text>
<text x="654" y="976" font-size="22" >References storage; adds no copies</text></g><text x="40" y="1047" font-size="20" >Similar workload placement does not imply the same protection or maintenance workflow.</text>
  </g>
</svg>
