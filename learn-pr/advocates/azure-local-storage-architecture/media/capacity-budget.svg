<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: white">
  <title id="diagram-title">Build a workload capacity budget</title>
  <desc id="diagram-description">Start with 80 TiB physical. Subtract 2 TiB overhead and 10 TiB repair reserve to leave 68 TiB. Three-way mirroring divides that amount by three, yielding approximately 22.7 TiB logical. Allocate 1 TiB to infrastructure and 3 TiB to planned growth, leaving approximately 18.7 TiB for current workloads. The amounts are illustrative, rounded, and must not be double-counted.</desc>
  <rect x="0" y="0" width="1200" height="950" fill="#ffffff" data-role="background"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#46637b"/></marker>
    <symbol id="icon-disk" viewBox="0 0 18 18" data-source-icon="compute\10032-icon-service-Disks.svg"><defs><linearGradient id="disk-a3aecb5c-11f5-4ece-99f7-9672f3236156" x1="15.35" y1="13.41" x2="15.37" y2="13.41" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.14" stop-color="#1782da" /><stop offset="0.37" stop-color="#368fe3" /><stop offset="0.59" stop-color="#4c98ea" /><stop offset="0.8" stop-color="#599eee" /><stop offset="0.99" stop-color="#5ea0ef" /></linearGradient><linearGradient id="disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc" x1="5.51" y1="802.5" x2="12.94" y2="810.58" gradientTransform="translate(0 -1278.76) scale(1 1.59)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.02" stop-color="#0d7ed8" /><stop offset="0.08" stop-color="#2b8ae0" /><stop offset="0.15" stop-color="#4194e7" /><stop offset="0.22" stop-color="#519beb" /><stop offset="0.29" stop-color="#5b9fee" /><stop offset="0.4" stop-color="#5ea0ef" /><stop offset="0.55" stop-color="#5b9fee" /><stop offset="0.68" stop-color="#509aeb" /><stop offset="0.8" stop-color="#3f92e6" /><stop offset="0.91" stop-color="#2688df" /><stop offset="0.99" stop-color="#127fd9" /></linearGradient></defs><ellipse cx="8.96" cy="11.82" rx="7.5" ry="3.08" fill="#76bc2d" /><ellipse cx="9.15" cy="11.79" rx="2.49" ry="0.68" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><ellipse cx="8.96" cy="4.99" rx="7.5" ry="3.08" fill="url(#disk-b4dfb3ab-25fe-416c-a6fa-f33fcfbf22dc)" /><ellipse cx="9.15" cy="4.95" rx="2.49" ry="0.68" fill="#005ba1" /><path d="M9,14.84c4.15,0,7.5-1.38,7.5-3.08h0v1.82h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V11.76C1.46,13.46,4.82,14.84,9,14.84Z" fill="#5e9624" /><path d="M15.35,13.4l0,0Z" fill="url(#disk-a3aecb5c-11f5-4ece-99f7-9672f3236156)" /><path d="M9,8c4.15,0,7.5-1.38,7.5-3.08h0V6.74h0c-.14,1.65-3.44,3-7.5,3s-7.5-1.38-7.5-3.08V4.92C1.46,6.62,4.82,8,9,8Z" fill="#0078d4" /></symbol>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="40" y="52" font-size="32" font-weight="600">Build a workload capacity budget</text>
    <text x="40" y="89" font-size="20" fill="#40566d">Read top to bottom. Do not mix physical deductions with logical allocations.</text>
    <g data-card="physical-budget"><rect x="40" y="130" width="1120" height="210" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="168" r="19" fill="#005a9e"/><text x="72" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><text x="112" y="176" font-size="26" font-weight="600">Physical budget: 80 TiB</text><use href="#icon-disk" x="1060" y="146" width="44" height="44" aria-hidden="true" data-role="icon"/><rect x="80" y="215" width="884" height="52" fill="#dcebfa"/><rect x="964" y="215" width="130" height="52" fill="#007c73"/><rect x="1094" y="215" width="26" height="52" fill="#697d8d"/><text x="102" y="249" font-size="24" font-weight="600">68 TiB eligible for resilient allocation</text><rect x="80" y="291" width="16" height="16" fill="#dcebfa"/><text x="106" y="306" font-size="20" >68 TiB remaining</text><rect x="535" y="291" width="16" height="16" fill="#007c73"/><text x="561" y="306" font-size="20" >10 TiB repair reserve</text><rect x="895" y="291" width="16" height="16" fill="#697d8d"/><text x="921" y="306" font-size="20" >2 TiB overhead</text></g><line x1="600" y1="352" x2="600" y2="406" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="630" y="386" font-size="20" fill="#40566d">Apply the protection ratio</text><g data-card="protection-ratio"><rect x="40" y="420" width="1120" height="150" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="458" r="19" fill="#005a9e"/><text x="72" y="465" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><text x="112" y="466" font-size="26" font-weight="600">Convert physical to logical capacity</text><text x="112" y="511" font-size="29" font-weight="600">68 TiB / 3 copies = approximately 22.7 TiB logical</text><text x="112" y="546" font-size="22" >Three-way mirror; before infrastructure and growth allocations.</text></g><line x1="600" y1="582" x2="600" y2="636" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="630" y="616" font-size="20" fill="#40566d">Budget logical allocations</text><g data-card="logical-budget"><rect x="40" y="650" width="1120" height="220" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="688" r="19" fill="#005a9e"/><text x="72" y="695" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><text x="112" y="696" font-size="26" font-weight="600">Allocate the logical budget</text><g data-card="current-workloads"><rect x="80" y="725" width="590" height="104" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="104" y="767" font-size="29" font-weight="600">Approximately 18.7 TiB</text><text x="104" y="803" font-size="22" >Current workloads</text></g><g data-card="infrastructure"><rect x="700" y="725" width="180" height="104" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="720" y="767" font-size="29" font-weight="600">1 TiB</text><text x="715" y="803" font-size="20" >Infrastructure</text></g><g data-card="growth"><rect x="910" y="725" width="210" height="104" rx="10" fill="#edf8f5" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="930" y="767" font-size="29" font-weight="600">3 TiB</text><text x="930" y="803" font-size="20" >Planned growth</text></g></g><text x="40" y="918" font-size="20" >Illustrative assumptions, not universal reserves. Repair space must be usable where rebuilding occurs.</text>
  </g>
</svg>
