<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1065" viewBox="0 0 1200 1065" role="img" aria-labelledby="diagram-title diagram-description" style="background-color: white">
  <title id="diagram-title">Rack partition: ownership is not data availability</title>
  <desc id="diagram-description">Panel 1 shows two racks with two nodes each and one illustrative copy per node in the prescribed four-copy layout. A partition separates the racks. Panel 2 assumes four active node votes and one witness vote, with Zone A winning witness arbitration. Zone A has three of five votes and Zone B has two. Panel 3 requires independent confirmation of pool metadata, usable data and paths, surviving resources, and application health. The witness stores no workload copy.</desc>
  <rect x="0" y="0" width="1200" height="1065" fill="#ffffff" data-role="background"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#46637b"/></marker>
    <symbol id="icon-host" viewBox="0 0 18 18" data-source-icon="compute\10347-icon-service-Hosts.svg"><defs><linearGradient id="host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf" x1="9.02" y1="5.46" x2="9.02" y2="0.65" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-a07223d6-5912-4349-a93f-23c27741ba44" x1="8.98" y1="11.97" x2="8.98" y2="7.17" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient><linearGradient id="host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9" x1="9.02" y1="17.34" x2="9.02" y2="14.32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="1" stop-color="#32d4f5" /></linearGradient></defs><g><path d="M8.46,5.46h1v9.6h-1Z" fill="#32bedd" /><path d="M15.48.65H2.56A.58.58,0,0,0,2,1.23V4.88a.58.58,0,0,0,.57.58H15.48a.57.57,0,0,0,.57-.58V1.23A.57.57,0,0,0,15.48.65Z" fill="url(#host-aa3419c0-cd8f-4ac0-8da9-8de597fd3cbf)" /><path d="M15.44,7.17H2.52A.57.57,0,0,0,2,7.74V11.4a.56.56,0,0,0,.57.57H15.44A.57.57,0,0,0,16,11.4V7.74A.58.58,0,0,0,15.44,7.17Z" fill="url(#host-a07223d6-5912-4349-a93f-23c27741ba44)" /><circle cx="9.06" cy="15.84" r="1.51" fill="#7fba00" /><circle cx="9.02" cy="15.83" r="1.51" fill="url(#host-f8b2b35f-4e8d-49ce-8b60-0d07f0c093e9)" /><g><rect x="13.72" y="1.55" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="3.36" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g><g><rect x="13.72" y="8.04" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /><rect x="13.72" y="9.85" width="1.05" height="1.05" rx="0.15" fill="#b4ec36" /></g></g></symbol>
<symbol id="icon-witness" viewBox="0 0 18 18" data-source-icon="storage\10086-icon-service-Storage-Accounts.svg"><defs><linearGradient id="witness-ad4c4f96-09aa-4f91-ba10-5cb8ad530f74" x1="9" y1="15.83" x2="9" y2="5.79" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b3b3b3" /><stop offset="0.26" stop-color="#c1c1c1" /><stop offset="1" stop-color="#e6e6e6" /></linearGradient></defs><path d="M.5,5.79h17a0,0,0,0,1,0,0v9.48a.57.57,0,0,1-.57.57H1.07a.57.57,0,0,1-.57-.57V5.79A0,0,0,0,1,.5,5.79Z" fill="url(#witness-ad4c4f96-09aa-4f91-ba10-5cb8ad530f74)" /><path d="M1.07,2.17H16.93a.57.57,0,0,1,.57.57V5.79a0,0,0,0,1,0,0H.5a0,0,0,0,1,0,0V2.73A.57.57,0,0,1,1.07,2.17Z" fill="#37c2b1" /><path d="M2.81,6.89H15.18a.27.27,0,0,1,.26.27v1.4a.27.27,0,0,1-.26.27H2.81a.27.27,0,0,1-.26-.27V7.16A.27.27,0,0,1,2.81,6.89Z" fill="#fff" /><path d="M2.82,9.68H15.19a.27.27,0,0,1,.26.27v1.41a.27.27,0,0,1-.26.27H2.82a.27.27,0,0,1-.26-.27V10A.27.27,0,0,1,2.82,9.68Z" fill="#37c2b1" /><path d="M2.82,12.5H15.19a.27.27,0,0,1,.26.27v1.41a.27.27,0,0,1-.26.27H2.82a.27.27,0,0,1-.26-.27V12.77A.27.27,0,0,1,2.82,12.5Z" fill="#258277" /></symbol>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d">
    <text x="40" y="52" font-size="32" font-weight="600">Rack partition: ownership is not data availability</text>
    <text x="40" y="89" font-size="20" fill="#40566d">Illustrative 2+2 hyperconverged rack-aware cluster. Read the three panels top to bottom.</text>
    <g data-card="partition"><rect x="40" y="125" width="1120" height="285" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="163" r="19" fill="#005a9e"/><text x="72" y="170" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">1</text><text x="112" y="171" font-size="26" font-weight="600">Four copies across two failure domains</text><g data-card="zone-a"><rect x="78" y="195" width="490" height="165" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="102" y="230" font-size="24" font-weight="600">Zone A / rack A</text><g data-card="node-a1"><rect x="100" y="249" width="204" height="104" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="117" y="281" font-size="21" font-weight="600">A1</text><use href="#icon-host" x="257" y="256" width="32" height="32" aria-hidden="true" data-role="icon"/><g data-card="node-a1-data"><rect x="116" y="298" width="172" height="42" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="202" y="328" font-size="19" text-anchor="middle">D: copy 1</text></g></g><g data-card="node-a2"><rect x="340" y="249" width="204" height="104" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="357" y="281" font-size="21" font-weight="600">A2</text><use href="#icon-host" x="497" y="256" width="32" height="32" aria-hidden="true" data-role="icon"/><g data-card="node-a2-data"><rect x="356" y="298" width="172" height="42" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="442" y="328" font-size="19" text-anchor="middle">D: copy 2</text></g></g></g><g data-card="zone-b"><rect x="632" y="195" width="490" height="165" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="656" y="230" font-size="24" font-weight="600">Zone B / rack B</text><g data-card="node-b1"><rect x="654" y="249" width="204" height="104" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="671" y="281" font-size="21" font-weight="600">B1</text><use href="#icon-host" x="811" y="256" width="32" height="32" aria-hidden="true" data-role="icon"/><g data-card="node-b1-data"><rect x="670" y="298" width="172" height="42" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="756" y="328" font-size="19" text-anchor="middle">D: copy 3</text></g></g><g data-card="node-b2"><rect x="894" y="249" width="204" height="104" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="911" y="281" font-size="21" font-weight="600">B2</text><use href="#icon-host" x="1051" y="256" width="32" height="32" aria-hidden="true" data-role="icon"/><g data-card="node-b2-data"><rect x="910" y="298" width="172" height="42" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="996" y="328" font-size="19" text-anchor="middle">D: copy 4</text></g></g></g><line x1="600" y1="201" x2="600" y2="355" stroke="#a34516" stroke-width="3" stroke-dasharray="9 7" data-role="separator"/><text x="600" y="391" font-size="21" text-anchor="middle" fill="#84370f">Inter-rack link unavailable</text></g><line x1="600" y1="423" x2="600" y2="476" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="630" y="456.5" font-size="20" fill="#40566d">Observe the current votes</text><g data-card="ownership"><rect x="40" y="490" width="1120" height="215" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="528" r="19" fill="#005a9e"/><text x="72" y="535" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">2</text><text x="112" y="536" font-size="26" font-weight="600">Resolve cluster ownership</text><g data-card="witness"><rect x="80" y="565" width="300" height="90" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><use href="#icon-witness" x="98" y="587" width="44" height="44" aria-hidden="true" data-role="icon"/><text x="158" y="600" font-size="22" font-weight="600">Witness vote</text><text x="158" y="630" font-size="18" >No workload data</text></g><g data-card="winning-zone"><rect x="420" y="565" width="300" height="90" rx="10" fill="#dcebfa" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="440" y="598" font-size="22" font-weight="600">A1 + A2 + witness</text><text x="440" y="635" font-size="21" >3 of 5: may continue</text></g><g data-card="losing-zone"><rect x="760" y="565" width="360" height="90" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="780" y="598" font-size="22" font-weight="600">B1 + B2</text><text x="780" y="635" font-size="21" >2 of 5: cannot continue</text></g><text x="80" y="687" font-size="20" >Assumption: all five votes active; Zone A wins witness arbitration.</text></g><line x1="600" y1="718" x2="600" y2="771" stroke="#46637b" stroke-width="2.5" marker-end="url(#arrow)" data-role="connector"/><text x="630" y="751.5" font-size="20" fill="#40566d">Ownership is not full recovery</text><g data-card="recovery"><rect x="40" y="785" width="1120" height="210" rx="10" fill="#f2f7fc" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><circle cx="72" cy="823" r="19" fill="#005a9e"/><text x="72" y="830" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="700" data-role="stage-number">3</text><text x="112" y="831" font-size="26" font-weight="600">Verify recovery independently</text><g data-card="recovery-check-1"><rect x="80" y="865" width="245" height="90" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="98" y="901" font-size="22" font-weight="600">1. Pool metadata</text><text x="98" y="933" font-size="18" >Safe pool operation</text></g><g data-card="recovery-check-2"><rect x="345" y="865" width="245" height="90" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="363" y="901" font-size="22" font-weight="600">2. Usable data</text><text x="363" y="933" font-size="18" >Copies and paths</text></g><g data-card="recovery-check-3"><rect x="610" y="865" width="245" height="90" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="628" y="901" font-size="22" font-weight="600">3. Resources</text><text x="628" y="933" font-size="18" >Compute and headroom</text></g><g data-card="recovery-check-4"><rect x="875" y="865" width="245" height="90" rx="10" fill="#ffffff" stroke="#7894ad" stroke-width="1.5" data-role="card-boundary"/><text x="893" y="901" font-size="22" font-weight="600">4. Application</text><text x="893" y="933" font-size="18" >Service checks pass</text></g></g><text x="40" y="1035" font-size="20" >Witness arbitration establishes ownership; it does not supply missing workload data.</text>
  </g>
</svg>
