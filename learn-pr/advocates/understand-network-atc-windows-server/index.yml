title: Understand Network ATC on Windows Server 2025
summary: |
  Network ATC turns host-networking requirements into managed configuration. You declare how physical adapters will carry management, compute, and storage traffic. Network ATC creates the required host resources, applies policy, and reconciles configuration drift.

  This module follows a Windows Server 2025 Hyper-V cluster from design through operation. It explains the settings Network ATC owns, the dependencies it doesn't own, and the evidence needed before workloads can use a changed network.

  > [!NOTE]
  > Network ATC is the full product name and isn't an acronym or abbreviation. ATC as an acronym doesn't need to be spelled out and has no official expansion.
abstract: |
  After completing this module, you can:

  - Select an intent topology from workload, isolation, capacity, and failure-domain requirements.
  - Assess host, adapter, and physical-network readiness.
  - Create correctly scoped intents and explain the resulting resources.
  - Apply justified overrides without introducing competing configuration ownership.
  - Integrate host networking with Hyper-V, SMB, and live migration.
  - Validate desired state, every expected node, and actual workload paths.
  - Distinguish automatic drift remediation from an intentional policy change.
  - Diagnose provisioning, fabric, RDMA, and authentication failures.
  - Plan adoption, maintenance, monitoring, and recovery without assuming automatic rollback.
prerequisites: |
  Before starting this module, you should have:

  - Experience administering Windows Server and running PowerShell commands.
  - Familiarity with Hyper-V, failover clustering, physical networking, virtual LANs, IP addressing, and SMB storage.
  - Familiarity with remote direct memory access and data center bridging.
