<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="change-title change-desc" font-family="Segoe UI, Arial, sans-serif">
<title id="change-title">Safe Network ATC change and recovery lifecycle</title>
<desc id="change-desc">Ordered safe change workflow: one, baseline and snapshot intended and effective configuration; two, plan dependencies, protect management, and drain workloads; three, apply a supported intent change; four, validate every expected node and management, guest, SMB, RDMA and migration workloads; five, resume only after acceptance gates pass. Cluster-scoped policy can affect every node, and draining one node does not localize it. Failure from applying or validating the change branches to stop rollout and recover management and dependencies using the known-good design. Remove-NetIntent is not a rollback of generated configuration.</desc>
<rect x="0" y="0" width="1200" height="1090" fill="#ffffff"/>
<metadata>Conceptual educational diagram for Windows Server 2025 only. Embedded icon geometry is reused from: C:\Azure-Icons\CnE_Enterprise\Server (generic).svg. Original viewBoxes and aspect ratios are preserved. Not runtime output.</metadata>
