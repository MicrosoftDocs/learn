<text id="change-text-30" x="831" y="511" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >Change applied</text>
<path data-kind="connector" data-route="[[840,651],[760,651]]" d="M840 651 L760 651" fill="none" stroke="#718398" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#change-arrow)"/>
<text id="change-text-31" x="800" y="626" font-size="19" font-weight="600" fill="#4d6275" text-anchor="middle" >Pass</text>
<use href="#change-icon-server" x="37" y="559" width="135" height="135" aria-hidden="true"/>
<text id="change-text-32" x="143" y="604" font-size="22" font-weight="600" fill="#17324d" text-anchor="start" >Recovery readiness</text>
<text id="change-text-33" x="143" y="642" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >Preserve an independent</text>
<text id="change-text-34" x="143" y="672" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >management recovery path</text>
<text id="change-text-35" x="143" y="702" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >before applying changes.</text>
<path data-kind="connector" data-route="[[1160,353],[1181,353],[1181,819],[210,819],[210,855]]" d="M1160 353 L1181 353 L1181 819 L210 819 L210 855" fill="none" stroke="#718398" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#change-arrow)"/>
<path data-kind="connector" data-route="[[1000,750],[1000,819]]" d="M1000 750 L1000 819" fill="none" stroke="#718398" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text id="change-text-36" x="63" y="795" font-size="21" font-weight="600" fill="#946000" text-anchor="start" >If the change or validation fails: stop the rollout and recover deliberately.</text>
<rect id="change-recovery" data-kind="box" x="40" y="855" width="1120" height="183" rx="12" fill="#fff8e8" stroke="#946000" stroke-width="1.6" />
<text id="change-text-37" x="63" y="891" font-size="20" font-weight="700" fill="#946000" text-anchor="start" data-box="change-recovery" >FAILURE RECOVERY</text>
<rect id="change-stop" data-kind="box" x="60" y="911" width="300" height="80" rx="12" fill="#fff" stroke="#946000" stroke-width="1.6" />
<text id="change-text-38" x="210" y="959" font-size="26" font-weight="600" fill="#17324d" text-anchor="middle" data-box="change-stop" >Stop rollout</text>
<rect id="change-recover" data-kind="box" x="440" y="911" width="680" height="80" rx="12" fill="#fff" stroke="#946000" stroke-width="1.6" />
<text id="change-text-39" x="463" y="943" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-recover" >Recover management and dependencies</text>
<text id="change-text-40" x="463" y="975" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-recover" >Use the known-good design and a workload-aware recovery plan.</text>
<path data-kind="connector" data-route="[[360,951],[440,951]]" d="M360 951 L440 951" fill="none" stroke="#718398" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#change-arrow)"/>
<text id="change-text-41" x="63" y="1020" font-size="20" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-recovery" >Remove-NetIntent is not a rollback of generated configuration.</text>
