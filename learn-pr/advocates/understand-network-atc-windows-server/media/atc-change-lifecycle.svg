<text id="change-text-1" x="40" y="36" font-size="18" font-weight="600" fill="#4d6275" text-anchor="start" >WINDOWS SERVER 2025  ·  CONCEPTUAL</text>
<text id="change-text-2" x="40" y="81" font-size="34" font-weight="650" fill="#17324d" text-anchor="start" >Make a controlled change—and keep recovery explicit</text>
<text id="change-text-3" x="40" y="118" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >Safe change workflow for a cluster-scoped Network ATC policy.</text>
<rect id="change-scope" data-kind="box" x="40" y="143" width="1120" height="65" rx="12" fill="#fff8e8" stroke="#946000" stroke-width="1.6" />
<text id="change-text-4" x="62" y="183" font-size="22" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-scope" >Cluster-scoped policy can affect every node; draining one node does not localize it.</text>
<rect id="change-baseline" data-kind="box" x="40" y="255" width="320" height="195" rx="12" fill="#edf5fc" stroke="#0067b8" stroke-width="1.6" />
<circle cx="77" cy="293" r="20" fill="#0067b8"/>
<text id="change-text-5" x="77" y="301" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text id="change-text-6" x="112" y="300" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-baseline" >Baseline / snapshot</text>
<text id="change-text-7" x="64" y="353" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-baseline" >Capture intended and</text>
<text id="change-text-8" x="64" y="388" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-baseline" >effective configuration</text>
<text id="change-text-9" x="64" y="423" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-baseline" >Keep known-good design</text>
<rect id="change-plan" data-kind="box" x="440" y="255" width="320" height="195" rx="12" fill="#edf5fc" stroke="#0067b8" stroke-width="1.6" />
<circle cx="477" cy="293" r="20" fill="#0067b8"/>
<text id="change-text-10" x="477" y="301" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text id="change-text-11" x="512" y="300" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-plan" >Plan and drain</text>
<text id="change-text-12" x="464" y="353" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-plan" >Map dependencies</text>
<text id="change-text-13" x="464" y="388" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-plan" >Protect management</text>
<text id="change-text-14" x="464" y="423" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-plan" >Drain affected workloads</text>
<rect id="change-apply" data-kind="box" x="840" y="255" width="320" height="195" rx="12" fill="#edf5fc" stroke="#0067b8" stroke-width="1.6" />
<circle cx="877" cy="293" r="20" fill="#0067b8"/>
<text id="change-text-15" x="877" y="301" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text id="change-text-16" x="912" y="300" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-apply" >Apply the change</text>
<text id="change-text-17" x="864" y="353" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-apply" >Use a supported</text>
<text id="change-text-18" x="864" y="388" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-apply" >intent change</text>
<text id="change-text-19" x="864" y="423" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-apply" >Respect policy scope</text>
<rect id="change-validate" data-kind="box" x="840" y="555" width="320" height="195" rx="12" fill="#edf5fc" stroke="#0067b8" stroke-width="1.6" />
<circle cx="877" cy="593" r="20" fill="#0067b8"/>
<text id="change-text-20" x="877" y="601" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text id="change-text-21" x="912" y="600" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-validate" >Validate</text>
<text id="change-text-22" x="864" y="653" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-validate" >Check every expected node</text>
<text id="change-text-23" x="864" y="688" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-validate" >Test management, guest,</text>
<text id="change-text-24" x="864" y="723" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-validate" >SMB / RDMA and migration</text>
<rect id="change-resume" data-kind="box" x="440" y="555" width="320" height="195" rx="12" fill="#edf8f7" stroke="#007a80" stroke-width="1.6" />
<circle cx="477" cy="593" r="20" fill="#0067b8"/>
<text id="change-text-25" x="477" y="601" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<text id="change-text-26" x="512" y="600" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-box="change-resume" >Resume</text>
<text id="change-text-27" x="464" y="653" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-resume" >Only after all gates pass</text>
<text id="change-text-28" x="464" y="688" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-resume" >Restore workload service</text>
<text id="change-text-29" x="464" y="723" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="change-resume" >Record the new baseline</text>
