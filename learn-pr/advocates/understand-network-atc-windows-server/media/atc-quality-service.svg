<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="qos-title qos-desc" font-family="Segoe UI, Arial, sans-serif">
<title id="qos-title">Ethernet QoS classes and SMB live-migration cap</title>
<desc id="qos-desc">Two conceptual panels distinguish reservations from a workload-specific limit. Ethernet defaults are priority 3 SMB Direct with a 50 percent reservation, priority 7 cluster heartbeat with a 2 percent reservation for homogeneous links at or below 10 Gbps or 1 percent above 10 Gbps, and priority 0 for remaining traffic. Reservations govern allocation under contention and are not hard caps. Within SMB, storage I/O and SMB live migration compete. A separate live-migration bandwidth cap applies only to migration and is not a QoS reservation.</desc>
<rect x="0" y="0" width="1200" height="870" fill="#ffffff"/>
<metadata>Conceptual educational diagram for Windows Server 2025 only. Embedded icon geometry is reused from: C:\Azure-Icons\networking\10080-icon-service-Network-Interfaces.svg. Original viewBoxes and aspect ratios are preserved. Not runtime output.</metadata>
<defs><marker id="qos-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#718398"/></marker><symbol id="qos-icon-nic" viewBox="0 0 18 18" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="qos-nic-fcad3287-b71c-44fa-971a-6a18bcf384a0" x1="9.01" y1="16.5" x2="9.01" y2="1.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5e9641" /><stop offset="0.34" stop-color="#6baa42" /><stop offset="0.67" stop-color="#73b743" /><stop offset="1" stop-color="#76bb43" /></linearGradient></defs><path d="M15.89,2.91h1.27a.34.34,0,0,1,.34.34v3.5a.34.34,0,0,1-.34.34H15.89a0,0,0,0,1,0,0V2.91A0,0,0,0,1,15.89,2.91Z" fill="#ffca00" /><path d="M15.89,9h1.27a.34.34,0,0,1,.34.34v5.86a.34.34,0,0,1-.34.34H15.89a0,0,0,0,1,0,0V9A0,0,0,0,1,15.89,9Z" fill="#ffca00" /><rect x="2.13" y="1.5" width="13.76" height="15" rx="0.69" fill="url(#qos-nic-fcad3287-b71c-44fa-971a-6a18bcf384a0)" /><path d="M5.9,12.9H5.19A.2.2,0,0,1,5,12.69V4.34a.19.19,0,0,1,.19-.2H7.12a.19.19,0,0,1,.19.2.2.2,0,0,1-.19.21H5.38v7.93H5.9a.2.2,0,0,1,.19.21A.21.21,0,0,1,5.9,12.9Z" fill="#b4ec36" /><path d="M6,13.92H4.4a.2.2,0,0,1-.19-.21L4.08,3.38a.2.2,0,0,1,.06-.15.16.16,0,0,1,.13-.06H7.12v.41H4.47l.12,9.92H6Z" fill="#b4ec36" /><path d="M12,13H10.41a.19.19,0,0,1-.14-.07.18.18,0,0,1-.06-.14V7.9a.19.19,0,0,1,.19-.2l.91,0,0-2.25h.38l0,2.44a.2.2,0,0,1-.18.21l-.91,0v4.42H12Z" fill="#b4ec36" /><rect x="7.07" y="2.29" width="6.14" height="3.11" rx="0.26" fill="#365615" /><rect x="5.86" y="12.69" width="4.9" height="1.09" rx="0.26" transform="translate(21.54 4.93) rotate(90)" fill="#365615" /><rect x="3.99" y="12.71" width="4.9" height="1.09" rx="0.26" transform="translate(19.7 6.82) rotate(90)" fill="#365615" /><rect x="9.98" y="12.71" width="4.9" height="1.09" rx="0.26" transform="translate(25.68 0.83) rotate(90)" fill="#f2f2f2" /><ellipse cx="8.11" cy="8.06" rx="1.04" ry="1.12" fill="#f2f2f2" /><path d="M.5,5.7H1.77A.34.34,0,0,1,2.11,6v5.86a.34.34,0,0,1-.34.34H.5a0,0,0,0,1,0,0V5.7A0,0,0,0,1,.5,5.7Z" transform="translate(2.61 17.95) rotate(180)" fill="#3b3b3b" /></symbol></defs>
<text id="qos-text-1" x="40" y="36" font-size="18" font-weight="600" fill="#4d6275" text-anchor="start" >WINDOWS SERVER 2025  ·  CONCEPTUAL</text>
<text id="qos-text-2" x="40" y="81" font-size="34" font-weight="650" fill="#17324d" text-anchor="start" >QoS reservations and SMB migration limits are different</text>
<text id="qos-text-3" x="40" y="118" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >Windows Server 2025 defaults shown conceptually; percentages are not hard throughput caps.</text>
<rect id="qos-ethernet" data-kind="box" x="40" y="168" width="1120" height="339" rx="12" fill="#fff" stroke="#c6d3df" stroke-width="1.6" />
<circle cx="78" cy="205" r="20" fill="#0067b8"/>
<text id="qos-text-4" x="78" y="213" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<use href="#qos-icon-nic" x="1074" y="184" width="39" height="39" aria-hidden="true"/>
<text id="qos-text-5" x="115" y="213" font-size="26" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-ethernet" >Ethernet link · traffic classes</text>
<text id="qos-text-6" x="64" y="251" font-size="21" font-weight="400" fill="#4d6275" text-anchor="start" data-box="qos-ethernet" >Reservations govern allocation under contention in a homogeneous link-speed design.</text>
<rect id="qos-smb" data-kind="box" x="60" y="279" width="347" height="173" rx="12" fill="#edf5fc" stroke="#0067b8" stroke-width="1.6" />
<text id="qos-text-7" x="80" y="314" font-size="23" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-smb" >Priority 3 · SMB Direct</text>
<text id="qos-text-8" x="80" y="367" font-size="28" font-weight="650" fill="#0067b8" text-anchor="start" data-box="qos-smb" >50% reservation</text>
<text id="qos-text-9" x="80" y="417" font-size="21" font-weight="400" fill="#17324d" text-anchor="start" data-box="qos-smb" >Shared SMB traffic class</text>
<rect id="qos-cluster" data-kind="box" x="428" y="279" width="347" height="173" rx="12" fill="#edf8f7" stroke="#007a80" stroke-width="1.6" />
<text id="qos-text-10" x="448" y="314" font-size="21" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-cluster" >Priority 7 · cluster heartbeat</text>
<text id="qos-text-11" x="448" y="354" font-size="23" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-cluster" >2% for links ≤10 Gbps</text>
<text id="qos-text-12" x="448" y="389" font-size="23" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-cluster" >OR 1% for links &gt;10 Gbps</text>
<text id="qos-text-13" x="448" y="428" font-size="18" font-weight="400" fill="#17324d" text-anchor="start" data-box="qos-cluster" >Reservation depends on link speed</text>
<rect id="qos-default" data-kind="box" x="796" y="279" width="344" height="173" rx="12" fill="#f5f7fa" stroke="#718398" stroke-width="1.6" />
<text id="qos-text-14" x="816" y="314" font-size="22" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-default" >Priority 0 · default traffic</text>
<text id="qos-text-15" x="816" y="367" font-size="28" font-weight="650" fill="#17324d" text-anchor="start" data-box="qos-default" >Remainder</text>
<text id="qos-text-16" x="816" y="417" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-box="qos-default" >Other Ethernet traffic</text>
<text id="qos-text-17" x="64" y="485" font-size="21" font-weight="400" fill="#17324d" text-anchor="start" data-box="qos-ethernet" >Unused capacity can be used by other traffic; reservations are not hard caps.</text>
<rect id="qos-smb-panel" data-kind="box" x="40" y="548" width="1120" height="243" rx="12" fill="#fff" stroke="#c6d3df" stroke-width="1.6" />
<circle cx="78" cy="585" r="20" fill="#0067b8"/>
<text id="qos-text-18" x="78" y="593" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text id="qos-text-19" x="115" y="593" font-size="26" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-smb-panel" >Inside SMB · storage and SMB live migration compete</text>
<rect id="qos-shared" data-kind="box" x="60" y="623" width="670" height="139" rx="12" fill="#edf5fc" stroke="#0067b8" stroke-width="1.6" />
<text id="qos-text-20" x="81" y="653" font-size="21" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-shared" >Shared SMB bandwidth</text>
<rect id="qos-storage-workload" data-kind="box" x="80" y="680" width="256" height="57" rx="12" fill="#fff" stroke="#0067b8" stroke-width="1.6" />
<text id="qos-text-21" x="208" y="716" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle" data-box="qos-storage-workload" >Storage I/O</text>
<rect id="qos-migration-workload" data-kind="box" x="393" y="680" width="307" height="57" rx="12" fill="#fff" stroke="#0067b8" stroke-width="1.6" />
<text id="qos-text-22" x="546" y="716" font-size="23" font-weight="400" fill="#17324d" text-anchor="middle" data-box="qos-migration-workload" >SMB live migration</text>
<rect id="qos-cap" data-kind="box" x="805" y="636" width="330" height="118" rx="12" fill="#f5f0fb" stroke="#6b4ba1" stroke-width="1.6" />
<text id="qos-text-23" x="827" y="669" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-cap" >Live-migration cap</text>
<text id="qos-text-24" x="827" y="704" font-size="21" font-weight="400" fill="#17324d" text-anchor="start" data-box="qos-cap" >Applies only to migration</text>
<text id="qos-text-25" x="827" y="733" font-size="20" font-weight="600" fill="#17324d" text-anchor="start" data-box="qos-cap" >Not a QoS reservation</text>
<path data-kind="connector" data-route="[[805,711],[700,711]]" d="M805 711 L700 711" fill="none" stroke="#718398" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#qos-arrow)"/>
<text id="qos-text-26" x="40" y="838" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >A migration bandwidth limit constrains migration demand; it does not reserve a separate traffic class.</text>
</svg>
