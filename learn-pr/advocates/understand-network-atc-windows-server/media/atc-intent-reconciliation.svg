<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="reconcile-title reconcile-desc" font-family="Segoe UI, Arial, sans-serif">
<title id="reconcile-title">Network ATC desired state and reconciliation</title>
<desc id="reconcile-desc">Desired intent contains traffic roles, physical adapter aliases, and supported overrides. The Network ATC engine derives host configuration, including vSwitch or SET, host vNICs, VLANs and QoS as required. Observed host state feeds back to the engine for comparison and reconciliation. Physical switches and guest configuration are outside ATC ownership. A storage-only intent does not inherently require a virtual switch.</desc>
<rect x="0" y="0" width="1200" height="790" fill="#ffffff"/>
