<text id="reconcile-text-22" x="643" y="705" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-box="reconcile-guests" >VM attachments, guest VLAN choices and guest IPs</text>
<text id="reconcile-text-23" x="40" y="769" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >A storage-only intent does not inherently require a virtual switch.</text>
