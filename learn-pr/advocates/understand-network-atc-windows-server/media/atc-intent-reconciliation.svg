<text id="reconcile-text-10" x="590" y="378" font-size="21" font-weight="400" fill="#17324d" text-anchor="middle" data-box="reconcile-engine" >Derive host configuration</text>
<text id="reconcile-text-11" x="590" y="414" font-size="21" font-weight="400" fill="#17324d" text-anchor="middle" data-box="reconcile-engine" >Compare and reconcile</text>
