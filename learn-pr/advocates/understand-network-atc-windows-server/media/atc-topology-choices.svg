<text id="choices-text-5" x="62" y="252" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" data-box="choices-full" >One shared adapter pair</text>
<rect id="choices-main" data-kind="box" x="425" y="175" width="350" height="565" rx="12" fill="#fff" stroke="#0067b8" stroke-width="1.6" />
<text id="choices-text-6" x="447" y="217" font-size="25" font-weight="600" fill="#17324d" text-anchor="start" data-box="choices-main" >HostVM + Storage</text>
<text id="choices-text-7" x="447" y="252" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" data-box="choices-main" >Main example · two pairs</text>
