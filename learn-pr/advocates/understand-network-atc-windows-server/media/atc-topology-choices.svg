<text id="choices-text-8" x="832" y="217" font-size="25" font-weight="600" fill="#17324d" text-anchor="start" data-box="choices-split" >Management split</text>
<text id="choices-text-9" x="832" y="252" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" data-box="choices-split" >Two pairs, different sharing</text>
<rect id="choices-full-intent" data-kind="box" x="60" y="298" width="310" height="322" rx="12" fill="#edf5fc" stroke="#0067b8" stroke-width="1.6" />
