<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="choices-title choices-desc" font-family="Segoe UI, Arial, sans-serif">
<title id="choices-title">Alternative Network ATC intent sharing boundaries</title>
<desc id="choices-desc">Three alternatives, not process steps. Fully converged uses one Management plus Compute plus Storage intent on pNIC01 and pNIC02. The main example uses HostVM for Management plus Compute on pNIC01 and pNIC02, and Storage on pNIC03 and pNIC04. The third alternative isolates Management on pNIC01 and pNIC02 and combines Compute plus Storage on pNIC03 and pNIC04. Every adapter belongs to only one intent. The tradeoffs are shared capacity, separated storage paths, or isolated management. Capacity must be sized for failed paths and workload demand.</desc>
<rect x="0" y="0" width="1200" height="870" fill="#ffffff"/>
<metadata>Conceptual educational diagram for Windows Server 2025 only. Embedded icon geometry is reused from: C:\Azure-Icons\networking\10080-icon-service-Network-Interfaces.svg. Original viewBoxes and aspect ratios are preserved. Not runtime output.</metadata>
