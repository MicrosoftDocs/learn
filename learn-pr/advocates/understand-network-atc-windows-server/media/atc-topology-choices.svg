<text id="choices-text-1" x="40" y="36" font-size="18" font-weight="600" fill="#4d6275" text-anchor="start" >WINDOWS SERVER 2025  ·  CONCEPTUAL</text>
<text id="choices-text-2" x="40" y="81" font-size="34" font-weight="650" fill="#17324d" text-anchor="start" >Choose the sharing boundary—not a deployment order</text>
<text id="choices-text-3" x="40" y="118" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >Three alternative intent layouts. Each adapter is assigned exclusively to one intent.</text>
