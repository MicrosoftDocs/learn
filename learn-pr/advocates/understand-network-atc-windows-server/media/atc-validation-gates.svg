<text id="validation-text-1" x="40" y="36" font-size="18" font-weight="600" fill="#4d6275" text-anchor="start" >WINDOWS SERVER 2025  ·  CONCEPTUAL</text>
<text id="validation-text-2" x="40" y="81" font-size="34" font-weight="650" fill="#17324d" text-anchor="start" >Acceptance requires configuration and working paths</text>
<text id="validation-text-3" x="40" y="118" font-size="20" font-weight="400" fill="#4d6275" text-anchor="start" >Three ordered gates. Do not infer workload health from an intent provisioning result.</text>
<circle cx="205" cy="211" r="20" fill="#0067b8"/>
