<text id="validation-text-11" x="600" y="302" font-size="25" font-weight="600" fill="#17324d" text-anchor="middle" data-box="validation-nodes" >All expected nodes</text>
<text id="validation-text-12" x="460" y="362" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="validation-nodes" >Provisioning verified</text>
<text id="validation-text-13" x="460" y="403" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="validation-nodes" >Reachability confirmed</text>
<text id="validation-text-14" x="460" y="444" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="validation-nodes" >No missing nodes</text>
<text id="validation-text-15" x="460" y="552" font-size="19" font-weight="600" fill="#4d6275" text-anchor="start" data-box="validation-nodes" >Required node evidence</text>
<circle cx="995" cy="211" r="20" fill="#0067b8"/>
<text id="validation-text-16" x="995" y="219" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<rect id="validation-workload" data-kind="box" x="830" y="255" width="330" height="329" rx="12" fill="#edf8f7" stroke="#007a80" stroke-width="1.6" />
