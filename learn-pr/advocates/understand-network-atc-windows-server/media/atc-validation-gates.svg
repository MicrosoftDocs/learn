<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img" aria-labelledby="validation-title validation-desc" font-family="Segoe UI, Arial, sans-serif">
<title id="validation-title">Three ordered Network ATC acceptance gates</title>
<desc id="validation-desc">Gate one verifies the desired intent, scope, roles, adapters and overrides. Gate two requires verified provisioning and reachability on every expected node, with no missing nodes. Gate three proves workload paths for management, guests, active SMB and RDMA, and live migration. Successful provisioning is not proof of fabric or workload health. Missing or unreachable nodes cannot pass. These are conceptual acceptance gates, not runtime status enum values.</desc>
<rect x="0" y="0" width="1200" height="795" fill="#ffffff"/>
<metadata>Conceptual educational diagram for Windows Server 2025 only. Embedded icon geometry is reused from: C:\Azure-Icons\CnE_Enterprise\Server (generic).svg. Original viewBoxes and aspect ratios are preserved. Not runtime output.</metadata>
