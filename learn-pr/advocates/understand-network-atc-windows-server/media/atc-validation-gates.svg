<text id="validation-text-6" x="65" y="362" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="validation-desired" >Intent + scope are correct</text>
<text id="validation-text-7" x="65" y="403" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="validation-desired" >Roles + adapters match</text>
<text id="validation-text-8" x="65" y="444" font-size="22" font-weight="400" fill="#17324d" text-anchor="start" data-box="validation-desired" >Overrides are reviewed</text>
<text id="validation-text-9" x="65" y="552" font-size="19" font-weight="600" fill="#4d6275" text-anchor="start" data-box="validation-desired" >Required input evidence</text>
