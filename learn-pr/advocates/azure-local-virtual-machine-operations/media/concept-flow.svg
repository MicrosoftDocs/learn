  <title id="diagram-title">Managed machine responsibility flow</title>
  <desc id="diagram-description">Azure authorization accepts a machine operation. The custom location and resource bridge route desired state to the local management extension. The fabric runs the machine. Guest agents and applications provide separate health evidence.</desc>
