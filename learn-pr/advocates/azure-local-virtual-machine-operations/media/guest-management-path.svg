<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1294" viewBox="0 0 1200 1294" role="img" aria-labelledby="guest-management-path-title guest-management-path-description" style="background: white; background-color: white;">
  <title id="guest-management-path-title">Two agents, two management paths</title>
  <desc id="guest-management-path-description">VM lifecycle requests use the resource bridge and cluster extension. Bootstrap guest agent mocguestagent uses Hyper-V sockets between host and guest. The Connected Machine agent uses guest outbound access to required Azure endpoints and enables supported extensions. The resource bridge is not a guest traffic gateway. Validate workload service health independently. Guest management requires a supported OS and VM security type.</desc>
