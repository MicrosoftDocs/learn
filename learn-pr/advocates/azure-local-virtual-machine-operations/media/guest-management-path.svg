    <text x="198" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Azure requests reach the Hyper-V machine through the resource bridge</text>
    <text x="198" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">and the Azure Local VM cluster extension.</text>
