    </marker>
  </defs>
  <text x="48" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#172b4d" data-role="diagram-heading" font-weight="600">Two agents, two management paths</text>
  <text x="48" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="diagram-subtitle">Read top to bottom. The host-to-guest channel and guest outbound channel are distinct.</text>
