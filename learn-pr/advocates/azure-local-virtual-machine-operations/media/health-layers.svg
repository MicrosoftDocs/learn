  <text x="48" y="1112" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Assess all four layers for a complete operational view.</text>
  <text x="48" y="1142" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">A successful result in one layer does not replace the other checks.</text>
