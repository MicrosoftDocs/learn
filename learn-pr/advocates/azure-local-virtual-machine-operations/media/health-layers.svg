<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="health-layers-title health-layers-description" style="background: white; background-color: white;">
  <title id="health-layers-title">Four independent health checks</title>
  <desc id="health-layers-description">Four independent health checks, with no causal arrows. Cloud provisioning confirms a requested operation, not running state. Fabric and power checks confirm the VM and its storage and network, not guest management. Agent and extension evidence does not establish application availability. Workload health requires the service's own probes and dependency evidence.</desc>
