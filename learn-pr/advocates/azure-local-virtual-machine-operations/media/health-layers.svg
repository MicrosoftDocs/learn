  <text x="48" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#172b4d" data-role="diagram-heading" font-weight="600">Four independent health checks</text>
  <text x="48" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="diagram-subtitle">Read top to bottom. Each layer needs its own evidence; no layer proves the next.</text>
