    </marker>
    <marker id="change-workflow-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c" />
    </marker>
    <marker id="change-workflow-arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7355a6" />
    </marker>
  </defs>
  <text x="48" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#172b4d" data-role="diagram-heading" font-weight="600">A controlled VM configuration change</text>
  <text x="48" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="diagram-subtitle">Read top to bottom. Shutdown is conditional, not required for every VM change.</text>
