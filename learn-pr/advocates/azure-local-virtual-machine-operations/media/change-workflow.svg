    <text x="132" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="stage-title" font-weight="600">Protect</text>
    <text x="132" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#172b4d" data-role="stage-body">Get application approval and confirm a usable backup.</text>
  </g>
