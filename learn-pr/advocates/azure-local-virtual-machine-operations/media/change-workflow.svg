    <text x="132" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="stage-title" font-weight="600">Plan</text>
    <text x="132" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#172b4d" data-role="stage-body">Check the support matrix, baseline, and capacity.</text>
  </g>
