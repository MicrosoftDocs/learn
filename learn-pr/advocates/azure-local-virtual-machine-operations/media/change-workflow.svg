<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1384" viewBox="0 0 1200 1384" role="img" aria-labelledby="change-workflow-title change-workflow-description" style="background: white; background-color: white;">
  <title id="change-workflow-title">A controlled VM configuration change</title>
  <desc id="change-workflow-description">Six controlled change stages: plan, protect, stop when required, change, start and validate, and close or recover. Disk expansion and deletion are not reversible configuration edits. Rollback or recovery follows an approved plan; it is not automatic.</desc>
  <rect id="change-workflow-background" x="0" y="0" width="1200" height="1384" fill="#ffffff" data-role="canvas-background" />
  <defs>
