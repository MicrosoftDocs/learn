  <text x="72" y="1282" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Shutdown is change-specific; not every VM change requires a stop.</text>
  <text x="72" y="1311" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="stage-body">Disk expansion and deletion aren't reversible configuration edits.</text>
