    <text x="132" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="stage-title" font-weight="600">Stop</text>
    <text x="132" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#172b4d" data-role="stage-body">When required: quiesce the workload and shut down gracefully.</text>
  </g>
