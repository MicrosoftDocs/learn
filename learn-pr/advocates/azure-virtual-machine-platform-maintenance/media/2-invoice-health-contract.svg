    <g font-size="16">
      <text x="96" y="115">Boot, services, clock sync, admin access</text>
      <text x="96" y="140">Successful poll; no active event for this VM</text>
      <text x="580" y="115">Lease a test job; write and read back its result.</text>
      <text x="580" y="140">Release the lease. No customer invoice is posted.</text>
