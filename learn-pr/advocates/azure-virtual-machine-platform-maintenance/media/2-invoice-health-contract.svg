<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="408" viewBox="0 0 980 408" role="img" aria-labelledby="contract-title contract-desc" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="contract-title">Invoice application health contract</title>
  <desc id="contract-desc">On each poll, VM operations verifies guest health and that no maintenance event is active for the VM. The invoice application team tests a lease and a write and read without posting a customer invoice. Both checks must pass on two consecutive polls. A failure or active event resets the count and keeps intake closed. Passing the health contract does not establish an individual invoice's outcome.</desc>
