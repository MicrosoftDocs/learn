<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="544" viewBox="0 0 1040 544" role="img" aria-labelledby="handoff-title" aria-describedby="handoff-desc" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#183449">
  <title id="handoff-title">Diagram that shows how VMs prepare for maintenance and how durable stores reject worker A's stale writes after worker B acquires the lease.</title>
  <desc id="handoff-desc">Workers on VMs named in the event stop intake and checkpoint if time permits. Early approval requires every named VM to report ready. For one invoice, process A pauses and its lease version v1 expires. In a ledger outside both VMs, B atomically acquires version v2. B can read the saved checkpoint by job ID. Each checkpoint or result store validates the owner version as part of the write itself: it rejects resumed A's v1 and permits B's v2. A result is durable only when the transaction commits. Reopening intake is a separate decision that requires evidence of safe job processing.</desc>
  <metadata>{"iconRoot":"C:\\Azure-Icons","sources":{"event-icon":"compute\\00195-icon-service-Maintenance-Configuration.svg","vm-icon":"compute\\10021-icon-service-Virtual-Machine.svg","ledger-icon":"CnE_Enterprise\\Database generic.svg","store-icon":"storage\\10086-icon-service-Storage-Accounts.svg"}}</metadata>
