  <g id="prepare">
    <circle cx="34" cy="30" r="14" fill="#0f6095" /><text x="34" y="35" class="number">1</text>
    <text x="60" y="37" class="phase">Prepare for maintenance</text>
    <g transform="translate(20 55)">
      <rect class="node" width="250" height="80" rx="5" />
      <use xlink:href="#event-icon" x="16" y="21" width="38" height="38" />
      <text x="67" y="32" class="label">Scheduled Event</text>
      <text x="67" y="59">Names affected VMs</text>
    </g>
    <g transform="translate(306 55)">
      <rect class="node" width="428" height="80" rx="5" />
      <use xlink:href="#vm-icon" x="16" y="22" width="36" height="36" />
      <text x="65" y="32" class="label">Workers on named VMs</text>
      <text x="65" y="59">Stop intake; checkpoint if time permits.</text>
    </g>
    <g transform="translate(770 55)">
      <rect class="node" width="250" height="80" rx="5" />
      <text x="16" y="32" class="label">Early approval</text>
      <text x="16" y="59">All named VMs report ready</text>
    </g>
  </g>

  <g id="handoff">
    <circle cx="34" cy="169" r="14" fill="#0f6095" /><text x="34" y="174" class="number">2</text>
    <text x="60" y="176" class="phase">Hand off one invoice</text>
    <text x="322" y="215" font-weight="600" fill="#305c63">Durable state outside both VMs</text>
    <g transform="translate(20 228)">
      <rect class="node" width="250" height="70" rx="5" />
      <use xlink:href="#vm-icon" x="15" y="18" width="34" height="34" />
      <text x="61" y="27" class="label">VM worker-a</text>
      <text x="61" y="54">A pauses with lease v1</text>
    </g>
    <g transform="translate(322 228)">
      <rect class="node" width="396" height="70" rx="5" />
      <use xlink:href="#ledger-icon" x="13" y="18" width="32" height="32" />
      <text x="56" y="27" class="label">Job ledger: one owner per job</text>
      <text x="56" y="54">v1 expires; B acquires v2 atomically.</text>
    </g>
    <g transform="translate(770 228)">
      <rect class="node" width="250" height="70" rx="5" />
      <use xlink:href="#vm-icon" x="15" y="18" width="34" height="34" />
      <text x="61" y="27" class="label">VM worker-b</text>
      <text x="61" y="54">B now holds lease v2</text>
    </g>
    <g transform="translate(20 341)">
      <rect class="node" width="250" height="90" rx="5" />
      <text x="16" y="31" class="label">A resumes after handoff</text>
      <text x="16" y="61">Tries to write with v1</text>
    </g>
    <g transform="translate(770 341)">
      <rect class="node" width="250" height="90" rx="5" />
      <text x="16" y="25" class="label">B recovers by job ID</text>
      <text x="16" y="52">Read the saved checkpoint</text>
      <text x="16" y="78">Write the result with v2</text>
    </g>
    <g transform="translate(322 312)">
      <rect class="node" width="396" height="135" rx="5" />
      <use xlink:href="#store-icon" x="14" y="9" width="28" height="28" />
      <text x="53" y="30" class="label">Checkpoint and result stores</text>
      <text x="14" y="57">Validate the owner token and write atomically.</text>
      <g transform="translate(14 67)">
        <rect width="173" height="32" rx="4" fill="#fff6ed" stroke="#a96435" />
        <text x="86.5" y="22" class="verdict" fill="#773c1d">v1: reject write</text>
      </g>
      <g transform="translate(201 67)">
        <rect width="181" height="32" rx="4" fill="#edf8f4" stroke="#418375" />
        <text x="90.5" y="22" class="verdict" fill="#205e52">v2: allow write</text>
      </g>
      <text x="14" y="122">Results are durable only after commit.</text>
    </g>
  </g>

  <g id="rejoin">
    <circle cx="34" cy="503" r="14" fill="#0f6095" /><text x="34" y="508" class="number">3</text>
    <text x="60" y="510" class="phase">Return to service</text>
    <g transform="translate(306 479)">
      <rect class="node" width="428" height="48" rx="5" />
      <text x="16" y="31">Verify the worker can process jobs safely</text>
    </g>
    <g transform="translate(770 479)">
      <rect class="node" width="250" height="48" rx="5" />
      <text x="16" y="31" class="label">Reopen intake</text>
    </g>
  </g>
