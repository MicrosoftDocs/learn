  <title id="choice-title">Diagram that shows three response paths: checkpoint on the VM, notify through Event Grid (preview), or collect VM readiness in a queue.</title>
  <desc id="choice-desc">Save invoices locally, send notifications centrally, or combine local checkpoints with a durable readiness queue and one approval coordinator.</desc>
