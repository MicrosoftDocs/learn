    <g font-size="18" font-weight="600">
      <text x="79" y="163">Protect in-flight invoices</text>
      <text x="419" y="163">Notify or log centrally</text>
      <text x="759" y="163">Coordinate multiple VMs</text>
    </g>
    <g font-size="16">
      <text x="34" y="200">In-VM IMDS polling (GA)</text>
      <text x="34" y="227">Stop intake and save checkpoints.</text>
      <text x="34" y="254">Default for invoice processing.</text>
      <text x="374" y="200">Scheduled Events via Event Grid</text>
      <text x="374" y="227">Trigger a Function or Logic App.</text>
      <text x="374" y="254">Preview; avoid for production.</text>
      <text x="714" y="200">Poll IMDS; queue VM readiness.</text>
      <text x="714" y="227">A Function coordinates approval.</text>
      <text x="714" y="254">No Event Grid preview required.</text>
    </g>
  </g>
  <g id="approval-rule">
    <rect x="18" y="297" width="984" height="39" rx="5" fill="#f3f8fd" stroke="#7191a7" />
    <text x="510" y="322" text-anchor="middle" font-size="16" font-weight="600">Early approval requires a fresh readiness report for the same event from every named VM.</text>
  </g>
