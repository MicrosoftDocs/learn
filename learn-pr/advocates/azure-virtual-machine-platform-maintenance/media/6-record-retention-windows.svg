<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="332" viewBox="0 0 1000 332" role="img" aria-labelledby="retention-title" aria-describedby="retention-desc" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#183449">
  <title id="retention-title">Diagram that shows why invoice posting evidence must remain available for a permitted replay even after the maintenance event record expires.</title>
  <desc id="retention-desc">In this example the application records maintenance event E1 and invoice job J1. E1 expires under the event deduplication policy. A later authorized replay of J1 still falls within the supported retry window. Look up J1's committed result rather than posting again. Beyond the supported window, require reconciliation; a missing marker does not prove the invoice was never posted. The milestones show an example order, not fixed Azure retention periods.</desc>
  <metadata>{"iconRoot":"C:\\Azure-Icons","sources":{"record":"general\\10800-icon-service-File.svg","ledger":"CnE_Enterprise\\Database generic.svg"}}</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#39566c" />
    </marker>
    <linearGradient id="page-edge" x1="9" y1="18" x2="9" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4" /><stop offset=".817" stop-color="#5ea0ef" />
    </linearGradient>
    <symbol id="record" viewBox="0 0 18 18">
      <path d="M10.023.134H2.362A.605.605,0,0,0,1.757.74V17.26a.605.605,0,0,0,.605.606H15.638a.605.605,0,0,0,.6-.606V6.327a.605.605,0,0,0-.6-.606H11.232a.605.605,0,0,1-.6-.605V.74A.6.6,0,0,0,10.023.134Z" fill="#fff" />
