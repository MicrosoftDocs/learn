      <path d="M16.116,5.794,10.438.134V4.746a1.041,1.041,0,0,0,1.035,1.048Z" fill="#0078d4" />
      <g fill="#5ea0ef">
        <rect x="4" y="8.196" width="9.999" height="1.341" rx=".603" /><rect x="4" y="10.599" width="9.999" height="1.341" rx=".603" />
        <rect x="4" y="13.002" width="6.302" height="1.341" rx=".603" />
