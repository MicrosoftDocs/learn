  <rect id="background" width="1000" height="332" fill="#ffffff" />
  <text x="20" y="34" font-size="21" font-weight="600">Example: an invoice replay after the event record expires</text>
  <g text-anchor="middle" font-size="16" font-weight="600" fill="#38566b">
    <text x="236" y="74">Records saved</text><text x="470" y="74">Event record expires</text>
    <text x="690" y="74">Replay of J1</text><text x="890" y="74">Retry window ends</text>
  </g>
  <g id="time-axis" fill="none" stroke="#526d80" stroke-width="1.5">
    <path d="M236 92H975" marker-end="url(#arrow)" />
    <path d="M236 86V99 M470 86V99 M690 86V99 M890 86V99" />
    <path d="M470 99V108 M690 99V163 M890 99V163" stroke-dasharray="4 4" />
  </g>
  <g>
    <use xlink:href="#record" x="20" y="115" width="28" height="28" />
    <text x="60" y="137" font-size="18" font-weight="600">EventId E1</text>
    <rect id="event-retention" x="236" y="109" width="234" height="40" rx="4" fill="#edf4fa" stroke="#527c9a" stroke-width="1.5" />
    <text x="250" y="136">Recognize a repeat of E1</text>
  </g>
  <g>
    <use xlink:href="#ledger" x="20" y="170" width="28" height="28" />
    <text x="60" y="192" font-size="18" font-weight="600">Job ID J1</text>
    <rect id="job-retention" x="236" y="164" width="654" height="40" rx="4" fill="#edf8f4" stroke="#447f70" stroke-width="1.5" />
    <text x="250" y="191">Keep J1's posting evidence through all permitted retries and manual replays.</text>
  </g>
  <g>
    <rect x="20" y="224" width="468" height="90" rx="5" fill="#f4f7fa" stroke="#71899b" stroke-width="1.5" />
    <text x="36" y="251" font-size="18" font-weight="600">At the authorized replay</text>
    <text x="36" y="279">Look up the outcome by job ID, not event ID.</text>
    <text x="36" y="303">If already posted, settle without reposting.</text>
  </g>
  <g>
    <rect x="512" y="224" width="468" height="90" rx="5" fill="#fff7ed" stroke="#9b6a35" stroke-width="1.5" />
    <text x="528" y="251" font-size="18" font-weight="600">After the supported retry window</text>
    <text x="528" y="279">Do not retry based on a missing record.</text>
    <text x="528" y="303">Reconcile the posting outcome first.</text>
  </g>
</svg>
