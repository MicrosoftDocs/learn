<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="496" viewBox="0 0 1040 496" role="img" aria-labelledby="timeline-title" aria-describedby="timeline-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="timeline-title">Diagram that shows why the coordinator approves neither event and the worker waits for two healthy polls before recovering both invoices.</title>
  <desc id="timeline-desc">Read down the numbered timeline and across each row. The example uses two standalone VMs, worker-a and worker-b, in different zones. Event 1 affects only VM worker-a. Invoice process A checkpoints two jobs, but its readiness report does not reach the coordinator before the cutoff, so early approval is withheld. The next poll times out; then Event 1 is absent and Event 2 for VM worker-a has already started. The result store fails. Intake stays closed until two healthy polls, both leases and jobs are reconciled, and both committed results are confirmed.</desc>
