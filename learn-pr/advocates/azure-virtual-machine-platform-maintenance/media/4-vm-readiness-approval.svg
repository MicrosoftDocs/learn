<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="ready-title" aria-describedby="ready-desc" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#183449">
  <title id="ready-title">Diagram that shows why two reports from one VM cannot replace fresh readiness reports from both VMs before a guest approves through IMDS.</title>
  <desc id="ready-desc">Event E1 names pool_0 and pool_1. After all local invoice processes checkpoint, each guest can send an authenticated report to a durable readiness queue. A queue-triggered function tracks reports by event ID and VM. If only pool_0 reports, even twice, withhold approval. If both VMs report ready, one designated guest rechecks the event, affected VMs, status, time, and readiness. Only then may it approve through its local IMDS endpoint. Withholding early approval does not postpone NotBefore.</desc>
