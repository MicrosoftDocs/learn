  <title id="delivery-title">Diagram that shows an Event Grid handler ignoring a duplicate delivery and keeping a completed event from reverting to Scheduled.</title>
  <desc id="delivery-desc">All four deliveries refer to maintenance event E1. Delivery d1 records Started. A second copy of d1 is ignored. Delivery d2 records Completed. A late Scheduled notification with a new delivery ID, d3, is logged without changing the stored Completed status.</desc>
