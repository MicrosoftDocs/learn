<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="264" viewBox="0 0 1000 264" role="img" aria-labelledby="poll-title" aria-describedby="poll-desc" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#183449">
  <title id="poll-title">Diagram that shows a scheduled event, a timed-out IMDS poll, and a later valid poll where the event is absent without an observed start.</title>
  <desc id="poll-desc">At 10:14:48 UTC, a valid poll shows Scheduled with NotBefore at 10:15:00, leaving 12 seconds. A timeout at 10:14:54 does not change the last known state. At 10:15:06, the event is absent from a valid response. Record removal without an observed start, not a confirmed cancellation.</desc>
