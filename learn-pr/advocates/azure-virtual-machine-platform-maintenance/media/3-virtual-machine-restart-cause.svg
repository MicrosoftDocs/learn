<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1060" height="356" viewBox="0 0 1060 356" role="img" aria-labelledby="restart-title restart-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="restart-title">Determine why VM worker-a restarted</title>
  <desc id="restart-desc">Confirm the guest boot time in UTC and identify the VM. For that VM and time window, compare guest update and shutdown records for a patch-triggered reboot, Azure Activity log operations for an operator restart, and VM Resource Health history for host failure or planned maintenance. Record the cause only if evidence supports it. A reboot alone or an empty log does not establish the cause.</desc>
