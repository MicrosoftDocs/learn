  <rect id="background" x="0" y="0" width="1080" height="374" fill="#ffffff" />
  <g id="connectors" fill="none" stroke="#39566c" stroke-width="2" stroke-linejoin="round">
    <path d="M447 54H513" marker-end="url(#arrow)" />
    <path d="M787 89V110 M160 110H915" />
    <path d="M160 110V132" marker-end="url(#arrow)" />
    <path d="M535 110V132" marker-end="url(#arrow)" />
    <path d="M915 110V132" marker-end="url(#arrow)" />
    <g fill="#39566c" stroke="none"><circle cx="787" cy="110" r="3" /><circle cx="535" cy="110" r="3" /></g>
  </g>
  <g id="document">
    <rect x="18" y="18" width="429" height="71" rx="5" fill="#f3f8fd" stroke="#5385a9" stroke-width="1.5" />
    <text x="34" y="46" font-size="19" font-weight="600">IMDS response</text>
    <text x="34" y="73" font-size="16">DocumentIncarnation: snapshot version, not a job ID</text>
  </g>
  <g id="event">
    <rect x="514" y="18" width="548" height="71" rx="5" fill="#f3f8fd" stroke="#5385a9" stroke-width="1.5" />
    <text x="530" y="46" font-size="19" font-weight="600">One event in the Events array</text>
    <text x="530" y="73" font-size="16">EventId: stable across polls; tracks preparation and approval</text>
  </g>
  <g id="scope">
    <rect x="18" y="133" width="284" height="173" rx="5" fill="#fff" stroke="#8195a4" stroke-width="1.5" />
    <use xlink:href="#vm-icon" x="32" y="147" width="34" height="34" />
    <text x="78" y="170" font-size="19" font-weight="600">Which VM?</text>
    <g font-size="16"><text x="34" y="208">ResourceType: VirtualMachine</text><text x="34" y="234">Resources: ["worker-a"]</text><text x="34" y="278">Only the named VM is affected.</text></g>
  </g>
  <g id="timing">
    <rect x="324" y="133" width="422" height="173" rx="5" fill="#fff" stroke="#8195a4" stroke-width="1.5" />
    <use xlink:href="#timing-icon" x="338" y="147" width="34" height="34" />
    <text x="384" y="170" font-size="19" font-weight="600">What happens, and when?</text>
    <g font-size="16">
      <text x="340" y="208">EventType: Freeze</text><text x="340" y="234">EventStatus: Scheduled</text>
      <text x="340" y="260">NotBefore: earliest start without early approval</text>
      <text x="340" y="286">DurationInSeconds: -1 if unknown or not applicable</text>
    </g>
  </g>
  <g id="context">
    <rect x="768" y="133" width="294" height="173" rx="5" fill="#fff" stroke="#8195a4" stroke-width="1.5" />
    <use xlink:href="#context-icon" x="782" y="147" width="34" height="34" />
    <text x="828" y="170" font-size="19" font-weight="600">Why this notice?</text>
    <g font-size="16"><text x="784" y="208">EventSource: Platform</text><text x="784" y="234">Description: host maintenance</text><text x="784" y="278">Context, not approval.</text></g>
  </g>
  <g id="status-note">
    <rect x="18" y="324" width="1044" height="36" rx="5" fill="#f3f8fd" stroke="#7191a7" />
    <text x="540" y="348" text-anchor="middle" font-size="16">After Started, NotBefore can be blank. A finished event leaves the IMDS response; there is no Completed status.</text>
  </g>
