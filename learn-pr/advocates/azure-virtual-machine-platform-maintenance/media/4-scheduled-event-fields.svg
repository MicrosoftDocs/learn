<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="374" viewBox="0 0 1080 374" role="img" aria-labelledby="fields-title" aria-describedby="fields-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="fields-title">Diagram that shows how IMDS separates the response version from the event ID and identifies which VM a scheduled freeze affects.</title>
  <desc id="fields-desc">The response version can change while the event ID stays the same. In this example, Azure schedules a freeze for VM worker-a. The source and description explain the event but do not authorize approval.</desc>
  <metadata>{"iconRoot":"C:\\Azure-Icons","sources":{"vm-icon":"compute\\10021-icon-service-Virtual-Machine.svg","timing-icon":"compute\\00195-icon-service-Maintenance-Configuration.svg","context-icon":"monitor\\00007-icon-service-Activity-Log.svg"}}</metadata>
