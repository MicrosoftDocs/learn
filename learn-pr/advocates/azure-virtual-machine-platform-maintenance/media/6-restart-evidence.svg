  <title id="evidence-title">Diagram that shows a successful restart and a reachable guest, but a failed test transaction keeps the invoice worker from reopening intake.</title>
  <desc id="evidence-desc">In this example the Activity Log records a successful authorized restart. The guest boot time changed, an administrator can reconnect, and a fresh IMDS GET succeeds. But the synthetic job cannot read back its result and earlier invoice outcomes are unverified. Record guest restart verified, application rejoin not verified. Keep intake closed.</desc>
