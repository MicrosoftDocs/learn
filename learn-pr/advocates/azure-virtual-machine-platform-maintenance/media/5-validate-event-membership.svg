<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="308" viewBox="0 0 960 308" role="img" aria-labelledby="membership-title" aria-describedby="membership-desc" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#183449">
  <title id="membership-title">Diagram that shows how a changed VM list for E2 blocks approval for both events, even though E1 still lists the local VM.</title>
  <desc id="membership-desc">The local VM is pool_0. In both the saved and current responses, E1 lists pool_0. E2 previously listed pool_0 and pool_1, but now lists only pool_1. Comparing the full response exposes the conflict that filtering for pool_0 first would hide. Quarantine the consumer, preserve both documents for operator review, and approve neither event.</desc>
