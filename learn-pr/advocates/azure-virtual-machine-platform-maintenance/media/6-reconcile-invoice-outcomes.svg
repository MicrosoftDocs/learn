      </g>
    </symbol>
  </defs>
  <rect id="background" width="1024" height="382" fill="#ffffff" />
  <text x="20" y="34" font-size="21" font-weight="600">Keep intake closed while checking earlier invoices</text>
  <g id="connectors" fill="none" stroke="#39566c" stroke-width="2" stroke-linejoin="round">
    <g marker-end="url(#arrow)">
      <path d="M328 101H357" /><path d="M666 101H695" />
      <path d="M850 146V166H174V187" /><path d="M512 166V187" /><path d="M850 166V187" />
    </g>
    <g fill="#39566c" stroke="none"><circle cx="512" cy="166" r="3" /><circle cx="850" cy="166" r="3" /></g>
  </g>
  <g>
    <rect x="20" y="54" width="308" height="92" rx="5" fill="#f1f7fc" stroke="#527c9a" stroke-width="1.5" />
    <text x="36" y="82" font-size="18" font-weight="600">1. Restore durable state</text>
    <text x="36" y="110">Check pending writes against</text><text x="36" y="135">the checkpoint store.</text>
  </g>
  <g>
    <rect x="358" y="54" width="308" height="92" rx="5" fill="#f1f7fc" stroke="#527c9a" stroke-width="1.5" />
    <text x="374" y="82" font-size="18" font-weight="600">2. Pass two consecutive polls</text>
    <text x="374" y="110">No active event for this VM.</text><text x="374" y="135">Guest and app healthy at each poll.</text>
  </g>
  <g>
    <rect x="696" y="54" width="308" height="92" rx="5" fill="#f1f7fc" stroke="#527c9a" stroke-width="1.5" />
    <use xlink:href="#ledger" x="709" y="61" width="28" height="28" />
    <text x="748" y="82" font-size="18" font-weight="600">3. Look up each job ID</text>
    <text x="712" y="110">Query the posting store or service,</text><text x="712" y="135">not just the local attempt log.</text>
  </g>
  <g>
    <rect x="20" y="188" width="308" height="126" rx="5" fill="#edf8f4" stroke="#447f70" stroke-width="1.5" />
    <text x="36" y="217" font-size="19" font-weight="600">Posting confirmed</text>
    <text x="36" y="245">Record durable completion.</text><text x="36" y="271">Settle the redelivery.</text><text x="36" y="297">Do not post again.</text>
  </g>
  <g>
    <rect x="358" y="188" width="308" height="126" rx="5" fill="#fff" stroke="#71899b" stroke-width="1.5" />
    <text x="374" y="217" font-size="19" font-weight="600">Confirmed not posted</text>
    <text x="374" y="245">Confirm the lease before resuming.</text><text x="374" y="271">Retry with the same key in its window.</text><text x="374" y="297">Reject stale-owner writes.</text>
  </g>
  <g>
    <rect x="696" y="188" width="308" height="126" rx="5" fill="#fff7ed" stroke="#9b6a35" stroke-width="1.5" />
    <text x="712" y="217" font-size="19" font-weight="600">Outcome unknown</text>
    <text x="712" y="245">Put the job on durable hold.</text><text x="712" y="271">Assign an owner to investigate.</text><text x="712" y="297">Block automatic retries.</text>
  </g>
  <g>
    <rect x="20" y="330" width="984" height="36" rx="4" fill="#f4f7fa" stroke="#71899b" />
    <use xlink:href="#queue" x="31" y="335" width="26" height="26" />
    <text x="69" y="354">Before reopening, recheck events and health. Keep unresolved invoices out of automatic intake.</text>
  </g>
</svg>
