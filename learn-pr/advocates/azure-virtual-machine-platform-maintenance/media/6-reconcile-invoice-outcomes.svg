      <stop offset="0" stop-color="#a67af4" /><stop offset=".775" stop-color="#b796f9" />
    </linearGradient>
    <symbol id="queue" viewBox="0 0 18 18">
      <path d="M.544,5.316H17.456a0,0,0,0,1,0,0v9.918a.565.565,0,0,1-.565.565H1.109a.565.565,0,0,1-.565-.565V5.316A0,0,0,0,1,.544,5.316Z" fill="url(#queue-body)" />
      <path d="M1.112,2.2H16.888a.565.565,0,0,1,.565.565v2.55a0,0,0,0,1,0,0H.547a0,0,0,0,1,0,0V2.766A.565.565,0,0,1,1.112,2.2Z" fill="#773adc" />
