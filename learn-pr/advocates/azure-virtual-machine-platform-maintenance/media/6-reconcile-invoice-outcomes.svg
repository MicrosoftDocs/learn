<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="382" viewBox="0 0 1024 382" role="img" aria-labelledby="outcomes-title" aria-describedby="outcomes-desc" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#183449">
  <title id="outcomes-title">Diagram that shows when to settle a redelivered message, resume a job with confirmed ownership, or hold an invoice whose posting is uncertain.</title>
  <desc id="outcomes-desc">With intake closed, restore durable state and check pending writes. At two consecutive polls, the VM must have no active event and both guest and application checks must pass. Look up each invoice by its stable job ID. Settle a confirmed posting without posting again. If no posting exists, confirm ownership, use ownership-checked writes, and resume or retry under the same key within its supported window. If the outcome is unknown, keep the job recoverable on durable hold and assign an owner. Recheck events and health before reopening intake; held jobs must not return to automatic processing.</desc>
  <metadata>{"iconRoot":"C:\\Azure-Icons","sources":{"ledger":"CnE_Enterprise\\Database generic.svg","queue":"general\\10840-icon-service-Storage-Queue.svg"}}</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#39566c" />
    </marker>
    <symbol id="ledger" viewBox="-1705 1753 258 338">
