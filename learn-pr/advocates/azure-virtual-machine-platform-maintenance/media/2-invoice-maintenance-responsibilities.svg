<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="exposure-title exposure-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="exposure-title">When invoice process A drains for maintenance</title>
  <desc id="exposure-desc">The load-balanced front end continues submitting invoices to the shared queue, not directly to the competing invoice processes. Invoice process A on VM worker-a in Zone 1 stops receiving jobs from the queue, checkpoints, and accounts for its in-flight jobs. The operator's independent VM administration path still reaches worker-a. Invoice process B on standalone VM worker-b in Zone 2 can receive jobs while the shared queue, ownership store, and result store are healthy. Both worker VMs are standalone VMs. The stores are external to the workers: ownership allows one lease holder per job, and the result store keeps one result per job ID.</desc>
