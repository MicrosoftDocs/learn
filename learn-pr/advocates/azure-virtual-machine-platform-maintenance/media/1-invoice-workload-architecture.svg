  <title id="title">Invoice processing architecture</title>
  <desc id="description">The load-balanced front end places one job per invoice on a shared queue. Either invoice process can claim a job: process A runs on VM worker-a in zone 1; process B runs on VM worker-b in zone 2. Both use the same external stores for job leases, checkpoints, and one committed result per job ID.</desc>
