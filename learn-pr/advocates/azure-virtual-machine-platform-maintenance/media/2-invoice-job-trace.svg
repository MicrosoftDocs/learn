<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="508" viewBox="0 0 1080 508" role="img" aria-labelledby="trace-title" aria-describedby="trace-desc" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#172f43">
  <title id="trace-title">Diagram that shows how invoice workers hand off a lease and check posting by job ID before acknowledging or holding a redelivered message.</title>
  <desc id="trace-desc">Process A receives a message, acquires the job's business lease, and renews it while working. To hand off, A saves a durable checkpoint, stops lease-dependent work, and releases the lease or lets it expire without acknowledging the message. If ownership is uncertain, A stops that work and flags the outcome for reconciliation. Normally, A confirms posting and commits the result before acknowledging. If A crashes after posting, the queue redelivers the message. Process B checks the same job ID, records a confirmed posting, and acknowledges without posting again. If the outcome is unknown, B puts the job on durable hold and assigns a reconciliation owner. The message stays recoverable unless a durable handoff preserves the job details and responsibility.</desc>
