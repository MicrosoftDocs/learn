  <rect id="background" x="0" y="0" width="1060" height="454" fill="#ffffff" />
  <g id="headings" font-size="21" font-weight="600">
    <text x="22" y="34">Prepare when notice is usable</text>
    <text x="554" y="34">Recover when notice is short or absent</text>
  </g>
  <g id="connectors" stroke="#39566c" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M263 323V344H797V323" />
    <path d="M530 344V365" marker-end="url(#response-arrow)" />
    <circle cx="530" cy="344" r="3" fill="#39566c" stroke="none" />
  </g>
  <g id="planned">
    <rect x="20" y="54" width="486" height="269" rx="5" fill="#f5f9fc" stroke="#6388a4" stroke-width="1.5" />
    <path d="M36 145H490 M36 235H490" fill="none" stroke="#c7d7e2" />
    <use xlink:href="#host-icon" x="36" y="80" width="38" height="38" />
    <use xlink:href="#patch-icon" x="36" y="170" width="38" height="38" />
    <use xlink:href="#operator-icon" x="36" y="260" width="38" height="38" />
    <g font-size="18" font-weight="600">
      <text x="90" y="81">Azure host maintenance</text>
      <text x="90" y="172">Guest OS patches</text>
      <text x="90" y="267">Operator restart or redeploy</text>
    </g>
    <g font-size="16">
      <text x="90" y="107">Check host-scope eligibility and assignment.</text>
      <text x="90" y="130">Compare freeze time with lease and client timeouts.</text>
      <text x="90" y="198">Azure Update Manager controls guest patches.</text>
      <text x="90" y="221">Prepare if a relevant VM event is present.</text>
      <text x="90" y="295">Coordinate with the authorized change owner.</text>
    </g>
  </g>
  <g id="unplanned">
    <rect x="554" y="54" width="486" height="269" rx="5" fill="#fff9f3" stroke="#ab794f" stroke-width="1.5" />
    <path d="M570 165H1024" fill="none" stroke="#e2cbb5" />
    <use xlink:href="#health-icon" x="570" y="84" width="38" height="38" />
    <use xlink:href="#spot-icon" x="570" y="194" width="38" height="38" />
    <g font-size="18" font-weight="600">
      <text x="624" y="85">Sudden host failure</text>
      <text x="624" y="197">Spot eviction or instance termination</text>
    </g>
    <g font-size="16">
      <text x="624" y="114">The first notice may already say Started.</text>
      <text x="624" y="139">Recover without assuming a fresh checkpoint.</text>
      <text x="624" y="225">Hand off jobs if time permits.</text>
      <text x="624" y="259">Spot Deallocate: restart is not guaranteed.</text>
      <text x="624" y="285">Spot Delete: recover on a replacement VM.</text>
    </g>
  </g>
  <g id="safeguards">
    <rect x="20" y="366" width="1020" height="70" rx="5" fill="#f1faf6" stroke="#498775" stroke-width="1.5" />
    <use xlink:href="#storage-icon" x="36" y="384" width="34" height="34" />
    <text x="88" y="393" font-size="18" font-weight="600">For every trigger</text>
    <text x="88" y="418" font-size="16">Replicate stores. Keep leases off-VM. Reserve capacity. Back off retries; deduplicate by job ID. Keep an independent admin path.</text>
  </g>
</svg>
