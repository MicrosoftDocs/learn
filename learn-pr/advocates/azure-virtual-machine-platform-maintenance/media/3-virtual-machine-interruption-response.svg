  <title id="response-title">Diagram that shows how to prepare for planned VM changes and recover invoices after a host failure or Spot eviction.</title>
  <desc id="response-desc">Match the response to the trigger. Both paths need replicated stores, spare capacity, safe retries, and independent administrative access.</desc>
