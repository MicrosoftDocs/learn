title: Guide AI workload operations with an AI Center of Excellence
summary: Learn how comprehensive operations guidance from an AI Center of Excellence can help an organization to effectively deploy, manage, and maintain AI workloads.
abstract: |
  In this module you learn how comprehensive guidance from an AI center of excellence can help an organization to effectively deploy, manage, and maintain AI workloads. Learn about how an AI CoE can help an organization:
  -	Implement Generative AI Operations (GenAIOps) processes
  -	Ensure AI workloads are well architected
  -	Assess and monitor AI workloads
  -	Deploy AI workloads
prerequisites: |
  To get the best learning experience from this module, you should have knowledge and experience of:
  - Azure fundamentals
  - Fundamental AI concepts
