<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="ca4bc198c31c401a9-title ca4bc198c31c401a9-desc" data-module="active-directory-authentication-kerberos" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="ca4bc198c31c401a9-title">Separate ticket encryption from workflow compatibility</title><desc id="ca4bc198c31c401a9-desc">Active Directory Domain Services authentication and Kerberos hardening, UNIT 04. Preparing for Windows Server 2025 requires evidence about both ticket types and the operations that depend on authentication. 1. Ticket-granting ticket: Check event 4768 for initial authentication and clients that depend on RC4. 2. Service ticket: Use event 4769 to link the requested service to its actual ticket encryption type. 3. Dependent workflows: Validate certificate sign-in and tools that change domain passwords remotely. Key takeaways: An encryption mismatch calls for comparison of client capabilities, account settings, available keys, and applicable policy. Use Group Policy and account attributes for encryption configuration rather than the legacy SupportedEncryptionTypes registry value.</desc><defs><symbol id="ca4bc198c31c401a9-i76" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Lock, protected.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="ca4bc198c31c401a9-i76n0"><g id="ca4bc198c31c401a9-i76n1" /></g><g id="ca4bc198c31c401a9-i76n2" /><g id="ca4bc198c31c401a9-i76n3" /><g id="ca4bc198c31c401a9-i76n4" /><g id="ca4bc198c31c401a9-i76n5" /><g id="ca4bc198c31c401a9-i76n6" /><path fill="#2A3282" d="M504.2,272.1h-16.3v-30c0-63.5-40.3-96.1-87.6-96.1h-7.7c-48.1,0-87.6,31.8-87.6,96.1v30h-16.3  c-6.9,0-16.3,9.4-16.3,16.3v161.4c0,6.9,9.4,16.3,16.3,16.3h215.4c6.9,0,16.3-9.4,16.3-16.3V288.4  C519.6,281.5,510.2,272.1,504.2,272.1z M408,367.4v67h-24v-67c-9.4-4.3-16.3-13.7-16.3-24.9c0-15.5,12.9-2