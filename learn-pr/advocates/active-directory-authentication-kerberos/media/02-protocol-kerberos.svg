<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c81e2afd50ca96310-title c81e2afd50ca96310-desc" data-module="active-directory-authentication-kerberos" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c81e2afd50ca96310-title">Follow the ticket from the client to the resource</title><desc id="c81e2afd50ca96310-desc">Active Directory Domain Services authentication and Kerberos hardening, UNIT 02. SSPI hides protocol details from the application, but the Kerberos exchanges leave distinct evidence. 1. Initial authentication: The KDC issues a ticket-granting ticket; event 4768 records the request. 2. Service ticket: The KDC processes a request for a specific SPN; inspect event 4769. 3. Service acceptance: The target validates the presented ticket and establishes the security context. Key takeaways: The SPN must identify the account whose key the service uses, not merely a DNS name that resolves. A valid ticket does not grant resource access by itself; check the resulting token and the resource's permissions.</desc><defs><marker id="c81e2afd50ca96310-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="c81e2afd50ca96310-i76" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Lock, protected.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="c81e2afd50ca96310-i76n0"><g id="c81e2afd50ca96310-i76n1" /></g><g id="c81e2afd50ca96310-i76n2" /><g id="c81e2afd50ca96310-i76n3" /><g id="c81e2afd50ca96310-i76n4" /><g id="c81e2afd50ca96310-i76n5" /><g id="c81e2afd50ca96310-i76n6" /><path fill="#2A3282" d="M504.2,272.1h-16.3v-30c0-63.5-40.3-96.1-87.6-96.1h-7.7c-48.1,0-87.6,31.8-87.6,96.1v30h-16.3  c-6.9,0-16.3,9.4-16.3,16.3v161.4c0,6.9,9.4,16.3,16.3,16.3h215.4c6.9,0,16.3-9.4,16.3-16.3V288.4  C519.6,281.5,510.2,272.1,504.2,272.1z M408,367.4v67h-24v-67c-9.4-4.3-16.3-13.7-16.3-24.9c0-15.5,12.9-28.3,28.3-28.3  c15.5,0,28.3,12.9,28.3,28.3C424.3,352.8,417.5,362.2,408,367.4z M457.8,272.1H335.1v-30c0-40.3,21.5-67.8,57.5-67.8h7.7  c36.9,0,57.5,27.5,57.5,67.8L457.8,272.1L457.8,272.1z" /><g id="c81e2afd50ca96310-i76n7" /><g id="c81e2afd50ca96310-i76n8" /></g></symbol></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Active Directory Domain Services authentication and Kerberos hardening</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 02</text></g><g data-field="title" data-box="56 95 1008 132"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">Follow the ticket from the client to the</text><text x="60" y="210.64" font-size="46" font-weight="700" fill="#132c3b">resource</text></g><g data-field="concept" data-box="56 232 1008 72"><text x="60" y="260.9" font-size="24" font-weight="400" fill="#364f5e">SSPI hides protocol details from the application, but the Kerberos exchanges leave distinct</text><text x="60" y="293.9" font-size="24" font-weight="400" fill="#364f5e">evidence.</text></g><line x1="56" x2="1064" y1="321" y2="321" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 345.03 360 43"><text x="60" y="377.167" font-size="27" font-weight="700" fill="#132c3b">Sequence</text></g><line x1="203.297" x2="1064" y1="368.25" y2="368.25" stroke="#c6d6df" stroke-width="1.5" /><line class="connector" x1="363" y1="579.265" x2="404" y2="579.265" stroke="#286486" stroke-width="3" stroke-linecap="round" marker-end="url(#c81e2afd50ca96310-arrow)" /><line class="connector" x1="715" y1="579.265" x2="756" y2="579.265" stroke="#286486" stroke-width="3" stroke-linecap="round" marker-end="url(#c81e2afd50ca96310-arrow)" /><g data-node="1"><rect x="56" y="400.03" width="304" height="358.47" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="418.03" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 419.53 46 29"><text x="87.797" y="439.797" font-size="16" font-weight="700" fill="#ffffff">01</text></g><use x="298" y="418.03" width="44" height="44" aria-hidden="true" xlink:href="#c81e2afd50ca96310-i76" /><g data-field="label" data-box="74 493.78 268 80"><text x="78" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Initial</text><text x="78" y="562.917" font-size="27" font-weight="700" fill="#132c3b">authentication</text></g><g data-field="detail" data-box="74 580.78 268 122"><text x="78" y="606.44" font-size="21" font-weight="400" fill="#364f5e">The KDC issues a</text><text x="78" y="635.44" font-size="21" font-weight="400" fill="#364f5e">ticket-granting ticket;</text><text x="78" y="664.44" font-size="21" font-weight="400" fill="#364f5e">event 4768 records the</text><text x="78" y="693.44" font-size="21" font-weight="400" fill="#364f5e">request.</text></g></g><g data-node="2"><rect x="408" y="400.03" width="304" height="358.47" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="426" y="418.03" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="426 419.53 46 29"><text x="439.797" y="439.797" font-size="16" font-weight="700" fill="#ffffff">02</text></g><g data-field="label" data-box="426 493.78 268 43"><text x="430" y="525.917" font-size="27" font-weight="700" fill="#132c3b">Service ticket</text></g><g data-field="detail" data-box="426 580.78 268 93"><text x="430" y="606.44" font-size="21" font-weight="400" fill="#364f5e">The KDC processes a</text><text x="430" y="635.44" font-size="21" font-weight="400" fill="#364f5e">requ