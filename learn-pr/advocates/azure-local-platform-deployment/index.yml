title: Deploy the Azure Local platform
summary: |
  An Azure Local deployment connects decisions about physical infrastructure, identity, networking, and Azure governance. A successful deployment requires more than a completed wizard: you need evidence that the environment was ready, that orchestration completed correctly, and that operations teams can support the resulting platform.

  In this module, you learn to treat **readiness**, **orchestration**, and **acceptance** as separate engineering responsibilities. You review deployment inputs, distinguish different kinds of validation, investigate a failed operation, and decide whether a system is ready for handover.
abstract: |
  > [!VIDEO https://learn-video.azurefd.net/vod/player?id=0ce33a0e-da8c-404c-8da0-8b373a045499]

  After completing this module, you can:

  - Map hardware, identity, network, storage, and Azure prerequisites to their owners and dependent deployment stages.
  - Review a deployment parameter set without exposing secrets or mistaking validation for deployment.
  - Explain the relationship between Azure Arc registration, platform orchestration, and workload management.
  - Diagnose the earliest actionable failure and select a supported recovery boundary.
  - Establish acceptance from independent Azure, local infrastructure, and workload-management evidence.
  - Identify when simplified machine provisioning requires a separate preview assessment.
prerequisites: |
  - Familiarity with physical servers, virtual machines, networking, and storage.
  - Basic understanding of Azure resources, permissions, and Windows Server administration.
  - No Azure subscription, cluster, parameter file, or credentials are required for the paper exercise.
