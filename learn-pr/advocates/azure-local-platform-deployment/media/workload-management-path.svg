<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1486" viewBox="0 0 1100 1486" role="img" aria-labelledby="diagram-title diagram-description" style="background: white; background-color: #ffffff">
  <title id="diagram-title">VM management: logical targeting</title>
  <desc id="diagram-description">Logical VM management path with two Azure stages and two on-premises stages. An Azure Resource Manager request requires caller permission and targets a custom location: an Azure reference to a namespace, not a physical cluster. It targets the on-premises Arc resource bridge appliance, which hosts a Kubernetes management cluster and the Azure Local VM extension and executes local lifecycle operations. Local VM infrastructure comprises hosts, workload logical networks and storage paths. The infrastructure logical network supports the bridge and is distinct from workload networks. Arrows are not guest traffic. Arc registration of physical machines is separate from completed VM management.</desc>
