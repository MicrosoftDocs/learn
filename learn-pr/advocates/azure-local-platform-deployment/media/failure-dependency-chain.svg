  <title id="diagram-title">Trace failure back to its dependency</title>
  <desc id="diagram-description">An illustrative dependency timeline, not product log output. At 09:04, required vault access is denied: the earliest actionable dependency. Verify the actual identity, required permission and network path. At 09:05, extension configuration fails; at 09:08, the resource bridge stage fails. These later failures are downstream symptoms. Repair the confirmed dependency through its owner and use a supported resume point; do not recreate managed resources.</desc>
