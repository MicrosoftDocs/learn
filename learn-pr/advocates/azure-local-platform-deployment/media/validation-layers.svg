<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1150" viewBox="0 0 1100 1150" role="img" aria-labelledby="diagram-title diagram-description" style="background: white; background-color: #ffffff">
  <title id="diagram-title">From validation to deployment</title>
  <desc id="diagram-description">Three ordered approval gates. The ARM template check uses Test-AzResourceGroupDeployment without deploying resources; it checks schema, provider validation and policy, not node readiness. Azure Local Validate is a real deployment that can create prerequisite resources and role assignments while running readiness checks. Azure Local Deploy creates and configures the cluster and managed services, but still requires independent acceptance.</desc>
  <rect id="canvas-background" x="0" y="0" width="1100" height="1150" fill="#ffffff" opacity="1" data-role="canvas-background" />
  <defs>
    <marker id="management-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#426789" />
    </marker>
  </defs>
  <text x="48" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#172b4d" data-role="diagram-heading">From validation to deployment</text>
  <text x="48" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#172b4d" data-role="reading-order">Read from top to bottom. Approval gates are not guarantees of success.</text>
