    <text x="80" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#172b4d" data-role="body">Does not deploy resources.</text>
    <text x="80" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" data-role="body">Checks schema, provider validation, and Azure Policy.</text>
    <text x="80" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" data-role="body">Does not establish node readiness.</text>
  </g>
