<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1158" viewBox="0 0 1100 1158" role="img" aria-labelledby="diagram-title diagram-description" style="background: white; background-color: #ffffff">
  <title id="diagram-title">Identity: three different questions</title>
  <desc id="diagram-description">Three identity questions, not a topology or migration workflow. First, authorize the deployment caller using scoped Azure RBAC, distinct from local rights. Second, choose either AD DS with a delegated OU and lifecycle deployment user, or Local Identity with Key Vault, a new non-built-in local administrator, common credentials on all nodes, and static addresses and DNS. Third, retain required service identities and assign credential rotation and recovery owners. Local Identity still uses Azure authorization.</desc>
  <rect id="canvas-background" x="0" y="0" width="1100" height="1158" fill="#ffffff" opacity="1" data-role="canvas-background" />
  <defs>
    <marker id="management-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#426789" />
    </marker>
  </defs>
  <text x="48" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#172b4d" data-role="diagram-heading">Identity: three different questions</text>
  <text x="48" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#172b4d" data-role="reading-order">Read 1, then 2, then 3. In question 2, choose one alternative.</text>
