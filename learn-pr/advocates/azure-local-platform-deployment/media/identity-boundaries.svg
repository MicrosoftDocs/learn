      <text x="96" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#172b4d" data-role="body">Delegated organizational unit (OU)</text>
      <text x="96" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#172b4d" data-role="body">Lifecycle deployment user</text>
      <text x="96" y="726" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#172b4d" data-role="body">for deployment and lifecycle tasks</text>
