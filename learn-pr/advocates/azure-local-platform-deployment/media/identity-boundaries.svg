    <text x="80" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#172b4d" data-role="body">Who can act in Azure?</text>
    <text x="80" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" data-role="body">Deployment caller: scoped Azure role-based access control (RBAC).</text>
    <text x="80" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" data-role="body">Creating resources and assigning roles are separate from local rights.</text>
  </g>
