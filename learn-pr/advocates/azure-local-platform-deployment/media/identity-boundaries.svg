    <text x="132" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#172b4d" data-role="card-heading">Choose ONE host identity branch</text>
    <text x="80" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#172b4d" data-role="body">2A and 2B are alternatives, not sequential steps or a migration path.</text>
    <g data-card="2A-ad-ds-alternative">
