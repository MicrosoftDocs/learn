### YamlMime:ModuleUnit
uid: learn.introduction-azure-copilot-agents.knowledge-check
title: Knowledge check
metadata:
  title: Knowledge Check
  description: Choose the right pair of Azure Copilot agents for backup and resizing, deployment and migration, or incident investigation and support.
  ms.date: 11/23/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: unit
durationInMinutes: 3
content: Choose the best response for each question.
quiz:
  questions:
    - content: "You want to enable backup for a supported VM, then evaluate an Advisor resize recommendation. Which agents do you use, in order?"
      choices:
        - content: "Optimization, then Resiliency."
          isCorrect: false
          explanation: "These agents fit the tasks in the opposite order. Resiliency guides backup configuration; Optimization explains a resize recommendation."
        - content: "Resiliency, then Optimization."
          isCorrect: true
          explanation: "Resiliency guides you through choosing the VM, vault, and policy; you confirm to enable protection. Optimization explains the recommended size and alternatives; the workload owner decides whether to resize."
        - content: "Troubleshooting, then Deployment."
          isCorrect: false
          explanation: "Troubleshooting diagnoses resource problems, and Deployment designs new infrastructure. Neither is the starting point for VM backup or an Advisor resize recommendation."
    - content: "Which agent generates infrastructure as code for a new app, and which explains migration waves for an existing VMware estate?"
      choices:
        - content: "Catalyst, then Deployment."
          isCorrect: false
          explanation: "Catalyst can explain the waves for the existing estate. Use Deployment, not Catalyst, to design the new app's infrastructure."
        - content: "Deployment, then Catalyst."
          isCorrect: true
          explanation: "Deployment generates Terraform or Bicep for the new workload. Catalyst uses project data to explain wave groupings; committing a wave doesn't start migration."
        - content: "Deployment, then Resiliency."
          isCorrect: false
          explanation: "Deployment fits the first task. Resiliency assesses protection against outages; Catalyst plans migration waves."
    - content: "First, correlate telemetry for an API alert. Then investigate why a specific VM restarted and prepare a support request if needed. Which agents fit, in order?"
      choices:
        - content: "Observability, then Troubleshooting."
          isCorrect: true
          explanation: "Start the telemetry investigation in Azure Monitor. Use Troubleshooting for VM-specific diagnostics and ticket preparation. The operator reviews and submits the request."
        - content: "Troubleshooting, then Observability."
          isCorrect: false
          explanation: "Observability correlates the alert's telemetry. Troubleshooting, not Observability, can prepare a support request if VM diagnostics don't resolve the problem."
        - content: "Optimization, then Troubleshooting."
          isCorrect: false
          explanation: "Troubleshooting fits the second task. Optimization evaluates cost recommendations; it doesn't run the alert investigation."