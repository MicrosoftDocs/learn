<rect id="capacity182" x="236" y="182" width="348" height="28" rx="0" fill="#506576" stroke="none"/>
<text data-label="1" data-cell="" x="723" y="205" fill="#000000" font-size="22" font-weight="700">12 GiB</text>
<text data-label="1" data-cell="" x="28" y="270" fill="#000000" font-size="22" font-weight="700">Candidate A</text>
<rect id="track248" x="236" y="248" width="464" height="28" rx="0" fill="#edf0f3" stroke="none"/>
