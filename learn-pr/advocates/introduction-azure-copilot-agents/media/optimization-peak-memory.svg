<svg xmlns="http://www.w3.org/2000/svg" width="840" height="477" viewBox="0 0 840 477" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
<title id="title">Which VM can run the month-end report?</title><desc id="desc">Three bars on the same scale show 12 GiB required, 8 GiB in candidate A and 16 GiB in candidate B. A is 4 GiB short. B passes the memory check, not every sizing or cost check.</desc>
<rect id="paper" x="0" y="0" width="840" height="477" fill="#ffffff"/>
<rect id="accent" x="28" y="21" width="28" height="5" rx="2" fill="#0078d4" stroke="none"/>
<text data-label="1" data-cell="" x="66" y="31" fill="#000000" font-size="15" font-weight="700">OPTIMIZATION  /  WORKED EXAMPLE</text>
<text data-label="1" data-cell="" x="28" y="78" fill="#000000" font-size="34" font-weight="700">Which VM can run the month-end report?</text>
<text data-label="1" data-cell="" x="28" y="110" fill="#000000" font-size="19" font-weight="400">Compare proposed memory capacity with the workload peak, not a quiet week.</text>
