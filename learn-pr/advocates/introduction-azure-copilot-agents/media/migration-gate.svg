<svg xmlns="http://www.w3.org/2000/svg" width="840" height="634" viewBox="0 0 840 634" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
<title id="title">When can traffic move to Azure?</title><desc id="desc">Follow four gates for the VMware VM: accept the isolated test, verify replication and drain writes, verify source shutdown before cutover approval, and verify the last accepted orders on the target.</desc>
<rect id="paper" x="0" y="0" width="840" height="634" fill="#ffffff"/>
<rect id="accent" x="28" y="21" width="28" height="5" rx="2" fill="#0078d4" stroke="none"/>
<text data-label="1" data-cell="" x="66" y="31" fill="#000000" font-size="15" font-weight="700">CATALYST  /  VMWARE AGENTLESS MIGRATION</text>
<text data-label="1" data-cell="" x="28" y="78" fill="#000000" font-size="34" font-weight="700">When can traffic move to Azure?</text>
<text data-label="1" data-cell="" x="28" y="110" fill="#000000" font-size="19" font-weight="400">Follow the wave-managed path for the order-processing VM.</text>
<!-- Azure icon: compute/10021-icon-service-Virtual-Machine.svg -->
<svg data-icon="1" data-cell="" aria-hidden="true" x="761" y="35" width="46" height="46" viewBox="0 0 18 18"><defs xmlns="http://www.w3.org/2000/svg"><linearGradient id="e005-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="e005-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#e005-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" xmlns="http://www.w3.org/2000/svg" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" xmlns="http://www.w3.org/2000/svg" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" xmlns="http://www.w3.org/2000/svg" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" xmlns="http://www.w3.org/2000/svg" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" xmlns="http://www.w3.org/2000/svg" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" xmlns="http://www.w3.org/2000/svg" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#e005-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" xmlns="http://www.w3.org/2000/svg" /></svg>
<text data-label="1" data-cell="" x="28" y="190" fill="#000000" font-size="17" font-weight="700">01   TEST</text>
<rect id="gate140" x="178" y="140" width="634" height="100" rx="9" fill="#e9f4fe" stroke="none"/>
<text data-label="1" data-cell="gate140" x="196" y="174" fill="#000000" font-size="23" font-weight="700">Accept the isolated copy</text>
<text data-label="1" data-cell="gate140" x="196" y="202" fill="#000000" font-size="19" font-weight="400">Keep the source online. Validate the test VM before</text>
<text data-label="1" data-cell="gate140" x="196" y="226" fill="#000000" font-size="19" font-weight="400">releasing its wave-managed cleanup.</text>
<g data-connector="1"><line x1="495" y1="243" x2="495" y2="248" stroke="#53687b" stroke-width="3" stroke-linecap="round"/><polygon points="495,259 489,248 501,248" fill="#53687b"/></g>
<text data-label="1" data-cell="" x="28" y="312" fill="#000000" font-size="17" font-weight="700">02   PREPARE</text>
<rect id="gate262" x="178" y="262" width="634" height="100" rx="9" fill="#e9f4fe" stroke="none"/>
<text data-label="1" data-cell="gate262" x="196" y="296" fill="#000000" font-size="23" font-weight="700">Hold production approval</text>
<text data-label="1" data-cell="gate262" x="196" y="324" fill="#000000" font-size="19" font-weight="400">Check replication and the blackout window. Drain writes</text>
<text data-label="1" data-cell="gate262" x="196" y="348" fill="#000000" font-size="19" font-weight="400">and record the last accepted order IDs.</text>
<g data-connector="1"><line x1="495" y1="365" x2="495" y2="370" stroke="#53687b" stroke-width="3" stroke-linecap="round"/><polygon points="495,381 489,370 501,370" fill="#53687b"/></g>
<text data-label="1" data-cell="" x="28" y="434" fill="#000000" font-size="17" font-weight="700">03   RELEASE</text>
<rect id="gate384" x="178" y="384" width="634" height="100" rx="9" fill="#fff2d5" stroke="none"/>
<text data-label="1" data-cell="gate384" x="196" y="418" fill="#000000" font-size="23" font-weight="700">Verify that the source VM is off</text>
<text data-label="1" data-cell="gate384" x="196" y="446" fill="#000000" font-size="19" font-weight="400">Only then approve migration for this VM.</text>
<text data-label="1" data-cell="gate384" x="196" y="470" fill="#000000" font-size="19" font-weight="400">Wait for the final delta sync and migration job to succeed.</text>
<g data-connector="1"><line x1="495" y1="487" x2="495" y2="492" stroke="#53687b" stroke-width="3" stroke-linecap="round"/><polygon points="495,503 489,492 501,492" fill="#53687b"/></g>
<text data-label="1" data-cell="" x="28" y="556" fill="#000000" font-size="17" font-weight="700">04   VERIFY</text>
<rect id="gate506" x="178" y="506" width="634" height="100" rx="9" fill="#e3f4f1" stroke="none"/>
<text data-label="1" data-cell="gate506" x="196" y="540" fill="#000000" font-size="23" font-weight="700">Check the target before switching traffic</text>
<text data-label="1" data-cell="gate506" x="196" y="568" fill="#000000" font-size="19" font-weight="400">Find the recorded orders in Azure. After the approved</text>
<text data-label="1" data-cell="gate506" x="196" y="592" fill="#000000" font-size="19" font-weight="400">switch, submit and read back a new order.</text>
</svg>
