<svg xmlns="http://www.w3.org/2000/svg" width="840" height="535" viewBox="0 0 840 535" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
<title id="title">Who can see the findings?</title><desc id="desc">An alert or approved Logs chat can lead to an investigation under user permissions. Saving the result as an issue makes it visible to readers of the chosen Azure Monitor workspace and can trigger configured actions.</desc>
<rect id="paper" x="0" y="0" width="840" height="535" fill="#ffffff"/>
<rect id="accent" x="28" y="21" width="28" height="5" rx="2" fill="#0078d4" stroke="none"/>
<text data-label="1" data-cell="" x="66" y="31" fill="#000000" font-size="15" font-weight="700">OBSERVABILITY  /  ON-DEMAND INVESTIGATION</text>
<text data-label="1" data-cell="" x="28" y="78" fill="#000000" font-size="34" font-weight="700">Who can see the findings?</text>
<text data-label="1" data-cell="" x="28" y="110" fill="#000000" font-size="19" font-weight="400">The resources an investigator can read and the people who can read a saved issue differ.</text>
