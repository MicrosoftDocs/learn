<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
<title id="title">Which way should replication run?</title><desc id="desc">Before the drill, both VMs replicate to the recovery zone. After failover and reprotection, replication runs toward the original zone. After reverse failover and reverse reprotection, its original direction is restored.</desc>
<rect id="paper" x="0" y="0" width="840" height="620" fill="#ffffff"/>
<rect id="accent" x="28" y="21" width="28" height="5" rx="2" fill="#0078d4" stroke="none"/>
<text data-label="1" data-cell="" x="66" y="31" fill="#000000" font-size="15" font-weight="700">RESILIENCY  /  ZONE-TO-ZONE SITE RECOVERY</text>
<text data-label="1" data-cell="" x="28" y="78" fill="#000000" font-size="34" font-weight="700">Which way should replication run?</text>
<text data-label="1" data-cell="" x="28" y="110" fill="#000000" font-size="19" font-weight="400">Follow both VMs: the database and the application. Arrows show replication, not traffic.</text>
<text data-label="1" data-cell="" x="28" y="154" fill="#000000" font-size="17" font-weight="700">ORIGINAL ZONE</text>
<text data-label="1" data-cell="" x="507" y="154" fill="#000000" font-size="17" font-weight="700">RECOVERY ZONE</text>
<text data-label="1" data-cell="" x="28" y="192" fill="#000000" font-size="20" font-weight="700">01   Before the drill</text>
<rect id="orig184" x="28" y="207" width="305" height="61" rx="9" fill="#e3f4f1" stroke="none"/>
