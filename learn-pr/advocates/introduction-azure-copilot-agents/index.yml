title: Introduction to Azure Copilot agents
summary: |
  Learn how six Azure Copilot agents help you design, migrate, investigate, and manage Azure workloads. For each task, identify what the agent can do, what evidence to review, and which actions you complete in an Azure service.
abstract: |
  By the end of this module, you can:

  - Use the Deployment agent to plan new infrastructure and review Terraform or Bicep before deployment.
  - Use the Azure Catalyst agent to interpret migration readiness and distinguish wave planning from cutover.
  - Start an Observability investigation in Azure Monitor and save its findings for another responder.
  - Evaluate an Optimization recommendation before resizing a virtual machine.
  - Distinguish the Resiliency agent's VM backup workflow from planning for a zone or regional outage.
  - Use the Troubleshooting agent to diagnose a resource problem and prepare a support request if needed.
prerequisites: |
  This module assumes familiarity with:

  - Microsoft Azure and cloud services
  - Azure operations tasks and best practices
  - AI concepts
  - Architecture concepts
