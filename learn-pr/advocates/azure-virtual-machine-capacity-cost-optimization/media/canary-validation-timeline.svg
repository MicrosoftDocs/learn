  <title id="canary-validation-timeline-title">When can you accept the canary?</title>
  <desc id="canary-validation-timeline-desc">Follow four phases from baseline to representative observation. Abort before the attempt if prerequisites fail. Once attempted, recover or contain a failure immediately. Accept only if every required check passes.</desc>
  <metadata>Azure icon source: compute\10021-icon-service-Virtual-Machine.svg</metadata>
  <rect x="0" y="0" width="1060" height="548" fill="#ffffff" data-kind="background" />
  <defs>
