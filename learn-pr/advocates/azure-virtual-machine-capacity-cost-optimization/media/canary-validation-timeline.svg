  <text x="106" y="34" font-size="15" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">LIVE CANARY TIMELINE</text>
  <text x="106" y="73" font-size="32" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">When can you accept the canary?</text>
  <text x="36" y="112" font-size="19" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">One isolated VM. Match the baseline workload, verify the guest and observe the service through its peak.</text>
  <rect x="32" y="158" width="230" height="124" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="50" y="189" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">1. Before the change</text>
  <text x="50" y="214" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Capture the D4s v5</text>
  <text x="50" y="238" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">baseline, peak demand</text>
  <text x="50" y="262" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">and smoke-test result.</text>
  <polyline points="264,202 281,202" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#canary-validation-timeline-tip-0)" />
  <rect x="286" y="158" width="230" height="124" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="304" y="189" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">2. Resize the VM</text>
  <text x="304" y="214" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Apply the approved</text>
  <text x="304" y="238" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">D2s v5 change. Check</text>
  <text x="304" y="262" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">the operation result.</text>
  <polyline points="518,202 535,202" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#canary-validation-timeline-tip-0)" />
  <rect x="540" y="158" width="230" height="124" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="558" y="189" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">3. After restart</text>
  <text x="558" y="214" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Verify guest resources.</text>
  <text x="558" y="238" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Repeat the smoke test</text>
  <text x="558" y="262" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">and service checks.</text>
  <polyline points="772,202 789,202" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#canary-validation-timeline-tip-0)" />
  <rect x="794" y="158" width="230" height="124" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="812" y="189" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">4. Observe the peak</text>
  <text x="812" y="214" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Measure the service for</text>
  <text x="812" y="238" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">at least 24 hours, including</text>
  <text x="812" y="262" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">the relevant demand peak.</text>
  <polyline points="147,285 147,351" fill="none" stroke="#9b6829" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#canary-validation-timeline-tip-1)" />
  <polyline points="401,285 401,310 865,310 865,285" fill="none" stroke="#a45a4d" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" />
  <polyline points="655,285 655,310" fill="none" stroke="#a45a4d" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" />
  <polyline points="552,310 552,351" fill="none" stroke="#a45a4d" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#canary-validation-timeline-tip-2)" />
  <polyline points="954,285 954,351" fill="none" stroke="#427552" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#canary-validation-timeline-tip-3)" />
  <rect x="32" y="358" width="230" height="151" rx="8" fill="#fff7e6" stroke="#ae802c" stroke-width="1.5" data-kind="card" />
  <text x="50" y="389" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Abort before resize</text>
  <text x="50" y="414" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">A prerequisite is missing.</text>
  <text x="50" y="438" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Do not resize the VM.</text>
  <text x="50" y="462" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Record what blocked it.</text>
  <rect x="286" y="358" width="484" height="151" rx="8" fill="#fdf0ed" stroke="#b47164" stroke-width="1.5" data-kind="card" />
  <text x="304" y="389" font-size="20" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Stop after an attempted resize</text>
  <text x="304" y="414" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">If a requirement fails or evidence is lost, stop now.</text>
  <text x="304" y="438" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Use approved recovery or containment. Record</text>
  <text x="304" y="462" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">whether service was restored. Do not wait 24 hours.</text>
  <rect x="794" y="358" width="230" height="151" rx="8" fill="#eaf6ef" stroke="#588a6b" stroke-width="1.5" data-kind="card" />
  <text x="812" y="389" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Accept the canary</text>
  <text x="812" y="414" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Only if all checks pass</text>
  <text x="812" y="438" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">over the required window.</text>
  <text x="812" y="462" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Assess savings separately.</text>
</svg>
