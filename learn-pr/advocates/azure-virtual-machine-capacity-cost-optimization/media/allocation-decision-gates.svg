  <title id="allocation-decision-gates-title">Can Azure allocate the target VM?</title>
  <desc id="allocation-decision-gates-desc">Read down the six checks. A failed check leads right to its remedy. Only a successful allocation confirms hardware for this VM.</desc>
  <metadata>Azure icon source: other\02951-icon-service-Azure-Quotas.svg</metadata>
