  <text x="106" y="34" font-size="15" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">ALLOCATION DECISION TREE</text>
  <text x="106" y="73" font-size="32" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Can Azure allocate the target VM?</text>
  <text x="36" y="112" font-size="19" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Passing the prechecks permits an attempt; it does not reserve a host.</text>
  <text x="36" y="155" font-size="16" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">IF YES: CONTINUE DOWN</text>
  <text x="536" y="155" font-size="16" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">IF NO: FOLLOW THE BRANCH</text>
  <rect x="36" y="174" width="404" height="72" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="54" y="205" font-size="20" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">1. Is the size compatible?</text>
  <text x="54" y="230" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Check OS, disks, network and security.</text>
  <polyline points="444,210 527,210" fill="none" stroke="#9b6829" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-0)" />
  <rect x="536" y="174" width="388" height="72" rx="8" fill="#fff7e6" stroke="#ae802c" stroke-width="1.5" data-kind="card" />
  <text x="554" y="205" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Choose a supported size.</text>
  <text x="554" y="230" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">If none fits, redesign the change.</text>
  <polyline points="238,249 238,268" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-1)" />
  <rect x="36" y="274" width="404" height="72" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="54" y="305" font-size="20" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">2. Is the size allowed here?</text>
  <text x="54" y="330" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Check subscription, region and zone.</text>
  <polyline points="444,310 527,310" fill="none" stroke="#9b6829" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-0)" />
  <rect x="536" y="274" width="388" height="72" rx="8" fill="#fff7e6" stroke="#ae802c" stroke-width="1.5" data-kind="card" />
  <text x="554" y="305" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Resolve the size restriction.</text>
  <text x="554" y="330" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Or select an approved, eligible target.</text>
  <polyline points="238,349 238,368" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-1)" />
  <rect x="36" y="374" width="404" height="72" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="54" y="405" font-size="20" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">3. Is there room in both quotas?</text>
  <text x="54" y="430" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Count regional and family vCPUs.</text>
  <polyline points="444,410 527,410" fill="none" stroke="#9b6829" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-0)" />
  <rect x="536" y="374" width="388" height="72" rx="8" fill="#fff7e6" stroke="#ae802c" stroke-width="1.5" data-kind="card" />
  <text x="554" y="405" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Address the specific quota limit.</text>
  <text x="554" y="430" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Request an increase or reduce the footprint.</text>
  <polyline points="238,449 238,468" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-1)" />
  <rect x="36" y="474" width="404" height="72" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="54" y="505" font-size="20" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">4. Can placement be preserved?</text>
  <text x="54" y="530" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Check zone, host groups and reservations.</text>
  <polyline points="444,510 527,510" fill="none" stroke="#9b6829" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-0)" />
  <rect x="536" y="474" width="388" height="72" rx="8" fill="#fff7e6" stroke="#ae802c" stroke-width="1.5" data-kind="card" />
  <text x="554" y="505" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Review the placement constraint.</text>
  <text x="554" y="530" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Change placement only with approval.</text>
  <polyline points="238,549 238,568" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-1)" />
  <rect x="36" y="574" width="404" height="72" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="54" y="605" font-size="20" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">5. Is the attempt approved?</text>
  <text x="54" y="630" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Confirm budget, fallback and time window.</text>
  <polyline points="444,610 527,610" fill="none" stroke="#9b6829" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-0)" />
  <rect x="536" y="574" width="388" height="72" rx="8" fill="#fff7e6" stroke="#ae802c" stroke-width="1.5" data-kind="card" />
  <text x="554" y="605" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Abort before attempting the resize.</text>
  <text x="554" y="630" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Obtain approval or a viable recovery plan.</text>
  <polyline points="238,649 238,668" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-1)" />
  <rect x="36" y="674" width="404" height="72" rx="8" fill="#eef6fc" stroke="#6a97b8" stroke-width="1.5" data-kind="card" />
  <text x="54" y="705" font-size="20" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">6. Did allocation succeed?</text>
  <text x="54" y="730" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Check the actual operation result.</text>
  <polyline points="444,710 527,710" fill="none" stroke="#9b6829" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-0)" />
  <rect x="536" y="674" width="388" height="72" rx="8" fill="#fff7e6" stroke="#ae802c" stroke-width="1.5" data-kind="card" />
  <text x="554" y="705" font-size="19" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Stop and record the failure.</text>
  <text x="554" y="730" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Use only an approved alternative or retry.</text>
  <polyline points="238,750 238,773" fill="none" stroke="#507186" stroke-width="2.5" stroke-linejoin="round" data-kind="wire" marker-end="url(#allocation-decision-gates-tip-1)" />
  <rect x="36" y="780" width="888" height="64" rx="8" fill="#eaf6ef" stroke="#588a6b" stroke-width="1.5" data-kind="card" />
  <text x="54" y="811" font-size="21" font-weight="700" fill="#172f40" text-anchor="start" data-kind="label">Allocation succeeded for this VM.</text>
  <text x="54" y="836" font-size="17" font-weight="400" fill="#172f40" text-anchor="start" data-kind="label">Verify the running guest resources, then test the application.</text>
</svg>
