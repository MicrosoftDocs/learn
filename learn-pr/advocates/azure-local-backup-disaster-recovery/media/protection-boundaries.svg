    <text x="644" y="523" font-size="24" font-weight="600" fill="#172b4d" data-role="stage-title">Disaster recovery</text>
    <text x="644" y="564" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Restore trusted business service</text>
    <text x="644" y="594" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">using data, dependencies, and a runbook.</text>
    <text x="644" y="624" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Needs: evidence and release authority.</text>
  </g>
  <text x="40" y="735" font-size="20" font-weight="600" fill="#172b4d">A configured protection relationship is not proof of recoverability.</text>
