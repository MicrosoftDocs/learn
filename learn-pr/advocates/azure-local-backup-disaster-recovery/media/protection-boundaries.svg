    <text x="64" y="523" font-size="24" font-weight="600" fill="#172b4d" data-role="stage-title">Retained backup</text>
    <text x="64" y="564" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Keep historical recovery points</text>
    <text x="64" y="594" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">that survive the planned failure.</text>
    <text x="64" y="624" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Needs: usable keys and a restore target.</text>
  </g>
