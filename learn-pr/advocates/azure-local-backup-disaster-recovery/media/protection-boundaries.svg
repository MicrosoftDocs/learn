    <text x="644" y="218" font-size="24" font-weight="600" fill="#172b4d" data-role="stage-title">Replication</text>
    <text x="644" y="259" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Prepare a second operational copy</text>
    <text x="644" y="289" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">by transferring changes.</text>
    <text x="644" y="319" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Limit: can copy unwanted changes too.</text>
  </g>
