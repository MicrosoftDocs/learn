  <title id="diagram-title">Different layers protect different outcomes</title>
  <desc id="diagram-description">Four ordered cards explain availability, replication, retained backup, and disaster recovery, with the limitation of each mechanism.</desc>
  <rect id="background" x="0" y="0" width="1200" height="760" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426789" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b3a" />
    </marker>
  </defs>
  <text x="40" y="52" font-size="32" font-weight="600" fill="#172b4d" data-role="diagram-heading">Different layers protect different outcomes</text>
  <text x="40" y="88" font-size="20" font-weight="400" fill="#172b4d" data-role="diagram-subtitle">Read left to right, then top to bottom. These are complementary layers.</text>
