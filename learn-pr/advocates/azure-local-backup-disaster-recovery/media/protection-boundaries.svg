    <text x="64" y="218" font-size="24" font-weight="600" fill="#172b4d" data-role="stage-title">Availability</text>
    <text x="64" y="259" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Restart or move a workload after</text>
    <text x="64" y="289" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">a supported component failure.</text>
    <text x="64" y="319" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Limit: doesn't undo application corruption.</text>
  </g>
