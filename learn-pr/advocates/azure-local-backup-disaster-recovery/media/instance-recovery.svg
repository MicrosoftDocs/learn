    <text x="200" y="574" font-size="25" font-weight="600" fill="#172b4d" data-role="stage-title">Validate the platform and management mappings</text>
    <text x="200" y="615" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Check nodes, storage resilience, security, and current lifecycle health.</text>
    <text x="200" y="647" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Verify the bridge, custom location, logical networks, and storage paths.</text>
  </g>
