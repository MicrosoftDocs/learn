<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="diagram-title diagram-description" font-family="Segoe UI, Arial, sans-serif" style="background-color: white">
  <title id="diagram-title">Reconstruct the platform, then recover the service</title>
  <desc id="diagram-description">Classify management, operating-system, and storage loss before provisioning writes. Preserve surviving disks, keys, and configuration. Reestablish platform prerequisites, validate the deployed or repaired platform and management mappings, then restore and validate workloads. Release the accepted service and establish new protection.</desc>
  <rect id="background" x="0" y="0" width="1200" height="1160" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426789" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b3a" />
    </marker>
  </defs>
  <text x="40" y="52" font-size="32" font-weight="600" fill="#172b4d" data-role="diagram-heading">Reconstruct the platform, then recover the service</text>
  <text x="40" y="88" font-size="20" font-weight="400" fill="#172b4d" data-role="diagram-subtitle">Read from top to bottom. Use the approved recovery path for the data and state that survive.</text>
