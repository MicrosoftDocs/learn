    <text x="200" y="776" font-size="25" font-weight="600" fill="#172b4d" data-role="stage-title">Restore and validate workloads in isolation</text>
    <text x="200" y="817" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Recover required guest keys, application data, and service dependencies.</text>
    <text x="200" y="849" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Respect each recovery route's local and Azure management restrictions.</text>
