    <text x="200" y="413" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Prepare independent identity, networks, hardware, media, and Azure access.</text>
    <text x="200" y="445" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Use approved repair, preserved-data redeployment, or reconstruction.</text>
