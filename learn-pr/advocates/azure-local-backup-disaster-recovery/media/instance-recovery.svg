    <text x="200" y="170" font-size="25" font-weight="600" fill="#172b4d" data-role="stage-title">Classify the loss and preserve what survives</text>
    <text x="200" y="211" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Distinguish management, operating-system, and storage failures.</text>
    <text x="200" y="243" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Keep retained disks, keys, metadata, and configuration before any reset.</text>
  </g>
