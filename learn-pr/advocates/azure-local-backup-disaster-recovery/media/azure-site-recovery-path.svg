    <text x="64" y="329" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Compatible guests + disks</text>
    <text x="64" y="389" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Provider + agent on</text>
    <text x="64" y="419" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">every cluster node</text>
    <text x="64" y="479" font-size="20" font-weight="400" fill="#172b4d" data-role="stage-body">Disk state, not VM memory</text>
