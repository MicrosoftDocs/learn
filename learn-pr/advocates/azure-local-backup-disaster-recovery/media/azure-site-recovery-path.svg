<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="diagram-title diagram-description" font-family="Segoe UI, Arial, sans-serif" style="background-color: white">
  <title id="diagram-title">Manual Hyper-V-to-Azure recovery path</title>
  <desc id="diagram-description">The provider and agent on every Hyper-V cluster node register with a Recovery Services vault and replicate disk changes to Azure. Recovery also requires compatible Azure compute, networking, identity, and quota.</desc>
  <rect id="background" x="0" y="0" width="1200" height="860" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426789" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b3a" />
    </marker>
  </defs>
  <text x="40" y="52" font-size="32" font-weight="600" fill="#172b4d" data-role="diagram-heading">Manual Hyper-V-to-Azure recovery path</text>
  <text x="40" y="88" font-size="20" font-weight="400" fill="#172b4d" data-role="diagram-subtitle">Control-plane coordination and replicated disk data have different roles.</text>
