<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="diagram-title diagram-description" font-family="Segoe UI, Arial, sans-serif" style="background-color: white">
  <title id="diagram-title">Hyper-V Replica: stable endpoints across clusters</title>
  <desc id="diagram-description">Two Azure Local clusters each contain a Hyper-V Replica Broker and two illustrative nodes. VM disk changes replicate asynchronously from the source cluster to the replica cluster. Within each cluster, ownership can move between nodes while the configured cluster endpoint stays stable.</desc>
  <rect id="background" x="0" y="0" width="1200" height="920" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426789" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b3a" />
    </marker>
  </defs>
  <text x="40" y="52" font-size="32" font-weight="600" fill="#172b4d" data-role="diagram-heading">Hyper-V Replica: stable endpoints across clusters</text>
  <text x="40" y="88" font-size="20" font-weight="400" fill="#172b4d" data-role="diagram-subtitle">Read panels 1, 2, then 3. Disk replication and VM ownership changes are different operations.</text>
