metadata:
  title: Understand Advanced Windows Firewall
  description: Design, secure, monitor, and troubleshoot advanced Windows Firewall policy for enterprise Windows environments.
  ms.date: 08/05/2026
  author: orthomas
  ms.author: orthomas
  ms.topic: module
  ms.service: windows-server
title: Understand advanced Windows Firewall
summary: Design Windows Firewall rules that limit lateral movement, authenticate sensitive traffic, preserve required application flows, and produce useful evidence.
abstract: |
  After completing this module, you'll be able to:
  - Build precisely scoped firewall rules.
  - Apply profile-specific policy.
  - Design default-deny host segmentation.
  - Explain Internet Protocol security protection.
  - Authorize traffic through user and computer identity.
  - Coordinate firewall rules with connection security rules.
  - Control outbound traffic without broad disruption.
  - Collect firewall evidence.
  - Troubleshoot effective policy and security associations.
prerequisites: |
  - Advanced Windows administration experience.
  - Working knowledge of Active Directory Domain Services and Group Policy.
  - Working knowledge of Transmission Control Protocol, User Datagram Protocol, Internet Control Message Protocol, ports, addresses, and routing.
  - Familiarity with PowerShell administration.
