  <text id="hardware-qualification-text-24" x="78" y="972" font-size="20" font-weight="400" fill="#18354A" text-anchor="start" data-diagram-text="true" data-layout-owner="takeaway" data-max-width="944">
    <tspan x="78" y="972">Meets minimums does not mean sized for your workloads.</tspan>
  </text>
</svg>