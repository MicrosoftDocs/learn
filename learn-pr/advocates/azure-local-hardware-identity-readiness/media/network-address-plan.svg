<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-labelledby="network-address-plan-title network-address-plan-desc" style="background-color:white" font-family="Segoe UI, Arial, sans-serif" data-source-icon-root="C:\Azure-Icons" data-content-review-date="2026-10-28" data-diagram="network-address-plan">
  <title id="network-address-plan-title">Reserve addresses before deployment</title>
  <desc id="network-address-plan-desc">Fictional two-node local-identity training site using existing enterprise DNS and management subnet 192.168.50.0/24. DNS uses .10 and .11; nodes use .21 and .22. Six separate infrastructure addresses .40 through .45 are excluded from DHCP; .40 is the system or cluster address. Remaining service assignment is controlled by deployment. Check routed-network overlap with reserved ranges 10.96.0.0/12 and 10.244.0.0/16; do not allocate them to infrastructure or DNS.</desc>
