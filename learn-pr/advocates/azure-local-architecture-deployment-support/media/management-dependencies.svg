  <text x="80" y="1368" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172b4d" data-role="body" font-weight="600">An internet outage does not change the connectivity model</text>
  <text x="80" y="1412" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#172b4d" data-role="body">Local applications need healthy dependencies to keep running.</text>
  <text x="80" y="1454" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#172b4d" data-role="body">Provisioning can fail. Telemetry can stop during a connectivity outage.</text>
  <text x="80" y="1496" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#172b4d" data-role="body">Application traffic follows its own paths; a management relationship is not a data path.</text>
