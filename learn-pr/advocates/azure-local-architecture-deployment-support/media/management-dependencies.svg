<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1590" viewBox="0 0 1200 1590" role="img" aria-labelledby="connected-control-data-planes-title connected-control-data-planes-description" style="background: white; background-color: white" font-family="Segoe UI, Arial, sans-serif" data-module="1">
  <title id="connected-control-data-planes-title">Azure Local management dependencies</title>
  <desc id="connected-control-data-planes-description">Two dependency lanes distinguish Azure management from local application traffic. Azure Resource Manager, authorization, Azure Arc depend on local management components, including Azure Arc resource bridge where applicable. Agents initiate outbound connections. Local clients use a workload virtual machine with storage, identity, network dependencies. Existing virtual machines can continue during a wide area network interruption if their application dependencies remain healthy. Cloud-dependent provisioning, telemetry can become unavailable. Losing connectivity does not create a disconnected deployment.</desc>
