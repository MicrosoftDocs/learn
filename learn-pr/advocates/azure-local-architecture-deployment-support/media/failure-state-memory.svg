  <title id="failure-state-capacity-title">Failure-state memory capacity</title>
  <desc id="failure-state-capacity-description">Four nodes with 512 gibibytes each provide 2048 gibibytes installed. One unavailable node leaves 1536 gibibytes. Deduct 192 gibibytes of host reserve, then 96 gibibytes of infrastructure demand, leaving 1248 gibibytes. A 20 percent operational reserve leaves a workload budget of 998.4 gibibytes. Demand of 960 gibibytes leaves 38.4 gibibytes spare. Two unavailable nodes leave a budget of 640 gibibytes. These illustrative assumptions are not Microsoft sizing ratios.</desc>
  <rect id="failure-state-capacity-background" x="0" y="0" width="1200" height="1446" fill="#ffffff" />
