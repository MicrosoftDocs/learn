  <text x="138" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="body" font-weight="600">4 x 512 = 2,048 installed</text>
  <text x="138" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="body" font-weight="600">3 x 512 = 1,536 on surviving nodes</text>
  <text x="138" y="736" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#172b4d" data-role="body">Host reserve: 3 x 64 = 192; cluster infrastructure: 96</text>
  <text x="138" y="795" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="body" font-weight="600">1,536 - 192 - 96 = 1,248</text>
  <text x="138" y="1030" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#172b4d" data-role="body">Operational reserve: 20% x 1,248 = 249.6</text>
  <text x="138" y="1078" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172b4d" data-role="body" font-weight="600">Workload budget: 1,248 - 249.6 = 998.4</text>
  <text x="138" y="1129" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172b4d" data-role="body">Demand: 960    |    Spare: 998.4 - 960 = 38.4</text>
  <line x1="600" y1="320" x2="600" y2="372" stroke="#426789" stroke-width="2.5" marker-end="url(#failure-state-capacity-arrow)" data-role="connector" data-path-kind="conceptual-flow" />
  <text x="636" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="connector-label">One node unavailable</text>
  <line x1="600" y1="568" x2="600" y2="620" stroke="#426789" stroke-width="2.5" marker-end="url(#failure-state-capacity-arrow)" data-role="connector" data-path-kind="conceptual-flow" />
  <text x="636" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="connector-label">Deduct fixed overhead</text>
  <line x1="600" y1="864" x2="600" y2="916" stroke="#426789" stroke-width="2.5" marker-end="url(#failure-state-capacity-arrow)" data-role="connector" data-path-kind="conceptual-flow" />
  <text x="636" y="898" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#172b4d" data-role="connector-label">Keep operational reserve</text>
  <rect x="48" y="1230" width="1104" height="172" rx="10" fill="#eef4f8" stroke="#8aa8c2" stroke-width="1.5" data-role="callout-boundary" />
  <text x="80" y="1275" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#172b4d" data-role="body" font-weight="600">Illustrative assumptions, not Microsoft sizing ratios.</text>
  <text x="80" y="1319" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#172b4d" data-role="body">Two nodes unavailable: budget 640; demand 960 does not fit.</text>
  <text x="80" y="1362" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#172b4d" data-role="body">(2 x 512 - 2 x 64 - 96) x 0.8 = 640</text>
</svg>