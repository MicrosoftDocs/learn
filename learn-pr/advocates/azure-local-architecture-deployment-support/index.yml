title: Design an Azure Local architecture, deployment model, and support plan
summary: |
  Designing your Azure Local architecture begins with the business service that must keep working, not with the selection of a server count. In this module, you turn workload objectives into a supported deployment model, identify dependencies that can interrupt service, calculate failure-state capacity, and define who operates and supports the solution.
abstract: |
  After completing this module, you can:

  - Select an Azure Local deployment and connectivity model from workload, locality, and operational requirements.
  - Explain the difference between local workload execution and cloud-dependent management.
  - Translate a failure scenario into compute, storage, network, and recovery requirements.
  - Calculate usable capacity and failure headroom with explicit assumptions.
  - Separate platform support, customer responsibilities, licensing, and workload availability commitments.
  - Record and defend an architecture decision without deploying infrastructure.
prerequisites: |
  - Familiarity with virtual machines, physical servers, networking, and storage.
  - Basic understanding of Azure management and hybrid infrastructure.
  - No Azure subscription or deployed infrastructure is required for the paper-design exercise.
