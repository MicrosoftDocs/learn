<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="cfc2df461d18b733d-title cfc2df461d18b733d-desc" data-module="active-directory-site-replication" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="cfc2df461d18b733d-title">Proving a change reached Chicago from New York</title><desc id="cfc2df461d18b733d-desc">Active Directory sites, topology, and replication, UNIT 06. An originating stamp lets the lab administrator follow the same directory update across differently numbered local histories. 1. Capture the origin: Read the changed attribute's originating metadata on the New York controller. 2. Compare the replica: Read that attribute on the Chicago controller after replication. 3. Check recorded progress: Inspect Chicago's up-to-dateness entry for the originating database. Key takeaways: Matching local USNs are not a success criterion. Verify the change and originating stamp at the destination. When restoring a modified lab link, use the saved original interval and options rather than assumed defaults.</desc><defs><marker id="cfc2df461d18b733d-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="cfc2df461d18b733d-i45" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Database generic.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="cfc2df461d18b733d-i45n0" /><g><g id="cfc2df461d18b733d-i45n1" transform="translate(1972.87,-1602.08)"><path fill="#2A3282" d="M-1576.7,1828.1c-49.7,0-90.8-12-90.8-27.4c0-15.4,40.2-27.4,90.8-27.4c49.7,0,89.9,12,89.9,27.4    C-1486.8,1816.1-1526.2,1828.1-1576.7,1828.1z M-1703.4,1985.6v49.7c0,23.1,46.2,48.8,107,53.1h40.2c60.8-4.3,107-24.8,107-48.8    v-233.7c0-25.7-57.4-50.5-127.6-50.5c-70.2,0-126.7,23.1-126.7,49.7v104.4L-1703.4,1985.6L-1