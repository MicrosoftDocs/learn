<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c9527b07621fa72d3-title c9527b07621fa72d3-desc" data-module="active-directory-site-replication" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c9527b07621fa72d3-title">Two replication policies for two kinds of connection</title><desc id="c9527b07621fa72d3-desc">Active Directory sites, topology, and replication, UNIT 02. The site boundary changes how quickly partners communicate and how much bandwidth each exchange consumes. 1. Within a site: Change notification starts replication promptly across relatively fast connections. 2. Between sites: Scheduled, compressed exchanges conserve bandwidth across a WAN. Key takeaways: Map each routed subnet to its intended site; clients and the replication topology both rely on that mapping. Use link cost to express route preference and the interval to set frequency. A cheaper route is not necessarily a more frequent one.</desc><defs><symbol id="c9527b07621fa72d3-i474" viewBox="0 0 18 18" data-asset="general\10833-icon-service-Scheduler.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><radialGradient id="c9527b07621fa72d3-i474n0" cx="16.858" cy="14.328" r="8.737" gradientTransform="translate(-6.212 -5.281) scale(0.944)" gradientUnits="userSpaceOnUse"><stop offset="0.183" stop-color="#5ea0ef" /><stop offset="0.555" stop-color="#5c9fee" /><stop offset="0.689" stop-color="#559ced" /><stop offset="0.785" stop-color="#4a97e9" /><stop offset="0.862" stop-color="#3990e4" /><stop offset="0.928" stop-color="#2387de" /><stop offset="0.985" stop-color="#087bd6" /><stop offset="1" stop-color="#0078d4" /></radialGradient><radialGradient id="c9527b07621fa72d3-i474n1" cx="17.97" cy="15.337" r="1.223" gradientTransform="translate(-7.203 -6.199) scale(0.943)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7f7f7f" /><stop offset="1" stop-color="#5e5e5e" /></radialGradient></defs><g id="c9527b07621fa72d3-i474n2"><g><g><circle cx="9.71" cy="8.252" r="8.252" fill="url(#c9527b07621fa72d3-i474n0)" /><circle cx="9.742" cy="8.252" r="7.185" fill="#fff" /><rect id="c9527b07621fa72d3-i474n3" x="13.04" y="4.13" width="1.231" height="0.397" transform="translate(0.939 10.924) rotate(-45)" fill="#7a7a7a" /><rect id="c9527b07621fa72d3-i474n4" x="14.61" y="8.045" width="1.231" height="0.397" fill="#7a7a7a" /><rect id="c9527b07621fa72d3-i474n5" x="13.4" y="11.486" width="0.397" height="1.231" transform="translate(-4.574 13.16) rotate(-45)" fill="#7a7a7a" /><rect id="c9527b07621fa72d3-i474n6" x="9.543" y="13.093" width="0.397" height="1.231" fill="#7a7a7a" /><rect id="c9527b07621fa72d3-i474n7" x="5.588" y="3.674" width="0.397" height="1.231" transform="translate(-1.338 5.348) rotate(-45)" fill="#7a7a7a" /><rect id="c9527b07621fa72d3-i474n8" x="5.231" y="11.939" width="1.231" height="0.397" transform="translate(-6.87 7.689) rotate(-45)" fill="#7a7a7a" /><rect id="c9527b07621fa72d3-i474n9" x="3.565" y="8.045" width="1.231" height="0.397" fill="#7a7a7a" /><rect x="9.237" y="2.172" width="1.107" height="6.326" rx="0.505" fill="#7a7a7a" /><rect x="10.722" y="7.822" width="1.105" height="3.961" rx="0.504" transform="translate(26.177 8.761) rotate(135)" fill="#7a7a7a" /><circle cx="9.747" cy="8.238" r="1.169" fill="url(#c9527b07621fa72d3-i474n1)" /></g><path d="M8.078.146A8.294,8.294,0,0,0,5.4,15.353l.274-.726a.161.161,0,0,1,.275-.046L8.1,17.191a.161.161,0,0,1-.1.262L4.657,18a.162.162,0,0,1-.177-.216l.4-1.074A9.719,9.719,0,0,1,.373,10.953,8.462,8.462,0,0,1,8.078.146Z" fill="#86d633" /></g></g></g></symbol></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Active Directory sites, topology, and replication</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 02</text></g><g data-field="title" data-box="56 95 1008 132"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">Two replication policies for two kinds of</text><text x="60" y="210.64" font-size="46" font-weight="700" fill="#132c3b">connection</text></g><g data-field="concept" data-box="56 232 1008 72"><text x="60" y="260.9" font-size="24" font-weight="400" fill="#364f5e">The site boundary changes how quickly partners communicate and how much bandwidth</text><text x="60" y="293.9" font-size="24" font-weight="400" fill="#364f5e">each exchange consumes.</text></g><line x1="56" x2="1064" y1="321" y2="321" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 351.68 360 43"><text x="60" y="383.817" font-size="27" font-weight="700" fill="#132c3b">Side by side</text></g><line x1="233.177" x2="1064" y1="374.9" y2="374.9" stroke="#c6d6df" stroke-width="1.5" /><g data-node="1"><rect x="56" y="406.68" width="493" height="304.32" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="424.68" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 426.18 46 29"><text x="87.797" y="446.447" font-size="16" font-weight="700" fill="#ffffff">01</text></g><g data-field="label" data-box="74 513.502 457 43"><text x="78" y="545.639" font-size="27" font-weight="700" fill="#132c3b">Within a site</text></g><g data-field="detail" data-box="74 563.502 457 64"><text x="78" y="589.162" font-size="21" font-weight="400" fill="#364f5e">Change notification starts replication promptly</text><text x="78" y="618.162" font-size="21" font-weight="400" fill="#364f5e">across relatively fast connections.</text></g></g><g data-node="2"><rect x="571" y="406.68" width="493" height="304.32" rx="15"