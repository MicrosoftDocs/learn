<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c60a7825ffcdefe45-title c60a7825ffcdefe45-desc" data-module="active-directory-site-replication" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c60a7825ffcdefe45-title">Two bookmarks for one replication request</title><desc id="c60a7825ffcdefe45-desc">Active Directory sites, topology, and replication, UNIT 04. Progress with a direct partner and knowledge of original updates answer different questions about what remains to be sent. 1. High-watermark vector: Records progress through a particular partner's local sequence for a partition. 2. Up-to-dateness vector: Records the greatest originating USN seen per database incarnation for that partition. Key takeaways: A replicated write receives a new local USN. Compare the originating stamp for the same attribute to trace it across controllers. Inspect individual linked values to trace different group membership changes without treating the group as one indivisible update.</desc><defs><symbol id="c60a7825ffcdefe45-i45" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Database generic.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="c60a7825ffcdefe45-i45n0" /><g><g id="c60a7825ffcdefe45-i45n1" transform="translate(1972.87,-1602.08)"><path fill="#2A3282" d="M-1576.7,1828.1c-49.7,0-90.8-12-90.8-27.4c0-15.4,40.2-27.4,90.8-27.4c49.7,0,89.9,12,89.9,27.4    C-1486.8,1816.1-1526.2,1828.1-1576.7,1828.1z M-1703.4,1985.6v49.7c0,23.1,46.2,48.8,107,53.1h40.2c60.8-4.3,107-24.8,107-48.8    v-233.7c0-25.7-57.4-50.5-127.6-50.5c-70.2,0-126.7,23.1-126.7,49.7v104.4L-1703.4,1985.6L-1703.4,1985.6z" /></g><g id="c60a7825ffcdefe45-i45n2"><g id="c60a7825ffcdefe45-i45n3" /><g id="c60a7825ffcdefe45-i45n4" /></g><g id="c60a7825ffcdefe45-i45n5" /></g></g></symbol></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fi