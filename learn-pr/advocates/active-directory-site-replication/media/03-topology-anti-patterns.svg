<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c7fbc3c937c3c3545-title c7fbc3c937c3c3545-desc" data-module="active-directory-site-replication" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c7fbc3c937c3c3545-title">DNS discovery can succeed without locality</title><desc id="c7fbc3c937c3c3545-desc">Active Directory sites, topology, and replication, UNIT 03. A controller found through domain-wide DNS may be reachable even when a client's site mapping is missing. 1. Discovery evidence: Domain-wide SRV records help the calling computer locate a controller. 2. Locality evidence: Compare the expected client site with the site returned for the selected controller. Key takeaways: Inspect the discovery policy on the calling computer. Finding a Windows Server 2025 controller does not establish the client's policy. If a branch has no controller, check which neighboring site covers it instead of expecting a local response.</desc><defs /><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Active Directory sites, topology, and replication</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">UNIT 03</text></g><g data-field="title" data-box="56 95 1008 69"><text x="60" y="147.64" font-size="46" font-weight="700" fill="#132c3b">DNS discovery can succeed without locality</text></g><g data-field="concept" data-box="56 169 1008 72"><text x="60" y="197.9" font-size="24" font-weight="400" fill="#364f5e">A controller found through domain-wide DNS may be reachable even when a client's site</text><text x="60" y="230.9" font-size="24" font-weight="400" fill="#364f5e">mapping is missing.</text></g><line x1="56" x2="1064" y1="258" y2="258" stroke="#b6cdd8" stroke-width="1.5" /><g data-field="relation" data-box="56 293.09 360 43"><text x="60" y="325.227" font-size="27" font-weight="700" fill="#132c3b">Side by side</text></g><line x1="233.177" x2="1064" y1="316.31" y2="316.31" stroke="#c6d6df" stroke-width="1.5" /><g data-node="1"><rect x="56" y="348.09" width="493" height="331.41" rx="15" fill="#f1f7fd" stroke="#9abbd4" class="card" /><rect x="74" y="366.09" width="46" height="32" rx="9" fill="#286486" /><g data-field="number" data-box="74 367.59 46 29"><text x="87.797" y="387.857" font-size="16" font-weight="700" fill="#ffffff">01</text></g><g data-field="label" data-box="74 463.581 457 43"><text x="78" y="495.718" font-size="27" font-weight="700" fill="#132c3b">Discovery evidence</text></g><g data-field="detail" data-box="74 513.581 457 64"><text x="78" y="539.241" font-size="21" font-weight="400" fill="#364f5e">Domain-wide SRV records help the calling</text><text x="78" y="568.241" font-size="21" font-weight="400" fill="#364f5e">computer locate a controller.</text></g></g><g data-node="2"><rect x="571" y="348.09" width="493" height="331.41" rx="15" fill="#eff8f7" stroke="#9cbfbd" class="card" /><rect x="589" y="366.09" width="46" height="32" rx="9" fill="#186761" /><g data-field="number" data-box="589 367.59 46 29"><text x="602.797" y="387.857" font-size="16" font-weight="700" fill="#ffffff">02</text></g><g data-field="label" data-box="589 463.581 457 43"><text x="593" y="495.718" font-size="27" font-weight="700" fill="#132c3b">Locality evidence</text></g><g data-field="detail" data-box="589 513.581 457 64"><text x="593" y="539.241" font-size="21" font-weight="400" fill="#364f5e">Compare the expected client site with the site</text><text x="593" y="568.241" font-size="21" font-weight="400" fill="#364f5e">returned for the selected controller.</text></g></g><g data-field="takeaways" data-box="56 732.2 320 45"><text x="60" y="765.413" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="756.5" y2="756.5" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="841.86" r="13" fill="#e2f1ee" /><path d="M71 841.86l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 821.9 948 70"><text x="120" y="849.72" font-size="23" font-weight="400" fill="#364f5e">Inspect the discovery policy on the calling computer. Finding a Windows Server 2025</text><text x="120" y="881.72" font-size="23" font-weight="400" fill="#364f5e">controller does not establish the client's policy.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="930.6" y2="930.6" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="989.26" r="13" fill="#e2f1ee" /><path d="M71 989.26l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 969.3 948 70"><text x="120" y="997.12" font-size="23" font-weight="400" fill="#364f5e">If a branch has no controller, check which neighboring site covers it instead of expecting</text><text x="120" y="1029.12" font-size="23" font-weight="400" fill="#364f5e">a local response.</text></g></g></svg>