uid: learn.windows-server.manage-user-computer-certificates
metadata:
  title: Manage Local User and Computer Certificates
  description: Manage Windows user and computer certificates, private keys, enrollment, trust, renewal, recovery, retirement, and troubleshooting.
  ms.date: 09/20/2026
  author: Orin-Thomas
  ms.author: orthomas
  ms.topic: module-standard-task-based
  ms.service: windows-server
title: Manage local user and computer certificates
summary: Manage certificates for Windows users, computers, services, authentication, encryption, and trust.
abstract: |
  By the end of this module, you'll be able to:
  - Select the correct certificate store and management tool.
  - Inspect certificate identity, purpose, validity, chain, and private-key association.
  - Transfer certificates and private keys safely.
  - Complete certificate enrollment and request workflows.
  - Establish certification authority trust and diagnose private-key access.
  - Renew, recover, troubleshoot, and retire certificates without losing access to encrypted data.
prerequisites: |
  - Familiarity with Windows 11 or Windows Server administration.
  - Basic understanding of authentication, encryption, and public key infrastructure.
