products:
  - azure
prerequisites: |
  - Your own Azure subscription.
  - The [Azure CLI](/cli/azure/install-azure-cli) installed on your computer.
  - [Microsoft Build of OpenJDK 17](/java/openjdk/download).
  - [Maven 3.9.9 or later](https://maven.apache.org/download.cgi).
  - A Bash-compatible shell, such as [Git Bash](https://git-scm.com/install/) on Windows, the [Windows Subsystem for Linux (WSL)](/windows/wsl/install), or [Azure Cloud Shell](https://shell.azure.com).
