  <title id="extension-failure-evidence-timeline-title">Which component returned exit code 23?</title>
  <desc id="extension-failure-evidence-timeline-description">Simulated events for m02-command, sequence 0. Azure accepts the update; the guest agent requests the handler; the submitted command prints its report and exits 23; Azure records failure. An independent SSH check still succeeds.</desc>
