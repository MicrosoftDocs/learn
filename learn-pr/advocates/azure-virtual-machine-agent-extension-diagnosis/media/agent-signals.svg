<text x="40" y="35" font-size="16" font-weight="700">STATUS EVIDENCE</text>
<text x="40" y="84" font-size="38" font-weight="600">Which path produced the signal?</text>
<text x="40" y="120" font-size="21" font-weight="400">Follow the source of the signal before deciding what it proves.</text>
<text x="40" y="166" font-size="17" font-weight="700">01   EXTENSION EXECUTION</text>
<rect id="request" data-kind="card" x="40" y="183" width="288" height="127" rx="12" fill="#f1f7fc" stroke="#276496" stroke-width="1.6"/>
<use data-kind="azure-icon" href="#agent-signals-icon-activity" x="58" y="200" width="32" height="32" aria-hidden="true"/>
<text x="102" y="225" font-size="22" font-weight="600" data-card="request">Azure request</text>
<text x="58" y="259" font-size="19" font-weight="400" data-card="request">The Activity Log records</text>
<text x="58" y="290" font-size="19" font-weight="400" data-card="request">the extension update.</text>
<rect id="agent" data-kind="card" x="376" y="183" width="288" height="127" rx="12" fill="#f1f7fc" stroke="#276496" stroke-width="1.6"/>
<use data-kind="azure-icon" href="#agent-signals-icon-vm" x="394" y="200" width="32" height="32" aria-hidden="true"/>
<text x="438" y="225" font-size="22" font-weight="600" data-card="agent">VM agent</text>
<text x="394" y="259" font-size="19" font-weight="400" data-card="agent">Ready is a recent agent</text>
<text x="394" y="290" font-size="19" font-weight="400" data-card="agent">report, not a script result.</text>
<rect id="handler" data-kind="card" x="712" y="183" width="288" height="127" rx="12" fill="#f1f7fc" stroke="#276496" stroke-width="1.6"/>
<use data-kind="azure-icon" href="#agent-signals-icon-extension" x="730" y="200" width="32" height="32" aria-hidden="true"/>
<text x="774" y="225" font-size="22" font-weight="600" data-card="handler">Extension handler</text>
<text x="730" y="259" font-size="19" font-weight="400" data-card="handler">Match command output and</text>
<text x="730" y="290" font-size="19" font-weight="400" data-card="handler">exit code to this sequence.</text>
<path data-kind="connector" d="M336 246 H367 M362 241 L368 246 L362 251" fill="none" stroke="#455e75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path data-kind="connector" d="M672 246 H703 M698 241 L704 246 L698 251" fill="none" stroke="#455e75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="354" font-size="17" font-weight="700">02   MONITORING TELEMETRY</text>
<rect id="ama" data-kind="card" x="40" y="372" width="456" height="104" rx="12" fill="#edf8f5" stroke="#216e65" stroke-width="1.6"/>
<use data-kind="azure-icon" href="#agent-signals-icon-monitor" x="59" y="391" width="34" height="34" aria-hidden="true"/>
<text x="106" y="418" font-size="23" font-weight="600" data-card="ama">Azure Monitor Agent</text>
<text x="59" y="454" font-size="19" font-weight="400" data-card="ama">Sends monitoring data from the guest.</text>
<rect id="heartbeat" data-kind="card" x="544" y="372" width="456" height="104" rx="12" fill="#edf8f5" stroke="#216e65" stroke-width="1.6"/>
<use data-kind="azure-icon" href="#agent-signals-icon-logs" x="563" y="391" width="34" height="34" aria-hidden="true"/>
<text x="610" y="418" font-size="23" font-weight="600" data-card="heartbeat">Log Analytics workspace</text>
<text x="563" y="454" font-size="19" font-weight="400" data-card="heartbeat">Receives the heartbeat for this VM.</text>
<path data-kind="connector" d="M504 424 H535 M530 419 L536 424 L530 429" fill="none" stroke="#455e75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="takeaway" data-kind="card" x="40" y="505" width="960" height="71" rx="12" fill="#f6f8fa" stroke="#697b89" stroke-width="1.6"/>
<text x="60" y="530" font-size="15" font-weight="700" data-card="takeaway">INTERPRETATION</text>
<text x="60" y="557" font-size="21" font-weight="500" data-card="takeaway">A recent heartbeat and a failed extension can both be accurate.</text>
</svg>
