<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="diagnostic-channel-decision-title diagnostic-channel-decision-description" font-family="Segoe UI, Arial, sans-serif" fill="#000000">
  <title id="diagnostic-channel-decision-title">Which path still reaches the guest?</title>
  <desc id="diagnostic-channel-decision-description">Read the numbered tests from top to bottom. On success, use the path on the right. If guest login, agent execution, and console login are all unavailable, preserve boot evidence and request approved offline diagnosis.</desc>
  <metadata>{&quot;sourceRoot&quot;:&quot;C:\\Azure-Icons&quot;,&quot;icons&quot;:[&quot;compute\\10021-icon-service-Virtual-Machine.svg&quot;]}</metadata>
  <defs>
    <marker id="diagnostic-channel-decision-tip" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#455e75"/></marker>
    <symbol id="diagnostic-channel-decision-icon-vm" viewBox="0 0 18 18"><defs><linearGradient id="diagnostic-channel-decision-icon-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5" x1="8.88" y1="12.21" x2="8.88" y2="0.21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.82" stop-color="#5ea0ef" /></linearGradient><linearGradient id="diagnostic-channel-decision-icon-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866" x1="8.88" y1="16.84" x2="8.88" y2="12.21" gradientUnits="userSpaceOnUse"><stop offset="0.15" stop-color="#ccc" /><stop offset="1" stop-color="#707070" /></linearGradient></defs><rect x="-0.12" y="0.21" width="18" height="12" rx="0.6" fill="url(#diagnostic-channel-decision-icon-vm-f34d9569-2bd0-4002-8f16-3d01d8106cb5)" /><polygon points="11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46" fill="#50e6ff" /><polygon points="11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46" fill="#c3f1ff" /><polygon points="8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22" fill="#9cebff" /><polygon points="5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95" fill="#c3f1ff" /><polygon points="11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95" fill="#9cebff" /><path d="M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z" fill="url(#diagnostic-channel-decision-icon-vm-bdb45a0b-eb58-4970-a60a-fb2ce314f866)" /></symbol>
  </defs>
  <rect id="diagnostic-channel-decision-background" data-kind="background" x="0" y="0" width="1000" height="625" rx="0" fill="#ffffff" stroke="none" stroke-width="1.6"/>
  <text x="38" y="34" font-size="15" font-weight="600" text-anchor="start">ACCESS DECISION</text>
  <text x="38" y="81" font-size="36" font-weight="600" text-anchor="start">Which path still reaches the guest?</text>
  <text x="39" y="115" font-size="20" font-weight="400" text-anchor="start">Use the first applicable test. If it fails or is unavailable, move down.</text>
  <use data-kind="azure-icon" href="#diagnostic-channel-decision-icon-vm" x="903" y="32" width="64" height="64" aria-hidden="true"/>
  <text x="38" y="156" font-size="15" font-weight="600" text-anchor="start">TEST A DEPENDENCY</text>
  <text x="535" y="156" font-size="15" font-weight="600" text-anchor="start">IF THE TEST SUCCEEDS</text>
  <rect id="diagnostic-channel-decision-test-1" data-kind="card" x="38" y="168" width="414" height="90" rx="12" fill="#f1f7fc" stroke="#276496" stroke-width="1.6"/>
  <rect id="diagnostic-channel-decision-use-1" data-kind="card" x="534" y="168" width="428" height="90" rx="12" fill="#edf8f5" stroke="#216e65" stroke-width="1.6"/>
  <text x="56" y="197" font-size="21" font-weight="600" text-anchor="start" data-card="diagnostic-channel-decision-test-1">1. Guest network and login</text>
  <text x="56" y="222" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-test-1">Can you sign in through SSH or RDP</text>
  <text x="56" y="248" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-test-1">and run a command?</text>
  <text x="552" y="197" font-size="21" font-weight="600" text-anchor="start" data-card="diagnostic-channel-decision-use-1">Keep the session open</text>
  <text x="552" y="222" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-use-1">Use it to inspect the guest without</text>
  <text x="552" y="248" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-use-1">depending on the platform agent.</text>
  <path data-kind="connector" d="M461 213 L523 213" fill="none" stroke="#455e75" stroke-width="2.5" marker-end="url(#diagnostic-channel-decision-tip)"/>
  <path data-kind="connector" d="M87 263 L87 279" fill="none" stroke="#455e75" stroke-width="2.5" marker-end="url(#diagnostic-channel-decision-tip)"/>
  <rect id="diagnostic-channel-decision-test-2" data-kind="card" x="38" y="284" width="414" height="90" rx="12" fill="#f1f7fc" stroke="#276496" stroke-width="1.6"/>
  <rect id="diagnostic-channel-decision-use-2" data-kind="card" x="534" y="284" width="428" height="90" rx="12" fill="#edf8f5" stroke="#216e65" stroke-width="1.6"/>
  <text x="56" y="313" font-size="21" font-weight="600" text-anchor="start" data-card="diagnostic-channel-decision-test-2">2. Platform agent and guest execution</text>
  <text x="56" y="338" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-test-2">If the agent is ready, does a short</text>
  <text x="56" y="364" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-test-2">Run Command probe return output?</text>
  <text x="552" y="313" font-size="21" font-weight="600" text-anchor="start" data-card="diagnostic-channel-decision-use-2">Use Run Command</text>
  <text x="552" y="338" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-use-2">Collect a small set of results. This path</text>
  <text x="552" y="364" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-use-2">cannot bypass a failed platform agent.</text>
  <path data-kind="connector" d="M461 329 L523 329" fill="none" stroke="#455e75" stroke-width="2.5" marker-end="url(#diagnostic-channel-decision-tip)"/>
  <path data-kind="connector" d="M87 379 L87 395" fill="none" stroke="#455e75" stroke-width="2.5" marker-end="url(#diagnostic-channel-decision-tip)"/>
  <rect id="diagnostic-channel-decision-test-3" data-kind="card" x="38" y="400" width="414" height="90" rx="12" fill="#f1f7fc" stroke="#276496" stroke-width="1.6"/>
  <rect id="diagnostic-channel-decision-use-3" data-kind="card" x="534" y="400" width="428" height="90" rx="12" fill="#edf8f5" stroke="#216e65" stroke-width="1.6"/>
  <text x="56" y="429" font-size="21" font-weight="600" text-anchor="start" data-card="diagnostic-channel-decision-test-3">3. Authenticated console</text>
  <text x="56" y="454" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-test-3">Can you sign in through Serial Console</text>
  <text x="56" y="480" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-test-3">and run a guest command?</text>
  <text x="552" y="429" font-size="21" font-weight="600" text-anchor="start" data-card="diagnostic-channel-decision-use-3">Use the serial shell</text>
  <text x="552" y="454" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-use-3">Inspect startup or mount errors without</text>
  <text x="552" y="480" font-size="18" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-use-3">relying on the guest network.</text>
  <path data-kind="connector" d="M461 445 L523 445" fill="none" stroke="#455e75" stroke-width="2.5" marker-end="url(#diagnostic-channel-decision-tip)"/>
  <path data-kind="connector" d="M87 495 L87 511" fill="none" stroke="#455e75" stroke-width="2.5" marker-end="url(#diagnostic-channel-decision-tip)"/>
  <rect id="diagnostic-channel-decision-offline" data-kind="card" x="38" y="516" width="924" height="82" rx="12" fill="#fff5e6" stroke="#955116" stroke-width="1.6"/>
  <text x="56" y="548" font-size="22" font-weight="600" text-anchor="start" data-card="diagnostic-channel-decision-offline">4. No verified way to run a guest command</text>
  <text x="56" y="578" font-size="19" font-weight="400" text-anchor="start" data-card="diagnostic-channel-decision-offline">Preserve boot diagnostics and instance view. Use the approved offline recovery process.</text>
</svg>
