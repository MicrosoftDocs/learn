  title: "Diagnose Windows and Linux Azure Virtual Machine Guest, Agent, and Extension Failures"
  description: Diagnose Azure virtual machine guest, platform agent, and extension failures on Windows and Linux by correlating evidence, selecting usable channels, and verifying targeted corrections.
