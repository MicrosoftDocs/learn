title: Certificate enrollment and renewal
summary: Learn how to select, configure, diagnose, renew, replace, and retire certificates issued by Active Directory Certificate Services.
abstract: |
  In this module, you'll:
  - Select an enrollment method from identity, policy, key custody, renewal, network, and assurance requirements.
  - Configure user and computer autoenrollment and evaluate discovery, policy refresh, pending requests, renewal, and supersedence.
  - Execute a file-based certreq.exe lifecycle and diagnose each enrollment stage independently.
  - Design web-based certificate enrollment for domain, non-domain, remote, renewal-only, and key-based-renewal boundaries.
  - Design network device enrollment as a separate registration authority with controlled challenge, service, web server, transport security, and template mappings.
  - Replace certificates after identity, provider, algorithm, key-size, or template changes; prove the active certificate and retire the old one.
prerequisites: |
  - Familiarity with Active Directory Certificate Services, certificate templates, Windows Server administration, and public key infrastructure concepts.
