title: 'Get tips and tricks for teaching SC-900: Microsoft Security, Compliance, and Identity Fundamentals'
summary: Learn tips and tricks about preparing for your first teaching session, which labs to use, when and how to introduce technical topics, as well as other resources and materials.
abstract: |
  After completing this module, you'll be able to:
  *   Understand how to utilize the tips and tricks for teaching SC-900: Microsoft Security, Compliance, and Identity Fundamentals in the classroom.
  *   Leverage the lab environment during the instructional portion of the class .
  *   Explain foundational course terminology and technical topics.
  *   Discover additional resources and materials to prepare students for success on their Microsoft certification exams.
prerequisites: |
  *   Understand the Microsoft technical training program.
  *   Utilize the built-in accessibility features.
  *   Understand using the objective domains when preparing to teach.
  *   Prepare for the exam by understanding the exam structure.
  *   Prepare to teach the fundamentals courses leveraging best practices.
