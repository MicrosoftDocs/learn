title: What is Project Perception?
summary: 'Attackers now operate at AI scale, while most defensive tools still run one at a time. Project Perception is Microsoft''s answer: an agentic security system, accessed through the Agentic security section of the Microsoft Defender portal. This module gives you a grounded picture of what Project Perception is, why it exists, and the core capabilities it provides today. A companion practitioner module walks through how Project Perception coordinates specific areas of SOC work.'
abstract: |
  After completing this module, you'll be able to:
  - Describe Project Perception and the problem it addresses
  - Recognize the shape of multi-agent defense
  - Recognize the core capabilities Project Perception provides today
prerequisites: |
  - Familiarity with common security operations concepts such as alerts, investigations, and threat intelligence
  - Familiarity with the Microsoft Defender portal is helpful but not required
