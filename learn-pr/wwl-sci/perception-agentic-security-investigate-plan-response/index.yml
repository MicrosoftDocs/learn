title: Investigate detected threats and plan a response in Microsoft Perception
summary: 'Use Perception to turn a detected threat into checked investigation findings and a justified response plan. Review the evidence, distinguish affected entities from investigation leads, and assign actions and route unresolved questions to the people who handle them.'
abstract: |
  In this module, you learn how to:
  - Define an investigation question and select a suitable alert or incident input
  - Inspect an investigation's progress, evidence, and report
  - Validate the incident verdict and attack timeline against supporting evidence
  - Distinguish affected entities from possible scope and unassessed resources
  - Prepare a prioritized response plan with owners, approval requirements, and completion checks
prerequisites: |
  - Knowledge of Perception's capabilities and coordinated workflows, as covered in [What is Microsoft Perception?](/training/modules/project-perception-agentic-security-introduction/?azure-portal=true) and [Understand how Microsoft Perception coordinates security operations](/training/modules/project-perception-agentic-security-orientation/?azure-portal=true)
  - Familiarity with starting, supervising, and reviewing sessions, as covered in Run and supervise sessions in Microsoft Perception, or equivalent experience
  - Familiarity with Microsoft Defender incidents, alerts, affected entities, and incident-response procedures
  - No live environment is required to complete the module. To apply the investigation procedures, you need Perception access in the Microsoft Defender portal, the Attack Investigation Agent configured and enabled, and permission to run and supervise its sessions
  - The Attack Investigation Agent requires Microsoft 365 E5, Microsoft Defender XDR, and onboarding to the Microsoft Defender data lake and unified security experience. The agent also needs access to the workloads and scoped resources required for the investigation.
