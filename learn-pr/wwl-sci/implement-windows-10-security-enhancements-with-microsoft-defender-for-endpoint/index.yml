title: Implement Windows security enhancements with Microsoft Defender for Endpoint
summary: Microsoft Defender for Endpoint gives you various tools to eliminate risks by reducing the surface area for attacks without blocking user productivity. Learn about Attack Surface Reduction (ASR) with Microsoft Defender for Endpoint.
abstract: |
  Upon completion of this module, the learner is able to:
  - Explain Attack Surface Reduction in Windows
  - Enable Attack Surface Reduction rules on Windows devices
  - Configure Attack Surface Reduction rules on Windows devices
prerequisites: |
  Intermediate understanding of Windows 10 and 11.
