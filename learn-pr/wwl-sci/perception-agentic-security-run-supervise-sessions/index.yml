title: Run and supervise sessions in Microsoft Perception
summary: 'Learn how to run and supervise work in Perception from the initial security request through review and handoff. Review how to choose a playbook, follow agent activity, respond to requests, and decide how the team can use the result.'
abstract: |
  In this module, you learn how to:
  - Identify the needed security outcome and choose an appropriate playbook
  - Confirm the required input and access, start a session, and follow its progress
  - Respond to agent requests and redirect or stop work when appropriate
  - Review the session findings against the available evidence and the original request
  - Record what can be used, what remains unresolved, and who acts next
prerequisites: |
  - Knowledge of Perception's capabilities and coordinated workflows, as covered in [What is Microsoft Perception?](/training/modules/project-perception-agentic-security-introduction/?azure-portal=true) and [Understand how Microsoft Perception coordinates security operations](/training/modules/project-perception-agentic-security-orientation/?azure-portal=true)
  - Familiarity with threat intelligence, security operations, and the Microsoft Defender portal
  - No live environment is required to complete the module. To apply the procedures in the portal, you need Perception preview access, the required agents configured and enabled with appropriate data access, and permission to run and supervise sessions
