title: Plan integrated security operations using ISOC in Microsoft Defender
summary: Plan an Integrated Security Operations Center (ISOC) adoption approach that aligns Microsoft Defender capabilities, workspace decisions, security data, governance, and operational priorities.
abstract: |
  After completing this module, you can:
  - Describe how ISOC combines XDR, SIEM, threat intelligence, automation, and AI capabilities in the Microsoft Defender portal.
  - Identify the eligibility, licensing, and permission requirements for the ISOC preview.
  - Identify which ISOC capabilities work without an ISOC workspace and which require one.
  - Describe the elements of a phased ISOC adoption plan that accounts for security data, operational workflows, access, retention, billing, and preview limitations.
prerequisites: |
  - Familiarity with security operations center processes for detecting, investigating, and responding to threats.
  - Basic knowledge of security information and event management (SIEM) and extended detection and response (XDR) concepts.
  - Familiarity with the Microsoft Defender portal and Microsoft Defender XDR.
  - Awareness of your organization's security data sources, retention needs, and incident-response workflows.
