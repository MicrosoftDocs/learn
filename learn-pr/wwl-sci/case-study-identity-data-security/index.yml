title: "Interactive case study: Modernizing identity and data security"
summary: "Apply your cybersecurity architect skills on a real business scenario focused on identity and data security. Analyze design requirements, answer conceptual and technical questions and design a solution to meet the business needs."
abstract: |
  In this interactive case study, you:
  - Explore identity lifecycle gaps, guest access risks, and monitoring limitations.
  - Learn how these challenges align with Zero Trust principles.
  - Apply architectural reasoning to assess threats and design secure solutions.
prerequisites: |
  -   Experience and knowledge in identity and access, platform protection, security operations, securing data and securing applications.
  -   Experience with hybrid and cloud implementations.
