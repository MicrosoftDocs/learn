title: Plan and design the integration of enterprise apps for SSO
summary: Enterprise app deployment enables control over which users can access the apps, easily log into apps with single-sign-on, and provide integrated usage reports.
abstract: |
  By the end of this module, you're able to:

  -   Discover apps by using Defender for Cloud Apps or ADFS app report.

  -   Design and implement access management for apps.

  -   Design and implement app management roles.

  -   Configure preintegrated (gallery) SaaS apps.
