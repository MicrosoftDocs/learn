title: Design solutions for securing privileged access
summary: |
  You learn advanced techniques for designing solutions that secure privileged access using Zero Trust principles, the Enterprise Access Model, and Microsoft Entra ID governance capabilities, including considerations for AI workloads and multicloud environments.
abstract: |
  By the end of this module, you're able to:
  - Understand privileged access and the Enterprise Access Model
  - Design identity governance solutions
  - Design a solution for securing administration of cloud tenants
  - Design for cloud infrastructure entitlement management
prerequisites: |
  - Advanced experience and knowledge in identity and access, platform protection, security operations, securing data, and securing applications.
  - Experience with hybrid and cloud implementations.
