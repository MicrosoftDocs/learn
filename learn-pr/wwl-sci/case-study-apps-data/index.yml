title: "Interactive case study: Securing apps and data"
summary: "Apply your cybersecurity architect skills on a real business scenario focused on securing apps and data. Analyze design requirements, answer conceptual and technical questions and design a solution to meet the business needs."
abstract: |
  In this interactive case study, you:
  - Explore risks related to application code, CI/CD pipelines, and cloud configuration drift.
  - Learn how these challenges align with Zero Trust principles and DevSecOps best practices.
  - Apply architectural reasoning to assess threats and design secure, scalable solutions for multi-cloud environments.
prerequisites: |
  -   Experience and knowledge in identity and access, platform protection, security operations, securing data and securing applications.
  -   Experience with hybrid and cloud implementations.
