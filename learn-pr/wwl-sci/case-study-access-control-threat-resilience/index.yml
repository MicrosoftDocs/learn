title: "Interactive case study: Modernizing user access control and threat resilience"
summary: "Apply your cybersecurity architect skills on a real business scenario focused on user access control and threat resilience. Analyze design requirements, answer conceptual and technical questions and design a solution to meet the business needs."
abstract: |
  In this interactive case study, you:
  - Explore the operational and security challenges commonly associated with fragmented identity systems, legacy infrastructure, and inconsistent access governance.
  - Learn how to apply Zero Trust principles using Microsoft technologies to modernize access control, improve threat detection, and enforce compliance across hybrid environments.
  - Apply architectural reasoning to assess threats and design secure solutions.
prerequisites: |
  -   Experience and knowledge in identity and access, platform protection, security operations, securing data and securing applications.
  -   Experience with hybrid and cloud implementations.
