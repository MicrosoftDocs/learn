title: Understand how Project Perception coordinates security operations
summary: 'Project Perception is Microsoft''s agentic security system, accessed through the Agentic security section of the Microsoft Defender portal. Machine-paced attackers move faster than security teams can coordinate work across specialist boundaries. This module explains how Project Perception connects security operations while humans stay in control of critical decisions. Learn to distinguish focused execution from coordination needs and choose a response based on supported capabilities, available inputs, authorization, and organizational objectives.'
abstract: |
  After completing this module, you will be able to:
  - Explain why human-paced security operations struggle to keep up with machine-paced attackers
  - Describe how coordinated multi-agent defense runs those tasks as one connected workflow, handled by Red, Blue, and Green team agents
  - Map Project Perception's agents and playbooks onto that model
  - Recognize when focused agent support or a coordinated playbook fits a security objective by checking capabilities, inputs, and authorization
prerequisites: |
  - Day-to-day familiarity with security operations concepts such as alerts, investigations, threat intelligence, and vulnerability management
  - High-level familiarity with the Microsoft Defender portal and Microsoft Defender XDR workflows
  - Basic familiarity with AI agents that act on a user's behalf
