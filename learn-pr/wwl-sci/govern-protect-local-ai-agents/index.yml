title: Govern and protect local AI agents
summary: Recognize the risks that local AI agents introduce on managed devices, and choose the governance and protection controls that fit each risk across the agent lifecycle.
abstract: |
  After completing this module, you're able to:
  - Identify the risks introduced when local agents access devices, data, tools, and connected applications
  - Explain how discovery, identity, network, runtime, data protection, and containment controls address those risks
  - Map discovery, protection, monitoring, investigation, and remediation responsibilities across Microsoft security and management services
prerequisites: |
  - Familiarity with endpoint security and managed devices
  - Basic knowledge of identities, permissions, and least privilege
  - Basic knowledge of security alerts and incident response
