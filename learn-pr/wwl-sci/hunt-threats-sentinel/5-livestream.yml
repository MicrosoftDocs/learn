quiz:
  title: Check your knowledge
  questions:
  - content: "Which Microsoft Sentinel feature organizes queries, bookmarks, entities, comments, analytics rules, and incidents around an investigation hypothesis?"
    choices:
    - content: "A hunt"
      isCorrect: true
      explanation: "A hunt preserves the queries, evidence, entities, and actions associated with an investigation hypothesis."
    - content: "A workbook"
      isCorrect: false
      explanation: "A workbook visualizes data but doesn't organize a threat-hunting investigation."
    - content: "A data connector"
      isCorrect: false
      explanation: "A data connector ingests data but doesn't organize a threat-hunting investigation."
