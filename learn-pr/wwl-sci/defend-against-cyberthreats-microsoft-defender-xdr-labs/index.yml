title: Defend against Cyberthreats with Microsoft Defender XDR lab exercises
summary: "In this module, you configure the Microsoft Defender XDR environment, deploy Microsoft Defender for Endpoint and onboard devices, configure policies, mitigate threats, and investigate and respond to incidents with Microsoft Defender XDR."
abstract: |
  Upon completion of this module, the learner is able to:
    - Configure the Microsoft Defender XDR environment
    - Deploy Microsoft Defender for Endpoint
    - Mitigate threats using Microsoft Defender for Endpoint
    - Investigate and respond to alerts and incidents using Microsoft Defender XDR
prerequisites: |
    - Basic experience with the Microsoft Defender portal
    - Basic experience and understanding of Security Operations Center (SOC) operations
    - Access to a Microsoft 365 E5 tenant with a Microsoft Defender for Endpoint P2 license, or trial licenses
