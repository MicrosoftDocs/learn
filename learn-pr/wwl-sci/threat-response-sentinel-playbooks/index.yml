title: Threat response with Microsoft Sentinel playbooks
summary: This module describes how to create Microsoft Sentinel playbooks to respond to security threats.
abstract: |
  In this module you will:
  - Explain Microsoft Sentinel SOAR capabilities.
  - Explore the Microsoft Sentinel Logic Apps connector.
  - Create a playbook to automate an incident response.
  - Run a playbook on demand in response to an incident.
prerequisites: |
  - Automation and monitoring
  - Azure Monitor and its Log Analytics workspace
  - Azure Logic Apps
