title: Describe the function and identity types of Microsoft Entra ID
summary: Microsoft Entra ID is Microsoft's cloud-based identity and access management solution that connects people to their apps, devices, and data. Learn about the functions and identity types supported by Microsoft Entra ID, including agent identities for AI, hybrid identity, and external identities.
abstract: |
  By the end of this module, you'll be able to:
    - Describe Microsoft Entra and the function of Microsoft Entra ID.
    - Describe the types of identities supported by Microsoft Entra ID.
    - Describe Microsoft Entra Agent ID and its role in securing AI agents.
    - Describe the concept of hybrid identity.
    - Describe external identities supported through Microsoft Entra External ID.
prerequisites: |
  - General understanding of networking and cloud computing concepts.
  - General IT knowledge or any general experience working in an IT environment.
  - General understanding of Microsoft Azure and Microsoft 365.
