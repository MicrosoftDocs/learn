title: Respond to data loss prevention alerts using Microsoft 365
summary: As a Security Operations Analyst, you need to understand compliance related terminology and alerts. Learn how the data loss prevention alerts help in your investigation to find the full scope of the incident.
abstract: |
  Upon completion of this module, the learner is able to:
  - Describe data loss prevention (DLP) components in Microsoft 365
  - Investigate DLP alerts in the Microsoft Purview compliance portal
  - Investigate DLP alerts in Microsoft Defender for Cloud Apps
prerequisites: |
  Intermediate understanding of Microsoft 365.
