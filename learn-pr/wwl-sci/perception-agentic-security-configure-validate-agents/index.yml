title: Configure and validate agents in Microsoft Perception
summary: 'Learn how to set up a Perception agent for approved security work. Review the access checks, testing procedures, and evidence needed to hand over the configuration and results.'
abstract: |
  In this module, you learn how to:
  - Turn an approved task into setup requirements and acceptance criteria
  - Configure the agent identity and check its required permissions
  - Confirm required services and security practitioner access separately
  - Test the approved task, diagnose an access failure, and retest after correction
  - Record the readiness decision, limitations, and operational owner
prerequisites: |
  - Familiarity with Perception's capabilities and coordinated workflows, as covered in [What is Microsoft Perception?](/training/modules/project-perception-agentic-security-introduction/?azure-portal=true) and [Understand how Microsoft Perception coordinates security operations](/training/modules/project-perception-agentic-security-orientation/?azure-portal=true)
  - Familiarity with Microsoft Entra identities, role assignments, and Microsoft Defender access management
  - Familiarity with starting, supervising, and reviewing sessions, as covered in Run and supervise sessions in Microsoft Perception, or equivalent experience
  - No live environment is required to complete the module. To apply the setup procedures, you need an approved task, Perception preview access in the Microsoft Defender portal, Security Admin access, unified role-based access control enabled across Defender workloads, and authority to arrange required grants
  - To apply the Threat Intelligence Agent procedures, you also need Microsoft Defender XDR, Microsoft Defender Threat Intelligence access for full data and enrichment, and a security practitioner account with the access needed for the task
