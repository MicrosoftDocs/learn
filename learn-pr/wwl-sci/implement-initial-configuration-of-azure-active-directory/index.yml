title: Implement initial configuration of Microsoft Entra ID
summary: Learn to create an initial Microsoft Entra ID configuration to ensure all the identity solutions available in Azure are ready to use. This module explores how to build and configure a Microsoft Entra system.
abstract: |
  By the end of this module, you'll be able to:

  -   Implement initial configuration of Microsoft Entra ID.

  -   Create, configure, and manage identities.

  -   Implement and manage external identities (excluding B2C scenarios).

  -   Implement and manage hybrid identity.
