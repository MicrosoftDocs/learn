title: Secure your Azure Storage account
summary: Learn how Azure Storage provides multilayered security to protect your data. Find out how to use access keys, to secure networks, and to use Advanced Threat Protection to proactively monitor your system.
abstract: |
  In this module, you:
    - Explore the Azure Data Lake enterprise-class security features.
    - Understand storage account keys.
    - Understand shared access signatures.
    - Understand transport-level encryption with HTTPS.
    - Understand Advanced Threat Protection.
    - Control network access.
