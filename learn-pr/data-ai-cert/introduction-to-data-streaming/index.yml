title: Get started with Azure Stream Analytics
summary: Azure Stream Analytics enables you to process real-time data streams and integrate the data they contain into applications and analytical solutions.
abstract: |
  In this module, you learn how to:
  - Understand data streams.
  - Understand event processing.
  - Understand window functions.
  - Get started with Azure Stream Analytics.
prerequisites: |
  Before starting this module, you should be familiar with Microsoft Azure and have a basic knowledge of data storage and querying using SQL.
