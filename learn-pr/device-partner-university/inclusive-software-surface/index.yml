summary: >
  In this module, you'll learn how to use Windows accessibility features on Surface devices to support inclusive work. You'll explore the vision, hearing and comprehension, and mobility and input accessibility features available in Windows 11. You'll also learn how to customize these features to meet your needs.
abstract: |
  By the end of this module, you'll be able to:
  - Identify the vision, hearing and comprehension, and mobility and input accessibility features available in Windows 11.
  - Customize Windows accessibility features to meet your needs.
  - Support inclusive work with Windows accessibility features on Surface devices.
