### YamlMime:Module
uid: learn.dpu.ai-workload-visibility
title: Gain visibility into AI workloads with Windows Task Manager
metadata:
  title: Gain Visibility Into AI Workloads With Windows Task Manager
  description: In this module, you'll explore how Windows Task Manager provides visibility into AI workloads running on supported devices. You'll learn how to monitor NPU and GPU neural engine utilization, identify AI resource usage, and use these insights to investigate performance, power efficiency, and workload behavior.
  ms.date: 09/30/2026
  author: Stephanie-Rosenzweig
  ms.author: v-stephanier
  ms.topic: module
  ms.service: windows-11
summary: >
  As AI becomes integrated into more Windows experiences, organizations need to understand how AI workloads use device resources. In this module, you'll explore how Windows Task Manager helps IT professionals, developers, and users monitor AI processing activity, understand hardware utilization, identify workload fallback scenarios, and investigate the performance and power characteristics of AI-enabled applications.

abstract: |
  By the end of this module, you'll be able to:
  - Explain why understanding AI workloads is important as AI becomes a core part of the Windows experience.
  - Describe the role of NPUs and GPU neural engines in accelerating AI workloads on Windows devices.
  - Identify and interpret the AI-related metrics available in Windows Task Manager.
  - Assess whether observed activity is consistent with an application using dedicated AI hardware or an alternative processing path.
  - Explain how AI workload utilization can influence performance and power behavior.

prerequisites: |
  - None
