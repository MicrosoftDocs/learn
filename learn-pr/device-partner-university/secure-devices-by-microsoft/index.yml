abstract: |
  In this module, you'll learn:
  - How Microsoft Surface devices are built secure from the ground up.
  - The trusted layers of security integrated into Surface devices.
  - The built-in security features that protect your data and privacy.
  - How Surface devices provide ultimate control for IT administrators.

