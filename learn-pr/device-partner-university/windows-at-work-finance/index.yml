summary: >
  This module teaches learners how to use Copilot and Windows 11 features to analyze business data efficiently. It covers generating insights, creating visualizations, and preparing stakeholder-ready presentations using Excel and PowerPoint.
abstract: |
  By the end of this module, you'll be able to:
  - Use Windows 11 features to organize your workspace and protect sensitive data.
  - Analyze financial data with Copilot in Excel and Copilot in PowerPoint to generate actionable insights.
  - Build a clear, visually effective presentation for stakeholders.
