title: Module assessment
metadata:
  module_assessment: true
  title: Module Assessment
  description: This content is part of the "Support mobile productivity with Surface Laptop for Business 13-inch" module.
  ms.date: 09/23/2026
  author: ozahran7
  ms.author: v-zahranomar
