abstract: |
 By the end of this module, you'll be able to:
    - Plan an agent by defining its purpose, audience, scope, knowledge, and expected behavior.
    - Create and configure an agent in Microsoft Copilot Studio by using instructions and approved knowledge sources.
    - Test and refine an agent by validating its responses against defined requirements.

