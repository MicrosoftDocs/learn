title: Create and refine ideas with Ink Canvas on Surface
metadata:
  title: Create and Refine Ideas with Ink Canvas on Surface
  description: 'Learn how Microsoft Ink Canvas combines pen-first input, AI capabilities, and Surface hardware to transform handwritten notes, sketches, annotations, and visual ideas into reusable content. Explore how to access and configure Ink Canvas, use its core tools and AI capabilities, and extend your ideas into Microsoft 365 workflows.'
  ms.date: 11/09/2026
  author: ozahran7
  ms.author: v-zahranomar
  ms.topic: module
  ms.service: surface
summary: >
  Learn how Microsoft Ink Canvas combines pen-first input, AI capabilities, and Surface hardware to transform handwritten notes, sketches, annotations, and visual ideas into reusable content. Explore how to access and configure Ink Canvas, use its core tools and AI capabilities, and extend your ideas into Microsoft 365 workflows.

abstract: |
  By the end of this module, you'll be able to:
  - Describe how Ink Canvas uses ink and AI to transform ideas into content.
  - Differentiate Ink Canvas from OneNote and Microsoft Whiteboard based on their core purposes and workflows.
  - Access and configure Ink Canvas on supported Surface and Windows devices.
  - Explain how Surface Slim Pen and Surface hardware enhance the Ink Canvas experience.
  - Use Ink Canvas tools and AI capabilities to create, refine, summarize, and reuse content in Microsoft 365 workflows.

prerequisites: |
  - None
