abstract: |
  By the end of this module, you'll be able to:
  - Identify the Microsoft Adaptive Accessories that can help improve accessibility and productivity for people with disabilities.
  - Explain how to configure Microsoft Adaptive Accessories for accessible productivity.
  - Demonstrate how to use Microsoft Adaptive Accessories to improve productivity and collaboration for all employees.
  - Identify the benefits of using Microsoft Adaptive Accessories for both employees and organizations.

