summary: >
 Learn how to install and use AI Dev Gallery (Preview) to explore local AI models, APIs, and sample experiences on Copilot+ PCs. Discover how Foundry on Windows enables responsive, on-device AI workloads powered by the NPU.
abstract: |
 By the end of this module, you'll be able to:
 - Download and access AI Dev Gallery (Preview) from the Microsoft Store
 - Learn about AI with local models and APIs for Windows apps
 - Discover scenarios and models such as Phi, Mistral, and others
 - Explain and showcase how the models and scenarios in AI Dev Gallery (Preview) can be used by partners and customers to understand AI workloads on-device
