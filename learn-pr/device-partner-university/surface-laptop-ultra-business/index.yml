abstract: |
  By the end of this module, you'll be able to:
  - Understand local AI and high-performance workflows with Microsoft Surface Laptop Ultra for Business.
  - Identify scenarios where Surface Laptop Ultra for Business can enhance productivity.
  - Use Foundry Local to run supported AI models on Surface Laptop Ultra for Business.
  - Choose high-performance workflows that support productivity with Surface Laptop Ultra for Business.

