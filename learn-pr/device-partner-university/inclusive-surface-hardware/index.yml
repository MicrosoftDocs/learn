summary: >
  In this module, you'll learn how inclusive Surface hardware can help reduce workplace barriers for people with disabilities. You'll also learn about the accessibility features of Surface devices and how to use them to create a more inclusive work environment.

abstract: |
  By the end of this module, you'll be able to:
  - Identify the accessibility features of Surface devices that can help reduce workplace barriers for people with disabilities.
  - Explain how to use inclusive Surface hardware to create a more inclusive work environment.
  - Demonstrate how to use the accessibility features of Surface devices to improve productivity and collaboration for all employees.
  - Identify the benefits of using inclusive Surface hardware for both employees and organizations.

