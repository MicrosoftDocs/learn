summary: >
  In this module, you'll learn how to confirm access and assign roles in Surface portals. You'll understand the importance of confirming access and assigning appropriate roles to users in order to ensure a secure and efficient experience when using Surface portals.

abstract: |
  By the end of this module, you'll be able to:
  - Verify whether a Microsoft tenant exists.
  - Identify the global administrator for a Microsoft tenant.
  - Assign suitable roles for Surface portals.

