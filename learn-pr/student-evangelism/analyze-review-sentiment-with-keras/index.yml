title: Analyze the sentiment of reviews with Keras
summary: Keras is a high-level neural networks API, written in Python, that runs on top of other deep learning tools such as TensorFlow. This module uses Keras to build a neural network that scores text, such as user reviews for sentiment.
abstract:  |
  In this module, you will:
  - Create a Jupyter notebook in Azure Notebooks
  - Use Keras to build and train a neural network to perform sentiment analysis
  - Use the neural network to analyze text for sentiment 
