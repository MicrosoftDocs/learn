title: Design degree program curricula that implement certification
summary: Design academic curricula that include Microsoft certification implemented at the course and program levels, and determine how students can earn academic credit for certification courses.
abstract: |
    When you finish this module, you'll be able to:
     - Choose the Microsoft certifications that meet the needs of your program.
     - Design your program and your approach to implementing certifications.
     - Map your academic learning outcomes to certification outcomes.
prerequisites: |
    - Familiarity with academic processes for course development in higher education.
    - Experience creating and managing learning resources for academic courses.
