title: Challenge project – Ideate with Microsoft Copilot
summary: Use Microsoft Copilot, Your everyday AI companion, to Create the perfect idea for your Startup or business
abstract: |
  In this module you'll develop the following skills that can be used in your everyday interaction with Generative AI:
    - Utilizing the various features or capabilities of Microsoft Copilot
    - Utilizing multi-modal features of Microsoft Copilot
    - Prompt writing tips and techniques
    - Practice your Critical/ Creative Thinking with Microsoft Copilot
    - Researching with Microsoft Copilot
    - Applying format and tone to Generative AI Models
prerequisites: |
  - Personal account for [Microsoft Copilot](https://copilot.microsoft.com/) and [Copilot Designer](https://copilot.microsoft.com/images/create)
