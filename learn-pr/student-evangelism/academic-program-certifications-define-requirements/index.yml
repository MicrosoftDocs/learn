title: Define academic and industry requirements for implementing certifications in degree programs
summary: Identify the main processes involved in planning to implement certifications and to define academic and industry requirements in a new program proposal document.
abstract: |
    When you finish this module, you'll be able to:
    - Choose the most suitable approach to implement certifications at your institution.
    - Identify academic requirements for developing new programs that offer certifications.
    - Identify industry requirements for developing new programs that offer certifications.
    - Describe how to create a new program proposal document.
prerequisites: |
    - Familiarity with academic processes in higher education for creating courses.
    - Experience creating and managing learning resources for courses
