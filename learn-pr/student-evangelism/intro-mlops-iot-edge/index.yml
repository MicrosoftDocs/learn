title: "Introduction to MLOps for IoT Edge"
summary: "Analyze the significance of MLOps in the development and deployment of machine learning models for IoT Edge. Describe the components of the MLOps pipeline and show how you can combine them to create models that can be retrained automatically for IoT Edge devices."
abstract: |
    In this module, you will:
    - Evaluate whether MLOps is appropriate to automate your machine learning model building and deployment processes for edge devices.
    - Describe how the MLOps pipeline and components work together to deploy and retrain machine learning models on edge devices.

prerequisites: |
    - Basic knowledge of DevOps
    - Basic knowledge of IoT Edge
