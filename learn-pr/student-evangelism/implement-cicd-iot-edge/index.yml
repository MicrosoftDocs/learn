summary: "Define a solution for smoke testing for virtual Azure IoT Edge devices. Your solution employs a CI/CD (continuous integration/continuous deployment) strategy using Azure DevOps and Azure Pipelines on a Kubernetes cluster."
abstract: |
    In this module, you will:
    - Create a pipeline that deploys a smoke test using virtual IoT Edge devices.
prerequisites: |
    - Basic knowledge of Azure DevOps
    - Basic knowledge of CI/CD
    - Basic knowledge of IoT Edge
    - An active Azure subscription
    - A GitHub account
