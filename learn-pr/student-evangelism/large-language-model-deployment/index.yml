title: "Create a large language model deployment"
summary: "This module provides a step-by-step guide on the following subjects: How to provision an Azure OpenAI cloud resource. How to create a deployment for a specific large language model (LLM). How to experiment with different prompts to explore the capabilities of an LLM in various scenarios."
abstract: |
 In this module, you learn how to: 
  - Provision an Azure OpenAI cloud resource.
  - Create a deployment for a specific LLM model.
  - Experiment with different prompts to see what type of results an LLM can provide in different situations.
