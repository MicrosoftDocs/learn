durationInMinutes: 5
content: |
  [!include[](includes/6-knowledge-check.md)]
quiz:
  questions:
  - content: "A clinic's scheduling system needs an immediate no-show risk score the moment staff book an appointment. Which endpoint type should the team deploy the model to?"
    choices:
    - content: "Batch endpoint"
      isCorrect: false
      explanation: "Incorrect. A batch endpoint generates predictions for a set of records on a schedule, which doesn't meet the need for an immediate response."
    - content: "Online endpoint"
      isCorrect: true
      explanation: "Correct. An online endpoint returns a synchronous, low-latency prediction the moment it receives a request, which matches the real-time requirement."
    - content: "Private endpoint"
      isCorrect: false
      explanation: "Incorrect. A private endpoint is a networking feature that controls connectivity to a resource; it isn't a model deployment target."
  - content: "Why can Azure Machine Learning generate the scoring script and environment automatically when a data science team logs a model with MLflow?"
    choices:
    - content: "Because the MLflow model format stores metadata that Azure Machine Learning uses to build them during deployment"
      isCorrect: true
      explanation: "Correct. MLflow packages the model with metadata that Azure Machine Learning reads to generate the scoring script and environment, enabling no-code deployment."
    - content: "Because registering the model converts it to a pickle file that requires no additional configuration"
      isCorrect: false
      explanation: "Incorrect. Registration doesn't convert the model format. No-code deployment depends on the model being packaged as an MLflow model, not a pickle file."
    - content: "Because Azure Machine Learning only supports deploying MLflow models"
      isCorrect: false
      explanation: "Incorrect. Azure Machine Learning also supports custom models, but those require a hand-written scoring script and environment."
  - content: "A team shifts 25% of endpoint traffic to a new model deployment. Its error rate rises sharply, while the previous deployment remains healthy. What should the team do first?"
    choices:
    - content: "Delete the previous deployment and recreate the endpoint"
      isCorrect: false
      explanation: "Incorrect. Deleting the healthy deployment removes the fastest recovery option, and recreating the endpoint is unnecessary."
    - content: "Route all traffic back to the previous deployment, then investigate the new version"
      isCorrect: true
      explanation: "Correct. Reassigning traffic rolls back the release without changing the endpoint URL. The team can investigate the new deployment while users continue using the healthy model."
    - content: "Continue increasing traffic to determine whether the error rate stabilizes"
      isCorrect: false
      explanation: "Incorrect. Increasing traffic exposes more users to a known regression. Roll back first and investigate without production traffic."
  - content: "A team deploys and tests a model automatically, but wants a reviewer to approve it before the workflow shifts production traffic. What should the team configure?"
    choices:
    - content: "A protected GitHub production environment with a required reviewer"
      isCorrect: true
      explanation: "Correct. The promotion job can reference the protected environment and wait for approval before it accesses environment configuration or changes production traffic."
    - content: "A branch protection rule that runs after every deployment"
      isCorrect: false
      explanation: "Incorrect. Branch protection controls changes merged into a branch. A GitHub environment protection rule controls whether a deployment job can proceed."
    - content: "A repository variable that records whether the deployment was approved"
      isCorrect: false
      explanation: "Incorrect. A variable stores configuration but doesn't enforce approval. An environment protection rule provides the deployment gate."
  - content: "A model monitor reports a sustained prediction drift signal, and clinic staff confirm the flagged patients aren't actually high-risk. What's the most appropriate next step for the data science team?"
    choices:
    - content: "Ignore the signal, since the endpoint's operational metrics show a normal error rate"
      isCorrect: false
      explanation: "Incorrect. A healthy error rate only confirms the endpoint is responding; it says nothing about whether the model's predictions still match reality."
    - content: "Investigate the signal and consider retraining the model on more recent data"
      isCorrect: true
      explanation: "Correct. A sustained drift signal combined with confirmed prediction errors is a strong case for investigating the root cause and retraining the model."
    - content: "Delete the endpoint so it stops serving predictions"
      isCorrect: false
      explanation: "Incorrect. Removing the endpoint stops the clinic from getting any predictions at all, which is a disproportionate response to a signal that calls for investigation and likely retraining."
