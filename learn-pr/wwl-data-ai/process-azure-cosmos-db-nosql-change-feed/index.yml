title: Process the Azure Cosmos DB for NoSQL change feed
summary: Read the Azure Cosmos DB for NoSQL change feed with the processor and pull models. Choose the change feed mode a workload needs, react to changes with Azure Functions, and move container data with container copy jobs.
abstract: |
  After completing this module, you're able to:
  - Differentiate the change feed processor and pull models and configure lease containers.
  - Choose between latest version mode and all versions and deletes mode for a workload.
  - Handle change feed events with Azure Functions and move data with container copy jobs.
prerequisites: |
  - Experience creating and configuring an Azure Cosmos DB for NoSQL client with the SDK
  - Experience performing point operations and queries against an Azure Cosmos DB for NoSQL container
  - Programming experience with C# or Python
