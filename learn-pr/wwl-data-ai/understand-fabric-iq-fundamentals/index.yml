title: Understand Microsoft Fabric IQ fundamentals
summary: Microsoft Fabric IQ is part of Microsoft IQ, an enterprise intelligence layer that elevates business data into shared concepts usable by people and AI agents. Learn about the six items in the IQ workload—ontology items, data agents, Graph in Microsoft Fabric, Power BI semantic models, operations agents, and planning—and discover how ontology modeling starts with business concepts rather than specific use cases.
abstract: |
  By the end of this module, you'll be able to:
  - Explain what Fabric IQ is and how it fits within the Microsoft IQ enterprise intelligence layer
  - Describe the role of ontology items in creating entity types, entity instances, properties, relationships, and rules
  - Distinguish between the roles of each IQ workload item: ontology items, data agents, Graph in Microsoft Fabric, semantic models, operations agents, and planning
  - Compare ontology modeling's concept-driven approach with traditional use-case-driven data modeling
prerequisites: |
  Before starting this module, you should have:
  - The ability to navigate the Microsoft Fabric portal
  - A conceptual understanding of data concepts such as tables, columns, and relationships
  - General familiarity with business intelligence and analytics scenarios
