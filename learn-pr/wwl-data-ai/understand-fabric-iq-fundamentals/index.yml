title: Understand Microsoft Fabric IQ fundamentals
summary: Understand how Microsoft Fabric IQ connects business concepts to data so teams can investigate dependencies and use consistent definitions across analytics and agents.
abstract: |
  By the end of this module, you can:
  - Explain what Fabric IQ is and how it fits within the Microsoft IQ enterprise intelligence layer
  - Describe the role of ontology items in creating entity types, entity instances, properties, relationships, and rules
  - Distinguish between the roles of each IQ workload item: ontology items, data agents, Graph in Microsoft Fabric, Power BI semantic models, operations agents, and planning
  - Compare ontology modeling's concept-driven approach with traditional use-case-driven data modeling
prerequisites: |
  Before starting this module, you should have:
  - The ability to navigate the Microsoft Fabric portal
  - A conceptual understanding of data concepts such as tables, columns, and relationships
  - General familiarity with business intelligence and analytics scenarios
