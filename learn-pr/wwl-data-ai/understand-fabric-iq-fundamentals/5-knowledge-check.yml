quiz:
  questions:
  - content: "A team needs shared definitions of equipment, maintenance orders, and task dependencies across business data. Which part of Microsoft IQ supplies this context?"
    choices:
    - content: "Work IQ"
      isCorrect: false
      explanation: "Incorrect. Work IQ provides context on how employees work. Fabric IQ provides context on business entities and data, including the equipment and task dependencies in this question."
    - content: "Fabric IQ"
      isCorrect: true
      explanation: "Correct. Fabric IQ connects business entities and data through shared context. An ontology can define equipment, maintenance orders, and their relationships to tasks."
    - content: "Foundry IQ"
      isCorrect: false
      explanation: "Incorrect. Foundry IQ provides context on policies and authoritative documents. The team needs shared definitions over business entities and data, which is Fabric IQ's focus."
  - content: "What is the primary role of a Fabric data agent?"
    choices:
    - content: "To move data from lakehouses to warehouses"
      isCorrect: false
      explanation: "Incorrect. Data agents don't move data. They enable natural language queries across data sources."
    - content: "To visualize relationships between entities in a graph"
      isCorrect: false
      explanation: "Incorrect. This is the role of Graph in Microsoft Fabric, not the data agent."
    - content: "To answer natural language questions by generating read-only queries over configured data sources"
      isCorrect: true
      explanation: "Correct. Data agents identify relevant configured sources and generate read-only queries using their schema and context. An ontology supplies business vocabulary when it is a selected source; it isn't required for every data agent."
  - content: "How does data binding in ontology modeling differ from traditional ETL processes?"
    choices:
    - content: "Data binding copies data into a centralized warehouse, while ETL leaves data in place"
      isCorrect: false
      explanation: "Incorrect. Data binding maps business definitions to source data. ETL extracts, transforms, and loads data into a destination."
    - content: "Data binding maps ontology definitions to existing sources, while ETL extracts, transforms, and loads data into a destination"
      isCorrect: true
      explanation: "Correct. A binding creates a source mapping without copying source data into the ontology. Separately opting in to graph materialization loads selected eligible data into a queryable graph."
    - content: "Data binding and ETL are the same process with different names"
      isCorrect: false
      explanation: "Incorrect. A binding describes how ontology concepts map to sources. ETL performs data extraction, transformation, and loading."
  - content: "Which Fabric IQ component uses GQL (Graph Query Language) for querying?"
    choices:
    - content: "Ontology items"
      isCorrect: false
      explanation: "Incorrect. An ontology defines business context and source bindings. Its optional materialized graph provides Graph execution for relationship traversals."
    - content: "Data agents"
      isCorrect: false
      explanation: "Incorrect. Data agents generate SQL, DAX, or KQL queries depending on the data source."
    - content: "Graph in Microsoft Fabric"
      isCorrect: true
      explanation: "Correct. Graph in Microsoft Fabric uses GQL (Graph Query Language) to traverse relationships and analyze connected data. In an ontology, this execution path requires opting in to materializing eligible entities and relationships."
  - content: "What makes entity types different from traditional database tables?"
    choices:
    - content: "Entity types are tied to specific databases and schemas"
      isCorrect: false
      explanation: "Incorrect. This describes database tables. Entity types exist independently of any particular data source."
    - content: "Entity types are reusable logical models that exist independently of any storage system"
      isCorrect: true
      explanation: "Correct. Entity types are reusable logical models elevated above any single table, allowing the same concept to be bound to multiple data sources while maintaining consistent business meaning."
    - content: "Entity types can only contain static data, not time-series data"
      isCorrect: false
      explanation: "Incorrect. Entity types can use static data and time-series data bindings, including timestamped measurements from eventhouse tables."
