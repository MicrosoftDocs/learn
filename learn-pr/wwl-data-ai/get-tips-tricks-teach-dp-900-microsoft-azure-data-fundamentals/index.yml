title: Get tips and tricks for teaching DP-900 Microsoft Azure Data Fundamentals
summary: Learn tips and tricks about preparing for your first teaching session, which labs to use, when and how to introduce technical articles, as well as other resources and materials.
abstract: |
  After completing this learning path, you'll be able to:
  *   Understand how to utilize the tips and tricks for teaching DP-900 Microsoft Azure Data Fundamentals in the classroom.
  *   Use the lab environment during the instructional portion of the class.
  *   Explain foundational course terminology and technical topics.
  *   Discover more resources and materials to prepare students for success on their Microsoft certification exams.
prerequisites: |
  Module 2, 3, 4 and 5
