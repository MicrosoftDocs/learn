title: Use a Microsoft AI Code model for AI-assisted coding
summary: Learn how to select and use an MAI-Code model to plan, generate, explain, and improve code with AI-assisted coding tools.
abstract: |
  After completing this module, you'll be able to:
  - Describe the capabilities of Microsoft AI Code models.
  - Identify software development tasks that are well suited to an MAI-Code model.
  - Select an MAI-Code model in Microsoft Copilot Code and GitHub Copilot.
  - Apply effective prompting and validation practices when generating code.
prerequisites: |
  Before starting this module, you should have:
  - Familiarity with software development concepts.
  - Experience using a code editor or integrated development environment.
  - Access to an AI-assisted coding tool that offers an MAI-Code model.
