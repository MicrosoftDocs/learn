### YamlMime:ModuleUnit
uid: learn.wwl.microsoft-ai-code.knowledge-check
title: Knowledge check
metadata:
  title: Knowledge check
  description: Check your knowledge of Microsoft AI Code models and AI-assisted coding.
  ms.date: 09/30/2026
  author: graememalcolm
  ms.author: gmalc
  ms.topic: unit
durationInMinutes: 3
content: |
quiz:
  questions:
    - content: "Which task is an MAI-Code model designed to support?"
      choices:
        - content: "Planning and implementing a change across multiple source files"
          isCorrect: true
          explanation: "Correct. MAI-Code models can reason about a development task and generate or modify code across a project."
        - content: "Replacing human review for every generated change"
          isCorrect: false
          explanation: "Incorrect. Generated code must still be reviewed and validated by a developer."
        - content: "Guaranteeing that generated code has no security vulnerabilities"
          isCorrect: false
          explanation: "Incorrect. Generated code requires security review and testing."
    - content: "What should you include in a prompt to help an MAI-Code model produce a useful implementation?"
      choices:
        - content: "Only the name of the programming language"
          isCorrect: false
          explanation: "Incorrect. The programming language is useful, but the model also needs requirements, constraints, and a definition of success."
        - content: "Requirements, relevant context, constraints, and expected validation"
          isCorrect: true
          explanation: "Correct. Specific context and measurable expectations help the model generate an implementation that fits the project."
        - content: "A request to make any changes it considers appropriate"
          isCorrect: false
          explanation: "Incorrect. An open-ended request can lead to unnecessary or unsuitable changes."
    - content: "After an MAI-Code model generates an application, what should you do before accepting the result?"
      choices:
        - content: "Review the changes and run relevant tests and checks"
          isCorrect: true
          explanation: "Correct. Review and validation help identify functional, security, accessibility, and maintainability issues."
        - content: "Assume the application is correct because the model specializes in code"
          isCorrect: false
          explanation: "Incorrect. A specialized model can still produce incomplete or incorrect code."
        - content: "Deploy the application before examining the generated dependencies"
          isCorrect: false
          explanation: "Incorrect. Dependencies and all other generated changes should be reviewed before deployment."
