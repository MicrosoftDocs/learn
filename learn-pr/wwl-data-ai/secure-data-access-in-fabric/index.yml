title: Secure data access in Microsoft Fabric
summary: Implement workspace roles, item permissions, and OneLake security roles to control data access in Microsoft Fabric.
abstract: |
  In this module, you'll:
  - Describe the Fabric security model and its layers of access control.
  - Configure workspace roles and item permissions.
  - Apply granular permissions using T-SQL and OneLake security roles.
prerequisites: |
  - Experience working in Microsoft Fabric, including working with workspaces and lakehouses.
