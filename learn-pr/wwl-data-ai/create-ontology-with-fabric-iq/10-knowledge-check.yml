quiz:
  questions:
  - content: "What is the main advantage of generating an ontology from a Power BI semantic model compared to building manually?"
    choices:
    - content: "It creates relationship data bindings automatically"
      isCorrect: false
      explanation: "Incorrect. Generation creates relationship type definitions, but you still review and configure their data bindings."
    - content: "It creates entity types, properties, property bindings, relationship definitions, and metrics from existing semantic-model structure"
      isCorrect: true
      explanation: "Correct. Generation reuses semantic-model structure and source-owned measures. Review and follow-up binding work establish whether the ontology represents the intended business facts."
    - content: "It allows you to use business-friendly names from the start"
      isCorrect: false
      explanation: "Incorrect. Generated entity types can have technical names that need refinement. Manual creation also allows business-friendly names from the start."
  - content: "When is an entity type key required?"
    choices:
    - content: "Before defining any property"
      isCorrect: false
      explanation: "Incorrect. You can define properties before configuring a key."
    - content: "When projecting the entity into a materialized graph"
      isCorrect: true
      explanation: "Correct. Ontology supports keyless entities, but graph projection requires a key using string or integer properties."
    - content: "For every entity before any source binding"
      isCorrect: false
      explanation: "Incorrect. Keyless entities are supported in ontology, but graph projection requires an entity type key."
  - content: "Equipment records contain EquipmentId, PatientId, and EquipmentType. A readings table contains ReadingId, EquipmentId, Timestamp, and HeartRate. How should you add the readings as a related source for the equipment entity?"
    choices:
    - content: "Match EquipmentId across both sources and retain Timestamp with the measured values"
      isCorrect: true
      explanation: "Correct. EquipmentId links observations to the intended device. Timestamp distinguishes successive readings for that same device."
    - content: "Match ReadingId to EquipmentId because each reading must become a new device"
      isCorrect: false
      explanation: "Incorrect. ReadingId identifies an observation, not the equipment. Using it as the matching field can associate values with the wrong entity or produce no matches."
    - content: "Match PatientId in both tables and discard Timestamp"
      isCorrect: false
      explanation: "Incorrect. The readings table doesn't contain PatientId. Discarding Timestamp also removes the distinction between observations at different times."
  - content: "The hospitals source has HospitalId. Each row in the departments source has DepartmentId and the HospitalId of its parent hospital. How can you configure Hospital contains Department without adding a mapping table?"
    choices:
    - content: "Keep Use mapping table? off and match HospitalId in the origin source to HospitalId in the target source"
      isCorrect: true
      explanation: "Correct. The department source already records its parent hospital identifier. Direct property matching expresses that connection without a separate mapping table."
    - content: "Match HospitalId to DepartmentId because endpoint keys always represent the same business value"
      isCorrect: false
      explanation: "Incorrect. HospitalId and DepartmentId identify different concepts. Matching them doesn't represent which hospital contains a department."
    - content: "Define only the relationship name because the connector automatically supplies the data mapping"
      isCorrect: false
      explanation: "Incorrect. The name describes meaning, but you still configure the source properties that establish the connections."
