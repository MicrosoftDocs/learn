title: Develop an AI agent with Microsoft Agent Framework
summary: This module provides engineers with the skills to begin building Microsoft Foundry Agent Service agents with Microsoft Agent Framework.
abstract: |
  By the end of this module, you'll be able to:
  - Use Microsoft Agent Framework to connect to a Microsoft Foundry project
  - Create Microsoft Foundry Agent Service agents using the Microsoft Agent Framework SDK
  - Integrate plugin functions with your AI agent
prerequisites: |
  - Familiarity with Azure and the Azure portal.
  - An understanding of generative AI. You can learn more with [Fundamentals of Generative AI](/training/modules/fundamentals-generative-ai/).
