title: Implement AI-assisted development tools for Azure Cosmos DB
summary: Connect an AI assistant to Azure Cosmos DB with a Model Context Protocol server, add durable memory and multi-step retrieval with the agent toolkits, choose the right tool for a scenario, and separate what each tool covers from what you design yourself.
abstract: |
  After completing this module, you're able to:
  - Select the right AI-assisted tool, a Model Context Protocol server or an agent toolkit, for a scenario.
  - Follow recommended Azure Cosmos DB solutions by using AI-assisted tools.
  - Distinguish what the tools cover from the decisions you own.
prerequisites: |
  - Experience creating and configuring an Azure Cosmos DB for NoSQL client with the SDK
  - Familiarity with generative AI, agents, and retrieval-augmented generation concepts
  - Programming experience with Python
