title: Implement operational analytics with Microsoft Fabric
summary: Answer analytical questions about operational data without touching the workload that serves it. Mirror an Azure Cosmos DB for NoSQL database continuously into Microsoft Fabric OneLake, verify the copy is trustworthy, and query it with T-SQL and Spark.
abstract: |
  After completing this module, you're able to:
  - Choose between Azure Cosmos DB and Cosmos DB in Microsoft Fabric for a workload.
  - Configure mirroring from an Azure Cosmos DB for NoSQL account into Microsoft Fabric.
  - Monitor replication status and interpret how mirroring handles schema changes.
  - Query mirrored data with T-SQL and Spark, including nested JSON.
prerequisites: |
  - Working knowledge of Azure Cosmos DB for NoSQL containers, partitioning, and request units
  - Familiarity with the Azure portal and Microsoft Entra ID role assignments
  - Basic familiarity with Microsoft Fabric workspaces and Structured Query Language
