title: Configure applications on Azure Kubernetes Service
summary: Learn to externalize configuration, secure sensitive settings, and attach persistent storage using Kubernetes features on Azure Kubernetes Service.
abstract: |
  After completing this module, you'll be able to:
    - Explain how to externalize app configuration using Kubernetes primitives.
    - Implement ConfigMaps and inject settings into Pods.
    - Implement Secrets and consume sensitive values securely.
    - Attach persistent storage using PersistentVolume and PersistentVolumeClaim.
prerequisites: |
  Before beginning this module, you should have:
  - Programming experience with languages such as Python, JavaScript, or C#.
  - Basic understanding of Azure services and cloud computing concepts.
