title: Integrate web-based knowledge into your agent with Web IQ
summary: "Learn how Microsoft Web IQ retrieves current web information and how to connect it to an agent in Microsoft Foundry."
abstract: |
  By the end of this module, you'll be able to:
  - Explain why agents need web-based grounding context.
  - Describe the Web Search, News, Images, Videos, Browse, and Auto methods in Web IQ.
  - Describe how to create a Web IQ resource, obtain a Web IQ AppID, and test requests in the portal.
  - Connect Web IQ to a Foundry agent through an MCP tool and evaluate grounded responses.
prerequisites: |
  - A basic understanding of generative AI, AI agents, and retrieval-augmented generation (RAG).
  - Familiarity with Microsoft Foundry and Azure resources.
  - For the exercise, a paid Azure subscription with permissions to create Web IQ and Foundry resources and deploy a model. Azure credits aren't supported for Web IQ.
