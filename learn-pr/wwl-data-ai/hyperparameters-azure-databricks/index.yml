title: Tune hyperparameters in Azure Databricks
summary: Tuning hyperparameters is an essential part of machine learning. In Azure Databricks, you can use the Optune library to optimize hyperparameters automatically.
abstract: |
  In this module, you learn how to:
  - Use the Optuna library to optimize hyperparameters.
  - Distribute hyperparameter tuning across multiple worker nodes.
prerequisites: |
  Before starting this module, you should be familiar with how to train machine learning models in Azure Databricks.
