title: Get started with Azure SQL Database for modern application development
summary: You'll explore different features and tools to help you develop in Azure SQL Database.
abstract: |
  By the end of this module, you'll be able to:
  *   Explain the deployment options available.
  *   Explore Hyperscale capabilities.
  *   Understand how serverless works.
  *   Explain application resilience options for Azure SQL Database.
  *   Understand AI capabilities for Azure SQL Database.
prerequisites: |
  *   Ability to navigate the Azure portal.
  *   Experience with T-SQL programming language at a basic level.
  
