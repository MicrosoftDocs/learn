title: Analyze and tune query and operation performance in Azure Cosmos DB
summary: Diagnose an expensive Azure Cosmos DB for NoSQL query from the metrics it returns, distinguish a scan from a fan-out, and apply the remediation the evidence points to instead of raising throughput.
abstract: |
  After completing this module, you're able to:
  - Evaluate request unit consumption and identify recurring high-cost queries.
  - Analyze query performance metrics, including physical partition utilization and throttling.
  - Analyze index performance metrics and optimize cross-partition queries.
prerequisites: |
  - Experience writing queries against Azure Cosmos DB for NoSQL
  - Experience using the Azure Cosmos DB SDK to read and write items in C# or Python
  - Knowledge of indexing policies in Azure Cosmos DB, including included and excluded paths and composite indexes
  - Knowledge of partitioning in Azure Cosmos DB, including logical and physical partitions
