title: Design and evolve app data models using Fabric Apps
summary: Design the data model for a Fabric app by defining entities and relationships in TypeScript. Learn how schema changes reach the database and how to evolve a model safely.
abstract: |
  After completing this module, you're able to:
  - Define entities with decorators, field types, and modifiers that generate a SQL schema.
  - Model one-to-many relationships and use a join entity when a many-to-many relationship is required.
  - Register entities and apply schema changes with `rayfin up` and `rayfin up db apply`.
  - Assess a schema change for data-loss risk before you approve `--force`.
prerequisites: |
  - Working knowledge of TypeScript classes and decorators.
  - Familiarity with relational modeling concepts such as primary keys, foreign keys, and one-to-many relationships.
  - Permission to deploy to a Fabric workspace that has capacity, in a tenant where a Fabric administrator enabled Fabric Apps.
  - Node.js 24 installed locally.
