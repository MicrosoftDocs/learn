title: Query data in Azure Cosmos DB for NoSQL
summary: Author Azure Cosmos DB for NoSQL queries using parameters, projections, and built-in functions, reach into nested data with correlated subqueries and cross-product queries, and page large result sets with continuation tokens in C# and Python.
abstract: |
  After completing this module, you're able to:
  - Create and execute parameterized queries, project results, and use built-in functions.
  - Implement correlated subqueries and cross-product queries.
  - Page query results using continuation tokens.
prerequisites: |
  - A configured Azure Cosmos DB SDK connection, or completion of the module on connecting to Azure Cosmos DB with the SDK
  - Programming experience with C# or Python
  - Familiarity with Azure Cosmos DB accounts, databases, containers, items, and partition keys
