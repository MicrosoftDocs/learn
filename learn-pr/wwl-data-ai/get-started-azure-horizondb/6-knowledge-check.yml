### YamlMime:ModuleUnit
uid: learn.wwl.get-started-azure-horizondb.knowledge-check
title: Knowledge check
metadata:
  title: Knowledge check
  description: "Knowledge check for the Get started with Azure HorizonDB module."
  ms.date: 11/12/2026
  author: JulianePadrao
  ms.author: jupadrao
  ms.topic: unit
durationInMinutes: 3
quiz:
  questions:
  - content: "Azure HorizonDB is built on which database engine, giving it compatibility with existing applications, drivers, and tools?"
    choices:
    - content: "PostgreSQL"
      isCorrect: true
      explanation: "Correct. Azure HorizonDB is built on PostgreSQL and works with PostgreSQL applications, drivers, and tools. Assess supported engine versions, extensions, and service limits before migration."
    - content: "MySQL"
      isCorrect: false
      explanation: "Incorrect. Azure HorizonDB is built on PostgreSQL, not MySQL."
    - content: "Microsoft SQL Server"
      isCorrect: false
      explanation: "Incorrect. Azure HorizonDB is built on PostgreSQL, not SQL Server."
  - content: "In the Azure HorizonDB database-as-a-log architecture, what does the compute layer write to the storage layer?"
    choices:
    - content: "Only the write-ahead log (WAL); storage nodes reconstruct data pages by applying it."
      isCorrect: true
      explanation: "Correct. In the database-as-a-log design, only the WAL is written from compute to storage. The WAL is the authoritative source of truth, and storage nodes reconstruct page state by applying it, which removes checkpoint I/O bottlenecks."
    - content: "Full data pages on every checkpoint."
      isCorrect: false
      explanation: "Incorrect. Data pages aren't written from the compute replicas to the storage layer. Only the WAL is written, and storage reconstructs pages from it."
    - content: "Both the WAL and data pages at the same time for redundancy."
      isCorrect: false
      explanation: "Incorrect. Only the WAL is written from compute to storage; writing data pages as well would reintroduce the write amplification the architecture is designed to avoid."
  - content: "A team needs to scale out read throughput for an Azure HorizonDB workload. Which approach does the architecture support?"
    choices:
    - content: "Add reader nodes to the read-write pool and route reads through its read-only endpoint."
      isCorrect: true
      explanation: "Correct. Reader nodes share the cluster's storage, so adding them doesn't require a data copy. The pool's read-only endpoint load-balances connections across its readers. Additional read pools aren't currently available."
    - content: "Copy the database to a second cluster and keep the two in sync manually."
      isCorrect: false
      explanation: "Incorrect. Azure HorizonDB scales reads by adding reader nodes that share the cluster's storage. A manually synchronized second copy isn't required."
    - content: "Increase backup retention so reads can be served from backups."
      isCorrect: false
      explanation: "Incorrect. Backups aren't a read-scale mechanism. Reads scale out through reader nodes and the pool's read-only endpoint."
