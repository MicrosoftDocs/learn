title: Build a Fabric data agent with an ontology
summary: Create a Fabric data agent that uses a Microsoft Fabric IQ ontology as business context. Configure agent guidance and eligible underlying sources, validate source-native queries and answers, and publish and share the agent with the required data permissions.
abstract: |
  By the end of this module, you can:
  - Explain how an ontology provides context for source-native queries
  - Create a Fabric data agent and add ontology context
  - Configure instructions and eligible underlying sources
  - Validate answers by inspecting queries and ontology context
  - Publish and share an agent with the required data access
prerequisites: |
  Before you start this module, you should have:
  - Understanding of ontology concepts, including entity types, properties, relationships, and data bindings
  - Familiarity with Microsoft Fabric workspaces and navigation
  - Familiarity with tables, relationships, and basic data queries
