### YamlMime:ModuleUnit
uid: learn.wwl.build-fabric-data-agent-ontology.knowledge-check
title: Module assessment
metadata:
  title: Module assessment
  module_assessment: true
  ai_generated_module_assessment: false
  description: Check understanding of ontology context, source configuration, query validation, and publishing a Fabric data agent.
  ms.date: 10/20/2026
  author: weslbo
  ms.author: wedebols
  ms.topic: unit
  ai-usage: ai-generated
azureSandbox: false
labModal: false
durationInMinutes: 5
quiz:
  title: "Check your knowledge"
  questions:
  - content: "A Fabric data agent uses ontology context to answer a question from a bound lakehouse. Where does the query execute?"
    choices:
    - content: "Against the lakehouse SQL endpoint, using a source-native SQL query."
      isCorrect: true
      explanation: "The ontology supplies semantic context. The underlying lakehouse executes the SQL query under the requesting user's permissions."
    - content: "Against the ontology item, using a graph-native GQL query."
      isCorrect: false
      explanation: "An ontology is a context source in this integration, not the query execution endpoint. Direct graph sources are a separate source category."
    - content: "Against the agent's instruction text, using a source-independent query."
      isCorrect: false
      explanation: "Instructions guide the agent's behavior but don't contain the source data or execute queries."
  - content: "An agent generates an incorrect aggregation for an eligible SQL source associated with an ontology. The shared business definitions are correct. Which configuration provides a verified query pattern?"
    choices:
    - content: "Change the published agent description to contain the expected count."
      isCorrect: false
      explanation: "The published description explains the agent's purpose. It doesn't provide a verified source query for query generation."
    - content: "Edit the downloaded ontology context to contain the expected count."
      isCorrect: false
      explanation: "Downloaded ontology context is read-only. Editing the downloaded file doesn't change the agent's configuration."
    - content: "Mount the underlying SQL source and add a validated question-query pair."
      isCorrect: true
      explanation: "Eligible mounted sources support example queries that pair natural-language questions with verified source-native queries, including aggregation patterns."
  - content: "An agent still uses an old department synonym immediately after an ontology update. Which action makes the changed context available without waiting for the periodic retrieval?"
    choices:
    - content: "Refresh the ontology context in the data agent and retest the question."
      isCorrect: true
      explanation: "The agent retrieves ontology context every 10 minutes. A manual refresh makes recent context changes available for retesting."
    - content: "Add the new synonym to the downloaded context file and retest the question."
      isCorrect: false
      explanation: "The downloaded file is an inspection copy. Editing it doesn't update the context used by the agent."
    - content: "Change the recipient's sharing permission to View details and retest the question."
      isCorrect: false
      explanation: "View details controls access to agent configuration and versions. It doesn't refresh ontology context."
  - content: "A colleague can open a published agent with default sharing permissions but lacks access to its ontology and bound lakehouse. Which action enables authorized queries?"
    choices:
    - content: "Grant Edit and view details on the data agent instead of source access."
      isCorrect: false
      explanation: "Agent editing permissions don't grant access to the ontology or its underlying data."
    - content: "Grant the required Read access to the ontology and underlying lakehouse data."
      isCorrect: true
      explanation: "Sharing an agent doesn't grant source permissions. The colleague needs access to the relevant ontology and source data for query execution."
    - content: "Republish the data agent to include the author's permissions in the shared link."
      isCorrect: false
      explanation: "The source executes queries using the requesting user's permissions, not permissions copied from the author during publication."
  - content: "An author needs to test revised instructions without changing the agent configuration colleagues currently use. Which workflow meets this requirement?"
    choices:
    - content: "Edit the downloaded ontology context and distribute the file to colleagues."
      isCorrect: false
      explanation: "Downloaded ontology context is read-only and isn't a way to change or test agent instructions."
    - content: "Update and test the draft, then publish the changes after validation."
      isCorrect: true
      explanation: "Draft configuration changes remain separate from the published version until the author publishes updates."
    - content: "Publish each instruction change first, then compare the answers afterward."
      isCorrect: false
      explanation: "Publishing a configuration change makes it part of the version colleagues use. The draft provides a separate place to validate it first."
