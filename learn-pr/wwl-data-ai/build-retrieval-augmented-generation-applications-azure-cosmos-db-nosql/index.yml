title: Build RAG applications with Azure Cosmos DB for NoSQL
summary: Turn retrieval into answers. Prepare content so each result answers something on its own, assemble prompts that cite their sources and refuse when the evidence runs out, and wire the stages into a pipeline that survives a follow-up question.
abstract: |
  After completing this module, you're able to:
  - Explain the RAG loop and the role Azure Cosmos DB for NoSQL plays in it.
  - Prepare and embed content so retrieval returns evidence an answer can be built from.
  - Retrieve context, ground a generated response, and keep retrieved text on the data side of the trust boundary.
  - Orchestrate a RAG pipeline, including follow-up question resolution and multi-step retrieval.
prerequisites: |
  - Experience running vector, full-text, and hybrid queries in Azure Cosmos DB for NoSQL
  - Familiarity with vector embeddings and calling an embedding API such as Azure OpenAI
  - Working knowledge of Azure Cosmos DB for NoSQL queries, partitioning, and request units
  - Programming experience with Python or C#
