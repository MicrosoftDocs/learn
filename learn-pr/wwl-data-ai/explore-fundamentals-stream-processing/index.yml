title: Explore fundamentals of real-time analytics
summary: Learn about the basics of stream processing, and the services in Microsoft Azure that you can use to implement real-time analytics solutions.
abstract: |
  In this module, you learn how to:

  -   Compare batch and stream processing.

  -   Describe common elements of streaming data solutions.

  -   Describe features and capabilities of real-time intelligence in Microsoft Fabric.

  -   Describe features and capabilities of Apache Spark Structured Streaming on Azure.

  -   Explore real-time analytics in Microsoft Fabric.
prerequisites: Before starting this module, you should have some conceptual understanding of modern data warehousing and analytics. You should be familiar with Azure services for data workloads, including Azure Storage, Azure SQL Database, and Microsoft Fabric.
