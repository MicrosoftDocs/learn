title: Integrate data with Azure Data Factory
summary: In this module, you examine Azure Data Factory and the core components that enable you to create large-scale data ingestion solutions in the cloud
abstract: |
  In this module, you:
  * Understand Azure Data Factory
  * Describe data integration patterns
  * Explain the data factory process
  * Understand Azure Data Factory components
  * Azure Data Factory security
  * Set up Azure Data Factory
  * Create linked services
  * Create datasets
  * Create data factory activities and pipelines
  * Manage integration runtimes
prerequisites: |
  The student should be able to:
  - Log in to the Azure portal
  - Explain and create resource groups
