quiz:
  questions:
  - content: "Which version control software does Azure Data Factory integrate with?"
    choices:
    - content: "Team Foundation Server."
      isCorrect: false
      explanation: "Incorrect. Azure Data Factory doesn't integrate with Team Foundation Server."
    - content: "Source Safe."
      isCorrect: false
      explanation: "Incorrect. Azure Data Factory doesn't integrate with Source Safe."
    - content: "Git repositories."
      isCorrect: true
      explanation: "Correct. Azure Data Factory lets you configure a Git repository with either Azure Repos or GitHub. Git is a version control system that allows for easier change tracking and collaboration."
  - content: "Which feature do you use to get changes from a feature branch reviewed and merged into the collaboration branch of a Git repository?"
    choices:
    - content: "Repo."
      isCorrect: false
      explanation: "Incorrect. Repo is the shorthand term for a repository, which is a location in which your source code for Azure Data Factory solutions is stored."
    - content: "Pull request."
      isCorrect: true
      explanation: "Correct. After a developer is satisfied with their changes, they create a pull request from their feature branch to the main or collaboration branch to get their changes reviewed by peers."
    - content: "Commit."
      isCorrect: false
      explanation: "Incorrect. A commit saves your work to the repository you're working on. It doesn't request a review or merge changes into the collaboration branch."
  - content: "Which feature in alerts can be used to determine how an alert is fired?"
    choices:
    - content: "Add rule."
      isCorrect: false
      explanation: "Incorrect. A rule is the main definition of the alert. You specify the rule name and severity, but the criteria determine when the alert fires."
    - content: "Add severity."
      isCorrect: false
      explanation: "Incorrect. Severity assigns the severity level of the alert being defined. It doesn't determine when the alert fires."
    - content: "Add criteria."
      isCorrect: true
      explanation: "Correct. The alert criteria determine the metric condition that fires the alert."
