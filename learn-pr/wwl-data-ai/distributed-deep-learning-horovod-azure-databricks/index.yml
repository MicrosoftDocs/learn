title: Distributed deep learning with Horovod and Azure Databricks
summary: In Azure Databricks, you perform distributed deep learning by using the open-source framework Horovod on top of TensorFlow, Keras, and PyTorch.
abstract: |
  After completing this module, you’ll be able to:
  - Understand what Horovod is and how it can help distribute your deep learning models.
  - Use HorovodRunner in Azure Databricks for distributed deep learning.
prerequisites: |
  Before starting this module, you should be familiar with using Python to train deep learning models in Azure Databricks.
