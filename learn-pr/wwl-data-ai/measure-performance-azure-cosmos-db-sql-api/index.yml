title: Measure performance in Azure Cosmos DB for NoSQL
summary: We learn to use Azure Monitor to create and analyze monitoring data for Azure Cosmos DB.
abstract: |
  After completing this module, you'll be able to:

  -   Understand how Azure Cosmos DB uses Azure Monitor to monitor server-side metrics.

  -   Measure Cosmos DB's throughput

  -   Observe rate-limiting events.

  -   Query telemetry logs

  -   Measure cross-partition storage distribution throughput
prerequisites: Before starting this module, you should have experience of building cloud applications with Microsoft C# or a similar programming language.
