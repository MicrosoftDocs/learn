title: Transform data by implementing pivot, unpivot, rollup, and cube
summary: Learn how to transform data using Transact-SQL.
abstract: |
  After completing this module, you'll be able to:

  - Write queries that pivot and unpivot result sets.

  - Write queries that specify multiple groups with GROUPING SETS, CUBE, and ROLLUP.
prerequisites: Before starting this module, you should have experience of using Transact-SQL queries to retrieve and filter data from a table in a database.
