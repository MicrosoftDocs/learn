abstract: |
  After completing this module, you'll be able to:
  - Describe key features of Microsoft Foundry.
  - Describe Anthropic Claude models and their capabilities.
  - Deploy and test Claude models in Foundry.
  - Develop client applications that use Claude models in Foundry.
