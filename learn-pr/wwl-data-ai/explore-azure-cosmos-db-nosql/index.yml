title: Explore Azure Cosmos DB for NoSQL
summary: Evaluate whether Azure Cosmos DB for NoSQL is right for your application, including AI workloads, and create your first account, database, container, and items.
abstract: |
  After completing this module, you're able to:
  - Describe what Azure Cosmos DB for NoSQL is and how it works.
  - Evaluate whether Azure Cosmos DB for NoSQL is appropriate for an application, including AI workloads.
  - Create an account, database, and container, and perform basic resource operations.
prerequisites: |
  - Experience building cloud applications with C# or Python
  - Basic familiarity with JSON and the Azure portal
