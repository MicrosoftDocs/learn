title: Build and extend AI agents with Microsoft Foundry
summary: "Build and extend an AI agent with trusted knowledge and tools. Use Microsoft Foundry Agent Service to ground responses, retrieve live information, analyze data, call custom functions, and connect to remote Model Context Protocol (MCP) servers."
abstract: |
  By the end, you can:
  - Describe AI agents and the key capabilities of Microsoft Foundry Agent Service.
  - Choose a development approach using the Foundry portal, Visual Studio Code, or code.
  - Extend an agent with custom function tools, Azure Functions, and OpenAPI-defined tools.
  - Connect an agent to a remote Model Context Protocol (MCP) server and handle tool-approval requests.
prerequisites: |
  - Familiarity with Azure and the Azure portal.
  - An understanding of generative AI. You can learn more with [Fundamentals of Generative AI](/training/modules/fundamentals-generative-ai/).
  - Basic familiarity with Python and Visual Studio Code.
