quiz:
  title: "Check your knowledge"
  questions:
  - content: "Which tool would you use to assess and migrate your databases from an on-premises SQL Server to an Azure Virtual Machine?"
    choices:
    - content: "Microsoft Assessment and Planning Toolkit"
      isCorrect: false
      explanation: "Incorrect. The MAP Toolkit is useful for broader infrastructure inventory and Windows operating system upgrade planning, but it doesn't assess or migrate SQL Server databases to Azure."
    - content: "SQL migration component in SQL Server Management Studio (SSMS)"
      isCorrect: true
      explanation: "Correct. The SQL migration component in SSMS provides Azure migration readiness assessment and surfaces migration options, including Azure Database Migration Service, the Managed Instance link, and native backup and restore."
    - content: "Data Migration Assistant"
      isCorrect: false
      explanation: "Incorrect. Data Migration Assistant (DMA) was retired on July 16, 2025. Use the SQL migration component in SSMS for lightweight assessment and migration."
  - content: "What does Microsoft guarantee if you upgrade versions of SQL Server but maintain the same compatibility level, on similar hardware?"
    choices:
    - content: "Syntax compatibility"
      isCorrect: false
      explanation: "Incorrect. Microsoft doesn't guarantee syntax compatibility if you upgrade versions of SQL Server but maintain the same compatibility level."
    - content: "Execution Plan Shape"
      isCorrect: true
      explanation: "Correct. Microsoft guarantees Execution Plan Shape if you upgrade versions of SQL Server but maintain the same compatibility level."
    - content: "Elapsed time of queries"
      isCorrect: false
      explanation: "Incorrect. Elapsed time of queries isn't guaranteed when you upgrade versions of SQL Server but maintain the same compatibility level."
  - content: "What is a valid reason for migrating your database to Azure SQL Database?"
    choices:
    - content: "Your applications need to run older versions of SQL Server, such as SQL Server 2016"
      isCorrect: false
      explanation: "Incorrect. Running older versions of SQL Server isn't a valid reason for migrating your database to Azure SQL Database."
    - content: "You want to eliminate the complexity of configuring and managing high availability, backups, and other database tasks"
      isCorrect: true
      explanation: "Correct. Eliminating the complexity of database tasks is a valid reason for migrating your database to Azure SQL Database."
    - content: "You want to improve query performance of your application"
      isCorrect: false
      explanation: "Incorrect. Query performance isn't guaranteed when migrating to Azure SQL Database."
