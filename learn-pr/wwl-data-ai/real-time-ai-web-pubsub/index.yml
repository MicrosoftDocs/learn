title: Deliver real-time AI experiences with Azure Web PubSub
summary: |
  Build real-time client experiences for AI applications with Azure Web PubSub. Choose a delivery approach, authorize client access, and publish updates to groups of connected clients while keeping durable backend processing separate from client delivery. Implement recovery and batching strategies for disconnected or slow clients.
abstract: |
  After completing this module, you'll be able to:
    - Choose a client delivery approach based on communication direction, fan-out, and connection-scale requirements.
    - Explain how Azure Web PubSub complements durable backend messaging and workflow coordination.
    - Implement authenticated client negotiation with operation-scoped group access.
    - Build group-based delivery for AI updates from backend workers.
    - Implement recovery and bounded update delivery for slow or disconnected clients.
prerequisites: |
  Before beginning this module, you should have:
  - Programming experience with Python.
  - Familiarity with asynchronous programming and browser-based application concepts.
  - Familiarity with HTTP APIs, authenticated requests, and background workers.
  - Basic understanding of Azure services, queues, event-driven architectures, and durable application state.
