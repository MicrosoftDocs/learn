title: Review responsible AI principles for language models in Azure Databricks
summary: When working with Large Language Models (LLMs) in Azure Databricks, it's important to understand the responsible AI principles for implementation, ethical considerations, and how to mitigate risks. Based on identified risks, learn how to implement key security tooling for language models.
abstract: |
  In this module, you learn how to:
  - Describe the responsible AI principles for implementation of language models.
  - Identify the ethical considerations for language models.
  - Mitigate the risks associated with language models.
  - Implement key security tooling for language models.
prerequisites: |
  Before starting this module, you should be familiar with Azure Databricks. Consider completing [Explore Azure Databricks](/training/modules/explore-azure-databricks?azure-portal=true) before starting this module.
