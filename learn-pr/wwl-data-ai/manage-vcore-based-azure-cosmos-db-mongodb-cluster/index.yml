title: Manage a vCore-based Azure Cosmos DB for MongoDB cluster
summary: Learn to manage a vCore-based Azure Cosmos DB for MongoDB cluster, focusing on scaling, high availability, backup and restoration processes, and diagnostic monitoring.
abstract: |
  -   Explore strategies for scaling a vCore-based Azure Cosmos DB for MongoDB clusters, adjusting cluster tiers and storage sizes.
  -   Set up and manage high availability to ensure minimal downtime in clusters.
  -   Learn the backup and restore process, with point-in-time recovery features.
  -   Monitor and diagnose clusters using Azure Monitor, including managing diagnostic settings and queries.
prerequisites: Before starting this module, you should be familiar with the Azure portal.
