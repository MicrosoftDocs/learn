title: Migrate SQL Server workloads to Azure SQL Database
summary: You will explore different migration tools and migrate SQL Server databases to Azure SQL Database.
abstract: |
  In this module, you'll:

  -   Explore the advantages, capabilities, and migration possibilities offered by Azure SQL Database.

  -   Migrate databases using Azure Database Migration Service with Azure CLI and tracking database migration activities.

  -   Use transactional replication as an online method to migrate to Azure SQL Database.

  -   Explore several other methods for migrating SQL Server databases to Azure SQL Database.
prerequisites: |
  -   Experience in administering SQL Server databases.

  -   Knowledge of SQL Server editions and versions.

  -   Knowledge of basic T-SQL.
