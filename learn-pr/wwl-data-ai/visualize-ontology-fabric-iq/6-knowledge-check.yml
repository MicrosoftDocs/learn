### YamlMime:ModuleUnit
uid: learn.wwl.visualize-ontology-fabric-iq.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  module_assessment: true
  ai_generated_module_assessment: false
  description: Check your knowledge of visualizing and querying ontology data with Microsoft Fabric IQ.
  ms.date: 11/05/2026
  author: angierudduck
  ms.author: anrudduc
  ms.topic: unit
  ai-usage: ai-generated
azureSandbox: false
labModal: false
durationInMinutes: 5
quiz:
  questions:
  - content: "In the relationship graph, what does a labeled arrow between two nodes represent?"
    choices:
    - content: "A relationship connecting two entity instances, such as a patient admitted to a room."
      isCorrect: true
      explanation: "Correct. Edges are the named, directed connections between nodes. For example, the admittedTo edge connects a Patient instance to a Room instance."
    - content: "A property of one of the connected entity types."
      isCorrect: false
      explanation: "Incorrect. Properties are attributes stored on a single node, such as RoomNumber or RoomType. Edges are the arrows that connect two separate nodes."
    - content: "An entity type that groups related instances together."
      isCorrect: false
      explanation: "Incorrect. Entity types group instances of the same kind, such as all rooms or all patients. Edges are the directed connections between individual instances."
  - content: "What does the Instances tab in entity type details show?"
    choices:
    - content: "The actual records from the bound source data for that entity type."
      isCorrect: true
      explanation: "Correct. The Instances tab shows the entity instances associated with the entity type and their static property values from bound data."
    - content: "A summary of all relationships configured for that entity type."
      isCorrect: false
      explanation: "Incorrect. Relationship types are part of the definition shown on Configure. Instances shows the associated data records."
    - content: "The schema showing how the entity type connects to others in the ontology."
      isCorrect: false
      explanation: "Incorrect. The ontology configuration canvas shows the defined entity types and relationships. Instances shows the associated records."
  - content: "The graph contains Patient → Room through admittedTo and Room → Department through inDepartment. Which path query finds patients in the Intensive Care Unit?"
    choices:
    - content: "Start at Patient, end at Department, and limit traversal to one hop."
      isCorrect: false
      explanation: "Incorrect. This path requires two relationships. A one-hop limit can't reach Department from Patient through Room."
    - content: "Start at Patient and filter RoomType to Critical Care without checking Department."
      isCorrect: false
      explanation: "Incorrect. RoomType describes a room classification, not the department's name. It doesn't establish that a room belongs to the Intensive Care Unit."
    - content: "Start at Patient, end at Department, follow the defined direction for two hops, and filter DepartmentName to Intensive Care Unit."
      isCorrect: true
      explanation: "Correct. The query preserves the Patient-to-Room-to-Department path and applies the condition to the property that identifies the requested department."
  - content: "A patient moves to another room in the source data, but rerunning a graph query still shows the previous assignment. What makes the updated assignment available in graph results?"
    choices:
    - content: "Refresh the materialized graph to load updated source data, then rerun the query."
      isCorrect: true
      explanation: "Correct. Graph results depend on the ingested data. Refreshing the graph loads changed source records for subsequent queries."
    - content: "Save the queryset under a different name."
      isCorrect: false
      explanation: "Incorrect. Saving a queryset retains query definitions. It doesn't refresh the data in the graph."
    - content: "Increase the query's maximum hop count."
      isCorrect: false
      explanation: "Incorrect. Hop counts control path length. They don't load updated source records into the graph."
