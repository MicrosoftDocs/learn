title: Visualize ontology data with Microsoft Fabric IQ
summary: Explore connected business data in Microsoft Fabric IQ using entity instances and visual graph queries to answer relationship-based questions without writing SQL joins.
abstract: |
  By the end of this module, you'll be able to:
  - Explore entity instances to see real records from your data sources in the ontology
  - Visualize entity connections through an optional materialized graph
  - Filter and explore connected records using visual graph queries
prerequisites: |
  Before starting this module, you should have:
  - Completed the [Create an ontology with Microsoft Fabric IQ](/training/modules/create-ontology-with-fabric-iq/) module or have equivalent knowledge of creating and binding ontologies in Fabric IQ
  - Familiarity with Microsoft Fabric workspaces and navigation
