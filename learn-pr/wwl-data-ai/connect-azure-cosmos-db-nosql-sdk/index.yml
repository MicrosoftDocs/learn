title: Connect to Azure Cosmos DB with the SDK
summary: "Initialize and configure the Azure Cosmos DB SDK for .NET and Python. Connect with a client singleton and tune connectivity mode. Enable offline development, and handle connection errors to build reliable data access."
abstract: |
  After completing this module, you're able to:
  - Integrate the SDK and connect to an Azure Cosmos DB account using a singleton client.
  - Configure connectivity mode and enable offline development with the emulator.
  - Diagnose connection errors and configure logging and parallelism.
prerequisites: |
  - An Azure Cosmos DB for NoSQL account, or completion of the module on exploring Azure Cosmos DB for NoSQL
  - Experience building cloud applications with C# or Python
