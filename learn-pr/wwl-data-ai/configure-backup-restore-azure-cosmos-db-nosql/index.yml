  - Experience creating Azure Cosmos DB for NoSQL accounts, databases, and containers
  - Experience using the Azure Cosmos DB SDK to read items and run queries in C# or Python
  - Basic knowledge of Azure resource management with the Azure CLI or Azure PowerShell
