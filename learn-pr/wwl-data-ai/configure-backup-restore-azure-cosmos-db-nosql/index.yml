summary: Choose between periodic and continuous backup for an Azure Cosmos DB account, enable continuous backup, recover data to a point in time, and describe vaulted backup for long-term retention.
abstract: |
  After completing this module, you're able to:
  - Evaluate periodic and continuous backup options and choose a retention tier.
  - Configure continuous backup and perform point-in-time recovery.
  - Describe Azure Backup for Azure Cosmos DB capabilities.
