title: "Work smarter with AI"
summary: Curious about how AI can help at work? In this module, you'll learn the basics of generative AI, explore how AI supports workplace tasks, understand why grounding improves AI-generated responses, discover when AI agents can help, and learn how to responsibly use AI with confidence.
abstract: |
  After completing this module, you will be able to:
  - Explain what AI and generative AI are, and how they differ from traditional tools.
  - Describe how AI and AI agents support everyday work, and why grounding improves results.
  - Review AI-generated content and apply responsible AI practices with confidence.
prerequisites: |
  - Familiarity with productivity applications like Word, Excel, PowerPoint, and Outlook.
