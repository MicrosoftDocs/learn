summary: Learn how to configure the Azure Cosmos DB for NoSQL SDK in various ways including how to integrate with the emulator, implement parallelism, and create a custom logger.
abstract: |
  After completing this module, you'll be able to:
  - Configure the SDK for offline development
  - Troubleshoot common connection errors
  - Implement parallelism in the SDK
  - Configure logging using the SDK
prerequisites: |
  Before starting this module, you should have experience in building cloud applications with Microsoft C#, Python, JavaScript, or a similar programming language.
