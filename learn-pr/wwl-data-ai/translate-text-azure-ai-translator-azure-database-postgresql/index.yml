title: Translate Text with Azure Translator and Azure Database for PostgreSQL
summary: This module guides you through translating textual data in Azure Database for PostgreSQL - Flexible Server using the Azure Translator service. You'll load data into PostgreSQL and translate it into multiple languages.
abstract: |
  - Learn how to translate documents using the Azure Translator.

  - Learn how the Azure AI extension enables seamless interaction between Azure Database for PostgreSQL - Flexible Server and Azure Translator.

  - Understand one way to translate documents automatically as part of record insertion.
prerequisites: '- Before starting this module, you should have experience working with the PL/pgSQL language.'
