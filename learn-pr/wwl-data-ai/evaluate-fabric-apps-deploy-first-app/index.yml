title: Evaluate Fabric Apps by deploying a first app to Microsoft Fabric
summary: Decide whether Fabric Apps fits your application by understanding how a Fabric app runs, what it costs, and where it has limits. Then scaffold, run, and deploy a first app to Microsoft Fabric with the Rayfin CLI.
abstract: |
  After completing this module, you will be able to:
  - Describe how a Fabric app runs on Microsoft Fabric, including its child services and the roles of the Rayfin CLI and SDK.
  - Evaluate whether an application scenario fits Fabric Apps by comparing capabilities, constraints, licensing options, and capacity cost.
  - Scaffold a Fabric Apps project and run it with `rayfin dev` against a Fabric-hosted backend.
  - Deploy a Fabric app with `rayfin up` and verify the deployment.
prerequisites: |
  - Access to a Microsoft Fabric tenant where a Fabric administrator enabled Fabric Apps. Without a tenant, you can start a Fabric trial, and an administrator must enable the Fabric Apps tenant setting.
  - Access to a Fabric workspace where you have the Contributor, Member, or Admin role, assigned to a Fabric trial or paid capacity in a region where Fabric Apps is available.
  - Working knowledge of TypeScript and npm.
  - Familiarity with a frontend framework such as React.
  - Familiarity with Microsoft Fabric workspaces and capacity concepts.
  - Node.js 24 installed locally. The Rayfin CLI supports Node.js 20, 22, and 24, and the default project template needs 22.13 or later.
