title: Introduction to generative AI and agents
summary: "Generative AI powers applications that can create content, answer questions, and assist with tasks. In this module, you'll explore the fundamentals of generative AI, including large language models (LLMs), prompts, and AI agents."
abstract: |
  By the end of this module, you'll be able to:
  - Describe core concepts of generative AI.
  - Explain how large language models (LLMs) work.
  - Consider how to create effective prompts for LLMs.
  - Describe core concepts of agents and agentic AI solutions.
prerequisites: |
  Before starting this module, you should have:
  - Familiarity with AI concepts and terminology
  - Basic understanding of machine learning principles.
