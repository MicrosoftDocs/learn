title: Build data-driven app features using the Fabric Apps SDK
summary: Build app features that list, filter, summarize, edit, and attach files to data by using the typed Fabric Apps client. Learn the client behaviors that cause silent bugs, such as page truncation and field selection.
abstract: |
  After completing this module, you will be able to:
  - Compose a typed client and query data with select, where, orderBy, and relationship paths.
  - Page through large result sets with cursors and summarize data with aggregation and grouping.
  - Create, update, delete, and upsert records, and handle failures.
  - Configure a Storage folder and upload, list, download, and delete files within folder permissions.
prerequisites: |
  - Working knowledge of TypeScript with async and await.
  - Familiarity with React state and data fetching.
  - Basic understanding of GraphQL concepts. You don't write raw GraphQL.
  - A Fabric workspace with capacity. Storage isn't available in Power BI Pro workspaces.
  - A Fabric Apps project with the data service enabled that runs locally and deploys.
