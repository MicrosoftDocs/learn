title: Explore IaaS and PaaS solutions for high availability and disaster recovery
summary: Deploy Windows Server Failover Cluster and availability groups in Azure and hybrid environments. Configure temporal tables, geo-replication, and auto-failover groups.
abstract: |
  After completing this module, you will be able to:
  - Explore options for deploying a WSFC in Azure
  - Explore options for deploying an AG in Azure
  - Plan active geo-replication and auto-failover groups
  - Monitor high availability
prerequisites: |
  - Experience creating and configuring resources using the Azure portal.
  - Basic understanding of SQL Server file storage.
