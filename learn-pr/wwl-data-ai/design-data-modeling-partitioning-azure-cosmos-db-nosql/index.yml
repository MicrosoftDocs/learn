title: Design a data modeling and partitioning strategy
summary: Design data models for Azure Cosmos DB for NoSQL based on your access patterns. Select partition keys that scale and distribute the workload evenly. Choose an appropriate hierarchical, synthetic, or multitenant partitioning strategy. Avoid costly design anti-patterns.
abstract: |
  After completing this module, you're able to:
  - Design data models based on access patterns, choosing when to embed or reference.
  - Select partition keys based on cardinality, access patterns, and write distribution.
  - Implement hierarchical, synthetic, and multitenant partitioning strategies and identify anti-patterns.
prerequisites: |
  - Familiarity with Azure Cosmos DB containers, items, request units, and the change feed
  - Experience querying an Azure Cosmos DB for NoSQL container
  - Programming experience with C# or Python
