uid: learn.wwl.trigger-azure-machine-learn-jobs-github-actions.knowledge-check
title: Module assessment
metadata:
  title: Module assessment
  description: Test your understanding of source control for machine learning, trunk-based development, GitHub Actions quality gates, Azure authentication, and triggering Azure Machine Learning jobs.
  author: madiepev
  ms.author: madiepev
  ms.date: 08/27/2026
