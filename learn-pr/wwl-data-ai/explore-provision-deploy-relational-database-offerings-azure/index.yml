title: Explore relational database services in Azure
summary: Microsoft Azure provides multiple services for relational databases. You can choose the relational database management system that's best for your needs, and host relational data in the cloud.
abstract: |
  In this module, you learn how to:

  -   Identify options for Azure SQL services.

  -   Identify options for open-source databases in Azure.

  -   Provision a database service on Azure.
prerequisites: Before starting this module, you should have a fundamental understanding of relational data concepts and some familiarity with Microsoft Azure and the Azure portal.
