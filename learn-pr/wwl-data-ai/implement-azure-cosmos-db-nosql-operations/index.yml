title: Implement Azure Cosmos DB operations with the SDK
summary: Read and write data with the Azure Cosmos DB for NoSQL SDK. Use point reads and the create, replace, upsert, and delete operations. Apply partial document patch, item time to live, optimistic concurrency, transactional batch, and bulk operations. Build correct, efficient data layers in C# and Python.
abstract: |
  After completing this module, you're able to:
  - Perform point read operations and create, replace, update, patch, and delete items.
  - Configure item time to live and implement optimistic concurrency control.
  - Implement transactional batch and bulk operations.
prerequisites: |
  - A configured Azure Cosmos DB SDK connection, or completion of the module on connecting to Azure Cosmos DB with the SDK
  - Programming experience with C# or Python
  - Familiarity with Azure Cosmos DB accounts, databases, containers, items, and partition keys
