abstract: |
  After completing this module, you'll be able to:

  - Understand how to utilize the tips and tricks for teaching AI-102: Designing and Implementing a Microsoft Azure AI Solution in academic programs.

  - Use the lab environment during the instructional portion of the class.

  - Explain course terminology and technical topics.

  - Discover other resources and materials to prepare students for success on their Microsoft certification exams.
