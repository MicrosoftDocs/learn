title: Design and optimize an indexing strategy in Azure Cosmos DB
summary: Fit an Azure Cosmos DB for NoSQL indexing policy to its workload, add the composite, spatial, and computed-property indexes that specific query shapes need, and use global secondary indexes to turn cross-partition queries into single-partition ones.
abstract: |
  After completing this module, you're able to:
  - Configure indexing policies for read-heavy and write-heavy workloads.
  - Configure composite and spatial indexes and computed properties.
  - Implement global secondary indexes to convert cross-partition queries into single-partition queries.
prerequisites: |
  - Experience writing queries against Azure Cosmos DB for NoSQL
  - Experience using the Azure Cosmos DB SDK to read and write items in C# or Python
  - Knowledge of partitioning in Azure Cosmos DB, including logical and physical partitions
  - Basic knowledge of Azure resource management with the Azure CLI
