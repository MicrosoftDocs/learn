title: Run AI-generated code securely in Azure Container Apps dynamic sessions
summary: Use Azure Container Apps dynamic sessions to execute AI-generated and user-submitted code in isolated environments. Configure secure session pools, integrate application code, exchange files, and manage session lifecycle and failures.
abstract: |
  After completing this module, you'll be able to:
    - Explain how Azure Container Apps dynamic sessions isolate AI-generated and user-submitted code.
    - Choose between a built-in code interpreter and a custom container session pool.
    - Configure session capacity, lifecycle, and outbound network access for an AI workload.
    - Use session identifiers to execute code and exchange files from application code.
    - Handle session expiration, execution limits, timeouts, and failed executions.
prerequisites: |
  Before beginning this module, you should have:
  - Programming experience with Python.
  - Familiarity with HTTP requests and JSON responses.
  - Basic understanding of Azure Container Apps and container concepts.
  - Basic understanding of Microsoft Entra authentication and Azure role-based access control.
