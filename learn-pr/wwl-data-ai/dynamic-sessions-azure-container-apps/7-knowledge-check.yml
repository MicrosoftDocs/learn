### YamlMime:ModuleUnit
uid: learn.wwl.dynamic-sessions-azure-container-apps.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Module assessment
  ms.date: 09/23/2026
  author: jeffkoms
  ms.author: jeffko
  ms.topic: unit
durationInMinutes: 5
content: "Choose the best response for each of the following questions."
quiz:
  questions:
  - content: "An AI document-processing application must run a proprietary converter that depends on native binaries. Which session pool should the developer choose?"
    choices:
    - content: "A custom container session pool with the converter packaged in its image"
      isCorrect: true
      explanation: "A custom container session pool supports native binaries, proprietary dependencies, and runtimes that the built-in interpreter doesn't provide."
    - content: "A built-in code interpreter session pool accessed through its REST API"
      isCorrect: false
      explanation: "The REST API provides access to the built-in runtime, but it doesn't add unsupported native binaries or proprietary dependencies."
    - content: "A built-in code interpreter session pool accessed through `SessionsPythonREPLTool`"
      isCorrect: false
      explanation: "`SessionsPythonREPLTool` adapts the built-in interpreter for LangChain. It doesn't change the packages or binaries available in the managed runtime."
  - content: "An application executes untrusted Python that only processes files uploaded by the backend. Which network configuration best limits the risk of data exfiltration?"
    choices:
    - content: "Set `--network-status EgressEnabled` and restrict access through the backend identity"
      isCorrect: false
      explanation: "Enabling egress allows code in every session in the pool to reach external networks. The backend identity doesn't restrict network calls made by executed code."
    - content: "Set `--network-status EgressDisabled` on the session pool"
      isCorrect: true
      explanation: "Disabled egress prevents generated code from reaching external destinations when the workload only needs supplied code and uploaded files."
    - content: "Increase `--cooldown-period` so the session retains its files"
      isCorrect: false
      explanation: "The cooldown controls how long an idle session remains available. It doesn't restrict outbound network access."
  - content: "A multitenant backend needs to preserve temporary files across related requests without letting users address another tenant's session. How should it manage session identifiers?"
    choices:
    - content: "Use the user's email address as the identifier and include it in client requests"
      isCorrect: false
      explanation: "An email address is predictable and exposes the routing value to the client, which weakens tenant isolation."
    - content: "Accept an identifier generated by the client and validate only its format"
      isCorrect: false
      explanation: "Format validation doesn't prove that the authenticated user owns the session associated with the supplied identifier."
    - content: "Generate an unpredictable identifier on the server and store its user or conversation association in backend state"
      isCorrect: true
      explanation: "A server-generated identifier and server-side ownership mapping let the backend authorize every operation while reusing the correct session."
  - content: "The execution API returns an HTTP success response, but the submitted Python raises an exception. How should the backend classify the outcome?"
    choices:
    - content: "As an execution failure"
      isCorrect: true
      explanation: "The transport completed, but the code didn't execute successfully. The backend must inspect the execution result separately from the HTTP status."
    - content: "As a transport failure"
      isCorrect: false
      explanation: "A transport failure prevents the API operation from completing. In this case, the service accepted and ran the request."
    - content: "As a successful result"
      isCorrect: false
      explanation: "An HTTP success response alone doesn't establish that the code completed successfully or produced valid output."
  - content: "A generated-code execution times out at the backend, and the backend can't determine whether the code produced side effects. What is the safest retry policy?"
    choices:
    - content: "Retry every timeout immediately with the same session identifier"
      isCorrect: false
      explanation: "The original execution might continue after the backend stops waiting, so an immediate retry can duplicate side effects."
    - content: "Retry only when the operation is idempotent and the backend can evaluate the resulting state"
      isCorrect: true
      explanation: "Idempotency and state verification limit the risk of repeating an operation whose original outcome is unknown."
    - content: "Retry only with a new session identifier"
      isCorrect: false
      explanation: "A new session doesn't prevent duplicate effects in external systems and removes temporary state that might help verify the first attempt."
