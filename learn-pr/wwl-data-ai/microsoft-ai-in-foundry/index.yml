title: Get started with Microsoft AI models in Foundry
summary: Discover Microsoft AI models in Foundry and identify the right model for reasoning, image, transcription, and voice workloads.
abstract: |
  After completing this module, you'll be able to:
  - Find and evaluate Microsoft AI models in the Foundry model catalog.
  - Describe how MAI-Thinking supports complex reasoning workloads.
  - Describe how MAI-Image generates and edits visual content.
  - Describe how MAI-Transcribe converts speech to text.
  - Describe how MAI-Voice creates natural, expressive speech.
prerequisites: |
  Before starting this module, you should have:
  - Conceptual knowledge of generative AI.
  - Familiarity with Microsoft Foundry projects.
