abstract: |
  By the end of this module, you'll be able to:
  - Describe how Foundry IQ provides agents with a managed, reusable knowledge layer.
  - Explain how knowledge bases organize indexed and remote knowledge sources.
  - Describe how agentic retrieval finds and returns relevant, cited information.
  - Explain how an agent connects to a knowledge base and uses retrieved information.
prerequisites: A basic understanding of generative AI, AI agents, and retrieval-augmented generation (RAG).
