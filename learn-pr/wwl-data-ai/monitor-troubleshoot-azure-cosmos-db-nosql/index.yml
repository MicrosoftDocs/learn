  title: Monitor and Troubleshoot Azure Cosmos DB
  description: "Interpret Azure Cosmos DB response codes, diagnose the four causes of a 429, monitor latency and partition utilization against service objectives, and configure Azure Monitor alerts and diagnostic logs."
