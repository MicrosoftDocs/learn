title: Monitor and troubleshoot Azure Cosmos DB
summary: Diagnose an Azure Cosmos DB for NoSQL incident from the evidence the service already produces, and put alerts in place so the next one announces itself before your users do.
abstract: |
  After completing this module, you're able to:
  - Interpret response codes and diagnose throttling and transient errors.
  - Monitor physical partition utilization and end-to-end latency against service objectives.
  - Configure Azure Monitor alerts and analyze diagnostic logs in Log Analytics.
prerequisites: |
  - Experience using the Azure Cosmos DB SDK to read and write items in C# or Python
  - Knowledge of request units and provisioned throughput in Azure Cosmos DB, including manual and autoscale throughput
  - Knowledge of partitioning in Azure Cosmos DB, including logical and physical partitions
  - Basic familiarity with Azure Monitor and the Azure portal
