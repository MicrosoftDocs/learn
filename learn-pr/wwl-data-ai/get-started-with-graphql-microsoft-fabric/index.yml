title: Get started with GraphQL in Microsoft Fabric
summary: You'll explore the capabilities of GraphQL within the Microsoft Fabric environment, which provides a unified platform for managing and analyzing data.
abstract: |
  By the end of this module, you'll be able to:
  *   Explain the main components of GraphQL in Microsoft Fabric and how they work.
  *   Create API for GraphQL in Microsoft Fabric.
  *   Understand how to manage relationships.
  *   Query data using the editor.
prerequisites: |
  *   Ability to navigate the Fabric portal.
  *   Conceptual understanding of data and databases.
