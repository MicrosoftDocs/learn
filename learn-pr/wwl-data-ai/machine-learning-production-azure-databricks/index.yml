title: Manage machine learning in production with Azure Databricks
summary: Machine learning enables data-driven decision-making and automation, but deploying models into production for real-time insights is challenging. Azure Databricks simplifies this process by providing a unified platform for building, training, and deploying machine learning models at scale, fostering collaboration between data scientists and engineers.
abstract: |
  In this module you explore:
  - Automate feature engineering and data pipelines
  - Model development and training
  - Model deployment strategies
  - Model versioning and lifecycle management
prerequisites: |
  Before starting this module, you should be familiar with Azure Databricks. Consider completing the following modules first:
  - [Explore Azure Databricks](/training/modules/explore-azure-databricks/)
  - [Use Apache Spark in Azure Databricks](/training/modules/use-apache-spark-azure-databricks/)
