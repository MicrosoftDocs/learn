uid: learn.wwl.sovereignty-policy-initiatives
metadata:
 title: Azure Policy initiatives
 description: Azure Policy initiatives are a collection of Azure policy definitions that are grouped together toward a specific goal or purpose. By consolidating multiple Azure policies into a single item, Azure Policy initiatives allow centralized control and enforcement of configurations across Azure resources.
 ms.date: 11/02/2026
 author: salisburysimon
 ms.author: sidicken
 ms.topic: module-standard-concept-based
 ms.service: microsoft-sovereign-cloud
title: Azure Policy initiatives
summary: |
   In this module, you learn how Azure Policy initiatives can be used to enforce organizational standards, assess compliance at scale, and manage Azure resources effectively.
abstract: |
  This module explains the following concepts:
  - Cloud governance with Azure Policy
  - Azure Policy and its components
prerequisites: |
  - Knowledge of Azure Fundamentals
  - Knowledge of Infrastructure as Code (IaC)
  - Knowledge of Azure Infrastructure Solutions
  - Knowledge of Microsoft for Sovereignty overview
