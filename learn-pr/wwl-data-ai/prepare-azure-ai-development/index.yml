title: Plan and prepare to develop AI solutions on Azure
summary: "Microsoft Azure offers multiple services that enable developers to
  build amazing AI-powered solutions. Proper planning and preparation involves
  identifying the services you'll use and creating an optimal working
  environment for your development team."
abstract: |
  By the end of this module, you'll be able to:
    - Identify common AI capabilities that you can implement in applications
    - Describe Microsoft Foundry and considerations for using it
    - Describe Foundry Tools and considerations for using them
    - Identify appropriate developer tools and SDKs for an AI project
    - Describe considerations for responsible AI
prerequisites: |
  Before starting this module, you should be familiar with:
    - Basic software development concepts
    - Basic AI concepts
    - Basic Azure concepts
