### YamlMime:ModuleUnit
uid: learn.wwl.microsoft-ai-models.knowledge-check
title: Module assessment
metadata:
  title: Module assessment
  description: "Check your learning about Microsoft AI models."
  ms.date: 11/04/2026
  author: graememalcolm
  ms.author: gmalc
  ms.topic: unit
durationInMinutes: 3
content: |
quiz:
  questions:
    - content: "Which model should you evaluate for a chat application that must solve complex, multi-step problems?"
      choices:
        - content: "MAI-Thinking"
          isCorrect: true
          explanation: "Correct. MAI-Thinking is a reasoning model designed for complex problems."
        - content: "MAI-Transcribe"
          isCorrect: false
          explanation: "Incorrect. MAI-Transcribe converts spoken audio into text. It isn't a reasoning model."
        - content: "MAI-Image"
          isCorrect: false
          explanation: "Incorrect. MAI-Image generates and edits images. It isn't designed for text-based reasoning."
    - content: "Which model is optimized for efficient agentic coding workflows in GitHub Copilot?"
      choices:
        - content: "MAI-Code"
          isCorrect: true
          explanation: "Correct. MAI-Code is custom-trained for GitHub Copilot and can plan, reason, and execute across coding tasks."
        - content: "MAI-Thinking"
          isCorrect: false
          explanation: "Incorrect. MAI-Thinking can reason about code, but MAI-Code is optimized specifically for efficient agentic coding workflows in GitHub Copilot."
        - content: "MAI-Voice"
          isCorrect: false
          explanation: "Incorrect. MAI-Voice generates low-latency speech rather than software code."
    - content: "You're building an interactive voice assistant where fast spoken responses are more important than maximum long-form fidelity. Which model is the best starting point?"
      choices:
        - content: "MAI-Voice"
          isCorrect: false
          explanation: "Incorrect. MAI-Voice prioritizes fidelity for workloads such as audiobooks and voice-over. The Flash variant is optimized for latency-sensitive interactions."
        - content: "MAI-Voice-Flash"
          isCorrect: true
          explanation: "Correct. MAI-Voice-Flash prioritizes low latency for voice assistants, call-center agents, and interactive voice response systems."
        - content: "MAI-Transcribe"
          isCorrect: false
          explanation: "Incorrect. MAI-Transcribe provides speech-to-text transcription rather than generating a spoken response."
    - content: "Which MAI-Image variant should you evaluate first when strong object consistency and visual reasoning are the highest priorities?"
      choices:
        - content: "MAI-Image-Flash"
          isCorrect: false
          explanation: "Incorrect. MAI-Image-Flash targets production-ready quality at lower cost rather than the family's strongest visual reasoning."
        - content: "MAI-Image"
          isCorrect: false
          explanation: "Incorrect. The standard variant balances high-quality generation and controllable editing, but the Pro variant targets more demanding visual work."
        - content: "MAI-Image-Pro"
          isCorrect: true
          explanation: "Correct. MAI-Image-Pro provides stronger object consistency, visual reasoning, and world knowledge for demanding creative work."
