abstract: |
  After completing this module, you'll be able to:
  - Describe the Microsoft AI model portfolio.
  - Identify capabilities of Microsoft AI models for chat and thinking.
  - Identify capabilities of Microsoft AI models for code generation.
  - Identify capabilities of Microsoft AI models for speech and transcription.
  - Identify capabilities of Microsoft AI models for image generation and editing.
