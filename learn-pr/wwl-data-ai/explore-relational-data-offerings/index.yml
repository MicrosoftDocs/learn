title: Explore fundamental relational data concepts
summary: Relational database systems are a common way to store and manage transactional and analytical data in organizations of any size around the world.
abstract: |
  In this module, you learn how to:

  -   Identify characteristics of relational data.

  -   Define normalization.

  -   Identify types of SQL statement.

  -   Identify common relational database objects.
