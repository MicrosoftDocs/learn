title: Get started with SQL Database in Microsoft Fabric
summary: You'll explore how to use the capabilities of SQL databases within the Microsoft Fabric environment, which provides a unified platform for managing and analyzing data.
abstract: |
  By the end of this module, you'll be able to:
  *   Explain how SQL database in Fabric works.
  *   Understand security options in SQL database.
  *   Explain how to use Copilot to enhance troubleshooting.
  *   Explore mirroring and data virtualization capabilities.
prerequisites: |
  *   Ability to navigate the Fabric portal.
  *   Conceptual understanding of data and databases.
  *   Experience with T-SQL programming language at a basic level.
