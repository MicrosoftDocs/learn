title: Manage Azure Cosmos DB at scale with fleets
summary: Run a multitenant Azure Cosmos DB estate as one unit. Group accounts into a fleet, share throughput with a pool instead of provisioning every tenant for its peak, and answer estate-wide usage and cost questions from a single dataset.
abstract: |
  After completing this module, you're able to:
  - Describe how Azure Cosmos DB fleets organize multitenant workloads across accounts and subscriptions.
  - Configure fleet-level throughput management by using fleetspaces and pools.
  - Configure fleet monitoring with fleet analytics.
prerequisites: |
  - Knowledge of request units and throughput models in Azure Cosmos DB, including manual and autoscale throughput
  - Knowledge of monitoring Azure Cosmos DB with metrics in Azure Monitor
  - Basic understanding of multitenant application patterns
  - Basic familiarity with Azure subscriptions, resource groups, and the Azure portal
