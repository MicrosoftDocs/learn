title: Design a SQL Server migration strategy
summary: In this module, you'll learn the phases of a migration and the steps involved to ensure your migration project is executed smoothly. You'll also learn the purpose of data platform modernization and see the benefits it can bring to your organization.
abstract: |
  By the end of this module, you'll be able to:
  - Explain what data platform modernization is
  - Review the stages of a data migration
  - Recommend when to use an Azure data platform technology
  - Explore the cost savings of moving your SQL workloads to Azure
prerequisites: |
  The following prerequisites should be completed:
  * Understand on-premises SQL Server Databases
  * Understand your current workloads
