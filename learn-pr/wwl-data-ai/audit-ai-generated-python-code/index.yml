summary: Learn how to review and audit code generated by AI assistants, identifying incorrect information, inefficiencies, bugs, and security issues.
abstract: |
  After you complete this module, you'll be able to:

  -   Recognize incorrect information and assumptions in AI-generated code

  -   Audit AI-generated code for inefficiencies and performance issues

  -   Identify security risks in AI-generated code, such as injection and hardcoded secrets

  -   Apply effective code review techniques to AI-generated solutions

  -   Evaluate AI-generated code and decide whether it's ready for production

prerequisites: |
  -   Basic Python knowledge, including functions, lists, dictionaries, and loops

  -   Experience working with an AI coding assistant like GitHub Copilot

