title: Design multi-region availability and failover in Azure Cosmos DB
summary: Add regions to an Azure Cosmos DB account, route reads and writes to the closest region from the SDK, resolve conflicts between write regions, and choose the failover behavior that matches your recovery objectives.
abstract: |
  After completing this module, you're able to:
  - Distribute data across regions and evaluate the cost of global distribution.
  - Configure multi-region reads and writes, including conflict resolution policies.
  - Configure service-managed, forced, and partition-level failover.
prerequisites: |
  - Experience creating Azure Cosmos DB for NoSQL accounts, databases, and containers
  - Experience using the Azure Cosmos DB SDK to read and write items in C# or Python
  - Knowledge of Azure Cosmos DB consistency levels and their trade-offs
  - Basic knowledge of Azure resource management with the Azure CLI
