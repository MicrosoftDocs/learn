title: Configure resources, throughput, and consistency
summary: Evaluate request-unit, throughput, and consistency needs in Azure Cosmos DB for NoSQL. Configure provisioned or serverless capacity, standard or autoscale throughput, consistency levels, and time to live. Balance cost and performance through account and container settings.
abstract: |
  After completing this module, you're able to:
  - Evaluate request-unit consumption and select an appropriate throughput model.
  - Configure throughput at the database and container levels and set time to live.
  - Evaluate consistency levels and configure default and per-request consistency.
prerequisites: |
  - Familiarity with Azure Cosmos DB for NoSQL, or completion of the module on exploring Azure Cosmos DB for NoSQL
  - Experience building cloud applications with C# or Python
  - Basic familiarity with JSON and the Azure portal
