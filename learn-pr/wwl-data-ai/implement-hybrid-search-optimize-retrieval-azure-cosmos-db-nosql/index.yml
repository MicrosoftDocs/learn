title: Implement hybrid search and optimize AI retrieval in Azure Cosmos DB for NoSQL
summary: Combine keyword and semantic retrieval in one query with Reciprocal Rank Fusion, and then tune the result for relevance, request charge, and latency. Isolate the search workload from transactional traffic when retrieval and writes compete for the same container.
abstract: |
  After completing this module, you're able to:
  - Choose a full-text, vector, or hybrid retrieval strategy for a scenario.
  - Implement hybrid search with the RRF function, including weighted hybrid queries.
  - Optimize full-text and vector retrieval and isolate search workloads with global secondary indexes.
prerequisites: |
  - Experience configuring full-text policies, vector policies, and their indexes in Azure Cosmos DB for NoSQL
  - Familiarity with vector embeddings and calling an embedding API such as Azure OpenAI
  - Working knowledge of Azure Cosmos DB for NoSQL queries, partitioning, and request units
  - Programming experience with Python or C#
