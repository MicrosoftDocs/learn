### YamlMime:ModuleUnit
uid: learn.languages.csharp-repeat-actions-loops.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: "Check your learning on repeating actions with loops in C#."
  ms.date: 09/23/2026
  author: wwlpublish
  ms.author: buzahid
  ms.topic: unit
  module_assessment: true
  ai_generated_module_assessment: false
durationInMinutes: 3
content: |
quiz:
  questions:
  - content: "Which loop is best suited when you know in advance how many times you want to repeat an action?"
    choices:
    - content: "while loop"
      isCorrect: false
      explanation: "Incorrect. A while loop repeats based on a condition, not a known count. Use a for loop when the number of iterations is known."
    - content: "for loop"
      isCorrect: true
      explanation: "Correct. A for loop is ideal when you know exactly how many times to repeat, such as counting from 0 to a fixed number."
    - content: "if statement"
      isCorrect: false
      explanation: "Incorrect. An if statement is for decision-making, not repetition."
  - content: "Which loop type guarantees that its body runs at least once, even if the condition is false from the start?"
    choices:
    - content: "while loop"
      isCorrect: false
      explanation: "Incorrect. A while loop checks its condition before the first iteration, so its body might not run at all."
    - content: "for loop"
      isCorrect: false
      explanation: "Incorrect. A for loop also checks its condition before the first iteration."
    - content: "do-while loop"
      isCorrect: true
      explanation: "Correct. A do-while loop checks its condition after the body runs, so the body always executes at least once."
  - content: "What does the break statement do inside a loop?"
    choices:
    - content: "Skips the current iteration and moves to the next one."
      isCorrect: false
      explanation: "Incorrect. That describes the continue statement. break exits the loop entirely."
    - content: "Restarts the loop from the beginning."
      isCorrect: false
      explanation: "Incorrect. break doesn't restart the loop. It exits the loop immediately."
    - content: "Exits the loop immediately, regardless of the loop condition."
      isCorrect: true
      explanation: "Correct. break stops the loop at that point, and execution continues with the code after the loop."
  - content: "What does the continue statement do inside a loop?"
    choices:
    - content: "Exits the loop immediately."
      isCorrect: false
      explanation: "Incorrect. That describes break. continue only skips the current iteration."
    - content: "Skips the rest of the current iteration and moves to the next one."
      isCorrect: true
      explanation: "Correct. continue jumps back to the loop's condition check and starts the next iteration."
    - content: "Pauses the loop until the user presses a key."
      isCorrect: false
      explanation: "Incorrect. continue has no pausing behavior. It immediately begins the next iteration."
