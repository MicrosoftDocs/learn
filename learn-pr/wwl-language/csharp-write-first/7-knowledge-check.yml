quiz:
  title: "Check your knowledge"
  questions:
  - content: "A user types `42` when a program runs `string answer = Console.ReadLine();`. What kind of value does `answer` hold?"
    choices:
    - content: "The text `\"42\"`."
      isCorrect: true
      explanation: "Correct! `Console.ReadLine()` returns text, even when the user types digits."
    - content: "The whole number `42`."
      isCorrect: false
      explanation: "Incorrect. `Console.ReadLine()` doesn't convert input to a number. The value is text."
    - content: "A number or text, depending on what the user types."
      isCorrect: false
      explanation: "Incorrect. The value is always text when it comes from `Console.ReadLine()`."
  - content: "The variable `name` holds the text `Sam`. Which line displays `Hello, Sam!` in the console?"
    choices:
    - content: "`Console.WriteLine($\"Hello, {name}!\");`"
      isCorrect: true
      explanation: "Correct! The `$` prefix tells C# to replace `{name}` with the value of the variable."
    - content: "`Console.WriteLine(\"Hello, {name}!\");`"
      isCorrect: false
      explanation: "Incorrect. Without the `$` prefix, C# prints the text `{name}` literally."
    - content: "`Console.WriteLine(\"Hello, \", name, \"!\");`"
      isCorrect: false
      explanation: "Incorrect. Commas don't join text. C# treats the first value as a format string and ignores the rest, so this code prints only `Hello, `."
  - content: "What is **wrong** with this line of code?  `Console.WriteLine(\"What is wrong with me?\")`"
    choices:
    - content: "The `L` in `WriteLine` should be lower-case."
      isCorrect: false
      explanation: "Incorrect. The `L` should be upper case."
    - content: "It's missing a semi-colon at the end"
      isCorrect: true
      explanation: "Correct! The semi-colon must be used at the end of a code statement."
    - content: "The string should use single-quotes."
      isCorrect: false
      explanation: "Incorrect. A string literal must be surrounded in double-quotes.  A char literal is surrounded in single quotes."