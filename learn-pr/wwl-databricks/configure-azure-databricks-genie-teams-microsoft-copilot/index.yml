title: Configure Azure Databricks Genie for Microsoft Teams and Microsoft Copilot
summary: Prepare and deploy the Databricks Genie app so business users can query governed Azure Databricks data from Microsoft Teams and Microsoft Copilot.
abstract: |
  After completing this module, you can:
  - Explain the architecture and administrative responsibilities for the Databricks Genie integration.
  - Assess whether Azure Databricks and Microsoft 365 meet the integration prerequisites.
  - Prepare an Azure Databricks workspace for collaboration-platform access.
  - Validate that a Genie Agent and Unity Catalog permissions provide governed access.
  - Review the Microsoft permissions and consent requirements for the Databricks Genie app.
  - Deploy and configure the Databricks Genie app for selected users and Teams channels.
prerequisites: |
  - Familiarity with Azure Databricks workspaces, Unity Catalog, and SQL warehouses.
  - Familiarity with Microsoft Teams app administration.
  - Basic understanding of Microsoft Entra consent and enterprise applications.
