title: Use Azure Databricks Genie in Microsoft Teams and Microsoft 365 Copilot
summary: Get fast, trustworthy answers to your data questions without leaving Microsoft Teams or Microsoft 365 Copilot. Learn to recognize the Genie surfaces available in your organization, ask well-structured questions using the SPARK framework, verify the answers you receive, and use AI-generated data responsibly to support better decisions.
abstract: |
  By the end of this module, you can:
  - Identify the Azure Databricks Genie surfaces available to business users and select the one that fits your working context.
  - Use the Databricks Genie app in Microsoft Teams to ask data questions via direct message and channel mentions.
  - Invoke Genie from Microsoft 365 Copilot using the More agents option and the @Databricks mention.
  - Apply the SPARK framework to write clear, specific Genie questions and use multi-turn conversations to drill deeper.
  - Interpret a Genie response using an inspect-verify-refine workflow to check assumptions and spot errors.
  - Recognize the limits of AI-generated data answers and apply responsible-use practices when sharing and acting on results.
prerequisites: |
  - Familiarity with Microsoft Teams (using apps, messages, and channels).
  - Familiarity with Microsoft 365 Copilot (chat, mentions, and agents).
  - No technical knowledge of Azure Databricks is required.
  - Your organization has already set up a Genie experience for you to use.
