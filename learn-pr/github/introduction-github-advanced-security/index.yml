title: Introduction to GitHub Advanced Security
summary: "This module will help you become familiar with GitHub's Advanced Security features (GHAS) and best practices. As you learn about these features, you'll identify critical areas for eliminating security gaps."
abstract: |
  By the end of this module, you'll be able to:
    - Define GHAS and key features such as secret scanning, code scanning, and Dependabot
    - Use GHAS to maximize security impact
    - Explain GHAS and its role in the security ecosystem
prerequisites: |
  - A GitHub Enterprise Cloud or Enterprise Server account with GitHub Advanced Security
  - Working knowledge of GitHub Actions and workflows
