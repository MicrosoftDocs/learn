title: "Migrate your repository by using GitHub best practices"
summary: Learn to move your existing project to GitHub from a legacy version control system.
abstract: |
  In this module, you will:
  - Prepare your project for a successful migration.
  - Handle any binary files currently stored in your project.
  - Create important Git files like a `.gitignore`.
  - Import your project to GitHub.
