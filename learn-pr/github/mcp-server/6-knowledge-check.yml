### YamlMime:ModuleUnit
uid: learn.github.mcp-server.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Evaluate your understanding of GitHub MCP Server.
  unitType: knowledge_check
  author: camihmerhar
  ms.author: camhernandez
  ms.date: 08/25/2025
  ms.topic: unit
  module_assessment: true
durationInMinutes: 5
quiz:
  title: Check your knowledge
  questions:
    - content: What does MCP stand for in the context of GitHub MCP Server?
      choices:
        - content: Model Collaboration Platform
          isCorrect: false
          explanation: Incorrect. MCP doesn't stand for Model Collaboration Platform.
        - content: Model Context Protocol
          isCorrect: true
          explanation: Correct. MCP stands for Model Context Protocol, a standard way for AI models to connect to tools and data sources.
        - content: Multicloud Provider
          isCorrect: false
          explanation: Incorrect. MCP doesn't stand for Multicloud Provider.
        - content: Modular Code Process
          isCorrect: false
          explanation: Incorrect. MCP doesn't stand for Modular Code Process.

    - content: What is a key benefit of using GitHub MCP Server instead of a local MCP server?
      choices:
        - content: It requires manual configuration for each project.
          isCorrect: false
          explanation: Incorrect. GitHub MCP Server reduces manual setup.
        - content: It eliminates the need for Docker or configuration files.
          isCorrect: true
          explanation: Correct. GitHub MCP Server makes setup faster by removing the need for Docker or configuration files.
        - content: It works only on mobile devices.
          isCorrect: false
          explanation: Incorrect. GitHub MCP Server isn't limited to mobile devices.
        - content: It doesn't support enterprise authentication.
          isCorrect: false
          explanation: Incorrect. GitHub MCP Server supports enterprise authentication options.

    - content: Which authentication methods are supported by GitHub MCP Server in Visual Studio Code?
      choices:
        - content: Only OAuth is supported.
          isCorrect: false
          explanation: Incorrect. GitHub MCP Server also supports personal access tokens.
        - content: Only a personal access token (PAT) is supported.
          isCorrect: false
          explanation: Incorrect. GitHub MCP Server also supports OAuth.
        - content: OAuth and a personal access token (PAT) are supported.
          isCorrect: true
          explanation: Correct. You can authenticate with OAuth or a personal access token.
        - content: A username and password are supported.
          isCorrect: false
          explanation: Incorrect. GitHub MCP Server doesn't use username-and-password authentication.

    - content: Why might you run a local MCP server in Docker?
      choices:
        - content: To avoid using personal access tokens for authentication.
          isCorrect: false
          explanation: Incorrect. Running a local MCP server doesn't remove the need for supported authentication.
        - content: To access resources or APIs that enterprise policy restricts.
          isCorrect: true
          explanation: Correct. A local MCP server can provide access to resources and APIs that enterprise policies restrict.
        - content: To enable only OAuth authentication.
          isCorrect: false
          explanation: Incorrect. A local MCP server isn't limited to OAuth authentication.
        - content: To disable all external integrations.
          isCorrect: false
          explanation: Incorrect. An MCP server enables integrations instead of disabling them.

    - content: What can Copilot do when you combine agent mode with MCP Server?
      choices:
        - content: It can run only security scans.
          isCorrect: false
          explanation: Incorrect. Agent mode isn't limited to security scans.
        - content: It can independently plan and execute multistep workflows.
          isCorrect: true
          explanation: Correct. Agent mode can use MCP Server tools to plan and execute multistep workflows.
        - content: It can perform only single-step commands.
          isCorrect: false
          explanation: Incorrect. Agent mode supports multistep workflows.
        - content: It can perform only code summarization.
          isCorrect: false
          explanation: Incorrect. Agent mode can perform tasks beyond code summarization.

    - content: How should you securely use a personal access token (PAT) in an MCP Server configuration?
      choices:
        - content: Hardcode the token in your source files.
          isCorrect: false
          explanation: Incorrect. Hardcoding a token can expose it in source control.
        - content: Enter the token through a secure input prompt.
          isCorrect: true
          explanation: Correct. A secure input prompt helps prevent the token from being exposed.
        - content: Share the token publicly in your repository.
          isCorrect: false
          explanation: Incorrect. Never publish a personal access token in a repository.
        - content: Save the token as plain text in your workspace.
          isCorrect: false
          explanation: Incorrect. Plain-text storage can expose the token.

    - content: What should you do first if MCP Server tools don't work in Visual Studio Code?
      choices:
        - content: Reinstall Docker.
          isCorrect: false
          explanation: Incorrect. First, check whether you're signed in to GitHub.
        - content: Confirm that you're signed in to your GitHub account in Visual Studio Code.
          isCorrect: true
          explanation: Correct. Authentication is a common cause of MCP Server connection problems.
        - content: Delete your personal access token.
          isCorrect: false
          explanation: Incorrect. First, confirm your sign-in status before changing credentials.
        - content: Remove all server configurations.
          isCorrect: false
          explanation: Incorrect. First, check your sign-in status without removing the configuration.

    - content: Which task can Copilot perform when you combine agent mode with MCP Server?
      choices:
        - content: Copilot can suggest only code completions.
          isCorrect: false
          explanation: Incorrect. MCP Server extends Copilot beyond code completions.
        - content: Copilot can open issues, manage workflows, and execute tasks across platforms.
          isCorrect: true
          explanation: Correct. MCP Server tools enable Copilot to work with issues, workflows, and tasks across platforms.
        - content: Copilot can't interact with GitHub repositories.
          isCorrect: false
          explanation: Incorrect. MCP Server enables Copilot to interact with GitHub repositories.
        - content: Copilot disables semantic search.
          isCorrect: false
          explanation: Incorrect. Combining MCP Server with agent mode doesn't disable semantic search.
