### YamlMime:ModuleUnit
uid: learn.github.github-copilot-across-environments.knowledge-check
title: Module assessment
metadata:
  title: Module assessment
  description: This content is part of the "GitHub Copilot Across Environments - IDE, Chat, and Command Line Techniques" module.
  ms.date: 09/18/2026
  author: a-a-ron
  ms.author: aastewar
  ms.topic: unit
  module_assessment: true
  no-loc: ['/generate', '/test', '/tests', '/unittest', 'gh copilot', 'suggest', 'explain', 'clarify', 'describe']
durationInMinutes: 15
quiz:
  title: Check your knowledge
  questions:
  - content: "How can GitHub Copilot Chat help when you encounter an error in your code?"
    choices:
    - content: "It can analyze the error, suggest possible fixes, and answer follow-up questions."
      isCorrect: true
      explanation: "Correct. GitHub Copilot Chat can help you understand an error, explore possible fixes, and continue the conversation as you debug."
    - content: "It automatically accepts and runs every suggested fix."
      isCorrect: false
      explanation: "Incorrect. You decide whether to apply a suggestion and should review and test any changes."
    - content: "It can debug code only after the code is added to a pull request."
      isCorrect: false
      explanation: "Incorrect. You can use GitHub Copilot Chat while working with code in a supported IDE; a pull request isn't required."
    - content: "It replaces the need to review and test suggested changes."
      isCorrect: false
      explanation: "Incorrect. GitHub Copilot Chat assists with debugging, but you remain responsible for reviewing and testing suggested changes."
  - content: "Which slash command in GitHub Copilot Chat is used to generate unit tests for selected code?"
    choices:
    - content: "/generate"
      isCorrect: false
      explanation: "Incorrect. The /generate command isn't used for generating unit tests."
    - content: "/test"
      isCorrect: false
      explanation: "Incorrect. The /test command isn't the correct slash command for generating unit tests."
    - content: "/tests"
      isCorrect: true
      explanation: "Correct. The /tests slash command is used for generating unit tests for selected code."
    - content: "/unittest"
      isCorrect: false
      explanation: "Incorrect. The /unittest command isn't a valid slash command in GitHub Copilot Chat."
  - content: "What command would you use to get an explanation of a specific command using GitHub Copilot CLI?"
    choices:
    - content: "gh copilot suggest"
      isCorrect: false
      explanation: "Incorrect. The 'suggest' command is used for getting command suggestions, not explanations."
    - content: "gh copilot explain"
      isCorrect: true
      explanation: "Correct. The 'gh copilot explain' command is used to get explanations for specific commands."
    - content: "gh copilot clarify"
      isCorrect: false
      explanation: "Incorrect. 'clarify' isn't a valid command in GitHub Copilot CLI."
    - content: "gh copilot describe"
      isCorrect: false
      explanation: "Incorrect. 'describe' isn't a valid command in GitHub Copilot CLI."
  - content: "Which of the following is NOT a common use case for GitHub Copilot agent tasks on GitHub.com?"
    choices:
    - content: "Generating pull request summaries"
      isCorrect: false
      explanation: "Incorrect. Generating PR summaries is a common use case for Copilot on GitHub.com."
    - content: "Explaining repository code and structure"
      isCorrect: false
      explanation: "Incorrect. Repository exploration and code explanation are key features of Copilot on GitHub.com."
    - content: "Compiling and deploying applications"
      isCorrect: true
      explanation: "Correct. Copilot on GitHub.com provides AI assistance for understanding and reviewing code, but doesn't compile or deploy applications."
    - content: "Suggesting code review comments"
      isCorrect: false
      explanation: "Incorrect. Generating thoughtful code review comments is a common use case for Copilot on GitHub.com."
  - content: "When using Copilot Code Review on GitHub.com, what important billing consideration should you be aware of?"
    choices:
    - content: "It's completely free with no usage limits"
      isCorrect: false
      explanation: "Incorrect. Copilot Code Review consumes Premium Request Units (PRUs) which have allowances and limits."
    - content: "It consumes Premium Request Units (PRUs)"
      isCorrect: true
      explanation: "Correct. Copilot Code Review uses Premium Request Units (PRUs), and the consumption can vary. For current details on PRU allowances and limits, refer to the GitHub Docs on Requests in GitHub Copilot."
    - content: "It only works with paid GitHub Enterprise accounts"
      isCorrect: false
      explanation: "Incorrect. While PRUs are involved, the availability isn't limited to Enterprise accounts only."
    - content: "It requires a separate subscription beyond GitHub Copilot"
      isCorrect: false
      explanation: "Incorrect. Copilot Code Review is part of GitHub Copilot but uses PRUs from your allowance."
