### YamlMime:ModuleUnit
uid: learn.github.github-copilot-code-agent.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Evaluate your understanding of GitHub Copilot Cloud Agent.
  author: camihmerhar
  ms.author: camhernandez
  ms.date: 09/16/2026
  ms.topic: unit
  module_assessment: true
durationInMinutes: 5
content: |
quiz:
  title: Check your knowledge
  questions:
    - content: "What is GitHub Copilot Cloud Agent?"
      choices:
        - content: "A feature that suggests code inline in your editor as you type."
          isCorrect: false
          explanation: "Incorrect. Inline suggestions are an IDE feature, while Copilot Cloud Agent works autonomously on GitHub."
        - content: "An autonomous development assistant that runs inside GitHub and works on tasks you assign."
          isCorrect: true
          explanation: "Correct. GitHub Copilot Cloud Agent works autonomously on GitHub and creates changes for your review."
        - content: "The agent mode feature that performs local edits in your IDE session."
          isCorrect: false
          explanation: "Incorrect. Agent mode works locally in an IDE session, while Copilot Cloud Agent runs on GitHub."
        - content: "A GitHub Actions workflow that runs your tests on every pull request."
          isCorrect: false
          explanation: "Incorrect. Copilot Cloud Agent uses a GitHub Actions-powered environment, but it is an autonomous development assistant."

    - content: "Which task is best suited for GitHub Copilot Cloud Agent?"
      choices:
        - content: "An existing pull request that the agent didn't create."
          isCorrect: false
          explanation: "Incorrect. The agent can't modify an existing pull request that it didn't create."
        - content: "An undefined redesign with no expected outcome."
          isCorrect: false
          explanation: "Incorrect. Clear scope and expected outcomes help the agent complete and validate a task."
        - content: "A well-scoped bug fix with clear requirements."
          isCorrect: true
          explanation: "Correct. The agent is best suited for well-scoped tasks such as bug fixes, small features, tests, and documentation updates."
        - content: "A change that must be pushed directly to the default branch."
          isCorrect: false
          explanation: "Incorrect. The agent can push only to branches whose names begin with copilot/."

    - content: "Where can Copilot Cloud Agent push code?"
      choices:
        - content: "To any branch, including the default branch."
          isCorrect: false
          explanation: "Incorrect. The agent can't push directly to the default branch or other unrestricted branches."
        - content: "To the default branch after required checks pass."
          isCorrect: false
          explanation: "Incorrect. Required checks don't allow the agent to push to the default branch."
        - content: "To any repository in the organization."
          isCorrect: false
          explanation: "Incorrect. The agent works in the repository where you assign the task and remains subject to repository controls."
        - content: "Only to branches whose names begin with copilot/."
          isCorrect: true
          explanation: "Correct. The agent can create and push only to branches whose names begin with copilot/."

    - content: "How do you ask Copilot Cloud Agent to change its work on a pull request?"
      choices:
        - content: "Add a comment on the original issue."
          isCorrect: false
          explanation: "Incorrect. Request changes on the pull request that the agent created."
        - content: "Mention @copilot in a comment on the agent's pull request."
          isCorrect: true
          explanation: "Correct. Mention @copilot in a pull request comment and provide specific feedback to request changes."
        - content: "Close the pull request and open a new issue."
          isCorrect: false
          explanation: "Incorrect. You can request another iteration without closing the pull request."
        - content: "Edit the pull request description yourself."
          isCorrect: false
          explanation: "Incorrect. Editing the description doesn't ask the agent to revise its implementation."

    - content: "What should you do before merging changes generated by Copilot Cloud Agent?"
      choices:
        - content: "Merge them immediately because the agent already ran tests and linters in its environment."
          isCorrect: false
          explanation: "Incorrect. Agent-generated changes still require human review and independent validation."
        - content: "Disable branch protections so the pull request can merge without approval."
          isCorrect: false
          explanation: "Incorrect. Branch protections and approval requirements are important safeguards."
        - content: "Review and test the changes by following secure coding and code review practices."
          isCorrect: true
          explanation: "Correct. Always review and test generated changes before you merge them."
        - content: "Rely on the agent's pull request description instead of reviewing the code."
          isCorrect: false
          explanation: "Incorrect. The pull request description doesn't replace a review of the generated code."

    - content: "Who can approve GitHub Actions workflows on a pull request created by Copilot Cloud Agent?"
      choices:
        - content: "The person who requested the pull request."
          isCorrect: false
          explanation: "Incorrect. The person who requested the pull request can't approve its workflows."
        - content: "Any user who comments on the pull request."
          isCorrect: false
          explanation: "Incorrect. Workflow approval requires write permission to the repository."
        - content: "The agent itself when its work is complete."
          isCorrect: false
          explanation: "Incorrect. Copilot Cloud Agent can't approve its own workflows."
        - content: "A user with write permission other than the person who requested the pull request."
          isCorrect: true
          explanation: "Correct. An independent user with write permission must approve the workflows before they run."

    - content: "How can you extend Copilot Cloud Agent's capabilities with external tools?"
      choices:
        - content: "Install extensions in the agent's IDE session."
          isCorrect: false
          explanation: "Incorrect. Copilot Cloud Agent runs in a GitHub Actions-powered environment, not an IDE session."
        - content: "Configure Model Context Protocol (MCP) servers in the repository."
          isCorrect: true
          explanation: "Correct. Repository administrators can configure MCP servers that provide external tools to the agent."
        - content: "Give the agent your organization's Actions secrets."
          isCorrect: false
          explanation: "Incorrect. Organization secrets shouldn't be broadly exposed to extend agent capabilities."
        - content: "Change the AI model that the agent uses."
          isCorrect: false
          explanation: "Incorrect. Changing the model doesn't connect the agent to external tools."