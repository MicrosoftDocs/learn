uid: learn.github.github-copilot-code-agent
title: Accelerate development with Copilot in the cloud
metadata:
  title: Accelerate development with Copilot in the cloud
  description: Learn how Copilot in the cloud automates routine tasks, manages pull requests, and supports your development workflow.
  author: camihmerhar
  ms.author: camhernandez
  ms.date: 09/22/2025
  ms.update-cycle: 180-days
  ms.service: github
  ms.topic: module
summary: Learn how to delegate tasks to Copilot in the cloud. Use automation to streamline development while your team maintains control.

abstract: |
  By the end of this module, you'll be able to:
  - Explain how running Copilot in the cloud differs from using Copilot in your IDE.
  - Enable the agent, monitor its usage, and manage costs.
  - Describe the agent's safeguards, risks, and limitations.
  - Assign issues to Copilot and track its pull request sessions.
  - Request changes with @copilot comments and troubleshoot problems.
  - Configure the agent's environment and extend its capabilities with MCP.
  - Test and validate the agent's output before merging.
  - Apply responsible use practices to define tasks, secure environments, and improve performance.

prerequisites: |
  - GitHub account with Copilot Pro, Copilot Pro+, Copilot Business, or Copilot Enterprise
  - A repository hosted on GitHub
  - Basic familiarity with issues, pull requests, Actions, and repository rulesets

