title: Using GitHub Copilot with JavaScript
summary: "To work with JavaScript, take advantage of GitHub Copilot, an AI pair programmer that boosts productivity with autocomplete-style suggestions."
abstract: |
  By the end of this module, you'll be able to:

  - Open the portfolio in a GitHub codespace and verify that Copilot is enabled in its Visual Studio Code editor.
  - Craft prompts that can generate useful suggestions from GitHub Copilot.
  - Use GitHub Copilot to update a JavaScript portfolio and check the changes in the preview.
prerequisites: |
  Before you start, make sure you have:

  - A basic understanding of JavaScript variables and conditionals.
  - The ability to use Git and GitHub for version control.
  - A GitHub account that can receive Copilot inline completions and use Copilot Chat in VS Code. If you use an organization-assigned seat, your organization must [allow Chat in the IDE](https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/chat-with-copilot/chat-in-ide?tool=vscode#prerequisites). Eligible individuals without Copilot access can [activate Copilot Free](https://docs.github.com/en/copilot/how-tos/manage-your-account/get-started-with-a-copilot-plan). A Copilot Pro trial isn't required.
  - Permission to create a codespace on the MicrosoftDocs portfolio repository. To launch the portfolio, use **Open in GitHub Codespaces** in the [setup unit](/training/modules/introduction-copilot-javascript/3-exercise-setup#open-the-sample-in-a-codespace). If you have read-only access, you need [permission to fork it](https://docs.github.com/en/codespaces/developing-in-a-codespace/using-source-control-in-your-codespace#about-automatic-forking). An [Enterprise Managed User account](https://docs.github.com/en/enterprise-cloud@latest/admin/managing-iam/understanding-iam-for-enterprises/abilities-and-restrictions-of-managed-user-accounts#github-codespaces) can't create a codespace on a repository outside its organization, even with a Copilot seat.
