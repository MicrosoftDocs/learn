title: Using GitHub Copilot with JavaScript
summary: "To work with JavaScript, take advantage of GitHub Copilot, an AI pair programmer that boosts productivity with autocomplete-style suggestions."
abstract: |
  By the end of this module, you're able to:
    - Enable the GitHub Copilot extension in Visual Studio Code.
    - Craft prompts that can generate useful suggestions from GitHub Copilot.
    - Use GitHub Copilot to improve a JavaScript project.
prerequisites: |
  - Basic understanding of JavaScript, like variables and conditionals.
  - Ability to use Git and GitHub for version control.
  - A GitHub Account with an active subscription for GitHub Copilot is required for either your personal GitHub account or a GitHub account managed by an organization or enterprise. For learning purposes, you should find the Copilot Free option with usage limits to be sufficient.
