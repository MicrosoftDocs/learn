### YamlMime:ModuleUnit
uid: learn.github-copilot-with-javascript.knowledge-check
title: Module assessment
metadata:
  title: Module Assessment
  description: Review GitHub Copilot features and prompt engineering for JavaScript.
  author: Orin-Thomas
  ms.author: orthomas
  ms.date: 11/16/2026
  ms.update-cycle: 180-days
  ms.topic: unit
  ms.collection:
    - ce-advocates-ai-copilot
  ms.custom: devx-track-js
  module_assessment: true
durationInMinutes: 5
content: |
  Choose the best answer to each question about using GitHub Copilot with JavaScript.
quiz:
  questions:
  - content: "What can guide a Copilot inline suggestion in a JavaScript file?"
    choices:
    - content: "A comment describing the goal, partially typed code, and relevant editor context."
      isCorrect: true
      explanation: "Copilot uses available context to suggest a continuation. Check that it does what you intended."
    - content: "Only a message you send in Chat."
      isCorrect: false
      explanation: "Inline suggestions can use editor context without a Chat message."
    - content: "Only code you've already committed to GitHub."
      isCorrect: false
      explanation: "You can get an inline suggestion as you type. You don't have to commit first."
  - content: "What are some features of GitHub Copilot Free?"
    choices:
    - content: "It's a free, unrestricted AI tool that works independently of code editors."
      isCorrect: false
      explanation: "Incorrect. Copilot Free limits both inline completions and Chat usage."
    - content: "It provides limited inline completions and credit-based Chat with automatic model selection."
      isCorrect: true
      explanation: "Correct. Completions and Chat have separate allowances. Chat uses GitHub AI Credits, but inline completions don't."
    - content: "It provides an option to enable slower responses, preserving your Copilot Pro quota."
      isCorrect: false
      explanation: "Incorrect. This isn't a response-speed setting. Copilot Free has separate allowances for completions and Chat."
  - content: "How can you accept a visible inline completion in Visual Studio Code?"
    choices:
    - content: "Press the `Tab` key."
      isCorrect: true
      explanation: "Correct. Tab accepts the visible inline completion."
    - content: "Press `F1`."
      isCorrect: false
      explanation: "False. This option doesn't work to accept GitHub Copilot suggestions."
    - content: "Press `F4`."
      isCorrect: false
      explanation: "False. This option doesn't work to accept GitHub Copilot suggestions."
  - content: "Identify which statement is valid and select the correct answer:"
    choices:
    - content: "A prompt, which is our output, is a collection of songs that tells GitHub Copilot what to generate."
      isCorrect: false
      explanation: "False. A prompt isn't a collection of songs."
    - content: "A prompt, which is our input, is a collection of instructions or guidelines that tell GitHub Copilot what to generate."
      isCorrect: true
      explanation: "A prompt guides Copilot's response. It can be a comment that describes the code you want or the start of a line you want Copilot to complete."
    - content: "A prompt must be a separate document."
      isCorrect: false
      explanation: "Incorrect. A prompt is a request to Copilot. You can enter it directly in Chat or use a code comment to guide an inline suggestion. No separate file is required."
  - content: "Which approach helps you get a useful suggestion from GitHub Copilot?"
    choices:
    - content: "Rely on your choice of editor."
      isCorrect: false
      explanation: "Incorrect. Your choice of editor doesn't tell Copilot what change you need."
    - content: "Install more extensions."
      isCorrect: false
      explanation: "Incorrect. Installing extensions doesn't describe the behavior you want."
    - content: "Give a clear goal and relevant context."
      isCorrect: true
      explanation: "Correct. A focused prompt helps, but it doesn't guarantee correct code. Check the result against the behavior you requested."
