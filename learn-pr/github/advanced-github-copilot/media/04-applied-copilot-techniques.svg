<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c22c4ab4eecc3bf91-title c22c4ab4eecc3bf91-desc" data-module="advanced-github-copilot" data-kind="compare" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="c22c4ab4eecc3bf91-title">Supply the evidence that fits the question</title><desc id="c22c4ab4eecc3bf91-desc">Using advanced GitHub Copilot features, UNIT 04. The most useful context for a local Python bug differs from the context needed for a packaging proposal or a failing API test. 1. Selected Python lines: Ask inline chat to read and print file contents; file.read refers to a method, not its result. 2. Packaging proposal: Attach requirements.txt and main.py so a Dockerfile suggestion reflects actual dependencies. 3. Test failure: Compare the test's expectation with actual output and the code that produced it. Key takeaways: Confirm the local fix calls file.read() and prints the returned text from file.txt. A plausible explanation is not a run of the code. Open tabs do not guarantee complete context. Confirm which files are attached, and remove credentials from any terminal output.</desc><defs><symbol id="c22c4ab4eecc3bf91-i430" viewBox="0 0 18 18" data-asset="general\10787-icon-service-Code.svg" xmlns="http://www.w3.org/2000/svg"><g><defs><linearGradient id="c22c4ab4eecc3bf91-i430n0" x1="9" y1="15.834" x2="9" y2="5.788" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0078d4" /><stop offset="0.502" stop-color="#4093e6" /><stop offset="0.775" stop-color="#5ea0ef" /></linearGradient><linearGradient id="c22c4ab4eecc3bf91-i430n1" x1="3.754" y1="11.614" x2="6.975" y2="11.614" gradientTransform="translate(9.78 -0.365) rotate(44.919)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5ea0ef" /><stop offset="0.372" stop-color="#9fc6f5" /><stop offset="0.8" stop-color="#e4effc" /><stop offse