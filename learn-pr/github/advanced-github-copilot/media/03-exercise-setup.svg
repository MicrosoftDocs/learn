<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="cec83f9f6ad984b57-title cec83f9f6ad984b57-desc" data-module="advanced-github-copilot" data-kind="flow" data-layout="columns" xmlns="http://www.w3.org/2000/svg"><title id="cec83f9f6ad984b57-title">Verify the running API inside its Codespace</title><desc id="cec83f9f6ad984b57-desc">Using advanced GitHub Copilot features, UNIT 03. The forwarded preview is useful only after the container, authenticated editor, and application have each started successfully. 1. Choose the environment: Check the machine size, payer, and remaining allowance before creating the Codespace. 2. Confirm prerequisites: Wait for container setup, sign in with the Copilot account, and verify a Chat request works. 3. Open the private preview: Confirm Uvicorn startup, then open the forwarded Application port 8000 to reach /docs. Key takeaways: An unused allowance of 120 core-hours covers 60 running hours on two cores. Personal Free storage has a separate 15 GB-month allowance. Keep the provided Python environment and existing server. Your own computer's localhost is not the forwarded application URL.</desc><defs><marker id="cec83f9f6ad984b57-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker></defs><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#ffffff" /><rect x="56" y="57" width="32" height="6" rx="3" fill="#0078d4" /><g data-field="module" data-box="101 45 839 30"><text x="105" y="66.343" font-size="17" font-weight="700" fill="#24566d">Using advanced GitHub Copilot features</text></g><rect x="960" y="42" width="104" height="36" rx="18" fill="#e3eff8" /><g data-field="unit" data-box="960 45.5 104 29"><text x="981.263" y="65.767" font-size="16" font-weight="700" fill="#24566d">U