xt><text x="782" y="585.519" font-size="21" font-weight="400" fill="#364f5e">then open the forwarded</text><text x="782" y="614.519" font-size="21" font-weight="400" fill="#364f5e">Application port 8000 to</text><text x="782" y="643.519" font-size="21" font-weight="400" fill="#364f5e">reach /docs.</text></g></g><g data-field="takeaways" data-box="56 770.2 320 45"><text x="60" y="803.413" font-size="28" font-weight="700" fill="#132c3b">Key takeaways</text></g><line x1="274.053" x2="1064" y1="794.5" y2="794.5" stroke="#c6d6df" stroke-width="1.5" /><g data-point="1"><circle cx="77" cy="870.36" r="13" fill="#e2f1ee" /><path d="M71 870.36l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 850.4 948 70"><text x="120" y="878.22" font-size="23" font-weight="400" fill="#364f5e">An unused allowance of 120 core-hours covers 60 running hours on two cores. Personal</text><text x="120" y="910.22" font-size="23" font-weight="400" fill="#364f5e">Free storage has a separate 15 GB-month allowance.</text></g></g><g data-point="2"><line x1="116" x2="1064" y1="949.6" y2="949.6" stroke="#dbe6ea" stroke-width="1.5" /><circle cx="77" cy="998.76" r="13" fill="#e2f1ee" /><path d="M71 998.76l4 4 8 -9" fill="none" stroke="#155c56" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><g data-field="point" data-box="116 978.8 948 70"><text x="120" y="1006.62" font-size="23" font-weight="400" fill="#364f5e">Keep the provided Python environment and existing server. Your own computer's</text><text x="120" y="1038.62" font-size="23" font-weight="400" fill="#364f5e">localhost is not the forwarded application URL.</text></g></g></svg>