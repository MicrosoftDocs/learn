<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="1120" viewBox="0 0 1120 1120" font-family="Segoe UI, Arial, sans-serif" font-kerning="normal" role="img" aria-labelledby="c502c3bffd2e326cb-title c502c3bffd2e326cb-desc" data-module="advanced-github-copilot" data-kind="split" data-layout="fork" xmlns="http://www.w3.org/2000/svg"><title id="c502c3bffd2e326cb-title">Decide what happens to a reviewed Copilot plan</title><desc id="c502c3bffd2e326cb-desc">Using advanced GitHub Copilot features, UNIT 02. Planning proposes the files, edits, and checks; the review decision determines whether implementation begins. 1. Reviewed plan: Inspect the full plan and request corrections if it would change existing API behavior. 2. Approve Plan Only: Keep the reviewed approach for a manual or inline edit without starting Agent changes. 3. Implement Plan: Start implementation in the session, subject to its separate tool permissions. Key takeaways: Type / in the Chat view to see the selected session's workflows; availability can differ by editor, session, and customization. Use Ask to understand the existing route before planning. Approval is neither permission to use every tool nor evidence that tests passed.</desc><defs><marker id="c502c3bffd2e326cb-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1 13 7 1 13Z" fill="#286486" /></marker><symbol id="c502c3bffd2e326cb-i70" viewBox="0 0 792 612" data-asset="CnE_Enterprise\Key, permissions.svg" xmlns="http://www.w3.org/2000/svg"><g><g id="c502c3bffd2e326cb-i70n0"><g id="c502c3bffd2e326cb-i70n1" /></g><g id="c502c3bffd2e326cb-i70n2" /><g id="c502c3bffd2e326cb-i70n3" /><g id="c502c3bffd2e326cb-i70n4" /><g id="c502c3bffd2e326cb-i70n5"><g id="c502c3bffd2e326cb-i70n6" transform="translate(1.50075,-1.50075)"><path fill="#2A3282" d="M455.7,152.9H334.5c-11.1,0-20.5,9.4-20.5,20.5v84.5c0,11.1,9.4,19.6,21.3,19.6h23.9v151.1    c0,19.6,12,33.3,29,3