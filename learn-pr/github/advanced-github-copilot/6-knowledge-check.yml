### YamlMime:ModuleUnit
uid: learn.advanced-github-copilot.knowledge-check
title: Module assessment
metadata:
  title: Module assessment
  description: Review advanced features in GitHub Copilot.
  author: abrilurena
  ms.author: orthomas
  ms.date: 11/11/2026
  ms.update-cycle: 180-days
  ms.topic: unit
  ms.collection:
    - ce-advocates-ai-copilot
  module_assessment: true
durationInMinutes: 5
content: |
quiz:
  questions:
  - content: "What is ghost text in GitHub Copilot?"
    choices:
    - content: "Ghost text in GitHub Copilot are suggestions that appear in your text editor as you type."
      isCorrect: true
      explanation: "That's correct! Ghost text refers to the suggestions given by GitHub Copilot without a prompt, based on your currently opened files. By accepting these suggestions with the Tab key or manually editing them, you can quickly write code and documentation for your project."
    - content: "Ghost text in GitHub Copilot are options used when typing to provide suggestions."
      isCorrect: false
      explanation: "Incorrect. Ghost text doesn't involve any kind of options while typing."
    - content: "Ghost text in GitHub Copilot involves using prompts and natural language questions within your code or documentation."
      isCorrect: false
      explanation: "While you can provide a prompt for GitHub Copilot, ghost text doesn't require a specific prompt. Ghost text suggestions are based on context from the open files by default."
  - content: "How do you access GitHub Copilot's inline chat?"
    choices:
    - content: "Open the Chat view from the Chat menu in the VS Code title bar."
      isCorrect: false
      explanation: "Incorrect. This opens the separate Chat view. To open inline chat, use Ctrl+I on Windows or Command+I on macOS, or select Chat > Open Inline Chat."
    - content: "Use Ctrl+I on Windows or Command+I on macOS to open inline chat."
      isCorrect: true
      explanation: "That's correct! This shortcut opens inline chat in the editor. You can also select Chat > Open Inline Chat. A file in an active chat editing session can instead open Ask in Chat for that session."
    - content: "Access inline chat by using Alt+I on Windows or Option+I on macOS."
      isCorrect: false
      explanation: "Incorrect. The inline-chat shortcuts are Ctrl+I on Windows and Command+I on macOS. You can also use Chat > Open Inline Chat."
  - content: "What are slash commands used for in GitHub Copilot?"
    choices:
    - content: "Slash commands automatically enforce formatting rules across the codebase."
      isCorrect: false
      explanation: "Incorrect. Slash commands start supported workflows in the selected chat session. They don't automatically enforce formatting rules."
    - content: "Slash commands provide the same commands in every editor and chat surface."
      isCorrect: false
      explanation: "Incorrect. Available commands depend on the session type, editor version, and installed customizations. A Chat-view command isn't necessarily available in inline chat."
    - content: "Slash commands start supported workflows in the selected chat session."
      isCorrect: true
      explanation: "That's correct! For example, /plan researches a task and proposes an implementation plan. Type / in the Chat view to see commands available in the selected session."
  - content: "How can you make a question about a failing API test more relevant to your project?"
    choices:
    - content: "Attach the relevant source, test file, and failure output, then ask a focused question."
      isCorrect: true
      explanation: "That's correct! Explicit context grounds the response in the failure and the code being discussed."
    - content: "Assume that every open file and all terminal output are always included."
      isCorrect: false
      explanation: "Incorrect. Context selection and retrieval don't guarantee complete project visibility. Attach the files and output that matter."
    - content: "Choose Agent solely to guarantee that its answer is correct."
      isCorrect: false
      explanation: "Incorrect. Agent can implement changes, but its output still requires review and verification."
  - content: "What does /plan do in a Copilot Chat session?"
    choices:
    - content: "Guarantees that the code has already been changed and all tests pass."
      isCorrect: false
      explanation: "Incorrect. A plan isn't evidence of implementation or successful tests."
    - content: "Researches the task and proposes an implementation plan for review."
      isCorrect: true
      explanation: "That's correct! Review the approach and verification steps before choosing to implement the plan."
    - content: "Automatically gives the agent unrestricted permissions."
      isCorrect: false
      explanation: "Incorrect. The planning workflow and the session's permissions are separate choices."
