### YamlMime:ModuleUnit
uid: learn.github.security-campaign.knowledge-check
title: Module assessment
metadata:
  title: Module assessment
  description: Check what you've learned about security campaigns and prevention-first strategy in GitHub Advanced Security.
  author: a-a-ron
  ms.author: aastewar
  ms.date: 10/08/2026
  ms.topic: unit
  module_assessment: true
durationInMinutes: 5
 
content: |
quiz:
  title: Check your knowledge
  questions:
 
  - content: "What is the primary purpose of a security campaign in GitHub Advanced Security?"
    choices:
    - content: "To automatically fix all security alerts across repositories"
      isCorrect: false
      explanation: "GitHub does not automatically fix alerts. Remediation happens through developer workflows such as pull requests and dependency updates."
    - content: "To group related security alerts across repositories so teams can coordinate remediation"
      isCorrect: true
      explanation: "Correct. Security campaigns help organizations coordinate remediation efforts across multiple repositories using existing GitHub security signals."
    - content: "To replace code scanning and dependency scanning tools"
      isCorrect: false
      explanation: "Security campaigns do not replace scanning tools. They use the alerts generated by them."
    - content: "To prevent all vulnerabilities from being introduced into code"
      isCorrect: false
      explanation: "Prevention is supported through controls like push protection, but campaigns focus on coordination and remediation."
 
  - content: "Which GitHub features generate the security alerts used in campaigns?"
    choices:
    - content: "Code scanning, secret scanning, and dependency alerts"
      isCorrect: true
      explanation: "Correct. These GitHub Advanced Security features generate the alerts that campaigns aggregate."
    - content: "GitHub Issues, Projects, and Discussions"
      isCorrect: false
      explanation: "These are collaboration tools, not security scanning features."
    - content: "GitHub Actions only"
      isCorrect: false
      explanation: "GitHub Actions can automate workflows but do not generate security alerts directly."
    - content: "Pull requests and commits"
      isCorrect: false
      explanation: "These are development activities that may trigger scans, but they do not generate alerts themselves."
 
  - content: "What is the correct workflow for remediation in GitHub Advanced Security campaigns?"
    choices:
    - content: "Fix alerts directly inside the campaign dashboard"
      isCorrect: false
      explanation: "Campaigns provide visibility, but remediation happens in repositories."
    - content: "Delete repositories with high alert volume"
      isCorrect: false
      explanation: "Deleting repositories is not a remediation strategy."
    - content: "Use pull requests and standard GitHub workflows to resolve alerts in repositories"
      isCorrect: true
      explanation: "Correct. Remediation happens through repository-based workflows such as pull requests and dependency updates."
    - content: "Wait for GitHub to automatically close alerts"
      isCorrect: false
      explanation: "Alerts are closed only when the underlying issue is resolved in code or dependencies."
 
  - content: "How do organizations measure the effectiveness of a security campaign?"
    choices:
    - content: "By the number of repositories created during the campaign"
      isCorrect: false
      explanation: "Repository creation is unrelated to campaign effectiveness."
    - content: "By tracking alert volume, remediation speed, and new alert trends over time"
      isCorrect: true
      explanation: "Correct. These metrics help measure whether risk is decreasing and how effectively teams are responding."
    - content: "By the number of developers assigned to alerts"
      isCorrect: false
      explanation: "Assignment alone does not measure risk reduction."
    - content: "By disabling security scanning tools"
      isCorrect: false
      explanation: "Disabling security tools would reduce visibility, not improve security."
 
  - content: "What is the main outcome of applying prevention-first controls?"
    choices:
    - content: "Elimination of all security alerts"
      isCorrect: false
      explanation: "Prevention reduces risk but does not eliminate all alerts."
    - content: "Reduced introduction of new vulnerabilities into code"
      isCorrect: true
      explanation: "Correct. Prevention-first controls reduce future alert volume by stopping issues before they reach production."
    - content: "Replacement of security campaigns with automated fixes"
      isCorrect: false
      explanation: "Campaigns remain necessary for coordination and tracking."
    - content: "Removal of the need for pull requests"
      isCorrect: false
      explanation: "Pull requests remain the core mechanism for controlled changes."
