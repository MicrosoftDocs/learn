title: Security campaigns and prevention-first strategy
summary: Security campaigns help organizations coordinate the remediation of security alerts across repositories and teams. In this module, you'll learn how to identify and scope campaigns, coordinate remediation through pull requests and dependency updates, measure changes in alert volume and remediation speed, and use prevention-first controls such as push protection, code scanning, and dependency review to reduce future security risk. You'll also learn how campaign insights support a continuous security improvement cycle.

abstract: |
  By the end of this module, you'll be able to:
  - Define a security campaign in an organizational context
  - Describe how to coordinate remediation efforts across teams using GitHub security insights
  - Apply prevention-first principles using GitHub security capabilities
  - Evaluate risk reduction using observable metrics and trends

prerequisites: |
  - A GitHub account
  - Basic understanding of repositories, pull requests, and workflows on GitHub
  - Familiarity with basic security concepts such as vulnerabilities and dependencies
  - A GitHub Code Security plan 
