title: Introduction to computer vision with TensorFlow
summary: In this module, you get an introduction to Computer Vision using TensorFlow. We use image classification to learn about convolutional neural networks, and then see how pretrained networks and transfer learning can improve our models and solve real-world problems.
abstract: |
  In this module you will:
  - Learn how to build computer vision machine learning models
  - Learn how to represent images as tensors
  - Learn how to build Dense Neural Networks and Convolutional Neural Networks
