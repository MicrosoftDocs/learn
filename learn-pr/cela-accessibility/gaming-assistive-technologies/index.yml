title: Gaming assistive technologies
summary: Learn about the types of assistive hardware and software technologies that players with disabilities use to game, and the importance of supporting these assistive technologies when you create accessible gaming products and experiences for all audiences.
abstract: |
 After you complete this module, you'll be able to:

 - Describe common gaming software-based features and tools and how their use can affect player experiences.
 - Describe common hardware-based gaming assistive technologies and how their use can affect player experiences.
 - Determine appropriate methods to support assistive technology users when you develop games and platforms.
prerequisites: |
 - You should have some basic familiarity with playing and creating video games.
 - You should have some familiarity with using game platforms like Xbox, Windows, and other common gaming console and PC platforms.
 - A basic understanding of foundational terms and concepts for disability and accessibility principles is helpful.
