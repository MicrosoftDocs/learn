title: Work with files and directories in a .NET app
summary: Build an app that manipulates files and directories with C# and .NET.
abstract: |
  By the end of this module, you'll be able to:

  - Work with directories.
  - Create and delete files.
  - Read from files.
  - Write to files.
  - Parse data in files.
prerequisites: |
  - Experience writing C# at the beginner level
  - Familiarity with basic programming constructs such as loops and "if" statements
  - Local installations of [.NET SDK](https://dotnet.microsoft.com/download)
  - [Visual Studio Code](https://code.visualstudio.com)
  - [C# extension](https://marketplace.visualstudio.com/items?itemName=ms-dotnettools.csharp) for Visual Studio Code
