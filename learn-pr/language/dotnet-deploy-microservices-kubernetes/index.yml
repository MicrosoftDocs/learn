title: Deploy a .NET microservice to Kubernetes
summary: Microservice applications are composed of small, independently versioned, and scalable customer-focused services. Microservices applications deployed in containers make it possible to scale out apps, and respond to increased demand by deploying more container instances, and to scale back if demand is decreasing. In complex solutions of many microservices the process of deploying, updating, monitoring, and removing containers introduces challenges. This module explains some of those challenges and shows how Kubernetes can help.
abstract: |
  In this module, you will:
    
  - Learn the concepts behind orchestrators and why you might need them.
  - Take an existing .NET microservice hosted in a Docker container and push it to Docker Hub.
  - Deploy the microservice from Docker Hub to a local Kubernetes instance.
  - Learn how to scale a container instance in a Kubernetes cluster.
prerequisites: |
  - Familiarity with basic Docker concepts and a Docker account
  - Familiarity with microservice design
