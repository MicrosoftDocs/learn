title: Training with AI tools
summary: This module focuses on using AI tools in designing effective professional development and training sessions. You explore how AI tools are used to create personalized and inclusive learning.

abstract: |
  By the end of this module, you're able to:
  - Appraise the design quality of training materials created by Microsoft Designer.
  - Evaluate the effectiveness of Reading Coach for individualized learning.
  - Assess the impact of Microsoft 365 Copilot in Excel on data analysis. 

