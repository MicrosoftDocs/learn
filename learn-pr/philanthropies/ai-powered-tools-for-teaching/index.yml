summary: This module contains sample activities that demonstrate how to integrate AI-powered tools into your learning environment.

abstract: |
  By the end of this module, you'll be able to:
  - Evaluate the effectiveness of Microsoft's AI-powered tools in enhancing teaching and learning outcomes. 
  - Critique the quality of interactive learning materials created using Microsoft PowerPoint Speaker Coach. 
  - Compare and contrast different AI-powered features in Microsoft 365 products.

