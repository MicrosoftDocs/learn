title: Enhance nonprofit volunteer management with Microsoft Copilot
summary: This module demonstrates how to use Copilot to manage volunteers within your nonprofit organization. 
abstract: |
  By the end of this module, you'll be able to:
    - Understand how Copilot can help with various aspects of volunteer management at a nonprofit organization.
    - Use Copilot to recruit, train, and retain volunteers for your nonprofit programs.
prerequisites: |
  - Basic understanding of volunteer management
  - Basic understanding of Microsoft Copilot
