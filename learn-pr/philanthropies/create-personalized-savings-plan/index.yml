title: Create a personalized savings plan to work toward a financial goal
summary: This module introduces students to the importance of saving and various strategies to help them save effectively. By the end, students have a personalized saving plan to help them reach their goals and build long-term financial habits.

abstract: |
  - Understand why saving money is essential for achieving future goals.
  - Explore various saving strategies and their benefits.
  - Practice saving skills to develop effective saving habits.
prerequisites: Access to Microsoft Designer and Microsoft Copilot.
