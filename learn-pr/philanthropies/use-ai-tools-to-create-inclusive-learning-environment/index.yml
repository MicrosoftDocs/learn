title: Use AI tools to create an inclusive learning environment
summary: This module showcases how AI can be used to create tailored and inclusive educational experiences. You explore adaptive learning platforms adjusted to individual learning styles, AI-driven feedback systems, and personalized content delivery for diverse learner needs.

abstract: |
  By the end of this module, you are able to:
  - Recognize the role of AI in supporting collaborate learning.
  - Assess how applications utilize text-to-speech technology and who can benefit from this functionality.
  - Determine how AI in Microsoft Teams enhances accessibility for learners with a hearing disability or Attention deficit hyperactivity disorder (ADHD). 

