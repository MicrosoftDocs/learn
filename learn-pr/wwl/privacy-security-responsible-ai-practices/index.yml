summary: Learn to apply AI responsibly while maintaining privacy, security, transparency, and accountability in supported employment tasks.
abstract: |
  After completing this module, you will be able to:
  - Understand the role of AI in supported employment.
  - Apply privacy and security principles to AI-assisted tasks.
  - Ensure transparency and consent when using AI with employees.
  - Identify and mitigate bias and unsupported claims in AI outputs.
  - Follow organizational policies for responsible AI use.
prerequisites: |
  - Basic understanding of supported employment practices.
  - Familiarity with organizational policies on privacy and security.
