title: "Use AI to plan your day"
summary: Learn how to use AI to create schedules, prioritize tasks, and manage your day effectively.
abstract: |
  After completing this module, you will be able to:
  - Use AI to create daily schedules and checklists.
  - Prioritize tasks based on importance and deadlines.
  - Break large tasks into smaller, manageable steps.
  - Adjust plans dynamically as your day changes.
  - Integrate AI with other planning tools like calendars and reminders.
prerequisites: |
  - Basic familiarity with AI tools like Copilot.
  - Ability to identify daily tasks and priorities.
