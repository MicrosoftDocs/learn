title: Get started with data science in Microsoft Fabric
summary: In Microsoft Fabric, data scientists can manage data, notebooks, experiments, and models while easily accessing data from across the organization and collaborating with their fellow data professionals.
abstract: |
  In this module, you'll learn how to:
  - Understand the data science process
  - Train models with notebooks in Microsoft Fabric
  - Track model training metrics with MLflow and experiments
prerequisites: |
  Before starting this module, you should be familiar with the basic principles of machine learning.
