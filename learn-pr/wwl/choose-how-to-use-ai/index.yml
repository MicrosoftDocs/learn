title: "Choose how to use AI"
summary: Learn how to decide when and how to use AI effectively, combine it with other supports, and stay in control of your decisions.
abstract: |
  After completing this module, you will be able to:
  - Decide when AI is helpful for a task.
  - Identify when other supports are better suited than AI.
  - Use AI in combination with existing tools and supports.
  - Stay in control of your choices when using AI.
prerequisites: |
  - Basic understanding of AI and its capabilities.
  - Familiarity with using digital tools or supports.
