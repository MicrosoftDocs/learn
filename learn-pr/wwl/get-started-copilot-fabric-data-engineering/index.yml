title: Get started with Copilot in Microsoft Fabric for data engineering
summary: "Use Copilot in Microsoft Fabric to ingest and transform data, orchestrate pipeline activities, and generate and explain Spark code. Review generated changes and validate results."
abstract: |
  In this module, you learn how to:
    - Apply Copilot in Microsoft Fabric to assist with data ingestion, transformation, and exploration.
    - Prompt Copilot to generate dataflow transformations and pipeline activities, then verify their configuration.
    - Generate, refine, and explain data transformation logic and Spark code, then validate the results.
    - Use effective prompting strategies and best practices to improve quality, performance, and governance when using Copilot in Fabric.
prerequisites: |
  - You should be familiar with data analytics and engineering concepts and terminology.
