title: Work with real-time data in an Eventhouse in Microsoft Fabric
summary: An eventhouse in Microsoft Fabric is a container that houses one or more KQL databases for storing and analyzing real-time data.
abstract: |
  After completing this module, you'll be able to:
  - Create an Eventhouse in Microsoft Fabric.
  - Write effective KQL queries.
  - Understand how to use materialized views and stored functions in a KQL database.

prerequisites: Before starting this module, you should be familiar with the Microsoft Fabric interface and core concepts.
