title: "Use AI safely"
summary: Learn to use AI responsibly by protecting private information, identifying scams, and verifying AI-generated responses.
abstract: |
  After completing this module, you will be able to:
  - Identify private information that should not be shared with AI.
  - Create safer prompts for AI interactions.
  - Recognize warning signs of scams and unsafe requests.
  - Verify AI-generated responses for accuracy and safety.
  - Take appropriate steps to protect yourself and seek help when needed.
prerequisites: |
  - Basic understanding of AI and its applications.
  - Familiarity with online communication and digital tools.
