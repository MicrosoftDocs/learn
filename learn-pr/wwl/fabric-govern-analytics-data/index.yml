title: Govern analytics data in Microsoft Fabric
summary: Apply governance controls in Microsoft Fabric to classify sensitive data, signal trust with endorsement, and monitor governance posture using the OneLake catalog.
abstract: |
  By the end of this module, you're able to:
  - Apply sensitivity labels to classify and protect Fabric items.
  - Use endorsement, tags, and documentation to signal trust and improve discoverability.
  - Monitor governance posture using the OneLake catalog's Govern section.
  - Understand how the Secure section provides centralized access management.
prerequisites: |
  - Experience working with Microsoft Fabric workspaces.
  - Familiarity with security concepts in Microsoft Fabric.
