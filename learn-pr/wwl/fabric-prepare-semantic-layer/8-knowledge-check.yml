### YamlMime:ModuleUnit
uid: learn.wwl.fabric-prepare-semantic-layer.knowledge-check
title: Module assessment
metadata:
  title: Module assessment
  description: "Apply semantic model grounding, AI control, ontology handoff, and validation decisions to new business scenarios."
  ms.date: 08/19/2026
  author: angierudduck
  ms.author: anrudduc
  ms.topic: unit
  module_assessment: true
  ai_generated_module_assessment: false
durationInMinutes: 2
quiz:
  questions:
  - content: "A retail analytics team uses both gross margin amount and gross margin percentage to make pricing decisions. Copilot selects either measure when managers ask about margin. What should the team do first?"
    choices:
    - content: "Create a verified answer for every question that contains the word margin."
      isCorrect: false
      explanation: "Incorrect. A broad verified answer can mask different intents. The semantic model should first distinguish the two trusted measures."
    - content: "Give each measure a distinct business name and a description that states its unit and calculation."
      isCorrect: true
      explanation: "Correct. Distinct names and descriptions provide the grounding evidence Copilot needs to map each interpretation of margin to the intended measure."
    - content: "Add an AI instruction that tells Copilot to choose whichever margin measure appears first."
      isCorrect: false
      explanation: "Incorrect. Object order doesn't represent business intent and doesn't resolve the ambiguity for users."
  - content: "A semantic model exposes `CustomerKey`, `LoadBatchID`, `Customer`, and `Sales` for regional sales questions. Which change best prepares the gold layer for AI?"
    choices:
    - content: "Keep every field visible so Copilot has the maximum amount of context."
      isCorrect: false
      explanation: "Incorrect. Technical keys and load metadata add choices without helping answer the target business questions."
    - content: "Keep the business entities and trusted measures visible, and hide technical keys and load metadata."
      isCorrect: true
      explanation: "Correct. A focused gold layer exposes the smallest business-ready surface that supports the intended questions."
    - content: "Replace the star schema with one flat table so Copilot doesn't need relationships."
      isCorrect: false
      explanation: "Incorrect. Clear star-schema relationships help Copilot follow business entities and don't need to be removed."
  - content: "A pharmaceutical company has a board question that requires an approved measure, fixed regulatory filters, and a specific visual. Leaders phrase the question in several predictable ways. Which control best fits this requirement?"
    choices:
    - content: "A verified answer with focused trigger phrases for the approved question."
      isCorrect: true
      explanation: "Correct. A verified answer returns the approved visual and data when a user's phrasing matches its triggers."
    - content: "A synonym that maps the board's terminology to the measure."
      isCorrect: false
      explanation: "Incorrect. A synonym helps identify a field but doesn't preserve the required visual and fixed filters."
    - content: "A broad AI instruction that applies the regulatory filters to every question."
      isCorrect: false
      explanation: "Incorrect. A broad instruction can affect unrelated questions. The requirement applies to one stable, high-value question."
  - content: "An analytics team generates an ontology from an Import-mode semantic model. The definitions appear, but the team also expects generated data bindings that agents can query. What should the team evaluate?"
    choices:
    - content: "Whether the semantic model should use Direct Lake mode with inbound public access for generated data bindings."
      isCorrect: true
      explanation: "Correct. Ontology definitions can be generated from several semantic model modes, but generated data bindings require Direct Lake and inbound public access."
    - content: "Whether Foundry IQ can provide direct data bindings to the Import-mode semantic model."
      isCorrect: false
      explanation: "Incorrect. Foundry IQ supplies knowledge context and doesn't create ontology data bindings for an Import-mode semantic model."
    - content: "Whether marking the semantic model as Approved for Copilot creates the missing bindings."
      isCorrect: false
      explanation: "Incorrect. Approval affects Copilot trust signals and doesn't change ontology generation behavior."
  - content: "During testing, a purchasing question returns the expected number, but diagnostics show that Copilot used a deprecated measure. What should the analytics team do before approving the semantic model?"
    choices:
    - content: "Approve the semantic model because the numeric result matches the expected answer."
      isCorrect: false
      explanation: "Incorrect. The correct number came from an untrusted reasoning path and can fail when the data changes."
    - content: "Hide or replace the deprecated measure, then rerun the same question and related regression tests."
      isCorrect: true
      explanation: "Correct. The team corrects the earliest grounding failure and retests to verify the intended measure without introducing regressions."
    - content: "Create a verified answer so users can't see which measure produced the result."
      isCorrect: false
      explanation: "Incorrect. A verified answer hides the symptom rather than correcting the deprecated grounding source."
