title: Prepare semantic models for AI in Power BI and Microsoft Fabric
summary: Design gold layers, semantic models, and documentation that enable Copilot, data agents, and enterprise ontologies to deliver accurate, business-relevant insights.
abstract: |
  By the end of this module, you're able to:
  - Explain how semantic model context guides Copilot answers.
  - Design a focused gold layer for AI consumption.
  - Select the appropriate Prep for AI control for a semantic model failure.
  - Decide when to use Fabric IQ to share stable semantic model entities across teams.
  - Validate AI readiness by testing priority questions and fixing the cause of wrong answers.
prerequisites: |
  - You've designed and configured a Power BI semantic model.
  - You use star schemas and DAX measures to represent business entities and metrics.
