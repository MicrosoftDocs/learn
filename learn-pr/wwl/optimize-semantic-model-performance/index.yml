title: Optimize semantic model performance
summary: "Diagnose and fix semantic model and report performance issues. Use Performance analyzer to identify bottlenecks, optimize DAX calculations, reduce cardinality, and implement aggregations to improve query speed."
abstract: |
  By the end of this module, you're able to:
    - Use Performance analyzer to identify performance bottlenecks
    - Optimize DAX calculations for better query performance
    - Reduce cardinality levels to improve model efficiency
    - Implement aggregations to accelerate queries on large datasets
    - Apply a systematic approach to troubleshoot common performance issues
prerequisites: |
  - Semantic model design experience and DAX authoring skills
