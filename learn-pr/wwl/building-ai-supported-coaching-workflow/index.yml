abstract: |
  After completing this module, you will be able to:
  - Identify appropriate AI uses across supported employment activities.
  - Use a repeatable five-step workflow.
  - Create and maintain a simple prompt library.
  - Choose one responsible next step for work.
prerequisites: |
  - Basic understanding of AI capabilities and limitations.
  - Familiarity with coaching or supported employment processes.
