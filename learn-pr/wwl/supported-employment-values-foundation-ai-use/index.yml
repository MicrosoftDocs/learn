summary: Learn how AI can enhance job coaching while respecting employee autonomy, dignity, and workplace inclusion.
abstract: |
  After completing this module, you will be able to:
  - Describe the values that should guide AI use.
  - Explain how AI can enhance job coaching without replacing relationships or judgment.
  - Identify when AI can assist and when people must lead.
prerequisites: |
  - Basic understanding of job coaching principles.
  - Familiarity with workplace inclusion concepts.
