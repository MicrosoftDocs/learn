title: Evaluate application security risks with Codename MDASH
summary: Evaluate how Codename MDASH helps a robotic pharmacy-delivery service investigate source-code risks that could expose customer orders or disrupt pharmacy operations. Identify appropriate use cases, integration choices, and preview limitations before adoption.
abstract: |
  After completing this module, you can:
  - Explain the source-code security problems that Codename MDASH is designed to address.
  - Describe how the multi-model agentic pipeline discovers, validates, and consolidates vulnerability findings.
  - Evaluate findings by using severity, confidence, exposure context, and supporting evidence.
  - Identify scenarios where Codename MDASH adds value and recognize its current preview limitations.
  - Investigate a simulated Caldova security incident and review vulnerable code with Codename MDASH.
prerequisites: |
  - Basic familiarity with how software is developed and tested.
  - No prior experience with Codename MDASH or AI-based code scanning is required.
