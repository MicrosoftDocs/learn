summary: Learn how AI, including Microsoft Copilot, can assist with everyday tasks, provide suggestions, and help you make informed decisions.
abstract: |
  After completing this module, you will be able to:
  - Define artificial intelligence and its applications.
  - Understand how AI tools like Microsoft Copilot assist with daily tasks.
  - Identify the limitations of AI and the importance of human decision-making.
  - Use AI prompts effectively for organization, planning, and learning.
prerequisites: |
  - Basic familiarity with technology and digital tools.
  - Interest in learning about artificial intelligence and its applications.
