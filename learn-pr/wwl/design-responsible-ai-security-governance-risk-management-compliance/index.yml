title: "Design responsible AI security, governance, risk management, and compliance"
summary: Learn to design secure, governed, and compliant AI systems that align with organizational policies and Responsible AI principles.
abstract: |
  After completing this module, you will be able to:
  - Design AI systems that balance innovation with accountability.
  - Apply identity, access control, and data governance to secure AI agents.
  - Implement observability and threat protection for AI solutions.
  - Translate compliance requirements into technical controls.
  - Mitigate vulnerabilities across prompts, models, and workflows.
prerequisites: |
  - Working knowledge of Microsoft Entra ID, Azure RBAC, Azure monitoring, data governance concepts, and Copilot Studio administration.
