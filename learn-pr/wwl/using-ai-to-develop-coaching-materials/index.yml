title: "Using AI to develop coaching materials"
summary: Learn how AI supports job coaches in creating organized and accessible materials while maintaining human-led decision-making and safety standards.
abstract: |
  After completing this module, you will be able to:
  - Use AI to organize, format, and simplify verified content.
  - Ensure human-led discovery, observation, and decision-making.
  - Create employee-approved profiles and support plans.
  - Adapt workplace instructions and practice scenarios using AI.
  - Apply shared review standards for accuracy, accessibility, and fit.
prerequisites: |
  - Basic understanding of vocational profiling and job coaching.
  - Familiarity with workplace safety and accessibility standards.
