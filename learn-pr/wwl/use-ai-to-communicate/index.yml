abstract: |
  After completing this module, you will be able to:
  - Use AI to start a message.
  - Make a message shorter.
  - Rewrite a message using clearer words.
  - Ask for help with writing a message.
  - Organize thoughts before writing.
prerequisites: |
  - Basic familiarity with communication tools.
  - Interest in improving written communication skills.
