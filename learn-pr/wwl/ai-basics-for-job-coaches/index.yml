title: "AI basics for job coaches"
summary: Learn how job coaches can effectively use AI tools to support workplace tasks while maintaining accuracy, privacy, and compliance.
abstract: |
  After completing this module, you will be able to:
  - Describe what AI is and recognize common uses.
  - Write a clear prompt using a five-part structure.
  - Use a five-step workflow to create and review a draft.
  - Recognize inaccurate, biased, or unsupported output.
prerequisites: |
  - Basic understanding of workplace processes and supported employment.
  - Familiarity with drafting workplace materials.
