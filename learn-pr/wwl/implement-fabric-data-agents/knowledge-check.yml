content: |
  [!include[](includes/knowledge-check.md)]
quiz:
  title: "Check your knowledge"
  questions:
  - content: "What is a primary benefit of using Microsoft Fabric Data Agents in an organization?"
    choices:
    - content: "They allow users to ask questions in plain English and receive context-rich answers from enterprise data."
      isCorrect: true
      explanation: "Correct. Microsoft Fabric Data Agents make data insights accessible through natural language queries."
    - content: "They require users to write complex SQL queries for every data request."
      isCorrect: false
      explanation: "Incorrect. Microsoft Fabric Data Agents eliminate the need for technical query languages."
    - content: "They only work with Power BI and don't support other data sources."
      isCorrect: false
      explanation: "Incorrect. Microsoft Fabric Data Agents support multiple data sources."
  - content: "What defines the scope of data a Microsoft Fabric Data Agent can access to answer user questions?"
    choices:
    - content: "The example queries provided during setup"
      isCorrect: false
      explanation: "Incorrect. Example queries guide intent but don't expand data access."
    - content: "The data sources explicitly connected (grounded) to the agent"
      isCorrect: true
      explanation: "Correct. Only the configured/grounded data sources are used for retrieval."
    - content: "The agent's AI instructions"
      isCorrect: false
      explanation: "Incorrect. The AI instructions guide the behavior, but don't define the scope of data it has access to."
    - content: "The number of users interacting with the agent"
      isCorrect: false
      explanation: "Incorrect. Usage volume does not change accessible data."
  - content: "What is the purpose of providing example queries when configuring a Microsoft Fabric Data Agent?"
    choices:
    - content: "To help the AI generate more precise responses by demonstrating expected outputs."
      isCorrect: true
      explanation: "Correct. Example queries guide the AI for better accuracy."
    - content: "To restrict the agent to only answer those specific questions."
      isCorrect: false
      explanation: "Incorrect. Example queries are for guidance, not restriction."
    - content: "To increase the number of data sources the agent can access."
      isCorrect: false
      explanation: "Incorrect. Example queries don't affect data source access."
  - content: "Which statement correctly describes permissions for the Fabric IQ integration in an existing Microsoft Foundry project?"
    choices:
    - content: "Foundry User supports building and testing agents, Foundry Project Manager is required to create the Fabric IQ connection, and users need access to the data agent and its underlying sources."
      isCorrect: true
      explanation: "Correct. Foundry roles depend on the task. The Fabric data agent connection uses delegated user authentication, so Fabric also checks the signed-in user's data permissions."
    - content: "Foundry User alone grants permission to create the Fabric IQ connection and read all connected Fabric data."
      isCorrect: false
      explanation: "Incorrect. Creating the connection requires Foundry Project Manager, and Foundry roles don't grant access to Fabric data."
    - content: "Publishing the Fabric data agent gives all Foundry project users access to its underlying sources."
      isCorrect: false
      explanation: "Incorrect. Publishing doesn't grant data permissions. Users still need access to the agent and its underlying sources."
  - content: "How do you add published Fabric data agents to a Foundry agent through the portal with Fabric IQ?"
    choices:
    - content: "Add Fabric IQ (OneLake Catalog) in Tools, filter for Data agent, and select published agents that you have access to."
      isCorrect: true
      explanation: "Correct. The catalog lets you select accessible published data agents by name. Repeat the process to add multiple data agents, and write instructions that guide the Foundry agent to the appropriate tool."
    - content: "Select Fabric IQ to automatically connect every data agent in the tenant."
      isCorrect: false
      explanation: "Incorrect. You select individual published data agents that you have access to from the OneLake Catalog. Adding Fabric IQ doesn't automatically connect every data agent."
    - content: "Add an unpublished data agent from the catalog and let Foundry publish it automatically."
      isCorrect: false
      explanation: "Incorrect. Only published Fabric data agents that you have access to appear in the catalog."
