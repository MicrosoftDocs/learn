title: Startup fundamentals
summary: >
  This module gives an overview of the startup fundamentals and core business concepts you need to launch a successful startup.
abstract: | 
  In this module, you'll:
  - Consider whether you're in a position to invest the time and effort needed for a startup.
  - Inform yourself about factors that help startups succeed.
  - Learn about mistakes that cause startups to fail.
