title: Validate your startup idea with customers
summary:
  This module shows you how to test and validate your startup idea by interviewing customers and running experiments.
abstract: | 
  In this module, you'll:
  - Identify the value that your product creates for your customers.
  - Learn about tools that you can use to design a value proposition.
  - Explore experiments that you can use to test the assumptions you made about your startup.
  - See how to interview customers effectively. 
