title: AI Center of Excellence
summary: |
   Learn about the AI Center of Excellence (AI CoE) and how it can help your organization adopt AI workloads. This learning path covers the key components of an AI CoE, including stakeholders, workload governance, AI workload operations best practices, and how you can leverage Azure landing zones for complex AI workloads.
prerequisites: Familiarity basic Artificial Intelligence and operations concepts
