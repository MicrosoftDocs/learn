title: Run VMware resources on Azure VMware Solution
summary:  |
  Learn about Azure VMware Solution, how to deploy the resource, and how to migrate VMware virtual machines on-premises.
prerequisites: |
  - Experience managing VMware infrastructure, such as vSphere, vCenter, NSX-T, and vSAN.
  - Basic knowledge of network concepts, such as Classless Inter-Domain Routing (CIDR), Border Gateway Protocol (BGP) routing, Dynamic Host Configuration Protocol (DHCP), and subnets.
