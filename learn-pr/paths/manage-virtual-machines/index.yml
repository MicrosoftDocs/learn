uid: learn.wwl.manage-virtual-machines
metadata:
  title: Manage Virtual Machines
  description: Learn how to manage Hyper-V and guest virtual machines on-premises and manage Windows Server virtual machines in Azure.
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: learning-path
title: Manage virtual machines
summary: |
  This learning path covers how to manage virtual machines in on-premises and Azure environments. You learn how to configure Hyper-V hosts, virtual switches, and nested virtualization, manage VM settings including generations, virtual hard disks, and checkpoints, and secure workloads with the Host Guardian Service and shielded VMs. You also learn to implement VM high availability and live migration, run Windows containers, and plan, deploy, and scale Windows Server VMs on Azure including virtual network and IP address configuration, network security with NSGs and Azure Firewall, and secure remote access with Azure Bastion and JIT.

  This learning path helps you prepare for [Exam AZ-802: Administering Windows Server](/credentials/certifications/exams/az-802/).
prerequisites: |
  - Experience administering Windows Server operating systems
  - Familiarity with Hyper-V and Azure virtual machines
  - Basic knowledge of PowerShell
