prerequisites: |
  - An Azure subscription
  - Local installations of [Java JDK (8+)](https://adoptopenjdk.net/releases.html?variant=openjdk8&jvmVariant=hotspot/), [Maven (3+)](https://maven.apache.org/download.cgi) and [Azure CLI (2.12+)](/cli/azure/install-azure-cli)
