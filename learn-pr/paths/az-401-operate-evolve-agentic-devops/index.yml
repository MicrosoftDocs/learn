  ms.author: petender
title: 'AZ-401: Operate and evolve agentic DevOps systems'
summary: |
  Connect GitHub and Azure DevOps delivery records to OpenTelemetry and Azure workload evidence.
  Evaluate Copilot-assisted queries and Azure Copilot Observability Agent findings, then measure delivery and agent effectiveness.
  Explore Azure SRE Agent for incident triage and remediation, and transition from scripts and AI-assisted tasks
  to governed agentic workflows using instructions, skills, and multi-agent orchestration.
prerequisites: |
  - Experience using the Azure portal and managing basic Azure application resources.
  - Understanding of monitoring concepts, including logs, metrics, alerts, and application health signals.
  - Familiarity with incident triage, troubleshooting, remediation, and rollback concepts.
  - Ability to read basic Azure CLI scripts and infrastructure-as-code templates such as Bicep.
  - Basic experience using GitHub Copilot and reviewing AI-generated operational recommendations.
