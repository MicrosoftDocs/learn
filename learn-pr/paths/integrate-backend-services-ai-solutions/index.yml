title: Integrate backend services for AI solutions
prerequisites: |
  - Programming experience with Python, including asynchronous programming.
  - Basic understanding of Azure services and cloud computing concepts.
  - Familiarity with distributed systems concepts and event-driven architectures.
  - Familiarity with REST APIs, authenticated requests, and asynchronous messaging patterns.
  - Familiarity with browser-based application concepts.
summary: |
  This learning path explores how to build reliable, responsive AI solutions by integrating backend services on Azure. It covers messaging with Azure Service Bus, event routing with Azure Event Grid, serverless processing and workflow orchestration with Azure Functions and Durable Functions, and real-time client updates with Azure Web PubSub. You'll learn to decouple application components, coordinate long-running operations, and deliver updates securely while keeping backend processing separate from client delivery.
