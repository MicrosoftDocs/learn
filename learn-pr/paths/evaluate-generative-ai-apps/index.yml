summary: >
  Explore concepts and methodologies for evaluating generative AI applications. Through code-first exercises and real-world scenarios, you'll learn to analyze and assess output quality, evaluate output using custom evaluators, and generate synthetic datasets.
prerequisites: |
  - An Azure subscription – [Create one for free](https://azure.microsoft.com/pricing/purchase-options/azure-account?cid=msft_learn)
  - Familiarity with Azure and the Azure portal
  - Ability to understand Python at a beginner level
  - Developing in browser:
    - [GitHub account](https://docs.github.com/get-started/signing-up-for-github)
  - Developing locally:
    - [Docker desktop](https://www.docker.com/products/docker-desktop/)
    - [Visual Studio Code](https://code.visualstudio.com/)
      - [Dev Containers extension](https://marketplace.visualstudio.com/items?itemName=ms-vscode-remote.remote-containers)
