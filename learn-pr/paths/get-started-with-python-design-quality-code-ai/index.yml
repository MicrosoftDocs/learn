title: "Get started with Python programming: Part 3 - Design quality code with AI"
summary: |
  Build on your Python programming skills to design, improve, and review code with AI-assisted development tools. In this learning path, you apply defensive programming practices, measure and improve performance, write clear specifications for AI assistants, and audit AI-generated code for correctness, efficiency, and security.
prerequisites: |
  - Experience writing and running Python programs in Visual Studio Code, including functions, loops, lists, and dictionaries. Complete [Get started with Python programming: Part 2 - building programs](/training/paths/get-started-with-python-programs/) or have equivalent knowledge.
  - Intermediate-level software development experience and an understanding of software design concepts.
  - Familiarity with writing requirements and specifications.
  - Experience using an AI coding assistant, such as GitHub Copilot.
