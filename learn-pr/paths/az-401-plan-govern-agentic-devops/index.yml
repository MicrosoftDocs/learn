title: "AZ-401: Plan and govern work for agentic DevOps"
summary: |
  Explore how agentic approaches support DevOps teams while maintaining human oversight.
  Connect Azure Boards with GitHub Copilot to refine and delegate work, and use Azure DevOps MCP Server
  to manage work items, pull requests, and pipelines.
prerequisites: |
  - Familiarity with Agile backlogs in Azure Boards and Git-based repositories, branches, and pull requests.
  - Experience designing or managing CI/CD pipelines in Azure Pipelines or GitHub Actions.
  - Familiarity with Azure resources and infrastructure as code using Bicep or similar tools.
  - Working knowledge of Azure resource governance, monitoring, and incident response.
  - Familiarity with GitHub Copilot Chat in Visual Studio Code.
