### YamlMime:LearningPath
uid: learn.wwl.deploy-manage-active-directory-domain-services
metadata:
  title: Deploy and Manage Active Directory Domain Services
  description: Learn how to deploy and manage Active Directory Domain Services domain controllers, security principals, multi-site environments, and Group Policy in on-premises and cloud scenarios.
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: learning-path
title: Deploy and manage Active Directory Domain Services
summary: |
  This learning path covers how to deploy and manage Active Directory Domain Services (AD DS) in on-premises and hybrid environments. You learn how to deploy domain controllers on-premises and in Azure, manage FSMO roles, create and manage users, groups, and organizational units, and extend your on-premises identity into Azure. You also configure Group Policy Objects to enforce security and desktop settings, and work with trusts, replication, and multi-site AD DS environments.

  This learning path helps you prepare for [Exam AZ-802: Administering Windows Server](/credentials/certifications/exams/az-802/).
prerequisites: |
  - Experience administering Windows Server operating systems
  - Familiarity with Active Directory Domain Services (AD DS) concepts and technologies
  - Basic knowledge of PowerShell
