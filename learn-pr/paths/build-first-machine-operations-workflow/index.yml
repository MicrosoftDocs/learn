title: Operationalize machine learning models (MLOps)
prerequisites: |
  - Programming experience with Python or R
  - Experience developing and training machine learning models
  - Familiarity with basic Azure Machine Learning concepts
summary: |
  Follow an end-to-end MLOps workflow across two stages. First, design a training solution, experiment with models, track training with MLflow, and tune hyperparameters. Then, build pipelines, plan an MLOps solution, automate model training with GitHub Actions, and deploy and monitor a model.
