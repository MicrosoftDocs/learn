title: AI for people with intellectual and developmental disabilities
summary: |
  AI tools like Microsoft Copilot can help with everyday tasks at work, at school, and at home. This learning path explains what AI is, shows what it does well, and points out where it can get things wrong. You practice writing prompts, checking the answers you get back, and keeping your private information private.

  AI gives suggestions. You decide what to use. Every module keeps that choice with you, including the choice not to use AI at all.

  After completing this learning path, you will be able to:
  - Describe what AI is, what Microsoft Copilot can help with, and why AI answers need checking.
  - Use AI to explain instructions, build checklists, and organize tasks for work and school.
  - Write, shorten, and clarify messages with AI, then review them before sending.
  - Plan a day with AI, including known times, travel time, breaks, and changes to the plan.
  - Keep private information private, recognize scams and pressure, and know who to ask for help.
  - Decide when AI is helpful, when another support fits better, and when to skip AI.
prerequisites: |
  - No previous experience with AI is needed.
  - Access to Microsoft Copilot, or another AI tool, to try the example prompts.
