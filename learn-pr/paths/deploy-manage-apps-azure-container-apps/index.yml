title: Deploy and manage apps on Azure Container Apps
prerequisites: |
  - Basic understanding of Azure services and cloud computing concepts.
  - Familiarity with container concepts.
  - Familiarity with command-line tools including Azure CLI.
summary: |
  This learning path guides you through the complete lifecycle of running containerized applications on Azure Container Apps. You start by deploying container apps to environments, configuring runtime settings with environment variables and secrets, and setting up registry authentication. You then manage the day-two lifecycle by updating images, managing revisions, monitoring logs, and configuring health probes. Next, you configure automatic horizontal scaling using HTTP rules, KEDA scalers, and traffic management to optimize performance and cost. Finally, you use Azure Container Apps dynamic sessions to securely execute AI-generated and user-submitted code in isolated environments, exchange files, and manage session lifecycle and failures.
