summary: |
  New to the cloud? Introduction to Cloud Infrastructure is a four-part series that teaches you basic cloud concepts, provides a streamlined overview of many Azure services, and guides you with hands-on exercises to deploy your very first services for free. Complete all of the learning paths in the series if you are preparing for Exam AZ-900: Microsoft Azure Fundamentals.
  This is the third learning path in the series, **Introduction to Cloud Infrastructure: Describe Azure management and governance**. The other learning paths in the series are [**Part 1: Describe cloud concepts**](/training/paths/microsoft-azure-fundamentals-describe-cloud-concepts/), [**Part 2: Describe Azure architecture and services**](/training/paths/azure-fundamentals-describe-azure-architecture-services/), and [**Part 4: Apply Azure skills in guided projects**](/training/paths/introduction-cloud-infrastructure-apply-azure-skills-guided-projects/).
