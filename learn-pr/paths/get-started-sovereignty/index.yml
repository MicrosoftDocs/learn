title: Get started with Microsoft Sovereign Cloud
summary: |
  Learn how Microsoft Sovereign Cloud helps organizations balance innovation with control over data, operations, and technology dependencies. Start with deployment models, country/region and European digital commitments, and evidence-based risk and resilience decisions. Then explore Azure Policy initiatives, Azure key and certificate management, and Azure confidential computing.

  In this learning path, you:
  - Compare sovereignty controls and cloud models for different workload requirements.
  - Explore policy-based governance and compliance assessment with Azure Policy initiatives.
  - Describe key and certificate management options for protecting sensitive cloud data.
  - Explain how confidential computing helps protect data in use.
prerequisites: |
  - Knowledge of Azure fundamentals, cloud security concepts, and Azure infrastructure solutions.
  - Familiarity with infrastructure as code (IaC) concepts for the Azure Policy module.
