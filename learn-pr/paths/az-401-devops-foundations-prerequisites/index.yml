title: "DevOps foundations for the transition to agentic DevOps"
summary: "Self-paced foundations outside of the AZ-401 agentic DevOps course. This relies more on traditional DevOps concepts."
prerequisites: |
  - Basic familiarity with how software applications are developed, tested, and deployed.
  - Awareness of source control concepts, such as repositories and commits.
  - Basic understanding of cloud computing concepts, such as compute, storage, and networking.
  - Familiarity with using a code editor and running basic command-line commands.
