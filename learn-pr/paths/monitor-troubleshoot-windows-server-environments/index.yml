uid: learn.wwl.monitor-troubleshoot-windows-server-environments
metadata:
  title: Monitor and Troubleshoot Windows Server Environments
  description: Learn how to monitor Windows Server environments using built-in tools and Azure services, and troubleshoot Windows Server networking, Active Directory, and system issues.
  ms.date: 08/31/2026
  author: wwlpublish
  ms.author: robbarefoot
  ms.topic: learning-path
title: Monitor and troubleshoot Windows Server environments
prerequisites: |
  - Experience administering Windows Server operating systems
  - Familiarity with Active Directory Domain Services (AD DS) and core networking technologies
  - Basic knowledge of PowerShell and Azure monitoring services
summary: |
  This learning path covers how to monitor and troubleshoot Windows Server environments. You learn how to use Performance Monitor, Event Viewer, and auditing tools to track server health and compliance, and extend monitoring into Azure with Azure Monitor and VM Insights. You also troubleshoot on-premises and hybrid networking issues including DHCP, DNS, and routing, manage server updates with WSUS and Azure Update Management, and troubleshoot Active Directory including replication failures, Group Policy processing, and hybrid authentication.

  This learning path helps you prepare for [Exam AZ-802: Administering Windows Server](/credentials/certifications/exams/az-802/).
