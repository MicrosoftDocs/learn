modules:
# 7.1 Monitor using Windows Server tools and Azure services
- learn.wwl.monitor-windows-server-performance # Primary - Performance Monitor, Resource Monitor, counters
- learn.wwl.manage-monitor-event-logs # Primary - Event Viewer, event subscriptions, log management
- learn.wwl.implement-windows-server-auditing-diagnostics # Supplementary - audit policies, diagnostic tools
- learn.wwl.monitor-windows-server-iaas-vms-hybrid-instances # Supplementary - Azure Monitor, Log Analytics, VM Insights
- learn.azure.monitor-azure-vm-using-diagnostic-data # Supplementary - Azure VM diagnostic data
# 7.2 Troubleshoot Windows Server issues
- learn.wwl.troubleshoot-premises-hybrid-networking # Primary - DNS, DHCP, IP, VPN, hybrid connectivity
- learn.wwl.troubleshoot-windows-server-virtual-machines-azure # Supplementary - Azure VM troubleshooting
- learn.wwl.windows-server-update-management # Supplementary - WSUS, Windows Update, update troubleshooting
# 7.3 Troubleshoot Active Directory
- learn.wwl.troubleshoot-active-directory # Primary - AD replication, GPO processing, authentication
