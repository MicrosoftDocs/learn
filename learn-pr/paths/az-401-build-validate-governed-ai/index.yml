title: 'AZ-401: Build and validate with governed AI assistance'
summary: |
  First establish repository contribution, branches, pull requests, conflict resolution, and Copilot code review.
  Then turn accepted source into tested build candidates using Azure Pipelines or GitHub Actions.
  Compare Docker builds, Azure Artifacts, GitHub Packages, and container registries while preserving output identity,
  independent validation, and scoped publication.
prerequisites: |
  - Familiarity with Git repositories, commits, and remotes in GitHub or Azure Repos.
  - Ability to read and edit YAML pipelines in Azure Pipelines or GitHub Actions.
  - Understanding of build agents or runners, pipeline variables, and package or artifact management.
  - Familiarity with automated testing, code quality checks, and basic security scanning.
  - Basic experience using GitHub Copilot and reviewing generated code or configuration.
