  title: Implement AI and Analytics Capabilities in Azure Cosmos DB
  description: "Build AI and analytics capabilities on Azure Cosmos DB for NoSQL: full-text, vector, and hybrid search, retrieval tuning, retrieval-augmented generation, durable agent memory, and no-ETL operational analytics with Microsoft Fabric mirroring."
