title: Manage Windows Servers and workloads in a hybrid environment
prerequisites: |
  - Experience administering Windows Server operating systems
  - Familiarity with remote management tools including PowerShell remoting and Windows Admin Center
  - Basic experience with implementing and managing IaaS services in Microsoft Azure
summary: |
  This learning path covers how to manage Windows Servers and workloads across on-premises and hybrid environments. You learn how to select and use the right administration tools, including Windows Admin Center, Server Manager, and PowerShell remoting, and apply secure administration principles such as least privilege and Privileged Access Workstations. You also remotely manage Azure VMs using Azure Bastion and Just-In-Time (JIT) VM access, configure post-installation settings, restrict administrative access with Just Enough Administration (JEA), and manage hybrid workloads using Azure Arc.

  This learning path helps you prepare for [Exam AZ-802: Administering Windows Server](/credentials/certifications/exams/az-802/).
