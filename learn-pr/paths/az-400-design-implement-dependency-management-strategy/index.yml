prerequisites: |
  -   Understanding of DevOps concepts and practices
  -   Familiarity with Azure DevOps or GitHub
  -   Basic knowledge of package managers (npm, NuGet, Maven, or similar)
  -   Experience with version control systems (Git)
  -   Understanding of CI/CD pipelines and automation
summary: |
  This comprehensive learning path examines **dependency management** in modern software development. You'll learn how to identify dependencies in your codebase, manage package feeds, secure artifacts, implement versioning strategies, and leverage both Azure Artifacts and GitHub Packages. Master the skills needed to create efficient, secure, and scalable dependency management workflows for DevOps practices.
