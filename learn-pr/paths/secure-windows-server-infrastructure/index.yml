title: Secure Windows Server infrastructure
summary: |
  This learning path covers how to secure Windows Server infrastructure and Active Directory Domain Services. You learn how to harden Windows Server using security baselines, LAPS, and Privileged Access Workstations, configure Microsoft Defender for Endpoint and built-in Windows client protections, and manage Group Policy security settings and audit policies. You also secure Active Directory by managing user rights, authentication policies, Protected Users, and service accounts including gMSA and dMSA, and monitor for threats with Microsoft Defender for Identity.

  This learning path helps you prepare for [Exam AZ-802: Administering Windows Server](/credentials/certifications/exams/az-802/).
prerequisites: |
  - Experience administering Windows Server operating systems
  - Familiarity with Active Directory Domain Services (AD DS) concepts
  - Basic knowledge of PowerShell and Group Policy
