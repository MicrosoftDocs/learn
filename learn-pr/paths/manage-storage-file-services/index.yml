title: Manage storage and file services
summary: |
  This learning path covers how to manage storage and file services in on-premises and hybrid environments. You learn how to deploy Azure File Sync, migrate file servers using Storage Migration Services, and manage Windows Server file shares including DFS, FSRM, and SMB security. You also configure storage technologies including Storage Spaces, Storage Spaces Direct, Storage Replica, Data Deduplication, and iSCSI.

  This learning path helps you prepare for [Exam AZ-802: Administering Windows Server](/credentials/certifications/exams/az-802/).
prerequisites: |
  - Experience administering Windows Server operating systems
  - Familiarity with storage concepts and file server management
  - Basic knowledge of PowerShell
