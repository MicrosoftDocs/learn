title: Perform basic Azure Management Tasks (Security and Monitoring)
prerequisites: |
  Prior knowledge of cloud concepts, Azure services, and basic security and monitoring principles, such as those covered in Course AZ-900T00-A: Microsoft Azure Fundamentals.
summary: |
  Learn essential Azure security and monitoring tasks. You enable Microsoft Defender for Cloud, review security recommendations, manage keys and secrets in Azure Key Vault, configure Azure Firewall policies, and set up Log Analytics workspaces to enhance your cloud security and compliance posture.
