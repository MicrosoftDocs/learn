title: Best practices for Azure migration and modernization
summary: |
  Cloud migration and modernization is top of mind for most of the organizations. Explore how you can confidently and efficiently navigate every step of the migration and modernization journey. Dive deeper into steps and best practices for planning and executing migration and modernization.
  
  In this learning path, you'll:
  - Understand the benefits of cloud
  - Explore the cloud migration and modernization journey and common migration and modernization scenarios
  - Learn about migration and modernization tools and programs
  - Get best practices and how-to guidance for Azure migration and modernization
prerequisites: |
  - Basic understanding of cloud computing, Azure fundamentals and workloads being migrated and modernized
