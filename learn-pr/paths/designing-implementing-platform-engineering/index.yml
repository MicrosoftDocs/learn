title: Design and Implement Platform Engineering
prerequisites: |
  Successful learners will have prior knowledge and understanding of the following:
  -   Cloud computing concepts include understanding PaaS, SaaS, and IaaS implementations.
  -   Azure administration and Azure development with proven expertise in at least one of these areas.
  -   Intermediate to advanced DevOps concepts, including version control, Agile software development, and core software development principles. It would be helpful to have experience in an organization that delivers software.
summary: |
  This learning path provides a comprehensive guide to Design and Implement Platform Engineering within modern enterprises. It covers the foundational principles, strategic alignment with business goals, and the practical aspects of building scalable, secure, and future-proof platforms. By following this path, learners will gain the knowledge and skills needed to enhance developer productivity, ensure operational excellence, and drive continuous innovation.
