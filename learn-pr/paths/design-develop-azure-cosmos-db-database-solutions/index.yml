title: Design and develop Azure Cosmos DB database solutions
prerequisites: |
  - Experience building cloud applications with C# or Python
  - Basic familiarity with JSON and the Azure portal
summary: |
  This learning path builds the skills to design and develop applications on Azure Cosmos DB for NoSQL. You start by evaluating whether the service fits an application, creating your first account and container, and configuring the throughput and consistency settings a workload needs.

  You then connect from code: initializing the SDK with a client singleton, performing point operations and transactional batches, and writing queries whose request unit cost you can predict. With that foundation in place, you design a data model and partitioning strategy, which is the decision that most determines how an Azure Cosmos DB application scales.

  The path closes with two capabilities that AI applications depend on. You process the change feed to build event-driven integrations and keep denormalized data in sync, then select and apply the AI-assisted development tools that connect an assistant to your data and give an agent durable memory.
