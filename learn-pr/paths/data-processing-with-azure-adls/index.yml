summary: |
  In this learning path, you'll see how Azure Data Lake Storage can make processing Big Data analytical solutions more efficient and how easy it's to set up. You'll also explore how it fits into common architectures, as well as the different methods of uploading the data to the data store. You'll finally examine the myriad of security features that ensure your data is secure.
