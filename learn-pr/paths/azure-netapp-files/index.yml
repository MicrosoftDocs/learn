title: Azure NetApp Files fundamentals
summary: "Learn about the file types best suited for Azure NetApp Files, its key features, and how to optimize performance, cost, security, and data resiliency. Also learn how Azure NetApp Files can support SAP HANA and Oracle workloads." 
prerequisites: |
  - Basic knowledge of Azure products, including Azure Virtual Network and Azure Virtual Gateway.
  - Basic knowledge of networked file system protocols. Particularly, Server Message Block (SMB) and Network File System (NFS).
